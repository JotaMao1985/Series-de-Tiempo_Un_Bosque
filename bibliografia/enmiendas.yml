rcoreteam2026r:
  note:
    valor: ""
    evidencia: http://localhost:23119/api/users/0/items
    consulta: 2026-11-13
    nota: >-
      El campo Extra de Zotero quedó con «volume: 4.6.0» al importar el RIS: la
      etiqueta VL de un ítem «Programa informático» no tiene campo propio y
      Zotero la deja ahí. pandoc lee esa línea como la variable CSL `volume` y
      el estilo APA la pega al título, de modo que la lista imprimía «R: A
      Language and Environment for Statistical Computing: 4.6.0 (Versión
      4.6.0)». La versión ya viene en `version`. Lo correcto a la larga es
      vaciar el campo Extra en Zotero y borrar esta enmienda.
