# Campos que el traductor de Zotero no trajo, con la evidencia de cada uno.
# Las aplica precalculo/exporta_zotero.py. Lo correcto a la larga es llevar el
# dato a Zotero y borrar la enmienda: el guion avisa cuando una ya sobra.
shumway2017time:
  edition:
    valor: "4"
    evidencia: https://link.springer.com/book/10.1007/978-3-319-52452-8
    consulta: 2026-11-10
    nota: "La ficha de Springer dice «Edition number: 4»; Crossref no registra la edición."
brockwell2016introduction:
  edition:
    valor: "3"
    evidencia: https://link.springer.com/book/10.1007/978-3-319-29854-2
    consulta: 2026-11-10
    nota: "La ficha de Springer dice «Edition number: 3»."
cryer2008time:
  edition:
    valor: "2"
    evidencia: https://link.springer.com/book/10.1007/978-0-387-75959-3
    consulta: 2026-11-10
    nota: "La ficha de Springer dice «Edition number: 2»."
hyndman2008automatic:
  page:
    valor: "1-22"
    evidencia: https://www.jstatsoft.org/article/view/v027i03
    consulta: 2026-11-10
    nota: "Metadatos de la revista: citation_firstpage=1, citation_lastpage=22. Crossref no trae páginas."
hyndman2021forecasting:
  URL:
    valor: https://otexts.com/fpp3/
    evidencia: https://otexts.com/fpp3/
    consulta: 2026-11-10
    nota: "Texto completo en abierto. El registro por ISBN (catálogo de biblioteca) no trae la URL."
hyndman2018forecasting:
  URL:
    valor: https://otexts.com/fpp2/
    evidencia: https://otexts.com/fpp2/
    consulta: 2026-11-10
    nota: "Texto completo en abierto de la 2.ª edición."
rcoreteam2026r:
  note:
    valor: ""
    evidencia: http://localhost:23119/api/users/0/items
    consulta: 2026-11-13
    nota: >-
      El campo Extra de Zotero quedó con «volume: 4.6.0» al importar el RIS: la
      etiqueta VL de un ítem «Programa informático» no tiene campo propio y
      Zotero la deja ahí. pandoc lee esa línea como la variable CSL `volume` y
      el estilo APA la pega al título, de modo que la lista imprimía «R: A
      Language and Environment for Statistical Computing: 4.6.0 (Versión
      4.6.0)». La versión ya viene en `version`. Lo correcto a la larga es
      vaciar el campo Extra en Zotero y borrar esta enmienda.
box2016time:
  issued:
    valor:
      date-parts:
        - ["2015"]
    evidencia: https://www.wiley.com/en-us/Time+Series+Analysis%3A+Forecasting+and+Control%2C+5th+Edition-p-9781118675021
    consulta: 2026-11-16
    nota: >-
      Wiley fecha la 5.ª edición en «June 2015». El 2016 de Zotero viene del
      catálogo de la Library of Congress (registro MARC por ISBN 9781118675021,
      consultado el 2026-11-16 en lx2.loc.gov), cuyo campo 264 dice «[2016]»: entre
      corchetes, es decir, fecha que suple el catalogador y no impresa en la obra;
      el 008 muestra que el registro se creó el 2015-04-17. Decisión de Javier en el
      Checkpoint 0 (2026-11-16). La clave de cita sigue siendo box2016time porque
      una clave asignada no cambia (claves.json).
yule1927method:
  title:
    valor: "VII. On a method of investigating periodicities in disturbed series, with special reference to Wolfer's sunspot numbers"
    evidencia: https://doi.org/10.1098/rsta.1927.0007
    consulta: 2026-11-21
    nota: "La portada del artículo (p. 267, ejemplar en ejemplares.yml) dice «Periodicities in Disturbed Series»; Crossref y Zotero omiten «in»."

