    cita: "increase in distance from x and become zero"
  nota: >-
    §2.1 del artículo dice las cuatro cosas de la frase: se eligen los q valores más próximos a x, se ajusta
    un polinomio local, el valor devuelto es el del polinomio en x, y los pesos se anulan en el q-ésimo punto
    más lejano. EL MATIZ: la frase dice «les ajusta una recta por mínimos cuadrados», y el artículo dice
    polinomio de grado 1 o 2 («locally-linear or locally-quadratic») por mínimos cuadrados PONDERADOS. La
    recta es el caso que usa el capítulo, y lo de ponderados lo dice el propio capítulo tres párrafos
    después, como remate de la explicación; aquí todavía no. Por eso el verificador independiente bajó el
    veredicto de «respaldada» a «con-matiz». Historia del nombre: el capítulo desarrollaba Loess como
    «locally estimated scatterplot smoothing», que no está en ninguna fuente leída; la primera pasada de la
    R4 lo cambió aquí por «regresión local ponderada, locally weighted regression», y eso adelantaba la
    palabra que el capítulo revela después. En la corrección, esta primera mención glosa solo «una regresión
    local» y el nombre completo pasó al párrafo de «ponderada», con su propia entrada, c1-m7-23. Se retiró la
    cita de Shumway y Stoffer (pie de la figura 2.14) que el redactor había añadido: glosa lowess, que es
    otro suavizador, y en el texto en caché de ese libro la palabra «loess» no aparece.
