    El artículo nombra y define las subseries de enero, de febrero, etc. («cycle-subseries»), y el paso 2 de
    su bucle interior las suaviza por separado con Loess. La ayuda de stl() lo repite y añade que con
    s.window = "periodic" el suavizado se sustituye por la media de cada subserie; el artículo no describe
    ese caso, que es una comodidad de R. La frase del inventario («no se ajusta sobre la serie entera, sino
