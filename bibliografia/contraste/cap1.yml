    cita: "that are not of a fixed frequency"
  - clave: hyndman2021forecasting
    loc: "§2.3"
    clase: WEB
    instantanea: graphics
    cita: "usually due to economic conditions"
  - clave: cryer2008time
    loc: "p. 28; §3.1"
    clase: PDF
    pagina_pdf: 41
    cita: "Many authors use the word trend only for a slowly changing mean"
  nota: >-
    FUSIÓN DE IDENTIFICADORES: esta entrada absorbe a c1-m4-03 (estacionalidad) y c1-m4-04 (ciclo), que se
    registraron por separado y se retiraron en la corrección de la R4 por decisión de la sesión maestra: las
    tres viñetas llevaban la misma cita, idéntica, tres veces seguidas. La marca va ahora en la lista entera
    y la cita visible, una sola, al final de la viñeta de la tendencia. Las tres las contrastó el verificador
    del lote R4a, una por una, y las tres salieron «respaldada». FPP3 §2.3 define los TRES PRIMEROS
    componentes: la tendencia como aumento o descenso de largo plazo, la estacionalidad con período fijo y
    conocido, y el ciclo como subidas y bajadas sin frecuencia fija, ligadas por lo general a las condiciones
    económicas. El CUARTO, el ruido, lo define el capítulo y la cita no lo cubre, aunque la huella sí lo
    vigila por estar en la misma lista. Lo que el capítulo no recoge: que la tendencia no tiene por qué ser
    lineal y puede «cambiar de dirección», que una serie puede tener más de un patrón estacional, y que Cryer
    y Chan advierten de que el uso de la palabra tendencia varía entre autores. Cambio de prosa: la viñeta
    del ciclo decía «ciclos económicos de varios años» y tres párrafos después el capítulo dice «al menos dos
    años» citando la misma sección; la fuente solo dice «usually at least 2 years», así que a la viñeta se le
    quitó la cifra («p. ej. los ciclos económicos»). Los paréntesis de las viñetas, que la primera pasada
    había cambiado por rayas, vuelven a su forma original.
