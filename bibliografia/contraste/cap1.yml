- id: c1-m5-02
  tipo: definicion
  afirmacion: "Con m par se promedian dos ventanas consecutivas de orden m, lo que equivale a usar m + 1 valores con los dos extremos a medio peso."
  hash_texto: d4e73363c794ec7d
  veredicto: respaldada
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§3.3"
    clase: WEB
    instantanea: decomposition
    cita: "weighted moving average of order m + 1"
  nota: >-
    Por el tope de palabras citadas de FPP3 (F11) se registra una sola de las dos citas del verificador; la
    otra («The first value in the 2x4-MA column is the average of these two») respaldaba la primera mitad.
    FPP3 §3.3 sostiene las dos mitades: que la 2×m-MA es el promedio de dos ventanas consecutivas de orden m,
    y que equivale a una media ponderada de orden m + 1 con pesos 1/m salvo los extremos, que llevan 1/(2m):
    los «extremos a media ración» del capítulo.
