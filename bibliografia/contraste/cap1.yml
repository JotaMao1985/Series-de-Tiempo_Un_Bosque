    cita: "loop followed by a computation of"
  nota: >-
    La frase del inventario («Son dos bucles, uno dentro de otro: el interior alterna estacionalidad y
    tendencia hasta que se estabilizan…») ya no está: la R3 y la R3-bis la repartieron entre el paso 4 de «El
    método, paso a paso» y el párrafo del bucle exterior. Se marca el paso 4. El verificador del lote R4b dio
    «con-matiz» a la frase vieja, por el «hasta que se estabilizan» (el número de pasadas interiores es fijo,
    no un criterio de parada). EL MATIZ VIVO lo señaló el verificador independiente: la línea de uso de stl()
    dice inner = if(robust) 1 else 2, de modo que las dos pasadas son el valor por defecto SOLO con robust =
    FALSE; con la opción robusta es una pasada por cada vuelta del bucle exterior, y el capítulo enseña a
    encender esa opción dos pantallas más abajo. La frase decía «dos pasadas, por defecto», sin esa
    condición. SE CORRIGIÓ LA PROSA: «dos pasadas por defecto, con la opción robusta apagada», y la cita
    visible pasó a §Usage, que es donde está el valor. La frase nueva la escribió el redactor y la comprobó la sesión maestra
    contra la instantánea (stl.txt, línea de uso «inner = if(robust)  1 else 2»): la condición que faltaba
    está ahora escrita, así que el veredicto sube a «respaldada». El artículo respalda la estructura de dos
    bucles anidados (§2.2); la entrada «inner» de los argumentos dice que bastan muy pocas pasadas, y su
    segunda cita es la continuación de la que dio el verificador. El bucle exterior lo cubre c1-m7-02. Cita
    sustituida: «loop followed by a computation of robust-» acababa en un guion de corte de renglón; se dejó
    sin «robust-».
