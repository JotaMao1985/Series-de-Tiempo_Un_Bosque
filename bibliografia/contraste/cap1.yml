- id: c1-m4-06
  tipo: resultado
  afirmacion: "Al descomponer una serie suele agruparse tendencia y ciclo en un solo componente tendencia-ciclo, al que a menudo se llama simplemente tendencia."
  hash_texto: 2f8b0406271b3fe3
  veredicto: respaldada
  fuentes:
  - clave: hyndman2021forecasting
    loc: "cap. 3"
    clase: WEB
    instantanea: decomposition
    cita: "we usually combine the trend and cycle into a single trend-cycle component (often just called the trend for simplicity)"
  nota: >-
    Historia de la frase. El verificador del lote R4a leyó «Muchos textos agrupan tendencia y ciclo en un
    solo término tendencia-ciclo» y dio «con-matiz»: la práctica está en la entrada del cap. 3 de FPP3, pero
    ninguna fuente leída sostiene que lo hagan «muchos textos». La primera pasada de la R4 la reescribió
    atribuyéndola a los dos autores con cita narrativa, y el verificador independiente lo objetó: la fuente
    no dice que lo hagan ellos, dice que es lo habitual («we usually»), y la cita registrada recortaba justo
    esas dos palabras. La frase vigente vuelve a la voz impersonal y dice lo que dice la fuente, incluido que
    al componente se le suele llamar simplemente tendencia. La frase nueva la escribió el redactor de la R4 y la comprobó la sesión
    maestra contra la instantánea de FPP3 (decomposition.txt, entrada del cap. 3): dice lo que dice la
    fuente, en voz impersonal y con el «often just called the trend» incluido, así que el veredicto sube a
    «respaldada».
  redactado_por: subagente redactor de la ronda R4 (Fable 5.2)
  verificado_por: sesión maestra de la ronda R4, que comprobó la frase contra la instantánea el 2026-11-13
