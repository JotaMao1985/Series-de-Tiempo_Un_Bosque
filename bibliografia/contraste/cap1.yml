- id: c1-m1-01
  tipo: definicion
  afirmacion: "Una serie de tiempo es una sucesión de observaciones de una misma variable, registradas en instantes ordenados y, por lo general, equiespaciados."
  hash_texto: 347e934a47afe986
  veredicto: respaldada
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§1.4"
    clase: WEB
    instantanea: intro
    cita: "observed at regular intervals of time"
  - clave: shumway2011time
    loc: "p. 11; §1.3"
    clase: PDF
    pagina_pdf: 24
    cita: "according to the order they are obtained in time"
  - clave: shumway2011time
    loc: "p. 11; §1.3"
    clase: PDF
    pagina_pdf: 24
    cita: "sampled at equally spaced points"
  nota: >-
    Lo que las citas sostienen y lo que no. La de FPP3 §1.4 —«observed at regular intervals of time»— no es
    una definición: es una declaración de alcance del libro («In this book, we will only consider time series
    that are…»), que respalda el registro a intervalos regulares. Las dos de Shumway y Stoffer §1.3 respaldan
    la indexación por el orden temporal y el muestreo equiespaciado, pero presentan la serie como una
    colección de variables aleatorias, no como la sucesión de valores observados del capítulo. Ninguna de las
    tres cubre lo univariante («de una misma variable»): eso lo pone el capítulo. FPP3 se limita a intervalos
    regulares, y el capítulo dice «por lo general, equiespaciados». La cita visible es la de FPP3. Único
    cambio de prosa: el paréntesis final «(cada mes, cada día, cada hora)» pasó a dos puntos, para que la
    cita no quedara pegada a otro paréntesis.
  redactado_por: subagente redactor de la ronda R4 (Fable 5.2)
  verificado_por: subagente verificador de la ronda R4 (Opus 5.5), contexto limpio · lote R4a
  fecha: 2026-11-13

