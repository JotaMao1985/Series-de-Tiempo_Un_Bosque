    las dos secciones, porque §2.2 define las subseries de ciclo y es §2.3, paso 2, la que las suaviza con
    Loess. Y «el patrón queda fijo» no está en la ayuda de R, que solo dice que el suavizado se sustituye por
    la media: que con "periodic" el componente estacional es idéntico de un año a otro lo dice FPP3 §3.6, y
    se añadió esa cita, visible y literal. FPP3 habla de season(window = 'periodic') en STL() de fable, no de
