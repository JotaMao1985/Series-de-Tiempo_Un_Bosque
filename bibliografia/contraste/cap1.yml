- id: c1-m8-03
  tipo: historica
  afirmacion: "La serie desestacionalizada es lo que reportan muchas estadísticas oficiales, como las de desempleo."
  hash_texto: 585a1ce7b72c0c11
  veredicto: respaldada
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§3.2"
    clase: WEB
    instantanea: decomposition
    cita: "monthly unemployment data are usually seasonally adjusted"
  - clave: hyndman2021forecasting
    loc: "§3.5"
    clase: WEB
    instantanea: decomposition
    cita: "decomposition procedures which are used for seasonal adjustment"
  nota: >-
    El verificador del lote R4a leyó «muchas estadísticas oficiales —desempleo, producción—» y dio
    «con-matiz», porque FPP3 no dice nada de la «producción». La primera pasada de la R4 la retiró y dejó
    «las de desempleo, por ejemplo». La sesión maestra comprobó la frase vigente y subió el veredicto: FPP3
    §3.2 dice que los datos mensuales de desempleo se suelen desestacionalizar y que lo mismo ocurre con los
    de empleo «and many other economic series», y §3.5 que las oficinas de estadística tienen procedimientos
    propios de ajuste estacional; eso sostiene «muchas» y «las de desempleo». La única reserva: la fuente da
    como finalidad «highlight variation due to the underlying state of the economy», y el capítulo dice
    «comparar meses sin el vaivén estacional», que es su manera de decirlo. La retroalimentación de la
    autoevaluación del Módulo 9 decía «las cifras oficiales de empleo o PIB» (c1-m8-13 del inventario): el
    PIB tampoco está en FPP3 y se retiró en la corrección; esa frase vive en una cadena de JavaScript que el
    auditor no lee, de modo que no puede llevar marca ni entrada propia.
  redactado_por: subagente redactor de la ronda R4 (Fable 5.2)
  verificado_por: sesión maestra de la ronda R4, que comprobó la frase contra la instantánea el 2026-11-13
  fecha: 2026-11-13
