    pagina_pdf: 6
    cita: "h = 6 median(|R,|)."
  - clave: cleveland1990stl
    loc: "§2.4"
    clase: PDF
    pagina_pdf: 6
    cita: "will have a small or zero weight. Let"
  - clave: cleveland1990stl
    loc: "§2.4"
    clase: PDF
    pagina_pdf: 6
    cita: "in the data that results in a very large |R,|"
  nota: >-
    El artículo da las tres piezas de la frase: el nombre («bisquare weight function»), la unidad de medida
    —h es seis veces la mediana de los residuos absolutos— y el corte, porque un atípico con residuo grande
    recibe un peso pequeño o nulo. La fórmula del capítulo coincide con la ecuación impresa, que el OCR
    destroza y el verificador leyó sobre la imagen: B(u) = (1 − u²)² para 0 ≤ u < 1 y 0 para u > 1. En las
    citas, «|R,|» es como el OCR dejó |R_v|.
