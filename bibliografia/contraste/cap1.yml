# Registro de contraste · Capítulo 1 · Componentes y descomposición
#
# Cada entrada une una afirmación del capítulo (el elemento con ese
# `data-afirma`) con el pasaje LEÍDO que la respalda. La `cita` es literal y
# `precalculo/audita_citas.py` la busca en el texto de la fuente, en la sección
# o página que dice `loc`. Quien verifica no es quien redactó.
#
# Estas cinco son el piloto de la ronda de gestión documental (2026-11-10). La
# verificación la hicieron dos subagentes de contexto limpio, uno con Opus 5.5
# y otro con Sonnet 5.5, que recibieron la afirmación y el texto de la fuente,
# no el veredicto esperado. Coincidieron en las cinco; donde uno fue más
# estricto (c1-m6-01) se registra el veredicto estricto.
#
# Ronda R4 «fuentes» (2026-11-13): 28 afirmaciones de prioridad alta del
# inventario (cap1_inventario.tsv), contrastadas por dos verificadores de
# contexto limpio —lote R4a: FPP3, Cryer y Chan, Shumway y Stoffer, Hamilton;
# lote R4b: Cleveland et al. (1990) y la ayuda de R—. El redactor de la R4 marcó
# el HTML, comprobó cada cita con grep contra la caché y escribió estas entradas;
# donde ajustó la prosa, la nota lo dice y el veredicto NO se sube: lo confirma
# el verificador posterior. Las ayudas de R se registran como instantáneas
# (clase WEB) y su localizador es la sección de la página: «§Details», «§Usage».
# Las citas de FPP3 son tramos más cortos de los que dio el verificador: hubo
# que recortarlas para no pasar del tope de 400 palabras citadas por obra (F11).
# Corrección de la R4 (mismo día), tras la verificación independiente: c1-m4-02
# absorbe a c1-m4-03 y c1-m4-04 (la lista de componentes es una sola afirmación),
# nace c1-m7-23 (el nombre completo de Loess) y suben c1-m1-04 y c1-m8-03, que
# comprobó la sesión maestra; baja c1-m7-05. Cada nota cuenta su historia.
capitulo: 1
