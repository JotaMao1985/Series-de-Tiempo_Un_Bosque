- id: c1-m3-08
  tipo: regla
  afirmacion: "El abanico que se abre en el gráfico estacional es la señal de un modelo multiplicativo."
  hash_texto: fba13dffc31eb224
  veredicto: con-matiz
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§3.2"
    clase: WEB
    instantanea: decomposition
    cita: "then a multiplicative decomposition is more appropriate"
  nota: >-
    FPP3 §3.2 respalda la conclusión —si la variación estacional es proporcional al nivel, el modelo es
    multiplicativo—, pero no la regla de lectura del gráfico estacional: §2.4 describe gg_season sin hablar
    de líneas paralelas ni de un abanico. Traducir el criterio a esa imagen es aportación del capítulo, que
    no la atribuye a nadie. Por eso la marca empieza en «Esa forma es la señal de un modelo multiplicativo»:
    la oración anterior, la que enseña a leer el abanico, queda fuera de la huella y la cita visible ya no la
    respalda a la vista. El matiz que queda es que «esa forma» remite a una imagen que la fuente no describe.
    No se tocó la prosa.
