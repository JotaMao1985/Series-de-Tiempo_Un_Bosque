  nota: >-
    Estaba «pendiente» desde el piloto. El capítulo escribía «Seasonal-Trend decomposition using Loess», y el
    verificador, ya con el artículo original leído, confirmó que ninguna fuente escribe esa cadena: mezclaba
    el guion del título original con el «using Loess» de FPP3. Qué dice cada una: el artículo de Cleveland et
    al. (1990) nunca desarrolla el acrónimo en prosa, solo en su título; FPP3 §3.6 dice «STL is an acronym for
    “Seasonal and Trend decomposition using Loess”»; y la ayuda de stl() habla de descomponer «using 'loess',
    acronym STL». SE CORRIGIÓ LA PROSA: el capítulo copia ahora la forma de FPP3, que es la única fuente que
    desarrolla el acrónimo en una frase, y la cita. Lo del título del artículo, que era el matiz de esta
    entrada, ya no vive aquí: la verificación independiente de la R4 pidió decirlo en el capítulo, porque la
    lista de fuentes del módulo imprime ese título a dos pantallas de la forma de FPP3, y la sesión maestra lo
    sacó a frase propia con su propia entrada, c1-m7-24. Sin ese matiz la frase marcada dice exactamente lo
    que dice su fuente: la sesión maestra la comprobó contra la instantánea y subió el veredicto a
    «respaldada». Sobre el rango de páginas que el piloto dejó abierto: la portada del PDF dice pp. 3–73, que
    incluye los comentarios publicados; FPP3 cita 3–33, solo el artículo.
  redactado_por: subagente redactor de la ronda R4 (Fable 5.2)
  verificado_por: sesión maestra de la ronda R4, que comprobó la frase contra la instantánea el 2026-11-13
