- id: c4-m10-04
  tipo: resultado
  afirmacion: "Con θ̂ cercano a −1 el factor MA (1 + θ̂B) se parece a (1 − B) y casi deshace la diferencia aplicada a la serie: es la anomalía del Módulo 1."
  hash_texto: "fdf09a0cfc0b9fdd"
  veredicto: propia
  nota: >-
    Se deduce en el material: el polinomio MA 1 + θB con θ → −1 tiende a 1 − B, que cancela el ∇ del lado
    izquierdo; con θ̂ = −0.874 su raíz es 1/0.874 = 1.144, cerca del círculo. Cryer y Chan (pp. 126–127)
    muestran el caso exacto (sobrediferenciar crea una raíz MA exactamente en 1) pero no hablan del caso
    aproximado: la frase del capítulo es lectura propia de esa idea. Cifras de R reproducidas (θ̂ = −0.8741,
    |raíz MA| = 1.144, |raíz AR| = 3.93). Comprobación:
    diagnostico/cap4/comprobaciones/r4_software/lectorE/comprobaciones_E.R (sección 10): arima(Nile, c(1,1,1),
    method='ML') da phi 0.2544, theta −0.8741; |raíz MA| 1.144, |raíz AR| 3.93.
