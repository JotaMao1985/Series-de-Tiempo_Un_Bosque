    loc: "p. 126"
    clase: PDF
    pagina_pdf: 137
    cita_sha256: "2179c7afe7aeafa9d65dc520215c95c22212b9c335bc959081a4ff596f303129"
    cita_palabras: 10
  nota: >-
    Cryer y Chan (pp. 126–127) muestran que sobrediferenciar un ruido blanco da un MA(1) con θ = 1 (convenio de
    resta), un modelo no invertible con la raíz «prohibida» en B = 1, y Hamilton (p. 49) da ρ1 = −0.5 como el
    mínimo de un MA(1) con θ = −1 (convenio del capítulo). Que valores estimados cerca de 1 y de −0.5 sean
    indicios (y que fallen en los dos sentidos) es la lectura del capítulo, con el Módulo 2.7; el mismo Módulo
    2.7 dice que es un indicio y no una regla.
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
