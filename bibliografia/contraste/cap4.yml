    cita_palabras: 9
  nota: >-
    Hamilton (p. 516) dice que, con θ cercano a −1 en (1 − L)y = (1 + θL)ε, el contraste de Phillips–Perron
    rechaza en muestras finitas aunque la raíz unitaria sea cierta (Schwert: T = 1 000 y θ = −0.8, rechazo en
    prácticamente todas las muestras). Eso respalda la mitad PP. Que el ADF no reaccione igual lo muestra la
    simulación del propio capítulo (c4-m3-15: 51.3 % frente a 100 %); Hamilton no dice nada del ADF con un MA
    fuerte. Hamilton usa T = 1 000 y θ = −0.8; el capítulo, n = 100 y θ̂ ≈ −0.87.
