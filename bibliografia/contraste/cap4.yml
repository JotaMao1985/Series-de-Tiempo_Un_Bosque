- id: c4-m3-60
  tipo: resultado
  afirmacion: "La varianza de la serie diferenciada apenas baja de d = 0 a d = 1 y casi se triplica con d = 2, pero no decide d: en una serie estacionaria el cociente Var(∇y)/Var(y) se acerca a 2(1 − r1), así que repite lo que ya dice r1, y r1 solo no dice si hay raíz unitaria."
  hash_texto: "15085f2ea76772ce"
  veredicto: propia
  nota: >-
    Se deduce en el material: Var(y_t − y_{t−1}) = 2γ0 − 2γ1 = 2γ0(1 − ρ1), de modo que el cociente de varianzas
    es 2(1 − ρ1) y su análogo muestral 2(1 − r1) (es el c2-m7-08 del Capítulo 2, propia). Las cifras salen de R
    (precalculo/genera_cap4.R, nilo.varianzas y el bloque del módulo): 28 637.95 → 28 268.34 (−1.29 %) → 80
    055.01 (×2.83); r1 = 0.4984, 2(1 − r1) = 1.003, cociente 0.987. Ninguna de las fuentes leídas (Cryer y Chan
    §5.2 y §6.4; FPP3 §9.1; Hyndman y Khandakar 2008, p. 10) propone el mínimo de la varianza como criterio para
    elegir d, de modo que el párrafo no atribuye nada a nadie. Comprobación:
    diagnostico/cap4/comprobaciones/r4_software/lectorB/software_B_r.out: imprime var(diff(Nile, differences =
    d)) para d = 0..3 (28637.95, 28268.34, 80055.01, 262507.29), r1 = 0.4984, 2(1 − r1) = 1.003 y el cociente
    0.987 [R 4.6.0].
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 4 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-23"
  fecha: 2026-11-22

