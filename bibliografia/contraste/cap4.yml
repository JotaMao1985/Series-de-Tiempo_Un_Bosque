- id: c4-m9-24
  tipo: regla
  afirmacion: "Las estimaciones de un ARIMA suelen seguir siendo razonables aunque los errores no sean normales, mientras que los intervalos de pronóstico se apoyan en esa normalidad."
  hash_texto: "0fb9a38c0db2d67f"
