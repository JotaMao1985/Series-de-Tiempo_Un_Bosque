    cita_sha256: "b91b806780953b2c7dfd5ccd9bc34b3fe6ba33a9235cbb775126dfb1dac1c7ae"
    cita_palabras: 4
  - clave: shumway2011time
    loc: "p. 145"
    clase: PDF
    pagina_pdf: 158
    cita_sha256: "7fa1384ae5498654b04d7c83ff085bb26c6942c0725d3cac9a7e27a6dc17320b"
    cita_palabras: 13
  - clave: cryer2008time
    loc: "p. 187"
    clase: PDF
    pagina_pdf: 197
    cita_sha256: "300ef1d047e758a82188716d7e751865908ac508ec9f1659e7b1b573096e174a"
    cita_palabras: 13
  nota: >-
    Cryer y Chan (nota de pie de la p. 127) escriben que, si el modelo correcto es φ(B)(1−B)Y = θ(B)e,
    diferenciar de más lleva a φ(B)(1−B)²Y = θ(B)(1−B)e = θ'(B)e, con la raíz «prohibida» de θ'(B) en B = 1. Las
    fuentes dicen que sobrediferenciar CREA esa raíz; que «el modelo la introduce para compensar» es la lectura
    del capítulo del ajuste (el bloque de código del módulo da θ̂ = −1.000 con d = 2 y d = 3), no una frase de
    las fuentes. Shumway y Stoffer (3.ª ed., p. 145) solo se registra como fuente adicional (advierten de no
    sobrediferenciar porque introduce dependencia donde no la hay). Cryer y Chan (§8.2, p. 187), también
    adicional, explican que un factor común en los polinomios AR y MA se cancela y deja los parámetros sin
    identificar: es el mismo mecanismo con el factor (1 − B).
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
