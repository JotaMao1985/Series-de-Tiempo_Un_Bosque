    loc: "§5.5"
    clase: WEB
    instantanea: toolbox
    cita_sha256: "ecfb315fe356d1f236edbc67880ef6332e0d60530ae9252e203ba05daf368eaf"
    cita_palabras: 17
  nota: >-
    Hamilton (p. 117) dice que los estimadores de máxima verosimilitud basados en ruido gaussiano suelen
    resultar razonables también en procesos no gaussianos, y (p. 126, caso AR) que son consistentes, pero que
    los errores estándar calculados bajo esa suposición pueden no ser correctos. FPP3 §9.8 dice que los
    intervalos de un ARIMA se basan en residuales incorrelados y normales (y §5.5 propone el bootstrap cuando la
    normalidad no es razonable). Con-matiz porque Hamilton lo muestra para el AR y de forma general solo con
    «suelen»; la frase vieja decía «no necesitan».
