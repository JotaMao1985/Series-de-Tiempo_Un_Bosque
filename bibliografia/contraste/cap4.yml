- id: c4-m8-03
  tipo: resultado
  afirmacion: "Diferenciar de más introduce una raíz unitaria en la parte de medias móviles: el factor (1 − B) aparece en el polinomio MA y el modelo ajustado lo lleva al borde para cancelar la diferencia sobrante."
  hash_texto: "90b3fa7733cdc134"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
    loc: "p. 127"
    clase: PDF
    pagina_pdf: 138
    cita_sha256: "d070a04df057825b370f0f1088887cdb1eb85685a833a4924624512dfd632e18"
    cita_palabras: 14
  - clave: cryer2008time
    loc: "p. 126"
    clase: PDF
