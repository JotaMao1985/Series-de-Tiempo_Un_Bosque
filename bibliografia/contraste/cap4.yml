- id: c4-m10-71
  tipo: dato
  afirmacion: "arima() de stats devuelve el estimador de máxima verosimilitud de σ² (que divide entre n*), y Arima() de forecast devuelve ese estimador con ajuste de sesgo (que divide entre n* − p − q); por eso los σ² de ambas funciones difieren."
  hash_texto: "cf1026001a24830f"
  veredicto: con-matiz
  fuentes:
  - clave: hyndman2026forecast
    loc: "§Value"
    clase: DOC
    instantanea: Arima
    cita_sha256: "7dff0f53bba96bff26ae128155147db0c7d4410c09c13152619d03fb47a2d985"
    cita_palabras: 8
  - clave: rcoreteam2026r
    loc: "§Value"
    clase: DOC
    instantanea: arima
    cita_sha256: "9844f2a9b916f0c98a15954542d5f9511acaaf54a6060bb7b0e1ddc36c03633e"
    cita_palabras: 6
  nota: >-
    Las dos ayudas respaldan la idea: arima() devuelve «el MLE» de la varianza de las innovaciones y Arima() «el
    MLE ajustado por sesgo». Los divisores concretos (n* frente a n* − p − q, 99 y 97 en el Nilo) no están en
    ninguna ayuda: se comprobaron ejecutando. Arima(method = 'ML') da el mismo σ² que Arima() por defecto
    (20176.92 y 20176.91), así que la diferencia no es CSS-ML frente a ML; la razón entre ambas funciones es
    1.02062 = 99/97, y la suma de cuadrados de los residuales de Arima() dividida entre n* − p − q reproduce su
    σ² (20176.9149). Comprobación: diagnostico/cap4/comprobaciones/r4_software/lectorF/sigma2_y_lince.R (salida
    en sigma2_y_lince.out, sección 1): R 4.6.0, forecast 9.0.2; Nile ARIMA(1,1,1): arima ML 19769.29, Arima
    20176.91, Arima(method='ML') 20176.92, razón 1.02062 = n*/(n* − p − q); el código de Arima() calcula sigma2
    como suma de cuadrados entre (nstar − npar + 1). El texto actual de la pista ya dice esto (la R1/R3 corrigió
    la explicación CSS-ML que describía el diagnóstico).
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 4 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-23"
  fecha: 2026-11-22

