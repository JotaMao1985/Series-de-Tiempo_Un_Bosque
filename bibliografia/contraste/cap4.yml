  nota: >-
    Matiz de cifra y de forma: el artículo (p. 11) rechaza el modelo si alguna raíz de φ(B)Φ(B) o θ(B)Θ(B) tiene
    módulo menor que 1.001, y también si hay errores en la rutina de optimización no lineal (que el capítulo
    resume como «no convergen»); no dice que el criterio valga ∞. El código instalado de forecast 9.0.2 usa
    módulo < 1 + 0.01 (1.01) y asigna ic = Inf, sin ningún 1.001, y la ayuda de auto.arima dice que hay
    variaciones menores respecto del artículo: el 1.01 es propia comprobada ejecutando. Ambos umbrales descartan
    el ARIMA(2,1,2) del Nilo: su menor raíz AR con CSS-ML es 1.000937 (y 1.000875 con deriva), menor que 1.001 y
    que 1.01. Comprobación: diagnostico/cap4/comprobaciones/r4_software/lectorC/c_codigo_forecast.R ->
    c_codigo_forecast.out (línea «if (minroot < 1 + 0.01 || checkarima(fit))», fit$ic <- Inf) y c_comprueba.R
    (sección [m7-09, m7-10]) -> c_comprueba.out: «aparece 1.001 en myarima: FALSE»; raíces AR 1.000937 y
    1.000875. [R 4.6.0, forecast 9.0.2]
