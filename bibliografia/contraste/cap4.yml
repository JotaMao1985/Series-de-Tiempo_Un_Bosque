  nota: >-
    Misma afirmación que c2-m7-08 (propia): Var(∇y) = 2γ0 − 2γ1 y, en una muestra de una serie estacionaria, el
    cociente es aproximadamente 2(1 − r1). Se comprobó: Nilo 0.987 frente a 2(1 − 0.498) = 1.003; log(lynx)
    0.416 frente a 0.430. Que r1 solo no distinga una raíz unitaria es argumento propio (un r1 alto aparece
    también en series estacionarias persistentes). Sustituye a c4-m8-07 y c4-m8-08 (retiradas por la R1).
    Comprobación: diagnostico/cap4/comprobaciones/r4_software/lectorD/lectorD_comprobaciones.R, secciones
