- id: c4-m10-67
  tipo: resultado
  afirmacion: "En una serie estacionaria la varianza de la primera diferencia es 2(1 − ρ1) veces la de la serie, así que baja al diferenciar cuando r1 es alto sin que haya raíz unitaria."
  hash_texto: "64d3e57db0ab1fcb"
  veredicto: propia
  nota: >-
    Se deduce en el material: Var(y_t − y_{t−1}) = 2γ0 − 2γ1 = 2(1 − ρ1)Var(y) para una serie estacionaria; es
