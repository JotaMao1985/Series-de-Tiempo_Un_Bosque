- id: c4-m6-02
  tipo: definicion
  afirmacion: "AIC = −2 log L + 2k, AICc = AIC + 2k(k+1)/(n*−k−1) y BIC = −2 log L + k log n*, con k igual a p más q más uno (los coeficientes ARMA más σ²; uno más si hay constante o deriva) y n* = n − d el número efectivo de observaciones."
  hash_texto: "d637f357ae96d3bf"
  veredicto: con-matiz
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§9.6"
    clase: WEB
    instantanea: arima
    cita_sha256: "41751493c652ead2b86bc11733454e86404d9ea51141e9549b3e617ce923d1f6"
    cita_palabras: 20
  - clave: cryer2008time
    loc: "p. 130"
    clase: PDF
    pagina_pdf: 141
    cita_sha256: "df45555bbf8af71eca7f0e4049a6c46e32055e674f20c6a734feeb2548d2a636"
    cita_palabras: 17
  - clave: cryer2008time
    loc: "p. 131"
    clase: PDF
    pagina_pdf: 142
    cita_sha256: "59c185449b598199ca07002b8bbfc04b01e79a0c702f83903a98ea3f9fed1848"
    cita_palabras: 22
  - clave: rcoreteam2026r
    loc: "§Value"
    clase: DOC
    instantanea: arima
    cita_sha256: "6d33c97c8bfb87b0faf6fd058b19884279354152726ddb2c0699cf56b6955119"
    cita_palabras: 8
  nota: >-
    Matiz en n*. Con k incluyendo σ², las tres fórmulas coinciden con las de FPP3 §9.6 (AICc = AIC +
    2K(K+1)/(T−K−1), BIC = AIC + [log T − 2]K, con K = p + q + k + 1, k = 1 si hay constante) y con las de Cryer
    y Chan (p. 130 y 131), que cuentan k sin σ² (su AICc lleva (k+1)(k+2)/(n−k−2)): son equivalentes. Pero FPP3
    escribe T sin decir que se descuente d, y Cryer y Chan hablan de un tamaño muestral «efectivo» sin dar n −
    d. Que n* = n − d es lo que calcula forecast::Arima (nstar <- n − d − D·m) y lo que devuelve nobs de
    stats::arima (99 con d = 1, 98 con d = 2; la ayuda lo describe como las observaciones usadas) se comprobó
    ejecutando; el AICc a mano con n* = 99 reproduce el de Arima (1267.5074), no el calculado con n = 100
    (1267.5048). La marca abarca el bloque de fórmulas y el párrafo que define k y n*. Comprobación:
    diagnostico/cap4/comprobaciones/r4_software/lectorC/c_comprueba.R (sección [m6-02..04]) -> c_comprueba.out:
    cuerpo de Arima (nstar <- n - arma[6] - arma[7]*arma[5]), aicc 1267.5074 = a mano con n* = 99, bic = a mano
    con log 99; stats::arima nobs = 99 y 98. c_bic.py: el bic de statsmodels usa nobs_effective. [R 4.6.0,
    forecast 9.0.2, statsmodels 0.14.6]
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 4 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-23"
  fecha: 2026-11-22

