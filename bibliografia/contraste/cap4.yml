- id: c4-m10-124
  tipo: resultado
  afirmacion: "Cubrir con la parte MA no estacional los rezagos 12 y 24 exigiría un MA de orden al menos 24, es decir, 24 parámetros."
  hash_texto: "29570212c96e13bd"
  veredicto: propia
  nota: >-
    Se deduce de que la ACF de un MA(q) se corta tras el rezago q (FPP3 §9.5: «un pico significativo en el
    rezago q de la ACF, pero ninguno más allá»): para tener autocorrelación en el rezago 24 hace falta q ≥ 24, y
    un MA(24) trae 24 coeficientes. El capítulo advierte además que no se ajustó un modelo de ese orden.
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
