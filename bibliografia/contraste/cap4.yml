- id: c4-m3-07
  tipo: definicion
  afirmacion: "El ADF controla la correlación serial añadiendo rezagos de la serie diferenciada a la regresión; la prueba de Phillips–Perron mantiene la regresión de primer orden y ajusta sus estadísticos por la correlación serial."
