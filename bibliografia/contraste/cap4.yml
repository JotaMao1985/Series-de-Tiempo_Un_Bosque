- id: c4-m3-20
  tipo: resultado
  afirmacion: "Si la serie tiene una raíz unitaria, los residuales de la regresión sobre una constante se comportan como una caminata, las sumas parciales crecen como t^(3/2) y el estadístico KPSS diverge."
  hash_texto: "5d360a2ee07fc8b3"
  veredicto: propia
  nota: >-
    Derivación del capítulo (e_t ≈ caminata ⇒ S_t ~ t^(3/2) ⇒ Σ S_t² ~ n⁴). Comprobado por simulación con
    caminatas aleatorias: max|S_t| / n^(3/2) vale 0.141, 0.145 y 0.139 con n = 100, 400 y 1 600, y el KPSS medio
    sube de 1.14 a 3.63 y 9.38 (ℓ = ⌊4(n/100)^(1/4)⌋). Que la varianza de una caminata crece con t es c2-m5-04
    (Cryer y Chan, p. 13; Hamilton, p. 443). Comprobación:
    diagnostico/cap4/comprobaciones/r4_software/lectorB/kpss_formula.R → kpss_formula.out (secciones «Bajo raíz
