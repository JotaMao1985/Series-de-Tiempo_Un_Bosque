- id: c4-m10-37
  tipo: resultado
  afirmacion: "Con autocorrelación positiva de los cambios mensuales, la varianza de los cambios a h meses supera hσ²: en la TRM es entre 1.07 y 1.14 veces hσ̂², lo que explica una parte del déficit de cobertura pero no todo."
  hash_texto: "4d415d7edb3e877d"
  veredicto: propia
  nota: >-
    Deducción del propio material más cifras de R. La varianza de la suma de h cambios es σ²[h + 2Σ(h−k)ρ_k];
    con solo ρ1 = 0.088 la razón con hσ² sería 1.117, 1.146 y 1.161 (h = 3, 6, 12), del orden de lo medido
    (1.10, 1.14, 1.07). Con una varianza 1.07 a 1.14 veces mayor, la cobertura de un intervalo normal nominal
    del 95 % bajaría a 94.2 %–93.4 %, de modo que explica 1 o 2 puntos del déficit (91.3 % en la muestra a doce
    meses, 89.6 % fuera de ella según el Capítulo 6): «no tanto como para explicar todo el déficit». Las cifras
    1.07–1.14 SÍ reproducen: el bloque de la TRM las imprime (1.10, 1.14, 1.07). Comprobación:
    diagnostico/cap4/comprobaciones/r4_software/lectorE/bloque_trm_R.out (última línea: 1.10 1.14 1.07) y
    comprobaciones_E.R (sección 8): razón medida 1.097, 1.144, 1.069; con solo ρ1: 1.117, 1.146, 1.161;
    cobertura normal con varianza 1.07 y 1.14 veces mayor: 0.9419 y 0.9336.
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 4 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-23"
