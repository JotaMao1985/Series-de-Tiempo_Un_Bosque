  afirmacion: "En el experimento, KPSS rechaza la estacionariedad tanto con una raíz unitaria como con un cambio de nivel: en los dos casos las sumas parciales se disparan; rechazar no equivale a «hay raíz unitaria»."
  hash_texto: "3a2de420e97abe16"
