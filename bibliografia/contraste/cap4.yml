    pagina_pdf: 158
    cita_sha256: "708a3476aa72c4fc94ba7cf93d85c58a3f6874f78ee34e3ff76293665e6faacd"
    cita_palabras: 10
  nota: >-
    Cryer y Chan (pp. 92–93) muestran la factorización (1 − φ1 x − … − φp x^p)(1 − x) para d = 1, con la raíz en
    x = 1 y las demás raíces las del ARMA estacionario de la diferencia; Shumway y Stoffer 3.ª (p. 145, solo en
    el registro) escriben el polinomio φ(z)(1 − z)^d para un d general. El grado p + d y las d raíces en 1 son
    la repetición del factor (1 − B).
