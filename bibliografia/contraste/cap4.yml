- id: c4-m1-65
  tipo: resultado
  afirmacion: "Un ARIMA es un ARMA al que se le imponen d raíces unitarias en vez de estimarlas: d se fija y solo se estiman los φ y los θ."
  hash_texto: "1bdab37c8e6ffff6"
  veredicto: propia
  nota: >-
    Lectura del capítulo sobre la definición de c4-m1-05: el orden d no es un parámetro que se estime junto con
    φ y θ, sino que se fija de antemano y deja el factor (1 − B)^d con sus raíces en B = 1. Ninguna fuente la
    formula así; se deduce de la definición.
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 4 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-23"
  fecha: 2026-11-22

