- id: c4-m3-61
  tipo: regla
  afirmacion: "Sobrediferenciar crea un MA no invertible, con una raíz sobre el círculo unitario, y una autocorrelación de orden 1 de −0.5 en la serie diferenciada; por eso una raíz MA cerca de 1 en el modelo ajustado o un r1 cerca de −0.5 son indicios de haber diferenciado de más, pero solo indicios."
  hash_texto: "5cbf9a33dbe1c271"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
    loc: "p. 127"
    clase: PDF
    pagina_pdf: 138
    cita_sha256: "d070a04df057825b370f0f1088887cdb1eb85685a833a4924624512dfd632e18"
    cita_palabras: 14
