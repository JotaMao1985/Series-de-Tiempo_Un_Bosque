  veredicto: propia
  nota: >-
    Deducción del Módulo 9: para (1 − B)(1 − φB) y_t = (1 + θB) ε_t, ψ(B) = (1+θB)/((1−B)(1−φB)) y el límite de
    ψ_j es el residuo en B = 1, (1+θ)/(1−φ). Se reprodujo con φ̂ = 0.2544 y θ̂ = −0.8741: ψ_j → 0.1688 (j = 400)
    y σ_30/σ_1 = 1.404 frente a √30 = 5.477 (5.477/1.404 = 3.9, «casi cuatro veces menos»). La fila c4-m10-06
    (la celda que decía que el intervalo se abre más despacio que el de una caminata) se absorbe aquí.
