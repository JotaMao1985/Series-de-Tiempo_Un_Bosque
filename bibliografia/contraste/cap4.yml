- id: c4-m1-05
  tipo: resultado
  afirmacion: "El polinomio autorregresivo completo del ARIMA es φ(B)(1−B)^d, de grado p+d, con d raíces exactamente sobre el círculo unitario (en B = 1)."
  hash_texto: "046d923eabd83a80"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
    loc: "p. 93"
    clase: PDF
    pagina_pdf: 105
    cita_sha256: "f5d5ff137d775f48329b69dd41e2034c027ec6a5e7e2e28403e023cb9241adda"
    cita_palabras: 13
