- id: c4-m3-19
  tipo: definicion
  afirmacion: "El estadístico KPSS es la suma de los cuadrados de las sumas parciales S_t de los residuales de regresar la serie contra una constante, dividida por n² por la estimación σ̂²_LP de la varianza de largo plazo."
  hash_texto: "59af50cc71c23e0a"
  veredicto: propia
  nota: >-
    Comprobado ejecutando: con e_t = y_t − ȳ, S_t = Σ e_i y σ̂²_LP de Newey–West con pesos 1 − j/(ℓ+1), Σ S_t² /
    (n² σ̂²_LP) reproduce el estadístico de tseries::kpss.test sobre el Nilo (0.9654349078 con ℓ = 4 y
    0.5497197024 con ℓ = 12, diferencia ≤ 2e-16). Kwiatkowski et al. (1992) no tiene texto en la biblioteca y la
    ayuda de kpss.test no escribe el estadístico, así que no hay cita; la fórmula es la que reproduce la salida
    del programa. Comprobación: diagnostico/cap4/comprobaciones/r4_software/lectorB/kpss_formula.R →
    kpss_formula.out [R 4.6.0, tseries 0.10.62].
  redactado_por: subagente redactor de la ronda R4 del capítulo 4 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 4 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-23"
  fecha: 2026-11-22

