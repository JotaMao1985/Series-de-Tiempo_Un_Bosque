- id: c4-m3-14
  tipo: resultado
  afirmacion: "Con un MA fuerte y negativo, cercano a −1, el contraste de Phillips–Perron tiende a rechazar la raíz unitaria aunque sea cierta; el capítulo añade que el ADF reacciona de otra manera."
  hash_texto: "37ddd366db8f0c10"
  veredicto: con-matiz
  fuentes:
  - clave: hamilton1994time
    loc: "p. 516"
    clase: PDF
    pagina_pdf: 531
