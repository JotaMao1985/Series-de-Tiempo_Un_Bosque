- id: c4-m3-29
  tipo: dato
  afirmacion: "Sobre el Nilo, tseries::kpss.test da 0.9654 (truncamiento 4), statsmodels.kpss con nlags='auto' (5 rezagos) da 0.8691 y con nlags='legacy' (12 rezagos) da 0.5497."
  hash_texto: "e16de71272e894c2"
  veredicto: propia
  nota: >-
    Comprobado ejecutando (statsmodels 0.14.6, tseries 0.10.62): kpss.test(Nile) da 0.9654 con parámetro de
    truncamiento 4 (lshort = TRUE: trunc(4(n/100)^0.25), como dice la ayuda) y 0.5497 con lshort = FALSE (12);
    statsmodels.kpss da 0.8691 con 'auto' (5 rezagos usados) y 0.5497 con 'legacy' (12), y 0.9654 con nlags = 4.
