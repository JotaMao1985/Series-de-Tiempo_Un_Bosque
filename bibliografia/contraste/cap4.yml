- id: c4-m10-122
  tipo: resultado
  afirmacion: "En el ARIMA(1,1,1) del Nilo los pesos ψ_j tienden a ψ_∞ = (1+θ)/(1−φ) = 0.1688, de modo que a horizontes largos σ_h crece como σψ_∞√h, mucho más despacio que en la caminata aleatoria."
