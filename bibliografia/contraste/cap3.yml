- id: c3-m9-01
  tipo: dato
  afirmacion: "Los números de manchas solares son índices construidos a partir de conteos de manchas y de grupos de manchas, no conteos puros."
  hash_texto: "9479b0e06479d5ef"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
