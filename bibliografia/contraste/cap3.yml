  nota: >-
    FPP3 §5.6 lo dice para transformaciones en general (el intervalo se calcula en la escala transformada y se
    retrotransforman los extremos; la cobertura se conserva, aunque el intervalo deja de ser simétrico). Que el
    cuadrado sea creciente sobre valores no negativos es el argumento del capítulo. La salvedad del límite
    inferior negativo (truncar en cero antes de elevar) es del capítulo y sale del bloque R.
