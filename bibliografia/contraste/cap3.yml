  afirmacion: "Un ARMA(p,q) combina un AR(p) y un MA(q): φ(B)yt = c + θ(B)εt; es estacionario si las raíces de φ(B) están fuera del círculo unitario e invertible si lo están las de θ(B), cada polinomio por lo suyo."
  hash_texto: "b1bc08839e9740d6"
