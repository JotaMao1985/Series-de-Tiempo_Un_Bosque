- id: c3-m7-13
  tipo: resultado
  afirmacion: "Con muestras cortas el estimador de Yule–Walker queda sesgado hacia el interior de la región estacionaria."
  hash_texto: "7a9ed85b94f933eb"
  veredicto: propia
  nota: >-
    Ninguna obra leída del curso lo afirma en general. Se comprobó por simulación con los mismos coeficientes de
    las manchas: AR(2) con φ = (1.4059, −0.7111) y T = 100, 2000 réplicas, la media de Yule–Walker queda en
    (1.341, −0.663) y el módulo medio de las raíces en 1.235 frente a 1.186 (más lejos de la frontera); ML queda
    en (1.389, −0.704), con sesgo menor. Con φ = 0.95 y T = 100 en un AR(1), la media de Yule–Walker es 0.89.
    Shumway y Stoffer 3.ª (ejemplo 3.35, p. 138) obtienen 0.89 en el mismo caso (con innovaciones no normales);
    solo consta en el registro. Comprobación: Rscript: set.seed(11); phi <- c(1.4059, -0.7111); 2000 réplicas de
    arima.sim(list(ar=phi), n=100); ar(y, order.max=2, aic=FALSE, method="yule-walker")$ar y arima(y,
    order=c(2,0,0), method="ML") -> media YW (1.3414, -0.6629), media ML (1.3892, -0.7041); módulo medio de raíz
    YW 1.2351, ML 1.1965, verdadero 1.1859; 71.5 % de las réplicas con módulo YW > verdadero. AR(1) con φ=.95,
    T=100, set.seed(111), 2000 réplicas: media YW 0.89. [R 4.6.0]
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

