- id: c3-m3-12
  tipo: resultado
  afirmacion: "En un MA(q) el máximo de ρ1 es cos(π/(q+2)): 0.5 con q = 1, 0.707 con q = 2 y 0.809 con q = 3."
  hash_texto: "56c6436028b22a91"
  veredicto: propia
  nota: >-
    Ninguna obra en la caché la trae (Cryer, Hamilton y Shumway solo dan el caso q = 1). Se deduce así: con θ0 =
    1, ρ1 = (Σ θjθ(j+1))/(Σ θj²) = xᵀAx/xᵀx, con x = (1, θ1,…,θq) y A la matriz tridiagonal (q+1)×(q+1) con 1/2
    fuera de la diagonal; su mayor valor propio es cos(π/(q+2)) y el vector propio asociado tiene todas sus
    componentes del mismo signo, de modo que se puede normalizar a θ0 = 1. El capítulo no escribe esta deducción
    ni la comprueba en sus bloques de código: o se añade (una línea con eigen() en R y numpy en Python) o se
    deja como propia no mostrada. Comprobación: python3 (scipy 1.15.3, numpy 2.2.6): maximiza ρ1 sobre θ ∈ R^q
    con 40 arranques aleatorios y lo compara con cos(π/(q+2)) y con el mayor valor propio de A: q=1 0.5/0.5/0.5;
    q=2 0.707107; q=3 0.809017; q=4 0.866025; q=5 0.900969; q=6 0.92388, idénticos los tres. En R: cos(pi/4) =
    0.707, cos(pi/5) = 0.809.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 3 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

