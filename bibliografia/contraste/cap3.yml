  nota: >-
    Se reescribe «es literalmente un AR con una capa oculta»: un AR no tiene capa oculta; lo que dice FPP3 es
    que la red autorregresiva con una capa oculta usa los rezagos como entradas, y que sin neuronas ocultas
    equivale a un AR(p) sin las restricciones de estacionariedad. «Redes neuronales autorregresivas» es el
    nombre de la subsección y NNETAR es la función que ajusta el modelo.
