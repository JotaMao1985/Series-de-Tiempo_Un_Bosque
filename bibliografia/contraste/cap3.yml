- id: c3-m9-18
  tipo: definicion
  afirmacion: "El log-retorno multiplicado por 100 es el rendimiento continuo de las finanzas expresado como variación porcentual, lectura que es una buena aproximación mientras la variación sea pequeña."
  hash_texto: "ce23b6b3f1b43e4d"
  veredicto: respaldada
  fuentes:
  - clave: cryer2008time
    loc: "p. 278"
    clase: PDF
    pagina_pdf: 288
    cita_sha256: "f99866e46b1f5322359cd470bdee2d3816905bd06fdaafdb54044fffc82a82e8"
    cita_palabras: 15
  - clave: cryer2008time
    loc: "p. 99"
    clase: PDF
    pagina_pdf: 111
    cita_sha256: "2c70e4aa337ba2efc9ae756fbab10d2253093a58ef13d99a37574819397a322c"
    cita_palabras: 13
  nota: >-
    Decía «es la variación porcentual mensual». Cryer y Chan (§12.1, p. 278) definen el rendimiento (con
    capitalización continua) como la diferencia de logaritmos y dicen que a veces se multiplica por 100 para
    leerlo como variación porcentual; en §5.4 (p. 99) dicen que log(1+X) ≈ X solo si X es pequeño (ellos lo
    ilustran con |X| < 0.2) y que en la literatura financiera las diferencias de logaritmos se llaman
    rendimientos. La cifra de Cryer y Chan no se copia a la prosa. Es el mismo resultado que sale del bloque R
    (ret = diff(log(trm)) * 100).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

