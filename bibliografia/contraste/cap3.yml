  afirmacion: "Una ACF muestral no reproduce en detalle la teórica: con una muestra corta, un proceso que sí corresponde a una fila de la tabla puede dar un correlograma que no encaja."
  hash_texto: "0e74a6cf3196a41a"
  veredicto: respaldada
  fuentes:
  - clave: cryer2008time
    loc: "p. 112"
    clase: PDF
    pagina_pdf: 123
    cita_sha256: "4b7e5b92df7b75febffe76462633bb0a798e509a0774dd3edadeb5b0c9ba740f"
    cita_palabras: 15
  nota: >-
    Cryer y Chan (p. 112) advierten que no se debe esperar que la autocorrelación muestral imite a la verdadera
    en detalle ni sorprenderse de ver 'ondulaciones' o 'tendencias' en rk sin contrapartida en ρk. La referencia
    a la longitud de la muestra viene del simulador del propio capítulo (banda ±1.96/√T con T = 60 y T = 1000,
    cifras 0.253 y 0.062 verificadas).
