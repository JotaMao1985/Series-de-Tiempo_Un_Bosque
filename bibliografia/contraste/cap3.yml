- id: c3-m8-11
  tipo: resultado
  afirmacion: "Bajo ruido blanco la varianza de la autocorrelación muestral r̂k es aproximadamente (T − k)/(T(T + 2)), menor que 1/T y decreciente en k."
  hash_texto: "5f4aa36ecb204b4c"
  veredicto: propia
  nota: >-
    Ninguna obra leída da la fórmula de la varianza exacta (Ljung y Box, 1978, no tiene texto en la caché). Se
    comprobó por simulación: con T = 50 y 100 000 series de ruido blanco normal, la varianza muestral de rk para
    k = 1, 2, 5, 10, 20 coincide con (T − k)/(T(T + 2)) y no con 1/T. La definición de rk (numerador de n − k
    productos, denominador de n cuadrados) es la de Cryer y Chan (§6.1). Comprobación: Rscript: set.seed(5); Tn
    <- 50; ks <- c(1,2,5,10,20); R <- replicate(100000, {x <- rnorm(Tn); acf(x, lag.max=20,
    plot=FALSE)$acf[-1][ks]}); apply(R, 1, var) -> 0.01887 0.01840 0.01733 0.01530 0.01165; (Tn-ks)/(Tn*(Tn+2))
    -> 0.01885 0.01846 0.01731 0.01538 0.01154; 1/Tn = 0.02. [R 4.6.0]
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
