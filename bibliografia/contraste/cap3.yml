- id: c3-m9-50
  tipo: resultado
  afirmacion: "Las variaciones de un promedio mensual de 21 valores diarios de una caminata aleatoria pura tienen autocorrelación de primer orden de unos 0.25 (0.249)."
  hash_texto: "f746108cda58f1b0"
  veredicto: propia
  nota: >-
    Derivación del propio material, sin atribución a ningún autor: la diferencia de dos promedios contiguos de m
    valores de una caminata es una suma de 2m−1 choques diarios con pesos triangulares c_k = (1, 2, …, m, m−1,
    …, 1)/m; su autocorrelación de primer orden es la suma de c_k c_{k+m} dividida por la suma de c_k², que
    tiene la forma cerrada (m²−1)/(2(2m²+1)) = 0.2492 para m = 21 y tiende a 1/4 cuando m crece. El bloque R del
    capítulo calcula lo mismo con los pesos (rho1_inducido = 0.249; distancia_ee = 1.683). Comprobada además por
    simulación (ver `software`). La cifra depende poco de m: 0.2491 con 20 valores y 0.2496 con 30.
    Comprobación: diagnostico/cap3/comprobaciones/r1_errores.R (sección E6b) y su salida r1_errores.out: forma
    cerrada y suma de pesos coinciden (m = 2: 0.1667; 5: 0.2353; 20: 0.2491; 21: 0.2492; 30: 0.2496); simulación
    de 2000 caminatas de 138 meses de 21 días: media de r_1 = 0.237. r3_cifras.out y v3_cifras.out repiten
    0.2492 y la simulación 0.254; distancia al r_1 observado (0.105): 1.68 errores estándar de 1/sqrt(137).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

