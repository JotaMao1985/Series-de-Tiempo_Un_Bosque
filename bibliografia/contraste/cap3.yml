- id: c3-m8-18
  tipo: dato
  afirmacion: "R devuelve en residuals() las innovaciones de arima() divididas entre la raíz de γ0/σ² en el primer residual (y análogamente el segundo), y statsmodels las devuelve sin estandarizar; del tercero en adelante coinciden."
  hash_texto: "6f6b94711a0727b1"
  veredicto: propia
  nota: >-
    La ayuda de R solo dice que residuals son «las innovaciones ajustadas», sin decir que estén estandarizadas;
    la explicación se comprobó ejecutando R y statsmodels sobre el AR(2) de las manchas 1770–1869 (ver
    software). Para el segundo residual el cociente es √(1 − ρ1²)·√(γ0/σ²) = 1.422 y coincide con el observado.
    Comprobación: R: residuals(arima(manchas, order=c(2,0,0), method='ML'))[1:4] -> 21.056 -6.911 8.728 -15.396;
    gamma0/sigma2 = 1/(1 - sum(phi*ARMAacf(ar=phi, lag.max=2)[2:3])) = 6.226, raiz 2.495. statsmodels 0.14.6:
    ARIMA(m, order=(2,0,0), trend='c').fit().resid[:4] -> 52.536 -9.829 8.727 -15.397; 52.536/sqrt(6.226) =
    21.055. Cocientes: 52.536/21.056 = 2.495 (primero); 9.829/6.911 = 1.422 (segundo, = sqrt(2.0228) con 2.0228
    = 6.226*(1 - rho1^2), rho1 = 1.4059/(1+0.7111) = 0.8216). Del tercero en adelante coinciden.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
