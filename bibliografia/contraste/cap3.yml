    El capítulo lo muestra con un solo ejemplo por lenguaje (una semilla), que se reejecutó y coincide con lo
    impreso. 'Errores estándar enormes' es la expresión del capítulo: en R son 0.23 y 0.25 para coeficientes
    cuyos verdaderos valores son 0.5 y −0.45; en Python, 1.53. Ninguna obra en la caché describe la
    verosimilitud casi plana de una redundancia aproximada. Comprobación: Rscript (R 4.6.0): set.seed(11); y <-
    arima.sim(n = 200, list(ar = 0.5, ma = -0.45)); arima(y, order = c(1,0,1)) -> ar1 0.8300 (ee 0.2307), ma1
    -0.7953 (ee 0.2477), intercept 0.0137 (0.0806), aviso 'possible convergence problem: optim gave code = 1';
    suma de los dos coeficientes 0.0347; AICc arma11 554.3463, ar1 552.9939, ruido 550.9449. Python (statsmodels
    0.14.6, default_rng(11)): ar.L1 -0.0798 (std err 1.534), ma.L1 0.1254 (1.531), suma 0.0457.
