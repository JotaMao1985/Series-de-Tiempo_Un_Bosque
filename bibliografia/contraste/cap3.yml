- id: c3-m10-35
  tipo: resultado
  afirmacion: "El diagnóstico de Ljung–Box del AR(2) a √manchas falla en todas las ventanas de cien años que llegan al siglo XX; no lo explica el tamaño de la muestra, sino el tramo (52 de 190 ventanas pasan)."
  hash_texto: "2011c8705b08e319"
  veredicto: propia
  nota: >-
    Cifras de R (verificadas en la R1 y recalculadas en esta ronda). El razonamiento (si la potencia explicara
    el cambio, la ventana de 89 años no rechazaría; lo que cambia es el tramo) es del capítulo. Las cuatro
    menciones de «la ventana de Yule» pasan a «la ventana 1770–1869»: leído Yule (1927, p. 275), usó la serie de
    Wolfer entera, de 1749 a 1924, no esa ventana. Comprobación: R (verificado en esta sesión): ini <-
    1700:1889; p <- sapply(ini, function(a){ x <- sqrt(window(sunspot.year, a, a+99)); f <- arima(x,
    order=c(2,0,0), method='ML'); Box.test(residuals(f), lag=12, type='Ljung-Box', fitdf=2)$p.value });
    sum(p>=0.05) da 52, sum(p<0.05) da 138, sum(p<0.05 & ini+99<1900) da 49; range(ini[p>=0.05]) da 1700 y 1785
    y el único inicio fuera de 1734–1785 es 1700. Es el mismo cálculo de
    diagnostico/cap3/comprobaciones/maestra_r1.R (salida en maestra_r1.out). Las ventanas que llegan a 1900 o
    después rechazan las 89.
