- id: c3-m2-17
  tipo: resultado
  afirmacion: "Los tres factores del denominador de la varianza del AR(2) son las tres desigualdades del triángulo; el triángulo es el conjunto de parámetros con solución causal de varianza finita."
  hash_texto: "195523e2fa4ea409"
  veredicto: propia
  nota: >-
    Se deduce de la fórmula de gamma_0 (ver c3-m2-16) y de la condición de c3-m2-10: (1-phi_2)^2 - phi_1^2 =
    (1-phi_1-phi_2)(1+phi_1-phi_2), y los factores 1+phi_2, 1-phi_1-phi_2 y 1+phi_1-phi_2 son positivos
    exactamente dentro del triángulo y se anulan uno por uno sobre cada lado. Un verificador lo repite a mano y
    con R (campo software). La frase corregida en la R1 («existe un proceso de varianza finita que depende solo
    de los choques pasados») es correcta. Comprobación: Rscript (R 4.6.0): g0 <- function(p1,p2)
    (1-p2)/((1+p2)*((1-p2)^2 - p1^2)); g0(0.5,0.3) -> 2.2436; g0(0,2) -> -0.3333 (fuera del triángulo, no es una
    varianza). Factores (1+p2, 1-p1-p2, 1+p1-p2): (0.5,0.3) -> 1.3, 0.2, 1.2 (raíces > 1: TRUE); (0.9,0.1) ->
    1.1, -0.000, 1.8 (sobre el lado phi_1+phi_2=1; raíces > 1: FALSE); (-0.5,0.4) -> 1.4, 1.1, 0.1 (cerca del
    lado phi_2-phi_1=1, raíces > 1: TRUE).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 3 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

