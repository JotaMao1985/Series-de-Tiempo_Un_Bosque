    cita_sha256: "5c499dd82a758b8fa29b02fe6e0e745ff3542b0836143ed919ee2e23e20a0466"
    cita_palabras: 12
  nota: >-
    Decía «son conteos». Cryer y Chan (p. 392, serie americana de 1945 a 2007) describen el número de manchas
    como un promedio ponderado de la actividad medida en una red de observatorios y, históricamente, como una
    suma ponderada de conteos de manchas y de grupos; la ayuda de sunspot.year lo da redondeado a un decimal, es
    decir, no entero. La serie del capítulo es sunspot.year (1770-1869), no la de Cryer y Chan, y la ayuda de R
    no describe cómo se construye el índice: de ahí el matiz (la descripción de Cryer y Chan es la del número de
    manchas en general, no de esa serie). La frase siguiente («es de esperar que su variabilidad crezca con el
    nivel») es una hipótesis que el capítulo comprueba y queda fuera de la marca.
