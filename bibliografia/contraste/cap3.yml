- id: c3-m8-01
  tipo: definicion
  afirmacion: "AIC = −2 log L + 2k; AICc = AIC + 2k(k+1)/(T−k−1); BIC = −2 log L + k log T, con k el número de parámetros incluido σ²."
  hash_texto: "3c660b13aa5df382"
  veredicto: respaldada
  fuentes:
  - clave: hyndman2021forecasting
    loc: "§9.6"
    clase: WEB
    instantanea: arima
    cita_sha256: "bb59d4b9ec35419be1860f98ef960d32c8e4fd3d8913fe86f7e8ea0b994d6b8e"
    cita_palabras: 13
  - clave: cryer2008time
    loc: "p. 130"
    clase: PDF
    pagina_pdf: 141
    cita_sha256: "57b651409ff75cfd8a018f195494250e03d15cfbb66c587d5fafd82d62791e98"
    cita_palabras: 9
  - clave: cryer2008time
    loc: "p. 131"
    clase: PDF
    pagina_pdf: 142
    cita_sha256: "8822c7cd8ed08957b72ace1cc320ff153f86e9d45e16daa1e865dcc26b891cd0"
    cita_palabras: 8
  nota: >-
    FPP3 aclara que el último término entre paréntesis (el número de parámetros del modelo) incluye σ², la
    varianza de los residuales. Con k incluyendo σ², las tres fórmulas coinciden con las de FPP3 §9.6 (AICc =
    AIC + 2K(K+1)/(T − K − 1), BIC = AIC + [log T − 2]K, con K = p + q + k + 1). Cryer y Chan las dan con k sin
    σ² (su AICc usa k + 1 y k + 2, p. 131): son equivalentes. El capítulo no nombra a Akaike, Schwarz ni Hurvich
    y Tsai.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
