- id: c3-m5-30
  tipo: dato
  afirmacion: "Sin bartlett_confint=False, plot_acf de statsmodels dibuja la banda de Bartlett: no supone ruido blanco y se ensancha con el rezago porque la varianza de cada r_k suma las autocorrelaciones de los rezagos anteriores."
  hash_texto: "de77163e84743303"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
    loc: "p. 112"
    clase: PDF
    pagina_pdf: 123
    cita_sha256: "f45be1aa4d88fabb99a24a1ef2d1b198fa968ef9b17fe11b540e2472fe009229"
    cita_palabras: 23
  - clave: cryer2008time
    loc: "p. 112"
    clase: PDF
    pagina_pdf: 123
    cita_sha256: "39c6fbf36502ce10be86246083eb0488ba14ea4ce5c1153b8ae3217b15a90f32"
    cita_palabras: 24
  nota: >-
    La fórmula de la que viene es la de Cryer y Chan (ec. 6.1.11, p. 112): bajo un MA(q), Var(rk) ≈ (1/n)(1 + 2
    Σ_{j=1..q} ρj²) para k > q, y proponen sustituir las ρ por las r y comparar rk con ±2 errores estándar para
    contrastar que la serie es un MA(q). Lo que hace statsmodels difiere en el límite de la suma: usa la r
    muestral y suma hasta k−1 (contrasta MA(k−1) en cada rezago). Comprobado ejecutando; la documentación de
    statsmodels no está en la caché. Con ±1.96/√T (el argumento bartlett_confint=False) se identifica con la
    banda de ruido blanco, como FPP3 §2.9; Cryer y Chan recomiendan para el corte de un MA la banda de Bartlett.
    Comprobación ejecutada: python3 (statsmodels 0.14.6): inspect.signature(plot_acf) trae bartlett_confint=True
    por defecto; el código de statsmodels.tsa.stattools.acf hace varacf = ones/nobs; varacf[1] = 1/nobs;
    varacf[2:] *= 1 + 2*cumsum(acf[1:-1]**2); con bartlett_confint=False, varacf = 1/len(x). Ejecutado con un
    MA(1) (theta 0.7, n = 400, semilla 3): r_1..r_6 = 0.447 -0.025 -0.031 -0.015 0.013 0.013; semiancho de la
    banda 0.098 (lag 1), 0.116 (lags 2-6) = 1.96*sqrt((1 + 2*sum r_j^2, j<k)/n) a mano; con
    bartlett_confint=False, 0.098 en todos los rezagos.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 3 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

