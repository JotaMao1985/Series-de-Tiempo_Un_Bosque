- id: c3-m6-05
  tipo: resultado
  afirmacion: "Sin calentamiento, una serie que arranca en cero tiene al principio menos varianza que en régimen estacionario; con φ = 0.95 la diferencia es grande en t = 5 y el arranque comprimido dura decenas de observaciones."
  hash_texto: "d1cf6f52cdf2dc5c"
  veredicto: propia
  nota: >-
    Se deduce en el material: con y_0 = 0, Var(y_t) = σ²(1 − φ^(2t))/(1 − φ²). Con φ = 0.95 da 4.116 en t = 5 y
    10.256 en régimen estacionario (los 4.1 y 10.3 de la frase). La varianza alcanza el 90 % de la estacionaria
    hacia t = 23, lo que justifica «decenas de observaciones». Comprobación: Rscript -e 'phi <- .95;
    print(c((1-phi^10)/(1-phi^2), 1/(1-phi^2))); print(which((1-phi^(2*(1:100))) >= .9)[1])' -> 4.116 10.256 y
    23 [R 4.6.0]
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente A de la R4 del capítulo 3 (subagente, M1–M6), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

