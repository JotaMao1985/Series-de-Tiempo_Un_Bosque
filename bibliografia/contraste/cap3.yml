- id: c3-m9-41
  tipo: resultado
  afirmacion: "Si la desviación estándar de cada bloque crece como el nivel elevado a b, la potencia que estabiliza la varianza es λ = 1 − b (con b = 0.5, la raíz cuadrada)."
  hash_texto: "913e8ed5526c7573"
  veredicto: propia
  nota: >-
    Aproximación delta del propio material: si s_i es aproximadamente k por (media_i elevada a b), la desviación
    de y elevada a λ es aproximadamente |λ| por media_i^(λ−1) por s_i, que es proporcional a media_i^(λ−1+b); es
    constante si y solo si λ = 1 − b. El caso b = 1 (λ = 0, logaritmo) es el de Cryer y Chan, p. 98 (c3-m9-02).
    Para b = 0.5, Cryer y Chan (p. 101) solo dicen que la raíz cuadrada (λ = 1/2) es útil con datos de tipo
    Poisson; no la enlazan con b. FPP3 §3.1 dice que una transformación puede ser útil si la variación cambia
    con el nivel de la serie, pero no da la regla. Comprobada por simulación (ver `software`). Comprobación:
    Rscript diagnostico/cap3/comprobaciones/r4_software.R (bloque «lambda_b») (set.seed(2026)): series con
    desviación proporcional a media^b, b = 0.5, 0.75 y 1. La elasticidad de la serie original resulta 0.505,
    0.755 y 0.995; tras aplicar y^(1−b) (λ = 0.50, 0.25 y 0: el logaritmo en el último caso), la pendiente de
    log(desviación) frente a log(nivel original) es 0.005, 0.005 y −0.005, es decir, nula.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
