- id: c3-m9-45
  tipo: resultado
  afirmacion: "El periodo de la fórmula de FPP3 coincide con el periodo del máximo de la densidad espectral del AR(2), y se acerca al del ángulo de la raíz cuando el módulo de la raíz tiende a 1."
  hash_texto: "5f9d46444ca3be05"
  veredicto: propia
  nota: >-
    Derivación: Cryer y Chan (§13.5, p. 336) dan la densidad del AR(2), S(f) = σ²/(1 + φ1² + φ2² −
    2φ1(1−φ2)cos(2πf) − 2φ2 cos(4πf)). Derivando el denominador respecto de x = 2πf se obtiene sen x (2φ1(1−φ2)
    + 8φ2 cos x) = 0, de modo que el máximo interior está en cos x = −φ1(1−φ2)/(4φ2), que es el argumento de la
    fórmula de FPP3 §9.5. Con φ1 = 1.4027 y φ2 = −0.6853 el periodo es 11.8366 por optimización numérica y
    11.8364 por la fórmula. Cuando R = 1/|raíz| tiende a 1, cos x → cos ω (porque −φ1(1−φ2)/(4φ2) = cos ω (1 +
    R²)/(2R)), y los dos periodos se juntan. Cryer y Chan (p. 337) solo dicen que la forma de la densidad del
    AR(2) depende de la desigualdad φ1(1−φ2) < 4φ2; no localizan el máximo, y por eso no es cita visible.
    Comprobación: Rscript diagnostico/cap3/comprobaciones/r4_software.R (bloque «espectro»): con phi = (1.4027,
    −0.6853), periodo del máximo de |1 − φ1 e^{−iw} − φ2 e^{−2iw}|^−2 = 11.8366; fórmula de FPP3 = 11.8364;
    periodo del ángulo = 11.2185. Con el ángulo fijo en 0.5601 y R = 0.828, 0.95, 0.99 y 0.999 el periodo del
    pico es 11.8362, 11.2602, 11.2197 y 11.2182 (periodo del ángulo: 11.2180).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

