- id: c3-m9-23
  tipo: regla
  afirmacion: "Si los log-retornos son ruido blanco, el mejor pronóstico de la variación del mes siguiente es una constante: la media histórica, o cero si la media no se distingue de cero."
  hash_texto: "c0124da03f97e764"
  veredicto: propia
  nota: >-
    Deducción del propio material: para un ruido blanco con media μ el pronóstico de error cuadrático mínimo es
    μ, y su estimación es la media muestral. FPP3 §5.2 llama «método de la media» a pronosticar con el promedio
    histórico, pero no dice que sea el mejor para un ruido blanco (por eso no es cita). La prosa recoge el caso
    del capítulo: el AICc prefiere el ruido blanco sin media, cuyo pronóstico es 0.
