    admite. Comprobación: Rscript (R 4.6.0) con set.seed(1); y <- arima.sim(n = 500, list(ma = 2)): arima(y,
    c(0,0,1)) da ma1 = 0.4794 (sigma2 = 4.0818) con CSS-ML, ML y CSS (0.4797), con transform.pars TRUE o FALSE;
    arima(..., method = 'ML', transform.pars = FALSE, init = c(2, 0)) devuelve ma1 = 2.0861 (sigma2 = 0.9380),
