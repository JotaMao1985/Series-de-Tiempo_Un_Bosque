- id: c3-m10-28
  tipo: resultado
  afirmacion: "Un ARMA(2,2) con φ = (1.1, −0.28) y θ = (0.1, −0.20) tiene la misma ACF que el ARMA(1,1) con φ = 0.7 y θ = 0.5: el factor (1 − 0.4B) está en los dos polinomios y se cancela."
  hash_texto: "e49c0c459f964953"
  veredicto: respaldada
  fuentes:
  - clave: hamilton1994time
    loc: "p. 61"
    clase: PDF
    pagina_pdf: 76
    cita_sha256: "66023fa440e3585a1dc75b9d22578ddca505cc1ba5ecd043e6d66516ab64c050"
    cita_palabras: 13
  nota: >-
    Hamilton p. 61: si los operadores AR y MA tienen una raíz en común, el proceso estacionario es idéntico a un
    ARMA(p−1, q−1); dos procesos idénticos tienen la misma ACF. Los polinomios se factorizan como 1 − 1.1B +
    0.28B² = (1 − 0.7B)(1 − 0.4B) y 1 + 0.1B − 0.20B² = (1 + 0.5B)(1 − 0.4B). Comprobado en R (polyroot da las
    raíces 1/0.7 y 2.5 en el AR y 2.5 y −2 en el MA; max(abs(ARMAacf(ar = c(1.1, -0.28), ma = c(0.1, -0.20),
    lag.max = 15) - ARMAacf(ar = 0.7, ma = 0.5, lag.max = 15))) = 1.1e-16, es decir, coinciden hasta el redondeo
    de la máquina).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

- id: c3-m10-91
  tipo: resultado
  afirmacion: "Con un factor común entre los polinomios AR y MA, los coeficientes del modelo grande no son identificables; el daño recae en la estimación, no en el criterio de información."
  hash_texto: "113bef70f6fab839"
  veredicto: respaldada
  fuentes:
