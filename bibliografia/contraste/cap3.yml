  afirmacion: "Cuando dos factores casi se cancelan, el ajuste de un ARMA(1,1) da coeficientes muy distintos de los verdaderos con errores estándar grandes y, a veces, un aviso del optimizador, mientras que la suma φ̂ + θ̂ sí reproduce la cancelación."
