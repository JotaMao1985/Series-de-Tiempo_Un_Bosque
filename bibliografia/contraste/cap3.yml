    cita_sha256: "7a0aacdd359eae3685334cbbaa5e2d0a9884ca153ac7ba997e1e902945f9a957"
    cita_palabras: 14
  nota: >-
    Cryer y Chan, §8.2 (p. 187), muestran con un ARMA(2,3) que, si los polinomios AR y MA comparten el factor (1
    − cx), la constante c es arbitraria y los parámetros no son únicos. En el ARMA(2,2) del capítulo, (φ1, φ2,
    θ1, θ2) = (0.7 + λ, −0.7λ, 0.5 − λ, −0.5λ) describe el mismo proceso para cualquier λ, de modo que los
    cuatro dependen de λ. La marca se acota a la no identificabilidad; los errores estándar «pueden dispararse»
    y «es posible» que ninguno salga significativo son hipótesis condicionales que la fuente no cubre (la
    simulación propia las confirma en cuatro de cinco semillas y no en una).
