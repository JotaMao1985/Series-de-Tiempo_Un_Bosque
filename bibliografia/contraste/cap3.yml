- id: c3-m9-15
  tipo: resultado
  afirmacion: "Una serie de manchas solares que sube más rápido de lo que baja es temporalmente irreversible, lo que sugiere un proceso no lineal que un ARMA gaussiano no puede reproducir."
  hash_texto: "325aa8805673b144"
  veredicto: con-matiz
  fuentes:
  - clave: cryer2008time
    loc: "p. 392"
    clase: PDF
    pagina_pdf: 402
    cita_sha256: "0801a0efe06437f5164ce08ce28fb6ddead8cbcccae895b7551620b02b5fc822"
    cita_palabras: 18
  - clave: cryer2008time
    loc: "p. 396"
    clase: PDF
    pagina_pdf: 406
    cita_sha256: "dbf43d30eab014c1115317f455251da9c497d0b067f3d6e10dfb5493bd8e5e89"
    cita_palabras: 19
  - clave: cryer2008time
    loc: "p. 396"
    clase: PDF
    pagina_pdf: 406
    cita_sha256: "65d955a6bfeae423d88b33839a1f456fd33aadfd457f7d854ec3cabaa1d3c895"
    cita_palabras: 15
  nota: >-
    Cryer y Chan (§15.2, p. 392) observan que la serie de manchas americana de 1945 a 2007 sube más deprisa de
    lo que baja y la llaman temporalmente irreversible; en §15.3 (p. 396) explican que un ARMA gaussiano
    estacionario es reversible (sus momentos de primer y segundo orden no cambian al invertir el tiempo) y que
    la irreversibilidad de las manchas sugiere un proceso subyacente no lineal. Difiere el alcance: la serie de
    Cryer y Chan no es la ventana 1770-1869 del capítulo, y ellos hablan de errores normales (en p. 384 precisan
    que su afirmación vale cuando los errores son normales), por lo que «ningún modelo lineal ARMA» se acota a
    «un modelo ARMA con errores normales». «Asimetría» designa aquí la de subida y bajada, no la asimetría
    (sesgo) de los residuales de la frase anterior.
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
  verificado_por: "verificador independiente B de la R4 del capítulo 3 (subagente, M7–M10), leyó el pasaje en la caché el 2026-11-21"
  fecha: 2026-11-21

