- id: c3-m9-43
  tipo: definicion
  afirmacion: "El criterio de Guerrero busca que el cociente entre la desviación y el nivel elevado a 1 − λ sea homogéneo entre bloques."
  hash_texto: "895f9ce173e0d4f2"
  veredicto: pendiente
  nota: >-
    La descripción coincide con el código de forecast::BoxCox.lambda(method = "guerrero") (función interna
    guer.cv: coeficiente de variación de sd/media^(1−λ) entre bloques; ver `software`), pero eso describe la
    implementación, no el artículo. Detalle que conviene saber: para una serie anual sin frecuencia, forecast
    forma los bloques de 2 observaciones (nonseasonal.length = 2), no de 5, 10 u 11 años como la tabla de la
    elasticidad. Comprobación: Rscript diagnostico/cap3/comprobaciones/r4_software.R (bloque «guerrero»):
