    cita_palabras: 12
  nota: >-
    Cryer y Chan (p. 8) presentan la estrategia de tres pasos (especificación o identificación, ajuste,
    diagnóstico), que 'puede usarse varias veces', y la atribuyen a Box y Jenkins (1976); FPP3 §9.7 da un
    procedimiento de siete pasos con el mismo bucle (si los residuales no parecen ruido blanco, probar un modelo
    modificado). El capítulo no atribuye el ciclo a nadie; los cuatro pasos (leer la ACF, leer la PACF, proponer
    (p,q), comprobar) son suyos. Las frases de cada paso del ciclo quedan aparte (c3-m5-05 a c3-m5-10).
