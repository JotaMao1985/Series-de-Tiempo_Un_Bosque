    cita_palabras: 17
  nota: >-
    Cryer y Chan (§4.3) dicen que con raíces complejas la ACF es una onda seno amortiguada con factor de
    amortiguamiento R y frecuencia Θ, y que los pesos ψ tienen los mismos R y Θ. Los define con los recíprocos
