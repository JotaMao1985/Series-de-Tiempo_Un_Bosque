    minimiza el AICc. Comprobación: Rscript diagnostico/cap3/comprobaciones/r4_software.R (bloque «auto»)
    (forecast 9.0.2, serie ret de los 137 log-retornos del CSV de la TRM): formals(auto.arima)$ic =
    c("aicc","aic","bic") (el primero, por defecto); formals(auto.arima)$stepwise = TRUE; auto.arima(ret) ->
