    fórmula del capítulo. Matiz de nombre: «pseudo-periodo» es el término de Shumway y Stoffer (ver c3-m2-08).
    FPP3 §9.5 da otra fórmula para el periodo medio de los ciclos, 2π/arccos(-phi_1(1-phi_2)/(4 phi_2)), que no
    coincide con la del capítulo y no la respalda; no se cita aquí. El Módulo 9 la discute en el recuadro «Otra
    fórmula para el pseudo-periodo». Cifras: P(1.40,-0.69) = 11.052 y P(1.4027,-0.6853) = 11.219, calculadas en
    R. Comprobación: Rscript (R 4.6.0): P <- function(p1,p2) 2*pi/acos(p1/(2*sqrt(-p2))); P(1.40,-0.69) ->
    11.052; P(1.4027,-0.6853) -> 11.219; P(1.5,-0.75) -> 12 (coincide con el ejemplo de Cryer y Chan, p. 74:
    periodo 12).
  redactado_por: subagente redactor de la ronda R4 del capítulo 3 (Fable 5.2)
