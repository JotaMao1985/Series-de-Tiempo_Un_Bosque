    acf se basa en la covarianza muestral): se comprobó ejecutando ambos programas sobre las manchas solares
    1770–1869. Comprobación: python3 -I: inspect.signature(yule_walker) -> (x, order=1, method='adjusted',
    df=None, inv=False, demean=True); docstring: «If 'mle', the denominator is n=X.shape[0], if 'adjusted' the
    denominator is n-k. The default is adjusted.». yule_walker(m - m.mean(), order=2, method='adjusted') ->
    (1.3616, -0.6719); method='mle' -> (1.3173, -0.6338). R: ar(manchas, order.max=2, aic=FALSE,
    method='yule-walker')$ar -> 1.3173 -0.6338; a mano con divisor n da 1.3173 -0.6338 y con divisor n-k 1.3616
    -0.6719; acf(type='covariance') lag 1 = sum/n = 1116.811. [statsmodels 0.14.6, R 4.6.0]
