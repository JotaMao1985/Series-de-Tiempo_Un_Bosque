  nota: >-
    Propiedad de la máxima verosimilitud en modelos anidados (el máximo sobre un espacio de parámetros mayor no
    puede ser menor). Se comprobó en los candidatos del módulo con arima(method = "ML"): AR(1) ⊂ AR(2) ⊂ AR(3) ⊂
    AR(4), ARMA(2,0) ⊂ ARMA(2,1) ⊂ ARMA(2,2), MA(1) ⊂ MA(2) ⊂ MA(3). La prosa dice ya «nunca empeora», como el
    M10. Comprobación: Rscript sobre window(sunspot.year, 1770, 1869): logLik de arima(order=c(p,0,q),
    method='ML'): (1,0) -449.039; (2,0) -414.940; (3,0) -412.940; (4,0) -411.939; (0,1) -450.941; (0,2)
    -422.570; (0,3) -417.357; (1,1) -421.041; (2,1) -412.045; (1,2) -414.936; (2,2) -411.863. Las cadenas
    anidadas no decrecen. [R 4.6.0]
