  nota: >-
    Cryer y Chan p. 8 atribuyen a Box y Jenkins la estrategia de construcción de modelos en tres pasos, y FPP3
    §9.12 el texto que popularizó el modelado ARIMA. «Completa» es del capítulo: la remisión interna es
    correcta, porque el módulo 4.2 «La metodología de Box–Jenkins» (Htmls_Series/capitulo-4-modelos-arima.html,
    línea 3004) recorre el ciclo de identificación, estimación y diagnóstico con sus vueltas atrás. Las dos
    fuentes no dicen que esa metodología sea «completa» en el sentido de este capítulo.
