  edicion_comprobada: 'Portada del PDF: «Journal of Official Statistics, Vol. 6. No. 1, 1990, pp. 3-73
    / © Statistics Sweden». Es la única edición del artículo.'
  nota: 'ESCANEO sin capa de texto: el texto viene de OCR (tesseract 5.5.2, 300 ppp), así que las fórmulas
    y los subíndices salen mal y la prosa bien casi siempre. Una cita literal correcta puede no coincidir:
    copiarla del texto extraído y preferir tramos limpios. Las pp. 3-73 incluyen los comentarios publicados
