# Ejemplares leídos: la huella de cada PDF, nunca el PDF.
# `archivo`, `sha256` y `paginas` los escribe extrae_fuente.py.
# `edicion_comprobada`, `desfase` (página del PDF − página impresa, si es
# constante), `procedencia` y `nota` se llenan a mano mirando la portada;
# el guion los respeta.
