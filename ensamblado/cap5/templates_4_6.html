# ACF teorica de un proceso estacional: se EXPANDE el polinomio y se usa
# ARMAacf, que no sabe nada de estacionalidad. m = 12.
acf_sarima &lt;- function(phi = numeric(0), Phi = 0, theta = numeric(0), Theta = 0,
                       m = 12, lag.max = 36) {
  poli_est &lt;- function(c0) { v &lt;- numeric(m + 1); v[1] &lt;- 1; v[m + 1] &lt;- c0; v }
  mult &lt;- function(a, b) {
    r &lt;- numeric(length(a) + length(b) - 1)
    for (i in seq_along(a)) for (j in seq_along(b)) r[i+j-1] &lt;- r[i+j-1] + a[i]*b[j]
    r
  }
  recorta &lt;- function(v) { nz &lt;- which(abs(v) &gt; 1e-12); if (!length(nz)) numeric(0) else v[seq_len(max(nz))] }
  ar &lt;- recorta(-mult(c(1, -phi),   poli_est(-Phi))[-1])
  ma &lt;- recorta( mult(c(1,  theta), poli_est( Theta))[-1])
  ARMAacf(ar = ar, ma = ma, lag.max = lag.max)[-1]
}

# SAR(1): picos limpios, nada entre medias
round(acf_sarima(Phi = 0.7)[c(1, 11, 12, 13, 24)], 4)
#&gt; [1] 0.0000 0.0000 0.7000 0.0000 0.4900

# AR(1) x SAR(1): aparecen los satelites en 11 y 13
round(acf_sarima(phi = 0.6, Phi = 0.7)[c(1, 11, 12, 13, 24)], 4)
#&gt; [1] 0.6016 0.4230 0.7011 0.4218 0.4908
# y en efecto 0.6016 * 0.7011 = 0.4218

# El airline estimado sobre log(AirPassengers)
round(acf_sarima(theta = -0.4018, Theta = -0.5569)[c(1, 11, 12, 13, 24)], 4)
#&gt; [1] -0.3459  0.1471 -0.4251  0.1471  0.0000</code></pre>

        <div class="code-tab-panel" data-lang="python">
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess

def acf_sarima(phi=(), Phi=0.0, theta=(), Theta=0.0, m=12, lag_max=36):
    """ACF teorica de un SARIMA sin diferencias, expandiendo el polinomio."""
    def poli_est(c0):
        v = np.zeros(m + 1); v[0] = 1.0; v[m] = c0
        return v
    ar_pol = np.polymul(np.r_[1.0, -np.asarray(phi, float)],   poli_est(-Phi))
    ma_pol = np.polymul(np.r_[1.0,  np.asarray(theta, float)], poli_est(Theta))
    # ArmaProcess espera el polinomio AR con los signos ya cambiados
    proc = ArmaProcess(ar_pol, ma_pol)
    return proc.acf(lag_max + 1)[1:]

print(np.round(acf_sarima(Phi=0.7)[[0, 10, 11, 12, 23]], 4))
#&gt; [0.  0.  0.7 0.  0.49]

print(np.round(acf_sarima(phi=[0.6], Phi=0.7)[[0, 10, 11, 12, 23]], 4))
#&gt; [0.6016 0.423  0.7011 0.4218 0.4908]

print(np.round(acf_sarima(theta=[-0.4018], Theta=-0.5569)[[0, 10, 11, 12, 23]], 4))
#&gt; [-0.3459  0.1471 -0.4251  0.1471  0.    ]

# np.polymul hace exactamente lo mismo que la funcion `mult` del bloque de R:
# la "estacionalidad" no es mas que un polinomio con ceros en medio.</code></pre>

      <h3>Por qué aparece en todas partes</h3>

      <p>No es tradición: es que la combinación describe una situación muy común. La diferencia doble
        $\nabla\nabla_{12}$ deja estacionaria a casi cualquier serie mensual con tendencia y estación, y los dos
        términos MA absorben lo que queda con el mínimo de parámetros. En este capítulo aparece <strong>dos veces, en
        series que no tienen nada que ver</strong>:</p>

            <tr><td>$\log$(AirPassengers)</td><td>$144$</td><td>Pasajeros aéreos, 1949–1960</td><td>ARIMA($0,1,1$)($0,1,1$)$_{12}$</td><td>$-0.4018$</td><td>$-0.5569$</td></tr>

        </table>

      <p>Dos series con distinta escala, distinta longitud y distinto fenómeno detrás, y no solo el mismo modelo: casi
        los mismos coeficientes. La segunda ni siquiera necesita logaritmo. Ese es el argumento para conocerlo de
        memoria: es el punto de partida razonable de casi cualquier serie mensual.</p>

            <li>
              <p>Para pronosticar hace falta la forma $\psi$: escribir $y_t$ como suma infinita de choques,
                $y_t = \sum_{j\ge 0}\psi_j\,\varepsilon_{t-j}$. Como
                $\psi(B) = \dfrac{(1+\theta B)(1+\Theta B^{12})}{(1-B)(1-B^{12})}$, los pesos salen de dividir
                polinomios.</p>
            </li>
            <li>
              <p>El resultado tiene una forma muy reconocible:</p>
              $$\psi_0 = 1, \qquad \psi_j = 1+\theta = 0.5982 \ \ (j = 1, \dots, 11)$$
              $$\psi_{12} = 1.0412, \qquad \psi_j = 0.8632 \ \ (j = 13, \dots, 23)$$
              <p>Es decir: <strong>escalones</strong>. Dentro de un año la incertidumbre crece a ritmo constante; al
                cruzar el rezago estacional pega un salto y se instala en un nivel más alto.</p>
            </li>
            <li>

        que la evidencia no separa mucho; lo que decide en favor del más simple es que los tres competidores gastan uno
        o dos parámetros más para no mejorar el diagnóstico. La última fila es el modelo sin ningún término ARMA —solo
        las dos diferencias—: sirve de referencia de cuánto aportan realmente esos dos parámetros.</p>

        <div class="code-tab-panel active" data-lang="r">
          <pre><code class="language-r">library(forecast)
ap &lt;- log(AirPassengers)

# Rejilla con d = 1 y D = 1 FIJOS: es la condicion para que el AICc compare.
res &lt;- data.frame()
for (p in 0:2) for (q in 0:2) for (P in 0:1) for (Q in 0:1) {
  f &lt;- tryCatch(Arima(ap, order = c(p,1,q),
                      seasonal = list(order = c(P,1,Q), period = 12), method = "ML"),
                error = function(e) NULL)
  if (is.null(f)) next
  res &lt;- rbind(res, data.frame(
    modelo = sprintf("(%d,1,%d)(%d,1,%d)[12]", p, q, P, Q),
    k = p+q+P+Q, nobs = f$nobs, aicc = f$aicc, bic = f$bic,
    lb = Box.test(residuals(f), lag = 24, type = "Ljung-Box",
                  fitdf = p+q+P+Q)$p.value))
}
salida &lt;- head(res[order(res$aicc), ], 4)
salida[, c("aicc", "bic", "lb")] &lt;- round(salida[, c("aicc", "bic", "lb")], 4)
salida
#&gt;                modelo k nobs      aicc       bic     lb
#&gt; 6  (0,1,1)(0,1,1)[12] 2  131 -483.2101 -474.7735 0.2330

#&gt; 8  (0,1,1)(1,1,1)[12] 3  131 -481.5957 -470.4123 0.2271
#&gt; 18 (1,1,1)(0,1,1)[12] 3  131 -481.5820 -470.3987 0.2453
unique(res$nobs)      # todos iguales: la comparacion es legitima
#&gt; [1] 131

# Diagnostico del ganador, con 2m rezagos
fit &lt;- Arima(ap, order = c(0,1,1), seasonal = list(order = c(0,1,1), period = 12))
round(Box.test(residuals(fit), lag = 24, type = "Ljung-Box", fitdf = 2)$p.value, 4)
#&gt; [1] 0.233
round(Box.test(residuals(fit), lag = 36, type = "Ljung-Box", fitdf = 2)$p.value, 4)
#&gt; [1] 0.2969
round(shapiro.test(residuals(fit))$p.value, 4)
#&gt; [1] 0.1674

# Barra por barra en los rezagos que importan
r &lt;- Acf(residuals(fit), lag.max = 36, plot = FALSE)$acf
round(c(r12 = r[13], r24 = r[25], banda = 1.96/sqrt(length(ap))), 4)

        <div class="code-tab-panel" data-lang="python">
          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm, warnings
from statsmodels.tsa.statespace.sarimax import SARIMAX
from statsmodels.stats.diagnostic import acorr_ljungbox
warnings.filterwarnings("ignore")

ap = np.log(sm.datasets.get_rdataset("AirPassengers").data["value"].values)
s = pd.Series(ap, index=pd.date_range("1949-01", periods=len(ap), freq="MS"))

# OJO: por defecto statsmodels NO diferencia la serie; mete d y D en el espacio
# de estados con un prior difuso, y entonces `nobs` sigue siendo 144 para todos
# los modelos. Sus AIC/BIC PARECEN comparables entre distintos (d, D) cuando no
# lo son. Con simple_differencing=True se comporta como R.
for sd in (False, True):
    f = SARIMAX(s, order=(0,1,1), seasonal_order=(0,1,1,12), trend="n",
                simple_differencing=sd).fit(disp=False)
    print(f"simple_differencing={sd!s:5s}  nobs={int(f.nobs):3d}  "
          f"ma1={f.params['ma.L1']:+.4f}  sma1={f.params['ma.S.L12']:+.4f}  llf={f.llf:.4f}")
#&gt; simple_differencing=False  nobs=144  ma1=-0.4019  sma1=-0.5571  llf=244.6965
#&gt; simple_differencing=True   nobs=131  ma1=-0.4018  sma1=-0.5569  llf=244.6965
# La segunda linea reproduce a R hasta el cuarto decimal.

fit = SARIMAX(s, order=(0,1,1), seasonal_order=(0,1,1,12), trend="n").fit(disp=False)
print(acorr_ljungbox(fit.resid, lags=[24], model_df=2)["lb_pvalue"].round(4).iloc[0])
#&gt; 0.2261
print(acorr_ljungbox(fit.resid[13:], lags=[24], model_df=2)["lb_pvalue"].round(4).iloc[0])
#&gt; 0.3675
# R da 0.2330. La diferencia son los primeros residuales, que statsmodels
# produce con el filtro aun inicializandose: es la misma trampa del Capitulo 3.
# Descartando los d + D*m = 13 primeros, la conclusion no cambia en ningun caso.</code></pre>
        </div>

      <div class="warning">
        <p><strong>R y Python: la diferencia es real y tiene arreglo.</strong> <code>statsmodels</code> no diferencia
          la serie: mete $d$ y $D$ dentro del espacio de estados con un prior difuso. Consecuencias medidas:
          (1) informa <code>nobs = 144</code> para todos los modelos, así que sus AIC/BIC parecen comparables entre
          distintos $(d,D)$ cuando no lo son —el Capítulo 4 encontró lo mismo con $d$—; (2) sobre
          $\log(\text{AirPassengers})$ ($n = 144$) los coeficientes casi coinciden con los de R (diferencia
          $6\times 10^{-5}$), pero sobre <code>USAccDeaths</code> ($n = 72$) $\hat\theta$ se mueve de $-0.4303$ a
          $-0.3924$. No es falta de convergencia: Python alcanza ese mismo óptimo desde varios puntos de partida, con
          varios optimizadores. Es <em>otra</em> verosimilitud. Con
          <code>simple_differencing=True</code> las dos salidas vuelven a coincidir hasta el cuarto decimal.</p>
