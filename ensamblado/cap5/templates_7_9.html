          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm, warnings
from statsmodels.tsa.statespace.sarimax import SARIMAX
warnings.filterwarnings("ignore")

ap = np.log(sm.datasets.get_rdataset("AirPassengers").data["value"].values)
s = pd.Series(ap, index=pd.date_range("1949-01", periods=len(ap), freq="MS"))

# CUIDADO: simple_differencing=True reproduce la ESTIMACION de R, pero el
# modelo pasa a operar sobre la serie ya diferenciada y get_forecast() devuelve
# entonces el pronostico de nabla nabla_12 y_t, no el de y_t:
mal = SARIMAX(s, order=(0,1,1), seasonal_order=(0,1,1,12), trend="n",
              simple_differencing=True).fit(disp=False)
print(round(float(mal.get_forecast(steps=24).predicted_mean.iloc[-1]), 4))
#&gt; 0.0     el pronostico de la serie diferenciada, no el nivel

# Para PRONOSTICAR se deja la opcion por defecto.
fit = SARIMAX(s, order=(0,1,1), seasonal_order=(0,1,1,12), trend="n").fit(disp=False)
f = fit.get_forecast(steps=24)
ci = f.conf_int(alpha=0.05)
print(np.round(np.exp([f.predicted_mean.iloc[-1], ci.iloc[-1,0], ci.iloc[-1,1]]), 2))
#&gt; [525.46 400.62 689.21]
# R da 525.46, 399.66 y 690.85: el pronostico puntual coincide y el intervalo
# es un 1 % mas estrecho, porque sigma^2 sale 0.001348 en vez de 0.001371.

# exp() del pronostico es la MEDIANA. Si se quiere la MEDIA:
sigma_h = (ci.iloc[-1,1] - f.predicted_mean.iloc[-1]) / 1.959964
print(round(float(np.exp(f.predicted_mean.iloc[-1] + sigma_h**2 / 2)), 2))
#&gt; 530.52     un 1 % por encima de la mediana</code></pre>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">5.9 Regresores de calendario y SARIMAX
          <span class="text-gray-400 font-normal text-2xl">/ Calendar regressors and SARIMAX</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Separar lo que la estacionalidad estadística no puede
              capturar —efectos del calendario que se mueven de año en año— y meterlo como regresor.</p>
          </div>

      <p>El SARIMA supone que el patrón se repite <strong>en la misma posición</strong> cada $m$ observaciones. Hay dos
        clases de efectos de calendario que rompen ese supuesto y que, por tanto, ningún $\Phi$ ni ningún $\Theta$
        pueden absorber:</p>

      <div class="diagram">
        <table>
          <thead>
            <tr><th>Efecto</th><th>Por qué el SARIMA no lo ve</th><th>Regresor</th></tr>
          </thead>
          <tbody>
            <tr><td><strong>Longitud del mes</strong></td><td>Febrero tiene $28$ o $29$ días y julio $31$: la "misma" posición del ciclo no dura lo mismo</td><td>$\log(\text{días del mes})$</td></tr>
            <tr><td><strong>Fiestas móviles</strong></td><td>La Semana Santa cae en marzo o en abril según el año</td><td>Indicadora del mes que contiene el Domingo de Pascua</td></tr>
            <tr><td><strong>Días hábiles</strong></td><td>Dos meses de $31$ días pueden tener $22$ o $23$ días laborables</td><td>Número de días hábiles</td></tr>
            <tr><td><strong>Fiestas fijas</strong></td><td>Ninguno: caen siempre en el mismo mes</td><td>No hace falta; ya está en el término estacional</td></tr>
          </tbody>
        </table>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: SARIMAX / regresión con errores SARIMA</h4>
        $$y_t = \beta' x_t + n_t, \qquad \text{donde } n_t \text{ sigue un SARIMA}(p,d,q)(P,D,Q)_m$$
        <p style="margin-bottom:0;">Es una regresión ordinaria cuyo <strong>error</strong> tiene estructura temporal, no
          un SARIMA con términos añadidos. La distinción importa al interpretar: $\beta$ mide el efecto del regresor
          <em>una vez descontada</em> la dinámica, y por eso su error estándar es mayor que el de un MCO ingenuo.
          Cuidado con el nombre: en <code>statsmodels</code>, <code>SARIMAX</code> con <code>exog</code> ajusta esto
          mismo, pero cuando $d &gt; 0$ diferencia también los regresores.</p>
      </div>

      <h3>El caso: pasajeros por mes frente a pasajeros por día</h3>

      <p>$\text{AirPassengers}$ cuenta pasajeros <strong>por mes</strong>. Entre febrero ($28$ días) y los meses de
        $31$ hay un $10.7\,\%$ de diferencia de duración, que no tiene nada que ver con volar más o menos: es
        aritmética del calendario. Si los pasajeros fueran proporcionales a los días, en logaritmos el coeficiente de
        $\log(\text{días})$ debería valer <strong>exactamente $1$</strong>. Es una hipótesis contrastable.</p>

      <div class="warning">

ap &lt;- log(AirPassengers)

# --- Regresor 1: dias del mes ----------------------------------------------
fechas &lt;- seq(as.Date("1949-01-01"), by = "month", length.out = length(ap))
dias &lt;- as.numeric(diff(c(fechas, seq(tail(fechas,1), by = "month", length.out = 2)[2])))
range(dias)
#&gt; [1] 28 31

# --- Regresor 2: Semana Santa (algoritmo de Meeus/Butcher, calendario gregoriano)
pascua &lt;- function(anio) {
  a &lt;- anio %% 19; b &lt;- anio %/% 100; cc &lt;- anio %% 100
  d &lt;- b %/% 4; e &lt;- b %% 4; f &lt;- (b + 8) %/% 25; g &lt;- (b - f + 1) %/% 3
  h &lt;- (19*a + b - d - g + 15) %% 30; i &lt;- cc %/% 4; k &lt;- cc %% 4
  l &lt;- (32 + 2*e + 2*i - h - k) %% 7; m &lt;- (a + 11*h + 22*l) %/% 451
  mes &lt;- (h + l - 7*m + 114) %/% 31; dia &lt;- ((h + l - 7*m + 114) %% 31) + 1
  as.Date(sprintf("%04d-%02d-%02d", anio, mes, dia))
}
sapply(1949:1952, function(a) format(pascua(a), "%Y-%m-%d"))
#&gt; [1] "1949-04-17" "1950-04-09" "1951-03-25" "1952-04-13"
es_pascua &lt;- as.numeric(format(fechas, "%m") ==
                        sapply(as.numeric(format(fechas, "%Y")),
                               function(a) format(pascua(a), "%m")))
sum(es_pascua)     # un mes marcado por anio

xreg &lt;- cbind(log_dias = log(dias), pascua = es_pascua)
f0 &lt;- Arima(ap, order=c(0,1,1), seasonal=list(order=c(0,1,1), period=12))
f1 &lt;- Arima(ap, order=c(0,1,1), seasonal=list(order=c(0,1,1), period=12), xreg = xreg[, 1, drop = FALSE])
f2 &lt;- Arima(ap, order=c(0,1,1), seasonal=list(order=c(0,1,1), period=12), xreg = xreg)

          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm, warnings
from statsmodels.tsa.statespace.sarimax import SARIMAX
warnings.filterwarnings("ignore")

ap = np.log(sm.datasets.get_rdataset("AirPassengers").data["value"].values)
idx = pd.date_range("1949-01", periods=len(ap), freq="MS")
s = pd.Series(ap, index=idx)

dias = idx.days_in_month.values.astype(float)
print(dias.min(), dias.max())
#&gt; 28.0 31.0

def pascua(anio):
    a, b, c = anio % 19, anio // 100, anio % 100
    d, e = b // 4, b % 4
    f, g = (b + 8) // 25, (b - ((b + 8) // 25) + 1) // 3
    h = (19*a + b - d - g + 15) % 30
    i, k = c // 4, c % 4
    l = (32 + 2*e + 2*i - h - k) % 7
    m = (a + 11*h + 22*l) // 451
    return ((h + l - 7*m + 114) // 31, ((h + l - 7*m + 114) % 31) + 1)

print([pascua(a) for a in range(1949, 1953)])
#&gt; [(4, 17), (4, 9), (3, 25), (4, 13)]
es_pascua = np.array([1.0 if pascua(t.year)[0] == t.month else 0.0 for t in idx])
print(int(es_pascua.sum()))
#&gt; 12

X = np.column_stack([np.log(dias), es_pascua])
f2 = SARIMAX(s, exog=X, order=(0,1,1), seasonal_order=(0,1,1,12), trend="n",
             simple_differencing=True).fit(disp=False)
print(f2.params[["x1", "x2"]].round(4).values,
      f2.bse[["x1", "x2"]].round(4).values,
      f2.tvalues[["x1", "x2"]].round(4).values)
#&gt; [1.0764 0.029 ] [0.4069 0.009 ] [2.6457 3.2195]
# R da coef [1.0840 0.0290], ee [0.4462 0.0111], t [2.4291 2.6026]. Los
# COEFICIENTES coinciden en el segundo decimal; los ERRORES ESTANDAR no (los
# de Python son un 9 % y un 19 % menores), porque las dos implementaciones no
# tratan igual la diferenciacion de los regresores. La conclusion no cambia:
print(round(float((f2.params["x1"] - 1) / f2.bse["x1"]), 4))
