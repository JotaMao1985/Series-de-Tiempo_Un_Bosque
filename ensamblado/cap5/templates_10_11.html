      <p>Las dos primeras filas crecen con $m$; la tercera no. Con tres años de datos semanales ($n = 156$),

        anual con datos diarios ni siquiera es entero: $365.25$ no es un número de rezagos. En la práctica,
        con una serie de frecuencia $365$ de poco más de dos años ($n = 800$) y una estación anual de verdad,
        <code>auto.arima</code> toma una diferencia estacional —gasta $365$ observaciones— y <strong>no estima ningún
        $\Phi$ ni $\Theta$</strong>: devuelve un ARIMA$(0,0,0)(0,1,0)_{365}$ y deja toda la estacionalidad en manos

        $\lfloor n/(3m)\rfloor$, que aquí vale $0$. Haría falta tener al menos tres años, $n \ge 3m = 1095$, solo
        para que pudiera ensayar un $\Theta$.</p>

      <h3>Regresión armónica: la estacionalidad como suma de senos</h3>

      <div class="definition">
        <h4><i class="fas fa-wave-square mr-2" aria-hidden="true"></i>Definición: términos de Fourier</h4>
        $$\begin{aligned}
          y_t = \beta_0 &+ \sum_{k=1}^{K}\alpha_k \sin\!\left(\frac{2\pi k t}{m}\right) \\
          &+ \sum_{k=1}^{K}\delta_k \cos\!\left(\frac{2\pi k t}{m}\right) + \eta_t
        \end{aligned}$$
        <p style="margin-bottom:0;">con $\eta_t$, como en el Módulo 9, un ARIMA <strong>no estacional</strong>. Cuesta $2K$ parámetros
          <em>independientemente de $m$</em>, y $K$ controla la suavidad: $K=1$ da una sinusoide pura, y $K$ mayor
          admite formas más quebradas. El máximo útil es $K = m/2$: ahí el seno de frecuencia $m/2$ vale cero en todos los
          periodos, quedan $m-1$ términos y <strong>equivalen exactamente a $m-1$ indicadoras mensuales</strong> —con
          $m=12$, once—. Pasado ese punto no
          hay nada nuevo que añadir.</p>
      </div>

      <h3>STL + ARIMA: quitar la estación primero</h3>

      <p>La tercera vía usa la descomposición del Capítulo 1: se separa el componente estacional con STL, se modela con
        un ARIMA <strong>la serie desestacionalizada</strong>, y al pronosticar se vuelve a sumar el patrón estacional
        (repitiendo el último ciclo estimado). Sobre $\log(\text{AirPassengers})$ da errores ARIMA($1,1,1$) con deriva.
        Sus ventajas: admite cualquier $m$, tolera que el patrón cambie despacio y es rápido. Su límite: supone que la
        estacionalidad <strong>no interactúa</strong> con la dinámica, y su incertidumbre no incluye la del propio
        patrón estacional.</p>

      <div class="note">
        <p><strong>Cuándo elegir cuál.</strong> $m$ pequeño y patrón que evoluciona → <strong>SARIMA</strong>.
          $m$ grande, o varias estacionalidades a la vez (día de la semana <em>y</em> día del año) →
          <strong>Fourier</strong>, que admite un bloque de términos por cada periodo. Series muy largas donde el
          patrón cambia de forma con los años → <strong>STL</strong>. Y con $m = 12$ y una serie de doce años, como
          esta, la respuesta del Módulo 11 es que el SARIMA sigue ganando: el argumento de Fourier es para cuando
          el SARIMA no cabe, no para cuando cabe.</p>
      </div>

          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm, warnings
from statsmodels.tsa.deterministic import Fourier, DeterministicProcess
from statsmodels.tsa.statespace.sarimax import SARIMAX
from statsmodels.tsa.seasonal import STL
warnings.simplefilter("ignore", RuntimeWarning)   # solo avisos de coma flotante de numpy

ap = np.log(sm.datasets.get_rdataset("AirPassengers").data["value"].values)
s = pd.Series(ap, index=pd.date_range("1949-01", periods=len(ap), freq="MS"))

# Fourier: statsmodels los genera con DeterministicProcess. Fijamos los errores
# en ARIMA(0,1,4) para que la comparacion entre K sea limpia (statsmodels no
# trae auto.arima). Con las 50 iteraciones por defecto, tres de los seis
# ajustes no convergen; con 2000, todos (columna "conv").
for K in range(1, 7):
    dp = DeterministicProcess(s.index, constant=False,
                              additional_terms=[Fourier(12, order=K)])
    X = dp.in_sample()
    f = SARIMAX(s, exog=X, order=(0, 1, 4), trend="n").fit(disp=False, maxiter=2000)
    print(f"K={K}  terminos={X.shape[1]:2d}  conv={f.mle_retvals['converged']}  aic={f.aic:9.2f}")
#&gt; K=1  terminos= 2  conv=True  aic=  -306.95
#&gt; K=2  terminos= 4  conv=True  aic=  -389.88
#&gt; K=3  terminos= 6  conv=True  aic=  -414.35
#&gt; K=4  terminos= 8  conv=True  aic=  -470.59
#&gt; K=5  terminos=10  conv=True  aic=  -502.38
#&gt; K=6  terminos=12  conv=True  aic=  -501.62
# La verosimilitud es plana cerca del maximo: otro optimizador mueve algun K
# unas decimas, pero no el orden (K = 5 sigue primero).

# TRAMPA: con K = m/2, statsmodels emite 12 columnas y R solo 11. La de mas es
# el seno de frecuencia m/2, que es IDENTICAMENTE CERO: la matriz de diseno
# queda con rango 11 y una columna sobra.
X = DeterministicProcess(s.index, constant=False,
                         additional_terms=[Fourier(12, order=6)]).in_sample()
print(X.shape[1], np.linalg.matrix_rank(X.values),
      [c for c in X.columns if X[c].abs().max() &lt; 1e-12])
#&gt; 12 11 ['sin(6,12)']
# Hay que quitarla a mano: X = X.drop(columns="sin(6,12)")

# STL: aqui se descompone y se modela el resto a mano
res = STL(s, period=12, robust=False).fit()
desestacionalizada = s - res.seasonal
f = SARIMAX(desestacionalizada, order=(1, 1, 1), trend="t").fit(disp=False, maxiter=2000)
print(f.mle_retvals["converged"], round(f.aic, 2))
#&gt; True -643.05

# modela la misma serie: modela la desestacionalizada. Y el ARIMA de stlm() en
# R da un AIC de -543.24 (-542.95 es su AICc) porque stlm() estima el
# componente estacional de otra forma.</code></pre>

      <h3>La comparación, hecha mal a propósito</h3>

      <p>Todo el capítulo ha usado criterios <em>dentro</em> de la muestra, y el Módulo 10 acaba de mostrar que entre
        familias distintas eso no vale. La alternativa evidente es comparar <strong>fuera de muestra</strong>: partir
        la serie, entrenar con los primeros $120$ meses, hasta 1958-12, y medir el error de pronóstico en los últimos
        $24$. El error se mide de tres maneras, siempre en pasajeros y en la escala original, la única en la que los
        métodos son comparables: el <strong>RMSE</strong>, la raíz del error cuadrático medio, que castiga más los
        errores grandes; el <strong>MAE</strong>, el error absoluto medio; y el <strong>MAPE</strong>, el error
        absoluto medio en porcentaje de lo observado.</p>

      <p>Entran ocho métodos. Cinco son de la familia ARIMA y ya han salido en el capítulo, todos sobre el logaritmo:
        el <em>airline</em>, el modelo que elige <code>auto.arima</code>, el <em>airline</em> con el calendario del
        Módulo 9, y la regresión armónica y el STL + ARIMA del Módulo 10. Los otros tres son nuevos. El
        <strong>ETS</strong> extiende el suavizamiento exponencial simple y el método de Holt del Capítulo 4
        (Módulo 1) con un componente estacional: suaviza por separado el nivel, la tendencia y la estación, y sus
        tres letras dicen cómo entra cada uno —primero el error, después la tendencia y la estación—: $A$ aditivo,
        $A_d$ aditivo amortiguado, $M$ multiplicativo. Se ajusta en las dos escalas: sobre la serie cruda, donde su
        estacionalidad multiplicativa es la natural, y sobre el logaritmo, la misma escala que el ARIMA. El
        <strong>naïve estacional</strong> es la referencia mínima: pronostica cada mes con el valor del mismo mes del
        último año observado, sin estimar nada. La columna $k$ cuenta los parámetros estimados, sin la varianza
        $\sigma^2$: en el STL + ARIMA, los $11$ valores de la estacionalidad además de los $2$ parámetros del ARIMA,
        y en la armónica, también la deriva.</p>

        pasos —el valor por defecto de <code>auto.arima</code>—, para que el bloque de abajo tarde menos de un minuto.
        Con la búsqueda exhaustiva de la partición, su RMSE medio baja a $21.06$ y queda por delante del ETS sobre el
        logaritmo ($21.42$): entre esos dos, el orden depende de la búsqueda y la diferencia es pequeña. El SARIMA
        sigue primero con las dos (la cifra exhaustiva la calcula el generador de los datos del capítulo).</p>

      <p>Lo que ocurría en la tabla de la partición no tiene que ver con la estacionalidad, sino con la tendencia. El corte
        cae en 1958-12, justo detrás del único año en que el tráfico casi no creció: el total anual de pasajeros subió
        un $3.4\,\%$ en 1958, frente a entre $6.2$ y $21.8\,\%$ en los demás años. El <em>airline</em> ajusta su
        pendiente a lo último que ve y pronostica un $4.7\,\%$ para 1959 y un $6.9\,\%$ para 1960; lo observado fue
        $12.4$ y $11.2\,\%$. Por eso se queda corto en los $24$ meses: su sesgo medio ($39.45$) es igual a su MAE. El
        ETS sobre el logaritmo ($9.4$ y $12.8\,\%$) y la regresión armónica ($10.6$ y $13.1\,\%$) arrastran menos
        ese frenazo. De los $14$ orígenes en que el SARIMA no es el mejor de los seis, $12$ caen entre 1957-05 y
        1959-01, alrededor de ese año. Con una sola partición, el azar de <em>dónde</em> cae el corte pesa más que la
        diferencia entre los métodos.</p>

      <p>¿Y a $24$ meses, el horizonte de la primera tabla? Con ese horizonte caben $49$ orígenes. El SARIMA sigue
        primero de media ($26.00$, frente a $26.61$ del ETS sobre el logaritmo, $27.80$ del STL y $28.30$ de la
        armónica), pero el ETS sobre el logaritmo le gana en el $49.0\,\%$ de los orígenes: a dos años vista, los dos
        son indistinguibles. También cuenta qué se mide en cada origen: si se toma solo el error del mes $12$, y no el
        RMSE de los doce meses, el SARIMA vuelve a quedar cuarto ($18.22$, frente a $15.96$ del ETS sobre el
        logaritmo). Una comparación honesta fija el horizonte y la métrica antes de mirar los resultados.</p>

      <p>El bloque siguiente reproduce todo lo anterior salvo la salvedad del $K$ de la armónica y su búsqueda
        exhaustiva en los orígenes: la tabla de la partición (el SARIMA con calendario lo calcula el bloque del
        Módulo 9), el crecimiento de cada año y los dos horizontes desde muchos orígenes. En R
        tarda menos de un minuto. En Python, <code>statsmodels</code> no trae <code>ets()</code> ni la elección
        automática de <code>auto.arima</code>, y el bloque se queda con el SARIMA y el naïve estacional.</p>

          <pre><code class="language-r">library(forecast)

ent  &lt;- window(ap,  end = c(1958, 12))           # 120 meses para entrenar
ento &lt;- window(apb, end = c(1958, 12))
obs  &lt;- as.numeric(window(apb, start = c(1959, 1)))   # los 24 meses de prueba
mediana &lt;- function(p) exp(as.numeric(p))       # exp() del pronostico en log

# --- 1. Una sola particion ---------------------------------------------------

# (RMSE 45.48) lo calcula el bloque del Modulo 9.
pron &lt;- list(
  ets_log  = mediana(forecast(ets(ent), h = 24)$mean),
  armonica = mediana(forecast(auto.arima(ent, xreg = fourier(ent, K = 6), seasonal = FALSE,
                                         stepwise = FALSE, approximation = FALSE),
                              xreg = fourier(ent, K = 6, h = 24))$mean),
  stl      = mediana(forecast(stlm(ent, s.window = "periodic", method = "arima"), h = 24)$mean),
  sarima   = mediana(forecast(Arima(ent, order = c(0, 1, 1),
                                    seasonal = list(order = c(0, 1, 1), period = 12)), h = 24)$mean),
  ets      = as.numeric(forecast(ets(ento), h = 24)$mean),
  snaive   = as.numeric(snaive(ento, h = 24)$mean))
as.character(auto.arima(ent, stepwise = FALSE, approximation = FALSE))   # el mismo airline
#&gt; [1] "ARIMA(0,1,1)(0,1,1)[12]"
metricas &lt;- function(p) { e &lt;- obs - p
  c(rmse = sqrt(mean(e^2)), mae = mean(abs(e)), mape = 100 * mean(abs(e / obs)), sesgo = mean(e)) }
round(t(sapply(pron, metricas)), 2)
#&gt;           rmse   mae  mape sesgo
#&gt; ets_log  19.43 16.12  3.55  8.92
#&gt; armonica 19.51 14.69  3.15  3.22
#&gt; stl      35.48 30.29  6.33 28.29
#&gt; sarima   43.18 39.45  8.52 39.45
#&gt; ets      72.55 63.21 13.30 63.21
#&gt; snaive   76.99 71.25 15.52 71.25
all(obs &gt; pron$sarima)        # el SARIMA se queda corto los 24 meses: sesgo = MAE
#&gt; [1] TRUE

# --- 2. El anio en que el trafico casi no crecio ------------------------------
tot &lt;- setNames(colSums(matrix(as.numeric(apb), nrow = 12)), 1949:1960)
round(100 * (tot[-1] / tot[-12] - 1), 1)       # crecimiento del total anual, %
#&gt; 1950 1951 1952 1953 1954 1955 1956 1957 1958 1959 1960
#&gt; 10.3 21.8 15.8 14.2  6.2 18.9 15.6 12.2  3.4 12.4 11.2
crece &lt;- function(p) round(100 * c(en_1959 = sum(p[1:12]) / tot[["1958"]] - 1,
                                   en_1960 = sum(p[13:24]) / sum(p[1:12]) - 1), 1)
rbind(sarima = crece(pron$sarima), ets_log = crece(pron$ets_log), armonica = crece(pron$armonica))
#&gt;          en_1959 en_1960
#&gt; sarima       4.7     6.9
#&gt; ets_log      9.4    12.8
#&gt; armonica    10.6    13.1

# --- 3. La misma comparacion desde 61 origenes --------------------------------
# Cada origen k entrena con los meses 1..k y pronostica los 24 siguientes, o los
# que queden. Los 12 primeros sirven para h = 12 (origenes 72 a 132, de 1954-12 a
# 1959-12) y los 24 para h = 24 (72 a 120). Tarda menos de un minuto: para eso la
# armonica se busca aqui por pasos (el valor por defecto de auto.arima), no de forma
# exhaustiva como en la particion; con la exhaustiva su RMSE medio a h = 12 baja a
# 21.06, por delante del ETS sobre el log (lo calcula el generador de los datos
# del capitulo; tarda minuto y medio).
metodos &lt;- list(
  sarima   = function(l, o, h) mediana(forecast(Arima(l, order = c(0, 1, 1),
                 seasonal = list(order = c(0, 1, 1), period = 12)), h = h)$mean),
  ets_log  = function(l, o, h) mediana(forecast(ets(l), h = h)$mean),
  stl      = function(l, o, h) mediana(forecast(stlm(l, s.window = "periodic",
                                                     method = "arima"), h = h)$mean),
  armonica = function(l, o, h) mediana(forecast(auto.arima(l, xreg = fourier(l, K = 6),
                 seasonal = FALSE), xreg = fourier(l, K = 6, h = h))$mean),
  ets      = function(l, o, h) as.numeric(forecast(ets(o), h = h)$mean),
  snaive   = function(l, o, h) as.numeric(snaive(o, h = h)$mean))
origenes &lt;- 72:132
E &lt;- lapply(origenes, function(k) {            # errores: una matriz h x 6 por origen

c(h12 = nrow(R12), h24 = nrow(R24))
#&gt; h12 h24

round(colMeans(R12), 2)                        # el promedio de los 61 RMSE

# --- 4. A 24 meses, y midiendo solo el error del mes 12 -----------------------
round(colMeans(R24), 2)
#&gt;   sarima  ets_log      stl armonica      ets   snaive
#&gt;    26.00    26.61    27.80    28.30    34.84    59.53
round(100 * colMeans(R24 &lt; R24[, "sarima"]), 1)
#&gt;   sarima  ets_log      stl armonica      ets   snaive

round(colMeans(abs(t(sapply(E, function(e) e[12, ])))), 2)

          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm, warnings
from statsmodels.tsa.statespace.sarimax import SARIMAX
warnings.simplefilter("ignore", RuntimeWarning)   # solo avisos de coma flotante de numpy

y = sm.datasets.get_rdataset("AirPassengers").data["value"].to_numpy(dtype=float)
meses = pd.date_range("1949-01", periods=len(y), freq="MS")

def airline(k, h):
    """El airline sobre log(y) con los k primeros meses: mediana de h pasos."""
    s = pd.Series(np.log(y[:k]), index=meses[:k])
    modelo = dict(order=(0, 1, 1), seasonal_order=(0, 1, 1, 12), trend="n")
    # Se estima diferenciando, como R, y se pronostica con el modelo en niveles:
    # con simple_differencing=True, get_forecast() daria la serie diferenciada.
    est = SARIMAX(s, simple_differencing=True, **modelo).fit(disp=False, method="bfgs", maxiter=1000)
    f = SARIMAX(s, **modelo).filter(est.params)
    return np.exp(f.get_forecast(h).predicted_mean.to_numpy()), est.mle_retvals["converged"]

def naive_estacional(k, h):
    return y[k - 12 + np.arange(h) % 12]           # repite los ultimos 12 meses

# statsmodels no trae ets() ni la eleccion automatica de auto.arima: aqui van el
# SARIMA y el naive estacional; los otros cuatro metodos, en el bloque de R.

# --- 1. Una sola particion: entrenar con 120 meses, hasta 1958-12 -------------
obs = y[120:]
p_sar, ok = airline(120, 24)
print(ok)
#&gt; True
for nombre, p in (("sarima", p_sar), ("snaive", naive_estacional(120, 24))):
    e = obs - p                                     # rmse, mae, mape y sesgo
    print(nombre, np.round([np.sqrt(np.mean(e**2)), np.mean(np.abs(e)),
                            100 * np.mean(np.abs(e / obs)), np.mean(e)], 2))
#&gt; sarima [43.18 39.45  8.52 39.45]
#&gt; snaive [76.99 71.25 15.52 71.25]

# --- 2. El crecimiento de los totales anuales ---------------------------------
tot = y.reshape(12, 12).sum(axis=1)               # una fila por anio, 1949-1960
print(np.round(100 * (tot[1:] / tot[:-1] - 1), 1))
#&gt; [10.3 21.8 15.8 14.2  6.2 18.9 15.6 12.2  3.4 12.4 11.2]
print(np.round(100 * np.array([p_sar[:12].sum() / tot[9] - 1,      # 1959 frente a 1958
                               p_sar[12:].sum() / p_sar[:12].sum() - 1]), 1))
#&gt; [4.7 6.9]

# --- 3. 61 origenes, h = 12: el SARIMA frente al naive estacional --------------
rmse = {"sarima": [], "snaive": []}
convergieron = 0
for k in range(72, 133):                          # de 1954-12 a 1959-12
    o = y[k:k + 12]
    p, ok = airline(k, 12)
    convergieron += ok
    rmse["sarima"].append(np.sqrt(np.mean((o - p) ** 2)))
    rmse["snaive"].append(np.sqrt(np.mean((o - naive_estacional(k, 12)) ** 2)))
r = {m: np.array(v) for m, v in rmse.items()}
print(len(r["sarima"]), convergieron)             # origenes y ajustes que convergieron
#&gt; 61 61
print(np.round([r["sarima"].mean(), r["snaive"].mean()], 2),
      round(100 * np.mean(r["snaive"] &lt; r["sarima"]), 1))
#&gt; [16.81 41.24] 11.5</code></pre>

      <h3>SARIMA frente a lo que se usa hoy</h3>

      <p>La pregunta legítima al terminar es por qué estudiar un modelo de 1970. La respuesta corta: porque sigue
        ganando en el régimen para el que fue diseñado —series de decenas o cientos de observaciones, con una
        estacionalidad y sin variables externas—, y porque las alternativas se entienden mucho mejor sabiendo qué
        hace él. La respuesta larga es esta tabla, escrita en términos de <em>cuándo</em>, no de <em>cuál es
        mejor</em>.</p>

      <div class="diagram">
        <table>
          <thead>
            <tr><th>Método</th><th>Qué supone</th><th>Dónde brilla</th><th>Dónde falla</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>SARIMA</strong></td>
              <td>Estacionariedad tras diferenciar; una estacionalidad de periodo $m$ pequeño y conocido</td>
              <td>$n$ de decenas a cientos; intervalos con base teórica; diagnóstico contrastable</td>
              <td>$m$ grande o múltiple; quiebres estructurales; muchas series a la vez</td>
            </tr>
            <tr>
              <td><strong>ETS</strong> (Holt–Winters y familia)</td>
              <td>Nivel, tendencia y estación que evolucionan con suavizamiento exponencial</td>
              <td>Muy robusto y automático; estacionalidad multiplicativa nativa</td>
              <td>No admite regresores; no modela autocorrelación residual</td>
            </tr>
            <tr>
              <td><strong>Regresión armónica</strong></td>
              <td>Estacionalidad determinista, suma de sinusoides</td>
              <td>$m$ grande o varias estacionalidades; admite regresores</td>
              <td>El patrón no puede cambiar con los años</td>
            </tr>
            <tr>
              <td><strong>Prophet</strong></td>
              <td>Tendencia lineal a trozos + Fourier + festivos, ajustado en un marco bayesiano</td>
              <td>Series de negocio largas con quiebres y calendarios complejos; poco tuneo</td>
              <td>Menos preciso que ETS/ARIMA en competencias estándar; los intervalos suelen quedar mal calibrados</td>
            </tr>
            <tr>
              <td><strong>RNN / LSTM</strong></td>
              <td>La relación entre pasado y futuro se aprende de los datos, sin forma funcional</td>
              <td>Miles de series relacionadas entrenadas juntas; relaciones no lineales</td>
              <td>Con una serie de $144$ puntos no hay con qué entrenar; sin intervalos salvo que se construyan aparte</td>
            </tr>
            <tr>
              <td><strong>Transformers temporales</strong></td>
              <td>Atención sobre ventanas largas; a menudo modelos base preentrenados</td>
              <td>Horizontes largos, muchas covariables, catálogos de miles de series</td>
              <td>Coste de cómputo; difícil de auditar; en series cortas suele perder frente a lo clásico</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="note">
        <p><strong>Una advertencia sobre las cifras que no están aquí.</strong> Esta tabla no trae RMSE de Prophet ni
          de una LSTM, y es deliberado: no están instalados en el entorno del curso, y poner números de memoria o
          copiados de otro estudio sería justo lo que este material lleva cinco capítulos enseñando a no hacer. Las
          columnas "dónde brilla" y "dónde falla" resumen resultados de las competencias M4 y M5 y de la literatura de
          <em>forecasting</em>; las cifras de la comparación de arriba, en cambio, están todas calculadas sobre esta
          serie y las reproduce el bloque de código de la comparación.</p>
      </div>

      <h3>Resumen del capítulo</h3>

      <div class="diagram">
        <table>
          <thead>
            <tr><th>Idea</th><th>Dónde queda</th></tr>
          </thead>
          <tbody>
            <tr><td>La estacionalidad se ve en $m, 2m, 3m$, y solo sobre la serie sin tendencia</td><td>Módulos 1 y 8</td></tr>
            <tr><td>La parte estacional <strong>multiplica</strong>: genera satélites en $m \pm 1$ que no cuestan parámetros</td><td>Módulos 2 y 4</td></tr>

#&gt;       nsdiffs ndiffs_tras_D

# --- Etapa 2: la rejilla, con d = 1 y D = 1 FIJOS ---------------------------
res &lt;- data.frame()
for (p in 0:2) for (q in 0:3) for (P in 0:1) for (Q in 0:1) {
  f &lt;- tryCatch(Arima(co2, order = c(p,1,q),
                      seasonal = list(order = c(P,1,Q), period = 12), method = "ML"),
                error = function(e) NULL, warning = function(w) NULL)
  if (is.null(f)) next
  res &lt;- rbind(res, data.frame(m = sprintf("(%d,1,%d)(%d,1,%d)[12]", p,q,P,Q),
    aicc = f$aicc, bic = f$bic, nobs = f$nobs,
    lb = Box.test(residuals(f), lag=24, type="Ljung-Box", fitdf=p+q+P+Q)$p.value))
}
nrow(res)                                  # 47 de los 48 convergen
#&gt; [1] 47
c(mejor_aicc = as.character(res$m[which.min(res$aicc)]),
  mejor_bic  = as.character(res$m[which.min(res$bic)]))
#&gt;         mejor_aicc          mejor_bic
#&gt; "(0,1,3)(0,1,1)[12]" "(0,1,1)(0,1,1)[12]"
# AICc y BIC discrepan: el BIC penaliza mas y se queda con el airline.
round(res[which.min(res$aicc), c("aicc","nobs","lb")], 4)
#&gt;        aicc nobs    lb
#&gt; 14 176.9982  455 0.631
round(178.2089 - 176.9982, 3)              # el airline pierde por poco
#&gt; [1] 1.211

# --- Etapa 3: la comparacion INVALIDA que pide el enunciado -----------------
sinD &lt;- Arima(co2, order = c(0,1,1), seasonal = list(order = c(0,0,1), period = 12))
conD &lt;- Arima(co2, order = c(0,1,1), seasonal = list(order = c(0,1,1), period = 12))
round(c(aicc_sinD = sinD$aicc, nobs_sinD = sinD$nobs,
        aicc_conD = conD$aicc, nobs_conD = conD$nobs), 3)
#&gt; aicc_sinD nobs_sinD aicc_conD nobs_conD
#&gt;   988.100   467.000   178.209   455.000
round(Box.test(residuals(sinD), lag=24, type="Ljung-Box", fitdf=2)$p.value, 4)
#&gt; [1] 0        no pasa el diagnostico

# Y la senal de vuelta del ciclo: ningun MA pegado a -1, no sobra ninguna diferencia
round(cbind(coef = coef(conD), ee = sqrt(diag(conD$var.coef)),
            a_menos_1 = (coef(conD) + 1) / sqrt(diag(conD$var.coef))), 4)
#&gt;         coef     ee a_menos_1
#&gt; ma1  -0.3501 0.0496   13.0936
#&gt; sma1 -0.8506 0.0257    5.8232</code></pre>
          <p><strong>Lo que hay que entender.</strong> Aquí el AICc sin diferencia estacional sale
            <em>muchísimo peor</em> ($988.10$ frente a $178.21$), así que la lectura ingenua acierta por casualidad.
            Sigue siendo inválida: se calcula sobre $467$ observaciones en vez de $455$. Y el argumento que sí es
            válido no depende de ningún criterio de información: ese modelo <strong>no pasa Ljung–Box</strong>
            ($p &lt; 10^{-4}$). En el Ejercicio 3 los dos AICc quedan a dos puntos: allí la comparación tampoco vale, aunque el menor
            señale el mismo modelo que el diagnóstico.</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">2.</span>Sobre <code>USAccDeaths</code>, decide
          $d$ y $D$ de <strong>dos formas</strong>: (a) llamando primero a <code>ndiffs()</code> y luego a
          <code>nsdiffs()</code> sobre el resultado; (b) al revés. Ajusta el modelo al que lleva cada camino, con
          $q = Q = 1$ en ambos. ¿Producen la misma serie diferenciada? ¿Y el mismo modelo? Justifica cuál es el bueno
          <strong>sin usar el AICc</strong>.</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c5e2-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c5e2-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c5e2-pista" hidden>
          <p style="margin:0;">La primera pregunta tiene truco: los <em>operadores</em> conmutan, así que $\nabla$ y
            $\nabla_{12}$ aplicados en cualquier orden dan la misma serie. Lo que no conmuta es la <em>decisión</em>.
            Y sobre por qué el AICc no sirve para elegir entre los dos modelos resultantes: mira su $d$.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c5e2-sol" hidden>
          <p><strong>Respuesta: los dos caminos dan modelos distintos —($0,0,1$)($0,1,1$)$_{12}$ y
            ($0,1,1$)($0,1,1$)$_{12}$— y solo el segundo pasa el diagnóstico. Sus AICc no se pueden comparar porque
            tienen distinto $d$.</strong></p>
          <pre><code class="language-r">library(forecast)
ua &lt;- USAccDeaths

# (a) Camino equivocado: ndiffs primero
d_a &lt;- ndiffs(ua); d_a
#&gt; [1] 0
D_a &lt;- nsdiffs(ua); D_a          # sobre la serie sin diferenciar, porque d = 0
#&gt; [1] 1

# (b) Camino correcto: nsdiffs primero
D_b &lt;- nsdiffs(ua); D_b
#&gt; [1] 1
d_b &lt;- ndiffs(diff(ua, lag = 12)); d_b
#&gt; [1] 1

# ¿La serie diferenciada es la misma? Los OPERADORES conmutan:
max(abs(diff(diff(ua, lag = 12)) - diff(diff(ua), lag = 12)))
#&gt; [1] 0
# pero (a) llega a d = 0 y (b) a d = 1, asi que ni siquiera diferencian lo mismo.

fa &lt;- Arima(ua, order = c(0, d_a, 1), seasonal = list(order = c(0, D_a, 1), period = 12))
fb &lt;- Arima(ua, order = c(0, d_b, 1), seasonal = list(order = c(0, D_b, 1), period = 12))

# El criterio VALIDO: el diagnostico
round(c(a = Box.test(residuals(fa), lag=24, type="Ljung-Box", fitdf=2)$p.value,
        b = Box.test(residuals(fb), lag=24, type="Ljung-Box", fitdf=2)$p.value), 4)
#&gt;      a      b
#&gt; 0.0000 0.2477

# El criterio INVALIDO, para verlo: distinto d, distinto n efectivo
round(c(aicc_a = fa$aicc, nobs_a = fa$nobs, aicc_b = fb$aicc, nobs_b = fb$nobs), 3)
#&gt;  aicc_a  nobs_a  aicc_b  nobs_b
#&gt; 905.963  60.000 857.316  59.000

as.character(auto.arima(ua, stepwise = FALSE, approximation = FALSE))
#&gt; [1] "ARIMA(0,1,1)(0,1,1)[12]"
round(coef(fb), 4)
#&gt;     ma1    sma1
#&gt; -0.4303 -0.5528

# Y la trampa de version que hay que conocer:
c(seas = nsdiffs(ua), ocsb = nsdiffs(ua, test = "ocsb"))
#&gt; seas ocsb
#&gt;    1    0</code></pre>
          <p><strong>Lo que hay que entender.</strong> $\nabla$ y $\nabla_{12}$ conmutan como operadores, pero el
            camino (a) nunca llega a aplicar $\nabla$: <code>ndiffs()</code> sobre la serie cruda ve $0$ porque la
            varianza estacional tapa la tendencia. El modelo resultante deja estructura en los residuales
            ($p &lt; 10^{-4}$). Y ojo con el último bloque: la prueba por defecto de <code>nsdiffs()</code> cambió de
            versión, y con <code>ocsb</code> —la antigua— habrías respondido $D = 0$ y te habrías equivocado más.</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">3.</span>Dos partes. <strong>(a)</strong> Da
          <strong>tres evidencias independientes</strong> de que la TRM mensual no tiene estacionalidad; una de ellas
          tiene que ser un ajuste, no una prueba automática. <strong>(b)</strong> Sobre <code>co2</code>, ajusta la
          regresión armónica con $K = 1, \dots, 6$ y compárala con el <em>airline</em> del Ejercicio 1. El mejor
          armónico y el <em>airline</em> quedan a menos de dos puntos de AICc: ¿cuál eliges y por qué?</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c5e3-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c5e3-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c5e3-pista" hidden>
          <p style="margin:0;">Para (a), el correlograma tiene que ser el de $\nabla\text{TRM}$, no el de la serie en
            niveles —en niveles cualquier serie con tendencia tiene $\hat\rho_{12}$ grande—. Para (b), la pregunta no
            es cuál tiene el AICc menor: es si esa comparación se puede hacer. Apunta el $n$ efectivo de los dos antes
            de responder, y busca un criterio que no dependa de él.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c5e3-sol" hidden>
          <p><strong>Respuesta: (a) las tres evidencias coinciden en que no hay estacionalidad. (b) El
            <em>airline</em>, pero no por el AICc: esos dos AICc no son comparables. Dentro de muestra, el
            diagnóstico inclina la balanza sin cerrarla: el <em>airline</em> pasa Ljung–Box con holgura y los armónicos
            quedan en el borde; la decisión firme se toma fuera de muestra.</strong></p>
          <pre><code class="language-r">library(forecast)
# TRM mensual: promedio de cada mes de la TRM diaria (Superintendencia
# Financiera, publicada en datos.gov.co), de enero de 2015 a junio de 2026.
# Copia fija de los 138 meses con que se calcularon estas cifras, la misma de
# los capitulos 2 a 4: se lee de la carpeta de trabajo si el archivo ya esta
# ahi; si no, de la pagina del curso.
archivo &lt;- "trm_mensual_2015-01_2026-06.csv"
if (!file.exists(archivo))
  archivo &lt;- paste0("https://jotamao1985.github.io/Series-de-Tiempo_Un_Bosque/datos/", archivo)
trm &lt;- ts(read.csv(archivo)$trm, start = c(2015, 1), frequency = 12)

# --- (a) Tres evidencias ----------------------------------------------------
# 1. prueba automatica (con las dos versiones disponibles)
c(seas = nsdiffs(trm), ocsb = nsdiffs(trm, test = "ocsb"))
#&gt; seas ocsb
#&gt;    0    0

# 2. correlograma de la serie SIN tendencia
a &lt;- Acf(diff(trm), lag.max = 36, plot = FALSE)$acf
round(c(r12 = a[13], r24 = a[25], r36 = a[37], banda = 1.96/sqrt(length(trm)-1)), 4)
#&gt;     r12     r24     r36   banda
#&gt; -0.0025 -0.0672  0.0714  0.1675      ninguno fuera de banda

# 3. AJUSTE forzado: el estadistico t del parametro estacional
g &lt;- Arima(trm, order = c(0,1,0), seasonal = list(order = c(1,0,0), period = 12))
round(c(Phi = coef(g)[1], ee = sqrt(diag(g$var.coef))[1],
        t = coef(g)[1]/sqrt(diag(g$var.coef))[1]), 4)
#&gt; Phi.sar1  ee.sar1   t.sar1
#&gt;   0.0013   0.0899   0.0146
round(c(forzado = g$aicc, simple = Arima(trm, order=c(0,1,0))$aicc), 3)
#&gt;  forzado   simple
#&gt; 1708.001 1705.941      aqui SI se comparan: los dos tienen d=1, D=0

# --- (b) Armonicos sobre co2 ------------------------------------------------
mods &lt;- list()
for (K in 1:6) {
  xr &lt;- fourier(co2, K = K)
  f &lt;- mods[[K]] &lt;- auto.arima(co2, xreg = xr, seasonal = FALSE, stepwise = FALSE, approximation = FALSE)
  cat(sprintf("K=%d  terminos=%2d  n_ef=%d  AICc=%8.3f  LB=%.4f\n", K, ncol(xr), f$nobs,
      f$aicc, Box.test(residuals(f), lag=24, type="Ljung-Box", fitdf=sum(f$arma[1:4]))$p.value))
}
#&gt; K=1  terminos= 2  n_ef=467  AICc= 435.509  LB=0.0000
#&gt; K=2  terminos= 4  n_ef=467  AICc= 268.475  LB=0.0000
#&gt; K=3  terminos= 6  n_ef=467  AICc= 223.402  LB=0.0000
#&gt; K=4  terminos= 8  n_ef=467  AICc= 180.200  LB=0.0439
#&gt; K=5  terminos=10  n_ef=467  AICc= 181.494  LB=0.0516
#&gt; K=6  terminos=11  n_ef=467  AICc= 183.624  LB=0.0515

airline &lt;- Arima(co2, order=c(0,1,1), seasonal=list(order=c(0,1,1), period=12))
round(c(armonico_K4 = mods[[4]]$aicc, n_armonico = mods[[4]]$nobs,
        airline = airline$aicc, n_airline = airline$nobs), 3)
#&gt; armonico_K4  n_armonico     airline   n_airline
#&gt;     180.200     467.000     178.209     455.000

# Lo que si se puede mirar en las dos familias: el diagnostico (no depende del n
# efectivo). No ordena modelos: dice si en los residuales queda estructura.
round(c(armonico_K4 = Box.test(residuals(mods[[4]]), lag = 24, type = "Ljung-Box",
                               fitdf = sum(mods[[4]]$arma[1:4]))$p.value,
        airline = Box.test(residuals(airline), lag = 24, type = "Ljung-Box", fitdf = 2)$p.value), 4)
#&gt; armonico_K4     airline
#&gt;      0.0439      0.4081</code></pre>
          <p><strong>Lo que hay que entender.</strong> En (a), tres caminos distintos —una prueba, un correlograma y
            un ajuste— dan la misma respuesta, y esa concordancia es lo que hace sólida la conclusión;
            <code>auto.arima</code> lo remata devolviendo un ARIMA($0,1,0$). En (b), la comparación de AICc
            hay que <strong>rechazarla</strong>: $180.200$ y $178.209$ están a dos puntos, pero uno se calcula sobre
            $467$ observaciones y el otro sobre $455$. Que el menor sea el del <em>airline</em> no la arregla: si el
            armónico hubiera quedado dos puntos por debajo, la misma lectura lo habría elegido con el mismo error. Lo
            que sí se puede mirar en las dos familias es el diagnóstico, que no depende del $n$ efectivo de la
            verosimilitud: el <em>airline</em> pasa Ljung–Box sin apuros ($p = 0.4081$), y los armónicos quedan en el
            borde —el $K=4$, el de menor AICc, lo rechaza al $5\,\%$ ($p = 0.0439$), y los $K=5$ y $K=6$ lo pasan
            por poco ($p = 0.0516$ y $0.0515$)—. Ese $p$-valor no ordena modelos: solo dice si en los residuales queda
            estructura. Con lo que hay dentro de muestra, el <em>airline</em> —dos parámetros y residuales sin
            estructura— es la elección prudente; decidir de verdad entre las dos familias exige compararlas fuera de
            muestra, que es el Capítulo 6.</p>
        </div>
      </div>

      <div class="note">
        <h4><i class="fas fa-file-excel" aria-hidden="true"></i> El capítulo, celda a celda, en Excel</h4>
        <p>En R, <code>diff()</code>, <code>Acf()</code> o <code>Arima()</code> devuelven el resultado y esconden
          la cuenta. Un libro de Excel la deja a la vista, una hoja por módulo: la ACF por fórmula, la heladería y
          el polinomio multiplicado, la tienda con $\nabla_{12}$ como la celda de arriba y $\nabla$ como la de la
          izquierda, los pesos $\psi$ del <em>airline</em>, Ljung–Box, el AICc de la rejilla, el pronóstico con sus
          bandas, la Pascua por fórmula, los términos de Fourier y las métricas. Excel no estima un SARIMA: toma de
          R $\hat\theta$ y $\hat\Theta$ como datos y muestra lo que implican. Cada resultado trae una comprobación
          que se pone en verde cuando coincide con el capítulo.</p>
