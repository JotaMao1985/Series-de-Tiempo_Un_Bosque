      <p>El Capítulo 4 terminó con un fracaso deliberado. El mejor modelo ARIMA no estacional sobre
        $\log(\text{AirPassengers})$, un ARIMA($0,1,5$) elegido por búsqueda exhaustiva, dejaba en sus residuales

        Módulo 5 el modelo <em>airline</em>, con <strong>solo dos parámetros</strong>, deja
        $\hat\rho_{12} = -0.0515$ y pasa Ljung–Box(24) con $p = 0.233$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: estacionalidad</h4>
        <p style="margin-bottom:0;">Una serie tiene <strong>estacionalidad</strong> (<em>seasonality</em>) de periodo
          $m$ cuando el patrón se repite cada $m$ observaciones y $m$ está <strong>fijado por el calendario</strong>:
          $m = 12$ para datos mensuales, $4$ para trimestrales, $7$ para diarios con patrón semanal, $52$ para
          semanales. Esa segunda condición es la que la separa del <strong>ciclo</strong> (<em>cycle</em>), cuya
          duración es variable y desconocida —como los $11.22$ años de las manchas solares del Capítulo 3—.</p>
      </div>

      <div class="note">
        <p><strong>Por qué la distinción no es un tecnicismo.</strong> Si $m$ es conocido, se puede <em>imponer</em>:
          diferenciar cada 12, poner un parámetro en el rezago 12. Si no lo es, hay que <em>estimarlo</em>, y ahí
          empieza otro problema. Todo lo que hace este capítulo depende de que $m$ venga dado.</p>
      </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">5.2 Notación SARIMA y el polinomio multiplicativo
          <span class="text-gray-400 font-normal text-2xl">/ SARIMA notation and the multiplicative polynomial</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Leer y escribir un SARIMA($p,d,q$)($P,D,Q$)$_m$,
              entender que la parte estacional <strong>multiplica</strong> a la regular en vez de sumarse, y calcular
              los momentos del proceso que resulta.</p>
          </div>
        </div>
      </div>

      <p>La idea es de una economía notable: si la estacionalidad hace que $y_t$ se parezca a $y_{t-12}$ igual que la
        dinámica ordinaria hace que se parezca a $y_{t-1}$, entonces basta con <strong>escribir el mismo modelo dos
        veces</strong>, una en $B$ y otra en $B^m$, y multiplicarlos.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso SARIMA($p,d,q$)($P,D,Q$)$_m$</h4>
        <p>Con $B$ el operador de rezago ($B y_t = y_{t-1}$):</p>
        $$\begin{aligned}
          &\underbrace{\Phi_P(B^m)}_{\text{AR estacional}}\ \underbrace{\phi_p(B)}_{\text{AR regular}} \\[0.3em]
          &\quad \cdot\ \underbrace{(1-B^m)^D}_{\substack{\text{integración}\\ \text{estacional}}}\ \underbrace{(1-B)^d}_{\substack{\text{integración}\\ \text{regular}}}\ y_t \\[0.3em]
          &= c + \underbrace{\Theta_Q(B^m)}_{\text{MA estacional}}\ \underbrace{\theta_q(B)}_{\text{MA regular}}\ \varepsilon_t
        \end{aligned}$$
        <p style="margin-bottom:0;">donde
          $\phi_p(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$,
          $\Phi_P(B^m) = 1 - \Phi_1 B^m - \cdots - \Phi_P B^{Pm}$,
          $\theta_q(B) = 1 + \theta_1 B + \cdots + \theta_q B^q$ y
          $\Theta_Q(B^m) = 1 + \Theta_1 B^m + \cdots + \Theta_Q B^{Qm}$. Las mayúsculas son estacionales; las
          minúsculas, regulares. Todo lo demás —estacionariedad, invertibilidad, criterios de información,
          diagnóstico— es exactamente lo de los Capítulos 3 y 4, aplicado al polinomio ya multiplicado.</p>
      </div>

      <h3>Un ejemplo para seguir a mano: pronosticar un mes</h3>

      <p>La definición se entiende mejor con un modelo pequeño y tres números. El más pequeño en que se ve todo lo
        nuevo es un SARIMA($1,0,0$)($1,0,0$)$_{12}$ con $\phi = 0.6$ y $\Phi = 0.7$, los mismos valores que usa el
        desarrollo de más abajo. La etiqueta se lee por bloques:</p>

      <ul>
        <li><strong>($1,0,0$), la parte regular:</strong> un rezago autorregresivo, el <strong>mes anterior</strong>,
          sin diferencias y sin términos MA.</li>
        <li><strong>($1,0,0$)$_{12}$, la parte estacional:</strong> un rezago autorregresivo de doce meses, el
          <strong>mismo mes del año anterior</strong>.</li>
      </ul>

      <p>Con la notación de la definición, el modelo es $(1 - 0.6B)(1 - 0.7B^{12})\,y_t = \varepsilon_t$. Los datos
        son <strong>inventados</strong>, para que las cuentas salgan de cabeza: las ventas de una heladería, medidas
        como desvío de su promedio. Se conocen tres meses y se quiere pronosticar marzo de 2025:</p>

      <div class="diagram">
        <table>
          <thead>
            <tr><th></th><th>Febrero</th><th>Marzo</th></tr>
          </thead>
          <tbody>
            <tr><td>2024</td><td>$15$</td><td>$20$</td></tr>
            <tr><td>2025</td><td>$10$</td><td>$?$</td></tr>
          </tbody>
        </table>
      </div>

      <p>Multiplicar los dos polinomios equivale a hacer <strong>dos preguntas, una detrás de otra</strong>:</p>

      <ol>
        <li><strong>La regular: ¿qué no explica el mes anterior?</strong> Se llama <em>sorpresa</em> de un mes a lo
          que queda después de descontar el mes anterior, $u_t = y_t - 0.6\,y_{t-1}$. La de marzo de 2024 es
          $20 - 0.6 \cdot 15 = 11$.</li>
        <li><strong>La estacional: ¿se repite la sorpresa de hace un año?</strong> El factor $(1 - 0.7B^{12})$ actúa
          sobre las sorpresas, $u_t = 0.7\,u_{t-12} + \varepsilon_t$. Para marzo de 2025 se espera una sorpresa de
          $0.7 \cdot 11 = 7.7$.</li>
      </ol>

      <p>El pronóstico junta las dos respuestas: lo que aporta febrero de 2025 más la sorpresa esperada,
        $0.6 \cdot 10 + 7.7 = 13.7$. La misma cifra sale en una sola cuenta con el polinomio ya multiplicado, que
        escrito como ecuación es</p>

      <p>$$\begin{aligned}
          y_t &= 0.6\,y_{t-1} + 0.7\,y_{t-12} \\
          &\quad - 0.42\,y_{t-13} + \varepsilon_t
        \end{aligned}$$</p>

      <p>$$0.6 \cdot 10 + 0.7 \cdot 20 - 0.42 \cdot 15 = 13.7$$</p>

      <p>El tercer término es el <strong>satélite</strong>. El rezago $13$ es febrero de 2024, y su peso,
        $-0.42 = -0.6 \cdot 0.7$, quita a marzo de 2024 la parte que ya venía de febrero de 2024. Si los dos modelos
        se sumaran en vez de multiplicarse, el pronóstico sería $0.6 \cdot 10 + 0.7 \cdot 20 = 20$: usaría marzo de
        2024 entero, incluidos los $0.6 \cdot 15 = 9$ que en él venían de febrero. La diferencia,
        $20 - 13.7 = 6.3$, es justo $0.7 \cdot 9$.</p>

      <p>El ejemplo adelanta lo que el resto del módulo generaliza:</p>

        <li><strong>Si cualquiera de los dos vale cero, el satélite desaparece.</strong> Con $\Phi = 0$ queda el

        <li><strong>En la ACF, el satélite es un camino.</strong> Marzo de 2025 se parece a marzo de 2024, y marzo de

        <li><strong>Con $\phi = \Phi = 1$ los pesos son $+1$, $+1$ y $-1$.</strong> Es $(1-B)(1-B^{12})$, la doble

          <pre><code class="language-r"># Heladeria inventada: desvios de su promedio en tres meses conocidos
feb24 &lt;- 15; mar24 &lt;- 20; feb25 &lt;- 10
phi &lt;- 0.6; Phi &lt;- 0.7                 # SARIMA(1,0,0)(1,0,0)[12]

# Ruta 1: el polinomio ya multiplicado, con el satelite en el rezago 13

#&gt; [1] 13.7

# Ruta 2: primero la sorpresa regular, despues la pregunta estacional
sorpresa_mar24 &lt;- mar24 - phi * feb24  # lo que febrero no explica de marzo
sorpresa_mar24
#&gt; [1] 11
phi * feb25 + Phi * sorpresa_mar24
#&gt; [1] 13.7

# Si los dos modelos se sumaran, sin satelite
phi * feb25 + Phi * mar24
#&gt; [1] 20

# El polinomio AR multiplicado, rezago a rezago: 2 parametros, 3 rezagos
ar &lt;- c(phi, rep(0, 10), Phi, -phi * Phi)
round(ar[c(1, 12, 13)], 2)
#&gt; [1]  0.60  0.70 -0.42

# En la ACF, el satelite es el producto de los dos caminos
r &lt;- ARMAacf(ar = ar, lag.max = 13)
round(c(r[c("1", "11", "12", "13")], rho1_x_rho12 = r[["1"]] * r[["12"]]), 4)
#&gt;            1           11           12           13 rho1_x_rho12
#&gt;       0.6016       0.4230       0.7011       0.4218       0.4218</code></pre>

      <p>La sección siguiente generaliza la cuenta a cualquier par de órdenes y la escribe para todo el
        polinomio.</p>

      <h3>Multiplicar no es sumar: los rezagos satélite</h3>

      <p>Aquí está lo único genuinamente nuevo. Si en vez de multiplicar los polinomios se sumaran los términos, un
        modelo con $p = 1$ y $P = 1$ tocaría los rezagos $1$ y $12$, y nada más. Al multiplicarlos aparece un término
        cruzado en el rezago $13$ que <strong>nadie ha puesto ahí</strong>: sale solo, y con un coeficiente que no es
        libre, sino el producto de los otros dos.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-multiplicativo">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>

          <ol class="derivacion-pasos">
            <li>
              <p>Tomamos el caso más pequeño en que se ve el efecto, un AR($1$)$\times$SAR($1$)$_{12}$ sin
                diferencias:</p>
              $$(1 - \Phi B^{12})(1 - \phi B)\, y_t = \varepsilon_t$$
            </li>
            <li>
              <p>Multiplicamos los dos factores:</p>
              $$\begin{aligned}
                &(1 - \Phi B^{12})(1 - \phi B) \\
                &\quad = 1 - \phi B - \Phi B^{12} + \phi\Phi B^{13}
              \end{aligned}$$
            </li>
            <li>
              <p>Escrito como ecuación en diferencias, el modelo es</p>
              $$\begin{aligned}
                y_t &= \phi\, y_{t-1} + \Phi\, y_{t-12} \\
                &\quad - \phi\Phi\, y_{t-13} + \varepsilon_t
              \end{aligned}$$
              <p>Un AR($13$) con <strong>dos</strong> parámetros libres. Los rezagos $2$ a $11$ tienen coeficiente
                cero y el rezago $13$ tiene coeficiente $-\phi\Phi$, atado a los otros dos.</p>
            </li>
            <li>
              <p>Con $\phi = 0.6$ y $\Phi = 0.7$, la ACF teórica vale $\rho_1 = 0.6016$, $\rho_{12} = 0.7011$ y —esto
                es lo que hay que reconocer en un correlograma real— $\rho_{11} = 0.4230$ y $\rho_{13} = 0.4218$,
                aproximadamente $\rho_1 \cdot \rho_{12}$.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">La multiplicación genera <strong>satélites</strong> alrededor de cada rezago
            estacional, en $m \pm 1, m \pm 2, \dots$ Su tamaño es el producto de la parte regular por la estacional. Un
            correlograma con picos en $11$, $12$ y $13$ no pide tres parámetros: pide dos, uno regular y uno
            estacional. El Módulo 4 usa esto para identificar los órdenes.</p>
        </div>
      </div>

      <h3>Media, varianza y autocorrelación</h3>

      <p>El polinomio ya multiplicado es un ARMA corriente, así que todo el Capítulo 3 sigue valiendo sin cambios:
        basta leerlo con los órdenes completos en vez de con los cuatro órdenes que se escriben. Lo que sí cambia es
        <strong>qué se puede simplificar</strong>, y ahí la estructura multiplicativa da un regalo en la parte MA y
        cobra un peaje en la AR.</p>

      <div class="warning">
        <p><strong>Solo con $d = D = 0$.</strong> Un modelo con diferencias <em>no tiene</em> varianza finita, así que
          preguntar por $\gamma_0$ del <em>airline</em> tal como se escribe no significa nada. La serie que tiene
          momentos es la ya diferenciada, $w_t = \nabla^d \nabla_m^D y_t$, y es a ella —no a $y_t$— a la que se
          refiere todo lo que sigue.</p>
      </div>

      <div class="formula">
        $$\begin{aligned}
          \mu &= \frac{c}{\phi_p(1)\,\Phi_P(1)} \\[0.5em]
          &= \frac{c}{\begin{gathered}(1-\phi_1-\cdots-\phi_p) \\ \cdot\,(1-\Phi_1-\cdots-\Phi_P)\end{gathered}} \\[0.8em]
          \gamma_k &= \sigma^2 \sum_{j=0}^{\infty} \psi_j\,\psi_{j+k} \\[0.5em]
          \gamma_0 &= \operatorname{Var}(w_t) = \sigma^2 \sum_{j=0}^{\infty} \psi_j^{\,2}
        \end{aligned}$$
      </div>

      <p>Son las fórmulas del Módulo 5 del Capítulo 3, aplicadas a los $\psi_j$ del polinomio ya multiplicado. La
        media hereda la estructura del producto: el denominador se factoriza porque evaluar un producto de polinomios
        en $B = 1$ es multiplicar sus valores. Y la suma de los $\psi_j^2$ no es material nuevo: es exactamente la que
        el Capítulo 4 usa para los intervalos de pronóstico, $\sigma_h^2 = \sigma^2\sum_{j&lt;h}\psi_j^2$, llevada
        al infinito en vez de cortada en el horizonte $h$. La varianza del proceso es el límite de la incertidumbre de
        pronóstico cuando el horizonte deja de importar.</p>

      <p><strong>El regalo.</strong> Si el modelo es solo MA —regular y estacional, sin parte autorregresiva— y
        $q &lt; m$, la varianza <strong>se factoriza exactamente</strong>, y con ella toda la ACF:</p>

      <div class="formula">
        $$\begin{gathered}
          \gamma_0 = \sigma^2\Bigl(\textstyle\sum_{i=0}^{q}\theta_i^2\Bigr)\Bigl(\textstyle\sum_{j=0}^{Q}\Theta_j^2\Bigr) \\[0.5em]
          \rho_{i+jm} = \rho^{\text{reg}}_i \cdot \rho^{\text{est}}_j \\[0.3em]
          (\theta_0 = \Theta_0 = 1)
        \end{gathered}$$
      </div>

      <p>La razón es de contabilidad, no de álgebra fina: un MA tiene <strong>un número finito</strong> de pesos, en
        los rezagos $i + jm$ con $i \le q$ y $j \le Q$. Si $q &lt; m$, cada par $(i,j)$ cae en un rezago distinto y
        ningún término se suma con otro, de modo que el cuadrado de la suma se separa. En cuanto $q$ alcanza a $m$ la
        igualdad se rompe, y no por poco: con $\theta_{12} = 0.5$ y $\Theta = 0.6$ la varianza vale $2.300\,\sigma^2$
        y la factorización daría $1.700\,\sigma^2$.</p>

      <div class="note">
        <p><strong>El <em>airline</em> es el caso exacto.</strong> Con $q = Q = 1$ y $m = 12$ los pesos están en los
          rezagos $0, 1, 12, 13$ y nunca chocan, así que
          $\gamma_0 = \sigma^2(1+\theta^2)(1+\Theta^2) = 1.5217\,\sigma^2$, sin aproximación ninguna. Con el
          $\hat\sigma^2 = 0.001371$ del modelo ajustado eso da $\gamma_0 = 0.002087$ para
          $\nabla\nabla_{12}\log y_t$, frente a una varianza muestral de $0.002102$ en las $131$ observaciones que
          quedan. Hay más: en $\rho_1 = \theta/(1+\theta^2)$ el factor estacional <strong>se cancela</strong>, de
          modo que la autocorrelación en un rezago regular no depende de $\Theta$ en absoluto.</p>
      </div>

      <p><strong>El peaje.</strong> Con parte autorregresiva no hay factorización, ni siquiera aproximada cuando
        $\phi$ es grande. Un AR no tiene un número finito de pesos, sino infinitos, así que los choques son
        inevitables: en el AR($1$)$\times$SAR($1$) del desarrollo de arriba, el rezago $12$ recibe
        <strong>dos caminos</strong> —doce pasos regulares, o uno estacional— y su peso es la suma de ambos,</p>

      <div class="formula">
        $$\psi_{12} = \phi^{12} + \Phi$$
      </div>

      <p>El término de colisión es $\phi^{m}$, y de ahí sale todo el comportamiento: con $\phi$ moderado es
        despreciable y la factorización engaña bien; con $\phi$ cerca de $1$ domina, y $\sigma^2/[(1-\phi^2)(1-\Phi^2)]$
        se queda muy por debajo de la varianza verdadera. Con $\Phi = 0.7$ fijo:</p>

      <div class="diagram">
        <table style="position:relative;">
          <thead>
            <tr><th>$\phi$</th><th>$\phi^{12}$</th><th>$\gamma_0/\sigma^2$ exacta</th><th>Factorizada</th><th>Error</th></tr>
          </thead>
          <tbody>
            <tr><td>$0.6$</td><td>$0.002$</td><td>$3.073$</td><td>$3.064$</td><td>$-0.3\,\%$</td></tr>
            <tr><td>$0.8$</td><td>$0.069$</td><td>$5.997$</td><td>$5.447$</td><td>$-9.2\,\%$</td></tr>
            <tr><td>$0.9$</td><td>$0.282$</td><td>$15.406$</td><td>$10.320$</td><td>$\mathbf{-33.0\,\%}$</td></tr>
            <tr><td>$0.95$</td><td>$0.540$</td><td>$44.580$</td><td>$20.111$</td><td>$\mathbf{-54.9\,\%}$</td></tr>
          </tbody>
        </table>
      </div>

      <p>La lectura práctica es que la varianza de un SARIMA con parte AR hay que <strong>calcularla</strong>,
        expandiendo el polinomio y sumando los $\psi_j^2$, y no estimarla multiplicando las dos varianzas por
        separado. El Módulo 4 vuelve sobre esta misma frontera desde el lado de la ACF, que es donde se identifica.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: diferencia estacional</h4>
        <p>$$\nabla_m y_t = (1 - B^m)\, y_t = y_t - y_{t-m}$$</p>
        <p style="margin-bottom:0;">Compara cada observación con la del <strong>mismo periodo del ciclo anterior</strong>:
          enero contra enero, no enero contra diciembre. Cuesta $m$ observaciones, no una. Y no tiene nada que ver con
          aplicar $\nabla$ doce veces: $\nabla^{12} \neq \nabla_{12}$. La primera es un polinomio con una raíz de
          multiplicidad $12$ en $B=1$; la segunda tiene $12$ raíces <em>distintas</em>, repartidas por todo el círculo
          unitario.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-raices-nabla12">

          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-raices-nabla12" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Las raíces de $1 - B^{12} = 0$ son las doce raíces duodécimas de la unidad:</p>
              $$B_k = e^{\,2\pi i k/12}, \qquad k = 0, 1, \dots, 11$$
              <p>Todas tienen módulo $1$, pero solo una ($k=0$) vale $B=1$.</p>
            </li>
            <li>
              <p>Se puede factorizar separando esa raíz:</p>
              $$1 - B^{12} = (1-B)\,(1 + B + B^2 + \cdots + B^{11})$$
            </li>
            <li>
              <p>Es decir, <strong>$\nabla_{12}$ contiene a $\nabla$</strong>. Aplicar la diferencia estacional ya
                elimina una tendencia lineal, y por eso muchas series necesitan $D=1$ y $d=0$: la estacional hizo las
                dos cosas.</p>
            </li>
            <li>
              <p>Las once raíces restantes están en las frecuencias estacionales $2\pi k/12$, con $k \neq 0$: son las
                que anulan el patrón que se repite cada doce meses. Por eso $\nabla_{12}$ elimina una estacionalidad
                <em>determinista</em> y no solo una estocástica.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">$\nabla_{12}$ mata la tendencia lineal <strong>y</strong> el patrón
            estacional de un golpe. Aplicar además $\nabla$ vuelve a imponer la raíz $B=1$, que ya estaba: se hace
            cuando la tendencia es más fuerte que lineal o cambia de pendiente, no por rutina.</p>
        </div>

      <h3>Un ejemplo para seguir a mano: la tienda inventada</h3>

      <p>Antes de medir con datos reales conviene ver qué hace cada diferencia con números que se comprueban de
        cabeza. La serie de este ejemplo es <strong>inventada</strong>, no medida: las ventas mensuales de una tienda
        que parte en enero de 2022 de un nivel de $100$ unidades, vende <strong>una unidad más cada mes</strong> y
        repite cada año el mismo patrón estacional $s_{\text{mes}}$:</p>

      <p>$$y_t = 100 + (t - 1) + s_{\text{mes}}$$</p>

      <p>donde $t$ cuenta los meses: $t = 1$ es enero de 2022 y $t = 48$, diciembre de 2025. El patrón, en
        unidades:</p>

      <div class="diagram">
        <table>
          <tbody>
            <tr><th>Ene</th><th>Feb</th><th>Mar</th><th>Abr</th><th>May</th><th>Jun</th></tr>
            <tr><td>$-6$</td><td>$-8$</td><td>$-4$</td><td>$-2$</td><td>$0$</td><td>$4$</td></tr>
            <tr><th>Jul</th><th>Ago</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dic</th></tr>
            <tr><td>$6$</td><td>$4$</td><td>$0$</td><td>$-2$</td><td>$2$</td><td>$6$</td></tr>
          </tbody>
        </table>
      </div>

      <p>Por eso el primer mes no vende $100$: en enero de 2022, $y_1 = 100 + 0 - 6 = 94$. El patrón suma cero a lo
        largo del año: pasa ventas de unos meses a otros, pero no cambia el nivel medio. En una cuadrícula con un año por fila y un mes por columna —la vista del mapa del Módulo 1—, cada diferencia es
        una <strong>dirección de resta</strong>:</p>

      <ul>
        <li><strong>$\nabla_{12}$ resta la celda de arriba</strong>, que es el mismo mes del año anterior. Marzo de
          2024 menos marzo de 2023: $122 - 110 = 12$.</li>
        <li><strong>$\nabla$ resta la celda de la izquierda</strong>, que es el mes anterior. A enero le toca el
          diciembre de la fila de arriba.</li>
        <li><strong>$\nabla^{12}$ es otra cosa</strong>: repetir doce veces la resta hacia la izquierda, cada vez
          sobre el resultado anterior. No equivale a restar una sola vez hacia arriba.</li>
      </ul>

      <div class="simulador" data-simulador="tienda-cuadricula">
        <h4><i class="fas fa-store" aria-hidden="true"></i> La tienda inventada, celda a celda</h4>
        <p class="simulador-intro">Elige qué restar y mira la cuadrícula. Empieza por la serie tal cual, pasa a
          $\nabla_{12}$ y compara con $\nabla$. Después cambia al escenario en que la tienda acelera en 2024. La
          lectura hace la cuenta de marzo de 2024 con los números de la serie.</p>
        <div class="simulador-controles"></div>
        <!--MAPA:tienda|La tienda inventada, mes × año|-->
        <div class="simulador-lectura"></div>
      </div>

      <p>Las cuatro cuadrículas adelantan lo que el resto del módulo mide con datos reales:</p>

      <ul>
        <li><strong>$\nabla$ no quita la estacionalidad.</strong> Con crecimiento fijo, cada año repite los mismos
          doce números, de $-11$ en enero a $5$ en diciembre: el patrón sigue ahí, escrito como cambios de un mes al
          siguiente. Por eso, en la tabla de más abajo, la diferencia regular sube $\hat\rho_{12}$ en lugar de
          bajarlo.</li>
        <li><strong>$\nabla_{12}$ quita el patrón y también la tendencia.</strong> Todas las celdas valen $12$, las
          doce unidades que la tienda gana en un año. La tendencia lineal se volvió una constante: es lo que el
          desarrollo de arriba demuestra en general cuando dice que $\nabla_{12}$ contiene a $\nabla$.</li>
        <li><strong>$\nabla\nabla_{12}$ hace falta cuando el crecimiento cambia.</strong> Con crecimiento fijo solo
          deja ceros: ya no quedaba nada que quitar. Si la tienda acelera en 2024, $\nabla_{12}$ deja de ser
          constante —sube de $14$ en enero a $36$ en diciembre— y la diferencia regular recoge el cambio: $2$ en cada
          mes de 2024 y $0$ antes y después. En $\log(\text{AirPassengers})$ el crecimiento anual tampoco es fijo:
          su media va de $0.032$ en 1958 a $0.201$ en 1951. Esa es la «tendencia sin resolver» que $\nabla_{12}$
          sola deja en la tabla de abajo.</li>
        <li><strong>El orden de las restas no importa.</strong> Primero hacia arriba y después hacia la izquierda, o al
          revés: sale la misma cuadrícula. Es lo que más abajo se llama que los operadores <em>conmutan</em>.</li>
      </ul>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-cuadrado-2x2">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver por qué el orden no importa</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-cuadrado-2x2" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Las dos diferencias juntas son el producto de sus polinomios:</p>
              $$\nabla\nabla_{12}\,y_t = (1-B)(1-B^{12})\,y_t = (1 - B - B^{12} + B^{13})\,y_t$$
            </li>
            <li>
              <p>Es decir, cuatro términos:</p>
              $$\nabla\nabla_{12}\,y_t = y_t - y_{t-1} - y_{t-12} + y_{t-13}$$
              <p>En la cuadrícula son las cuatro esquinas de un cuadrado de $2 \times 2$: la celda, la de su
                izquierda, la de arriba y la de arriba a la izquierda.</p>
            </li>
            <li>
              <p>Con la tienda que acelera, en marzo de 2024: $128 - 121 - 110 + 105 = 2$, el mismo $2$ que muestra
                la cuadrícula de $\nabla\nabla_{12}$.</p>
            </li>
            <li>
              <p>Multiplicar en el otro orden, $(1-B^{12})(1-B)$, da el mismo polinomio. Por eso la serie resultante
                no depende de qué diferencia se aplique primero.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">Diferenciar dos veces es restar las cuatro esquinas de un cuadrado. Los
            operadores conmutan; lo que no conmuta, como se ve más abajo, son las pruebas que deciden cuántos
            aplicar.</p>
        </div>
      </div>

      <h3>Las cuatro combinaciones</h3>

      <p>Con datos reales las celdas no salen constantes, pero cada diferencia hace lo mismo que en la tienda. Sobre
        $\log(\text{AirPassengers})$:</p>

      <div class="simulador" data-simulador="cuatro-combinaciones">

        <p class="simulador-intro">Los dos interruptores dan las cuatro combinaciones. Mira sobre todo la
          <strong>ACF en el rezago 12</strong>: con solo la diferencia regular baja de $0.762$ a… $0.841$, es decir
          <em>sube</em>. Diferenciar de forma regular no toca la estacionalidad; concentrarla es incluso más fácil de
          ver después.</p>

      <p>La regla de la varianza mínima —del Capítulo 4— señala $d=1, D=1$, y aquí acierta. Pero conviene ver
        <em>por qué</em> cada fila hace lo que hace: $\nabla$ solo divide la varianza entre $17$ y deja la
        estacionalidad intacta; $\nabla_{12}$ sola la divide entre $51$ y deja $\hat\rho_1 = 0.714$, que es
        tendencia sin resolver. Cada operador hace su trabajo y solo el suyo.</p>

      <h3>El orden en que se decide</h3>

      <div class="warning">
        <p><strong>Los operadores conmutan; las pruebas no.</strong> $\nabla\nabla_{12}y_t$ y $\nabla_{12}\nabla y_t$
          son <strong>la misma serie</strong> —diferencia máxima medida: $0$ en las dos series del capítulo—, así que
          el orden de aplicación es irrelevante. Lo que no es irrelevante es el orden en que se <em>decide</em>. Sobre
          <code>USAccDeaths</code>, <code>ndiffs()</code> aplicado a la serie cruda devuelve <strong>0</strong>; sobre
          la misma serie ya diferenciada estacionalmente devuelve <strong>1</strong>. La estacionalidad domina la
          varianza y esconde la tendencia. <strong>Primero $D$, después $d$.</strong></p>
      </div>

          estacional: cuando sobra una diferencia, $\hat\Theta$ se pega a $-1$ y la raíz del polinomio MA cae
          <strong>sobre</strong> el círculo unitario.</p>

        <div class="code-tab-panel active" data-lang="r">
          <pre><code class="language-r">library(forecast)
ap  &lt;- log(AirPassengers)
uad &lt;- USAccDeaths

# --- El orden importa: primero D, despues d --------------------------------
c(ndiffs_crudo = ndiffs(uad), nsdiffs = nsdiffs(uad))
#&gt; ndiffs_crudo      nsdiffs
#&gt;            0            1
ndiffs(diff(uad, lag = 12))       # d se decide DESPUES de quitar la estacion
#&gt; [1] 1

# ...pero los operadores si conmutan
max(abs(diff(diff(uad, lag = 12)) - diff(diff(uad), lag = 12)))
#&gt; [1] 0

# --- Las cuatro combinaciones ----------------------------------------------
comb &lt;- expand.grid(d = 0:1, D = 0:1)
for (i in seq_len(nrow(comb))) {
  w &lt;- ap
  if (comb$D[i] &gt; 0) w &lt;- diff(w, lag = 12, differences = comb$D[i])
  if (comb$d[i] &gt; 0) w &lt;- diff(w, differences = comb$d[i])   # d=0 aparte: diff(x, differences=0) es ERROR
  a &lt;- Acf(w, lag.max = 12, plot = FALSE)$acf
  cat(sprintf("d=%d D=%d  n=%3d  var=%.6f  r1=%+.4f  r12=%+.4f\n",
              comb$d[i], comb$D[i], length(w), var(w), a[2], a[13]))
}
#&gt; d=0 D=0  n=144  var=0.194884  r1=+0.9537  r12=+0.7619
#&gt; d=1 D=0  n=143  var=0.011354  r1=+0.1998  r12=+0.8414
#&gt; d=0 D=1  n=132  var=0.003800  r1=+0.7137  r12=-0.2430
#&gt; d=1 D=1  n=131  var=0.002102  r1=-0.3411  r12=-0.3866

# --- Sobrediferenciacion estacional: la firma es la raiz MA -----------------
for (D in 0:2) {
  f &lt;- Arima(ap, order = c(0,1,1), seasonal = list(order = c(0,D,1), period = 12))
  cat(sprintf("D=%d  Theta=%+.4f (e.e. %.4f)  |raiz MA|^-1=%.4f\n", D,
      coef(f)["sma1"], sqrt(diag(f$var.coef))["sma1"],
      max(Mod(1/polyroot(c(1, f$model$theta))))))
}

#&gt; D=1  Theta=-0.5569 (e.e. 0.0731)  |raiz MA|^-1=0.9524
#&gt; D=2  Theta=-0.9973 (e.e. 0.0830)  |raiz MA|^-1=0.9998</code></pre>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm

ap = np.log(sm.datasets.get_rdataset("AirPassengers").data["value"].values)
uad = sm.datasets.get_rdataset("USAccDeaths").data["value"].values

def diferenciar(x, d=0, D=0, m=12):
    """Diferencia estacional D veces y luego regular d veces."""
    for _ in range(D):
        x = x[m:] - x[:-m]          # nabla_m: NO es np.diff(x, n=m)
    if d:
        x = np.diff(x, n=d)
    return x

for d in (0, 1):
    for D in (0, 1):
        w = diferenciar(ap, d, D)
        a = sm.tsa.acf(w, nlags=12, fft=False)
        print(f"d={d} D={D}  n={len(w):3d}  var={w.var(ddof=1):.6f}  "
              f"r1={a[1]:+.4f}  r12={a[12]:+.4f}")
#&gt; d=0 D=0  n=144  var=0.194884  r1=+0.9537  r12=+0.7619
#&gt; d=0 D=1  n=132  var=0.003800  r1=+0.7137  r12=-0.2430
#&gt; d=1 D=0  n=143  var=0.011354  r1=+0.1998  r12=+0.8414
#&gt; d=1 D=1  n=131  var=0.002102  r1=-0.3411  r12=-0.3866

# Los operadores conmutan tambien aqui
print(np.max(np.abs(diferenciar(uad, 1, 1) - np.diff(uad[12:] - uad[:-12]))))
#&gt; 0

# statsmodels NO trae equivalentes de ndiffs()/nsdiffs(): la decision se toma
# a mano, y las pruebas de raiz unitaria del Capitulo 2 se aplican SIEMPRE a la
# serie ya sin estacionalidad. Sobre USAccDeaths eso reproduce el orden
# "primero D, despues d":
from statsmodels.tsa.stattools import kpss
print(round(kpss(diferenciar(uad, 0, 1), regression="c", nlags=4)[0], 4))
#&gt; 0.8672     valor critico al 5 % = 0.463 -&gt; RECHAZA: falta la diferencia regular
print(round(kpss(diferenciar(uad, 1, 1), regression="c", nlags=4)[0], 4))
#&gt; 0.0713     ya no rechaza: con d = 1 y D = 1 se llega a la estacionariedad</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>Trampa de versión.</strong> <code>nsdiffs()</code> usa por defecto <code>test = "seas"</code>
          (fuerza estacional de la descomposición STL) desde <code>forecast</code> 8.x. Las versiones anteriores usaban
          OCSB, y todavía se puede pedir con <code>test = "ocsb"</code>. <strong>No dan lo mismo:</strong> sobre
          $\log(\text{AirPassengers})$ y sobre <code>USAccDeaths</code>, <code>"seas"</code> devuelve $1$ y
          <code>"ocsb"</code> devuelve $0$. Es la misma clase de trampa que la de <code>ndiffs()</code> y
          <code>kpss.test()</code> del Capítulo 2: <strong>al comparar dos salidas, mira primero qué prueba usa
          cada una</strong>. Aquí manda la evidencia del correlograma, no el número que devuelve la función.</p>
