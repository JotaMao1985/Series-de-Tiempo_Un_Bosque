      <p>El Capítulo 3 terminó con un límite explícito: los modelos ARMA solo describen series
        <strong>estacionarias</strong>. El Capítulo 2 dio la herramienta para llegar a la estacionariedad
        —diferenciar— pero la presentó como preprocesamiento, algo que se hace <em>antes</em>. La idea que organiza
        este capítulo es que esas dos cosas son una sola: si la diferenciación se escribe dentro del modelo, se
        obtiene la familia <strong>ARIMA</strong> (<em>autoregressive integrated moving average</em>), y entonces el
        número de diferencias $d$ se estima, se discute y puede elegirse mal, igual que $p$ y que $q$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso ARIMA($p,d,q$)</h4>
        <p>Con el operador de diferencia $\nabla \equiv 1 - B$, $y_t$ sigue un ARIMA($p,d,q$) si su $d$-ésima
          diferencia $w_t = \nabla^d y_t = (1-B)^d y_t$ sigue un ARMA($p,q$) estacionario e invertible. En una sola
          línea con el operador de rezago:</p>
        $$\begin{gathered}
          \underbrace{\phi(B)}_{\text{AR}(p)}\ \underbrace{(1-B)^d}_{\text{integración}}\ y_t
          = c + \underbrace{\theta(B)}_{\text{MA}(q)}\ \varepsilon_t, \\[0.3em]
          \varepsilon_t \sim \text{RB}(0,\sigma^2)
        \end{gathered}$$
        <p style="margin-bottom:0;">donde $\phi(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$ y
          $\theta(B) = 1 + \theta_1 B + \cdots + \theta_q B^q$, exactamente los del capítulo anterior. La letra
          <strong>I</strong> es de <em>integrated</em>: para volver de $w_t$ a $y_t$ hay que sumar
          (<em>integrar</em>) $d$ veces.</p>
      </div>

      <p>Lo importante de esa fórmula está en el lado izquierdo. El polinomio autorregresivo completo no es
        $\phi(B)$ sino $\phi(B)(1-B)^d$, un polinomio de grado $p+d$ con $d$ raíces colocadas <strong>exactamente
        sobre el círculo unitario</strong>. Un ARIMA no es un ARMA cualquiera: es un ARMA al que se le
        <em>imponen</em> $d$ raíces unitarias en vez de estimarlas. Esa imposición es la decisión más consecuente
        del capítulo, y el Módulo 3 se dedica entero a tomarla bien.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-arima-como-arma">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-arima-como-arma" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Se toma el caso que acompaña todo el capítulo, ARIMA($1,1,1$) sin constante:</p>
              $$(1 - \phi B)(1 - B)\, y_t = (1 + \theta B)\,\varepsilon_t$$
            </li>
            <li>
              <p>Se multiplican los dos factores del lado izquierdo:</p>
              $$\begin{aligned}
                &(1 - \phi B)(1 - B) \\
                &\quad = 1 - B - \phi B + \phi B^2 \\
                &\quad = 1 - (1+\phi)B + \phi B^2
              \end{aligned}$$
            </li>
            <li>
              <p>Es decir, el mismo modelo escrito sobre la serie <strong>sin diferenciar</strong> es un ARMA($2,1$):</p>
              $$\begin{aligned}
                y_t = {}&(1+\phi)\,y_{t-1} - \phi\, y_{t-2} \\
                &+ \varepsilon_t + \theta\,\varepsilon_{t-1}
              \end{aligned}$$
              <p>con coeficientes autorregresivos $\phi_1^{*} = 1+\phi$ y $\phi_2^{*} = -\phi$.</p>
            </li>
            <li>
              <p>¿Es estacionario ese ARMA($2,1$)? Sus raíces son las de
                $1 - (1+\phi)B + \phi B^2 = (1-\phi B)(1-B)$, o sea $B = 1/\phi$ y <strong>$B = 1$</strong>. La
                segunda cae justo sobre el círculo: no lo es, y no puede serlo. Nótese que
                $\phi_1^{*} + \phi_2^{*} = 1$ exactamente, que es la firma de la raíz unitaria.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">Un ARIMA($p,d,q$) <strong>es</strong> un ARMA($p+d, q$) no estacionario con
            $d$ raíces fijadas en $B=1$. Esta expansión no es un adorno algebraico: es la que usará el Módulo 9 para
            calcular los pesos $\psi$ y con ellos el ancho de los intervalos de pronóstico.</p>
        </div>
      </div>

            <tr><td>ARIMA($p,0,q$)</td><td>ARMA($p,q$)</td><td>Todo el Capítulo 3.</td></tr>
            <tr><td>ARIMA($0,1,0$)</td><td>Caminata aleatoria</td><td>$y_t = y_{t-1} + \varepsilon_t$. El

            <tr><td>ARIMA($0,1,0$) con $c$</td><td>Caminata con deriva</td><td>$y_t = c + y_{t-1} +

            <tr><td>ARIMA($0,1,1$)</td><td>IMA(1,1)</td><td>Equivale al <strong>suavizamiento exponencial

            <tr><td>ARIMA($0,2,2$)</td><td>IMA(2,2)</td><td>Equivale al método de <strong>Holt</strong> con
              tendencia.</td></tr>

      </div>

      <div class="note">
        <p><strong>Por qué esto importa más de lo que parece.</strong> Los métodos lineales de suavizamiento

          las herramientas de este capítulo —criterios de información, diagnóstico de residuales, intervalos de
          pronóstico— se aplican también a ellos. Para esos métodos no hay dos teorías, hay una.</p>
      </div>

      <div class="note">
        <h4><i class="fas fa-magnifying-glass mr-2" aria-hidden="true"></i>Una anomalía que vale la pena guardar</h4>
        <p>En el bloque de arriba pasa algo que no cuadra. Integrar una serie estacionaria debería disparar su
          varianza —es lo que ocurre sin el término MA, donde se multiplica por $33$— y con los coeficientes reales
          del Nilo, en esta realización, la deja prácticamente igual: una razón de $1.006$ (el bloque de Python,
          promediando 500 réplicas, obtiene $1.363$; sin el término MA, decenas). La causa está en el valor de
          $\theta$. Escrito con sus raíces, el modelo del Nilo es</p>
        $$\begin{aligned}
          &(1 - 0.2544\,B)\,\underbrace{(1 - B)}_{\text{raíz } B=1}\, y_t \\
          &\quad = \underbrace{(1 - 0.8741\,B)}_{\text{raíz } B=1.144}\,\varepsilon_t
        \end{aligned}$$
        <p style="margin-bottom:0;">El polinomio MA se parece mucho al operador de diferencia $\nabla = 1 - B$: sus
          raíces están a un paso, así que el MA <strong>casi cancela</strong> la integración que el propio modelo
          impone. Dicho de otro modo: el ARIMA($1,1,1$) del Nilo diferencia con una mano y deshace la diferencia con
          la otra. Esto se llama <strong>cancelación casi exacta de raíces</strong> (factores AR y MA casi comunes),
          y no es un tecnicismo: es un síntoma clásico de sobrediferenciación, la pista de que a esta serie quizá no
          había que diferenciarla. El Módulo 3 explica por qué el software decidió que sí, y el Módulo 8 cierra el
          caso.</p>
      </div>

      <div class="warning">
        <p><strong>El signo de $\theta$ no es el mismo en todas partes.</strong> R (<code>arima</code>,
          <code>arima.sim</code>) y <code>statsmodels</code> escriben el polinomio MA como
          $\theta(B) = 1 + \theta_1 B + \cdots$, con signo <strong>más</strong>. Buena parte de la literatura
          —empezando por el Box &amp; Jenkins original— lo escribe con signo menos. Copiar un $\theta$ de un libro a
          R sin mirar el convenio produce otro modelo. Ante la duda, conviene comprobar el signo de la ACF del
          rezago 1: para un MA(1), $\rho_1$ tiene el mismo signo que $\theta$ en el convenio de R.</p>
      </div>

      <p>El Módulo 1 dejó definido el modelo; falta el método para elegirlo y validarlo frente a una serie
        concreta. En 1970 George Box y Gwilym Jenkins publicaron <em>Time Series Analysis: Forecasting and Control</em> y con
        él un procedimiento que sigue siendo el esqueleto de todo lo que se hace con modelos ARIMA. Su aportación no
        fue el modelo —la familia ya existía— sino <strong>el método</strong>: una secuencia de etapas con criterios
        explícitos para pasar de una a la siguiente, y con vueltas atrás previstas.</p>

      <p>La palabra clave es <em>iterativo</em>. No es una receta que se ejecuta una vez de arriba abajo: es un ciclo
        en el que el diagnóstico puede obligar a volver a la identificación tantas veces como haga falta. Al pulsar
        cada etapa se muestra qué se hace en ella y qué la puede invalidar.</p>

        <p class="ciclo-retorno">Las tres primeras etapas forman un bucle: solo se sale de él cuando el diagnóstico

          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Decidir $(p, d, q)$. <strong>Primero $d$</strong>, mirando el gráfico, la varianza por orden de
              diferencia y las pruebas de raíz unitaria; y solo después $p$ y $q$, leyendo la ACF y la PACF de la
              serie <em>ya diferenciada</em>. El orden importa: la ACF de una serie no estacionaria no dice nada
              sobre $p$ y $q$ porque no decae.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>ndiffs()</code>, <code>adf.test()</code>, <code>kpss.test()</code>, <code>acf()</code>,
              <code>pacf()</code>. En Python, <code>adfuller</code>, <code>kpss</code>, <code>plot_acf</code>,
              <code>plot_pacf</code>. Módulos 3 y 4.</p>

            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Es la primera etapa, pero se vuelve a ella <strong>desde el diagnóstico</strong>: residuales con
              estructura significan que el orden propuesto se quedó corto. Y si la varianza cambia con el nivel,
              antes de nada hay que volver al Capítulo 2 y transformar.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-box-jenkins-estimacion" role="tabpanel" hidden>

            <p>Estimar $\phi$, $\theta$ y la constante por máxima verosimilitud, y comparar los candidatos con AICc

          </div>

              <code>forecast</code>; en Python, <code>ARIMA(y, order=(p,d,q)).fit()</code>. Módulo 6.</p>
          </div>

            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Que el ajuste <strong>no converja</strong>, que un coeficiente tenga un error estándar enorme (señal

              de vuelta a la etapa 1 con un orden más pequeño.</p>
          </div>
        </div>

            <p>Comprobar que los residuales son <strong>ruido blanco</strong>: correlograma dentro de la banda,

          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>checkresiduals()</code>, <code>Box.test(..., type = "Ljung-Box", fitdf = p + q)</code>,

              <code>acorr_ljungbox</code>. Módulo 8.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Ljung–Box que rechaza, o barras fuera de la banda con un patrón reconocible. Si el patrón está en los

        <div class="ciclo-panel" id="ciclo-box-jenkins-uso" role="tabpanel" hidden>

            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Pronosticar con intervalos, deshacer las transformaciones para volver a la escala original, e
              interpretar. La forma del pronóstico a largo plazo la deciden $d$ y la constante, no los coeficientes
              ARMA: eso se ve en el Módulo 9.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>forecast(fit, h = ...)</code> y <code>autoplot()</code>; en Python,
              <code>get_forecast(steps=...)</code> y <code>conf_int()</code>.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Un pronóstico cuya <em>forma</em> es absurda para el fenómeno —una recta que crece sin fin, un
              intervalo que abarca valores imposibles— casi siempre delata un $d$ mal elegido. Y la evaluación
              honesta sobre datos que el modelo no vio es el Capítulo 6, que puede mandarte de vuelta al principio.</p>
          </div>
        </div>
      </div>

      <div class="note">
        <p><strong>Lo que Box–Jenkins no resuelve.</strong> El método supone que la estructura del proceso es
          estable en toda la muestra. No detecta cambios de régimen, ni intervenciones, ni atípicos: los
          <em>absorbe</em>, normalmente subiendo $d$ o inflando $\hat\sigma^2$. El Módulo 8 muestra un caso real de
          esto en la propia serie del Nilo, y es la razón por la que la etapa 1 empieza mirando el gráfico.</p>
      </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.3 Elegir $d$
          <span class="text-gray-400 font-normal text-2xl">/ Choosing the order of differencing</span></h2>

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Decidir $d$ con tres evidencias complementarias, y

          </div>

      <p>El ciclo de Box–Jenkins empieza por $d$, y esta es la decisión de la que cuelga todo lo demás. Un $d$ mal
        elegido no produce un modelo un poco peor:
        produce un modelo cuyos criterios de información no se pueden comparar con los del $d$ correcto, cuyos
        residuales pueden pasar el diagnóstico igualmente, y cuyo pronóstico a largo plazo tiene la forma
        equivocada. Conviene apoyarla en <strong>tres evidencias complementarias</strong>, que miran la serie desde
        ángulos distintos.</p>

      <div class="diagram">
        <table style="position:relative;">
          <thead>
            <tr><th>Evidencia</th><th>Qué mirar</th><th>Qué dice sobre el Nilo</th></tr>
          </thead>
          <tbody>
            <tr><td><strong>1. El gráfico</strong></td><td>¿El nivel vaga sin volver a ningún sitio?
              ¿Hay saltos?</td><td>A primera vista parece vagar, pero el rasgo dominante es un descenso brusco
              alrededor de 1899.</td></tr>
            <tr><td><strong>2. La varianza</strong></td><td>$\operatorname{Var}(\nabla^d y)$ debe
              <em>bajar</em> y luego <em>subir</em> al pasarse</td><td>$28\,638 \to 28\,268 \to 80\,055 \to
              262\,507$: el mínimo está en $d = 1$.</td></tr>
            <tr><td><strong>3. Las pruebas</strong></td><td>ADF y PP ($H_0$: hay raíz unitaria) y KPSS ($H_0$:
              es estacionaria)</td><td>ADF de <code>adf.test</code> (constante y tendencia, $k = 4$) $-3.366$
              ($p = 0.064$, no rechaza); KPSS $0.965$ ($p &lt; 0.01$, rechaza la estacionariedad). Estas dos apuntan a
              diferenciar. PP, en cambio, $Z(t_\alpha) = -6.690$ ($p &lt; 0.01$), rechaza la raíz unitaria.</td></tr>
          </tbody>
        </table>
      </div>

      <p>Las pruebas no contrastan lo mismo. ADF (y PP, que corrige la autocorrelación de forma no paramétrica en
        vez de con rezagos) parte de la raíz unitaria; KPSS invierte la hipótesis nula. ADF ajusta la regresión</p>
      $$\begin{aligned}
        \nabla y_t &= \alpha_0 + \alpha_1 t + \gamma\, y_{t-1} \\
          &\quad + \sum_{j=1}^{k} a_j \nabla y_{t-j} + \varepsilon_t
      \end{aligned}$$
      <p>y contrasta $H_0:\ \gamma = 0$, la raíz unitaria. KPSS descompone la serie en un nivel que puede pasear y
        un ruido estacionario,</p>
      $$\begin{aligned}
        y_t &= \mu + r_t + u_t, \\
        r_t &= r_{t-1} + v_t,
      \end{aligned}$$
      <p>y contrasta $H_0:\ \sigma_v^2 = 0$: sin paseo, la serie es estacionaria alrededor de $\mu$.</p>
      <p><code>adf.test()</code> incluye la constante $\alpha_0$ y la tendencia $\alpha_1 t$ con $k = 4$; como se verá
        enseguida, no es la única especificación posible, y el resultado depende de ella.</p>

      <p>La caída de la varianza de $d=0$ a $d=1$ es aquí llamativamente pequeña —de $28\,638$ a $28\,268$, apenas un
        $1.3\,\%$— mientras que pasar a $d=2$ la casi triplica. Que el mínimo esté en $d=1$ pero por tan poco margen
        es un aviso: hay algo en esta serie que no encaja con la historia habitual de la raíz unitaria, y el Módulo 8
        lo destapa.</p>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Tres pruebas, tres respuestas, la
          misma serie</h4>
        <p>La función <code>ndiffs()</code> devuelve el $d$ recomendado, pero <strong>depende de la prueba que se
          le pida</strong>, y sobre el Nilo las tres no coinciden:</p>
        $$\begin{aligned}
          {\footnotesize\texttt{ndiffs(Nile, test = "kpss")}} &= 1 \\
          {\footnotesize\texttt{ndiffs(Nile, test = "adf")}} &= 0 \\
          {\footnotesize\texttt{ndiffs(Nile, test = "pp")}} &= 0
        \end{aligned}$$
        <p style="margin-bottom:0;">Dos de las tres dicen que <strong>no</strong> hay que diferenciar. Y el valor por
          defecto de <code>ndiffs()</code> —y por tanto el que usa <code>auto.arima()</code>— es KPSS, la única que
          dice que sí. Hay además un matiz: el ADF de <code>ndiffs()</code> no es el de <code>adf.test()</code> de la tabla.
          Usa solo constante y un rezago ($\alpha_1 = 0$, $k = 1$), y con esa especificación rechaza la raíz
          unitaria ($\tau_\mu = -4.05$, frente al valor crítico de $-2.89$ al $5\,\%$); con la de la tabla no la
          rechaza. No es un fallo de ninguna función: KPSS invierte la hipótesis nula, y ADF y PP, que comparten la
          de raíz unitaria, corrigen la autocorrelación de forma distinta y tienen potencias distintas. Cuando
          discrepan, la respuesta no está en la prueba sino en el gráfico, y en esta serie hay una razón
          concreta.</p>
      </div>

      <h3>Un experimento: ¿qué ve KPSS cuando hay un cambio de nivel?</h3>

      <p>Sospecha razonable: el descenso de 1899 no es una raíz unitaria, es un <strong>escalón</strong> (en lo
        que sigue, de tamaño $\beta$). Una serie
        estacionaria alrededor de dos niveles distintos no vuelve a una media única, y eso es exactamente lo que
        KPSS está diseñado para detectar como "no estacionariedad". Si la sospecha es cierta, KPSS debería rechazar
        incluso en series que <em>por construcción</em> no tienen ninguna raíz unitaria.</p>

      <p>Se puede comprobar. Se generan series de ruido blanco puro de la misma longitud y desviación que los

        y se cuenta cuántas veces rechaza KPSS:</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-kpss-escalon">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-kpss-escalon" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>El estadístico KPSS se construye sobre las <strong>sumas parciales</strong> de los residuales de
                regresar la serie contra una constante, $e_t = y_t - \bar{y}$:</p>
              $$\begin{aligned}
                S_t &= \sum_{i=1}^{t} e_i, \\
                \mathrm{KPSS} &= \frac{1}{n^2\hat\sigma_{LP}^2}\sum_{t=1}^{n} S_t^2
              \end{aligned}$$
              <p>donde $\hat\sigma_{LP}^2$ es una estimación de la varianza de largo plazo.</p>
            </li>
            <li>
              <p>Si $y_t$ es estacionaria alrededor de una media única, los $e_t$ se compensan y $S_t$ se queda
                pequeño: fluctúa alrededor de cero como un puente browniano. El estadístico es pequeño.</p>
            </li>
            <li>
              <p>Si $y_t$ tiene una raíz unitaria, los $e_t$ se comportan como una caminata (crecen como
                $\sqrt t$) y $S_t$ crece como $t^{3/2}$: las sumas parciales se disparan y el estadístico diverge.
                Esto es lo que la prueba quiere detectar.</p>
            </li>
            <li>
              <p>Ahora el escalón: $y_t = \mu + \beta\,\mathbf{1}\{t \ge \tau n\} + u_t$, con el salto en la
                fracción $\tau$ de la muestra ($\tau \approx 0.28$ en el Nilo). La media muestral queda entre los
                dos niveles, así que</p>
              $$e_t \approx \begin{cases} -(1-\tau)\,\beta, &amp; t &lt; \tau n \\ \ \ \tau\,\beta, &amp; t \ge \tau n \end{cases}$$
              $$\Longrightarrow\quad \max_t |S_t| \approx \tau(1-\tau)\, n\,|\beta|$$
              <p>Los $e_t$ <strong>no se compensan localmente</strong>: todos los de un mismo tramo tienen el mismo
                signo. $S_t$ crece linealmente hasta el salto y decrece linealmente después, de modo que</p>
              $$\begin{gathered}
                \sum_t S_t^2 \sim n^3\beta^2 \\
                \Longrightarrow\quad \mathrm{KPSS} \sim \frac{n\,\beta^2}{\hat\sigma_{LP}^2}
              \end{gathered}$$
            </li>
            <li>
              <p>El estadístico crece con $n$ y con $\beta^2$. Con datos suficientes, <strong>cualquier</strong>
                escalón acaba haciéndolo rechazar. Y eso es lo que mide la curva del simulador. El escalón también
                engorda $\hat\sigma^2_{LP}$, porque añade a las autocovarianzas de $e_t$ un término proporcional a
                $\beta^2$; por eso, para escalones grandes, el estadístico medio deja de crecer y se estabiliza
                (de $1.07$ con $\beta = 200$ a $1.23$ con $\beta = 300$), muy por encima del valor crítico de
                $0.463$.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">KPSS no distingue "hay raíz unitaria" de "hay un cambio de nivel": las dos
            cosas hacen que las sumas parciales se disparen. La prueba está haciendo su trabajo —la serie no es
            estacionaria alrededor de una media constante—; el error es traducir su rechazo por "hay que
            diferenciar".</p>
        </div>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>R y Python no calculan el mismo KPSS
          por defecto</h4>
        <p>Sobre la misma serie del Nilo, <code>tseries::kpss.test</code> devuelve $0.9654$ y
          <code>statsmodels.kpss</code>, con su opción por defecto (<code>nlags="auto"</code>, 5 rezagos), devuelve
          $0.8691$; con <code>nlags="legacy"</code> (12 rezagos) baja a $0.5497$, casi la mitad. No es un error de
          ninguno de los dos: es el <strong>truncamiento de la varianza de largo plazo</strong>, el parámetro $\ell$
          que decide cuántas autocovarianzas entran en el estimador de Bartlett</p>
        $$\begin{aligned}
          \hat\sigma^2_{LP} &= \hat\gamma_0 + 2\sum_{j=1}^{\ell}\Bigl(1 - \tfrac{j}{\ell+1}\Bigr)\hat\gamma_j \\
          \ell_{\text{R}} &= \left\lfloor 4\left(\tfrac{n}{100}\right)^{1/4}\right\rfloor = 4 \\
          \ell_{\texttt{legacy}} &= \left\lceil 12\left(\tfrac{n}{100}\right)^{1/4}\right\rceil = 12
        \end{aligned}$$
        <p style="margin-bottom:0;">Aquí, con autocorrelaciones positivas, más rezagos inflan $\hat\sigma_{LP}^2$,
          que está en el denominador, y por eso el estadístico baja. Con <code>nlags=4</code> los dos coinciden hasta
          el último decimal. Es la misma clase de trampa que el Capítulo 2 documentó entre <code>ndiffs()</code> y
          <code>kpss.test()</code>: <strong>al comparar salidas de dos programas, conviene mirar primero qué
          truncamiento usa cada uno</strong>. Y con $\ell = 12$ la prueba pierde potencia: en el experimento del
          escalón, con $\beta = 100$, la tasa de rechazo baja del $70.8\,\%$ ($\ell = 4$) al $44.5\,\%$
          ($\ell = 12$).</p>
      </div>

      <div class="note">
        <p><strong>La regla práctica.</strong> $d$ casi nunca pasa de 2, y en series económicas casi nunca de 1. Si
          parece necesario $d = 3$, casi seguro el problema es otro: una transformación pendiente, un atípico, o
          justamente un cambio de nivel. Antes de subir $d$, conviene volver al gráfico.</p>
      </div>

      <p>Queda, entonces, una decisión abierta. Por ahora se sigue la de <code>auto.arima()</code> —la de KPSS—,
        $d = 1$, a sabiendas de que es <strong>provisional</strong>: el Módulo 4 identifica $p$ y $q$ sobre
        $\nabla$Nilo, los Módulos 5 a 7 deciden la constante, estiman y comparan candidatos hasta llegar al
        ARIMA($1,1,1$), y el Módulo 8 lo pone a prueba contra
        la alternativa que este módulo dejó planteada, un modelo de dos medias sin diferenciar.</p>
    </div>
