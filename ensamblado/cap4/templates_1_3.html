            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Entender que el orden $d$ no es un paso de limpieza
              previo sino <strong>parte del modelo</strong>, y ver qué le hace al polinomio característico.</p>

      <p>El Capítulo 3 terminó con un límite explícito: <span data-afirma="c4-m1-29">los modelos ARMA se plantean para series
        <strong>estacionarias</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 55"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 55)</a></cite></span>. El Capítulo 2 dio la herramienta para llegar a la estacionariedad
        —diferenciar— pero la presentó como preprocesamiento, algo que se hace <em>antes</em>. La idea que organiza
        este capítulo es que esas dos cosas son una sola: <span data-afirma="c4-m1-60">si la diferenciación se escribe dentro del modelo, se
        obtiene la familia <strong>ARIMA</strong> (<em>autoregressive integrated moving average</em>) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>, y entonces el
        número de diferencias $d$ se estima, se discute y puede elegirse mal, igual que $p$ y que $q$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso ARIMA($p,d,q$)</h4>
        <p>Con el operador de diferencia $\nabla \equiv 1 - B$, <span data-afirma="c4-m1-01">$y_t$ sigue un ARIMA($p,d,q$) si su $d$-ésima
          diferencia $w_t = \nabla^d y_t = (1-B)^d y_t$ sigue un ARMA($p,q$) estacionario e invertible <cite class="cita" data-ref="cryer2008time" data-loc="p. 92"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 92)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. <span data-afirma="c4-m1-02">En una sola
          línea con el operador de rezago <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>:</p>
        $$\begin{gathered}
          \underbrace{\phi(B)}_{\text{AR}(p)}\ \underbrace{(1-B)^d}_{\text{integración}}\ y_t
          = c + \underbrace{\theta(B)}_{\text{MA}(q)}\ \varepsilon_t, \\[0.3em]
          \varepsilon_t \sim \text{RB}(0,\sigma^2)
        \end{gathered}$$
        <p style="margin-bottom:0;"><span data-afirma="c4-m1-03">donde $\phi(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$ y
          $\theta(B) = 1 + \theta_1 B + \cdots + \theta_q B^q$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>, exactamente los del capítulo anterior. <span data-afirma="c4-m1-04">La letra
          <strong>I</strong> es de <em>integrated</em>: para volver de $w_t$ a $y_t$ hay que sumar
          (<em>integrar</em>) $d$ veces <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. La constante $c$ cambia de significado según $d$: la trata el Módulo 5, y
          hasta entonces el modelo va sin ella.</p>
      </div>

      <p>Lo importante de esa fórmula está en el lado izquierdo. <span data-afirma="c4-m1-05">El polinomio autorregresivo completo no es
        $\phi(B)$ sino $\phi(B)(1-B)^d$, un polinomio de grado $p+d$ con $d$ raíces colocadas <strong>exactamente
        sobre el círculo unitario</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 93"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 93)</a></cite></span>. <span data-afirma="c4-m1-65">Un ARIMA no es un ARMA cualquiera: es un ARMA al que se le
        <em>imponen</em> $d$ raíces unitarias en vez de estimarlas.</span> Esa imposición es la decisión más consecuente
        del capítulo, y el Módulo 3 se dedica entero a tomarla bien.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-arima-como-arma">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-arima-como-arma" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Se toma el caso que acompaña todo el capítulo, ARIMA($1,1,1$) sin constante:</p>
              $$(1 - \phi B)(1 - B)\, y_t = (1 + \theta B)\,\varepsilon_t$$
            </li>
            <li>
              <p>Se multiplican los dos factores del lado izquierdo:</p>
              $$\begin{aligned}
                &(1 - \phi B)(1 - B) \\
                &\quad = 1 - B - \phi B + \phi B^2 \\
                &\quad = 1 - (1+\phi)B + \phi B^2
              \end{aligned}$$
            </li>
            <li>
              <p data-afirma="c4-m1-06">Es decir, el mismo modelo escrito sobre la serie <strong>sin diferenciar</strong> es un ARMA($2,1$) <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite>:</p>
              $$\begin{aligned}
                y_t = {}&(1+\phi)\,y_{t-1} - \phi\, y_{t-2} \\
                &+ \varepsilon_t + \theta\,\varepsilon_{t-1}
              \end{aligned}$$
              <p data-afirma="c4-m1-67">con coeficientes autorregresivos $\phi_1^{*} = 1+\phi$ y $\phi_2^{*} = -\phi$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite>.</p>
            </li>
            <li>
              <p>¿Es estacionario ese ARMA($2,1$)? Sus raíces son las de
                $1 - (1+\phi)B + \phi B^2 = (1-\phi B)(1-B)$, o sea $B = 1/\phi$ y <strong>$B = 1$</strong>. La
                segunda cae justo sobre el círculo: no lo es, y no puede serlo. <span data-afirma="c4-m1-07">Nótese que
                $\phi_1^{*} + \phi_2^{*} = 1$ exactamente, que es la firma de la raíz unitaria.</span></p>
            </li>
          </ol>
          <p class="derivacion-resultado"><span data-afirma="c4-m1-08">Un ARIMA($p,d,q$) <strong>es</strong> un ARMA($p+d, q$) no estacionario con
            $d$ raíces fijadas en $B=1$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite></span>. Esta expansión no es un adorno algebraico: es la que usará el Módulo 9 para
            calcular los pesos $\psi$ y con ellos el ancho de los intervalos de pronóstico.</p>
        </div>
      </div>

      <h3>Casos particulares</h3>

      <p>Dos de las filas nombran métodos de pronóstico que los capítulos anteriores no presentaron. <span data-afirma="c4-m1-61">El
        <strong>suavizamiento exponencial simple</strong> pronostica con un promedio ponderado de todo el pasado, con
        pesos que decaen geométricamente <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§8.1"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §8.1)</a></cite>: cada pronóstico corrige el anterior con una fracción $\alpha$ de su error <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§8.5"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §8.5)</a></cite></span>.
        <span data-afirma="c4-m1-62">El método de <strong>Holt</strong> hace lo mismo con el nivel y con la pendiente de la serie <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§8.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §8.2)</a></cite></span>. Aquí solo
        importa que los dos resultan ser ARIMA con los coeficientes restringidos: el capítulo no los usa más allá de
        esa equivalencia.</p>

      <div class="note">
        <p><strong>Por qué esto importa más de lo que parece.</strong> <span data-afirma="c4-m1-14">Los modelos lineales de suavizamiento
          exponencial, que se enseñan como recetas independientes, son casos particulares de ARIMA <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.10"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.10)</a></cite></span>. <span data-afirma="c4-m1-64">Eso significa que,
          escritos como ARIMA, admiten las herramientas de este capítulo: criterios de información, diagnóstico de
          residuales e intervalos de pronóstico.</span> <span data-afirma="c4-m1-63">Pero las dos clases de modelos solo se solapan: hay modelos ARIMA sin
          equivalente de suavizamiento exponencial, los modelos de suavizamiento exponencial no lineales no tienen
          equivalente ARIMA, y el AICc no sirve para comparar un modelo de una clase con uno de la otra, porque la
          verosimilitud se calcula de otro modo <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.10"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.10)</a></cite> <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 12"><a href="#ref-m1-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 12)</a></cite></span>.</p>
      </div>

          más que vagar sin rumbo, <span data-afirma="c4-m1-16">su nivel parece caer de golpe hacia 1899</span>. Luego sube $d$ y lee los números de

          aparte: el Módulo 3 explica por qué repite lo que ya dice $\hat\rho_1$. ¿Hacía falta diferenciar?</p>

          <pre><code class="language-r">data(Nile)          # datasets de R base: caudal anual 1871-1970
length(Nile)
#&gt; [1] 100

# El modelo que acompana todo el capitulo: un ARIMA(1,1,1) para el Nilo,
# por maxima verosimilitud (el estimador del Capitulo 3)
f &lt;- arima(Nile, order = c(1, 1, 1), method = "ML")
round(rbind(coef = coef(f), ee = sqrt(diag(f$var.coef))), 4)
#&gt;         ar1     ma1
#&gt; coef 0.2544 -0.8741
#&gt; ee   0.1194  0.0605
phi   &lt;- round(coef(f)[["ar1"]], 4)       #  0.2544
theta &lt;- round(coef(f)[["ma1"]], 4)       # -0.8741
round(Mod(polyroot(c(1, theta))), 3)      # la raiz del polinomio MA
#&gt; [1] 1.144

# Un ARIMA(1,1,1) es un ARMA(2,1) con una raiz unitaria impuesta.
# Se comprueba expandiendo el polinomio:
ar_expandido &lt;- c(1 + phi, -phi)     # phi*_1 = 1 + phi, phi*_2 = -phi
round(ar_expandido, 4)
#&gt; [1]  1.2544 -0.2544
sum(ar_expandido)                    # la firma de la raiz unitaria: suma 1
#&gt; [1] 1

round(Mod(polyroot(c(1, -ar_expandido))), 4)
#&gt; [1] 1.0000 3.9308           una raiz JUSTO sobre el circulo unitario

# Simular un ARIMA(1,1,1) es simular el ARMA(1,1) y acumular (integrar):
set.seed(2026)
w &lt;- arima.sim(list(ar = phi, ma = theta), n = 200)       # la diferencia
y &lt;- cumsum(w)                                            # la serie integrada
round(c(var_w = var(w), var_y = var(y), razon = var(y) / var(w)), 3)
#&gt;  var_w  var_y  razon
#&gt;  1.426  1.434  1.006     &lt;- ?! integrar NO disparo la varianza

# Con el mismo AR pero SIN el termino MA la historia es la esperada:
set.seed(2026)
w0 &lt;- arima.sim(list(ar = phi), n = 200)
round(var(cumsum(w0)) / var(w0), 1)
#&gt; [1] 32.8                  aqui integrar la multiplica por 32.8

# arima.sim lo hace directamente con order = c(p, d, q)
set.seed(2026)
y2 &lt;- arima.sim(list(order = c(1, 1, 1), ar = phi, ma = theta), n = 200)
length(y2)                # devuelve n + d valores (arranca en y_0)

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import statsmodels.api as sm
from statsmodels.tsa.arima_process import ArmaProcess
from statsmodels.tsa.arima.model import ARIMA

nilo = sm.datasets.nile.load_pandas().data["volume"].values
print(len(nilo))
#&gt; 100

# El modelo que acompana todo el capitulo: un ARIMA(1,1,1) para el Nilo
ajuste = ARIMA(nilo, order=(1, 1, 1), trend="n").fit()
print(np.round(ajuste.params[:2], 4), np.round(ajuste.bse[:2], 4))
#&gt; [ 0.2549 -0.8749] [0.1287 0.0546]
#   R da 0.2544 y -0.8741, con e.e. 0.1194 y 0.0605: otro arranque y otra
#   covarianza, la misma lectura. Abajo se usan los de R, para que las
#   cifras de los dos lenguajes se puedan comparar
phi, theta = 0.2544, -0.8741

# El mismo polinomio expandido
ar_expandido = np.array([1 + phi, -phi])
print(np.round(ar_expandido, 4), ar_expandido.sum())
#&gt; [ 1.2544 -0.2544] 1.0

# np.roots recibe los coeficientes en orden DESCENDENTE, al reves que polyroot
coef = np.r_[1.0, -ar_expandido]              # orden ascendente
print(np.round(np.abs(np.roots(coef[::-1])), 4))
#&gt; [3.9308 1.    ]     mismas raices que R, en el orden contrario

# Simular: ArmaProcess pide los polinomios con el signo YA aplicado.
# El generador de numeros aleatorios NO es el de R, asi que una realizacion
# suelta no coincide; se promedian 500 para que la comparacion signifique algo.
proceso  = ArmaProcess(ar=np.r_[1, -phi], ma=np.r_[1, theta])
proceso0 = ArmaProcess(ar=np.r_[1, -phi], ma=np.r_[1])         # sin termino MA
rng = np.random.default_rng(7)
razon  = np.mean([np.cumsum(w).var() / w.var()
                  for w in (proceso.generate_sample(200, distrvs=rng.standard_normal)
                            for _ in range(500))])
razon0 = np.mean([np.cumsum(w).var() / w.var()
                  for w in (proceso0.generate_sample(200, distrvs=rng.standard_normal)
                            for _ in range(500))])
print(round(razon, 3), round(razon0, 1))
#&gt; 1.363 56.7
#   con el theta del Nilo integrar casi no cambia la varianza; sin el termino
#   MA la multiplica por decenas (en R, con su propio generador, sale 1.006 y
#   32.8: el mensaje es el mismo)</code></pre>
        </div>
      </div>

      <div class="note">
        <h4><i class="fas fa-magnifying-glass mr-2" aria-hidden="true"></i>Una anomalía que vale la pena guardar</h4>
        <p>En el bloque de arriba pasa algo que no cuadra. <span data-afirma="c4-m1-23">Integrar una serie estacionaria debería disparar su
          varianza —es lo que ocurre sin el término MA, donde se multiplica por $32.8$— y con los coeficientes
          estimados del Nilo, en esta realización, la deja prácticamente igual: una razón de $1.006$</span> (el bloque de Python,
          promediando 500 réplicas, obtiene $1.363$; sin el término MA, decenas). <span data-afirma="c4-m1-66">La causa está en el valor de
          $\theta$.</span> Escrito con sus raíces, el modelo del Nilo es</p>
        $$\begin{aligned}
          &(1 - 0.2544\,B)\,\underbrace{(1 - B)}_{\text{raíz } B=1}\, y_t \\
          &\quad = \underbrace{(1 - 0.8741\,B)}_{\text{raíz } B=1.144}\,\varepsilon_t
        \end{aligned}$$
        <p style="margin-bottom:0;">El polinomio MA se parece mucho al operador de diferencia $\nabla = 1 - B$: sus
          raíces están a un paso, así que el MA <strong>casi cancela</strong> la integración que el propio modelo
          impone. Dicho de otro modo: el ARIMA($1,1,1$) del Nilo diferencia con una mano y deshace la diferencia con
          la otra. <span data-afirma="c4-m1-24">Esto es una <strong>cancelación casi exacta de raíces</strong> (factores AR y MA casi comunes) <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m1-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite></span>,
          <span data-afirma="c4-m1-25">y no es un tecnicismo: la sobrediferenciación deja justamente una raíz del MA en $B=1$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite>, de modo que es una pista de que a esta serie quizá no
        había que diferenciarla</span>. El Módulo 3 explica por qué la regla automática que elige $d$ decidió que sí, y el Módulo 8 cierra el
          caso.</p>
      </div>

      <div class="warning">
        <p><strong>El signo de $\theta$ no es el mismo en todas partes.</strong> <span data-afirma="c4-m1-27">R (<code>arima</code>,
          <code>arima.sim</code>) y <code>statsmodels</code> escriben el polinomio MA como
          $\theta(B) = 1 + \theta_1 B + \cdots$, con signo <strong>más</strong> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. <span data-afirma="c4-m1-26">Algunos textos y la documentación de S-PLUS lo escriben con signo menos <cite class="cita" data-ref="cryer2008time" data-loc="p. 57"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 57)</a></cite> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. Copiar un $\theta$ de un libro a
          R sin mirar el convenio produce otro modelo. Ante la duda, conviene comprobar el signo de la ACF del
          rezago 1: <span data-afirma="c4-m1-28">para un MA(1), $\rho_1$ tiene el mismo signo que $\theta$ en el convenio de R <cite class="cita" data-ref="hamilton1994time" data-loc="p. 49"><a href="#ref-m1-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 49)</a></cite></span>.</p>
      </div>

      <p>Con el modelo definido queda la pregunta práctica: frente a una serie concreta, ¿cómo se eligen $p$, $d$ y
        $q$, y cómo se sabe que la elección fue buena? El módulo siguiente presenta el procedimiento que responde
        a ambas cosas.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>tcm1y</code>, del paquete <code>tseries</code> (se carga con <code>data(tcm)</code>), es el rendimiento mensual a un año de los títulos del Tesoro de Estados Unidos: 558 datos, de abril de 1953 a septiembre de 1999. Ajústale dos modelos, sin diferenciarla antes, y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>Un AR(2) con media: la suma $\hat\phi_1 + \hat\phi_2$ y el módulo de sus dos raíces.</li>
            <li>Un ARIMA($1,1,0$), escrito como AR(2) sobre $y_t$ con el desarrollo del módulo: $\phi_1^{*}$ y $\phi_2^{*}$, su suma y el módulo de sus raíces.</li>
            <li>El pronóstico de cada modelo a 1, 5 y 10 años, con su error estándar. ¿En qué se nota que uno estima la raíz y el otro la impone?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m1-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m1-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m1-pista" hidden>
            <p style="margin:0;">Para (b), una vez ajustado el ARIMA($1,1,0$), no hace falta nada más: el desarrollo paso a paso del módulo dice cómo pasar de $\phi$ a $(\phi_1^{*},\ \phi_2^{*})$. Para (c), <code>predict()</code> devuelve el pronóstico y su error estándar; mira hacia dónde va cada uno al alejarse.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m1-sol" hidden>
            <p><strong>Respuesta: los dos modelos son un AR(2) sobre $y_t$ con coeficientes casi iguales. La diferencia está en una raíz: el AR(2) la estima en $1.028$ y el ARIMA($1,1,0$) la fija en $1$, y de eso depende todo el pronóstico a largo plazo.</strong></p>
            <pre><code class="language-r">library(tseries); data(tcm)       # tcm1y: rendimiento a un anio, mensual
y &lt;- tcm1y
length(y)
#&gt; [1] 558

# (a) AR(2) con media, sin diferenciar: la raiz se ESTIMA
ar2 &lt;- arima(y, order = c(2, 0, 0), method = "ML")
round(coef(ar2), 4)
#&gt;       ar1       ar2 intercept
#&gt;    1.3429   -0.3599    5.8072
round(c(suma = sum(coef(ar2)[1:2]), modulo = sort(Mod(polyroot(c(1, -coef(ar2)[1:2]))))), 4)
#&gt;    suma modulo1 modulo2
#&gt;  0.9830  1.0278  2.7033

# (b) ARIMA(1,1,0): la raiz se IMPONE. Escrito sobre y_t es un AR(2)
ari &lt;- arima(y, order = c(1, 1, 0), method = "ML")
phi &lt;- coef(ari)[["ar1"]]
round(c(phi = phi, phi1_estrella = 1 + phi, phi2_estrella = -phi), 4)
#&gt;           phi phi1_estrella phi2_estrella
#&gt;        0.3518        1.3518       -0.3518
round(c(suma = (1 + phi) - phi, modulo = sort(Mod(polyroot(c(1, -(1 + phi), phi))))), 4)
#&gt;    suma modulo1 modulo2
#&gt;  1.0000  1.0000  2.8423

# (c) lo que pronostica cada uno a 1, 5 y 10 anios
h &lt;- c(12, 60, 120)
p2 &lt;- predict(ar2, n.ahead = 120); p1 &lt;- predict(ari, n.ahead = 120)
round(rbind(AR2 = p2$pred[h], ARIMA110 = p1$pred[h], ee_AR2 = p2$se[h], ee_ARIMA110 = p1$se[h]), 2)
#&gt;             [,1] [,2] [,3]
#&gt; AR2         5.42 5.70 5.79
#&gt; ARIMA110    5.28 5.28 5.28
#&gt; ee_AR2      1.98 2.89 2.95
#&gt; ee_ARIMA110 2.24 5.18 7.36
round(c(ultimo_dato = as.numeric(tail(y, 1)), desv_tipica_de_la_serie = sd(y)), 2)
#&gt;             ultimo_dato desv_tipica_de_la_serie
#&gt;                    5.25                    2.98</code></pre>
            <p><strong>(a)</strong> El AR(2) da $(1.3429,\ -0.3599)$: suman $0.9830$, y las raíces tienen módulo $1.0278$ y $2.7033$. Es estacionario por poco: una raíz queda a menos de tres centésimas del círculo unitario.</p>
            <p><strong>(b)</strong> El ARIMA($1,1,0$) da $\hat\phi = 0.3518$, así que sobre $y_t$ es el AR(2) con $\phi_1^{*} = 1.3518$ y $\phi_2^{*} = -0.3518$: suman $1$ exactamente, y sus raíces tienen módulo $1$ y $2.8423$ (que es $1/\hat\phi$). Los coeficientes se parecen a los de (a); lo que cambia es que aquí la suma no se estima: la fija el factor $(1-B)$.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El AR(2) vuelve a su media, $5.81$: pronostica $5.42$, $5.70$ y $5.79$, y su error estándar se estabiliza cerca de la desviación típica de la serie ($2.95$ a diez años, frente a $2.98$). El ARIMA($1,1,0$) se queda en $5.28$, junto al último dato ($5.25$), y su error estándar no deja de crecer: $2.24$, $5.18$ y $7.36$. Una raíz en $1.028$ o en $1$ apenas cambia el ajuste y cambia por completo lo que el modelo dice del futuro lejano. Por eso el módulo llama a $d$ una decisión: el Módulo 3 enseña a tomarla, y el Módulo 9, de dónde salen esos errores estándar.</p>
          </div>
        </div>
      </div>

  <template id="module-2">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 2</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.2 La metodología de
          Box–Jenkins <span class="text-gray-400 font-normal text-2xl">/ The Box–Jenkins method</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Recorrer el ciclo completo y, sobre todo, saber
              <strong>qué hallazgo obliga a volver a la etapa anterior</strong>.</p>
          </div>
        </div>
      </div>

      <p>El Módulo 1 dejó definido el modelo; falta el método para elegirlo y validarlo frente a una serie
        concreta. <span data-afirma="c4-m2-01">En 1970 Box y Jenkins publicaron <em>Time Series Analysis: Forecasting and Control</em>, el texto que popularizó el modelado ARIMA <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.12"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.12)</a></cite></span>. Su
        procedimiento, que <span data-afirma="c4-m2-02">muchos autores llaman <strong>método de Box–Jenkins</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 109"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 109)</a></cite></span>, es una secuencia de etapas con criterios
        explícitos para pasar de una a la siguiente, y con vueltas atrás previstas.</p>

      <p>La palabra clave es <em>iterativo</em>. <span data-afirma="c4-m2-04">No es una receta que se ejecuta una vez de arriba abajo: es un ciclo
        en el que el diagnóstico puede obligar a volver a la identificación tantas veces como haga falta <cite class="cita" data-ref="cryer2008time" data-loc="p. 8"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 8)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. Al pulsar
        cada etapa se muestra qué se hace en ella y qué la puede invalidar.</p>

      <div class="ciclo" data-ciclo="box-jenkins">
        <ol class="ciclo-etapas" role="tablist" aria-label="Etapas del ciclo">
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="true" aria-controls="ciclo-box-jenkins-identificacion" tabindex="0">
              <span class="ciclo-numero">Etapa 1</span>
              <span class="ciclo-titulo">Identificación</span>
              <span class="ciclo-resumen">¿Qué orden proponer?</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-box-jenkins-estimacion" tabindex="-1">
              <span class="ciclo-numero">Etapa 2</span>
              <span class="ciclo-titulo">Estimación</span>
              <span class="ciclo-resumen">¿Cuánto valen los coeficientes?</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-box-jenkins-diagnostico" tabindex="-1">
              <span class="ciclo-numero">Etapa 3</span>
              <span class="ciclo-titulo">Diagnóstico</span>
              <span class="ciclo-resumen">¿Sobra estructura?</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-box-jenkins-uso" tabindex="-1">
              <span class="ciclo-numero">Etapa 4</span>
              <span class="ciclo-titulo">Uso</span>
              <span class="ciclo-resumen">Pronosticar y explicar</span>
            </button>
          </li>
        </ol>
        <p class="ciclo-retorno"><span data-afirma="c4-m2-05">Las etapas 2, 3 y 4 pueden mandar de vuelta a la identificación. Solo se llega a
          pronosticar cuando el diagnóstico no encuentra nada que objetar <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>, y aun entonces la forma del pronóstico
          puede delatar un $d$ mal elegido.</p>
        <div class="ciclo-panel" id="ciclo-box-jenkins-identificacion" role="tabpanel">
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Decidir $(p, d, q)$. <span data-afirma="c4-m2-06"><strong>Primero $d$</strong>, mirando el gráfico y la ACF, las pruebas de raíz
              unitaria y, si ya se diferenció, los síntomas de haberlo hecho de más; y solo después $p$ y $q$,
              leyendo la ACF y la PACF de la serie <em>ya diferenciada</em> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. <span data-afirma="c4-m2-07">El orden importa: la ACF de una serie no estacionaria no suele mostrar un patrón con el que leer $p$ y $q$, porque no decae con rapidez <cite class="cita" data-ref="cryer2008time" data-loc="p. 125"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 125)</a></cite></span>.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>ndiffs()</code>, <code>adf.test()</code>, <code>kpss.test()</code>, <code>acf()</code>,
              <code>pacf()</code>. En Python, <code>adfuller</code>, <code>kpss</code>, <code>plot_acf</code>,
              <code>plot_pacf</code>. Módulos 3 y 4.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Es la primera etapa, pero se vuelve a ella <strong>desde el diagnóstico</strong>: residuales con
              estructura significan que el orden propuesto se quedó corto. <span data-afirma="c4-m2-23">Y si la varianza cambia con el nivel,
              antes de nada hay que volver al Capítulo 2 y transformar <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§3.1"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §3.1)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-box-jenkins-estimacion" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p><span data-afirma="c4-m2-08">Estimar $\phi$, $\theta$ y la constante por máxima verosimilitud, y comparar los candidatos con AICc
              y BIC — <strong>siempre dentro del mismo $d$</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>. <span data-afirma="c4-m2-09">Comprobar además que los coeficientes tienen
              sentido: errores estándar razonables y raíces fuera del círculo unitario <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 186"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 186)</a></cite></span>.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>arima(y, order = c(p, d, q), method = "ML")</code> o <code>Arima()</code> de
              <code>forecast</code>; en Python, <code>ARIMA(y, order=(p,d,q)).fit()</code>. Módulo 6.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p><span data-afirma="c4-m2-10">Que el ajuste <strong>no converja</strong> <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 11"><a href="#ref-m2-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 11)</a></cite> o que un coeficiente tenga un error estándar claramente mayor que el del modelo más sencillo (señal
              de sobreparametrización) <cite class="cita" data-ref="cryer2008time" data-loc="p. 186"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 186)</a></cite>: de vuelta a la etapa 1 con $p$ o $q$ más pequeños</span>. <span data-afirma="c4-m2-11">Una raíz sobre el círculo
              unitario, o muy cerca, también devuelve, pero el arreglo depende de cuál sea: si es del MA, lo más probable es que la serie se haya diferenciado de más y convenga <strong>bajar</strong> $d$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite></span>; <span data-afirma="c4-m2-60">si es del AR, le falta una diferencia y hay
              que <strong>subirlo</strong></span>. <span data-afirma="c4-m2-61">Con una salvedad: si el AR tiene una raíz casi igual a la del MA, los dos
              factores se cancelan entre sí, y lo que sobra no es la diferencia sino $p$ y $q$ <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m2-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 187"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 187)</a></cite></span>. Es el caso del
              ARIMA($2,1,2$) de la TRM del Módulo 10, en una serie donde $d = 1$ no se discute.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-box-jenkins-diagnostico" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p><span data-afirma="c4-m2-21">Comprobar que los residuales son <strong>ruido blanco</strong>: correlograma dentro de la banda,
              Ljung–Box conjunto, media cero, varianza estable <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 183"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 183)</a></cite></span>. <span data-afirma="c4-m2-12">Y mirar la normalidad, que no es una propiedad esencial de los residuales, pero sí la suponen los intervalos de pronóstico habituales <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span>.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><span data-afirma="c4-m2-13"><code>checkresiduals()</code> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Description"><a href="#ref-m2-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Description)</a></cite>, <code>Box.test(..., type = "Ljung-Box", fitdf = p + q)</code> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m2-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>,
              <code>shapiro.test()</code>; en Python, <code>plot_diagnostics()</code> y
              <code>acorr_ljungbox</code>. Módulo 8.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Ljung–Box que rechaza, o barras fuera de la banda con un patrón reconocible. <span data-afirma="c4-m2-14">Si el patrón está en los
              rezagos múltiplos del período estacional, no basta con subir $p$ o $q$: hace falta un modelo
              <strong>estacional</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.9"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.9)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 183"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 183)</a></cite></span>, y eso es el Capítulo 5.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-box-jenkins-uso" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Pronosticar con intervalos, deshacer las transformaciones para volver a la escala original, e
              interpretar. <span data-afirma="c4-m2-15">La forma del pronóstico a largo plazo la deciden $d$ y la constante, no los coeficientes
              ARMA (salvo que los datos muestren ciclos, donde importa $p$) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>: eso se ve en el Módulo 9.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>forecast(fit, h = ...)</code> y <code>autoplot()</code>; en Python,
              <code>get_forecast(steps=...)</code> y <code>conf_int()</code>.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p><span data-afirma="c4-m2-16">Un pronóstico cuya <em>forma</em> es absurda para el fenómeno —una recta que crece sin fin, un
              intervalo que abarca valores imposibles— puede delatar un $d$ mal elegido <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. Y la evaluación
              honesta sobre datos que el modelo no vio es el Capítulo 6, que puede mandarte de vuelta al principio.</p>
          </div>
        </div>
      </div>

      <div class="note">
        <p><strong>Lo que el ciclo no resuelve por sí solo.</strong> <span data-afirma="c4-m2-63">Un ARIMA supone que la estructura del proceso es
          estable en toda la muestra</span>. <span data-afirma="c4-m2-17">Las intervenciones (como un cambio permanente de nivel) y los atípicos no forman parte de ese proceso: se modelan
          aparte <cite class="cita" data-ref="cryer2008time" data-loc="p. 250"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 250)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 257"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 257)</a></cite></span>, y <span data-afirma="c4-m2-62">si se dejan fuera del modelo, el ajuste puede <em>absorberlos</em>, por ejemplo subiendo $d$ o inflando
          $\hat\sigma^2$</span>. El Módulo 8 muestra un caso real de
          esto en la propia serie del Nilo, y es la razón por la que la etapa 1 empieza mirando el gráfico.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Esqueleto del ciclo Box-Jenkins">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">library(forecast); library(tseries)

# ---- Etapa 1: identificacion --------------------------------------------
plot(Nile)                              # SIEMPRE lo primero
d &lt;- ndiffs(Nile)                       # cuantas diferencias
d
#&gt; [1] 1
w &lt;- if (d == 0) Nile else diff(Nile, differences = d)
par(mfrow = c(1, 2)); acf(w); pacf(w); par(mfrow = c(1, 1))

# ---- Etapa 2: estimacion ------------------------------------------------
ajuste &lt;- arima(Nile, order = c(1, d, 1), method = "ML")

# ---- Etapa 3: diagnostico -----------------------------------------------
res &lt;- residuals(ajuste)
Box.test(res, lag = 20, type = "Ljung-Box", fitdf = 2)$p.value
#&gt; [1] 0.7997371
# p &gt; 0.05: no hay evidencia de estructura sobrante

# ---- Etapa 4: uso (con el MISMO ajuste de la etapa 2) -------------------
pron &lt;- forecast(ajuste, h = 10)
round(as.numeric(pron$mean[1:3]), 2)
#&gt; [1] 816.18 835.56 840.49</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox

nilo = sm.datasets.nile.load_pandas().data["volume"].values

# Etapa 1: statsmodels no trae ndiffs() (pmdarima si); aqui se decide
# con las pruebas y el grafico
w = np.diff(nilo)

# Etapa 2
ajuste = ARIMA(nilo, order=(1, 1, 1), trend="n").fit()

# Etapa 3: model_df descuenta los parametros, como fitdf en R. El primer
# "residual" de statsmodels es el dato crudo y_1 = 1120 (arranque difuso),
# no un error: se descarta, como en los Modulos 4 y 10
lb = acorr_ljungbox(ajuste.resid[1:], lags=[20], model_df=2)
print(round(float(lb["lb_pvalue"].iloc[0]), 4))
#&gt; 0.8225
#   R da 0.7997 (0.8118 sin su primer residual, 1.12): ni los coeficientes
#   ni el arranque son identicos. La conclusion no cambia: no rechaza.

# Etapa 4
print(np.round(ajuste.get_forecast(3).predicted_mean, 2))
#&gt; [816.3  835.75 840.71]
#   R da 816.18, 835.56 y 840.49: los coeficientes no son identicos (difieren
#   en el cuarto decimal)</code></pre>
        </div>
      </div>

      <p>El esqueleto anterior despacha la etapa 1 en una línea, <code>d &lt;- ndiffs(Nile)</code>, y ahí está la
        decisión más consecuente de todo el ciclo: el número de diferencias. El módulo siguiente se dedica entero a
        ella.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Una serie simulada, para practicar las vueltas atrás sabiendo cuál es el modelo: <code>set.seed(2026); y &lt;- arima.sim(n = 200, model = list(order = c(2, 1, 0), ar = c(0.4, 0.3)))</code>. Ajústale, por máxima verosimilitud, tres modelos mal elegidos a propósito —un ARIMA($0,1,1$), un ARIMA($2,2,1$) y un ARIMA($2,1,2$)— y, con el ciclo del módulo delante, entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>Para cada ajuste, el hallazgo que lo invalida y la etapa en la que aparece.</li>
            <li>A qué etapa devuelve cada hallazgo y qué se cambia al volver.</li>
            <li>El modelo al que llevan los tres hallazgos, con su diagnóstico.</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m2-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m2-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m2-pista" hidden>
            <p style="margin:0;">Los tres hallazgos están en los paneles «Qué te devuelve atrás» de las etapas 2 y 3. De cada ajuste mira tres cosas: los errores estándar de los coeficientes, el módulo de las raíces del MA y Ljung–Box.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m2-sol" hidden>
            <p><strong>Respuesta: el primero falla en el diagnóstico (le falta orden); el segundo, en la estimación (le sobra una diferencia); el tercero, también en la estimación (le sobran parámetros). Los tres devuelven a la etapa 1, y los tres cambios llevan al ARIMA($2,1,0$).</strong></p>
            <pre><code class="language-r">set.seed(2026)
y &lt;- arima.sim(n = 200, model = list(order = c(2, 1, 0), ar = c(0.4, 0.3)))

ajusta &lt;- function(orden) {
  f  &lt;- arima(y, order = orden, method = "ML")
  ma &lt;- coef(f)[grepl("^ma", names(coef(f)))]
  print(round(rbind(coef = coef(f), ee = sqrt(diag(f$var.coef))), 3))
  cat(sprintf("|raiz MA| menor = %s    Ljung-Box(20) p = %.4f\n",
      if (length(ma)) sprintf("%.4f", min(Mod(polyroot(c(1, ma))))) else "no hay",
      Box.test(residuals(f), lag = 20, type = "Ljung-Box", fitdf = orden[1] + orden[3])$p.value))
}

ajusta(c(0, 1, 1))     # ajuste 1
#&gt;        ma1
#&gt; coef 0.334
#&gt; ee   0.051
#&gt; |raiz MA| menor = 2.9928    Ljung-Box(20) p = 0.0000
ajusta(c(2, 2, 1))     # ajuste 2
#&gt;        ar1   ar2    ma1
#&gt; coef 0.346 0.386 -1.000
#&gt; ee   0.066 0.066  0.015
#&gt; |raiz MA| menor = 1.0000    Ljung-Box(20) p = 0.7008
ajusta(c(2, 1, 2))     # ajuste 3
#&gt;        ar1    ar2    ma1   ma2
#&gt; coef 0.893 -0.126 -0.565 0.331
#&gt; ee   0.323  0.308  0.315 0.204
#&gt; |raiz MA| menor = 1.7375    Ljung-Box(20) p = 0.4396

# de vuelta a la etapa 1: la PACF de la serie diferenciada
round(pacf(diff(y), lag.max = 6, plot = FALSE)$acf[, 1, 1], 3)
#&gt; [1]  0.542  0.372  0.012 -0.062 -0.034 -0.055
round(1.96 / sqrt(length(diff(y))), 3)
#&gt; [1] 0.139
ajusta(c(2, 1, 0))     # el modelo al que llevan los tres hallazgos
#&gt;        ar1   ar2
#&gt; coef 0.343 0.382
#&gt; ee   0.065 0.065
#&gt; |raiz MA| menor = no hay    Ljung-Box(20) p = 0.7070</code></pre>
            <p><strong>(a)</strong> ARIMA($0,1,1$): Ljung–Box(20) da $p &lt; 0.0001$; los residuales tienen estructura, y eso se ve en la etapa 3. ARIMA($2,2,1$): pasa Ljung–Box ($p = 0.70$), pero $\hat\theta = -1.000$ y la raíz MA tiene módulo $1.0000$; es un hallazgo de la etapa 2, al comprobar las raíces. ARIMA($2,1,2$): también pasa Ljung–Box ($p = 0.44$) y sus raíces están lejos del círculo, pero los errores estándar de sus coeficientes van de $0.20$ a $0.32$, entre tres y cinco veces los del ARIMA($2,1,0$) ($0.065$): sobreparametrización, etapa 2.</p>
            <p><strong>(b)</strong> Los tres devuelven a la identificación. El primero, a proponer más orden: la PACF de $\nabla y_t$ sale de la banda ($\pm 0.139$) en los rezagos 1 y 2 ($0.542$ y $0.372$) y no después, la firma de un AR(2). El segundo, a bajar $d$: una raíz MA sobre el círculo es el modelo deshaciendo una diferencia que sobra. El tercero, a quitar parámetros.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El ARIMA($2,1,0$): $\hat\phi = (0.343,\ 0.382)$, con errores estándar de $0.065$ (los verdaderos son $0.4$ y $0.3$), y Ljung–Box(20) $p = 0.71$. Nótese que el ARIMA($2,2,1$) y el ARIMA($2,1,2$) pasaban Ljung–Box: un modelo puede dejar los residuales en orden y estar mal especificado, y por eso la etapa 2 no se limita a estimar. La semilla está elegida para que se vean los cinco rasgos a la vez. En 200 series generadas igual (semillas 1 a 200), Ljung–Box rechaza el ARIMA($0,1,1$) en el $99.5\,\%$; pero el ARIMA($2,2,1$) solo deja la raíz MA sobre el círculo en el $65.5\,\%$, y los cinco rasgos coinciden en el $53\,\%$.</p>
          </div>
        </div>
      </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.3 Elegir $d$
          <span class="text-gray-400 font-normal text-2xl">/ Choosing the order of differencing</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Decidir $d$ con tres evidencias complementarias, y
              descubrir con un experimento por qué las pruebas de raíz unitaria pueden engañar.</p>
          </div>

      <p>El ciclo de Box–Jenkins empieza por $d$, y esta es la decisión de la que cuelga todo lo demás. Un $d$ mal
        elegido no produce un modelo un poco peor:
        produce un modelo <span data-afirma="c4-m3-01">cuyos criterios de información no se pueden comparar con los del $d$ correcto <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>, <span data-afirma="c4-m3-02">cuyos
        residuales pueden pasar el diagnóstico igualmente, y cuyo pronóstico a largo plazo tiene la forma
        equivocada <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. <span data-afirma="c4-m3-03">Conviene apoyarla en <strong>tres evidencias complementarias</strong>, que miran la serie desde
        ángulos distintos <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.1"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.1)</a></cite></span>.</p>

      <p>Las pruebas no contrastan lo mismo. ADF <span data-afirma="c4-m3-07">(y PP, que corrige la autocorrelación de forma no paramétrica en
        vez de con rezagos) <cite class="cita" data-ref="hamilton1994time" data-loc="p. 475"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 475)</a></cite></span> parte de la raíz unitaria; KPSS invierte la hipótesis nula. ADF ajusta la regresión</p>
      $$\begin{aligned}
        \nabla y_t &= \alpha_0 + \alpha_1 t + \gamma\, y_{t-1} \\
          &\quad + \sum_{j=1}^{k} a_j \nabla y_{t-j} + \varepsilon_t
      \end{aligned}$$
      <p><span data-afirma="c4-m3-08">y contrasta $H_0:\ \gamma = 0$, la raíz unitaria <cite class="cita" data-ref="cryer2008time" data-loc="p. 129"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 129)</a></cite></span>. <span data-afirma="c4-m3-62">KPSS descompone la serie en un nivel que puede pasear y
        un ruido estacionario</span>,</p>
      $$\begin{aligned}
        y_t &= \mu + r_t + u_t, \\
        r_t &= r_{t-1} + v_t,
      \end{aligned}$$
      <p><span data-afirma="c4-m3-69">y contrasta $H_0:\ \sigma_v^2 = 0$: sin paseo, la serie es estacionaria alrededor de $\mu$</span>.</p>
      <p><span data-afirma="c4-m3-09"><code>adf.test()</code> incluye la constante $\alpha_0$ y la tendencia $\alpha_1 t$ con $k = 4$ <cite class="cita" data-ref="trapletti2026tseries" data-loc="§Details"><a href="#ref-m3-trapletti2026tseries" title="Trapletti, A., y Hornik, K. (2026). tseries: Time Series Analysis and Computational Finance (Versión 0.10-62) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.tseries">(Trapletti y Hornik, 2026, §Details)</a></cite></span>; como se verá
        enseguida, no es la única especificación posible, y el resultado depende de ella.</p>

      <p>¿Y la varianza de $\nabla^d y$? <span data-afirma="c4-m3-60">De $d=0$ a $d=1$ apenas baja —de $28\,638$ a $28\,268$, un
        $1.3\,\%$— y con $d=2$ casi se triplica. Es una descripción útil, pero <strong>no decide $d$</strong>: el
        Capítulo 2 (Módulo 2.7) mostró que, en una serie estacionaria, el cociente
        $\operatorname{Var}(\nabla y)/\operatorname{Var}(y)$ se acerca a $2(1-r_1)$, así que repite lo que ya dice
        $r_1$, y $r_1$ solo no dice si hay una raíz unitaria. En el Nilo, $r_1 = 0.498$ da $2(1-r_1) = 1.003$, y el
        cociente medido es $0.987$ (el bloque de código lo calcula): que la varianza casi no cambie es otra forma de
        decir que $r_1$ está cerca de $0.5$</span>. Lo que esta serie tiene de raro lo destapan el gráfico y, en el
        Módulo 8, el modelo ajustado.</p>

      <h3>Un experimento: ¿qué ve KPSS cuando hay un cambio de nivel?</h3>

      <p>Sospecha razonable: el descenso de 1899 no es una raíz unitaria, es un <strong>escalón</strong> (en lo
        que sigue, de tamaño $\beta$). <span data-afirma="c4-m3-17">Una serie
        estacionaria alrededor de dos niveles distintos no vuelve a una media única, y KPSS contrasta, justamente, la estacionariedad alrededor de un nivel único <cite class="cita" data-ref="trapletti2026tseries" data-loc="§Description"><a href="#ref-m3-trapletti2026tseries" title="Trapletti, A., y Hornik, K. (2026). tseries: Time Series Analysis and Computational Finance (Versión 0.10-62) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.tseries">(Trapletti y Hornik, 2026, §Description)</a></cite></span>. Si la sospecha es cierta, KPSS debería rechazar
        incluso en series que <em>por construcción</em> no tienen ninguna raíz unitaria.</p>

      <p>Se puede comprobar. El <strong>modelo de dos medias</strong> del Nilo,
        $y_t = \mu + \beta\,\mathbf{1}\{t \ge 1899\} + \varepsilon_t$, da a la serie una media hasta 1898 y otra
        desde 1899; el bloque de código de este módulo lo ajusta y el Módulo 8 lo estudia. Se generan series de
        ruido blanco puro de la misma longitud y desviación que sus residuales ($n = 100$,
        desviación típica $127.0$), se les añade un escalón en la posición 29 —el año 1899— de tamaño $\beta$
        regulable, y se cuenta cuántas veces rechaza KPSS:</p>

      <div class="simulador" data-simulador="escalon-vs-raiz">
        <h4><i class="fas fa-stairs" aria-hidden="true"></i> Un escalón disfrazado de raíz unitaria</h4>
        <p class="simulador-intro">El deslizador fija el tamaño del descenso en 1899, $|\beta|$. Arriba, una
          realización concreta; abajo, la tasa de rechazo de KPSS al $5\,\%$ medida en R sobre 400 réplicas en nueve
          valores de $|\beta|$, interpolada entre ellos. Recuerda que <strong>ninguna</strong> de estas series tiene
          raíz unitaria: todas son ruido blanco más una constante a trozos. Recorre $|\beta|$ desde $0$ y busca
          dónde cruza la curva el $50\,\%$; la línea vertical marca el descenso que tiene el Nilo. La segunda curva
          es la misma prueba con otro truncamiento de la varianza de largo plazo, $\ell = 12$ en vez de $4$, el de
          <code>nlags="legacy"</code> en Python; el recuadro «R y Python no calculan el mismo KPSS», más abajo,
          explica ese parámetro.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Una realización: ruido blanco + escalón</p>
        <div class="grafico-wrapper" style="height:230px;">
          <canvas aria-label="Serie simulada de ruido blanco con un escalón" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Tasa de rechazo de KPSS al 5 % (400 réplicas por punto)</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Tasa de rechazo de KPSS frente al tamaño del escalón" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>El resultado.</strong> <span data-afirma="c4-m3-18">Con 1000 réplicas, sin escalón KPSS rechaza el $4.8\,\%$ de las veces:
          prácticamente su tamaño nominal del $5\,\%$, la prueba funciona (la malla de 400 réplicas del simulador y
          del bloque de código da $4.5\,\%$). Con el escalón que de verdad tiene el Nilo ($\beta = -247.8$, que son
          $1.95$ desviaciones típicas), rechaza el <strong>$100\,\%$</strong> de las veces, y <code>ndiffs()</code>
          pide diferenciar en el $100\,\%$ de las réplicas.</span></p>
        <p><span data-afirma="c4-m3-66">El ADF depende de cómo se especifique. El de <code>ndiffs()</code> (solo constante, un rezago) se deja
          engañar en el $0.5\,\%$ de los casos, y por eso <code>ndiffs(Nile, test = "adf")</code> devuelve 0. Pero
          el de <code>adf.test()</code> (constante y tendencia, $k = 4$) <strong>no rechaza</strong> la raíz unitaria
          en el $86.4\,\%$ de las réplicas con escalón, frente al $5.4\,\%$ sin él: el escalón también engaña al ADF
          de la tabla, y su $p = 0.064$ sobre el Nilo es probablemente otra víctima.</span></p>
        <p style="margin-bottom:0;"><span data-afirma="c4-m3-67">Basta un escalón de $0.79$ desviaciones típicas ($|\beta| = 100$) para que la tasa
          de rechazo de KPSS suba al $70.8\,\%$</span>. Un salto que a ojo parece modesto ya es suficiente.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-kpss-escalon">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-kpss-escalon" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p><span data-afirma="c4-m3-19">El estadístico KPSS se construye sobre las <strong>sumas parciales</strong> de los residuales de
                regresar la serie contra una constante, $e_t = y_t - \bar{y}$</span>:</p>
              $$\begin{aligned}
                S_t &= \sum_{i=1}^{t} e_i, \\
                \mathrm{KPSS} &= \frac{1}{n^2\hat\sigma_{LP}^2}\sum_{t=1}^{n} S_t^2
              \end{aligned}$$
              <p>donde $\hat\sigma_{LP}^2$ es una estimación de la varianza de largo plazo.</p>
            </li>
            <li>
              <p><span data-afirma="c4-m3-71">Si $y_t$ es estacionaria alrededor de una media única, los $e_t$ se compensan y $S_t$ se queda
                pequeño: fluctúa alrededor de cero como un puente browniano. El estadístico es pequeño.</span></p>
            </li>
            <li>
              <p><span data-afirma="c4-m3-20">Si $y_t$ tiene una raíz unitaria, los $e_t$ se comportan como una caminata (crecen como
                $\sqrt t$) y $S_t$ crece como $t^{3/2}$: las sumas parciales se disparan y el estadístico diverge.
                Esto es lo que la prueba quiere detectar.</span></p>
            </li>
            <li>
              <p>Ahora el escalón: $y_t = \mu + \beta\,\mathbf{1}\{t \ge \tau n\} + u_t$, con el salto en la
                fracción $\tau$ de la muestra ($\tau \approx 0.28$ en el Nilo). La media muestral queda entre los
                dos niveles, así que</p>
              $$e_t \approx \begin{cases} -(1-\tau)\,\beta, &amp; t &lt; \tau n \\ \ \ \tau\,\beta, &amp; t \ge \tau n \end{cases}$$
              $$\Longrightarrow\quad \max_t |S_t| \approx \tau(1-\tau)\, n\,|\beta|$$
              <p>Los $e_t$ <strong>no se compensan localmente</strong>: todos los de un mismo tramo tienen el mismo
                signo. $S_t$ crece linealmente hasta el salto y decrece linealmente después, de modo que</p>
              $$\begin{gathered}
                \sum_t S_t^2 \sim n^3\beta^2 \\
                \Longrightarrow\quad \mathrm{KPSS} \sim \frac{n\,\beta^2}{\hat\sigma_{LP}^2}
              \end{gathered}$$
            </li>
            <li>
              <p>El estadístico crece con $n$ y con $\beta^2$. Con datos suficientes, <strong>cualquier</strong>
                escalón acaba haciéndolo rechazar. Y eso es lo que mide la curva del simulador. El escalón también
                engorda $\hat\sigma^2_{LP}$, porque añade a las autocovarianzas de $e_t$ un término proporcional a
                $\beta^2$; por eso, para escalones grandes, el estadístico medio deja de crecer y se estabiliza
                (de $1.07$ con $|\beta| = 200$ a $1.23$ con $|\beta| = 300$), muy por encima del <span data-afirma="c4-m3-21">valor crítico de
                $0.463$</span>.</p>
            </li>
          </ol>
          <p class="derivacion-resultado" data-afirma="c4-m3-22">KPSS no distingue "hay raíz unitaria" de "hay un cambio de nivel": las dos
            cosas hacen que las sumas parciales se disparen. La prueba está haciendo su trabajo —la serie no es
            estacionaria alrededor de una media constante—; el error es traducir su rechazo por "hay que
            diferenciar".</p>
        </div>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>R y Python no calculan el mismo KPSS
          por defecto</h4>
        <p><span data-afirma="c4-m3-29">Sobre la misma serie del Nilo, <code>tseries::kpss.test</code> devuelve $0.9654$ y
          <code>statsmodels.kpss</code>, con su opción por defecto (<code>nlags="auto"</code>, 5 rezagos), devuelve
          $0.8691$; con <code>nlags="legacy"</code> (12 rezagos) baja a $0.5497$, casi la mitad</span>. No es un error de
          ninguno de los dos: es el <strong>truncamiento de la varianza de largo plazo</strong>, <span data-afirma="c4-m3-30">el parámetro $\ell$
          que decide cuántas autocovarianzas entran en el estimador de Newey–West <cite class="cita" data-ref="trapletti2026tseries" data-loc="§Details"><a href="#ref-m3-trapletti2026tseries" title="Trapletti, A., y Hornik, K. (2026). tseries: Time Series Analysis and Computational Finance (Versión 0.10-62) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.tseries">(Trapletti y Hornik, 2026, §Details)</a></cite></span></p>
        $$\begin{aligned}
          \hat\sigma^2_{LP} &= \hat\gamma_0 + 2\sum_{j=1}^{\ell}\Bigl(1 - \tfrac{j}{\ell+1}\Bigr)\hat\gamma_j \\
          \ell_{\text{R}} &= \left\lfloor 4\left(\tfrac{n}{100}\right)^{1/4}\right\rfloor = 4 \\
          \ell_{\texttt{legacy}} &= \left\lceil 12\left(\tfrac{n}{100}\right)^{1/4}\right\rceil = 12
        \end{aligned}$$
        <p style="margin-bottom:0;"><span data-afirma="c4-m3-64">Aquí, con autocorrelaciones positivas, más rezagos inflan $\hat\sigma_{LP}^2$,
          que está en el denominador, y por eso el estadístico baja. Con <code>nlags=4</code> los dos coinciden hasta
          el último decimal</span>. <span data-afirma="c4-m3-31">Es la misma clase de trampa que el Capítulo 2 documentó entre <code>ndiffs()</code> y
          <code>kpss.test()</code></span>: <strong>al comparar salidas de dos programas, conviene mirar primero qué
          truncamiento usa cada uno</strong>. <span data-afirma="c4-m3-34">Y con $\ell = 12$ la prueba pierde potencia: en el experimento del
          escalón, con $|\beta| = 100$, la tasa de rechazo baja del $70.8\,\%$ ($\ell = 4$) al $44.5\,\%$
          ($\ell = 12$)</span>.</p>
      </div>

      <div class="note">
        <p><strong>La regla práctica.</strong> <span data-afirma="c4-m3-32">$d$ casi nunca pasa de 2 <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.1"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.1)</a></cite>.</span> <span data-afirma="c4-m3-33">Si
          parece necesario $d = 3$, es prudente sospechar que el problema es otro: una transformación pendiente, un atípico, o
          justamente un cambio de nivel. Antes de subir $d$, conviene volver al gráfico.</span></p>
      </div>

      <p>Queda, entonces, una decisión abierta. Por ahora se sigue la de <code>auto.arima()</code> —la de KPSS—,
        $d = 1$, a sabiendas de que es <strong>provisional</strong>: el Módulo 4 identifica $p$ y $q$ sobre
        $\nabla$Nilo, los Módulos 5 a 7 deciden la constante, estiman y comparan candidatos hasta llegar al
        ARIMA($1,1,1$), y el Módulo 8 lo pone a prueba contra
        la alternativa que este módulo dejó planteada, un modelo de dos medias sin diferenciar.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Una serie con un cambio de nivel y sin raíz unitaria, para practicar la decisión conociendo la respuesta: <code>set.seed(43); y &lt;- ts(10 + 3 * (1:120 &gt;= 71) + arima.sim(n = 120, model = list(ar = 0.5)))</code>. Son 120 datos de un AR(1) con $\phi = 0.5$ alrededor de un nivel que pasa de $10$ a $13$ en $t = 71$. Trátala como una serie cualquiera y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>El $d$ que pide <code>ndiffs()</code> con cada una de las tres pruebas, sobre la serie completa.</li>
            <li>Lo mismo en cada tramo, antes y después de $t = 71$.</li>
            <li>El ARIMA($1,1,1$) al que lleva seguir a KPSS, con su $\hat\theta$ y el módulo de su raíz MA; y el modelo de dos medias con un AR(1), con su escalón y su diagnóstico. ¿Qué $d$ eliges, y con cuáles de las tres evidencias del módulo?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m3-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m3-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m3-pista" hidden>
            <p style="margin:0;">Empieza por el gráfico, <code>plot(y)</code>. Lo que se vea ahí dice qué comprobar después con las pruebas y dónde partir la serie.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m3-sol" hidden>
            <p><strong>Respuesta: $d = 0$, con el escalón dentro del modelo. KPSS pide $d = 1$ sobre la serie completa y $d = 0$ en cada tramo: lo que rechazaba era el cambio de nivel.</strong></p>
            <pre><code class="language-r">library(forecast)
set.seed(43)
n &lt;- 120
escalon &lt;- as.numeric(seq_len(n) &gt;= 71)        # 0 hasta t = 70, 1 desde t = 71
y &lt;- ts(10 + 3 * escalon + arima.sim(n = n, model = list(ar = 0.5)))
plot(y)                                        # el salto se ve a simple vista

pruebas &lt;- function(x) c(kpss = ndiffs(x, test = "kpss"), adf = ndiffs(x, test = "adf"),
                         pp = ndiffs(x, test = "pp"))
# (a) el d que pide cada prueba, sobre la serie completa
pruebas(y)
#&gt; kpss  adf   pp
#&gt;    1    0    0

# (b) y en cada tramo por separado
antes &lt;- window(y, end = 70); despues &lt;- window(y, start = 71)
rbind(antes = pruebas(antes), despues = pruebas(despues))
#&gt;         kpss adf pp
#&gt; antes      0   0  0
#&gt; despues    0   0  0
round(c(media_antes = mean(antes), media_despues = mean(despues)), 2)
#&gt;   media_antes media_despues
#&gt;         10.14         13.31

# (c) el ARIMA(1,1,1) que saldria de seguir a KPSS, y sus raices
f111 &lt;- arima(y, order = c(1, 1, 1), method = "ML")
round(c(coef(f111), raiz_MA = Mod(polyroot(c(1, coef(f111)[["ma1"]])))), 4)
#&gt;     ar1     ma1 raiz_MA
#&gt;  0.4884 -0.8581  1.1653

# el modelo de dos medias, con un AR(1) para lo que queda
fesc &lt;- arima(y, order = c(1, 0, 0), xreg = escalon, method = "ML")
round(rbind(coef = coef(fesc), ee = sqrt(diag(fesc$var.coef))), 3)
#&gt;        ar1 intercept escalon
#&gt; coef 0.473    10.163   3.124
#&gt; ee   0.080     0.216   0.329
Box.test(residuals(fesc), lag = 20, type = "Ljung-Box", fitdf = 1)$p.value
#&gt; [1] 0.6783999</code></pre>
            <p><strong>(a)</strong> KPSS pide $d = 1$; ADF y PP, $d = 0$. Es el mismo reparto que en el Nilo.</p>
            <p><strong>(b)</strong> En cada tramo, las tres pruebas piden $d = 0$. Las medias son $10.14$ y $13.31$: a cada lado del salto la serie vuelve a su nivel, y KPSS rechazaba porque no hay un nivel único.</p>
            <p><strong>(c)</strong> El ARIMA($1,1,1$) da $\hat\phi = 0.488$ y $\hat\theta = -0.858$, con la raíz MA en $1.165$: cerca del círculo, el síntoma de haber diferenciado de más (en el Nilo, $1.144$). El modelo de dos medias con AR(1) estima el escalón en $3.12$ (e.e. $0.33$) y $\hat\phi = 0.473$ (e.e. $0.080$) —los verdaderos son $3$ y $0.5$— y pasa Ljung–Box(20) con $p = 0.68$. Las tres evidencias coinciden una vez que se mira el gráfico: el salto se ve, las pruebas dejan de pedir la diferencia cuando se aplican a cada lado, y el modelo diferenciado tiene la raíz MA cerca de $1$.</p>
            <p style="margin-bottom:0;">La semilla está elegida para que salga el caso completo. En 500 series generadas igual (semillas 1 a 500), KPSS pide diferenciar la serie completa en todas, y en el $65\,\%$ pide $d = 0$ en los dos tramos; el reparto del Nilo (ADF y PP en $d = 0$) sale en el $52\,\%$, y con las tres pruebas en $d = 0$ en cada tramo, en el $33\,\%$. La raíz MA del ARIMA($1,1,1$) tiene mediana $1.15$.</p>
          </div>
