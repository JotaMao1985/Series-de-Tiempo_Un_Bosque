            <tr><td>ARIMA($1,1,1$) con deriva</td><td><span data-afirma="c4-m9-60"><strong>Recta</strong> de pendiente $\hat\delta$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span></td>
              <td>$\nabla\hat y = -2.88$, $\nabla^2\hat y = 0$</td><td>$555 \to 708$</td></tr>
            <tr><td>ARIMA($1,2,1$)</td><td><span data-afirma="c4-m9-05"><strong>Recta también</strong>, no una parábola <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span></td>
              <td>$\nabla\hat y = -4.05$, $\nabla^2\hat y = 0$</td><td>$613 \to \mathbf{2771}$</td></tr>
          </tbody>
        </table>
      </div>

      <p>La fila del ARIMA($1,1,1$) sin constante merece una línea, porque es fácil leerla mal: el pronóstico
        <strong>no se queda en el último dato</strong>. <span data-afirma="c4-m9-67">Parte de $740$ (1970), pasa a $816.18$ en $h = 1$ y se
        aplana en $842.17$. Con $d = 1$, la parte ARMA sigue moviendo la diferencia pronosticada durante unos
        pasos, $\nabla\hat y_{T+h} = \hat\phi^{\,h-1}(\hat\phi\,\nabla y_T + \hat\theta\,\hat\varepsilon_T)$, y al
        sumarlos el nivel converge a</span></p>

      <div class="formula">
        $$\hat y_{T+\infty} = y_T + \frac{\hat\phi\,\nabla y_T + \hat\theta\,\hat\varepsilon_T}{1-\hat\phi}$$
      </div>

      <p>Lo constante es ese nivel final, no el último observado; el bloque de código de este módulo lo
        comprueba.</p>

      <div class="note">
        <p><span data-afirma="c4-m9-68"><strong>Con $d = 2$ el pronóstico es una recta, no una parábola</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>, y vale la pena entender por
          qué, porque es un caso donde el software toma una decisión metodológica por quien modela. <span data-afirma="c4-m9-06">La segunda
          diferencia del pronóstico decae como $\hat\phi^{\,h}$, con $\hat\phi = -0.39$, y en $h = 30$ ya es nula a
          efectos prácticos: la curva termina en una recta.</span> <span data-afirma="c4-m9-07">Para obtener la parábola haría falta una constante con
          $d = 2$, y <code>forecast::Arima</code> <strong>se niega</strong>: avisa <em>"No drift term fitted as the
          order of difference is 2 or more"</em> y la descarta <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Arguments"><a href="#ref-m9-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Arguments)</a></cite>. No es un bug, es una decisión deliberada: extrapolar
          una parábola a 30 pasos produce disparates <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>.</span> <span data-afirma="c4-m9-66">Lo que sí delata a $d = 2$ es el intervalo <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>: pasa de $613$ a
          $2771$, tres veces y media más ancho que el de $d = 1$.</p>
        <p style="margin-bottom:0;"><span data-afirma="c4-m9-09">Y ese ARIMA($1,2,1$) tiene $\hat\theta = -1$: es el modelo sobrediferenciado del
          Módulo 8. Su MA cancela una de las dos diferencias, así que los $\psi_j$ tienden a
          $1/(1-\hat\phi) = 0.72$ en vez de a $0.169$. Eso explica buena parte del abanico (la banda del pronóstico, que se abre con el horizonte),
          pero no todo: con
          esos pesos, la fórmula de abajo da un ancho de $2428$ en $h = 30$, y <code>forecast()</code> devuelve
          $2771$.</span> <span data-afirma="c4-m9-10">La diferencia es el precio de la no invertibilidad —con $\hat\theta = -1$ los choques pasados
          no se recuperan de los datos <cite class="cita" data-ref="cryer2008time" data-loc="p. 197"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 197)</a></cite>—, y el desarrollo del final del módulo lo explica.</span></p>
      </div>

      <h3>De dónde sale el ancho del intervalo</h3>

      <p><span data-afirma="c4-m9-11">El intervalo no es un adorno que añade el software: se deduce de los pesos $\psi$ de la representación
        MA($\infty$) que se construyó en el Capítulo 3. Si $y_{T+h} = \hat{y}_{T+h|T} + \sum_{j=0}^{h-1}\psi_j
        \varepsilon_{T+h-j}$, entonces el error de pronóstico a $h$ pasos tiene varianza <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite></span>:</p>

      <div class="formula">
        $$\begin{gathered}
          \sigma_h^2 = \sigma^2 \sum_{j=0}^{h-1} \psi_j^2, \\[0.3em]
          \hat{y}_{T+h|T} \pm z_{1-\alpha/2}\,\sigma_h
        \end{gathered}$$
      </div>

      <p><span data-afirma="c4-m9-61">Como $\psi_0 = 1$ siempre, $\sigma_1 = \sigma$: <strong>a un paso, el intervalo lo determina solo la
        desviación de los residuales</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span>. <span data-afirma="c4-m9-12">Los pesos se obtienen igualando coeficientes en
        $\psi(B)\,\phi(B)(1-B)^d = \theta(B)$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite>. Para el ARIMA($1,1,1$) del Nilo eso equivale a expandirlo como
        ARMA($2,1$) <cite class="cita" data-ref="cryer2008time" data-loc="p. 201"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 201)</a></cite></span> —la derivación del Módulo 1— y da una forma cerrada:</p>

      <div class="formula" data-afirma="c4-m9-13">
        $$\psi_j = \frac{(1+\theta) - (\phi+\theta)\,\phi^{\,j}}{1-\phi}$$
        $$\xrightarrow[\;j\to\infty\;]{}\quad \psi_\infty = \frac{1+\theta}{1-\phi}$$
      </div>

      <p><span data-afirma="c4-m9-14">Con esos pesos se reconstruyen exactamente los intervalos que devuelve <code>forecast()</code>: el error
        máximo de la comprobación es <strong>$9.1\times 10^{-11}$</strong>.</span></p>

      <div class="simulador" data-simulador="pesos-psi-sigma">
        <h4><i class="fas fa-arrows-left-right" aria-hidden="true"></i> Los pesos $\psi$ y el ancho del
          intervalo</h4>
        <p class="simulador-intro">Arriba, los pesos $\psi_j$ del ARIMA($1,1,1$) del Nilo; en naranja, los
          $\psi_0,\dots,\psi_{h-1}$ que entran en $\sigma_h$. Abajo, $\sigma_h$ frente a $\sigma\sqrt{h}$, que es
          exactamente lo que daría una <strong>caminata aleatoria con la misma $\sigma$</strong>: <span data-afirma="c4-m9-64">en un ARIMA($0,1,0$)
          todos los pesos valen $\psi_j = 1$ y la fórmula se reduce a $\sigma\sqrt{h}$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite></span>. Mueve el horizonte: el
          marcador recorre las dos curvas y la lectura da cuánto se separan.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Pesos $\psi_j$</p>
        <div class="grafico-wrapper" style="height:240px;">
          <canvas aria-label="Pesos psi de la representación MA infinita" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">$\sigma_h$ frente a $\sigma\sqrt{h}$</p>
        <div class="grafico-wrapper" style="height:240px;">
          <canvas aria-label="Desviación del error de pronóstico frente al horizonte" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>El peso límite dice cómo crece la incertidumbre.</strong> <span data-afirma="c4-m9-15">Como $\psi_j \to \psi_\infty$, para
          horizontes grandes $\sigma_h \approx \sigma\,\psi_\infty\sqrt{h}$: el cociente contra la caminata
          aleatoria tiende al propio $\psi_\infty$. En el Nilo $\psi_\infty = (1+\theta)/(1-\phi) = 0.169$, así
          que a treinta años $\sigma_{30} = 199.4$ frente a los $778.0$ de una caminata con la misma $\sigma$:
          <strong>cuatro veces menos incertidumbre</strong>.</span> <span data-afirma="c4-m9-16">Y la razón vuelve a ser la misma de todo el capítulo:
          con $\theta = -0.874$ el término MA cancela casi toda la integración, así que los choques no se
          acumulan.</span></p>
        <p style="margin-bottom:0;">No siempre es así. Cuando $\phi + \theta > 0$, $\psi_\infty$ es mayor que $1$
          y cada choque acaba pesando más que cuando llegó. Mirar $\psi_\infty$ cuesta una línea y dice más sobre
          el pronóstico a largo plazo que cualquier coeficiente por separado.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-sigma-h">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-sigma-h" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p><span data-afirma="c4-m9-63">Todo ARIMA puede escribirse, desde un origen dado, en función de sus choques, con pesos $\psi_j$
                definidos por $\psi(B)\,\phi(B)(1-B)^d = \theta(B)$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 200"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 200)</a></cite>. Con $d \ge 1$ la suma no converge si se lleva
                al infinito, pero basta separar lo que ya se conoce en $T$ de lo que aún no ha ocurrido:</span></p>
              $$y_{T+h} = \underbrace{m_{T+h}}_{\text{conocido en } T} + \sum_{j=0}^{h-1}\psi_j\,\varepsilon_{T+h-j}$$
              <p>donde $m_{T+h}$ reúne la constante, los valores observados y los choques
                $\varepsilon_T, \varepsilon_{T-1},\dots$</p>
            </li>
            <li>
              <p>En el instante $T$ se conocen $\varepsilon_T, \varepsilon_{T-1},\dots$ pero no
                $\varepsilon_{T+1},\dots,\varepsilon_{T+h}$. <span data-afirma="c4-m9-17">El pronóstico óptimo en error cuadrático medio <cite class="cita" data-ref="cryer2008time" data-loc="p. 191"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 191)</a></cite> sustituye
                esos $h$ errores futuros por su esperanza, cero <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span>:</p>
              $$\hat{y}_{T+h|T} = m_{T+h}$$
              <p><span data-afirma="c4-m9-18">Ese paso supone que el modelo es <strong>invertible</strong>: solo así los choques pasados se
                recuperan de los datos observados <cite class="cita" data-ref="cryer2008time" data-loc="p. 197"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 197)</a></cite></span>. <span data-afirma="c4-m9-19">Si no lo es —un $\theta$ en $-1$—, $\varepsilon_T,
                \varepsilon_{T-1},\dots$ no se conocen del todo <cite class="cita" data-ref="cryer2008time" data-loc="p. 197"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 197)</a></cite>, y el intervalo que calcula el software, que
                incorpora esa incertidumbre, sale más ancho que el de la fórmula del paso 4 <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m9-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite>.</span></p>
            </li>
            <li>
              <p>El error de pronóstico es exactamente lo que se descartó — los $h$ primeros términos:</p>
              $$\begin{aligned}
                e_{T+h} &= y_{T+h} - \hat{y}_{T+h|T} \\
                &= \sum_{j=0}^{h-1}\psi_j\,\varepsilon_{T+h-j}
              \end{aligned}$$
            </li>
            <li>
              <p>Como los $\varepsilon_t$ son incorrelados y de varianza $\sigma^2$, la varianza de esa suma es la
                suma de las varianzas:</p>
              $$\operatorname{Var}(e_{T+h}) = \sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
            </li>
            <li>
              <p>Dos consecuencias inmediatas. <span data-afirma="c4-m9-20">Con $h = 1$ solo sobrevive $\psi_0 = 1$, luego
                $\sigma_1 = \sigma$. Y como los $\psi_j^2$ no son negativos, $\sigma_h$ <strong>nunca decrece</strong>
                con el horizonte. Puede quedarse plano —en un MA($1$), desde $h = 2$—, pero un intervalo de
                pronóstico no puede estrecharse al alejarse <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>.</span></p>
            </li>
            <li>
              <p><span data-afirma="c4-m9-21">El ritmo al que crece lo decide $d$. Si el proceso es estacionario, $\psi_j \to 0$ y la suma
                converge: el intervalo se estabiliza <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>. Con una raíz unitaria, $\psi_j$ tiende a una
                <strong>constante</strong> —en el Nilo, $\psi_j \to 0.169$—, la suma crece sin límite, como $h$, y
                $\sigma_h$ lo hace como $\sqrt{h}$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite>.</span> <span data-afirma="c4-m9-22">Con dos, $\psi_j$ crece linealmente <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite> y $\sigma_h$ lo hace como
                $h^{3/2}$, <strong>salvo que la parte MA cancele una de las raíces</strong>: es lo que ocurre en el
                ARIMA($1,2,1$) del Nilo, cuyo $\hat\theta = -1$ deja los $\psi_j$ en $0.718$ y el crecimiento en
                $\sqrt{h}$, como con $d = 1$.</span></p>
            </li>
          </ol>
          <p class="derivacion-resultado">El ancho del intervalo es una consecuencia algebraica de $(p,d,q)$, no un
            añadido. Y por eso equivocarse en $d$ no solo desplaza el pronóstico puntual: cambia el ritmo al que
            crece la incertidumbre que se declara.</p>
        </div>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Todo esto supone normalidad</h4>
        <p><span data-afirma="c4-m9-23">La fórmula $\hat{y} \pm z_{1-\alpha/2}\,\sigma_h$ usa $z_{0.975} = 1.96$ y $z_{0.90} = 1.282$, que son
          cuantiles de la normal <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.5"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.5)</a></cite></span>. <span data-afirma="c4-m9-24">Las <em>estimaciones</em> de un ARIMA suelen seguir siendo razonables aunque los errores no sean normales <cite class="cita" data-ref="hamilton1994time" data-loc="p. 117"><a href="#ref-m9-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 117)</a></cite>;
          los <em>intervalos</em>, en cambio, se apoyan en esa normalidad <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>.</span> Y no siempre lo son: en la TRM del Módulo 10 <span data-afirma="c4-m9-65">el test de Shapiro–Wilk sobre los
          residuales da $p = 0.0006$ <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m9-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span>, un rechazo rotundo. <span data-afirma="c4-m9-25">Con colas más pesadas que la normal, la cobertura real se
          separa de la nominal <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span> —<span data-afirma="c4-m9-26">en la TRM, a un mes, el intervalo del $80\,\%$ cubre el $83.9\,\%$</span>— y, si los
          errores son asimétricos, los fallos se concentran en un lado. El Módulo 10 lo mide.</p>
        <p style="margin-bottom:0;">Hay dos advertencias más que conviene decir en voz alta: <span data-afirma="c4-m9-27">los intervalos
          <strong>no incluyen la incertidumbre de haber estimado los parámetros</strong> (los tratan como si fueran
          conocidos), ni la de <strong>haber elegido el modelo</strong>. Por eso tienden a quedar demasiado estrechos <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span>. Medir cuánto lo son —la cobertura real frente a la nominal— es trabajo del Capítulo 6.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Pronóstico e intervalos">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">library(forecast)

# La forma del pronostico segun d, MEDIDA en vez de recordada
formas &lt;- list(
  "d=0 con media"    = Arima(Nile, order = c(1,0,1)),
  "d=1 sin constante"= Arima(Nile, order = c(1,1,1)),
  "d=1 con deriva"   = Arima(Nile, order = c(1,1,1), include.drift = TRUE),
  "d=2"              = Arima(Nile, order = c(1,2,1)))
for (nm in names(formas)) {
  m &lt;- as.numeric(forecast(formas[[nm]], h = 30)$mean)
  cat(sprintf("%-18s  1a dif en h=30: %7.3f   2a dif: %9.6f\n",
              nm, m[30] - m[29], m[30] - 2*m[29] + m[28]))
}
#&gt; d=0 con media       1a dif en h=30:   0.254   2a dif: -0.040903
#&gt; d=1 sin constante   1a dif en h=30:   0.000   2a dif:  0.000000
#&gt; d=1 con deriva      1a dif en h=30:  -2.883   2a dif: -0.000000
#&gt; d=2                 1a dif en h=30:  -4.049   2a dif:  0.000000
# d=2 da una RECTA (2a diferencia nula), no una parabola

# Sin constante y con d = 1 se aplana, pero no en el ultimo dato
f1  &lt;- formas[["d=1 sin constante"]]
ph  &lt;- coef(f1)[["ar1"]]; th1 &lt;- coef(f1)[["ma1"]]
yT  &lt;- as.numeric(tail(Nile, 1)); dyT &lt;- yT - as.numeric(Nile)[99]
eT  &lt;- as.numeric(tail(residuals(f1), 1))
round(c(ultimo = yT, h1 = forecast(f1, h = 1)$mean[1], h30 = forecast(f1, h = 30)$mean[30],
        limite = yT + (ph * dyT + th1 * eT) / (1 - ph)), 2)
#&gt; ultimo     h1    h30 limite
#&gt; 740.00 816.18 842.17 842.17

# --- El intervalo, reconstruido desde los pesos psi ----------------------
f   &lt;- Arima(Nile, order = c(1, 1, 1))
phi &lt;- coef(f)[["ar1"]]; th &lt;- coef(f)[["ma1"]]; s &lt;- sqrt(f$sigma2)

# ARIMA(1,1,1) = ARMA(2,1) con ar* = (1 + phi, -phi) sobre la serie sin diferenciar
psi     &lt;- c(1, ARMAtoMA(ar = c(1 + phi, -phi), ma = th, lag.max = 30))
sigma_h &lt;- s * sqrt(cumsum(psi^2))[1:30]

fc &lt;- forecast(f, h = 30, level = 95)
semiancho &lt;- (fc$upper - fc$lower) / 2
max(abs(semiancho - qnorm(0.975) * sigma_h))     # deben coincidir
#&gt; [1] 9.077894e-11

round(c(sigma = s, sigma_h1 = sigma_h[1], sigma_h30 = sigma_h[30],
        psi_30 = psi[31]), 3)
#&gt;     sigma  sigma_h1 sigma_h30    psi_30
#&gt;   142.045   142.045   199.363     0.169
# psi tiende a una CONSTANTE, no a cero: es la raiz unitaria

# Con d = 2 el MA estimado es theta = -1: el modelo no es invertible
f2   &lt;- Arima(Nile, order = c(1, 2, 1))
ph2  &lt;- coef(f2)[["ar1"]]
psi2 &lt;- c(1, ARMAtoMA(ar = c(2 + ph2, -(1 + 2 * ph2), ph2),
                      ma = coef(f2)[["ma1"]], lag.max = 29))
fc2  &lt;- forecast(f2, h = 30, level = 95)
round(c(theta     = coef(f2)[["ma1"]],
        psi_29    = psi2[30],
        ancho_psi = 2 * qnorm(0.975) * sqrt(f2$sigma2 * sum(psi2^2)),
        ancho_fc  = fc2$upper[30] - fc2$lower[30]), 3)
#&gt;     theta    psi_29 ancho_psi  ancho_fc
#&gt;    -1.000     0.718  2427.955  2771.452
# La formula se queda corta: con theta = -1 los choques pasados no se
# recuperan de los datos, y forecast() suma esa incertidumbre</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.tsa.arima_process import arma2ma
import warnings; warnings.filterwarnings("ignore")

nilo = sm.datasets.nile.load_pandas().data["volume"].values
f = ARIMA(nilo, order=(1, 1, 1), trend="n").fit()
phi, th = f.params[0], f.params[1]
s = np.sqrt(f.params[-1])

# arma2ma pide los polinomios COMPLETOS y con el signo ya aplicado
psi = arma2ma(np.r_[1, -(1 + phi), phi], np.r_[1, th], lags=31)
sigma_h = s * np.sqrt(np.cumsum(psi**2))[:30]

ic = f.get_forecast(30).conf_int(alpha=0.05)
semiancho = (ic[:, 1] - ic[:, 0]) / 2
print(f"{np.max(np.abs(semiancho - 1.959964 * sigma_h)):.3e}")
#&gt; 3.044e-06        la formula reproduce el intervalo tambien aqui

print(np.round([s, sigma_h[0], sigma_h[29], psi[30]], 3).tolist())
#&gt; [140.599, 140.599, 196.925, 0.168]
#   R da [142.045 142.045 199.363 0.169]. La diferencia viene sobre todo de
#   sigma^2: forecast::Arima la corrige por grados de libertad (SCR / (n* - k),
#   con n* = 99 y k = 2) y statsmodels da la de maxima verosimilitud, sin esa
#   correccion (19768 frente a 20177).
#   El peso limite psi (lo que decide como crece el intervalo) coincide hasta
#   el segundo decimal: 0.1679 frente a 0.1688.</code></pre>
        </div>
      </div>

      <p>Con esto el ciclo queda completo: identificar $d$ y los órdenes, estimar, diagnosticar y pronosticar con su
        intervalo. El Módulo 10 reúne las piezas del Nilo en un solo cuadro y recorre después el ciclo de
        principio a fin sobre una serie colombiana, la TRM, cuyos residuales ponen a prueba el supuesto de
        normalidad de este último paso: ahí se mide cuánto cubren de verdad los intervalos del $80\,\%$ y del
        $95\,\%$. Cierra con el puente al Capítulo 5 y el resumen del capítulo.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>austres</code> es el número de residentes en Australia, en miles, medido cada trimestre desde 1971: 89 datos. Ajústale con <code>Arima()</code> tres modelos con la misma parte MA(1) y distinto $d$ o distinta constante —A, un ARIMA($0,1,1$) sin deriva; B, un ARIMA($0,1,1$) con deriva; C, un ARIMA($0,2,1$)— y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>El pronóstico puntual de cada uno a 1, 20 y 40 trimestres. ¿Qué forma tiene cada pronóstico?</li>
            <li>La pendiente a la que llega cada pronóstico. ¿De dónde saca la suya el modelo B, y de dónde el C?</li>
            <li>El ancho del intervalo del $95\,\%$ a 1 y a 40 trimestres, en los tres. ¿Cuál crece más deprisa, y qué lo decide?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m9-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m9-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m9-pista" hidden>
            <p style="margin:0;">La tabla del módulo dice qué forma corresponde a cada combinación de $d$ y constante. Para (b), compara cada pendiente con la media de todas las diferencias de la serie y con la de las últimas.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m9-sol" hidden>
            <p><strong>Respuesta: A se aplana; B y C son rectas, y no la misma. B avanza con la pendiente media de toda la muestra ($52.1$ por trimestre) y C, con la del final de la serie ($43.2$). El intervalo de C es el que más se abre: a 40 trimestres es $6.4$ veces el de B.</strong></p>
            <pre><code class="language-r">library(forecast)
y &lt;- austres                         # residentes en Australia, en miles; 89 trimestres
A &lt;- Arima(y, order = c(0, 1, 1))                           # d = 1, sin deriva
B &lt;- Arima(y, order = c(0, 1, 1), include.drift = TRUE)     # d = 1, con deriva
C &lt;- Arima(y, order = c(0, 2, 1))                           # d = 2
h &lt;- c(1, 20, 40)
pa &lt;- forecast(A, h = 40, level = 95); pb &lt;- forecast(B, h = 40, level = 95)
pc &lt;- forecast(C, h = 40, level = 95)

# (a) el pronostico puntual a 1, 20 y 40 trimestres
round(rbind(A = pa$mean[h], B = pb$mean[h], C = pc$mean[h]), 1)
#&gt;      [,1]    [,2]    [,3]
#&gt; A 17664.8 17664.8 17664.8
#&gt; B 17703.3 18693.4 19735.7
#&gt; C 17704.7 18526.1 19390.7

# (b) la pendiente del pronostico al final (h = 40) y de donde sale
round(c(A = diff(pa$mean)[39], B = diff(pb$mean)[39], C = diff(pc$mean)[39]), 2)
#&gt;     A     B     C
#&gt;  0.00 52.11 43.23
round(c(deriva_de_B = coef(B)[["drift"]], media_de_las_diferencias = mean(diff(y))), 2)
#&gt;              deriva_de_B media_de_las_diferencias
#&gt;                    52.11                    52.21
al &lt;- 1 + coef(C)[["ma1"]]          # el peso del suavizamiento exponencial de las diferencias
round(c(alfa = al, peso_de_las_8_ultimas = 1 - (1 - al)^8), 3)
#&gt;                  alfa peso_de_las_8_ultimas
#&gt;                 0.408                 0.985
round(c(ultimo_dato = as.numeric(tail(y, 1)), nivel_de_A = pa$mean[40]), 1)
#&gt; ultimo_dato  nivel_de_A
#&gt;     17661.5     17664.8

# (c) el ancho del intervalo del 95 %, a 1 y a 40 trimestres
ancho &lt;- function(p) as.numeric(p$upper - p$lower)[c(1, 40)]
round(rbind(A = ancho(pa), B = ancho(pb), C = ancho(pc)), 1)
#&gt;    [,1]   [,2]
#&gt; A 124.3 1438.7
#&gt; B  43.6  402.0
#&gt; C  40.4 2587.0

# y el diagnostico de los tres: Ljung-Box(20)
round(sapply(list(A = A, B = B, C = C), function(f)
  Box.test(residuals(f), lag = 20, type = "Ljung-Box", fitdf = 1)$p.value), 4)
#&gt;      A      B      C
#&gt; 0.0000 0.0000 0.0714</code></pre>
            <p><strong>(a)</strong> A se queda en $17\,664.8$ a cualquier horizonte, junto al último dato ($17\,661.5$): con $d = 1$ y sin deriva, el pronóstico se aplana. B y C suben en línea recta: a 40 trimestres B llega a $19\,735.7$ y C, a $19\,390.7$, $345$ menos.</p>
            <p><strong>(b)</strong> La pendiente de A es $0$. La de B es su deriva, $52.11$ por trimestre, casi la media de las 88 diferencias ($52.21$): con $d = 1$ la pendiente la pone la constante, que la mide sobre toda la muestra. C no tiene constante y aun así pronostica una recta, de pendiente $43.23$: con $d = 2$ la pendiente no es un parámetro, sino un promedio de las diferencias con pesos que decaen como $(1-\alpha)^j$ hacia atrás, con $\alpha = 1 + \hat\theta = 0.408$ —el suavizamiento exponencial del Módulo 1 aplicado a $\nabla y$—. Las ocho últimas diferencias se llevan el $98.5\,\%$ del peso: la pendiente sale del tramo final de la serie.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> A un trimestre, B y C tienen anchos parecidos ($43.6$ y $40.4$). A cuarenta, el de B es $402.0$ y el de C, $2587.0$: $6.4$ veces más. El de B se ha multiplicado por $9.2$ y el de C, por $64$: el ritmo lo decide $d$, como dice el módulo. A, con el mismo $d$ que B, llega a $1438.7$, y ya a un paso es el más ancho ($124.3$), porque sin deriva su $\hat\sigma$ es mucho mayor. El ejercicio no elige modelo —las pruebas tampoco se ponen de acuerdo (KPSS pide $d = 2$; ADF y PP, $d = 1$), y de los tres solo C pasa Ljung–Box(20), con $p = 0.07$—: muestra que elegir $d$ y la constante es elegir la forma del pronóstico y el ritmo al que crece su incertidumbre.</p>
