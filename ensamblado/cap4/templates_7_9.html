      <p>Hasta aquí la identificación ha sido artesanal. En 2008 Rob Hyndman y Yeasmin Khandakar publicaron un
        algoritmo que la automatiza, y es el que ejecuta <code>auto.arima()</code>. Conviene entenderlo por dos
        razones opuestas: porque funciona sorprendentemente bien y hay que saber cuándo confiar, y porque
        <strong>no es una búsqueda exhaustiva</strong> y hay que saber cuándo desconfiar.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>El algoritmo, en cuatro pasos</h4>
        <ol>
          <li><strong>Elegir $d$</strong> con pruebas sucesivas de KPSS: se diferencia mientras KPSS rechace la
            estacionariedad. (Aquí está el punto débil que destapó el Módulo 3.)</li>
          <li><strong>Ajustar cuatro modelos iniciales</strong> sobre la serie diferenciada: ARIMA($2,d,2$),
            ARIMA($0,d,0$), ARIMA($1,d,0$) y ARIMA($0,d,1$), cada uno con y sin constante. El de menor AICc es el
            <em>modelo actual</em>.</li>
          <li><strong>Buscar en el vecindario:</strong> se prueban las variantes del modelo actual con $p$ o $q$
            modificados en $\pm 1$, y con y sin constante. Si alguna mejora el AICc, pasa a ser el modelo actual y
            se repite el paso.</li>
          <li><strong>Parar</strong> cuando ninguna variante del vecindario mejore.</li>
        </ol>
        <p style="margin-bottom:0;">Se descartan por el camino los ajustes que no convergen y los que tienen raíces
          demasiado cerca del círculo unitario: a esos el algoritmo les asigna AICc $=\infty$.</p>
      </div>

      <p>Sobre el Nilo, la búsqueda evalúa <strong>18 modelos</strong>. Recórrela paso a paso:</p>

      <h3>La sobrediferenciación tiene una firma exacta</h3>

      <p>Si diferencias de más, el modelo lo compensa introduciendo una <strong>raíz unitaria en la parte MA</strong>:

        álgebra, y se ve en el número:</p>

          diferencia que acabas de imponer.</p>

        <p>La regla habitual —"si al diferenciar la varianza sube, te has pasado"— funcionó en el Nilo, pero
          <strong>es una heurística, no un teorema</strong>. En una serie con un ciclo marcado puede fallar: sobre

          varianza es solo un primer aviso. (Es el ejercicio 2 de este capítulo.)</p>

        piezas encajan en una sola explicación.</p>

              <p>En el instante $T$ conocemos $\varepsilon_T, \varepsilon_{T-1},\dots$ pero no
