            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Ver que la caja negra es un algoritmo con reglas

      <p>Hasta aquí la identificación ha sido artesanal: el explorador del Módulo 6 recorrió a mano los 27 modelos
        de la rejilla. <span data-afirma="c4-m7-01">En 2008 Rob Hyndman y Yeasmin Khandakar publicaron un algoritmo que automatiza esa búsqueda <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 1"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 1)</a></cite></span>,
        <span data-afirma="c4-m7-02">y es el que ejecuta <code>auto.arima()</code> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Details"><a href="#ref-m7-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Details)</a></cite></span>. Conviene entenderlo por dos razones opuestas: porque funciona
        sorprendentemente bien y hay que saber cuándo confiar en él, y porque <strong>no es una búsqueda
        exhaustiva</strong> y hay que saber cuándo desconfiar de él.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>El algoritmo, en cuatro pasos</h4>
        <ol>
          <li><span data-afirma="c4-m7-03"><strong>Elegir $d$</strong> con pruebas sucesivas de KPSS: se diferencia mientras KPSS rechace la
            estacionariedad <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 10"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 10)</a></cite></span>. (Aquí está el punto débil que destapó el Módulo 3.)</li>
          <li><span data-afirma="c4-m7-04"><strong>Ajustar cuatro modelos iniciales</strong> sobre la serie diferenciada: ARIMA($2,d,2$),
            ARIMA($0,d,0$), ARIMA($1,d,0$) y ARIMA($0,d,1$), con constante si $d \le 1$ <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 11"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 11)</a></cite>, y un quinto, ARIMA($0,d,0$)
            sin constante <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. <span data-afirma="c4-m7-05">El de menor AICc es el <em>modelo actual</em> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>; el artículo original elegía por AIC <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 11"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 11)</a></cite></span>.</li>
          <li><span data-afirma="c4-m7-06"><strong>Buscar en el vecindario:</strong> se prueban las variantes del modelo actual con $p$, $q$ o
            ambos modificados en $\pm 1$, y con o sin constante. En cuanto una mejora el AICc, pasa a ser el modelo
            actual y la búsqueda se reinicia desde él <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>.</li>
          <li><span data-afirma="c4-m7-07"><strong>Parar</strong> cuando ninguna variante del vecindario mejore <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>.</li>
        </ol>
        <div class="formula">
          $$\begin{aligned}
            \mathcal{N}(p,q):\quad &|p'-p| \le 1, \\
              &|q'-q| \le 1, \\
              &\text{con o sin } c
          \end{aligned}$$
        </div>
        <p><span data-afirma="c4-m7-09">Se descartan por el camino los ajustes que no convergen y los que tienen raíces demasiado cerca del círculo unitario <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 11"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 11)</a></cite>: el artículo rechaza el modelo con alguna raíz de módulo menor que $1.001$, y el código de <code>forecast</code> (versión 9.0.2) usa $|\text{raíz}| &lt; 1.01$ y asigna a esos modelos AICc $=\infty$</span>. <span data-afirma="c4-m7-10">Es lo que le pasa al ARIMA($2,1,2$) del Nilo con el ajuste que usa
          <code>auto.arima</code>, el CSS-ML de <code>Arima()</code>: su menor raíz AR tiene módulo $1.0009$, por debajo de los dos umbrales</span>. El
          explorador del Módulo 6, que ajusta por máxima verosimilitud exacta, muestra ese mismo modelo con la raíz
          AR en $2.241$ y sin aviso: es otro óptimo de la verosimilitud, algo peor ($\log L = -630.445$ frente a
          $-630.169$). La raíz depende del estimador; el bloque de código de más abajo da las dos.</p>
        <p style="margin-bottom:0;"><span data-afirma="c4-m7-11">Si $n &gt; 150$ o la frecuencia es mayor que $12$ <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Usage"><a href="#ref-m7-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Usage)</a></cite>, la búsqueda usa una verosimilitud aproximada (CSS) en lugar de la exacta y al final reajusta el ganador con la exacta <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Arguments"><a href="#ref-m7-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Arguments)</a></cite>: es la opción
          <code>approximation</code></span>. <span data-afirma="c4-m7-60">Con las $100$ observaciones del Nilo no se activa, así que los AICc de la traza
          son exactos.</span></p>
      </div>

      <p><span data-afirma="c4-m7-12">Sobre el Nilo, la búsqueda evalúa <strong>18 modelos</strong></span>. El simulador la recorre paso a paso:</p>

      <h3>Escalonada frente a exhaustiva</h3>

      <p data-afirma="c4-m7-61">La búsqueda escalonada evaluó $18$ modelos; la exhaustiva, $42$. Las dos llegan al mismo sitio:</p>

      <div class="formula">
        $$\begin{aligned}
          \text{escalonada: }&\text{ARIMA}(1,1,1), \\
          &\mathrm{AICc} = 1267.507 \\[0.5em]
          \text{exhaustiva: }&\text{ARIMA}(1,1,1), \\
          &\mathrm{AICc} = 1267.507
        \end{aligned}$$
      </div>

      <p>Aquí coinciden, pero <span data-afirma="c4-m7-13">no está garantizado que lo hagan <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. Lo que sí revela la búsqueda completa es
        <strong>cuán apretado está el podio</strong>:</p>

      <div class="diagram">
        <table style="position:relative;">
          <thead>
            <tr><th>Puesto</th><th>Modelo</th><th>AICc</th><th>Diferencia con el primero</th></tr>
          </thead>
          <tbody>

            <tr><td>3.º</td><td>ARIMA($0,1,2$)</td><td>$1268.210$</td><td>$+0.70$</td></tr>
            <tr><td>4.º</td><td>ARIMA($0,1,2$) con deriva</td><td>$1268.969$</td><td>$+1.46$</td></tr>
            <tr><td>5.º</td><td>ARIMA($0,1,1$)</td><td>$1269.216$</td><td>$+1.71$</td></tr>
            <tr><td>6.º</td><td>ARIMA($2,1,1$)</td><td>$1269.322$</td><td>$+1.81$</td></tr>
            <tr><td>7.º</td><td>ARIMA($1,1,2$)</td><td>$1269.348$</td><td>$+1.84$</td></tr>

      <div class="note">
        <p><span data-afirma="c4-m7-14"><strong>Siete modelos a menos de $2$ puntos de AICc.</strong> Son el ganador, otros cuatro sin
          constante —los del explorador del Módulo 6— y dos variantes con deriva. Este capítulo toma por convención que diferencias menores que $2$ no distinguen modelos.</span> <span data-afirma="c4-m7-15">Es decir: <code>auto.arima</code> devuelve un ganador
          con toda la seguridad de una sola línea de salida, y detrás de él hay <strong>seis candidatos indistinguibles según esa convención</strong>, incluido el ARIMA($0,1,1$) que proponía el correlograma
          del Módulo 4.</span> <span data-afirma="c4-m7-16">La función no miente; simplemente no está diseñada para comunicar esa incertidumbre. Pedir
          <code>trace = TRUE</code> no cuesta nada y la enseña.</span></p>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Tres cosas que
          <code>auto.arima</code> no hace</h4>
        <ul style="margin-bottom:0;">
          <li><strong>No mira el gráfico.</strong> Elige $d$ con KPSS, y en el Módulo 3 ya se vio lo que le pasa a
            KPSS con un cambio de nivel. Si la serie tiene un escalón, el algoritmo lo diferenciará.</li>
          <li><span data-afirma="c4-m7-17"><strong>No garantiza el óptimo.</strong> La búsqueda escalonada explora un vecindario, no la rejilla
            entera <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m7-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. <span data-afirma="c4-m7-18">Con series difíciles conviene contrastar con
            <code>stepwise = FALSE, approximation = FALSE</code> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Details"><a href="#ref-m7-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Details)</a></cite>, que es más lento y recorre todos los modelos con
            $p + q \le 5$ <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Arguments"><a href="#ref-m7-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Arguments)</a></cite></span>, <span data-afirma="c4-m7-19">aunque siempre con el mismo $d$ que eligió KPSS <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 10"><a href="#ref-m7-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 10)</a></cite></span>.</li>
          <li><strong>No sabe si el modelo tiene sentido.</strong> Optimiza un criterio numérico. Que la forma del
            pronóstico resultante sea razonable para el fenómeno le corresponde a quien modela (Módulo 9).</li>
        </ul>
      </div>

        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">library(forecast)

# trace = TRUE imprime CADA modelo evaluado y su AICc: la caja se abre sola
ajuste &lt;- auto.arima(Nile, trace = TRUE, seasonal = FALSE)
#&gt;  ARIMA(2,1,2) with drift         : Inf
#&gt;  ARIMA(0,1,0) with drift         : 1298.77
#&gt;  ARIMA(1,1,0) with drift         : 1283.598
#&gt;  ARIMA(0,1,1) with drift         : 1270.562
#&gt;  ARIMA(0,1,0)                    : 1296.738
#&gt;  ARIMA(1,1,1) with drift         : 1268.063
#&gt;  ...
#&gt;  Best model: ARIMA(1,1,1)

as.character(ajuste)
#&gt; [1] "ARIMA(1,1,1)"
round(ajuste$aicc, 3)
#&gt; [1] 1267.507

# La busqueda COMPLETA: mas lenta, pero sin vecindarios
completo &lt;- auto.arima(Nile, stepwise = FALSE, approximation = FALSE,
                       seasonal = FALSE)
c(escalonada = as.character(ajuste), exhaustiva = as.character(completo))
#&gt;     escalonada     exhaustiva
#&gt; "ARIMA(1,1,1)" "ARIMA(1,1,1)"      coinciden

# Cuantos modelos evalua cada una (las lineas "ARIMA(...) : AICc" de la traza)
n_modelos &lt;- function(...)
  sum(grepl("^ ARIMA.*:", capture.output(invisible(auto.arima(...)))))
c(escalonada = n_modelos(Nile, trace = TRUE, seasonal = FALSE),
  exhaustiva = n_modelos(Nile, trace = TRUE, seasonal = FALSE,
                         stepwise = FALSE, approximation = FALSE))
#&gt; escalonada exhaustiva
#&gt;         18         42

# El ARIMA(2,1,2), descartado por su raiz AR: depende del estimador
for (m in c("CSS-ML", "ML")) {
  a &lt;- Arima(Nile, order = c(2, 1, 2), method = m)
  cat(sprintf("%-6s logL = %.3f  min|raiz AR| = %.4f\n", m, a$loglik,
              min(Mod(polyroot(c(1, -coef(a)[c("ar1", "ar2")]))))))
}
#&gt; CSS-ML logL = -630.169  min|raiz AR| = 1.0009
#&gt; ML     logL = -630.445  min|raiz AR| = 2.2407
# CSS-ML (el de auto.arima) lo deja casi sobre el circulo; ML cae en otro
# optimo, de verosimilitud algo menor, con las raices lejos</code></pre>

          <pre><code class="language-python"># statsmodels NO trae el algoritmo de Hyndman-Khandakar. Con solo statsmodels
# la alternativa es la rejilla a mano, que para d fijo es corta y ademas se ve
# lo que hace, que es justo el objetivo de este modulo.
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
import warnings; warnings.filterwarnings("ignore")

nilo = sm.datasets.nile.load_pandas().data["volume"].values

mejor, mejor_aicc, evaluados = None, float("inf"), 0
for p in range(4):
    for q in range(4):
        try:
            f = ARIMA(nilo, order=(p, 1, q), trend="n").fit()
        except Exception:
            continue
        evaluados += 1
        if f.aicc &lt; mejor_aicc:        # f.aicc ya usa n - d (nobs_effective)
            mejor, mejor_aicc = (p, 1, q), f.aicc
print(mejor, round(mejor_aicc, 3), f"({evaluados} modelos)")

#   filtro a su manera, y el AIC ya difiere (1267.219 aqui, 1267.255 en R).

      <p>Por un camino o por otro, artesanal o automático, el modelo elegido todavía hay que diagnosticarlo. De eso
        se ocupa el Módulo 8, y ahí el Nilo guarda una sorpresa.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>NelPlo</code>, del paquete <code>tseries</code> (se carga con <code>data(NelPlo)</code>), reúne catorce series macroeconómicas que terminan en 1988. Toma la de producción industrial, <code>na.omit(NelPlo[, "ip"])</code>: 129 datos anuales, desde 1860, en la escala que trae el paquete (la ayuda no da unidades; sus valores van de $-0.105$ a $5.229$). Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>El modelo que devuelve <code>auto.arima()</code> con sus opciones por defecto, y cuántos modelos evaluó.</li>
            <li>Lo mismo con <code>stepwise = FALSE, approximation = FALSE</code>. ¿Coinciden?</li>
            <li>Ljung–Box(20) de los dos ganadores, y una explicación de por qué la búsqueda escalonada se detuvo donde se detuvo.</li>
          </ol>

            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m7-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m7-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m7-pista" hidden>
            <p style="margin:0;">Pide <code>trace = TRUE</code> en las dos llamadas y sigue la escalonada modelo a modelo: ¿de dónde partió, qué probó después y cuál de esos modelos mejoraba al de partida?</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m7-sol" hidden>
            <p><strong>Respuesta: no coinciden. La escalonada se queda en la caminata aleatoria con deriva tras evaluar 6 modelos; la exhaustiva evalúa 42 y encuentra un ARIMA($0,1,5$) con deriva, $6.1$ puntos mejor por AICc, que además es el único de los dos que pasa Ljung–Box.</strong></p>
            <pre><code class="language-r">library(forecast); library(tseries); data(NelPlo)
ip &lt;- na.omit(NelPlo[, "ip"])        # produccion industrial: 129 datos anuales
c(kpss = ndiffs(ip, test = "kpss"), adf = ndiffs(ip, test = "adf"), pp = ndiffs(ip, test = "pp"))
#&gt; kpss  adf   pp
#&gt;    1    1    1

# la traza de auto.arima, guardada como tabla
busca &lt;- function(...) {
  traza &lt;- capture.output(f &lt;- auto.arima(ip, trace = TRUE, ...))
  traza &lt;- grep("^ ARIMA", traza, value = TRUE)
  list(modelo = f, tabla = data.frame(modelo = trimws(sub(":.*", "", traza)),
                                      AICc = as.numeric(sub(".*:", "", traza))))
}
esc &lt;- busca()                                            # (a) escalonada
exh &lt;- busca(stepwise = FALSE, approximation = FALSE)     # (b) exhaustiva
c(escalonada = nrow(esc$tabla), exhaustiva = nrow(exh$tabla))
#&gt; escalonada exhaustiva
#&gt;          6         42
esc$tabla
#&gt;                    modelo      AICc
#&gt; 1 ARIMA(2,1,2) with drift       Inf
#&gt; 2 ARIMA(0,1,0) with drift -233.7216
#&gt; 3 ARIMA(1,1,0) with drift -231.8176
#&gt; 4 ARIMA(0,1,1) with drift -231.8846
#&gt; 5            ARIMA(0,1,0) -213.5061
#&gt; 6 ARIMA(1,1,1) with drift -230.4742
head(exh$tabla[order(exh$tabla$AICc), ], 5)
#&gt;                     modelo      AICc
#&gt; 12 ARIMA(0,1,5) with drift -239.8190
#&gt; 42 ARIMA(5,1,0) with drift -235.6016
#&gt; 2  ARIMA(0,1,0) with drift -233.7216
#&gt; 6  ARIMA(0,1,2) with drift -232.2236
#&gt; 4  ARIMA(0,1,1) with drift -231.8846
exh$tabla[grepl("^ARIMA\\(0,1,[0-5]\\) with drift", exh$tabla$modelo), ]
#&gt;                     modelo      AICc
#&gt; 2  ARIMA(0,1,0) with drift -233.7216
#&gt; 4  ARIMA(0,1,1) with drift -231.8846
#&gt; 6  ARIMA(0,1,2) with drift -232.2236
#&gt; 8  ARIMA(0,1,3) with drift -231.2059
#&gt; 10 ARIMA(0,1,4) with drift -229.7230
#&gt; 12 ARIMA(0,1,5) with drift -239.8190

# (c) el diagnostico de los dos ganadores
lb &lt;- function(f, k) Box.test(residuals(f), lag = 20, type = "Ljung-Box", fitdf = k)$p.value
round(c(escalonada = lb(esc$modelo, 0), exhaustiva = lb(exh$modelo, 5)), 4)
#&gt; escalonada exhaustiva
#&gt;     0.0471     0.7317
round(rbind(coef = coef(exh$modelo), ee = sqrt(diag(exh$modelo$var.coef))), 3)
#&gt;        ma1    ma2    ma3    ma4    ma5 drift
#&gt; coef 0.033 -0.091 -0.023 -0.189 -0.360 0.042
#&gt; ee   0.085  0.087  0.078  0.088  0.094 0.003</code></pre>
            <p><strong>(a)</strong> <code>auto.arima(ip)</code> devuelve un ARIMA($0,1,0$) con deriva, AICc $-233.72$, después de evaluar 6 modelos (uno de ellos, el ARIMA($2,1,2$) con deriva, descartado con AICc $= \infty$).</p>
            <p><strong>(b)</strong> La exhaustiva evalúa 42 y devuelve un ARIMA($0,1,5$) con deriva, AICc $-239.82$: $6.10$ puntos menos. El segundo de su lista, un ARIMA($5,1,0$) con deriva, también mejora al de la escalonada.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El ganador de la escalonada no pasa Ljung–Box(20) ($p = 0.047$); el de la exhaustiva, sí ($p = 0.73$). La escalonada no falló por descuido. De sus cinco modelos iniciales, el mejor fue el ARIMA($0,1,0$) con deriva; después solo evaluó uno más, el ARIMA($1,1,1$) con deriva, que no lo mejoraba, y paró, como manda su regla. Lo que le falta a ese modelo está en el rezago 5 ($\hat\theta_5 = -0.360$, con error estándar $0.094$), y por el camino no hay nada que ganar: los ARIMA($0,1,q$) con deriva de $q = 1$ a $4$ tienen todos peor AICc que el de partida. Es el límite que avisa el módulo: la búsqueda escalonada explora un vecindario, y aquí la mejora estaba fuera de él. Lo delataba el diagnóstico.</p>
          </div>
        </div>

  <template id="module-8">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 8</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.8 Diagnóstico y errores
          comunes <span class="text-gray-400 font-normal text-2xl">/ Diagnostics &amp; common pitfalls</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer la sobrediferenciación por su firma
              algebraica, y cerrar el caso del Nilo que quedó abierto en el Módulo 1.</p>
          </div>
        </div>
      </div>

      <p>El diagnóstico de residuales es el del Capítulo 3 y no cambia: <span data-afirma="c4-m8-01">correlograma dentro de la banda, Ljung–Box
        con <code>fitdf = p + q</code> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite>, media cero, varianza estable <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite></span>. El ARIMA($1,1,1$) del Nilo lo pasa con holgura
        —Ljung–Box(20) $p = 0.800$, <span data-afirma="c4-m8-02">Shapiro $p = 0.731$ <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span>— y ahí terminaría el capítulo si el diagnóstico se agotara
        en los residuales. No se agota.</p>

      <h3>La sobrediferenciación tiene una firma exacta</h3>

      <p><span data-afirma="c4-m8-03">Si se diferencia de más, el modelo lo compensa introduciendo una <strong>raíz unitaria en la parte
        MA</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite>: el factor $(1+\theta B)$ se convierte en $(1-B)$ y cancela la diferencia sobrante.</span> En el caso
        más simple, si $w_t = \nabla y_t$ ya es ruido blanco, una diferencia más produce</p>

      <div class="formula">
        $$\nabla^2 y_t = (1-B)\,w_t = \varepsilon_t - \varepsilon_{t-1},$$
      </div>

      <p><span data-afirma="c4-m8-04">que es un MA(1) con $\theta = -1$ exactamente <cite class="cita" data-ref="cryer2008time" data-loc="p. 126"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 126)</a></cite></span>. No es una metáfora, es álgebra, y se ve en el número:</p>

      <div class="simulador" data-simulador="sobrediferenciacion">
        <h4><i class="fas fa-scissors" aria-hidden="true"></i> Diferenciar de más, y verlo</h4>
        <p class="simulador-intro">Sube el orden $d$ sobre el Nilo y ajusta un MA(1) a cada resultado. ¿Con qué $d$
          llega $\hat\theta$ a $-1$? ¿Qué le pasa entonces a $|\text{raíz MA}|$, y qué dice el diagnóstico?</p>
        <div class="simulador-controles"></div>
        <div class="simulador-lectura"></div>
        <p class="grafico-etiqueta">Serie diferenciada $\nabla^d y_t$</p>
        <div class="grafico-wrapper" style="height:220px;">
          <canvas aria-label="Serie del Nilo diferenciada d veces" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Varianza por orden de diferenciación (escala logarítmica)</p>
        <div class="grafico-wrapper" style="height:220px;">
          <canvas aria-label="Varianza de la serie según el orden de diferenciación" role="img"></canvas>
        </div>
      </div>

      <div class="diagram">
        <table style="position:relative;">
          <thead>
            <tr><th>$d$</th><th>$\operatorname{Var}(\nabla^d y)$</th><th>$\rho_1$</th><th>$\hat\theta$ de un MA(1)</th><th>Lectura</th></tr>
          </thead>
          <tbody>
            <tr><td>0</td><td>$28\,637.95$</td><td>$0.498$</td><td>$0.378$</td><td>Sin diferenciar.</td></tr>
            <tr style="background:rgba(1,40,32,0.05);"><td>1</td><td>$28\,268.34$</td><td>$-0.402$</td>
              <td>$-0.733$</td><td>Raíz MA en $1.364$, fuera del círculo.</td></tr>
            <tr><td>2</td><td>$80\,055.01$</td><td>$-0.626$</td><td>$\mathbf{-1.000}$</td>
              <td>Raíz unitaria en el MA.</td></tr>
            <tr><td>3</td><td>$262\,507.29$</td><td>$-0.719$</td><td>$\mathbf{-1.000}$</td>
              <td>Peor todavía.</td></tr>
          </tbody>
        </table>
      </div>

      <p>En $d = 2$ y $d = 3$ el $\hat\theta$ se clava en $-1$ y la raíz MA queda sobre el círculo unidad: el
        término MA está deshaciendo la diferencia que se acaba de imponer.</p>

      <p>Hay una prueba más de que el MA está deshaciendo la diferencia. <span data-afirma="c4-m8-05">Con $\hat\theta = -1$, el MA(1) ajustado
        sobre $\nabla^2 y$ da $\hat\sigma^2 = 28\,268.34$, que es exactamente $\operatorname{Var}(\nabla y)$: el
        modelo ha recuperado la serie con una sola diferencia. Con $d = 3$ ocurre lo mismo, y su $\hat\sigma^2 =
        80\,055.05$ reproduce la varianza de $\nabla^2 y$, que es $80\,055.01$.</span></p>

      <p>Y esto explica de golpe lo que se veía en la rejilla del Módulo 6. <span data-afirma="c4-m8-06">De los nueve modelos con $d = 2$,
        <strong>cuatro tienen $|\text{raíz MA}| = 1.000$ a tres decimales</strong>: los ARIMA($0,2,1$), ($0,2,2$),
        ($1,2,1$) y ($2,2,1$). Entre ellos está el mejor por BIC de ese grupo. La rejilla no solo premia modelos con
        un $d$ equivocado: premia los que son <em>numéricamente degenerados</em>.</span></p>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>La columna de la varianza no
          decide $d$</h4>
        <p>Es tentador leer la tabla con la regla «si al diferenciar la varianza sube, te has pasado». En el Nilo
          coincide con lo demás, pero <strong>no es una evidencia aparte</strong>: <span data-afirma="c4-m8-60">como mostró el Capítulo 2
          (Módulo 2.7), en una serie estacionaria el cociente de varianzas al diferenciar se acerca a $2(1-r_1)$,
          así que la varianza repite lo que dice $r_1$, y $r_1$ solo no dice si hay una raíz unitaria.</span> Sobre
          <code>log(lynx)</code>, diferenciar <em>reduce</em> la varianza un $58\,\%$ ($1.653 \to 0.687$) y <span data-afirma="c4-m8-10">aun así $d = 1$ sobra: una serie con ciclos de longitud no fija, como la del lince, es estacionaria <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.1"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.1)</a></cite>, y ADF, KPSS y Phillips–Perron coinciden en no diferenciar</span>. <span data-afirma="c4-m8-11">Lo que sí lo detecta ahí es la
          raíz: el ARIMA($2,1,1$) sobre esa serie da $|\text{raíz MA}| = 1.000$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite></span>. <strong>Hay que mirar siempre las
          raíces.</strong> <span data-afirma="c4-m8-61">El $\hat\rho_1$ de la serie diferenciada no avisa aquí: vale $0.565$, positivo y lejos de
          $-0.5$ <cite class="cita" data-ref="hamilton1994time" data-loc="p. 49"><a href="#ref-m8-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 49)</a></cite>, que es la manera en que ese indicio falla (Módulo 2.7).</span> (El bloque de
          abajo lo calcula.)</p>
      </div>

      <pre><code class="language-r">ly &lt;- log(lynx)
c(kpss = forecast::ndiffs(ly, test = "kpss"), adf = forecast::ndiffs(ly, test = "adf"),
  pp = forecast::ndiffs(ly, test = "pp"))
#&gt; kpss  adf   pp
#&gt;    0    0    0
round(c(var_d0 = var(ly), var_d1 = var(diff(ly)), caida = 1 - var(diff(ly)) / var(ly)), 4)
#&gt; var_d0 var_d1  caida
#&gt; 1.6532 0.6871 0.5844
r1 &lt;- acf(ly, plot = FALSE)$acf[2]
round(c(r1 = r1, cociente = var(diff(ly)) / var(ly), dos_por_1_menos_r1 = 2 * (1 - r1),
        r1_de_la_diferencia = acf(diff(ly), plot = FALSE)$acf[2]), 3)
#&gt;                  r1            cociente  dos_por_1_menos_r1 r1_de_la_diferencia
#&gt;               0.785               0.416               0.430               0.565
f &lt;- arima(ly, order = c(2, 1, 1), method = "ML")
round(c(theta = coef(f)[["ma1"]], raiz_MA = Mod(polyroot(c(1, coef(f)[["ma1"]])))), 4)
#&gt;   theta raiz_MA
#&gt;      -1       1</code></pre>

      <h3>El caso del Nilo, cerrado</h3>

      <p>Queda por cerrar lo que quedó pendiente. En el Módulo 1 apareció que integrar la serie del Nilo con sus
        coeficientes estimados <em>casi no cambia la varianza</em> (razón $1.006$), porque $\theta = -0.874$ está cerca
        de $-1$. En el Módulo 3, que dos de las tres pruebas de raíz unitaria dicen que no hay que diferenciar, y que
        KPSS —<span data-afirma="c4-m8-65">la que usa <code>auto.arima</code> <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 10"><a href="#ref-m8-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 10)</a></cite></span>— rechaza el $100\,\%$ de las veces cuando hay un escalón. Las dos
        piezas encajan en una sola explicación.</p>

      <p>La serie cae de una media de $1097.75$ antes de 1899 a $849.97$ desde ese año, y <span data-afirma="c4-m8-12">la ayuda de R de la serie señala un cambio aparente cerca de 1898 <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span>. La alternativa a la raíz unitaria es <span data-afirma="c4-m8-14">un escalón: el modelo de dos
        medias del Módulo 3, con $d = 0$ y un solo regresor, que vale $1$ desde 1899 <cite class="cita" data-ref="cryer2008time" data-loc="p. 251"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 251)</a></cite></span>,</p>

      <div class="formula">
        $$y_t = \mu + \beta\,\mathbf{1}\{t \ge 1899\} + \varepsilon_t$$
        $$\begin{gathered} \hat{\beta}_{1899} = -247.78 \\ \text{e.e.} = 28.15, \qquad t = -8.80 \end{gathered}$$
      </div>

      <p>Con ese modelo el resultado es contundente <span data-afirma="c4-m8-15"><strong>dentro de su propio $d$</strong>: AICc $1257.91$ frente a
        $1282.50$ del mejor ARMA sin escalón <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.9"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.9)</a></cite></span>, casi $25$ puntos, y sus residuales pasan Ljung–Box(20) con
        $p = 0.812$.</p>

      <div class="note">
        <p><strong>La lectura honesta.</strong> <span data-afirma="c4-m8-16">El ARIMA($1,1,1$) probablemente está diferenciando una serie que no
          tiene raíz unitaria, sino un cambio de nivel</span>; y <span data-afirma="c4-m8-62">su $\theta$ cercano a $-1$ es el modelo intentando deshacer
          esa diferencia de más <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite></span>. <span data-afirma="c4-m8-17">Un ARIMA sin término de intervención no tiene dónde poner el cambio de nivel <cite class="cita" data-ref="cryer2008time" data-loc="p. 250"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 250)</a></cite>, así que lo absorbe subiendo $d$.</span> Por eso la etapa 1 del ciclo empieza mirando el gráfico y no lanzando pruebas.</p>
      </div>

      <div class="warning">
        <p><strong>Y ahora la parte incómoda.</strong> Todo lo anterior es evidencia dentro de muestra. <span data-afirma="c4-m8-18">Comparar el
          escalón contra el ARIMA($1,1,1$) por AICc <strong>no se puede</strong>: uno tiene $d=0$ y el otro $d=1$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite>.
          La comparación válida es fuera de muestra <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.9"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.9)</a></cite>.</span> Se entrena hasta 1950, se pronostican los 20 años siguientes y se
          miden la raíz del error cuadrático medio (RMSE) y el error absoluto medio (MAE) de esos 20 pronósticos. <span data-afirma="c4-m8-63">El
          <em>naïve</em> repite siempre el último valor observado: es la caminata aleatoria <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.2"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.2)</a></cite></span>.</p>
        <table style="position:relative;">
          <thead><tr><th>Modelo</th><th>RMSE</th><th>MAE</th></tr></thead>
          <tbody>
            <tr><td>Naïve (el último valor)</td><td>$123.06$</td><td>$101.95$</td></tr>
            <tr><td>ARIMA($1,1,1$)</td><td>$125.05$</td><td>$106.16$</td></tr>
            <tr><td>Escalón 1899 ($d = 0$)</td><td>$127.99$</td><td>$106.99$</td></tr>
            <tr><td>Escalón 1899 + AR(1)</td><td>$128.31$</td><td>$107.40$</td></tr>
            <tr><td>Media del entrenamiento (1871–1950)</td><td>$133.31$</td><td>$108.01$</td></tr>
          </tbody>
        </table>
        <p style="margin-bottom:0;">El modelo del escalón, que dominaba dentro de muestra por $25$ puntos de AICc,
          <strong>no pronostica mejor</strong>. Y el que gana es el más simple de todos. Conviene no
          sobreinterpretarlo:
          el rango completo va de $123$ a $133$ mientras la desviación típica de los residuales es $139.67$, así
          que <em>ninguna</em> de estas diferencias es grande. La conclusión no es "el naïve es mejor", sino que
          <span data-afirma="c4-m8-20"><strong>una ventaja de ajuste dentro de muestra no se traduce automáticamente en capacidad de
          pronóstico</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.8"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.8)</a></cite></span>. Medir eso con seriedad —con más de un origen, y preguntándose si la diferencia es
          significativa— es el Capítulo 6.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Diagnóstico y sobrediferenciación">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">library(forecast)

# --- La firma de la sobrediferenciacion ---------------------------------
for (d in 1:3) {
  x &lt;- diff(Nile, differences = d)
  f &lt;- arima(x, order = c(0, 0, 1), include.mean = FALSE, method = "ML")
  cat(sprintf("d = %d  var = %9.0f  theta = %7.4f  |raiz MA| = %.4f\n",
              d, var(x), coef(f)[["ma1"]], Mod(polyroot(c(1, coef(f)[["ma1"]])))))
}
#&gt; d = 1  var =     28268  theta = -0.7329  |raiz MA| = 1.3644
#&gt; d = 2  var =     80055  theta = -1.0000  |raiz MA| = 1.0000   &lt;- degenerado
#&gt; d = 3  var =    262507  theta = -1.0000  |raiz MA| = 1.0000

# --- Cuantos modelos de la rejilla son degenerados ----------------------
for (q in 1:2) for (p in 0:2) {
  f &lt;- arima(Nile, order = c(p, 2, q), method = "ML")
  ma &lt;- f$coef[grepl("^ma", names(f$coef))]
  cat(sprintf("ARIMA(%d,2,%d)  min|raiz MA| = %.4f\n", p, q,
              min(Mod(polyroot(c(1, ma))))))
}
#&gt; ARIMA(0,2,1)  min|raiz MA| = 1.0000
#&gt; ARIMA(1,2,1)  min|raiz MA| = 1.0000
#&gt; ARIMA(2,2,1)  min|raiz MA| = 1.0000
#&gt; ARIMA(0,2,2)  min|raiz MA| = 1.0000
#&gt; ARIMA(1,2,2)  min|raiz MA| = 1.0316
#&gt; ARIMA(2,2,2)  min|raiz MA| = 1.0483

# --- El escalon de 1899: y_t = mu + beta * 1{t &gt;= 1899} + e_t ---------
escalon &lt;- as.numeric(time(Nile) &gt;= 1899)
fe &lt;- arima(Nile, order = c(0, 0, 0), xreg = escalon, method = "ML")
round(c(coef(fe)[["escalon"]], sqrt(diag(fe$var.coef))[["escalon"]]), 2)
#&gt; [1] -247.78   28.15
Box.test(residuals(fe), lag = 20, type = "Ljung-Box")$p.value
#&gt; [1] 0.8124319      los residuales de un modelo SIN parte ARMA ya son ruido

# --- La unica comparacion valida entre d distintos: fuera de muestra ----
ent &lt;- window(Nile, end = 1950); pru &lt;- window(Nile, start = 1951)
esc_e &lt;- as.numeric(time(ent) &gt;= 1899)
rmse &lt;- function(p) round(sqrt(mean((as.numeric(pru) - as.numeric(p))^2)), 2)
c(arima       = rmse(forecast(Arima(ent, order = c(1,1,1)), h = 20)$mean),
  escalon     = rmse(forecast(Arima(ent, order = c(0,0,0), xreg = esc_e),
                              xreg = rep(1, 20))$mean),
  escalon_ar1 = rmse(forecast(Arima(ent, order = c(1,0,0), xreg = esc_e),
                              xreg = rep(1, 20))$mean),
  naive       = rmse(rep(tail(ent, 1), 20)),
  media       = rmse(rep(mean(ent), 20)))
#&gt;       arima     escalon escalon_ar1       naive       media
#&gt;      125.05      127.99      128.31      123.06      133.31</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox
import warnings; warnings.filterwarnings("ignore")

nilo = sm.datasets.nile.load_pandas().data["volume"].values
anios = np.arange(1871, 1971)

# La firma de la sobrediferenciacion
for d in (1, 2, 3):
    x = np.diff(nilo, n=d)
    f = ARIMA(x, order=(0, 0, 1), trend="n").fit()
    th = f.params[0]
    print(f"d = {d}  var = {x.var(ddof=1):9.0f}  theta = {th:7.4f}  "
          f"|raiz MA| = {abs(np.roots([th, 1])[0]):.4f}")
#&gt; d = 1  var =     28268  theta = -0.7329  |raiz MA| = 1.3644
#&gt; d = 2  var =     80055  theta = -0.9988  |raiz MA| = 1.0012
#&gt; d = 3  var =    262507  theta = -0.9980  |raiz MA| = 1.0020
#   El optimizador de statsmodels se queda a 0.0012 y 0.0020 del borde en vez
#   de clavarse en -1 como el de R. La lectura no cambia: raiz sobre el circulo.

# El escalon de 1899 como regresor externo
escalon = (anios &gt;= 1899).astype(float).reshape(-1, 1)
fe = ARIMA(nilo, order=(0, 0, 0), exog=escalon, trend="c").fit()
print(round(fe.params[1], 2), round(fe.bse[1], 2), round(fe.params[1] / fe.bse[1], 2))
#&gt; -247.78 27.77 -8.92
#   el coeficiente coincide con R; el error estandar no exactamente (R da
#   28.15 y t = -8.80)
print(round(float(acorr_ljungbox(fe.resid, lags=[20])["lb_pvalue"].iloc[0]), 4))
#&gt; 0.8124</code></pre>
        </div>
      </div>

      <p>Lo que sí separa de raíz a estos modelos es lo que dicen del futuro lejano: <span data-afirma="c4-m8-64">el escalón pronostica un nivel
        fijo con una banda que no se ensancha, y el ARIMA($1,1,1$), una banda que no deja de abrirse <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>. Esa diferencia
        no la deciden los coeficientes sino $d$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>, y es el tema del Módulo 9.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Una serie estacionaria, diferenciada sin necesidad: <code>set.seed(2026); y &lt;- arima.sim(n = 200, model = list(ar = 0.8))</code>. No le falta ninguna diferencia. Trabaja con $d = 1$ como si no se supiera y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>El $\hat\rho_1$ de $\nabla y_t$. ¿Avisa de que la diferencia sobra?</li>
            <li>El ARIMA($0,1,1$) y el ARIMA($1,1,1$), por máxima verosimilitud: coeficientes, módulo de la raíz MA y Ljung–Box(20). ¿Cuál de los dos muestra la firma de la sobrediferenciación?</li>
            <li>La explicación algebraica: escribe el modelo que sigue $\nabla y_t$ a partir del AR(1).</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m8-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m8-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m8-pista" hidden>
            <p style="margin:0;">Para (c), aplica $(1 - B)$ a los dos lados de $(1 - \phi B)\,y_t = \varepsilon_t$ y mira qué polinomio queda del lado de los choques. Después vuelve a (b) y pregúntate cuál de los dos modelos tiene sitio para lo que queda del otro lado.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m8-sol" hidden>
            <p><strong>Respuesta: la firma aparece solo en el ARIMA($1,1,1$): $\hat\theta = -1.000$ y raíz MA de módulo $1.000$. El ARIMA($0,1,1$) pasa el diagnóstico sin ninguna señal, y el $\hat\rho_1$ tampoco avisa.</strong></p>
            <pre><code class="language-r">set.seed(2026)
y &lt;- arima.sim(n = 200, model = list(ar = 0.8))    # estacionaria: no le falta ninguna diferencia
w &lt;- diff(y)                                       # y aun asi se diferencia

# (a) el indicio: el r1 de la serie diferenciada
round(c(r1_medido = acf(w, plot = FALSE)$acf[2], r1_teorico = -(1 - 0.8) / 2), 3)
#&gt;  r1_medido r1_teorico
#&gt;     -0.185     -0.100

# (b) dos modelos con d = 1
for (o in list(c(0, 1, 1), c(1, 1, 1))) {
  f &lt;- arima(y, order = o, method = "ML")
  cat(sprintf("ARIMA(%d,1,%d)  coef: %s  |raiz MA| = %.4f  LB(20) p = %.3f\n", o[1], o[3],
      paste(names(coef(f)), sprintf("%.4f", coef(f)), collapse = "  "),
      Mod(polyroot(c(1, coef(f)[["ma1"]]))),
      Box.test(residuals(f), lag = 20, type = "Ljung-Box", fitdf = o[1] + o[3])$p.value))
}
#&gt; ARIMA(0,1,1)  coef: ma1 -0.2010  |raiz MA| = 4.9756  LB(20) p = 0.563
#&gt; ARIMA(1,1,1)  coef: ar1 0.8092  ma1 -1.0000  |raiz MA| = 1.0000  LB(20) p = 0.679

# (c) el modelo sin diferenciar
round(coef(arima(y, order = c(1, 0, 0), method = "ML")), 4)
#&gt;       ar1 intercept
#&gt;    0.7999    0.2682</code></pre>
            <p><strong>(a)</strong> $\hat\rho_1 = -0.185$, lejos de $-0.5$. No avisa, y no es mala suerte: para un AR(1) diferenciado el valor teórico es $-(1-\phi)/2 = -0.10$. Es el indicio fallando en uno de sus dos sentidos (Módulo 2.7).</p>
            <p><strong>(b)</strong> ARIMA($0,1,1$): $\hat\theta = -0.201$, raíz MA en $4.98$, Ljung–Box(20) $p = 0.56$. Es un modelo con una diferencia de más que pasa el diagnóstico. ARIMA($1,1,1$): $\hat\phi = 0.809$ y $\hat\theta = -1.000$, con la raíz MA de módulo $1.000$ ($p = 0.68$). Ahí está la firma.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> $(1 - \phi B)\,\nabla y_t = (1 - B)\,\varepsilon_t$: la serie diferenciada es un ARMA($1,1$) con el mismo $\phi$ y $\theta = -1$. El ARIMA($1,1,1$) tiene sitio para las dos partes, y por eso las encuentra: su $\hat\phi = 0.809$ es casi el del AR(1) ajustado sin diferenciar ($0.800$). Al ARIMA($0,1,1$) le falta la parte AR, y su único coeficiente se reparte entre imitarla y deshacer la diferencia: no llega a $-1$. Aquí, la raíz MA solo delató la diferencia sobrante en el modelo que tenía sitio para la parte AR. No siempre sale tan limpio: en 200 series generadas igual (semillas 1 a 200), la raíz MA del ARIMA($1,1,1$) queda por debajo de $1.05$ en el $78\,\%$.</p>
