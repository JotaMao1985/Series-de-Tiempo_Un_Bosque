        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.5 La constante: media y

        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Saber qué significa la $c$ de la ecuación según el
              valor de $d$, y por qué el software cambia de nombre y de comportamiento con ella.</p>
          </div>
        </div>
      </div>

      <p>La constante $c$ de la ecuación del Módulo 1, la decisión que el Módulo 4 dejó pendiente, es el
        parámetro que más confusión causa de toda la familia ARIMA, porque <strong>significa cosas distintas según
        $d$</strong> y porque cada programa la llama de una manera. Merece la pena aclararlo de una vez.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Qué es $c$ en cada caso</h4>
        <p>Se parte de $\phi(B)(1-B)^d y_t = c + \theta(B)\varepsilon_t$ y se toman esperanzas. Llamando
          $w_t = (1-B)^d y_t$ y $\mu_w = \operatorname{E}[w_t]$:</p>
        $$\mu_w = \frac{c}{1 - \phi_1 - \cdots - \phi_p} = \frac{c}{\phi(1)}$$
        <ul>
          <li><strong>$d = 0$:</strong> $w_t = y_t$, así que $\mu_w$ es <strong>la media de la serie</strong>. R la
            llama <code>intercept</code> aunque sea una media, lo que despista.</li>
          <li><strong>$d = 1$:</strong> $\mu_w$ es la media de las <em>diferencias</em>, es decir, el
            <strong>incremento medio por período</strong>. Eso es una tendencia lineal en $y_t$, y es lo que
            <code>forecast</code> llama <strong>deriva</strong> (<em>drift</em>).</li>
          <li><strong>$d = 2$:</strong> $\mu_w$ sería la aceleración media, y produce una tendencia
            <strong>cuadrática</strong>. Prácticamente nunca se quiere.</li>
        </ul>
        <p style="margin-bottom:0;">Regla mnemotécnica: <strong>cada diferencia sube en un grado el polinomio de la
          tendencia</strong> que la constante genera: a largo plazo, $\hat y_{n+h}$ crece como
          $\mu_w\, h^d / d!$. Sin constante: $d=0$ tiende a cero, $d=1$ se queda plano, $d=2$ sigue una recta. Con
          constante: $d=0$ vuelve a la media, $d=1$ recta, $d=2$ parábola.</p>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>Los valores por defecto no son los
          mismos en cada función</h4>
        <table style="position:relative;">
          <thead>
            <tr><th>Función</th><th>Argumento</th><th>Por defecto</th></tr>
          </thead>
          <tbody>
            <tr><td><code>stats::arima</code></td><td><code>include.mean</code></td>
              <td><code>TRUE</code>, pero solo se usa si $d = 0$. <strong>Con $d \ge 1$ se ignora en
                silencio</strong>: la deriva solo entra como regresor, <code>xreg = seq_along(y)</code>, que es lo que
                hace <code>forecast::Arima</code> por dentro.</td></tr>
            <tr><td><code>forecast::Arima</code></td><td><code>include.drift</code></td>
              <td><code>FALSE</code>. Y con $d \ge 2$ <strong>avisa y no la ajusta</strong>: <em>"No drift term
                fitted as the order of difference is 2 or more."</em></td></tr>
            <tr><td><code>forecast::auto.arima</code></td><td>—</td>
              <td>Con $d = 1$ prueba con y sin deriva (con $d = 0$, con y sin media) como un movimiento más de la
                búsqueda, y elige por AICc; con $d \ge 2$ nunca la incluye. Por eso en su traza el mismo orden
                aparece con y sin constante.</td></tr>
            <tr><td><code>statsmodels ARIMA</code></td><td><code>trend</code></td>
              <td><code>"c"</code> si $d=0$, <code>"n"</code> si $d&gt;0$. Para pedir deriva con $d=1$ hay que poner
                <code>trend="t"</code>; con $d \ge 2$ <strong>lanza un <code>ValueError</code></strong>, porque un
                término de orden menor que $d$ lo elimina la propia diferenciación.</td></tr>
          </tbody>
        </table>
        <p style="margin-bottom:0;">Consecuencia práctica: si un ajuste de <code>arima()</code> y uno de
          <code>auto.arima()</code> no coinciden, lo primero que hay que mirar no son los órdenes sino
          <strong>si uno lleva deriva y el otro no</strong>.</p>
      </div>

      <h3>¿Lleva deriva el Nilo?</h3>

      <p>Con $d = 1$ la deriva se escribe como una pendiente explícita, que es la forma en que la estima
        <code>forecast::Arima</code>. Para el ARIMA($1,1,1$):</p>

      <div class="formula">
        $$y_t = \delta\,t + \eta_t$$
        $$(1-\phi_1 B)(1-B)\,\eta_t = (1+\theta_1 B)\,\varepsilon_t$$
        $$\operatorname{E}[\nabla y_t] = \delta = \mu_w = \frac{c}{1-\phi_1}$$
      </div>

      <p>Se ajusta ese modelo y se mira el estadístico $t$ de $\hat\delta$, como con cualquier otro
        coeficiente:</p>

      <div class="formula">
        $$\begin{gathered} \hat{\delta} = -2.883 \\ \text{e.e.} = 2.017, \qquad t = -1.43 \end{gathered}$$
      </div>

      <p>No es significativa (en la ecuación del Módulo 1 equivaldría a
        $c = \hat\delta\,(1-\hat\phi_1) = -2.883 \times (1 - 0.271) = -2.10$). Y el AICc lo confirma: $1268.06$ con deriva frente a $1267.51$ sin ella —
        añadirla empeora. Tiene sentido físico: no hay ninguna razón para creer que el caudal del Nilo disminuya
        <em>indefinidamente</em> a razón de $2.9 \times 10^8\ \text{m}^3$ por año. Una deriva estimada es una tendencia que se
        extrapola sin límite, y eso es una afirmación fuerte sobre el futuro que conviene no hacer a la ligera.</p>

      <div class="note">
        <p><strong>El mismo cálculo en la TRM.</strong> Sobre la tasa de cambio mensual, añadiendo deriva a la
          caminata aleatoria que elige <code>auto.arima</code> —un ARIMA($0,1,0$), en el que $\hat\delta$ es
          simplemente la media de las diferencias—, la deriva estimada es
          $8.00$ pesos/mes con error estándar $10.36$: $t = 0.77$. Tampoco es significativa, aunque a ojo la serie
          "claramente sube". Que una tendencia visible no sea estadísticamente distinguible de cero con $n = 138$
          dice más sobre la variabilidad de la serie que sobre la tendencia, y es exactamente el tipo de conclusión
          que un modelo obliga a hacer explícita.</p>
      </div>

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Recorrer los 27 modelos de la rejilla y entender por
              qué el mínimo global de AICc <strong>no</strong> es la respuesta.</p>

      <p>La estimación es la del Capítulo 3: máxima verosimilitud sobre la serie diferenciada. Lo que cambia es la
        comparación, y cambia de una forma que se pasa por alto constantemente.</p>

      <div class="formula">
        $$\mathrm{AIC} = -2\log L + 2k$$
        $$\mathrm{AICc} = \mathrm{AIC} + \frac{2k(k+1)}{n^{*} - k - 1}$$
        $$\mathrm{BIC} = -2\log L + k\log n^{*}$$
        <p style="margin:0.6rem 0 0 0; font-size:0.9rem;">con $k = p + q + 1$ (los coeficientes ARMA más
          $\hat\sigma^2$; más uno si hay constante o deriva) y $n^{*} = n - d$ el <strong>número efectivo</strong> de
          observaciones.</p>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>El AIC no cruza la frontera de $d$</h4>
        <p>Ese $n^{*} = n - d$ es la clave. La verosimilitud de un ARIMA con $d = 1$ se calcula sobre las $99$
          diferencias del Nilo; la de uno con $d = 2$, sobre $98$ segundas diferencias. <strong>Son datos
          distintos</strong>, y una verosimilitud solo es comparable con otra calculada sobre los mismos datos. Un
          AICc menor con más diferencias no significa un modelo mejor: es la verosimilitud de otros datos, con una
          observación menos.</p>
        <p style="margin-bottom:0;">Por eso las tablas de este capítulo <strong>agrupan por $d$</strong>; la tabla
          ordenable de abajo mezcla los 27 modelos a propósito, para que el error quede a la vista. Cuando de verdad
          haya que decidir entre distintos $d$, la comparación válida es fuera de muestra (Módulo 8), apoyada en
          las pruebas de raíz unitaria y en el criterio sustantivo de qué proceso genera los datos.</p>
      </div>

      <!--RANKING:rejilla-nilo|Los 27 modelos del Nilo, con su n efectivo a la vista|-->

      <p>Si alguien mirase solo la columna de AICc y tomara el número más pequeño de toda la tabla, elegiría el
        ARIMA($1,2,2$) con $1264.60$. Sería un error por partida doble: ese valor se calcula sobre $98$
        observaciones y no sobre $99$, y además el propio ARIMA($1,2,2$) tiene una raíz MA en $1.03$, casi sobre
        el círculo unitario, síntoma de haber diferenciado de más. No es un caso aislado: como se verá en el
        Módulo 8, <strong>cuatro de los nueve modelos con $d = 2$ tienen una raíz MA exactamente sobre el círculo
        unitario</strong>. La rejilla premia justo los ajustes que hay que descartar.</p>

      <div class="note">
        <p><strong>AICc o BIC.</strong> El BIC penaliza cada parámetro con $\log n^{*}$ en vez de con $2$, así que
          con $n^{*} = 99$ ($\log 99 = 4.6$) es más de dos veces más severo y tiende a elegir modelos más pequeños.
          Ninguno es "el correcto": el AICc apunta a minimizar el error de pronóstico y el BIC a identificar el
          modelo verdadero si está entre los candidatos. Para pronosticar —que es a lo que va este curso— la
          recomendación habitual es <strong>AICc</strong>. Cuando los dos coinciden, como en $d = 0$, la elección es
          cómoda; cuando no, conviene decirlo en vez de esconderlo.</p>
      </div>

        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># AICc a mano: k = n coeficientes + 1 (sigma^2), n* = n - d
aicc &lt;- function(f, n_ef) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n_ef-k-1) }
bic2 &lt;- function(f, n_ef) { k &lt;- length(f$coef) + 1; f$aic - 2*k + log(n_ef)*k }

n &lt;- length(Nile)
rejilla &lt;- do.call(rbind, lapply(0:2, function(d)
  do.call(rbind, lapply(0:2, function(p) do.call(rbind, lapply(0:2, function(q) {
    f &lt;- tryCatch(arima(Nile, order = c(p, d, q), method = "ML"),
                  error = function(e) NULL)
    if (is.null(f)) return(NULL)
    data.frame(d = d, modelo = sprintf("ARIMA(%d,%d,%d)", p, d, q),
               n_ef = n - d,
               aicc = round(aicc(f, n - d), 2), bic = round(bic2(f, n - d), 2))
  }))))))

# El mejor DE CADA d, nunca un minimo global
do.call(rbind, lapply(split(rejilla, rejilla$d), function(g)
  data.frame(d = g$d[1], n_ef = g$n_ef[1],
             mejor_aicc = g$modelo[which.min(g$aicc)], aicc = min(g$aicc),
             mejor_bic  = g$modelo[which.min(g$bic)],  bic  = min(g$bic))))
#&gt;   d n_ef   mejor_aicc    aicc    mejor_bic     bic
#&gt; 0 0  100 ARIMA(1,0,1) 1282.50 ARIMA(1,0,1) 1292.50
#&gt; 1 1   99 ARIMA(1,1,1) 1267.51 ARIMA(0,1,1) 1274.28
#&gt; 2 2   98 ARIMA(1,2,2) 1264.60 ARIMA(0,2,2) 1273.50

# La diferencia entre los dos candidatos de d = 1
subset(rejilla, modelo %in% c("ARIMA(0,1,1)", "ARIMA(1,1,1)"))[, c("modelo","aicc","bic")]
#&gt;          modelo    aicc     bic
#&gt; 11 ARIMA(0,1,1) 1269.22 1274.28
#&gt; 14 ARIMA(1,1,1) 1267.51 1275.04
# AICc prefiere (1,1,1) por 1.71; BIC prefiere (0,1,1) por 0.76</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
import warnings; warnings.filterwarnings("ignore")

nilo = sm.datasets.nile.load_pandas().data["volume"].values

filas = []
for d in range(3):
    for p in range(3):
        for q in range(3):
            try:
                f = ARIMA(nilo, order=(p, d, q),
                          trend="c" if d == 0 else "n").fit()
            except Exception:
                continue
            # CUIDADO: f.nobs vale 100 para TODOS los d, pero la verosimilitud
            # descarta las d primeras observaciones (f.loglikelihood_burn = d,
            # inicializacion difusa) y f.nobs_effective SI vale n - d.
            # f.aicc y f.bic ya usan ese n efectivo; no hay que rehacerlos a mano.
            filas.append(dict(d=d, modelo=f"ARIMA({p},{d},{q})",
                              nobs=f.nobs, n_ef=f.nobs_effective,
                              aicc=round(f.aicc, 2), bic=round(f.bic, 2)))
tabla = pd.DataFrame(filas)
print(tabla.loc[tabla.groupby("d")["aicc"].idxmin(), ["d","modelo","nobs","n_ef","aicc"]]
      .to_string(index=False))
#&gt;  d       modelo  nobs  n_ef    aicc
#&gt;  0 ARIMA(1,0,1)   100   100 1282.50
#&gt;  1 ARIMA(1,1,1)   100    99 1267.47     &lt;- nobs no baja; n_ef si
#&gt;  2 ARIMA(1,2,2)   100    98 1264.67
# Los tres ganadores coinciden con R (1282.50 / 1267.51 / 1264.60), y el
# n efectivo es el mismo: los AICc de distinto d tampoco son comparables aqui.</code></pre>
