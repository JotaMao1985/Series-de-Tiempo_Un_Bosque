      <p>El Módulo 3 dejó $d = 1$ como decisión de trabajo para el Nilo: es el orden que pide KPSS, <span data-afirma="c4-m4-60">la prueba que
        usa <code>auto.arima</code> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Usage"><a href="#ref-m4-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Usage)</a></cite></span>, aunque la sospecha del escalón de 1899 sigue abierta y el Módulo 8 la retoma. Con ese $d$
        provisional, el resto es el Capítulo 3 sin cambios: se leen la ACF y la PACF de
        $w_t = \nabla y_t = y_t - y_{t-1}$ y se cruzan en la tabla de identificación. Lo único nuevo, y es
        importante, es <strong>sobre qué serie se leen</strong>. <span data-afirma="c4-m4-02">La ACF de la serie sin diferenciar del Nilo decae
        despacio y sin cortar ($0.498,\ 0.385,\ 0.328,\ 0.239,\dots$): es compatible con una serie no estacionaria <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.1"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.1)</a></cite>
        —o con el escalón de 1899—</span> <span data-afirma="c4-m4-03">y no informa sobre $p$ ni sobre $q$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. <span data-afirma="c4-m4-04">Leerla, junto con una PACF que corta en 1,
        como la firma de un AR(1) con $\phi \approx 0.5$ es confundir la no estacionariedad con dinámica: el error
        de principiante más caro del capítulo</span>.</p>

      <p>La lectura es razonablemente clara: la ACF corta en el rezago 1 —<span data-afirma="c4-m4-07">el único otro que sale de la banda de
        $\pm 0.197$ es el 8 ($0.231$), aislado y sin patrón; con 20 rezagos al $5\,\%$, uno fuera por azar es lo
        esperable <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§2.9"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §2.9)</a></cite></span>— <span data-afirma="c4-m4-06">y la PACF decae con signo negativo, como la de un
        MA(1) con $\theta &lt; 0$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 114"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 114)</a></cite></span>. <span data-afirma="c4-m4-12">La tabla propone, por tanto, un <strong>ARIMA($0,1,1$)</strong></span>. Ajustado por
        máxima verosimilitud:</p>

      <div class="formula">
        $$(1-B)\,y_t = (1 - 0.7329\,B)\,\varepsilon_t$$
        $$\hat\sigma^2 = 20\,599.87$$
      </div>

      <p>con $\hat\theta = -0.7329$ (e.e. $0.1143$, $t = -6.41$) y Ljung–Box(20) $p = 0.674$: pasa el
        diagnóstico sin problemas. <span data-afirma="c4-m4-13">Es el IMA(1,1) <cite class="cita" data-ref="cryer2008time" data-loc="p. 93"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 93)</a></cite> del Módulo 1, el equivalente del suavizamiento exponencial
        simple con $\alpha = 1 + \hat\theta = 0.267$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.10"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.10)</a></cite></span>: es el $\alpha$ implícito en el modelo; <code>ses()</code>
        lo estima por su cuenta y da un valor algo distinto.</p>

      <div class="note">
        <p><span data-afirma="c4-m4-14"><strong>Pero no se propone uno: se proponen varios.</strong> La tabla acota la búsqueda, no la resuelve <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>.
          <span data-afirma="c4-m4-15">Con $n = 99$ la banda es ancha ($\pm 0.197$) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span> y un rezago justo en el borde —como el 8 de la ACF— puede ser
          ruido o puede ser señal. <span data-afirma="c4-m4-16">La práctica sensata es llevar a la etapa de estimación el candidato de la tabla y
          sus vecinos inmediatos: $(0,1,1)$, $(1,1,1)$, $(0,1,2)$, $(1,1,0)$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. En el Módulo 6 se verá que el AICc
          prefiere el <strong>$(1,1,1)$</strong> por $1.71$ puntos, mientras que el BIC se queda con el $(0,1,1)$
          de la tabla. <span data-afirma="c4-m4-17">Los dos son defendibles; que no coincidan no es un fallo <cite class="cita" data-ref="cryer2008time" data-loc="p. 131"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 131)</a></cite></span>.</p>
      </div>

#&gt; [1] -0.4020 -0.0443  0.0274 -0.0879  0.0005  0.0465

# pacf()$acf devuelve un array de 3 dimensiones: as.numeric() lo aplana

#&gt; [1] -0.4020 -0.2456 -0.1187 -0.1733 -0.1554 -0.0737

#&gt;   theta      ee
#&gt; -0.7329  0.1143
# el IMA(1,1) es el suavizamiento exponencial simple, con alfa = 1 + theta

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, statsmodels.api as sm
from statsmodels.tsa.stattools import acf, pacf
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox

nilo = sm.datasets.nile.load_pandas().data["volume"].values
w = np.diff(nilo)
print(round(1.96 / np.sqrt(len(w)), 4))
#&gt; 0.197

# statsmodels divide por n y, como R, pone el rezago 0 en la primera posicion
print(np.round(acf(w, nlags=6)[1:], 4))
#&gt; [-0.402  -0.0443  0.0274 -0.0879  0.0005  0.0465]

# ojo: el metodo por defecto de pacf NO es Durbin-Levinson (es "ywadjusted");
# para reproducir R hay que pedir method="ldb" (Levinson-Durbin, sesgado)
print(np.round(pacf(w, nlags=6, method="ldb")[1:], 4))
#&gt; [-0.402  -0.2456 -0.1187 -0.1733 -0.1554 -0.0737]

ma1 = ARIMA(nilo, order=(0, 1, 1), trend="n").fit()
print(round(ma1.params[0], 4))
#&gt; -0.7334
#   R da -0.7329
print(round(1 + ma1.params[0], 3))
#&gt; 0.267
# el primer residual es y_1 = 1120 (inicializacion difusa), no un error: se descarta
print(round(float(acorr_ljungbox(ma1.resid[1:], lags=[20], model_df=1)["lb_pvalue"].iloc[0]), 4))
#&gt; 0.6984
#   R da 0.6737: misma conclusion, no rechaza</code></pre>

      <p>Antes de estimar esos candidatos queda una decisión que la ACF no resuelve: si el modelo lleva
        constante. Con $d = 1$ esa constante ya no es una media sino una pendiente, y el Módulo 5 explica por qué
        conviene decidirlo a propósito y no dejarlo en manos del valor por defecto del programa.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>global_economy</code>, del paquete <code>tsibbledata</code>, reúne indicadores anuales del Banco Mundial por país, de 1960 a 2017. Toma las importaciones de bienes y servicios de Colombia, en porcentaje del PIB (58 datos). Las tres pruebas piden $d = 1$, así que la identificación se hace sobre $\nabla y_t$. Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>La ACF y la PACF de $\nabla y_t$ hasta el rezago 10, con su banda: ¿corta alguna?, ¿decae alguna?</li>
            <li>Los candidatos que llevarías a la estimación, y por qué más de uno.</li>
            <li>El AICc, el BIC y Ljung–Box(20) de cada candidato. ¿Los separan?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m4-pista">

          <div class="ejercicio-panel pista" id="c4m4-pista" hidden>
            <p style="margin:0;">Con 57 diferencias la banda es ancha. Antes de decidir si una función «decae», cuenta cuántas de sus barras salen de verdad de la banda, y piensa qué enseñarían un AR(1) y un MA(1) cuando su único coeficiente es pequeño.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m4-sol" hidden>
            <p><strong>Respuesta: la tabla no elige. La ACF y la PACF de $\nabla y_t$ tienen una sola barra clara, la del rezago 1, y eso lo producen igual un MA(1) y un AR(1). Se llevan los dos, y el AICc los deja a $0.03$ puntos.</strong></p>
            <pre><code class="language-r">library(forecast); library(tsibbledata)    # global_economy: indicadores anuales por pais
col &lt;- subset(as.data.frame(global_economy), Country == "Colombia")
y &lt;- ts(col$Imports, start = 1960)         # importaciones, en % del PIB
c(kpss = ndiffs(y, test = "kpss"), adf = ndiffs(y, test = "adf"), pp = ndiffs(y, test = "pp"))
#&gt; kpss  adf   pp
#&gt;    1    1    1

# (a) ACF y PACF de la serie diferenciada, con su banda
w &lt;- diff(y)
round(1.96 / sqrt(length(w)), 3)
#&gt; [1] 0.26
round(acf(w, lag.max = 10, plot = FALSE)$acf[-1], 3)
#&gt;  [1] -0.288  0.038  0.027 -0.123  0.121 -0.216 -0.153  0.177 -0.179  0.158
round(pacf(w, lag.max = 10, plot = FALSE)$acf[, 1, 1], 3)
#&gt;  [1] -0.288 -0.049  0.027 -0.116  0.058 -0.184 -0.297  0.036 -0.125  0.031

# (b) y (c) los candidatos, con el mismo d
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
for (o in list(c(0, 1, 1), c(1, 1, 0), c(1, 1, 1), c(0, 1, 0))) {
  f &lt;- arima(y, order = o, method = "ML")
  cat(sprintf("ARIMA(%d,1,%d)  AICc=%7.3f  BIC=%7.3f  LB(20) p=%.3f  coef: %s  ee: %s\n",
      o[1], o[3], aicc(f, length(y) - 1), BIC(f),
      Box.test(residuals(f), lag = 20, type = "Ljung-Box", fitdf = o[1] + o[3])$p.value,
      paste(sprintf("%.3f", coef(f)), collapse = " "),
      paste(sprintf("%.3f", sqrt(diag(f$var.coef))), collapse = " ")))
}
#&gt; ARIMA(0,1,1)  AICc=222.505  BIC=226.369  LB(20) p=0.667  coef: -0.291  ee: 0.127
#&gt; ARIMA(1,1,0)  AICc=222.530  BIC=226.394  LB(20) p=0.666  coef: -0.285  ee: 0.127
#&gt; ARIMA(1,1,1)  AICc=224.643  BIC=230.319  LB(20) p=0.618  coef: -0.148 -0.151  ee: 0.450 0.454
#&gt; ARIMA(0,1,0)  AICc=225.191  BIC=227.161  LB(20) p=0.229  coef:   ee:</code></pre>
            <p><strong>(a)</strong> La banda es $\pm 0.260$. En la ACF solo sale el rezago 1 ($-0.288$), y por poco; en la PACF, el rezago 1 ($-0.288$) y, aislado, el 7 ($-0.297$). Ninguna de las dos decae a la vista: las dos «cortan en 1».</p>
            <p><strong>(b)</strong> Con una sola barra de $-0.29$, la tabla no distingue. Un MA(1) con $\theta = -0.29$ tiene una PACF que decae, pero su segundo valor es $-0.08$, dentro de la banda; un AR(1) con $\phi = -0.29$ tiene una ACF que decae, y su segundo valor es $0.08$, también dentro. Los dos son compatibles con lo que se ve. Se proponen el ARIMA($0,1,1$) y el ARIMA($1,1,0$), su vecino ARIMA($1,1,1$) y, como la barra apenas asoma, la caminata aleatoria, ARIMA($0,1,0$).</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El ARIMA($0,1,1$) ($\hat\theta = -0.291$) y el ARIMA($1,1,0$) ($\hat\phi = -0.285$) tienen AICc $222.505$ y $222.530$: $0.03$ puntos. El ARIMA($1,1,1$) queda a $2.14$, y sus dos coeficientes tienen errores estándar de $0.45$, mayores que ellos: sobra un parámetro. La caminata aleatoria queda a $2.69$ por AICc y, por BIC, es la tercera, a $0.79$ puntos. Los cuatro pasan Ljung–Box(20). Con 58 datos, lo que se puede afirmar es que hay dos modelos de un parámetro que los datos no separan.</p>
          </div>
        </div>
      </div>

  <template id="module-5">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 5</span>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.5 La constante: media y
          deriva <span class="text-gray-400 font-normal text-2xl">/ Constants and drift</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Saber qué significa la $c$ de la ecuación según el
              valor de $d$, y por qué el software cambia de nombre y de comportamiento con ella.</p>
          </div>
        </div>
      </div>

      <p>La constante $c$ de la ecuación del Módulo 1, la decisión que el Módulo 4 dejó pendiente, es un parámetro que se presta a confusión en la familia ARIMA, porque <span data-afirma="c4-m5-01"><strong>significa cosas distintas según
        $d$</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span> y porque cada programa la llama de una manera. Merece la pena aclararlo de una vez.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Qué es $c$ en cada caso</h4>
        <p data-afirma="c4-m5-02">Se parte de $\phi(B)(1-B)^d y_t = c + \theta(B)\varepsilon_t$ y se toman esperanzas. Llamando
          $w_t = (1-B)^d y_t$ y $\mu_w = \operatorname{E}[w_t]$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>:</p>
        $$\mu_w = \frac{c}{1 - \phi_1 - \cdots - \phi_p} = \frac{c}{\phi(1)}$$
        <ul>
          <li><strong>$d = 0$:</strong> <span data-afirma="c4-m5-03">$w_t = y_t$, así que $\mu_w$ es <strong>la media de la serie</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. <span data-afirma="c4-m5-04">R la
            llama <code>intercept</code> aunque sea una media <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m5-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span>, lo que despista.</li>
          <li><strong>$d = 1$:</strong> <span data-afirma="c4-m5-05">$\mu_w$ es la media de las <em>diferencias</em>, es decir, el
            <strong>incremento medio por período</strong>. Eso es una tendencia lineal en $y_t$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>, <span data-afirma="c4-m5-06">y es lo que
            <code>forecast</code> llama <strong>deriva</strong> (<em>drift</em>) <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Arguments"><a href="#ref-m5-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Arguments)</a></cite></span>.</li>
          <li><strong>$d = 2$:</strong> <span data-afirma="c4-m5-07">$\mu_w$ sería la aceleración media, y produce una tendencia
            <strong>cuadrática</strong>. Prácticamente nunca se quiere <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>.</li>
        </ul>
        <p style="margin-bottom:0;"><span data-afirma="c4-m5-08">Regla mnemotécnica: <strong>cada diferencia sube en un grado el polinomio de la
          tendencia</strong> que la constante genera: a largo plazo, $\hat y_{T+h}$ (con $T$ el último dato) crece como
          $\mu_w\, h^d / d!$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>. <span data-afirma="c4-m5-09">Sin constante: $d=0$ tiende a cero, $d=1$ se aplana (no necesariamente en el último
          dato: el Módulo 9 lo mide), $d=2$ sigue una recta. Con
          constante: $d=0$ vuelve a la media, $d=1$ recta, $d=2$ parábola <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>. El simulador «La forma del pronóstico
          según $d$» del Módulo 9 dibuja cuatro de estos seis casos sobre el Nilo.</p>
      </div>

                fitted as the order of difference is 2 or more."</em> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Arguments"><a href="#ref-m5-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Arguments)</a></cite></td></tr>

        <p style="margin-bottom:0;" data-afirma="c4-m5-15">Consecuencia práctica: si un ajuste de <code>arima()</code> y uno de

      <h3>¿Lleva deriva el Nilo?</h3>

      <p data-afirma="c4-m5-16">Con $d = 1$ la deriva se escribe como una pendiente explícita, que es la forma en que la estima
        <code>forecast::Arima</code> <cite class="cita" data-ref="hyndman2026forecast" data-loc="§Details"><a href="#ref-m5-hyndman2026forecast" title="Hyndman, R. J., Athanasopoulos, G., Bergmeir, C., Caceres, G., Chhay, L., Kuroptev, K., Mücke, M., O’Hara-Wild, M., Petropoulos, F., Razbash, S., Wang, E., y Yasmeen, F. (2026). forecast: Forecasting Functions for Time Series and Linear Models (Versión 9.0.2) [Software]. Comprehensive R Archive Network (CRAN). https://doi.org/10.32614/CRAN.package.forecast">(Hyndman et al., 2026, §Details)</a></cite>. Para el ARIMA($1,1,1$):</p>

      <div class="formula">
        $$y_t = \delta\,t + \eta_t$$
        $$(1-\phi_1 B)(1-B)\,\eta_t = (1+\theta_1 B)\,\varepsilon_t$$
        $$\operatorname{E}[\nabla y_t] = \delta = \mu_w = \frac{c}{1-\phi_1}$$
      </div>

      <p>Se ajusta ese modelo y se mira el estadístico $t$ de $\hat\delta$, como con cualquier otro
        coeficiente:</p>

      <div class="formula">
        $$\begin{gathered} \hat{\delta} = -2.883 \\ \text{e.e.} = 2.017, \qquad t = -1.43 \end{gathered}$$
      </div>

      <p><span data-afirma="c4-m5-17">No es significativa (en la ecuación del Módulo 1 equivaldría a
        $c = \hat\delta\,(1-\hat\phi_1) = -2.883 \times (1 - 0.271) = -2.10$, con el $\hat\phi_1 = 0.271$ del
        propio modelo con deriva, que no es el $0.254$ del modelo sin ella). Y el AICc lo confirma: $1268.06$ con deriva frente a $1267.51$ sin ella —
        añadirla empeora.</span> <span data-afirma="c4-m5-18">Tiene sentido físico: no hay ninguna razón para creer que el caudal del Nilo disminuya
        <em>indefinidamente</em> a razón de $2.9 \times 10^8\ \text{m}^3$ por año.</span> <span data-afirma="c4-m5-19">Y buena parte de esa caída no fue
        gradual. La media de las diferencias es $(y_{1970} - y_{1871})/99 = (740 - 1120)/99 = -3.84$ —la suma de
        las diferencias es telescópica y solo sobreviven el primer año y el último—, y el descenso de $247.8$ de
        1899 aporta por sí solo $-2.50$ de ella.</span> Con $d = 1$, un cambio de nivel que ocurre una vez solo puede
        entrar como un choque o repartido en pendiente; el Módulo 8 lo ajusta como escalón. <span data-afirma="c4-m5-20">Una deriva estimada es una tendencia que se
        extrapola sin límite <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>, y eso es una afirmación fuerte sobre el futuro que conviene no hacer a la ligera.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Media y deriva">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">library(forecast)

# Con d = 0 la constante es la MEDIA, y R la llama "intercept"
f0 &lt;- arima(Nile, order = c(1, 0, 1), method = "ML")
round(coef(f0), 4)
#&gt;      ar1      ma1 intercept
#&gt;   0.8610  -0.5177  920.7037     &lt;- es la media, no una ordenada al origen

# Con d = 1, stats::arima IGNORA include.mean sin avisar:
f1a &lt;- arima(Nile, order = c(1, 1, 1), include.mean = TRUE, method = "ML")
names(coef(f1a))
#&gt; [1] "ar1" "ma1"            no hay constante por ningun lado

# Para pedirla hay que usar forecast::Arima con include.drift
f1b &lt;- Arima(Nile, order = c(1, 1, 1), include.drift = TRUE)
round(coef(f1b), 4)               # el ar1 cambia al anadir la deriva
#&gt;     ar1     ma1   drift
#&gt;  0.2707 -0.9054 -2.8827
round(c(coef(f1b)[["drift"]], sqrt(diag(f1b$var.coef))[["drift"]]), 4)
#&gt; [1] -2.8827  2.0167
round(coef(f1b)[["drift"]] / sqrt(diag(f1b$var.coef))[["drift"]], 3)
#&gt; [1] -1.429                   no significativa

round(c(con_deriva = f1b$aicc, sin_deriva = Arima(Nile, order = c(1,1,1))$aicc), 3)
#&gt; con_deriva sin_deriva
#&gt;   1268.063   1267.507     anadirla empeora el AICc

# Con d = 2 forecast se NIEGA a ajustarla (y lo dice)
f2 &lt;- Arima(Nile, order = c(1, 2, 1), include.drift = TRUE)
#&gt; Warning message:
#&gt; In Arima(Nile, order = c(1, 2, 1), include.drift = TRUE) :
#&gt;   No drift term fitted as the order of difference is 2 or more.
"drift" %in% names(coef(f2))
#&gt; [1] FALSE</code></pre>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA

nilo = sm.datasets.nile.load_pandas().data["volume"].values

# d = 0: trend="c" da la media del proceso, igual que el "intercept" de R
f0 = ARIMA(nilo, order=(1, 0, 1), trend="c").fit()
print(f0.param_names, np.round(f0.params, 4))
#&gt; ['const', 'ar.L1', 'ma.L1', 'sigma2'] [ 9.19350500e+02  8.61000000e-01
#&gt;                                        -5.17600000e-01  1.98070486e+04]
#   919.35 es practicamente la media muestral de la serie; R devuelve
#   920.7037, el valor que maximiza la verosimilitud junto al resto de
#   parametros. statsmodels no se aleja del valor inicial porque la
#   verosimilitud es muy plana en la media (e.e. = 46.67 en R).
#   0.15 % de diferencia: no cambia ninguna conclusion.

# d = 1 con deriva: trend="t" (un termino lineal en t)
f1 = ARIMA(nilo, order=(1, 1, 1), trend="t").fit()
i = f1.param_names.index("x1")
print(round(f1.params[i], 4), round(f1.bse[i], 4), round(f1.params[i] / f1.bse[i], 3))
#&gt; -2.8518 2.124 -1.343
#   R da -2.8827, 2.0167 y t = -1.429: distinto numero, misma conclusion,
#   no es significativa

# d = 2: statsmodels TAMPOCO la ajusta, y ademas lo explica mejor que R
try:
    ARIMA(nilo, order=(1, 2, 1), trend="t").fit()
except ValueError as e:
    print(str(e)[:78])
#&gt; In models with integration (`d &gt; 0`) or seasonal integration (`D &gt; 0`), tre
#   ...un termino de orden MENOR que d lo elimina la propia diferenciacion.
#   Lo unico admisible con d = 2 es un termino cuadratico:
f2 = ARIMA(nilo, order=(1, 2, 1), trend=[0, 0, 1]).fit()
print(f2.param_names)
#&gt; ['x1', 'ar.L1', 'ma.L1', 'sigma2']</code></pre>
        </div>
      </div>

      <p>Con el orden de diferenciación, los candidatos y la constante decididos, queda estimarlos y compararlos.
        La estimación no trae novedades; la comparación sí, porque es ahí donde el ARIMA esconde su trampa
        principal. Es el tema del Módulo 6.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>

            <li>La media de las diferencias, calculada de dos maneras: con <code>mean(diff(y))</code> y solo con el primer dato y el último.</li>
            <li>La deriva estimada, su error estándar y su estadístico $t$, y el AICc del modelo con deriva y sin ella. ¿Lleva deriva?</li>
            <li>El pronóstico a 1, 5 y 10 años de los dos modelos. ¿Qué afirma la deriva sobre el futuro, en la escala original?</li>

              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>

            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m5-sol">

          <div class="ejercicio-panel pista" id="c4m5-pista" hidden>
            <p style="margin:0;">En <code>forecast::Arima</code> la deriva se pide con <code>include.drift = TRUE</code>. Para (c), recuerda que la serie está en logaritmos: una pendiente constante en el logaritmo es un factor constante en la serie original.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m5-sol" hidden>
            <p><strong>Respuesta: sí lleva deriva: $\hat\delta = 0.182$ con $t = 4.47$, y el AICc baja de $-11.13$ a $-20.89$. Es el caso contrario al del Nilo.</strong></p>
            <pre><code class="language-r">library(forecast)
y &lt;- log(airmiles)                   # 24 datos anuales, 1937-1960
n &lt;- length(y)

# (a) la media de las diferencias: solo cuentan el primer dato y el ultimo
round(c(media_de_las_diferencias = mean(diff(y)), telescopica = (y[n] - y[1]) / (n - 1)), 4)
#&gt; media_de_las_diferencias              telescopica
#&gt;                   0.1872                   0.1872

# (b) el mismo ARIMA(0,1,1), sin deriva y con ella
sin &lt;- Arima(y, order = c(0, 1, 1))
con &lt;- Arima(y, order = c(0, 1, 1), include.drift = TRUE)
d  &lt;- coef(con)[["drift"]]; ee &lt;- sqrt(diag(con$var.coef))[["drift"]]
round(c(deriva = d, ee = ee, t = d / ee), 4)
#&gt; deriva     ee      t
#&gt; 0.1818 0.0407 4.4688
round(c(aicc_sin = sin$aicc, aicc_con = con$aicc), 2)
#&gt; aicc_sin aicc_con
#&gt;   -11.13   -20.89

# (c) el pronostico a 1, 5 y 10 anios (en logaritmos) y lo que supone la deriva
round(rbind(sin = forecast(sin, h = 10)$mean[c(1, 5, 10)],
            con = forecast(con, h = 10)$mean[c(1, 5, 10)]), 3)
#&gt;       [,1]   [,2]   [,3]
#&gt; sin 10.227 10.227 10.227
#&gt; con 10.422 11.149 12.059
round(c(ultimo_dato = y[n], factor_anual = exp(d), factor_en_10_anios = exp(10 * d)), 3)
#&gt;        ultimo_dato       factor_anual factor_en_10_anios
#&gt;             10.326              1.199              6.162</code></pre>
            <p><strong>(a)</strong> Las dos cuentas dan $0.1872$: la suma de las diferencias es telescópica y queda $(y_{1960} - y_{1937})/23$.</p>
            <p><strong>(b)</strong> $\hat\delta = 0.1818$ (e.e. $0.0407$), $t = 4.47$: claramente distinta de cero. El AICc pasa de $-11.13$ sin deriva a $-20.89$ con ella, casi diez puntos menos, y los dos modelos tienen el mismo $d$, así que la comparación vale. La deriva estimada ($0.182$) no es exactamente la media de las diferencias ($0.187$), porque se estima a la vez que $\theta$ y no como un promedio simple; se parecen, como cabe esperar.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> Sin deriva el pronóstico es plano, $10.227$ a cualquier horizonte (no en el último dato, $10.326$). Con deriva es una recta: $10.422$, $11.149$ y $12.059$. En la escala original, una pendiente de $0.182$ por año en el logaritmo equivale a multiplicar por $e^{0.182} = 1.20$ cada año, y por $6.2$ en diez. Dentro de la muestra esa tendencia está bien medida; lo que el modelo añade es que seguirá igual sin límite, y esa es la afirmación sobre el futuro contra la que previene el módulo.</p>
          </div>
        </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">4.6 Estimar y comparar:

        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Recorrer los 27 modelos de la rejilla y entender por

      <p><span data-afirma="c4-m6-01">La estimación es la del Capítulo 3: máxima verosimilitud sobre la serie diferenciada <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Value"><a href="#ref-m6-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Value)</a></cite></span>. Lo que cambia es la
        comparación, y cambia de una forma que es fácil pasar por alto.</p>

      <div class="formula" data-afirma="c4-m6-02">
        $$\mathrm{AIC} = -2\log L + 2k$$
        $$\mathrm{AICc} = \mathrm{AIC} + \frac{2k(k+1)}{n^{*} - k - 1}$$
        $$\mathrm{BIC} = -2\log L + k\log n^{*}$$
        <p style="margin:0.6rem 0 0 0; font-size:0.9rem;">con $n$ el número de observaciones —lo que los
          Capítulos 2 y 3 llamaban $T$; aquí $T$ queda para el origen del pronóstico, el último dato, y vale
          $T = n$—, $k = p + q + 1$ (los coeficientes ARMA más $\hat\sigma^2$; más uno si hay constante o deriva) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite> y
          $n^{*} = n - d$ el <strong>número efectivo</strong> de observaciones <cite class="cita" data-ref="cryer2008time" data-loc="p. 131"><a href="#ref-m6-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 131)</a></cite>.</p>
      </div>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>El AIC no cruza la frontera de $d$</h4>
        <p>Ese $n^{*} = n - d$ es la clave. <span data-afirma="c4-m6-05">La verosimilitud de un ARIMA con $d = 1$ se calcula sobre las $99$
          diferencias del Nilo; la de uno con $d = 2$, sobre $98$ segundas diferencias <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Value"><a href="#ref-m6-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Value)</a></cite></span>. <span data-afirma="c4-m6-06"><strong>Son datos
          distintos</strong>, y una verosimilitud solo es comparable con otra calculada sobre los mismos datos <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite>. Un
          AICc menor con más diferencias no significa un modelo mejor: es la verosimilitud de otros datos, con una
          observación menos.</span></p>
        <p style="margin-bottom:0;">Por eso las tablas de este capítulo <strong>agrupan por $d$</strong>; la tabla
          ordenable de abajo mezcla los 27 modelos a propósito, para que el error quede a la vista. <span data-afirma="c4-m6-07">Cuando de verdad
          haya que decidir entre distintos $d$, una comparación válida es la hecha fuera de muestra (Módulo 8) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.9"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.9)</a></cite>, apoyada en
          las pruebas de raíz unitaria <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 10"><a href="#ref-m6-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 10)</a></cite></span> y en el criterio sustantivo de qué proceso genera los datos.</p>
      </div>

      <!--RANKING:rejilla-nilo|Los 27 modelos del Nilo, con su n efectivo a la vista|-->

      <div class="note">
        <p style="margin-bottom:0;"><strong>Lo que enseña el explorador.</strong> <span data-afirma="c4-m6-08">Con $d = 1$ cuatro modelos más
          quedan a menos de 2 puntos del mejor (umbral que este capítulo toma por convención; el Módulo 7 contará siete, porque incluye al propio ganador y dos variantes con deriva), y con diferencias así el AICc apenas los distingue</span>. Ljung–Box(20) rechaza en 8 de los 27 modelos,
          pero ninguno de los que quedan cerca del mejor de su $d$ está entre ellos, así que el correlograma filtra

      <h3>Los mejores de cada $d$</h3>

      <div class="diagram">
        <table style="position:relative;">
          <thead>
            <tr><th>$d$</th><th>$n^{*}$</th><th>Mejor por AICc</th><th>Mejor por BIC</th><th>Comentario</th></tr>

            <tr><td>2</td><td>98</td><td>ARIMA($1,2,2$) — $1264.60$</td><td>ARIMA($0,2,2$) — $1273.50$</td>

      <p>Si alguien mirase solo la columna de AICc y tomara el número más pequeño de toda la tabla, elegiría el
        ARIMA($1,2,2$) con $1264.60$. <span data-afirma="c4-m6-10">Sería un error por partida doble: ese valor se calcula sobre $98$
        observaciones y no sobre $99$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>, <span data-afirma="c4-m6-11">y además el propio ARIMA($1,2,2$) tiene una raíz MA en $1.03$, casi sobre
        el círculo unitario, síntoma de haber diferenciado de más <cite class="cita" data-ref="cryer2008time" data-loc="pp. 126–127"><a href="#ref-m6-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, pp. 126–127)</a></cite></span>. <span data-afirma="c4-m6-60">No es un caso aislado: como se verá en el
        Módulo 8, <strong>cuatro de los nueve modelos con $d = 2$ tienen una raíz MA sobre el círculo
        unitario</strong>.</span> La rejilla premia justo los ajustes que hay que descartar.</p>

      <div class="note">
        <p><strong>AICc o BIC.</strong> <span data-afirma="c4-m6-12">El BIC penaliza cada parámetro con $\log n^{*}$ en vez de con $2$, así que
          con $n^{*} = 99$ ($\log 99 = 4.6$) es más de dos veces más severo y tiende a elegir modelos más pequeños <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§7.5"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §7.5)</a></cite></span>.
          <span data-afirma="c4-m6-13">Ninguno es "el correcto": el AICc apunta a minimizar el error de pronóstico y el BIC a identificar el
          modelo verdadero si está entre los candidatos <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§7.5"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §7.5)</a></cite></span>. <span data-afirma="c4-m6-14">Para pronosticar —que es a lo que va este curso—, <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6" data-modo="narrativa"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">Hyndman y Athanasopoulos (2021, §9.6)</a></cite> prefieren el <strong>AICc</strong></span>. Cuando los dos coinciden, como en $d = 0$, la elección es
          cómoda; cuando no, conviene decirlo en vez de esconderlo.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="La rejilla de modelos">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># AICc a mano: k = n coeficientes + 1 (sigma^2), n* = n - d
aicc &lt;- function(f, n_ef) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n_ef-k-1) }
bic2 &lt;- function(f, n_ef) { k &lt;- length(f$coef) + 1; f$aic - 2*k + log(n_ef)*k }

n &lt;- length(Nile)
rejilla &lt;- do.call(rbind, lapply(0:2, function(d)
  do.call(rbind, lapply(0:2, function(p) do.call(rbind, lapply(0:2, function(q) {
    f &lt;- tryCatch(arima(Nile, order = c(p, d, q), method = "ML"),
                  error = function(e) NULL)
    if (is.null(f)) return(NULL)
    data.frame(d = d, modelo = sprintf("ARIMA(%d,%d,%d)", p, d, q),
               n_ef = n - d,
               aicc = round(aicc(f, n - d), 2), bic = round(bic2(f, n - d), 2))
  }))))))

# El mejor DE CADA d, nunca un minimo global
do.call(rbind, lapply(split(rejilla, rejilla$d), function(g)
  data.frame(d = g$d[1], n_ef = g$n_ef[1],
             mejor_aicc = g$modelo[which.min(g$aicc)], aicc = min(g$aicc),
             mejor_bic  = g$modelo[which.min(g$bic)],  bic  = min(g$bic))))
#&gt;   d n_ef   mejor_aicc    aicc    mejor_bic     bic
#&gt; 0 0  100 ARIMA(1,0,1) 1282.50 ARIMA(1,0,1) 1292.50
#&gt; 1 1   99 ARIMA(1,1,1) 1267.51 ARIMA(0,1,1) 1274.28
#&gt; 2 2   98 ARIMA(1,2,2) 1264.60 ARIMA(0,2,2) 1273.50

# La diferencia entre los dos candidatos de d = 1
subset(rejilla, modelo %in% c("ARIMA(0,1,1)", "ARIMA(1,1,1)"))[, c("modelo","aicc","bic")]
#&gt;          modelo    aicc     bic
#&gt; 11 ARIMA(0,1,1) 1269.22 1274.28
#&gt; 14 ARIMA(1,1,1) 1267.51 1275.04
# AICc prefiere (1,1,1) y BIC prefiere (0,1,1), por:
with(subset(rejilla, modelo %in% c("ARIMA(0,1,1)", "ARIMA(1,1,1)")),
     round(c(aicc = -diff(aicc), bic = diff(bic)), 2))
#&gt; aicc  bic 
#&gt; 1.71 0.76 </code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np, pandas as pd, statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
import warnings; warnings.filterwarnings("ignore")

nilo = sm.datasets.nile.load_pandas().data["volume"].values

filas = []
for d in range(3):
    for p in range(3):
        for q in range(3):
            try:
                f = ARIMA(nilo, order=(p, d, q),
                          trend="c" if d == 0 else "n").fit()
            except Exception:
                continue
            # CUIDADO: f.nobs vale 100 para TODOS los d, pero la verosimilitud
            # descarta las d primeras observaciones (f.loglikelihood_burn = d,
            # inicializacion difusa) y f.nobs_effective SI vale n - d.
            # f.aicc y f.bic ya usan ese n efectivo; no hay que rehacerlos a mano.
            filas.append(dict(d=d, modelo=f"ARIMA({p},{d},{q})",
                              nobs=f.nobs, n_ef=f.nobs_effective,
                              aicc=round(f.aicc, 2), bic=round(f.bic, 2)))
tabla = pd.DataFrame(filas)
print(tabla.loc[tabla.groupby("d")["aicc"].idxmin(), ["d","modelo","nobs","n_ef","aicc"]]
      .to_string(index=False))
#&gt;  d       modelo  nobs  n_ef    aicc
#&gt;  0 ARIMA(1,0,1)   100   100 1282.50
#&gt;  1 ARIMA(1,1,1)   100    99 1267.47     &lt;- nobs no baja; n_ef si
#&gt;  2 ARIMA(1,2,2)   100    98 1264.67
# Los tres ganadores coinciden con R (1282.50 / 1267.51 / 1264.60), y el
# n efectivo es el mismo: los AICc de distinto d tampoco son comparables aqui.</code></pre>
        </div>
      </div>

      <p>Recorrer 27 modelos a mano es viable con tres órdenes y una sola serie, pero no escala. La función
        <code>auto.arima</code> automatiza esta búsqueda con reglas explícitas; el Módulo 7 muestra cuáles son y
        dónde se equivoca.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>gafa_stock</code>, del paquete <code>tsibbledata</code>, trae los precios diarios de cuatro acciones entre 2014 y 2018. Toma el precio de cierre de Google (<code>Symbol == "GOOG"</code>) en 2018: 251 días de mercado, en dólares. Las tres pruebas piden $d = 1$. Ajusta la rejilla con $p, q \in \{0,1,2\}$ para $d = 1$ y para $d = 2$, por máxima verosimilitud, y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>El mejor modelo por AICc de cada $d$.</li>
            <li>El mínimo de los 18: ¿en qué $d$ cae? ¿Es razón para elegir ese $d$?</li>
            <li>El coeficiente y la raíz MA del mejor modelo con $d = 2$, y su $\hat\sigma^2$ frente a $\operatorname{Var}(\nabla y)$. ¿Qué modelo es en realidad?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m6-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c4m6-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c4m6-pista" hidden>
            <p style="margin:0;">Dos preguntas antes de elegir: ¿sobre qué datos se calcula cada AICc?, y ¿qué raíces tiene el modelo que gana?</p>
          </div>
          <div class="ejercicio-panel solucion" id="c4m6-sol" hidden>
            <p><strong>Respuesta: el mínimo de la rejilla está en $d = 2$, y no vale: se calcula sobre otros datos, y el modelo que lo alcanza es una caminata aleatoria con deriva escrita con una diferencia de más.</strong></p>
            <pre><code class="language-r">library(tsibbledata)                 # gafa_stock: precios diarios de cuatro acciones
g &lt;- subset(as.data.frame(gafa_stock), Symbol == "GOOG" &amp; format(Date, "%Y") == "2018")
y &lt;- ts(g$Close)                     # cierre diario de Google en 2018, en dolares
n &lt;- length(y); n
#&gt; [1] 251

# (a) la rejilla de AICc, con d = 1 y con d = 2
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
rejilla &lt;- function(d) {
  m &lt;- outer(0:2, 0:2, Vectorize(function(p, q) aicc(arima(y, order = c(p, d, q), method = "ML"), n - d)))
  dimnames(m) &lt;- list(paste0("p=", 0:2), paste0("q=", 0:2)); m
}
r1 &lt;- rejilla(1); r2 &lt;- rejilla(2)
round(r1, 2)
#&gt;         q=0     q=1     q=2
#&gt; p=0 2190.69 2192.69 2191.81
#&gt; p=1 2192.69 2191.65 2192.00
#&gt; p=2 2192.11 2191.81 2193.83
round(r2, 2)
#&gt;         q=0     q=1     q=2
#&gt; p=0 2352.42 2190.48 2192.46
#&gt; p=1 2300.39 2192.47 2191.40
#&gt; p=2 2246.80 2192.11 2191.76

# (b) el mejor de cada d
round(c(mejor_d1 = min(r1), mejor_d2 = min(r2), diferencia = min(r1) - min(r2)), 3)
#&gt;   mejor_d1   mejor_d2 diferencia
#&gt;   2190.690   2190.479      0.212

# (c) el mejor de d = 2, por dentro
f021 &lt;- arima(y, order = c(0, 2, 1), method = "ML")
round(c(theta = coef(f021)[["ma1"]], raiz_MA = Mod(polyroot(c(1, coef(f021)[["ma1"]])))), 4)
#&gt;   theta raiz_MA
#&gt;      -1       1
round(c(sigma2_del_021 = f021$sigma2, varianza_de_la_diferencia = var(diff(y))), 2)
#&gt;            sigma2_del_021 varianza_de_la_diferencia
#&gt;                    372.71                    372.71
round(c(sigma2_del_010 = arima(y, order = c(0, 1, 0), method = "ML")$sigma2), 2)   # sin constante
#&gt; sigma2_del_010
#&gt;         371.23</code></pre>
            <p><strong>(a)</strong> Con $d = 1$ gana el ARIMA($0,1,0$), con AICc $2190.69$; con $d = 2$, el ARIMA($0,2,1$), con $2190.48$.</p>
            <p><strong>(b)</strong> El mínimo de los 18 es el ARIMA($0,2,1$), por $0.21$ puntos. No es razón para elegir $d = 2$: el primero se calcula sobre $250$ diferencias y el segundo sobre $249$ segundas diferencias, y un AICc solo se compara con otro calculado sobre los mismos datos. Las pruebas, que sí hablan de $d$, piden una diferencia.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> $\hat\theta = -1.000$, y la raíz MA tiene módulo $1.000$: el factor $(1 - B)$ del MA cancela una de las dos diferencias. Su $\hat\sigma^2 = 372.71$ coincide con la varianza de $\nabla y$ alrededor de su media: el ARIMA($0,2,1$) es una caminata aleatoria con deriva —la constante la pone la diferencia que el MA deshace— y no la caminata sin ella, cuya $\hat\sigma^2$ es $371.23$. La rejilla ha premiado, por dos décimas, un modelo degenerado. Y dentro de $d = 1$ el resultado también dice algo: gana la caminata aleatoria, y los otros ocho modelos quedan entre $1.0$ y $3.1$ puntos por encima de ella. Es el resultado «no hay señal» que el Módulo 10 encontrará en la TRM.</p>
          </div>
        </div>
