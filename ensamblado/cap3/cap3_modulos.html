      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>El hallazgo</h4>
        <p>Sobre la raíz cuadrada, el <strong>AR(2) es a la vez el mejor por AICc y el mejor por BIC</strong>
          ($324.00$ y $334.00$, ambos mínimos de la rejilla) y sus residuales pasan Ljung–Box ($p = 0.1644$). El
          término MA que el AICc pedía sobre la serie cruda <strong>ya no aporta nada</strong>.</p>
        <p style="margin-bottom:0;">Es decir: aquel $\hat\theta_1 = 0.3732$ no estaba capturando dinámica que faltara,
          estaba <strong>parcheando un problema de escala</strong>. Añadir parámetros puede disimular un
          preprocesamiento incorrecto, y el criterio de información no distingue una cosa de la otra.</p>
      </div>

      <p>El modelo final es, entonces:</p>

      <div class="formula">
        $$\begin{aligned}
          &\sqrt{y_t} - 6.33 \\
          &\quad = 1.4027\,(\sqrt{y_{t-1}} - 6.33) \\
          &\qquad - 0.6853\,(\sqrt{y_{t-2}} - 6.33) + \varepsilon_t
        \end{aligned}$$
        <p style="margin-bottom:0;">con errores estándar $0.0727$ y $0.0724$; raíces complejas de módulo $1.208$.</p>
      </div>

      <p>Y la recompensa está en el pseudo-periodo. Sobre la serie cruda daba $10.74$ años; sobre la raíz cuadrada da
        <strong>$11.22$ años</strong>. <span data-afirma="c3-m9-06">Ya en 1927 se daba como estimación habitual del periodo de las manchas solares algo más de <strong>11 años</strong> <cite class="cita" data-ref="yule1927method" data-loc="p. 276"><a href="#ref-m9-yule1927method" title="Yule, G. U. (1927). VII. On a method of investigating periodicities in disturbed series, with special reference to Wolfer’s sunspot numbers. Philosophical Transactions of the Royal Society of London. Series A, Containing Papers of a Mathematical or Physical Character, 226(636-646), 267-298. https://doi.org/10.1098/rsta.1927.0007">(Yule, 1927, p. 276)</a></cite>.</span> Corregir la escala no solo arregló el diagnóstico: acercó la estimación a ese valor.</p>

      <div class="note">
        <p><strong>¿Y si el $0.5$ fuera arbitrario?</strong> Con el $\lambda = 0.3062$ de Guerrero en vez de la raíz
          cuadrada, el AR(2) da un pseudo-periodo de $11.39$ años y un Ljung–Box de $p = 0.4892$. Conviene notar dónde
          se aplica cada cosa: ese $\lambda$ se <strong>estima</strong> sobre <code>manchas + 1</code>, porque Guerrero
          exige datos estrictamente positivos y la serie tiene un cero, pero se <strong>aplica</strong> sobre la serie
          original, <code>manchas^0.3062</code>. Sobre la desplazada saldría $11.28$ y $p = 0.2216$: la misma lectura.
          <span data-afirma="c3-m9-08">La conclusión <strong>no depende</strong> de haber elegido exactamente $0.5$: las dos transformaciones de potencia probadas hacen el mismo trabajo.</span> Eso es señal de que el hallazgo es robusto y no un artefacto.</p>
      </div>

      <h3>El AR(2) final, escrito con los polinomios del Módulo 1</h3>

      <p>Esa ecuación está escrita como recursión, que es la forma en que se estima. Escrita con el operador de
        rezago es la forma en que se <em>interroga</em>, y de paso contesta a casi todo lo que el capítulo lleva
        preguntado desde la primera página:</p>

      <div class="formula">
        $$\hat\phi(B)\,\big(\sqrt{y_t} - 6.3317\big) = \hat\theta(B)\,\varepsilon_t$$
        $$\begin{aligned}
          \hat\phi(B) &= 1 - 1.4027\,B + 0.6853\,B^2 \\
          \hat\theta(B) &= 1
        \end{aligned}$$
      </div>

      <div class="warning">
        <p><strong>El signo del segundo coeficiente.</strong> El ajuste devuelve $\hat\phi_2 = -0.6853$ y el
          polinomio lleva $+0.6853\,B^2$. No es una errata: el convenio del Módulo 1 es
          $\phi(B) = 1 - \phi_1 B - \phi_2 B^2$, así que los $\phi$ entran restando y un coeficiente negativo
          aparece sumando. Escribir $1 - 1.4027\,B - 0.6853\,B^2$ no produce ningún aviso: produce <strong>otro
          proceso</strong>, cuyas raíces son $0.5598$ y $-2.6066$. La primera cae <em>dentro</em> del círculo
          unitario, de modo que ese otro proceso ni siquiera es estacionario. Es la misma clase de fallo silencioso
          que el orden de los coeficientes en <code>polyroot()</code>.</p>
      </div>

      <p>Con el polinomio delante, la pregunta del Módulo 1 se contesta sola. Las raíces de $\hat\phi(B) = 0$ son
        complejas conjugadas:</p>

      <div class="formula">
        $$\begin{aligned}
          B_{1,2} &= 1.0234 \pm 0.6418\,i \\
          |B_{1,2}| &= 1.2080 > 1
        \end{aligned}$$
      </div>

      <p><span data-afirma="c3-m9-53">El módulo mayor que uno es el veredicto de estacionariedad <cite class="cita" data-ref="cryer2008time" data-loc="p. 71"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 71)</a></cite>.</span> Pero una raíz compleja trae <em>dos</em>
        números, y el segundo no se ha usado todavía: su argumento, $\omega = 0.5601$ radianes. Y resulta que</p>

      <div class="formula">
        $$\frac{2\pi}{\omega} = \frac{2\pi}{0.5601} = 11.22\ \text{años}$$
      </div>

      <p>Es decir: el $11.22$ que hace un momento se leía como «el ciclo solar» <strong>es el ángulo de la raíz del
        polinomio</strong>, y no un número que salga de una fórmula aparte. La expresión del Módulo 2,
        $2\pi/\arccos\!\big(\phi_1/(2\sqrt{-\phi_2})\big)$, es esta misma cuenta escrita sin números complejos. <span data-afirma="c3-m9-10">El
        módulo dice <em>cuánto se amortigua</em> la oscilación; el ángulo, <em>cada cuánto</em> oscila <cite class="cita" data-ref="cryer2008time" data-loc="p. 73"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 73)</a></cite>.</span></p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Otra fórmula para «el pseudo-periodo».</strong> <span data-afirma="c3-m9-40"><cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5" data-modo="narrativa"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">Hyndman y Athanasopoulos (2021, §9.5)</a></cite> dan para el AR(2) con raíces complejas el <em>periodo medio de los ciclos</em>,
          $2\pi/\arccos\!\big(-\phi_1(1-\phi_2)/(4\phi_2)\big)$</span>, que con estos coeficientes vale $11.84$ años y no
          $11.22$. Ninguna de las dos cifras está mal: miden cosas distintas. <span data-afirma="c3-m9-44">El $11.22$ es el pseudo-periodo con que
          oscilan la ACF y los pesos $\psi$ del modelo, el ángulo de la raíz <cite class="cita" data-ref="cryer2008time" data-loc="p. 75"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 75)</a></cite></span>; <span data-afirma="c3-m9-45">el $11.84$ coincide con el periodo
          en que es máxima la densidad espectral del proceso —el reparto de su varianza por frecuencias, que este
          curso no desarrolla—. Las dos se juntan cuando el módulo de la raíz se acerca a $1$</span>. Este capítulo usa
          siempre la primera.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>La invertibilidad, que aquí sale gratis</h4>
        <p>$\hat\theta(B) = 1$ es un polinomio constante: no tiene raíces, de manera que la condición del Módulo 3
          se cumple sin nada que comprobar. <span data-afirma="c3-m9-09"><strong>Todo AR puro es invertible</strong></span>, y la consecuencia es la del
          Módulo 4: la representación AR($\infty$) de este modelo es <em>finita</em>.</p>
        <p style="margin-bottom:0;">$$\begin{aligned}
            \pi_0 &= 1 \\
            \pi_1 &= -1.4027 \\
            \pi_2 &= 0.6853 \\
            \pi_j &= 0 \quad \text{para } j \ge 3
          \end{aligned}$$</p>
      </div>

      <p>Que los $\pi$ se acaben en el rezago 2 no es una curiosidad de notación. El pronóstico a un paso del
        Módulo 4 es $\hat y_{t\mid t-1} = -\sum_{j \ge 1}\pi_j\,y_{t-j}$, una suma infinita que en un MA o en un
        ARMA hay que truncar; aquí se reduce a la propia ecuación del modelo y le bastan dos años de historia.</p>

      <div class="note">
        <p><strong>¿Y el ARMA(2,1) que sobraba? Estaba impecable.</strong> Conviene comprobarlo, porque la
          tentación es suponer que un parámetro que sobra tiene que delatarse en algo. Su
          $\hat\theta(B) = 1 + 0.3732\,B$ tiene raíz $-2.6795$, de módulo $2.68 > 1$: <strong>invertible</strong>.
          Sus raíces AR son $1.0920 \pm 0.7661\,i$, de módulo $1.3339$, y no se parecen en nada a $-2.68$, así que
          tampoco hay rastro de la <strong>redundancia de parámetros</strong> del Módulo 5: no hay factor común que
          cancelar. El modelo estaba bien construido y bien estimado. Ni la invertibilidad ni el factor común lo
          habrían descartado, y por eso hizo falta volver a la escala.</p>
      </div>

      <h3>Los pesos $\psi$: qué deja un choque solar</h3>

      <p>Con los dos polinomios escritos ya se puede recorrer el Módulo 4 sobre el modelo ajustado. La recursión
        $\psi_j = \theta_j + \sum_i \phi_i\,\psi_{j-i}$, con todos los $\theta_j$ nulos, queda</p>

      <div class="formula">
        $$\begin{aligned}
          \psi_j &= 1.4027\,\psi_{j-1} - 0.6853\,\psi_{j-2} \\
          \psi_0 &= 1
        \end{aligned}$$
      </div>

      <p><span data-afirma="c3-m9-11">y en un AR(2) con raíces complejas tiene forma cerrada <cite class="cita" data-ref="cryer2008time" data-loc="p. 75"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 75)</a></cite></span>, que es donde se ve de dónde sale cada pieza:</p>

      <div class="formula">
        $$\psi_j = R^{\,j}\,\frac{\sin\big((j+1)\,\omega\big)}{\sin\omega}$$
        $$\begin{aligned}
          R &= \sqrt{-\hat\phi_2} = \frac{1}{|B_{1,2}|} = 0.8278 \\[0.3em]
          \omega &= 0.5601
        \end{aligned}$$
      </div>

      <p>Las dos piezas de la raíz reaparecen, ahora haciendo cosas distintas: el módulo manda en la amplitud —la
        envolvente $\pm R^{\,j}/\sin\omega = \pm 1.882 \times 0.8278^{\,j}$ se reduce a la mitad cada $3.67$ años—
        y el ángulo, en la oscilación. Los $\psi$ están en la escala en que se ajustó el modelo: un choque de una
        unidad en $\sqrt{\text{manchas}}$ deja $1.40$ unidades de exceso al año siguiente, todavía $0.84$ tres años
        después, y al quinto <strong>ha cambiado de signo</strong>. Los $\psi$ se anulan cuando $(j+1)\,\omega$ es
        múltiplo de $\pi$, es decir en $j + 1 = 5.61$ y $j + 1 = 11.22$: medio ciclo y un ciclo de los $11.22$
        años. La respuesta
        al impulso late con el mismo periodo que la serie, y eso es lo que significa «pseudo-periodo»: no hay una
        periodicidad impuesta desde fuera, hay choques que se propagan oscilando y apagándose.</p>

      <p>Y aquí los $\psi$ dejan de ser álgebra. <span data-afirma="c3-m9-46">La varianza del error de pronóstico del Módulo 4, con
        $\hat\sigma^2 = 1.3410$, se obtiene sumando sus cuadrados <cite class="cita" data-ref="cryer2008time" data-loc="p. 201"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 201)</a></cite></span>:</p>

      <div class="formula">
        $$\operatorname{Var}(e_{T+h}) = \hat\sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
      </div>

      <p>Cada fila lleva el peso $\psi_j$ y, a su derecha, lo que se acumula hasta él: la fila de $j = 5$ es el
        horizonte $h = 6$, porque el horizonte $h$ suma los $h$ pesos $\psi_0, \ldots, \psi_{h-1}$.</p>

      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>El abanico se abre, y se para</h4>
        <p>Las dos últimas columnas no son un ejercicio paralelo: son lo que imprime <code>forecast()</code>. El
          código de abajo lo comprueba en las seis primeras filas, con cuatro decimales. Y enseñan algo que el
          Capítulo 4 va a contrastar. <span data-afirma="c3-m9-47">La suma
          $\sum_j \psi_j^2$ <strong>converge</strong>, a $6.136$, así que la varianza del pronóstico no puede pasar
          de $1.3410 \times 6.136 = 8.23$ —que es $\hat\gamma_0$, la varianza del propio proceso <cite class="cita" data-ref="cryer2008time" data-loc="p. 201"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 201)</a></cite></span>: la varianza
          muestral de $\sqrt{\text{manchas}}$ vale $8.15$—.</p>
        <p style="margin-bottom:0;">El semiancho, por tanto, se detiene en $\pm 5.62$, y a los seis años ya ha
          recorrido el $94\,\%$ de ese camino. Pasado medio ciclo solar, el modelo no sabe decir mucho más que «la
          media». <span data-afirma="c3-m9-48">Esa es la firma de un proceso <strong>estacionario</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>; en el Capítulo 4, con una raíz
          unitaria, la suma diverge y el abanico se abre sin techo <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite>.</span></p>
      </div>

      <div class="warning">
        <p><strong>Estas bandas están en la escala de la raíz.</strong> <span data-afirma="c3-m9-13">Volver a las manchas es elevar al cuadrado
          los extremos: sobre valores no negativos el cuadrado es creciente, así que respeta los cuantiles y el
          $95\,\%$ sigue siendo el $95\,\%$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.6"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.6)</a></cite>.</span> Con una salvedad: un límite inferior negativo —pronosticando desde
          1869 ocurre en $h = 7$ y $h = 8$, con $-0.209$ y $-0.114$— se trunca en cero <em>antes</em> de elevarlo,
          porque su cuadrado ($0.044$ y $0.013$) sería una cota positiva falsa. <span data-afirma="c3-m9-12">El <em>centro</em>, en cambio, no
          se transforma igual: el cuadrado del pronóstico es la
          <strong>mediana</strong> de las manchas, y no su media, si la distribución en la escala de la raíz es simétrica <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.6"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.6)</a></cite>.</span> Es el mismo asunto que el $\exp$ del modelo airline
          en el Capítulo 5.</p>
      </div>

      <div class="warning">
        <p><strong>Lo que sigue sin estar bien.</strong> La normalidad de los residuales mejora pero no llega: la
          asimetría baja de $0.791$ a $0.573$ y <span data-afirma="c3-m9-14">el $p$-valor de Shapiro–Wilk <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m9-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span> sube de $0.0007$ a $0.0470$, que sigue
          rechazando al 5 %. <span data-afirma="c3-m9-15">El número de manchas solares sube más rápido de lo que baja <cite class="cita" data-ref="cryer2008time" data-loc="p. 392"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 392)</a></cite>, y esa asimetría sugiere una <strong>no linealidad</strong> que un modelo ARMA con errores normales no puede capturar <cite class="cita" data-ref="cryer2008time" data-loc="p. 396"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 396)</a></cite>.</span> <span data-afirma="c3-m9-16">Los intervalos de pronóstico del
          Capítulo 6, que suponen normalidad, pueden quedar algo mal calibrados <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>.</span> Decirlo es parte del trabajo.</p>
      </div>

      <h3>El código del caso 1</h3>

      <p>Las cifras del caso salen de este bloque, en el orden en que aparecen, incluidas las de la serie cruda que el
        caso añade (el ARMA(2,1), la asimetría y Shapiro–Wilk); las demás de la serie cruda, de los bloques de los
        Módulos 7 y 8.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Caso 1: manchas solares">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>

        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">## ---- Caso 1: manchas solares en raiz cuadrada -------------------------
manchas &lt;- window(sunspot.year, start = 1770, end = 1869)

# Elasticidad amplitud-nivel: pendiente de log(desviacion) contra log(media) en
# bloques consecutivos de k anios (los que sobran al final se descartan)
elasticidad &lt;- function(x, k) {
  g &lt;- rep(seq_len(length(x) %/% k), each = k)
  x &lt;- as.numeric(x)[seq_along(g)]
  niv &lt;- tapply(x, g, mean); amp &lt;- tapply(x, g, sd)
  aj &lt;- lm(log(amp) ~ log(niv))
  c(b = coef(aj)[[2]], confint(aj)[2, ], R2 = summary(aj)$r.squared)
}
res &lt;- t(sapply(c(10, 11, 5), function(k) elasticidad(manchas, k)))
rownames(res) &lt;- paste(c(10, 11, 5), "anios")
round(res, 3)
#&gt;              b 2.5 % 97.5 %    R2
#&gt; 10 anios 0.816 0.593  1.040 0.899
#&gt; 11 anios 0.766 0.533  0.998 0.897
#&gt; 5 anios  0.703 0.475  0.931 0.700

min(manchas)          # el logaritmo NO es una opcion
#&gt; [1] 0
sum(manchas == 0)
#&gt; [1] 1
sum(sunspot.year == 0)   # en la serie completa, 1700-1988
#&gt; [1] 3

library(forecast)
# Guerrero exige datos ESTRICTAMENTE positivos y aqui hay un cero, asi que
# se desplaza la serie una unidad (con el cero crudo, R lanza un aviso).
round(BoxCox.lambda(manchas + 1, method = "guerrero"), 4)
#&gt; [1] 0.3062      entre el logaritmo (0) y la raiz cuadrada (0.5)

# La PACF en las dos escalas: que rezagos salen de la banda +-0.196
banda &lt;- 1.96 / sqrt(length(manchas))
fuera &lt;- function(x) {
  p &lt;- pacf(x, lag.max = 20, plot = FALSE)$acf[, 1, 1]
  round(setNames(p[abs(p) &gt; banda], which(abs(p) &gt; banda)), 3)
}
fuera(manchas)
#&gt;      1      2
#&gt;  0.806 -0.634
fuera(sqrt(manchas))
#&gt;      1      2      6      9     16
#&gt;  0.818 -0.617  0.200  0.198 -0.199

# La misma rejilla del Modulo 8 (los once candidatos), ahora sobre la raiz cuadrada
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
rejilla &lt;- list(c(1,0), c(2,0), c(3,0), c(4,0), c(0,1), c(0,2), c(0,3),
                c(1,1), c(2,1), c(1,2), c(2,2))
compara &lt;- function(x) do.call(rbind, lapply(rejilla, function(pq) {
  aj &lt;- arima(x, order = c(pq[1], 0, pq[2]), method = "ML")
  data.frame(modelo = sprintf("ARMA(%d,%d)", pq[1], pq[2]),
             AICc = round(aicc(aj, length(x)), 2), BIC = round(BIC(aj), 2),
             LB12 = round(Box.test(residuals(aj), lag = 12, type = "Ljung-Box",
                                   fitdf = sum(pq))$p.value, 4))
}))
sq &lt;- compara(sqrt(manchas))
sq[order(sq$AICc), ][1:4, ]          # las cuatro filas de la tabla, ordenadas por AICc
#&gt;       modelo   AICc    BIC   LB12
#&gt; 2  ARMA(2,0) 324.00 334.00 0.1644
#&gt; 3  ARMA(3,0) 325.35 337.74 0.2005
#&gt; 9  ARMA(2,1) 325.41 337.80 0.1856
#&gt; 11 ARMA(2,2) 327.42 342.14 0.1833
c(AICc = sq$modelo[which.min(sq$AICc)], BIC = sq$modelo[which.min(sq$BIC)])
#&gt;        AICc         BIC
#&gt; "ARMA(2,0)" "ARMA(2,0)"       &lt;- el AR(2) gana por los dos criterios

ar2s &lt;- arima(sqrt(manchas), order = c(2, 0, 0), method = "ML")
round(coef(ar2s), 4)
#&gt;     ar1     ar2  intercept
#&gt;  1.4027 -0.6853     6.3317
round(sqrt(diag(ar2s$var.coef))[1:2], 4)    # errores estandar de phi_1 y phi_2
#&gt;    ar1    ar2
#&gt; 0.0727 0.0724
round(coef(ar2s)[1:2] / sqrt(diag(ar2s$var.coef))[1:2], 2)   # estadisticos t
#&gt;    ar1    ar2
#&gt;  19.31  -9.46
round(ar2s$sigma2, 4)
#&gt; [1] 1.341

Box.test(residuals(ar2s), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value
#&gt; [1] 0.1643997          &lt;- ahora SI pasa

phi &lt;- coef(ar2s)[1:2]
round(2 * pi / Arg(polyroot(c(1, -phi))[1]), 4)
#&gt; [1] 11.2178            anios; la estimacion habitual del periodo es algo mas de 11 (Modulo 9)

# Cambiar la raiz por la potencia de Guerrero (lambda = 0.3062): la lectura no cambia
ajusta &lt;- function(x) {
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  c(periodo = 2 * pi / Arg(polyroot(c(1, -coef(f)[1:2]))[1]),
    LB12 = Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value)
}
lam &lt;- BoxCox.lambda(manchas + 1, method = "guerrero")
round(rbind(raiz = ajusta(sqrt(manchas)),
            guerrero = ajusta(manchas^lam),                 # se aplica sobre la serie original
            guerrero_desplazada = ajusta((manchas + 1)^lam)), 4)
#&gt;                     periodo   LB12
#&gt; raiz                11.2178 0.1644
#&gt; guerrero            11.3883 0.4892
#&gt; guerrero_desplazada 11.2759 0.2216

# --- El modelo como polinomio: modulo Y angulo de la raiz --------------
raices &lt;- polyroot(c(1, -phi))     # phi(B) = 1 - 1.4027 B + 0.6853 B^2
round(raices, 4)
#&gt; [1] 1.0234+0.6418i 1.0234-0.6418i
round(c(modulo = Mod(raices)[1], angulo = Arg(raices)[1]), 4)
#&gt; modulo angulo
#&gt; 1.2080 0.5601            modulo &gt; 1: estacionario; 2*pi/angulo = 11.2178

# Con el signo de phi_2 sin cambiar, el polinomio es OTRO proceso: 1 - 1.4027 B - 0.6853 B^2
round(Re(polyroot(c(1, -phi[[1]], phi[[2]]))), 4)
#&gt; [1]  0.5598 -2.6066      una raiz DENTRO del circulo: ni siquiera es estacionario

# La otra formula del periodo: el periodo medio de los ciclos (no coincide)
round(2 * pi / acos(-phi[[1]] * (1 - phi[[2]]) / (4 * phi[[2]])), 4)
#&gt; [1] 11.8356

# theta(B) = 1 no tiene raices: un AR puro es invertible y sus pi se acaban
round(c(pi1 = -phi[[1]], pi2 = -phi[[2]]), 4)
#&gt;     pi1     pi2
#&gt; -1.4027  0.6853
# ...y la PACF teorica de este AR(2) se corta en 2, con el propio phi_2
round(ARMAacf(ar = phi, lag.max = 3, pacf = TRUE), 4)
#&gt; [1]  0.8323 -0.6853  0.0000

# El ARMA(2,1) de la serie cruda: invertible y sin factor comun con la parte AR
a21 &lt;- arima(manchas, order = c(2, 0, 1), method = "ML")
round(coef(a21), 4)
#&gt;       ar1       ar2       ma1 intercept
#&gt;    1.2274   -0.5620    0.3732   48.5307
round(coef(a21)[["ma1"]] / sqrt(a21$var.coef["ma1", "ma1"]), 2)   # t de theta_1
#&gt; [1] 2.78
round(polyroot(c(1, coef(a21)[["ma1"]])), 4)                      # raiz de theta(B)
#&gt; [1] -2.6795+0i
raices21 &lt;- polyroot(c(1, -coef(a21)[c("ar1", "ar2")]))           # raices AR
round(raices21, 4)
#&gt; [1] 1.092+0.7661i 1.092-0.7661i
round(Mod(raices21), 4)
#&gt; [1] 1.3339 1.3339

# Los pesos psi del Modulo 4, sobre los coeficientes ESTIMADOS.
# ARMAtoMA() devuelve psi_1 en adelante; psi_0 = 1 va por convenio.
psi &lt;- c(1, ARMAtoMA(ar = phi, ma = numeric(0), lag.max = 11))
round(psi, 4)
#&gt;  [1]  1.0000  1.4027  1.2822  0.8372  0.2957 -0.1590 -0.4257 -0.4881 -0.3929
#&gt; [10] -0.2167 -0.0346  0.0999      cambian de signo entre el 4 y el 5
# Forma cerrada del AR(2) con raices complejas: envolvente x oscilacion
Rmod &lt;- unname(sqrt(-phi[2])); w &lt;- Arg(raices)[1]
round(Rmod^(0:11) * sin((0:11 + 1) * w) / sin(w), 4)
#&gt;  [1]  1.0000  1.4027  1.2822  0.8372  0.2957 -0.1590 -0.4257 -0.4881 -0.3929
#&gt; [10] -0.2167 -0.0346  0.0999      identica a la recursion
# La envolvente es +-factor * R^j; se reduce a la mitad cada "mitad" anios; los
# psi se anulan cuando (j + 1) * w es multiplo de pi, es decir, en j + 1 = "ceros" (medio ciclo)
round(c(R = Rmod, factor = 1 / sin(w), mitad = log(0.5) / log(Rmod), ceros = pi / w), 4)
#&gt;      R factor  mitad  ceros
#&gt; 0.8278 1.8823 3.6684 5.6089

# De los psi salen las bandas del pronostico, que es lo que hace forecast()
ee &lt;- sqrt(ar2s$sigma2 * cumsum(psi^2))
round(cumsum(psi^2), 4)                 # columna de la suma de cuadrados
#&gt;  [1] 1.0000 2.9675 4.6115 5.3124 5.3998 5.4251 5.6063 5.8446 5.9990 6.0459
#&gt; [11] 6.0471 6.0571
round(ee, 2)                            # error estandar
#&gt;  [1] 1.16 1.99 2.49 2.67 2.69 2.70 2.74 2.80 2.84 2.85 2.85 2.85
round(qnorm(0.975) * ee, 2)             # semiancho al 95 %
#&gt;  [1] 2.27 3.91 4.87 5.23 5.27 5.29 5.37 5.49 5.56 5.58 5.58 5.59
round(qnorm(0.975) * ee[1:6], 4)
#&gt; [1] 2.2697 3.9098 4.8739 5.2312 5.2741 5.2864
f &lt;- forecast(ar2s, h = 6, level = 95)
round(as.numeric((f$upper - f$lower) / 2), 4)
#&gt; [1] 2.2697 3.9098 4.8739 5.2312 5.2741 5.2864   &lt;- lo mismo

# El techo: en un proceso ESTACIONARIO la suma de psi^2 converge
psi_largo &lt;- c(1, ARMAtoMA(ar = phi, ma = numeric(0), lag.max = 600))
round(c(suma = sum(psi_largo^2), gamma0 = ar2s$sigma2 * sum(psi_largo^2),
        var_muestral = var(sqrt(manchas))), 4)
#&gt;         suma       gamma0 var_muestral
#&gt;       6.1360       8.2283       8.1490   el abanico no pasa de gamma0
techo &lt;- qnorm(0.975) * sqrt(ar2s$sigma2 * sum(psi_largo^2))
round(c(techo = techo, fraccion_h6 = qnorm(0.975) * ee[6] / techo), 4)
#&gt;       techo fraccion_h6
#&gt;      5.6222      0.9403

# Volver a las manchas: un limite inferior negativo se trunca en cero ANTES de
# elevarlo al cuadrado, porque su cuadrado seria una cota positiva falsa
inf &lt;- as.numeric(forecast(ar2s, h = 8, level = 95)$lower)[7:8]   # h = 7 y h = 8
round(inf, 3)
#&gt; [1] -0.209 -0.114
round(inf^2, 3)
#&gt; [1] 0.044 0.013

# Lo que sigue sin estar bien: la normalidad de los residuales
asimetria &lt;- function(e) mean((e - mean(e))^3) / sd(e)^3
ml &lt;- arima(manchas, order = c(2, 0, 0), method = "ML")          # sobre la serie cruda
round(c(cruda = asimetria(residuals(ml)), raiz = asimetria(residuals(ar2s))), 3)
#&gt;  cruda   raiz
#&gt;  0.791  0.573
round(c(cruda = shapiro.test(residuals(ml))$p.value,
        raiz  = shapiro.test(residuals(ar2s))$p.value), 4)
#&gt;  cruda   raiz
#&gt; 0.0007 0.0470</code></pre>

          <pre><code class="language-python">import numpy as np
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox
from statsmodels.tsa.stattools import pacf
from statsmodels.tsa.arima_process import arma2ma

## ---- Caso 1: manchas solares en raiz cuadrada -------------------------
datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values

# Elasticidad amplitud-nivel: pendiente de log(desviacion) contra log(media) en
# bloques consecutivos de k anios (los que sobran al final se descartan)
def elasticidad(x, k):
    n = len(x) // k
    bloques = x[:n * k].reshape(n, k)
    niv, amp = bloques.mean(axis=1), bloques.std(axis=1, ddof=1)
    aj = sm.OLS(np.log(amp), sm.add_constant(np.log(niv))).fit()
    lo, hi = aj.conf_int()[1]
    return [aj.params[1], lo, hi, aj.rsquared]

print(np.round([elasticidad(manchas, k) for k in (10, 11, 5)], 3))
# [[0.816 0.593 1.04  0.899]
#  [0.766 0.533 0.998 0.897]
#  [0.703 0.475 0.931 0.7  ]]     filas: bloques de 10, 11 y 5 anios; columnas: b, IC 95 %, R2

print(manchas.min(), (manchas == 0).sum())   # 0.0  1   -&gt; log imposible
print((datos.loc[datos.YEAR &lt;= 1988, "SUNACTIVITY"] == 0).sum())   # 3 en 1700-1988

# La PACF en las dos escalas: que rezagos salen de la banda +-0.196
banda = 1.96 / np.sqrt(len(manchas))
def fuera(x):
    p = pacf(x, nlags=20, method="ywm")[1:]
    return {int(k + 1): round(float(p[k]), 3) for k in np.where(np.abs(p) &gt; banda)[0]}
print(fuera(manchas))             # {1: 0.806, 2: -0.634}
print(fuera(np.sqrt(manchas)))    # {1: 0.818, 2: -0.617, 6: 0.2, 9: 0.198, 16: -0.199}

ar2s = ARIMA(np.sqrt(manchas), order=(2, 0, 0), trend="c").fit()
print(np.round(ar2s.arparams, 4))            # [ 1.4027 -0.6853]

lb = acorr_ljungbox(ar2s.resid, lags=[12], model_df=2)
print(round(float(lb["lb_pvalue"].iloc[0]), 4))   # 0.178
# R daba 0.1644: devuelve estandarizados los dos primeros residuales, y
# statsmodels no (Modulo 8). Descartando esos dos, los dos programas dan 0.1682.

phi = ar2s.arparams
raices = np.roots(np.r_[1, -phi][::-1])
print(round(2 * np.pi / np.angle(raices[0]), 4))  # 11.218 (en R, 11.2178)

print(np.round(ar2s.polynomial_ar, 4))       # [ 1.     -1.4027  0.6853]
print(round(abs(raices[0]), 4), round(float(np.angle(raices[0])), 4))
# 1.208 0.5601        modulo y angulo: estacionariedad y pseudo-periodo

# arma2ma es la misma recursion del Modulo 4, pero pide los coeficientes
# del POLINOMIO: el AR va negado, igual que en ArmaProcess (Modulo 1).
psi = arma2ma(np.r_[1, -phi], np.r_[1], lags=12)
print(np.round(psi, 4))
# [ 1.      1.4027  1.2822  0.8372  0.2957 -0.159  -0.4256 -0.4881 -0.3929
#  -0.2167 -0.0346  0.0999]
# El septimo peso sale -0.4256 y en R -0.4257: los dos optimizadores no dan
# exactamente el mismo phi. Es diferencia de estimacion, no de formula.

s2 = ar2s.params[-1]                  # ['const', 'ar.L1', 'ar.L2', 'sigma2']
ee = np.sqrt(s2 * np.cumsum(psi**2))
print(np.round(1.959964 * ee[:6], 4))
# [2.2697 3.9098 4.8739 5.2312 5.2741 5.2864]
ci = np.asarray(ar2s.get_forecast(6).conf_int(alpha=0.05))
print(np.round((ci[:, 1] - ci[:, 0]) / 2, 4))
# [2.2697 3.9098 4.8739 5.2312 5.2741 5.2864]   &lt;- lo mismo

# La rejilla sobre la raiz, las variantes de lambda y la normalidad de los residuales
# se calculan en la pestana R: statsmodels devuelve sin estandarizar los dos primeros
# residuales (Modulo 8) y la asimetria y el Shapiro-Wilk saldrian distintos.</code></pre>
        </div>
      </div>

      <h3>El capítulo entero, sobre una sola serie</h3>

      <p>Conviene mirar atrás y contar cuánto del capítulo ha hecho falta para cerrar cien observaciones anuales:</p>

      <table style="position:relative;">
        <caption class="sr-only">Qué aportó cada módulo del capítulo al caso de las manchas solares</caption>
        <thead>
          <tr><th scope="col">Módulo</th><th scope="col">Qué puso en este caso</th></tr>
        </thead>
        <tbody>
          <tr><td>3.1 · Operador de rezago</td>
            <td>El modelo escrito como $\hat\phi(B)(\sqrt{y_t}-6.33) = \varepsilon_t$, y las raíces
              $1.0234 \pm 0.6418\,i$, de módulo $1.208$, que lo declaran estacionario.</td></tr>
          <tr><td>3.2 · Procesos AR</td>
            <td>La PACF que se corta en el rezago 2 y propone el orden; el ángulo de las raíces complejas, que da
              los $11.22$ años.</td></tr>
          <tr><td>3.3 · Procesos MA</td>
            <td>La invertibilidad: trivial en el AR(2) final, comprobada en el ARMA(2,1) de la serie cruda —que la
              cumplía—.</td></tr>
          <tr><td>3.4 · Dualidad AR ↔ MA</td>
            <td>Los $\pi$, que aquí se acaban en dos términos, y los $\psi$, que producen las bandas del pronóstico
              y su techo.</td></tr>
          <tr><td>3.5 · ARMA e identificación</td>
            <td>La tabla para leer los correlogramas, y la comprobación de que entre $\hat\phi(B)$ y $\hat\theta(B)$
              no había factor común que cancelar.</td></tr>
          <tr><td>3.6 · Simular y reconocer</td>
            <td>El único que no entra en ninguna cuenta, y hace falta igual: enseñó cuánto se aleja de la teoría una
              muestra finita (allí, de $200$ datos), que es la prudencia con la que hay que leer esa PACF.</td></tr>
          <tr><td>3.7 · Estimación</td>
            <td>Los $\hat\phi$ por máxima verosimilitud, con errores estándar $0.0727$ y $0.0724$.</td></tr>
          <tr><td>3.8 · Criterios y diagnóstico</td>
            <td>La rejilla ordenada por AICc y BIC, y el Ljung–Box que primero rechazó y después pasó.</td></tr>
        </tbody>
      </table>

      <p>Y falta una novena pieza, que no es de ningún módulo: el <strong>orden</strong> en que se usan, y la
        disposición a volver atrás. El AICc premiaba un parámetro que solo estaba tapando una escala equivocada, y
        ningún criterio de este capítulo lo dice. Lo dijeron un diagnóstico que fallaba y una pregunta del
        Capítulo 1 —¿crece la variabilidad con el nivel?— hecha cuando el modelo ya parecía terminado.</p>

      <h3>Caso 2 · Log-retornos de la TRM: cuando no hay nada que modelar</h3>

      <p>Retomemos la TRM del Capítulo 2. <span data-afirma="c3-m9-17">Allí se concluyó que tiene una raíz unitaria y que su primera
        diferencia es estacionaria.</span> Trabajemos con los <strong>log-retornos</strong>
        <span data-afirma="c3-m9-18">$r_t = 100 \times \log(y_t/y_{t-1})$, el rendimiento continuo de las finanzas, multiplicado por $100$ para leerlo como variación porcentual <cite class="cita" data-ref="cryer2008time" data-loc="p. 278"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 278)</a></cite>, lectura que es una buena aproximación mientras la variación sea pequeña <cite class="cita" data-ref="cryer2008time" data-loc="p. 99"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 99)</a></cite></span> ($T = 137$).</p>

      <div class="simulador" data-simulador="trm-retornos">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Log-retornos mensuales de la TRM</h4>
        <p class="simulador-intro">La serie y sus dos correlogramas. La banda es $\pm 0.1675$. Prácticamente todo cae
          dentro: solo asoman <strong>dos</strong> barras, el rezago 5 ($0.193$) y el rezago 8 ($-0.198$), y ya
          sabemos por el Módulo 6 que con 20 rezagos se espera <strong>uno</strong> fuera por puro azar. Dos, en
          rezagos sin ninguna interpretación en una serie mensual, es exactamente lo que produce el azar.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:190px;">

        <p class="grafico-etiqueta">PACF</p>
        <div class="grafico-wrapper" style="height:185px;">
          <canvas aria-label="PACF de los log-retornos de la TRM" role="img"></canvas>

        <div class="simulador-lectura"></div>
      </div>

      <p>Ljung–Box sobre la serie da $p = 0.0931$ en el rezago 6, $p = 0.0601$ en el 12 y $p = 0.0599$ en el 20: no se
        rechaza en ninguno, aunque el $0.06$ es lo bastante bajo como para no cantar victoria. La búsqueda
        automática tampoco encuentra nada firme: <span data-afirma="c3-m9-20"><code>auto.arima()</code>, del paquete <code>forecast</code>, ajusta
        por sí sola varios modelos ARIMA <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 16"><a href="#ref-m9-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 16)</a></cite> y se queda con el de menor AICc (el artículo que la presentó usaba el AIC; el AICc es hoy el criterio por defecto del paquete; el Capítulo 4 detalla cómo busca). Con sus
        argumentos por defecto devuelve un ARIMA(0,0,0) con media cero, es decir, ruido blanco.</span> <span data-afirma="c3-m9-52">Solo con la búsqueda exhaustiva
        (<code>stepwise = FALSE</code>; <code>approximation = FALSE</code> no cambia nada aquí, porque con 137 datos ya
        es su valor por defecto), que prueba modelos a los que la búsqueda por pasos no llega <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>, devuelve un MA(1),
        también sin media</span>:</p>

      <div class="formula">
        $$\hat\theta_1 = 0.1326 \;\; (\text{e.e. } 0.0905,\; t = 1.47)$$
        <p style="margin-bottom:0;">Ese MA(1) y el ruido blanco puro, los dos sin media, dan un AICc
          de $722.653$ frente a $722.663$: una diferencia de <strong>una centésima</strong>. Son indistinguibles.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>La conclusión honesta</h4>
        <p style="margin-bottom:0;">Los log-retornos mensuales de la TRM son, a efectos prácticos,
          <strong>ruido blanco</strong>. El mejor modelo ARMA para esta serie es el modelo sin parámetros, y el mejor
          <span data-afirma="c3-m9-23">pronóstico de la variación del mes que viene es una constante: la media histórica, o cero si, como aquí, la media no se distingue de cero</span>. No es un fracaso del análisis: es su
          resultado.</p>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>De qué serie se dice.</strong> <span data-afirma="c3-m9-49">Esta TRM mensual es el
          <em>promedio</em> de los valores diarios de cada mes</span>, y promediar deja huella. <span data-afirma="c3-m9-50">Si la tasa diaria fuera una
          caminata aleatoria pura, las variaciones del promedio mensual no serían ruido blanco: tendrían
          $\rho_1 \approx 0.25$ ($0.249$ con 21 días por mes).</span> El $r_1$ observado es $0.105$, a $1.7$ errores
          estándar por debajo de esa cifra. El «ruido blanco» de arriba describe, entonces, las variaciones del
          promedio mensual, que es la serie que aquí se modela; no dice que la tasa diaria sea una caminata
          aleatoria, ni lo contrario. Para eso habría que trabajar con la tasa de un día fijo de cada mes o con
          los datos diarios.</p>
      </div>

      <div class="warning">
        <p><strong>Ojo con la media.</strong> Los dos modelos que devuelve <code>auto.arima()</code> van
          <strong>sin</strong> término constante. No es un capricho: en el MA(1) con media, la media mensual estimada
          es $0.2681\ \%$ con un error estándar de $0.3195$, o sea $t = 0.84$. Con 137 meses no hay evidencia de que
          la TRM tenga una deriva distinta de cero, y el AICc lo recoge: el ruido blanco con media da $723.804$ y
          sin ella $722.663$. <span data-afirma="c3-m9-24">Esa comparación es legítima —con media o sin ella, los dos modelos se ajustan a los
          mismos datos y el criterio solo cobra el parámetro de más <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite>—, y es la que hace <code>auto.arima()</code>
          para decidir si la incluye <cite class="cita" data-ref="hyndman2008automatic" data-loc="p. 11"><a href="#ref-m9-hyndman2008automatic" title="Hyndman, R. J., y Khandakar, Y. (2008). Automatic Time Series Forecasting: The forecast Package for R. Journal of Statistical Software, 27(3), 1-22. https://doi.org/10.18637/jss.v027.i03">(Hyndman y Khandakar, 2008, p. 11)</a></cite>. Lo que el AICc no puede comparar son modelos ajustados a datos distintos, como los de otro orden de diferenciación <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite> o los de otra transformación.</span></p>
      </div>

      <div class="note">
        <p><strong>¿Y en el cuadrado? Aquí tampoco.</strong> <span data-afirma="c3-m9-27">Ljung–Box sobre $r_t$ da $p = 0.0601$, y sobre
          $r_t^2$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 282"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 282)</a></cite> da $p = 0.9166$: en esta serie mensual tampoco hay agrupamiento de volatilidad detectable.</span> <span data-afirma="c3-m9-26">En los rendimientos diarios de series financieras es frecuente el resultado opuesto —el nivel es ruido blanco y el cuadrado no— y esa es la puerta de entrada a los modelos ARCH y GARCH <cite class="cita" data-ref="cryer2008time" data-loc="p. 285"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 285)</a></cite>.</span> Saber si ocurre con la TRM exigiría repetir la prueba con los datos diarios.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Caso 2: log-retornos de la TRM">

        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">## ---- Caso 2: log-retornos de la TRM -----------------------------------
library(forecast)
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }   # la de arriba

# trm: la serie mensual del Capitulo 2, el promedio de los valores diarios
# de cada mes entre enero de 2015 y junio de 2026. Copia fija de los 138
# meses con que se calcularon estas cifras: se lee de la carpeta de trabajo
# si el archivo ya esta ahi; si no, de la pagina del curso.
archivo &lt;- "trm_mensual_2015-01_2026-06.csv"
if (!file.exists(archivo))
  archivo &lt;- paste0("https://jotamao1985.github.io/Series-de-Tiempo_Un_Bosque/datos/", archivo)
trm &lt;- ts(read.csv(archivo)$trm, start = c(2015, 1), frequency = 12)

ret &lt;- diff(log(trm)) * 100
length(ret)
#&gt; [1] 137

round(1.96 / sqrt(length(ret)), 4)      # banda
#&gt; [1] 0.1675
round(acf(ret, lag.max = 6, plot = FALSE)$acf[-1], 3)
#&gt; [1]  0.105 -0.077 -0.078  0.006  0.193  0.123

# Los rezagos que se salen de la banda, entre los 20 primeros
a &lt;- acf(ret, lag.max = 20, plot = FALSE)$acf[-1]
round(setNames(a, 1:20)[abs(a) &gt; 1.96 / sqrt(length(ret))], 3)
#&gt;      5      8
#&gt;  0.193 -0.198

sapply(c(6, 12, 20), function(h)
  round(Box.test(ret, lag = h, type = "Ljung-Box")$p.value, 4))
#&gt; [1] 0.0931 0.0601 0.0599

# auto.arima(): por defecto devuelve ruido blanco; con la busqueda
# exhaustiva, un MA(1). Ninguno de los dos lleva media.
arimaorder(auto.arima(ret))
#&gt; p d q
#&gt; 0 0 0
exh &lt;- auto.arima(ret, stepwise = FALSE, approximation = FALSE)
arimaorder(exh)
#&gt; p d q
#&gt; 0 0 1
round(c(theta = coef(exh)[["ma1"]], ee = sqrt(exh$var.coef[1, 1])), 4)
#&gt;  theta     ee
#&gt; 0.1326 0.0905

# Promediar deja huella: si la tasa DIARIA fuera una caminata aleatoria, las
# variaciones del promedio mensual de m = 21 dias tendrian esta rho_1
m &lt;- 21
pesos &lt;- c(1:m, (m - 1):1) / m     # peso de cada choque diario en la variacion mensual
rho1 &lt;- sum(pesos[1:(m - 1)] * pesos[(m + 1):(2 * m - 1)]) / sum(pesos^2)
round(c(rho1_inducido = rho1, r1_observado = a[1],
        distancia_ee = (rho1 - a[1]) * sqrt(length(ret))), 3)
#&gt;  rho1_inducido   r1_observado   distancia_ee
#&gt;          0.249          0.105          1.683

# La media no es significativa: el MA(1) CON media (el defecto de arima())
ma1 &lt;- arima(ret, order = c(0, 0, 1), method = "ML")
round(c(theta = coef(ma1)[["ma1"]], media = coef(ma1)[["intercept"]],
        ee_media = sqrt(ma1$var.coef[2, 2])), 4)
#&gt;    theta    media ee_media
#&gt;   0.1262   0.2681   0.3195

# El AICc SI compara con y sin media: son los mismos datos y solo cambia
# un parametro. Los cuatro modelos, de una vez:
con &lt;- function(q) arima(ret, order = c(0, 0, q), method = "ML")
sin &lt;- function(q) arima(ret, order = c(0, 0, q), include.mean = FALSE, method = "ML")
round(c(ruido_con_media = aicc(con(0), 137), ruido_sin_media = aicc(sin(0), 137),
        ma1_con_media   = aicc(con(1), 137), ma1_sin_media   = aicc(sin(1), 137)), 3)
#&gt; ruido_con_media ruido_sin_media   ma1_con_media   ma1_sin_media
#&gt;         723.804         722.663         724.046         722.653

# Volatilidad: estructura en los cuadrados?
round(Box.test(ret^2, lag = 12, type = "Ljung-Box")$p.value, 4)
#&gt; [1] 0.9166             &lt;- tampoco</code></pre>

          <pre><code class="language-python">import os
import numpy as np
import pandas as pd
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox
from statsmodels.tsa.stattools import acf

## ---- Caso 2: log-retornos de la TRM -----------------------------------
# La misma copia fija de 138 meses que lee R (enero de 2015 a junio de
# 2026): de la carpeta de trabajo si el archivo ya esta ahi; si no, de la
# pagina del curso.
archivo = "trm_mensual_2015-01_2026-06.csv"
if not os.path.exists(archivo):
    archivo = "https://jotamao1985.github.io/Series-de-Tiempo_Un_Bosque/datos/" + archivo
trm = pd.read_csv(archivo)["trm"]

ret = 100 * np.diff(np.log(trm.values))
print(len(ret), round(1.96 / np.sqrt(len(ret)), 4))    # 137 0.1675
a = acf(ret, nlags=20, fft=False)[1:]
print(np.round(a[:6], 3))
# [ 0.105 -0.077 -0.078  0.006  0.193  0.123]
fuera = np.where(np.abs(a) &gt; 1.96 / np.sqrt(len(ret)))[0]
print({int(k + 1): round(float(a[k]), 3) for k in fuera})   # {5: 0.193, 8: -0.198}

print(np.round(acorr_ljungbox(ret, lags=[6, 12, 20])["lb_pvalue"].values, 4))
# [0.0931 0.0601 0.0599]

# Promediar deja huella: rho_1 de las variaciones de un promedio de m = 21 dias
# de una caminata aleatoria, frente a la r_1 observada
m = 21
pesos = np.r_[np.arange(1, m + 1), np.arange(m - 1, 0, -1)] / m
rho1 = (pesos[:m - 1] * pesos[m:]).sum() / (pesos**2).sum()
print(round(rho1, 3), round(a[0], 3), round((rho1 - a[0]) * np.sqrt(len(ret)), 2))
# 0.249 0.105 1.68

ma1 = ARIMA(ret, order=(0, 0, 1), trend="n").fit()
rb  = ARIMA(ret, order=(0, 0, 0), trend="n").fit()
print(np.round(ma1.params[:1], 4))             # [0.1326]  theta, sin media
print(round(ma1.aicc, 3), round(rb.aicc, 3))   # 722.653 722.663  indistinguibles

print(round(float(acorr_ljungbox(ret**2, lags=[12])["lb_pvalue"].iloc[0]), 4))
# 0.9166</code></pre>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>lynx</code> trae el número de linces capturados cada año en Canadá entre 1821 y 1934: 114 valores. El caso de las manchas enseñó a mirar la escala antes de añadir un parámetro; se trata de aplicar esa lección a otra serie y ver qué pasa. Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>¿Hay que transformar, y con qué? La elasticidad amplitud–nivel en bloques de 10 años, el mínimo de la serie y el $\lambda$ de Guerrero.</li>
            <li>La rejilla de once candidatos del Módulo 8 sobre la serie cruda y sobre su logaritmo: el mejor por AICc y el mejor por BIC en cada escala. ¿Cambia el modelo elegido al transformar?</li>
            <li>El AR(2) en las dos escalas: pseudo-periodo, Ljung–Box en el rezago 12 y Shapiro–Wilk de los residuales. ¿Qué arregla la transformación y qué no?</li>

            </button>

          <div class="ejercicio-panel pista" id="c3m9-pista" hidden>
            <p style="margin:0;">Las funciones <code>elasticidad()</code>, <code>aicc()</code> y <code>compara()</code> están en el código del caso 1 y sirven tal cual cambiando la serie. No compares el AICc de una escala con el de la otra: son datos distintos. Y no des por hecho que la historia de las manchas se repite: escribe tu apuesta para (b) antes de ejecutar.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m9-sol" hidden>
            <p><strong>Respuesta: hay que tomar logaritmos, y hacerlo no cambia el modelo elegido —AR(4) por AICc y AR(2) por BIC en las dos escalas— ni arregla Ljung–Box —en logaritmos no lo pasa ningún candidato, y el AR(4), que lo pasaba en la serie cruda, deja de pasarlo—; lo que arregla es la normalidad de los residuales.</strong></p>
            <pre><code class="language-r">library(forecast)

# (a) Hay que transformar? La elasticidad amplitud-nivel del modulo,
#     en bloques de 10 anios
elasticidad &lt;- function(x, k) {
  g &lt;- rep(seq_len(length(x) %/% k), each = k)
  x &lt;- as.numeric(x)[seq_along(g)]
  niv &lt;- tapply(x, g, mean); amp &lt;- tapply(x, g, sd)
  aj &lt;- lm(log(amp) ~ log(niv))
  c(b = coef(aj)[[2]], confint(aj)[2, ], R2 = summary(aj)$r.squared)
}
round(elasticidad(lynx, 10), 3)
#&gt;      b  2.5 % 97.5 %     R2
#&gt;  0.904  0.542  1.266  0.780
min(lynx)                      # sin ceros: el logaritmo SI es una opcion
#&gt; [1] 39
round(BoxCox.lambda(lynx, method = "guerrero"), 4)
#&gt; [1] 0.1522

# (b) La rejilla del Modulo 8 (los once candidatos) en las dos escalas
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
rejilla &lt;- list(c(1,0), c(2,0), c(3,0), c(4,0), c(0,1), c(0,2), c(0,3),
                c(1,1), c(2,1), c(1,2), c(2,2))
# en log(lynx), el ARMA(2,1) avisa de un posible problema de convergencia (optim code = 1);
# no lo elige ningun criterio, y suppressWarnings() solo calla ese aviso
compara &lt;- function(x) do.call(rbind, lapply(rejilla, function(pq) {
  aj &lt;- suppressWarnings(arima(x, order = c(pq[1], 0, pq[2]), method = "ML"))
  data.frame(modelo = sprintf("ARMA(%d,%d)", pq[1], pq[2]),
             AICc = round(aicc(aj, length(x)), 2), BIC = round(BIC(aj), 2),
             LB12 = round(Box.test(residuals(aj), lag = 12, type = "Ljung-Box",
                                   fitdf = sum(pq))$p.value, 4))
}))
cruda &lt;- compara(lynx); logar &lt;- compara(log(lynx))
cruda[order(cruda$AICc), ][1:4, ]
#&gt;       modelo    AICc     BIC   LB12
#&gt; 4  ARMA(4,0) 1875.01 1890.64 0.0636
#&gt; 11 ARMA(2,2) 1876.95 1892.58 0.1143
#&gt; 2  ARMA(2,0) 1878.40 1888.98 0.0312
#&gt; 9  ARMA(2,1) 1880.01 1893.14 0.0056
logar[order(logar$AICc), ][1:4, ]
#&gt;       modelo   AICc    BIC   LB12
#&gt; 4  ARMA(4,0) 183.56 199.19 0.0090
#&gt; 2  ARMA(2,0) 185.52 196.09 0.0132
#&gt; 3  ARMA(3,0) 186.11 199.23 0.0042
#&gt; 11 ARMA(2,2) 186.53 202.16 0.0097
mejor &lt;- function(t) c(AICc = t$modelo[which.min(t$AICc)], BIC = t$modelo[which.min(t$BIC)])
rbind(cruda = mejor(cruda), logaritmo = mejor(logar))
#&gt;           AICc        BIC
#&gt; cruda     "ARMA(4,0)" "ARMA(2,0)"
#&gt; logaritmo "ARMA(4,0)" "ARMA(2,0)"

# (c) El AR(2) en cada escala: pseudo-periodo, Ljung-Box y normalidad de los residuales
mira &lt;- function(x) {
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  c(phi1 = coef(f)[["ar1"]], phi2 = coef(f)[["ar2"]],
    pseudoperiodo = 2 * pi / Arg(polyroot(c(1, -coef(f)[1:2]))[1]),
    LB12 = Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value,
    Shapiro = shapiro.test(residuals(f))$p.value)
}
round(rbind(cruda = mira(lynx), logaritmo = mira(log(lynx))), 4)
#&gt;             phi1    phi2 pseudoperiodo   LB12 Shapiro
#&gt; cruda     1.1474 -0.5997        8.5311 0.0312  0.0000
#&gt; logaritmo 1.3776 -0.7399        9.7839 0.0132  0.6401</code></pre>
            <p><strong>(a)</strong> La elasticidad es $\hat b = 0.904$, con un intervalo de $0.542$ a $1.266$: excluye el $0$, así que hay que transformar; contiene el $1$, que es el logaritmo, y deja fuera por poco el $0.5$ de la raíz cuadrada. El mínimo de la serie es 39: no hay ceros que impidan el logaritmo, a diferencia de las manchas. El $\lambda$ de Guerrero, $0.152$, queda también cerca de cero. Se toman logaritmos.</p>
            <p><strong>(b)</strong> En las dos escalas el AICc elige el AR(4) y el BIC, el AR(2): el modelo elegido no cambia con la transformación. Cambia el orden de los que vienen detrás: en la serie cruda el segundo por AICc es el ARMA(2,2) y el AR(2) queda a $3.39$ puntos del mejor; en logaritmos el AR(2) pasa a ser el segundo, a $1.96$. Aquí no había un parámetro tapando un problema de escala: el AR(4) se pide con la escala corregida y sin corregir.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El pseudo-periodo del AR(2) pasa de $8.53$ a $9.78$ años. La normalidad de los residuales, que en la serie cruda se rechaza sin duda ($p < 0.0001$ en Shapiro–Wilk), deja de rechazarse en logaritmos ($p = 0.640$). Ljung–Box, en cambio, no mejora, y en el modelo que elige el AICc empeora: el AR(2) da $p = 0.031$ en la serie cruda y $p = 0.013$ en logaritmos; el AR(4) pasa en la serie cruda ($p = 0.064$) y deja de pasar en logaritmos ($p = 0.009$), y en logaritmos ninguno de los once candidatos pasa la prueba. La transformación era necesaria y arregló la normalidad; la autocorrelación que queda en los residuales de la serie transformada no la recoge ningún ARMA de la rejilla. Lo que se puede entregar es un modelo que describe el ciclo y no pasa el diagnóstico, diciéndolo.</p>
          </div>
        </div>
      </div>

  <template id="module-10">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.10 Cierre: redes, resumen y
          evaluación <span class="text-gray-400 font-normal text-2xl">/ Closing: sequence models, summary &amp;
            assessment</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Situar el AR como el punto de partida de los métodos secuenciales del aprendizaje profundo, saber cuándo el modelo pequeño sigue siendo la mejor opción y

      <p>El módulo cierra el capítulo en tres partes: primero, el puente entre el AR y las redes neuronales y la regla
        para elegir el modelo y fijar sus órdenes; después, el resumen; y al final, la evaluación —autoevaluación,
        ejercicios y una práctica de repaso—.</p>

      <h3>El AR como punto de partida</h3>

      <p>Escribe un AR($p$) sin el ruido y verás algo familiar:</p>

      <div class="formula">
        $$\hat y_t = \phi_1 y_{t-1} + \cdots + \phi_p y_{t-p} + c$$
      </div>

      <p><span data-afirma="c3-m10-01">Equivale a una <strong>neurona lineal</strong> con una ventana de $p$ entradas: los $\phi_j$ son los
        pesos y $c$ es el sesgo <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§12.4"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §12.4)</a></cite>.</span> <span data-afirma="c3-m10-02">Los métodos secuenciales modernos pueden leerse como una forma de relajar, uno por uno, los supuestos que hay detrás de esa expresión.</span></p>

      <table style="position:relative;">
        <caption class="sr-only">Del modelo AR a los modelos secuenciales modernos</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">Qué relaja respecto al AR</th>
            <th scope="col">Coste</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>AR($p$)</strong></td>
            <td>—</td>
            <td>Ventana fija, relación lineal</td>
          </tr>
          <tr>
            <td><strong>Red densa con ventana</strong></td>
            <td data-afirma="c3-m10-03">La <strong>linealidad</strong>: capas ocultas y activaciones no lineales <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§12.4"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §12.4)</a></cite></td>
            <td>Muchos más parámetros; sin interpretación directa</td>
          </tr>
          <tr data-afirma="c3-m10-04">
            <td><strong>RNN / LSTM / GRU</strong></td>
            <td>La <strong>ventana fija</strong>: un estado oculto acumula el pasado y la red aprende cuánto
              recordar y cuánto olvidar</td>
            <td>Entrenamiento secuencial y costoso; necesita muchos datos</td>
          </tr>
          <tr data-afirma="c3-m10-05">
            <td><strong>Transformers temporales</strong></td>
            <td>El <strong>decaimiento con la distancia</strong>: la atención puede pesar igual el rezago 1 que el
              rezago 500</td>
            <td>Coste cuadrático en la longitud; aún más datos</td>
          </tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>Un puente concreto.</strong> <span data-afirma="c3-m10-07">El estado oculto de una RNN sin activación no lineal y con una sola
          unidad sigue la misma recursión que un AR(1): $h_t = w\,h_{t-1} + u\,x_t$, con la entrada $u\,x_t$ en el lugar de la innovación $\varepsilon_t$.</span> <span data-afirma="c3-m10-08">La condición para que ese estado no explote
          ($|w| < 1$) es la <strong>misma condición de
            estacionariedad</strong> del Módulo 1, y tiene el mismo precio. La derivada de $h_t$ respecto al estado
          de $k$ pasos atrás es $w^k$: con $|w| < 1$ <strong>se desvanece</strong>, y con $|w| > 1$ explota. En este caso lineal, el gradiente que se desvanece en una RNN y el desvanecimiento de $\phi^k$ que se vio al desarrollar el AR(1) hacia atrás son el mismo fenómeno matemático.</span></p>
      </div>

      <h3>Cuándo el modelo pequeño sigue ganando</h3>

      <div class="definition">
        <h4><i class="fas fa-scale-balanced mr-2" aria-hidden="true"></i>Razones para quedarse con un ARMA</h4>
        <ul style="margin-bottom:0;">
          <li data-afirma="c3-m10-09"><strong>Pocos datos.</strong> El caso de este capítulo tiene $T = 100$. Una LSTM con miles de parámetros
            sobre cien observaciones puede memorizar la muestra; el AR(2) tiene cuatro, contando la media y
            $\sigma^2$.</li>
          <li><strong>Intervalos de pronóstico con una teoría detrás.</strong> <span data-afirma="c3-m10-10">Un ARMA da intervalos que parten de los pesos $\psi$ del Módulo 4, aunque tienden a quedar estrechos <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite>.</span> <span data-afirma="c3-m10-11">Una red no parte de un modelo estocástico bien definido, y sus intervalos exigen simular trayectorias futuras <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§12.4"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §12.4)</a></cite>.</span></li>
          <li><strong>Interpretabilidad con contenido físico.</strong> El $11.22$ del Módulo 9 no es un peso opaco:
            es un <strong>pseudo-periodo en años</strong> que se puede contrastar con la astronomía. Ninguna capa oculta
            entrega eso.</li>
          <li><strong>Referencia obligatoria.</strong> <span data-afirma="c3-m10-12">Aunque vayas a usar una red, el ARMA es, en este curso, el <em>benchmark</em> que hay que batir: un método nuevo se compara con alternativas simples, y si no las supera no merece consideración <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.2"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.2)</a></cite>. Un modelo complejo que no supera a un AR(2) no justifica su complejidad.</span></li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>Uso crítico de los asistentes de IA.</strong> <span data-afirma="c3-m10-14">Un asistente te dará en segundos el código de un
          <code>arima()</code> y una interpretación convincente de la salida. Este capítulo contiene al menos cuatro
          puntos en los que esa interpretación puede estar mal y <strong>tú tienes que verificarlos</strong></span>: (1) el
          <code>intercept</code> de <code>arima()</code> es la media $\hat\mu$, no la constante $c$; (2) sin
          <code>fitdf = p+q</code>, Ljung–Box aprueba modelos insuficientes —aquí el $p$-valor pasaba de $0.046$ a
          $0.100$—; (3) el AICc no compara modelos <span data-afirma="c3-m10-15">con distinto $d$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite> ni en otra escala —con media o sin ella, sí <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>—; (4) un ARMA que gana por AICc
          puede estar parcheando una escala equivocada. La regla del curso: <strong>el asistente propone, tú
            diagnosticas</strong>.</p>
      </div>

      <h3>Elegir el modelo y fijar sus órdenes</h3>

      <p>La tabla de identificación del Módulo 5 dice qué forma tienen la ACF y la PACF de cada familia. Esta nueva
        tabla la completa con lo que vino después, que es donde se decide el capítulo: de dónde sale el número $p$ o
        $q$, y qué hacer cuando la lectura de los correlogramas no lo da.</p>

      <table style="position:relative;">
        <caption class="sr-only">Criterios para elegir entre AR, MA y ARMA y para fijar los órdenes p y q</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">ACF</th>
            <th scope="col">PACF</th>
            <th scope="col">De dónde sale el orden</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong style="white-space:nowrap;">AR($p$)</strong></td>
            <td data-afirma="c3-m10-19">Decae sin cortar: geométrica si las raíces son reales, <strong>en ondas</strong> si son complejas <cite class="cita" data-ref="cryer2008time" data-loc="p. 73"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 73)</a></cite></td>
            <td><strong>Se corta</strong> en $p$. La teórica no es «pequeña» desde $p+1$: vale <strong>cero
              exacto</strong></td>
            <td>$p$ es el rezago tras el cual la PACF entra en $\pm 1.96/\sqrt{T}$ <em>y se queda</em>. <span data-afirma="c3-m10-20">Esa última
              barra además <strong>estima $\phi_p$</strong>, que es lo que la teórica vale (Módulo 2): en el AR(2) del
              Módulo 9 la PACF teórica en $2$ vale $-0.6853$, el coeficiente mismo <cite class="cita" data-ref="cryer2008time" data-loc="pp. 114–115"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, pp. 114–115)</a></cite></span></td>
          </tr>
          <tr>
            <td><strong style="white-space:nowrap;">MA($q$)</strong></td>
            <td><strong>Se corta</strong> en $q$, también con cero exacto desde $q+1$</td>
            <td>Decae sin cortar, a menudo alternando el signo</td>
            <td>$q$ es el rezago tras el cual la ACF entra en la banda y se queda. Aquí no hay lectura del
              coeficiente: <strong>ninguna barra de la PACF estima un $\theta_j$</strong></td>
          </tr>
          <tr>
            <td><strong style="white-space:nowrap;">ARMA($p,q$)</strong></td>
            <td data-afirma="c3-m10-23">Decae; desde el rezago $q+1$, al ritmo de un <span style="white-space:nowrap;">AR($p$)</span> <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m10-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite></td>
            <td data-afirma="c3-m10-24">Decae <cite class="cita" data-ref="cryer2008time" data-loc="p. 116"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 116)</a></cite></td>
            <td><strong>La lectura no los da.</strong> Los correlogramas solo dicen por dónde empezar: se propone una
              rejilla de candidatos vecinos y deciden el AICc o el BIC del Módulo 8</td>
          </tr>
          <tr>
            <td>Ruido blanco</td>
            <td>Dentro de la banda, salvo un $5\,\%$ de rezagos por azar</td>
            <td>Dentro de la banda, con la misma salvedad</td>
            <td>$p = q = 0$, y la conclusión es que <strong>no hay nada que modelar</strong>: es el caso de los
              log-retornos de la TRM</td>
          </tr>
        </tbody>
      </table>

      <div class="warning">
        <p><strong>Las dos primeras filas describen la teoría, no un correlograma.</strong> El corte exacto es una
          propiedad del proceso; lo que se ve es una muestra, y con $T$ moderado las barras posteriores al corte no
          caen a cero sino que revolotean dentro de la banda. Por eso la columna de la derecha dice «entra y
          <em>se queda</em>»: con veinte rezagos se espera que uno se salga por puro azar, y perseguirlo con
          parámetros es el error que este capítulo repite en tres módulos distintos.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-clipboard-check mr-2" aria-hidden="true"></i>Qué confirma el orden elegido</h4>
        <ul style="margin-bottom:0;">
          <li><strong>El coeficiente de mayor orden.</strong> <span data-afirma="c3-m10-25">Si $\hat\phi_p$ o $\hat\theta_q$ no es significativo,
            sobra <cite class="cita" data-ref="cryer2008time" data-loc="p. 186"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 186)</a></cite>.</span> En el AR(2) final de las manchas, $t = 19.31$ y $t = -9.46$; el $\hat\theta_1$ del ARMA(2,1) sobre
            la serie cruda se sostenía con $t = 2.78$, y desapareció al corregir la escala.</li>
          <li><strong>Ljung–Box sobre los residuales</strong>, con <code>fitdf = p + q</code> y evaluado en
            $h > p+q$. Es la prueba que ve lo que el correlograma barra por barra no ve: ninguna de las veinte
            autocorrelaciones residuales del AR(2) crudo salía de $\pm 0.196$ y aun así la prueba lo rechazaba.</li>
          <li><strong>AICc o BIC</strong>, y solo entre modelos ajustados a los <strong>mismos datos</strong>. AICc si
            el objetivo es pronosticar, BIC si es identificar el proceso.</li>
          <li><strong>Parsimonia ante el empate.</strong> Añadir un parámetro nunca empeora la verosimilitud;
            que la mejore no significa que haga falta.</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>Y una advertencia sobre la rejilla.</strong> <span data-afirma="c3-m10-28">Un <span style="white-space:nowrap;">ARMA($2,2$)</span> con $\phi = (1.1,\,-0.28)$ y
          $\theta = (0.1,\,-0.20)$ tiene <strong>exactamente</strong> la misma ACF que el <span style="white-space:nowrap;">ARMA($1,1$)</span> de
          $\phi = 0.7$ y $\theta = 0.5$ —coinciden hasta el último decimal—, porque el factor $(1-0.4B)$ está en los
          dos polinomios y se cancela <cite class="cita" data-ref="hamilton1994time" data-loc="p. 61"><a href="#ref-m10-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 61)</a></cite></span>, como advertían los Módulos 4 y 5. El daño no lo recibe el criterio de información,
          que penaliza al grande, sino la <strong>estimación</strong>: <span data-afirma="c3-m10-91">los cuatro coeficientes del modelo grande no son identificables <cite class="cita" data-ref="cryer2008time" data-loc="p. 187"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 187)</a></cite></span>, sus errores estándar pueden dispararse y es posible que ninguno parezca significativo. Si
          una rejilla devuelve un modelo cuyos coeficientes son todos insignificantes a la vez, el sospechoso número
          uno es un factor común.</p>
      </div>

      <h3>Resumen del capítulo</h3>

      <div class="diagram">
        <ol>
          <li>El <strong>operador de rezago</strong> $B$ convierte recursiones en polinomios. Un proceso es
            estacionario si las raíces de $\phi(B)$ caen <strong>fuera</strong> del círculo unitario, e invertible si
            lo hacen las de $\theta(B)$.</li>
          <li>Un <strong>AR($p$)</strong> tiene <strong>PACF que se corta</strong> en $p$ y ACF que decae. Un
            <strong>MA($q$)</strong>, al revés: <strong>ACF que se corta</strong> en $q$. Un <strong>ARMA</strong>
            decae en las dos, y por eso los correlogramas no bastan para fijar sus órdenes.</li>
          <li>Un AR(2) con $\phi_1^2 + 4\phi_2 < 0$ tiene raíces complejas y produce un <strong>pseudo-ciclo</strong>
            de pseudo-periodo $2\pi/\arccos\!\big(\phi_1/(2\sqrt{-\phi_2})\big)$.</li>
          <li>Un ARMA estacionario se puede escribir como MA($\infty$) (pesos $\psi$, respuesta al impulso), y uno
            invertible como AR($\infty$) (pesos $\pi$). Los $\psi$ darán su forma de abanico a los intervalos de
            pronóstico a partir del Capítulo 4.</li>
          <li>La estimación se hace por <strong>Yule–Walker</strong>, <strong>CSS</strong> o <strong>máxima
              verosimilitud</strong>. No dan lo mismo: en las manchas solares, YW y ML se separaron $1.26$ y $1.10$
            errores estándar. CSS y ML coincidieron.</li>
          <li>Se elige con <strong>AICc</strong> o <strong>BIC</strong> —solo entre modelos ajustados a los mismos
            datos— y se valida con <strong>Ljung–Box sobre los residuales</strong>, siempre con
            <code>fitdf = p + q</code>.</li>
          <li>Un criterio de información no distingue "falta dinámica" de "sobra un problema de escala". En las
            manchas solares, el término MA que ganaba sobre la serie cruda <strong>desapareció</strong> al pasar a la
            raíz cuadrada, y el pseudo-periodo se acercó a la estimación habitual del ciclo de las manchas.</li>
          <li>A veces la respuesta correcta es que <strong>no hay nada que modelar</strong>: los log-retornos
            mensuales de la TRM son indistinguibles del ruido blanco.</li>
        </ol>
      </div>
