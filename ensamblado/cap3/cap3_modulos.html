  <!-- MÓDULO 1 · Operador de rezago y polinomios característicos    -->
  <!-- ============================================================ -->
  <template id="module-1">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 1</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.1 El operador de rezago
          <span class="text-gray-400 font-normal text-2xl">/ The lag operator</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Escribir un modelo de series de tiempo como un polinomio
              y leer en sus <strong>raíces</strong> si el proceso es estacionario. Es la notación que sostiene todo el
              capítulo.</p>
          </div>
        </div>
      </div>

      <p>En el Capítulo 2 apareció, casi de contrabando, el operador $B$ para escribir la diferencia como
        $\nabla y_t = (1-B)y_t$. Ese atajo de notación es en realidad la herramienta central del análisis clásico de
        series de tiempo, y conviene presentarla en serio antes de construir modelos con ella.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: operador de rezago (<em>lag operator</em>)</h4>
        <p>El <strong>operador de rezago</strong> $B$ retrasa una serie un periodo:</p>
        $$B\, y_t = y_{t-1}$$
        <p style="margin-bottom:0;">Aplicado $k$ veces, retrasa $k$ periodos: $B^k y_t = y_{t-k}$. Por convenio
          $B^0 = 1$ (el operador identidad) y $B$ deja fijas las constantes: $Bc = c$.</p>
      </div>

      <p>Lo interesante es que $B$ <strong>se comporta como un número</strong> en las operaciones algebraicas: se puede
        sumar, multiplicar, elevar a potencias y factorizar. Eso convierte manipulaciones de recursiones —que son
        engorrosas— en manipulaciones de polinomios, que son rutina.</p>

      <div class="note">
        <p><strong>Un ejemplo de lo que compra la notación.</strong> La diferencia estacional de orden $m$ aplicada
          después de una diferencia regular es $\nabla_m \nabla y_t$. Con polinomios, eso es
          $(1-B^m)(1-B)y_t$, y basta multiplicar para saber exactamente qué combinación de rezagos interviene:</p>
        $$(1-B^m)(1-B) = 1 - B - B^m + B^{m+1}
          \;\Longrightarrow\; y_t - y_{t-1} - y_{t-m} + y_{t-m-1}$$
        <p style="margin-bottom:0;">Ese es exactamente el preprocesamiento del modelo <em>airline</em> que verás en el
          Capítulo 5, obtenido sin escribir una sola recursión.</p>
      </div>

      <h3>Polinomios característicos</h3>

      <p>Todos los modelos del capítulo se escriben con dos polinomios en $B$: uno del lado de la serie y otro del lado
        del ruido.</p>

      <div class="formula">
        <p>Polinomio <strong>autorregresivo</strong> de orden $p$ y polinomio de <strong>medias móviles</strong> de
          orden $q$:</p>
        $$\phi(B) = 1 - \phi_1 B - \phi_2 B^2 - \cdots - \phi_p B^p$$
        $$\theta(B) = 1 + \theta_1 B + \theta_2 B^2 + \cdots + \theta_q B^q$$
      </div>

      <div class="warning">
        <p><strong>Ojo con los signos.</strong> Los coeficientes $\phi$ entran <strong>restando</strong> y los $\theta$
          <strong>sumando</strong>. No es un capricho: así, al pasar todo al mismo lado, un AR queda
          $\phi(B)y_t = \varepsilon_t$ y un MA queda $y_t = \theta(B)\varepsilon_t$, con los signos "naturales" en la
          forma en que se escribe cada modelo. La consecuencia práctica es que <strong>R y Python usan este mismo
            convenio</strong>, pero algunos textos —y algún paquete— invierten el signo de $\theta$. Si un $\theta$
          estimado te sale con el signo contrario al que esperabas, comprueba el convenio antes de dudar de tus datos.</p>
      </div>

      <h3>Las raíces son la respuesta</h3>

      <p>La pregunta que resolverá el polinomio $\phi(B)$ es si el proceso es estacionario. Para responderla se trata
        $B$ como una variable compleja y se buscan las raíces de $\phi(B)=0$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de estacionariedad</h4>
        <p style="margin-bottom:0;">Un proceso autorregresivo es <strong>estacionario</strong> si todas las raíces de
          $\phi(B) = 0$ están <strong>fuera</strong> del círculo unitario, es decir, si $|B_i| > 1$ para toda raíz
          $B_i$ (incluyendo el módulo si la raíz es compleja).</p>
      </div>

      <p>La palabra <em>fuera</em> sorprende la primera vez. La intuición es que el polinomio está escrito en $B$, no
        en $1/B$: para el AR(1) $y_t = \phi y_{t-1} + \varepsilon_t$ el polinomio es $1 - \phi B$, cuya única raíz es
        $B = 1/\phi$. Que la raíz esté fuera del círculo, $|1/\phi| > 1$, es lo mismo que la condición conocida
        $|\phi| < 1$.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ar1-estacionario">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ar1-estacionario" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte del AR(1) y sustituye $y_{t-1}$ por su propia definición, una y otra vez:</p>
              $$y_t = \phi y_{t-1} + \varepsilon_t = \phi(\phi y_{t-2} + \varepsilon_{t-1}) + \varepsilon_t
                = \varepsilon_t + \phi\varepsilon_{t-1} + \phi^2 y_{t-2}$$
            </li>
            <li>
              <p>Tras $k$ sustituciones queda una suma de choques más un resto que arrastra el pasado lejano:</p>
              $$y_t = \sum_{j=0}^{k-1}\phi^j \varepsilon_{t-j} + \phi^{k} y_{t-k}$$
            </li>
            <li>
              <p>Aquí está todo el asunto. Si $|\phi| < 1$, entonces $\phi^k \to 0$ y el resto <strong>se
                  desvanece</strong>: el pasado remoto deja de influir y queda una suma convergente</p>
              $$y_t = \sum_{j=0}^{\infty}\phi^j \varepsilon_{t-j}$$
              <p>Si $|\phi| \ge 1$, el resto no desaparece: el proceso no olvida y no existe una solución estacionaria.</p>
            </li>
            <li>
              <p>La varianza de esa suma es una serie geométrica, y solo converge bajo la misma condición:</p>
              $$\operatorname{Var}(y_t) = \sigma^2\sum_{j=0}^{\infty}\phi^{2j} = \frac{\sigma^2}{1-\phi^2},
                \qquad |\phi| < 1$$
            </li>
          </ol>
          <p class="derivacion-resultado">La condición $|\phi| < 1$ es exactamente $|1/\phi| > 1$: la raíz de
            $1 - \phi B$ está fuera del círculo unitario. Y de paso apareció la representación
            $y_t = \sum_j \phi^j \varepsilon_{t-j}$, que es el <strong>MA($\infty$)</strong> del Módulo 4.</p>
        </div>
      </div>

      <div class="note">
        <p><strong>Enlace con el Capítulo 2.</strong> Cuando una raíz cae <em>exactamente</em> sobre el círculo
          ($|B| = 1$, es decir $\phi = 1$), el proceso es la <strong>caminata aleatoria</strong>: la ACF que no decaía
          y el KPSS que rechazaba. De ahí el nombre <em>raíz unitaria</em>. Diferenciar es justamente dividir por el
          factor $(1-B)$ que produce esa raíz.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Raíces del polinomio característico">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Raices de phi(B) = 1 - phi1*B - phi2*B^2
# polyroot() recibe los coeficientes en orden ASCENDENTE de potencia
phi &lt;- c(1.4, -0.75)
raices &lt;- polyroot(c(1, -phi))
raices
#&gt; [1] 0.9333333+0.6798693i 0.9333333-0.6798693i   (complejas conjugadas)

Mod(raices)          # modulo: debe ser &gt; 1 para que sea estacionario
#&gt; [1] 1.154701 1.154701
all(Mod(raices) &gt; 1) # veredicto
#&gt; [1] TRUE

# Un caso NO estacionario: phi = 1 es la caminata aleatoria
Mod(polyroot(c(1, -1)))
#&gt; [1] 1            (justo sobre el circulo: raiz unitaria)</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np

# numpy.roots recibe los coeficientes en orden DESCENDENTE de potencia,
# justo al reves que polyroot() de R: hay que invertir el vector.
phi = np.array([1.4, -0.75])
coef = np.r_[1.0, -phi]              # [1, -phi1, -phi2] en orden ascendente
raices = np.roots(coef[::-1])        # se invierte para numpy

print(raices)
print(np.abs(raices))                # modulo
print(bool(np.all(np.abs(raices) > 1)))

# statsmodels lo hace directamente y con el convenio correcto
from statsmodels.tsa.arima_process import ArmaProcess
proceso = ArmaProcess(np.r_[1, -phi], np.r_[1])
print(proceso.arroots, proceso.isstationary)</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>El orden de los coeficientes cambia entre lenguajes.</strong> <code>polyroot()</code> de R los toma
          en orden <strong>ascendente</strong> de potencia y <code>np.roots()</code> de NumPy en orden
          <strong>descendente</strong>. Es un error silencioso: no falla, simplemente devuelve las raíces de otro
          polinomio. Si comparas resultados entre R y Python y no coinciden, empieza por aquí.</p>
      </div>
    </div>
  </template>

  <template id="module-2">
    <div class="animate-fade-in">

        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.2 Procesos autorregresivos
          <span class="text-gray-400 font-normal text-2xl">/ Autoregressive processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer un AR($p$) por su firma: <strong>PACF que se
                corta</strong> en el rezago $p$ y ACF que decae. Y saber cuándo es estacionario.</p>
          </div>
        </div>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso AR($p$)</h4>
        <p>Un proceso <strong>autorregresivo de orden $p$</strong> explica el valor actual como una combinación lineal
          de sus $p$ valores anteriores más un choque de ruido blanco:</p>
        $$y_t = c + \phi_1 y_{t-1} + \phi_2 y_{t-2} + \cdots + \phi_p y_{t-p} + \varepsilon_t,
          \qquad \varepsilon_t \sim \text{RB}(0,\sigma^2)$$
        <p style="margin-bottom:0;">En forma compacta, $\phi(B)\, y_t = c + \varepsilon_t$.</p>
      </div>

      <p>El nombre lo dice todo: es una <strong>regresión de la serie sobre sí misma</strong>. Si sustituyes $y_{t-1}$
        por $x_1$, $y_{t-2}$ por $x_2$ y así, tienes una regresión múltiple corriente. La diferencia —y no es
        menor— es que los regresores no son fijos: son la propia variable desplazada, y por eso los errores estándar
        y la teoría asintótica no son las de la regresión clásica.</p>

      <div class="note">
        <p><strong>Sobre la constante.</strong> $c$ no es la media del proceso. Tomando esperanzas en la definición y
          usando que $E[y_t] = \mu$ para todo $t$ (estacionariedad), se obtiene
          $\mu = c/(1 - \phi_1 - \cdots - \phi_p)$. Por eso <code>arima()</code> de R reporta una columna
          <code>intercept</code> que en realidad es $\hat\mu$, <strong>no</strong> $\hat c$. Es una de las confusiones
          más frecuentes al leer una salida.</p>
      </div>

      <h3>La firma del AR: la PACF se corta</h3>

      <p>Recuerda del Capítulo 2 que la PACF mide la correlación <em>directa</em> entre $y_t$ y $y_{t-k}$, descontando
        los rezagos intermedios. En un AR($p$), toda la dependencia directa está en los $p$ primeros rezagos, por
        construcción. Más allá de $p$ no queda nada que descontar.</p>

      <div class="formula">
        <p style="margin-bottom:0;">Para un proceso AR($p$): $\;\phi_{kk} = 0\;$ para todo $k > p$, <strong>exactamente
            cero</strong>, no aproximadamente. Y la ACF decae hacia cero sin cortarse nunca.</p>
      </div>

      <div class="simulador" data-simulador="panel-ar-teorico">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Las cuatro firmas del AR</h4>
        <p class="simulador-intro">ACF y PACF <strong>teóricas</strong> —calculadas con <code>ARMAacf()</code>, no
          simuladas— de cuatro procesos autorregresivos. Fíjate en que la PACF cae a cero de golpe en el rezago $p$
          y se queda ahí, mientras la ACF nunca termina de cortarse.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">ACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación teórica del proceso seleccionado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación parcial teórica del proceso seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <p>Los cuatro casos merecen un comentario. Con $\phi = 0.8$ la ACF decae despacio y siempre positiva
        ($0.800,\,0.640,\,0.512,\ldots$: son las potencias de $0.8$). Con $\phi = -0.7$ decae
        <strong>alternando de signo</strong> ($-0.700,\,0.490,\,-0.343,\ldots$), que es la firma de un proceso que
        rebota. El AR(2) con raíces reales decae de forma monótona. Y el AR(2) con
        $\phi = (1.4,\,-0.75)$ produce algo nuevo: una ACF que <strong>oscila</strong>
        ($0.800,\,0.370,\,-0.082,\,-0.392$), cruzando el cero y volviendo. Esa oscilación es un
        <em>pseudo-ciclo</em>, y es el fenómeno que hará interesante el caso real del Módulo 9.</p>

      <h3>El triángulo de estacionariedad del AR(2)</h3>

      <p>Para $p = 1$ la condición es simplemente $|\phi_1| < 1$. Para $p = 2$, aplicar la condición de las raíces se
        traduce en tres desigualdades que recortan un triángulo en el plano $(\phi_1, \phi_2)$.</p>

      <div class="formula">
        <p>Un AR(2) es estacionario si y solo si el par $(\phi_1,\phi_2)$ cumple las tres condiciones:</p>
        $$\phi_1 + \phi_2 < 1, \qquad \phi_2 - \phi_1 < 1, \qquad -1 < \phi_2 < 1$$
      </div>

      <div class="simulador" data-simulador="triangulo-ar2">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> El triángulo de estacionariedad</h4>
        <p class="simulador-intro">Mueve $\phi_1$ y $\phi_2$ y observa dónde cae el punto. Dentro del triángulo el
          proceso es estacionario; bajo la parábola $\phi_1^2 + 4\phi_2 = 0$ las raíces son <strong>complejas</strong> y
          la serie desarrolla un pseudo-ciclo cuyo periodo aparece en la lectura. Prueba
          $\phi_1 = 1.40$ y $\phi_2 = -0.69$, que es —redondeado al paso del deslizador— el modelo de las manchas
          solares del Módulo 9: sale un ciclo de unos 11 periodos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Región de estacionariedad</p>
        <div class="grafico-wrapper" style="height:280px;">
          <canvas aria-label="Triángulo de estacionariedad del AR(2) con el punto (phi1, phi2) marcado" role="img"></canvas>

        <div class="grafico-wrapper" style="height:190px;">

        </div>
        <div class="simulador-lectura"></div>

      <div class="note">
        <p><strong>Raíces complejas y ciclos.</strong> Cuando $\phi_1^2 + 4\phi_2 < 0$ las raíces son complejas
          conjugadas y la ACF oscila con un periodo medio de</p>
        $$\text{periodo} = \frac{2\pi}{\arccos\!\left(\dfrac{\phi_1}{2\sqrt{-\phi_2}}\right)}$$
        <p style="margin-bottom:0;">Es un ciclo <em>estocástico</em>: ni la longitud ni la amplitud se repiten
          exactamente, a diferencia de la estacionalidad determinista del Capítulo 1. Por eso un ciclo económico se
          modela así y una estacionalidad mensual no.</p>
      </div>

      <h3>Las ecuaciones de Yule–Walker</h3>

      <p>¿De dónde sale la ACF teórica que dibuja el simulador? De un sistema de ecuaciones que relaciona los
        $\phi$ con las autocorrelaciones, y que además será nuestro primer método de estimación en el Módulo 7.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-yule-walker">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-yule-walker" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Escribe el AR($p$) centrado (sin pérdida de generalidad, con $\mu = 0$) y multiplica los dos lados por
                $y_{t-k}$, con $k \ge 1$:</p>
              $$y_t\, y_{t-k} = \phi_1 y_{t-1}y_{t-k} + \cdots + \phi_p y_{t-p}y_{t-k} + \varepsilon_t y_{t-k}$$
            </li>
            <li>
              <p>Toma esperanzas. Cada término $E[y_{t-i}y_{t-k}]$ es una autocovarianza $\gamma_{k-i}$. El término del
                ruido <strong>se anula</strong>: $\varepsilon_t$ es independiente de todo lo anterior a $t$, y
                $k \ge 1$ garantiza que $y_{t-k}$ pertenece al pasado.</p>
              $$\gamma_k = \phi_1\gamma_{k-1} + \phi_2\gamma_{k-2} + \cdots + \phi_p\gamma_{k-p}$$
            </li>
            <li>
              <p>Divide todo entre $\gamma_0$. Como $\rho_k = \gamma_k/\gamma_0$, la misma recursión vale para las
                autocorrelaciones — y esta es la forma en que se usa:</p>
              $$\rho_k = \phi_1\rho_{k-1} + \phi_2\rho_{k-2} + \cdots + \phi_p\rho_{k-p}, \qquad k \ge 1$$
            </li>
            <li>
              <p>Escribiendo esa relación para $k = 1,\ldots,p$ y usando $\rho_{-k} = \rho_k$ queda un sistema lineal
                de $p$ ecuaciones con $p$ incógnitas. Para el AR(2):</p>
              $$\rho_1 = \phi_1 + \phi_2\rho_1, \qquad \rho_2 = \phi_1\rho_1 + \phi_2$$
              <p>que se resuelve en</p>
              $$\rho_1 = \frac{\phi_1}{1-\phi_2}, \qquad \rho_2 = \phi_2 + \frac{\phi_1^2}{1-\phi_2}$$
            </li>
          </ol>
          <p class="derivacion-resultado">El sistema se puede leer en las dos direcciones. De los $\phi$ a las $\rho$
            da la <strong>ACF teórica</strong> (lo que dibuja el simulador). De las $\rho$ muestrales a los $\phi$ da el
            <strong>estimador de Yule–Walker</strong> del Módulo 7. Compruébalo con el AR(2) de
            $\phi = (0.5,\,0.3)$: $\rho_1 = 0.5/0.7 = 0.714$ y $\rho_2 = 0.3 + 0.25/0.7 = 0.657$, exactamente las
            cifras del simulador.</p>
        </div>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="ACF y PACF teóricas de un AR">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># ACF y PACF TEORICAS (exactas, no simuladas)
phi &lt;- c(0.5, 0.3)

round(ARMAacf(ar = phi, lag.max = 5)[-1], 4)          # se quita el rezago 0
#&gt; [1] 0.7143 0.6571 0.5429 0.4686 0.3971

round(ARMAacf(ar = phi, lag.max = 5, pacf = TRUE), 4) # PACF
#&gt; [1] 0.7143 0.3000 0.0000 0.0000 0.0000
#   la PACF se corta EXACTAMENTE en el rezago p = 2

# Comprobacion de la formula de Yule-Walker para el AR(2)
rho1 &lt;- phi[1] / (1 - phi[2])
rho2 &lt;- phi[2] + phi[1]^2 / (1 - phi[2])
round(c(rho1, rho2), 4)
#&gt; [1] 0.7143 0.6571

# Estacionariedad
all(Mod(polyroot(c(1, -phi))) &gt; 1)
#&gt; [1] TRUE</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np

phi = np.array([0.5, 0.3])
ar = np.r_[1, -phi]      # convenio de statsmodels: 1 - phi1 B - phi2 B^2
ma = np.r_[1]

print(np.round(arma_acf(ar, ma, lags=6)[1:], 4))
# [0.7143 0.6571 0.5429 0.4686 0.3971]

print(np.round(arma_pacf(ar, ma, lags=6)[1:], 4))
# [ 0.7143  0.3    -0.      0.     -0.    ]
#   los "-0." son ceros con signo negativo del punto flotante: la PACF
#   se corta igual de exactamente que en R

proceso = ArmaProcess(ar, ma)
print(proceso.isstationary)   # True</code></pre>

  <!-- MÓDULO 3 · Procesos MA(q)                                     -->
  <!-- ============================================================ -->
  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 3</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.3 Procesos de medias móviles
          <span class="text-gray-400 font-normal text-2xl">/ Moving average processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer un MA($q$) por su firma —<strong>ACF que se
                corta</strong> en el rezago $q$— y entender qué es la invertibilidad y por qué el software la impone.</p>
          </div>
        </div>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso MA($q$)</h4>
        <p>Un proceso de <strong>medias móviles de orden $q$</strong> expresa el valor actual como una combinación
          lineal del choque presente y de los $q$ choques anteriores:</p>
        $$y_t = \mu + \varepsilon_t + \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}$$
        <p style="margin-bottom:0;">En forma compacta, $y_t = \mu + \theta(B)\,\varepsilon_t$.</p>
      </div>

      <div class="warning">
        <p><strong>El nombre engaña.</strong> Un proceso de "medias móviles" <em>no</em> es la media móvil de
          suavizamiento del Capítulo 1. Aquella promediaba <strong>valores observados</strong> de la serie; esta
          combina <strong>choques no observados</strong> del ruido, y los pesos $\theta_j$ ni suman uno ni tienen por
          qué ser positivos. Coinciden solo en el nombre, que es un accidente histórico.</p>
      </div>

      <h3>Un MA siempre es estacionario</h3>

      <p>Aquí no hay condición que verificar. Un MA($q$) es una suma <strong>finita</strong> de variables de ruido
        blanco con pesos fijos, así que su media y su varianza no dependen de $t$ y su autocovarianza solo depende del
        rezago. Es estacionario para cualquier valor de los $\theta$.</p>

      <div class="formula">
        <p>Varianza y autocorrelaciones de un MA($q$):</p>
        $$\gamma_0 = \sigma^2\left(1 + \sum_{j=1}^{q}\theta_j^2\right), \qquad
          \rho_k = \frac{\sum_{j=0}^{q-k}\theta_j\theta_{j+k}}{1+\sum_{j=1}^{q}\theta_j^2}
          \;\; (k \le q), \qquad \rho_k = 0 \;\; (k > q)$$
        <p style="margin-bottom:0;">con el convenio $\theta_0 = 1$.</p>
      </div>

      <p>Ese $\rho_k = 0$ para $k > q$ es <strong>exacto</strong> y es la firma que buscamos: si dos observaciones están
        separadas por más de $q$ periodos, no comparten ni un solo choque, luego su covarianza es cero. El MA tiene
        <em>memoria finita</em>, literalmente de $q$ periodos.</p>

      <div class="simulador" data-simulador="panel-ma-teorico">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Las firmas del MA</h4>
        <p class="simulador-intro">ACF y PACF teóricas de tres procesos de medias móviles. Ahora los papeles están
          <strong>intercambiados</strong> respecto al AR: es la <strong>ACF</strong> la que se corta en seco tras el
          rezago $q$, y la PACF la que decae sin fin.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">ACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación teórica del proceso de medias móviles seleccionado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación parcial teórica del proceso de medias móviles seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <h3>Invertibilidad: por qué $\theta$ y $1/\theta$ son el mismo modelo</h3>

      <p>Hay un problema serio escondido en el MA, y conviene verlo con el caso más simple. Para un MA(1),
        $\rho_1 = \theta/(1+\theta^2)$. Pon $\theta = 0.5$ y $\theta = 2$:</p>

      <div class="formula">
        $$\rho_1(0.5) = \frac{0.5}{1.25} = 0.4, \qquad \rho_1(2) = \frac{2}{5} = 0.4$$
      </div>

      <p>Los dos procesos tienen <strong>exactamente la misma ACF</strong>, y por tanto la misma estructura de
        autocorrelación observable. Ningún dato podría distinguirlos. Si no se impone una regla, el modelo no está
        identificado.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ma1-invertible">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ma1-invertible" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Calcula la varianza del MA(1) $y_t = \varepsilon_t + \theta\varepsilon_{t-1}$. Los dos choques son
                independientes, así que las varianzas se suman:</p>
              $$\gamma_0 = \operatorname{Var}(\varepsilon_t) + \theta^2\operatorname{Var}(\varepsilon_{t-1})
                = \sigma^2(1+\theta^2)$$
            </li>
            <li>
              <p>La autocovarianza de orden 1: $y_t$ e $y_{t-1}$ comparten un único choque, $\varepsilon_{t-1}$.</p>
              $$\gamma_1 = E[(\varepsilon_t + \theta\varepsilon_{t-1})(\varepsilon_{t-1} + \theta\varepsilon_{t-2})]
                = \theta\sigma^2$$
              <p>Para $k \ge 2$ no comparten ninguno, luego $\gamma_k = 0$.</p>
            </li>
            <li>
              <p>Por tanto</p>
              $$\rho_1 = \frac{\theta}{1+\theta^2}$$
              <p>y esta función es <strong>invariante bajo $\theta \mapsto 1/\theta$</strong>: sustituyendo,
                $\dfrac{1/\theta}{1+1/\theta^2} = \dfrac{\theta}{\theta^2+1}$, que es lo mismo.</p>
            </li>
            <li>
              <p>De paso, $\rho_1$ tiene un máximo. Derivando, se alcanza en $\theta = 1$, donde $\rho_1$ vale
                exactamente $1/2$; de ahí la cota</p>
              $$|\rho_1| \le \frac{1}{2}$$
              <p>Un MA(1) <strong>no puede</strong> producir una autocorrelación de primer orden mayor que $0.5$ en
                valor absoluto.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">De los dos valores $\theta$ y $1/\theta$ se elige por convenio el que cumple
            $|\theta| < 1$: el <strong>invertible</strong>. Es el que permite escribir el proceso como un AR($\infty$)
            convergente (Módulo 4) y, en consecuencia, el que permite reconstruir los choques a partir de lo observado.</p>
        </div>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de invertibilidad</h4>
        <p style="margin-bottom:0;">Un MA($q$) es <strong>invertible</strong> si todas las raíces de $\theta(B) = 0$
          están fuera del círculo unitario. Es la misma condición que la estacionariedad del AR, aplicada al otro
          polinomio.</p>
      </div>

      <div class="note">
        <p><strong>El límite $|\rho_1| \le 0.5$ es una herramienta de diagnóstico.</strong> Si en un correlograma
          muestral ves $r_1 = 0.8$ y quisieras ajustar un MA(1), no hay ningún $\theta$ que lo produzca. Esa
          autocorrelación pide un AR, o al menos un componente autorregresivo. Sirve para descartar modelos sin
          ajustar nada.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="MA e invertibilidad">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>

  <!-- MÓDULO 4 · Dualidad AR ↔ MA                                   -->
  <!-- ============================================================ -->
  <template id="module-4">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 4</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.4 Dualidad AR ↔ MA
          <span class="text-gray-400 font-normal text-2xl">/ AR–MA duality</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Ver que AR y MA son dos formas de escribir lo mismo, y
              manejar los pesos $\psi$ y $\pi$, que reaparecerán en los intervalos de pronóstico del Capítulo 6.</p>
          </div>
        </div>
      </div>

      <p>En el Módulo 1, al desarrollar el AR(1) hacia atrás, apareció sin buscarlo la expresión
        $y_t = \sum_j \phi^j \varepsilon_{t-j}$: un AR(1) escrito como un MA de orden infinito. No es una casualidad
        del caso particular, sino un hecho general y una de las ideas más útiles del capítulo.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Las dos representaciones</h4>
        <p>Todo proceso ARMA estacionario e invertible admite dos escrituras equivalentes:</p>
        $$\underbrace{y_t = \sum_{j=0}^{\infty}\psi_j\,\varepsilon_{t-j}}_{\text{MA}(\infty)\;:\;\psi(B)=\theta(B)/\phi(B)}
          \qquad\qquad
          \underbrace{\varepsilon_t = \sum_{j=0}^{\infty}\pi_j\,y_{t-j}}_{\text{AR}(\infty)\;:\;\pi(B)=\phi(B)/\theta(B)}$$
        <p style="margin-bottom:0;">con $\psi_0 = \pi_0 = 1$.</p>
      </div>

      <p>Cada una responde a una pregunta distinta. Los <strong>pesos $\psi$</strong> dicen cuánto de un choque
        ocurrido hace $j$ periodos sigue presente hoy: son la <em>función de respuesta al impulso</em>. Los
        <strong>pesos $\pi$</strong> dicen cuánto pesa la observación de hace $j$ periodos al reconstruir el choque
        actual: son la base de la predicción.</p>

      <div class="simulador" data-simulador="dualidad-psi-pi">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> Pesos $\psi$ y $\pi$ de un ARMA(1,1)</h4>
        <p class="simulador-intro">Mueve $\phi$ y $\theta$ y observa las dos representaciones. Con $\phi = 0.8$ y
          $\theta = 0$ tienes el AR(1): los $\psi$ son las potencias $0.8^j$ y solo hay <strong>un</strong> peso $\pi$.
          Lleva ahora $\theta$ más allá de $1$ —el MA deja de ser invertible— y mira lo que les pasa a los $\pi$.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Pesos $\psi_j$ — representación MA($\infty$)</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Pesos psi de la representación de medias móviles infinita" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Pesos $\pi_j$ — representación AR($\infty$)</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Pesos pi de la representación autorregresiva infinita" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="warning">
        <p><strong>Lo que acabas de ver con $|\theta| > 1$.</strong> Los pesos $\pi$ crecen sin límite en vez de
          desvanecerse. Eso significa que reconstruir el choque de hoy exigiría dar un peso cada vez
          <em>mayor</em> a observaciones cada vez <strong>más antiguas</strong>, lo cual es absurdo. Esa es la
          traducción operativa de la no invertibilidad, y la razón de fondo por la que el software siempre te devuelve
          la raíz invertible.</p>
      </div>

      <h3>Cómo se calculan los pesos</h3>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-pesos-psi">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-pesos-psi" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte de la identidad que define los $\psi$ y quítate la división multiplicando por $\phi(B)$:</p>
              $$\psi(B) = \frac{\theta(B)}{\phi(B)} \;\Longleftrightarrow\; \phi(B)\,\psi(B) = \theta(B)$$
            </li>
            <li>
              <p>Desarrolla el producto y agrupa por potencias de $B$. El coeficiente de $B^j$ del lado izquierdo es
                $\psi_j - \phi_1\psi_{j-1} - \cdots - \phi_p\psi_{j-p}$, y del lado derecho es $\theta_j$
                (o cero si $j > q$).</p>
            </li>
            <li>
              <p>Igualando coeficiente a coeficiente sale una <strong>recursión</strong>, que es lo que implementan el
                simulador de esta página y el precálculo en R:</p>
              $$\psi_j = \theta_j + \sum_{i=1}^{p}\phi_i\,\psi_{j-i}, \qquad \psi_0 = 1,\;\; \theta_j = 0 \text{ si } j>q$$
            </li>
            <li>
              <p>Para los $\pi$ el razonamiento es idéntico sobre $\theta(B)\pi(B) = \phi(B)$, e intercambia los
                papeles:</p>
              $$\pi_j = -\phi_j - \sum_{i=1}^{q}\theta_i\,\pi_{j-i}, \qquad \pi_0 = 1,\;\; \phi_j = 0 \text{ si } j>p$$
            </li>
            <li>
              <p>Con los $\psi$ se obtiene además la autocovarianza sin resolver ningún sistema, porque los
                $\varepsilon$ son incorrelados:</p>
              $$\gamma_k = \sigma^2\sum_{j=0}^{\infty}\psi_j\,\psi_{j+k}$$
            </li>
          </ol>
          <p class="derivacion-resultado">Esta última fórmula es la que usa el <strong>laboratorio del Módulo 5</strong>
            para dibujar la ACF teórica en el navegador: trunca la serie en 2000 términos y divide entre $\gamma_0$.
            Contrastada contra <code>ARMAacf()</code> de R sobre los ocho procesos del capítulo, el error máximo es de
            $6.7\times10^{-16}$, o sea, el redondeo de la aritmética de punto flotante.</p>
        </div>
      </div>

      <div class="note">
        <p><strong>Por qué esto reaparece en el Capítulo 6.</strong> La varianza del error de pronóstico a $h$ pasos
          de un ARMA es</p>
        $$\operatorname{Var}(e_{T+h}) = \sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
        <p style="margin-bottom:0;">Los pesos $\psi$ son, literalmente, lo que da su forma de abanico a las bandas de
          un pronóstico. Cuanto más lentamente decaen, más rápido se abre la incertidumbre.</p>
      </div>

      <div class="code-tabs">

          </div>

            <p><code>acf(y, lag.max = 20)</code>; en Python, <code>plot_acf(y)</code>. La banda $\pm 1.96/\sqrt{n}$ marca qué es ruido.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso ARMA($p,q$)</h4>
        <p>Combina las dos partes anteriores en un solo modelo:</p>
        $$y_t = c + \phi_1 y_{t-1} + \cdots + \phi_p y_{t-p}
          + \varepsilon_t + \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}$$
        <p style="margin-bottom:0;">o, en forma compacta, $\;\phi(B)\,y_t = c + \theta(B)\,\varepsilon_t$. Es
          <strong>estacionario</strong> si las raíces de $\phi(B)$ están fuera del círculo unitario, e
          <strong>invertible</strong> si lo están las de $\theta(B)$: cada polinomio responde por lo suyo.</p>
      </div>

      <p>¿Para qué mezclarlos? Por <strong>parsimonia</strong>. Un proceso que necesitaría un AR(8) para describirse
        bien puede quedar capturado por un ARMA(1,1) con dos parámetros. Menos parámetros significa estimaciones más
        precisas y pronósticos más estables, que es de lo que se trata.</p>

      <h3>La tabla de identificación</h3>

      <table>
        <caption class="sr-only">Reglas de identificación según los patrones de ACF y PACF</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">ACF</th>
            <th scope="col">PACF</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>AR($p$)</strong></td>
            <td>Decae (exponencial u oscilante)</td>
            <td><strong>Se corta</strong> tras el rezago $p$</td>
          </tr>
          <tr>
            <td><strong>MA($q$)</strong></td>
            <td><strong>Se corta</strong> tras el rezago $q$</td>
            <td>Decae (exponencial u oscilante)</td>
          </tr>
          <tr>
            <td><strong>ARMA($p,q$)</strong></td>
            <td>Decae tras el rezago $q$</td>
            <td>Decae tras el rezago $p$</td>
          </tr>
          <tr>
            <td>Ruido blanco</td>
            <td>Todo dentro de la banda</td>
            <td>Todo dentro de la banda</td>
          </tr>
        </tbody>
      </table>

      <div class="warning">
        <p><strong>La tercera fila es la débil.</strong> "Las dos decaen" no dice cuáles son $p$ y $q$: ni el
          correlograma ni el correlograma parcial identifican los órdenes de un ARMA mixto. En la práctica se propone
          un modelo pequeño, se diagnostica y se compara por criterios de información (Módulo 8). La tabla sirve para
          <strong>arrancar</strong>, no para decidir.</p>
      </div>

      <div class="simulador" data-simulador="laboratorio-arma">
        <h4><i class="fas fa-flask" aria-hidden="true"></i> Laboratorio ARMA</h4>
        <p class="simulador-intro">Mueve los cuatro parámetros y compara la ACF/PACF <strong>teórica</strong> (barras
          sólidas) con la <strong>muestral</strong> de una realización de longitud $T$ (barras claras). Cambia $T$ y
          verás lo que de verdad ocurre al identificar: con $T = 60$ el patrón teórico casi no se reconoce, y con
          $T = 1000$ emerge limpio. La banda punteada es $\pm 1.96/\sqrt{T}$.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Realización simulada</p>
        <div class="grafico-wrapper" style="height:170px;">
          <canvas aria-label="Serie simulada del proceso ARMA seleccionado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">ACF — teórica frente a muestral</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación teórica y muestral" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF — teórica frente a muestral</p>
        <div class="grafico-wrapper" style="height:190px;">

      </div>

      <div class="note">
        <p><strong>Lo que enseña el deslizador de $T$.</strong> La ACF muestral es un <em>estimador</em>, y uno con
          bastante varianza. Con $T = 60$, la banda vale $\pm 0.253$: cualquier autocorrelación teórica menor que eso
          es indistinguible de cero. Con $T = 1000$ baja a $\pm 0.062$. Cuando en el Módulo 9 veas un correlograma
          real que no encaja en ninguna fila de la tabla, recuerda este simulador: casi nunca es que el modelo no
          exista, es que la muestra es corta.</p>
      </div>

      <h3>Redundancia de parámetros: cuando sobra un factor</h3>

      <p>Hay una trampa específica de los modelos mixtos. Si $\phi(B)$ y $\theta(B)$ comparten un factor, ese factor se
        cancela y el modelo es en realidad más pequeño de lo que aparenta.</p>

      <div class="formula">
        <p>Tomemos el ARMA(1,1) con $\phi_1 = 0.5$ y $\theta_1 = -0.5$:</p>
        $$(1-0.5B)\,y_t = (1-0.5B)\,\varepsilon_t \;\Longrightarrow\; y_t = \varepsilon_t$$
        <p style="margin-bottom:0;">Es <strong>ruido blanco</strong> escrito con dos parámetros de más.</p>
      </div>

      <div class="warning">
        <p><strong>Cómo se manifiesta en una salida real.</strong> Cuando dos factores casi se cancelan, la
          verosimilitud es casi plana en esa dirección: los coeficientes salen con <strong>errores estándar enormes</strong>,
          el optimizador puede no converger, y valores muy distintos de $(\phi,\theta)$ dan ajustes casi idénticos. Si
          ves un ARMA con $\hat\phi_1 \approx -\hat\theta_1$ y errores estándar grandes, prueba el modelo más pequeño
          antes de interpretar nada.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Redundancia de parámetros">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Redundancia: phi = -theta hace que el modelo colapse a ruido blanco
round(ARMAacf(ar = 0.5, ma = -0.5, lag.max = 5)[-1], 6)
#&gt; [1] 0 0 0 0 0        <- la ACF de un ruido blanco

# Un proceso CASI redundante: phi = 0.5 y theta = -0.45 casi se cancelan,
# asi que en la practica es casi ruido blanco
round(ARMAacf(ar = 0.5, ma = -0.45, lag.max = 5)[-1], 4)
#&gt; [1] 0.0515 0.0257 0.0129 0.0064 0.0032    <- autocorrelaciones minusculas

set.seed(11)
y &lt;- arima.sim(n = 200, list(ar = 0.5, ma = -0.45))
ajuste &lt;- arima(y, order = c(1, 0, 1))
#&gt; Warning: possible convergence problem: optim gave code = 1
round(cbind(coef = coef(ajuste), ee = sqrt(diag(ajuste$var.coef))), 4)
#&gt;              coef     ee
#&gt; ar1        0.8300 0.2307
#&gt; ma1       -0.7953 0.2477
#&gt; intercept  0.0137 0.0806

# Los verdaderos son 0.5 y -0.45; la estimacion se va a 0.83 y -0.80.
# Lo que SI reproduce es la suma (0.0347 frente a 0.05): el ajuste fija
# la cancelacion, no cada coeficiente por separado.

# Y el modelo mas pequeno gana:
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
c(arma11 = aicc(ajuste, 200),
  ar1    = aicc(arima(y, order = c(1, 0, 0)), 200),
  ruido  = aicc(arima(y, order = c(0, 0, 0)), 200))
#&gt;   arma11      ar1    ruido
#&gt; 554.3463 552.9939 550.9449</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess, arma_acf
from statsmodels.tsa.arima.model import ARIMA

# Redundancia exacta: phi = -theta colapsa a ruido blanco
print(np.round(arma_acf(np.r_[1, -0.5], np.r_[1, -0.5], lags=6)[1:], 6))
# [0. 0. 0. 0. 0.]

# Redundancia CASI exacta: phi = 0.5, theta = -0.45
print(np.round(arma_acf(np.r_[1, -0.5], np.r_[1, -0.45], lags=6)[1:], 4))
# [0.0515 0.0257 0.0129 0.0064 0.0032]

# Simular ese proceso y ajustarle un ARMA(1,1): los coeficientes se van
# lejos de los verdaderos, con errores estandar grandes, pero su SUMA
# reproduce la cancelacion. La semilla no coincide con la de R, asi que
# las cifras exactas difieren; el sintoma es el mismo.
proceso = ArmaProcess(np.r_[1, -0.5], np.r_[1, -0.45])
y = proceso.generate_sample(nsample=200, distrvs=np.random.default_rng(11).standard_normal)
res = ARIMA(y, order=(1, 0, 1)).fit()
print(res.summary().tables[1])
print("suma ar1 + ma1 =", round(res.arparams[0] + res.maparams[0], 4))
</code></pre>
        </div>
      </div>
    </div>

      <p>La mejor forma de aprender a identificar es al revés: simular procesos cuyo orden ya conoces y mirar sus

          <pre><code class="language-r">set.seed(3)

# arima.sim descarta automaticamente un periodo de calentamiento (burn-in),
# asi que la serie que devuelve ya esta en regimen estacionario.
ar1   &lt;- arima.sim(n = 200, model = list(ar = 0.8))
ma1   &lt;- arima.sim(n = 200, model = list(ma = 0.8))
arma  &lt;- arima.sim(n = 200, model = list(ar = 0.7, ma = 0.5))

par(mfrow = c(3, 3), mar = c(3, 4, 2, 1))
for (nm in c("ar1", "ma1", "arma")) {
  x &lt;- get(nm)
  plot(x, main = nm, ylab = "")
  acf(x,  lag.max = 16, main = "ACF")
  pacf(x, lag.max = 16, main = "PACF")
}

# arima.sim EXIGE un modelo estacionario: si le pides una raiz unitaria falla
try(arima.sim(n = 100, model = list(ar = 1)))

from statsmodels.tsa.arima_process import ArmaProcess
from statsmodels.graphics.tsaplots import plot_acf, plot_pacf

rng = np.random.default_rng(3)

procesos = {
    "ar1":  ArmaProcess(np.r_[1, -0.8], np.r_[1]),
    "ma1":  ArmaProcess(np.r_[1], np.r_[1, 0.8]),
    "arma": ArmaProcess(np.r_[1, -0.7], np.r_[1, 0.5]),
}

fig, ejes = plt.subplots(3, 3, figsize=(13, 8))
for fila, (nombre, proc) in enumerate(procesos.items()):
    x = proc.generate_sample(nsample=200, distrvs=rng.standard_normal)
    ejes[fila, 0].plot(x); ejes[fila, 0].set_title(nombre)
    plot_acf(x,  lags=16, ax=ejes[fila, 1], title="ACF")
    plot_pacf(x, lags=16, ax=ejes[fila, 2], title="PACF", method="ywm")
plt.tight_layout()

# generate_sample NO descarta calentamiento por defecto: se pide con burnin=

          espuria al principio de la serie que después se lee como si fuera estructura.</p>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.7 Estimación de parámetros
          <span class="text-gray-400 font-normal text-2xl">/ Parameter estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

      <p>Hasta aquí los $\phi$ y los $\theta$ eran datos del problema. Con una serie real hay que estimarlos, y no hay

      <h3>Tres formas de estimar el mismo AR(2)</h3>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Los tres métodos</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Yule–Walker</strong> (método de momentos). Toma las ecuaciones del Módulo 2, sustituye las
            $\rho_k$ teóricas por las muestrales $r_k$ y resuelve el sistema. Solo sirve para modelos AR puros. Es
            explícito, rápido y no necesita optimización.</li>
          <li><strong>CSS</strong> (<em>conditional sum of squares</em>). Minimiza $\sum \hat\varepsilon_t^2$
            condicionando en los primeros valores observados. Es una mínimos cuadrados no lineal: descarta la
            información de las primeras observaciones.</li>
          <li><strong>Máxima verosimilitud</strong>. Maximiza la verosimilitud gaussiana <em>exacta</em>, que
            incluye la contribución de las primeras observaciones. Es el más eficiente y el que da errores estándar
            fiables.</li>
        </ul>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-verosimilitud">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-verosimilitud" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Supón ruido gaussiano y escribe la densidad conjunta de la muestra factorizándola en condicionales,
                que es lo natural en una serie de tiempo:</p>
              $$f(y_1,\ldots,y_T) = f(y_1)\prod_{t=2}^{T} f(y_t \mid y_{t-1},\ldots,y_1)$$
            </li>
            <li>
              <p>Para un AR(1), la condicional es inmediata: dado $y_{t-1}$, el único término aleatorio es
                $\varepsilon_t$, luego $y_t \mid y_{t-1} \sim N(\phi y_{t-1},\, \sigma^2)$. Tomando logaritmos, la
                parte condicional de la log-verosimilitud es</p>
              $$-\frac{T-1}{2}\log(2\pi\sigma^2) - \frac{1}{2\sigma^2}\sum_{t=2}^{T}(y_t - \phi y_{t-1})^2$$
            </li>
            <li>
              <p>Maximizar eso equivale a <strong>minimizar la suma de cuadrados</strong>
                $\sum_{t=2}^{T}(y_t-\phi y_{t-1})^2$. Ahí está el método <strong>CSS</strong>: es máxima
                verosimilitud, pero <em>condicionada</em> a $y_1$, cuya densidad se ha ignorado.</p>
            </li>
            <li>
              <p>La verosimilitud <strong>exacta</strong> añade el término que falta. La primera observación no es
                un dato fijo: procede de la distribución estacionaria, $y_1 \sim N\!\left(0,\ \sigma^2/(1-\phi^2)\right)$,
                y contribuye con</p>
              $$-\tfrac{1}{2}\log\frac{2\pi\sigma^2}{1-\phi^2} - \frac{(1-\phi^2)\,y_1^2}{2\sigma^2}$$
            </li>
            <li>
              <p>Ese término aporta el factor $\tfrac{1}{2}\log(1-\phi^2)$, que <strong>penaliza</strong> los valores
                de $\phi$ cercanos a $1$. Con $T$ grande, un sumando frente a $T$ es despreciable y los dos métodos
                convergen; con $T$ pequeño o $\phi$ cerca de la frontera, no.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">De ahí la jerarquía: CSS es más barato y sirve para arrancar; ML es más
            preciso. Por eso <code>arima()</code> usa por defecto <code>method = "CSS-ML"</code>, que estima por CSS
            para obtener valores iniciales y termina maximizando la verosimilitud exacta.</p>
        </div>
      </div>

import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.regression.linear_model import yule_walker

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values
print(len(manchas))   # 100

# 1. Yule-Walker. OJO: statsmodels usa por defecto el divisor n-k ("adjusted");
#    para reproducir ar() de R hay que pedir method="mle", que usa el divisor n.
rho, sigma = yule_walker(manchas - manchas.mean(), order=2, method="mle")
print(np.round(rho, 4))     # [ 1.3173 -0.6338]

# 2. CSS: la API nueva de ARIMA NO lo ofrece. Sus method= son statespace,
#    innovations_mle, hannan_rissanen, burg, innovations y yule_walker;
#    fit(method="css") lanza ValueError: "css" is not a valid estimator.
#    El antiguo tsa.arima_model.ARMA, que si tenia method="css", fue
#    retirado en statsmodels 0.13. El CSS de R (1.4032, -0.7099) no tiene
#    equivalente directo aqui.

# 3. Maxima verosimilitud. statespace (el defecto) e innovations_mle son
#    AMBOS verosimilitud exacta y dan el mismo punto:
ml  = ARIMA(manchas, order=(2, 0, 0), trend="c").fit()
mle = ARIMA(manchas, order=(2, 0, 0), trend="c").fit(method="innovations_mle")
print(np.round(ml.arparams, 4))    # [ 1.4059 -0.7111]
print(np.round(mle.arparams, 4))   # [ 1.4059 -0.7111]  identico

# Raices y pseudo-periodo
phi = ml.arparams
raices = np.roots(np.r_[1, -phi][::-1])
print(np.round(np.abs(raices), 4))                 # [1.1859 1.1859]
print(round(2 * np.pi / np.angle(raices[0]), 4))   # 10.7365
# R daba 10.7369: los optimizadores convergen a puntos ligerisimamente
# distintos. La diferencia es de 4 diezmilesimas de anio, irrelevante aqui.</code></pre>

      <h3>AIC, AICc y BIC</h3>

      <p>Añadir parámetros siempre mejora la verosimilitud. Los criterios de información compensan esa mejora con una
        penalización por complejidad, y se elige el modelo con el <strong>menor</strong> valor.</p>

      <div class="formula">
        $$\text{AIC} = -2\log L + 2k, \qquad
          \text{AICc} = \text{AIC} + \frac{2k(k+1)}{n-k-1}, \qquad
          \text{BIC} = -2\log L + k\log n$$
        <p style="margin-bottom:0;">donde $k$ es el número de parámetros estimados —incluido $\sigma^2$— y $n$ el
          número de observaciones.</p>
      </div>

      <div class="note">
        <p><strong>Cuál usar.</strong> El AICc corrige el sesgo del AIC en muestras pequeñas y converge a él cuando
          $n$ crece, así que <strong>no hay razón para preferir el AIC</strong>. El BIC penaliza más
          ($\log n > 2$ en cuanto $n > 7$) y por eso tiende a elegir modelos más pequeños. Si buscas pronosticar,
          AICc; si buscas identificar el modelo "verdadero", BIC.</p>
      </div>

      <div class="warning">
        <p><strong>La trampa que reaparecerá en el Capítulo 4.</strong> Los criterios solo son comparables entre
          modelos ajustados a <strong>los mismos datos</strong>. Diferenciar cambia los datos: un ARIMA con $d=1$ se
          ajusta sobre $n-1$ observaciones distintas de las del modelo con $d=0$. Comparar sus AIC no significa nada.
          Aquí todos los candidatos tienen $d=0$ sobre la misma serie, así que la comparación es lícita.</p>
      </div>

      <h3>Diagnóstico: los residuales deben ser ruido blanco</h3>

      <p>El criterio de información dice cuál de los candidatos es relativamente mejor, pero no si <em>alguno</em> es
        bueno. Para eso están los residuales $\hat\varepsilon_t$: si el modelo ha capturado toda la estructura, lo que
        queda no debe tener ninguna.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Prueba de Ljung–Box</h4>
        <p>Contrasta si las primeras $h$ autocorrelaciones de los residuales son <strong>conjuntamente</strong> nulas:</p>
        $$Q(h) = T(T+2)\sum_{k=1}^{h}\frac{\hat r_k^2}{T-k}
          \;\;\sim\;\; \chi^2_{\,h-p-q} \quad\text{bajo } H_0$$
        <p style="margin-bottom:0;">$H_0$ es "los residuales son ruido blanco". Un $p$-valor <strong>pequeño</strong>
          significa que <strong>queda estructura sin modelar</strong>: el modelo no basta.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ljung-box">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ljung-box" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Si una serie es ruido blanco, cada autocorrelación muestral cumple aproximadamente
                $\hat r_k \sim N(0,\,1/T)$. Entonces $T\hat r_k^2$ es aproximadamente $\chi^2_1$, y sumando $h$
                rezagos independientes se obtiene el estadístico de Box–Pierce:</p>
              $$Q^{*}(h) = T\sum_{k=1}^{h}\hat r_k^2 \;\sim\; \chi^2_h$$
            </li>
            <li>
              <p>Esa aproximación es mala con $T$ moderado, porque la varianza real de $\hat r_k$ es algo menor que
                $1/T$, y tanto menor cuanto mayor es $k$ —quedan menos pares de observaciones separados por $k$
                periodos con los que estimarla—: $\operatorname{Var}(\hat r_k) \approx (T-k)/\big(T(T+2)\big)$. Ljung
                y Box (1978) reemplazaron el factor $T$ por el inverso exacto de esa varianza, que por eso
                <em>crece</em> con el rezago:</p>
              $$T \;\longrightarrow\; \frac{T(T+2)}{T-k}$$
            </li>
            <li>
              <p>Falta el ajuste clave. Los $\hat r_k$ no se calculan sobre ruido blanco observado, sino sobre
                <strong>residuales de un modelo estimado</strong>. Al estimar $p+q$ parámetros se han impuesto $p+q$
                restricciones que fuerzan a los residuales a estar menos correlacionados de lo que estarían por azar.</p>
            </li>
            <li>
              <p>Ignorarlo infla el $p$-valor y hace que la prueba <strong>no rechace cuando debería</strong>. La
                corrección consiste en descontar esos parámetros de los grados de libertad:</p>
              $$Q(h) \sim \chi^2_{\,h-p-q}$$
              <p>En R eso es el argumento <code>fitdf = p + q</code> de <code>Box.test()</code>, que
                <strong>no</strong> se aplica solo. Solo tiene sentido evaluar en $h > p+q$.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">Regla práctica: sobre los residuales de un ARMA($p,q$) hay que llamar a
            <code>Box.test(residuals(ajuste), lag = h, type = "Ljung-Box", fitdf = p + q)</code>. Si omites
            <code>fitdf</code>, la prueba es demasiado indulgente y aprobará modelos insuficientes.</p>
        </div>
      </div>

          <tr><td>AR(2)</td><td>$838.30$</td><td>$848.30$</td><td>$0.0461$</td></tr>
          <tr><td>AR(3)</td><td>$836.52$</td><td>$848.91$</td><td>$0.1658$</td></tr>
          <tr><td>MA(2)</td><td>$853.56$</td><td>$863.56$</td><td>$&lt;0.0001$</td></tr>
          <tr><td>ARMA(1,1)</td><td>$850.50$</td><td>$860.50$</td><td>$&lt;0.0001$</td></tr>
          <tr>
            <td><strong>ARMA(2,1)</strong></td>
            <td><strong>$834.73$</strong></td><td><strong>$847.12$</strong></td><td>$0.2246$</td>
          </tr>
          <tr><td>ARMA(2,2)</td><td>$836.63$</td><td>$851.36$</td><td>$0.1510$</td></tr>
        </tbody>
      </table>

      <div class="warning">
        <p><strong>Aquí hay un problema, y conviene no taparlo.</strong> El AR(2) es el modelo que la identificación
          proponía y el que hizo famoso a Yule, pero:</p>
        <ul style="margin-bottom:0;">
          <li>su Ljung–Box en el rezago 12 da $p = 0.0461$, es decir, <strong>se rechaza</strong> al 5 %: quedan
            autocorrelaciones sin explicar;</li>
          <li>y <strong>no</strong> es el mejor por AICc ni por BIC. Gana el ARMA(2,1), cuyo $\hat\theta_1 = 0.3732$
            es significativo ($t = 2.78$) y cuyos residuales sí pasan la prueba ($p = 0.2246$).</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>R y Python no dan el mismo $p$-valor de Ljung–Box, y aquí la conclusión cambia.</strong> Sobre el
          AR(2), R da $0.0461$ (se rechaza) y statsmodels $0.1085$ (no se rechaza). Los ajustes son idénticos —AICc y
          BIC coinciden hasta el último decimal—, así que la diferencia está en los <strong>residuales</strong>.
          Comparándolos uno a uno: del tercero en adelante son los mismos ($8.728$ frente a $8.727$, $-15.396$ frente a
          $-15.397$…); los que difieren son los <strong>dos primeros</strong>, porque cada programa inicializa de otra
          forma el filtro para las $p$ primeras observaciones (R da $21.06$ y statsmodels $52.54$ para el primero). Y
          $Q$ pondera mucho $\hat r_1$.</p>
        <p style="margin-bottom:0;">La comprobación decisiva: si se descartan los $\max(p,q)$ primeros residuales,
          los dos coinciden — ARMA(2,0): $0.0232$ en R y $0.0232$ en Python; ARMA(2,1): $0.1424$ y $0.1420$. Es decir,
          <strong>el rechazo del AR(2) es real y se refuerza</strong> ($0.0232 < 0.0461$); lo que hay es una
          inicialización que infla el primer residual y relaja la prueba. Moraleja general: cuando dos programas
          discrepen en un contraste sobre residuales, compara primero los residuales, no los $p$-valores.</p>
      </div>

      <div class="note">
        <p><strong>Un detalle que justifica la prueba conjunta.</strong> Si abres el simulador en el AR(2), verás que
          <strong>ninguna</strong> de sus 20 autocorrelaciones residuales se sale de la banda $\pm 0.196$: la mayor es
          $0.1839$ en el rezago 11 y la siguiente $0.1718$ en el 9 — dentro, pero la primera se queda a un pelo.
          Mirando el correlograma barra por barra habrías dado el modelo por bueno. Y sin embargo Ljung–Box lo
          rechaza, porque evalúa las doce <strong>a la vez</strong>: $Q$ suma los <strong>cuadrados</strong> de todas,
          de modo que media docena de autocorrelaciones moderadas, cada una insignificante por separado, acumulan un
          $Q$ que sí lo es. Para eso existe la prueba, y por eso no basta con mirar el dibujo.</p>
      </div>

      <p>La tentación es aceptar el ARMA(2,1) y seguir. Pero antes de añadir un parámetro para tapar un problema,
        conviene preguntarse <strong>qué problema es</strong>. Eso es lo que hace el módulo siguiente.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Criterios de información y Ljung-Box">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">manchas &lt;- window(sunspot.year, start = 1770, end = 1869)
n &lt;- length(manchas)

# arima() reporta AIC pero NO AICc: hay que calcularlo
aicc &lt;- function(ajuste, n) {
  k &lt;- length(ajuste$coef) + 1        # +1 por sigma^2
  ajuste$aic + 2 * k * (k + 1) / (n - k - 1)
}

# La rejilla no es un producto cartesiano: son ordenes bajos en las dos partes
# mas dos AR largos. Es lo que justifica la lectura de los correlogramas, y son
# los once candidatos de la tabla ordenable de arriba.
rejilla &lt;- list(c(1,0), c(2,0), c(3,0), c(4,0),
                c(0,1), c(0,2), c(0,3),
                c(1,1), c(2,1), c(1,2), c(2,2))

resultado &lt;- do.call(rbind, lapply(rejilla, function(pq) {
  p &lt;- pq[1]; q &lt;- pq[2]
  aj &lt;- arima(manchas, order = c(p, 0, q), method = "ML")
  data.frame(
    modelo = sprintf("ARMA(%d,%d)", p, q),
    AICc = round(aicc(aj, n), 2),
    BIC  = round(BIC(aj), 2),
    # fitdf = p + q es IMPRESCINDIBLE: sin el, la prueba es indulgente
    LB12 = round(Box.test(residuals(aj), lag = 12,
                          type = "Ljung-Box", fitdf = p + q)$p.value, 4)
  )
}))
resultado[order(resultado$AICc), ]
#&gt;       modelo   AICc    BIC   LB12
#&gt; 9  ARMA(2,1) 834.73 847.12 0.2246
#&gt; 3  ARMA(3,0) 836.52 848.91 0.1658
#&gt; 11 ARMA(2,2) 836.63 851.36 0.1510
#&gt; 4  ARMA(4,0) 836.78 851.51 0.1118
#&gt; 2  ARMA(2,0) 838.30 848.30 0.0461
#&gt; 10 ARMA(1,2) 840.51 852.90 0.0110
#&gt; 7  ARMA(0,3) 845.35 857.74 0.0010
#&gt; 8  ARMA(1,1) 850.50 860.50 0.0000
#&gt; 6  ARMA(0,2) 853.56 863.56 0.0000
#&gt; 1  ARMA(1,0) 904.33 911.89 0.0000
#&gt; 5  ARMA(0,1) 908.13 915.70 0.0000

# El AR(2), mirado de cerca
ar2 &lt;- arima(manchas, order = c(2, 0, 0), method = "ML")
round(acf(residuals(ar2), lag.max = 3, plot = FALSE)$acf[-1], 4)
#&gt; [1]  0.1297 -0.1477  0.0285
Box.test(residuals(ar2), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value
#&gt; [1] 0.04614324        <- se rechaza al 5%

# Lo que pasa si se OLVIDA fitdf: el mismo modelo "aprueba"
Box.test(residuals(ar2), lag = 12, type = "Ljung-Box")$p.value
#&gt; [1] 0.09957107        <- conclusion opuesta por omitir un argumento</code></pre>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import pandas as pd
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values

# La misma lista de once candidatos que en R, no un producto cartesiano.
rejilla = [(1,0), (2,0), (3,0), (4,0),
           (0,1), (0,2), (0,3),
           (1,1), (2,1), (1,2), (2,2)]

filas = []
for p, q in rejilla:
    res = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    # model_df descuenta los parametros estimados, igual que fitdf en R
    lb = acorr_ljungbox(res.resid, lags=[12], model_df=p + q)
    filas.append({"modelo": f"ARMA({p},{q})", "AICc": round(res.aicc, 2),
                  "BIC": round(res.bic, 2),
                  "LB12": round(float(lb["lb_pvalue"].iloc[0]), 4)})

print(pd.DataFrame(filas).sort_values("AICc").to_string(index=False))
#    modelo   AICc    BIC   LB12
# ARMA(2,1) 834.73 847.12 0.3211
# ARMA(3,0) 836.52 848.91 0.3176
# ARMA(2,2) 836.63 851.36 0.1939
# ARMA(4,0) 836.78 851.51 0.1677
# ARMA(2,0) 838.30 848.30 0.1085   <- en R da 0.0461
# AICc y BIC coinciden con R hasta el ultimo decimal. Los p-valores de
# Ljung-Box NO: ver la advertencia de abajo.

# Reconciliacion: descartando los max(p,q) primeros residuales, los dos
# programas coinciden.
for p, q in [(2, 0), (2, 1), (2, 2)]:
    r = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    corte = max(p, q)
    lb = acorr_ljungbox(r.resid[corte:], lags=[12], model_df=p + q)
    print(f"ARMA({p},{q}) recortado: {float(lb['lb_pvalue'].iloc[0]):.4f}")
# ARMA(2,0) recortado: 0.0232      (R: 0.0232)
# ARMA(2,1) recortado: 0.1420      (R: 0.1424)
# ARMA(2,2) recortado: 0.1051      (R: 0.1057)

# statsmodels SI trae aicc; R no lo trae en arima() y hay que calcularlo.
# Cuidado tambien con model_df: por defecto vale 0 y la prueba se relaja.</code></pre>

      <h3>Caso 1 · Manchas solares: el parámetro que sobraba</h3>

      <p>Nos quedamos con un AR(2) que no pasaba Ljung–Box y un ARMA(2,1) que ganaba por AICc. Antes de aceptar el
        parámetro extra, volvamos al Capítulo 2: <strong>¿la serie está en la escala adecuada?</strong></p>

      <p>Los números de manchas solares son <strong>conteos</strong>. Es de esperar que su variabilidad crezca con el
        nivel: en un máximo solar hay más manchas y también fluctúan más. Eso se comprueba, no se supone. Midiendo la
        elasticidad amplitud–nivel (la pendiente de $\log(\text{desviación})$ contra $\log(\text{media})$ por bloques,
        el mismo diagnóstico del Capítulo 1):</p>

      <table>
        <caption class="sr-only">Elasticidad amplitud-nivel de las manchas solares según el tamaño de bloque</caption>
        <thead>
          <tr>
            <th scope="col">Bloques</th><th scope="col">$\hat b$</th><th scope="col">IC 95 %</th>
            <th scope="col">$R^2$</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>10 años</td><td>$0.8165$</td><td>$[0.593,\ 1.040]$</td><td>$0.899$</td></tr>
          <tr><td>11 años (un ciclo)</td><td>$0.7658$</td><td>$[0.533,\ 0.998]$</td><td>$0.897$</td></tr>
          <tr><td>5 años</td><td>$0.7034$</td><td>$[0.475,\ 0.931]$</td><td>$0.700$</td></tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>Qué dicen y qué no dicen estos números.</strong> Los tres intervalos excluyen $b=0$ con holgura:
          <strong>hay que transformar</strong>, eso es firme y no depende de cómo se hagan los bloques. Pero ninguno
          separa limpiamente $b=0.5$ (raíz cuadrada) de $b=1$ (logaritmo): los intervalos contienen los dos valores o
          casi. Los datos piden una transformación y no dicen exactamente cuál.</p>
      </div>

      <p>Lo que decide es otra cosa, y es contundente: <strong>la serie tiene un año con cero manchas</strong> (1810;
        en la serie completa 1700–1988 hay tres). El logaritmo de cero no existe. La raíz cuadrada, en cambio, está
        definida en cero y es la transformación estabilizadora clásica para conteos. Además, el $\lambda$ de Guerrero
        del Capítulo 2 sobre esta serie —desplazada una unidad, porque el criterio exige datos estrictamente positivos
        y está ese cero— da $0.3062$, que cae <strong>entre</strong> el logaritmo y la raíz cuadrada.</p>

      <div class="simulador" data-simulador="manchas-transformada">
        <h4><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i> La serie antes y después de la raíz</h4>
        <p class="simulador-intro">Cambia entre la escala original y la raíz cuadrada. En la original, los máximos son
          picos altos y estrechos y los mínimos son planos: la serie es asimétrica. En la raíz, los ciclos se parecen
          mucho más entre sí y la PACF se corta más limpiamente en el rezago 2.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:200px;">
          <canvas aria-label="Serie de manchas solares en la escala seleccionada" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación parcial en la escala seleccionada" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <p>Y ahora el resultado. Repitiendo exactamente la misma rejilla del Módulo 8 sobre $\sqrt{\text{manchas}}$:</p>

          <tr>
            <th scope="col">Modelo</th>

            <th scope="col">AICc ($\sqrt{\ }$)</th><th scope="col">LB(12)</th>
          </tr>

          <tr><td>AR(2)</td><td>$838.30$</td><td>$0.0461$ ✗</td>
            <td><strong>$324.00$</strong> ✓ mínimo</td><td>$0.1644$ ✓</td></tr>
          <tr><td>AR(3)</td><td>$836.52$</td><td>$0.1658$</td><td>$325.35$</td><td>$0.2005$</td></tr>
          <tr><td>ARMA(2,1)</td><td><strong>$834.73$</strong> mínimo</td><td>$0.2246$</td>
            <td>$325.41$</td><td>$0.1856$</td></tr>
          <tr><td>ARMA(2,2)</td><td>$836.63$</td><td>$0.1510$</td><td>$327.42$</td><td>$0.1833$</td></tr>

      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>El hallazgo</h4>
        <p>Sobre la raíz cuadrada, el <strong>AR(2) es a la vez el mejor por AICc y el mejor por BIC</strong>
          ($324.00$ y $334.00$, ambos mínimos de la rejilla) y sus residuales pasan Ljung–Box ($p = 0.1644$). El
          término MA que el AICc pedía sobre la serie cruda <strong>ya no aporta nada</strong>.</p>
        <p style="margin-bottom:0;">Es decir: aquel $\hat\theta_1 = 0.3732$ no estaba capturando dinámica que faltara,
          estaba <strong>parcheando un problema de escala</strong>. Añadir parámetros puede disimular un
          preprocesamiento incorrecto, y el criterio de información no distingue una cosa de la otra.</p>
      </div>

      <p>El modelo final es, entonces:</p>

      <div class="formula">
        $$\sqrt{y_t} - 6.33 = 1.4027\,(\sqrt{y_{t-1}} - 6.33) - 0.6853\,(\sqrt{y_{t-2}} - 6.33) + \varepsilon_t$$
        <p style="margin-bottom:0;">con errores estándar $0.0727$ y $0.0724$; raíces complejas de módulo $1.208$.</p>
      </div>

      <p>Y la recompensa está en el pseudo-periodo. Sobre la serie cruda daba $10.74$ años; sobre la raíz cuadrada da
        <strong>$11.22$ años</strong>. El ciclo solar documentado por los astrónomos es de aproximadamente
        <strong>11 años</strong>. Corregir la escala no solo arregló el diagnóstico: acercó la estimación al valor
        físico.</p>

      <div class="note">
        <p><strong>¿Y si el $0.5$ fuera arbitrario?</strong> Con el $\lambda = 0.3062$ de Guerrero en vez de la raíz
          cuadrada, el AR(2) da un pseudo-periodo de $11.39$ años y un Ljung–Box de $p = 0.4892$. Conviene notar dónde
          se aplica cada cosa: ese $\lambda$ se <strong>estima</strong> sobre <code>manchas + 1</code>, porque Guerrero
          exige datos estrictamente positivos y la serie tiene un cero, pero se <strong>aplica</strong> sobre la serie
          original, <code>manchas^0.3062</code>. Sobre la desplazada saldría $11.28$ y $p = 0.2217$: la misma lectura.
          La conclusión <strong>no depende</strong> de haber elegido exactamente $0.5$: cualquier transformación de
          potencia moderada hace el mismo trabajo. Eso es señal de que el hallazgo es robusto y no un artefacto.</p>
      </div>

      <div class="warning">
        <p><strong>Lo que sigue sin estar bien.</strong> La normalidad de los residuales mejora pero no llega: la
          asimetría baja de $0.791$ a $0.573$ y el $p$-valor de Shapiro–Wilk sube de $0.0007$ a $0.0470$, que sigue
          rechazando al 5 %. El número de manchas solares sube más rápido de lo que baja, y esa asimetría es una
          <strong>no linealidad</strong> que ningún modelo lineal ARMA puede capturar. Los intervalos de pronóstico del
          Capítulo 6, que suponen normalidad, quedarán algo mal calibrados. Decirlo es parte del trabajo.</p>
      </div>

      <h3>Caso 2 · Log-retornos de la TRM: cuando no hay nada que modelar</h3>

      <p>Retomemos la TRM del Capítulo 2. Allí quedó establecido que tiene una raíz unitaria y que su primera
        diferencia es estacionaria. Trabajemos con los <strong>log-retornos</strong>
        $r_t = 100 \times \log(y_t/y_{t-1})$, que es la variación porcentual mensual y la magnitud habitual en
        finanzas ($n = 137$).</p>

      <div class="simulador" data-simulador="trm-retornos">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Log-retornos mensuales de la TRM</h4>

          dentro: solo asoman <strong>dos</strong> barras, el rezago 5 ($0.193$) y el rezago 8 ($-0.198$), y ya
          sabemos por el Módulo 6 que con 20 rezagos se espera <strong>uno</strong> fuera por puro azar. Dos, en
          rezagos sin ninguna interpretación en una serie mensual, es exactamente lo que produce el azar.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Log-retornos mensuales de la TRM" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">ACF</p>
        <div class="grafico-wrapper" style="height:185px;">
          <canvas aria-label="ACF de los log-retornos de la TRM" role="img"></canvas>

      <p>Ljung–Box sobre la serie da $p = 0.0931$ en el rezago 6, $p = 0.0601$ en el 12 y $p = 0.0599$ en el 20: no se
        rechaza en ninguno, aunque el $0.06$ es lo bastante bajo como para no cantar victoria. Y si se ajusta el MA(1)
        que sugiere <code>auto.arima</code>:</p>

      <div class="formula">
        $$\hat\theta_1 = 0.1262 \quad (\text{e.e. } 0.0912,\ t = 1.38)$$
        <p style="margin-bottom:0;">Comparado en igualdad de condiciones con el ruido blanco puro, el MA(1) da un AICc
          de $722.653$ frente a $722.663$: una diferencia de <strong>una centésima</strong>. Son indistinguibles.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>La conclusión honesta</h4>
        <p style="margin-bottom:0;">Los log-retornos mensuales de la TRM son, a efectos prácticos,
          <strong>ruido blanco</strong>. El mejor modelo ARMA para esta serie es el modelo sin parámetros, y el mejor
          pronóstico de la variación del mes que viene es la media histórica. No es un fracaso del análisis: es su
          resultado, y coincide con lo que predice la teoría de mercados eficientes para una tasa de cambio.</p>
      </div>

      <div class="warning">
        <p><strong>Ojo con la media.</strong> <code>auto.arima()</code> devuelve el MA(1) <strong>sin</strong> término
          constante. No es un capricho: la media mensual estimada es $0.2681\ \%$ con un error estándar de $0.3195$,
          o sea $t = 0.84$. Con 137 meses no hay evidencia de que la TRM tenga una deriva distinta de cero. Si al
          comparar AICc de dos modelos uno incluye media y el otro no, no los estás comparando en igualdad de
          condiciones.</p>
      </div>

      <div class="note">
        <p><strong>Donde sí hay estructura: en el cuadrado.</strong> Ljung–Box sobre $r_t$ da $p = 0.0601$, pero sobre
          $r_t^2$ da $p = 0.9166$: en esta serie mensual tampoco hay agrupamiento de volatilidad detectable. En datos
          diarios de la misma tasa el resultado suele ser el opuesto —el nivel es ruido blanco y el cuadrado no— y esa

            <p class="text-gray-600 text-sm" style="margin:0;">Situar el AR como el antepasado directo de los métodos
