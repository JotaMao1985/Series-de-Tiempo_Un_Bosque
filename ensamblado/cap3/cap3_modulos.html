            <p class="text-gray-600 text-sm" style="margin:0;">Escribir un modelo de series de tiempo como un polinomio

      <p>En el Capítulo 2 se usó el operador $B$ para escribir la diferencia como $\nabla y_t = (1-B)y_t$ y para
        explicar el nombre de la raíz unitaria. <span data-afirma="c3-m1-21">Ese atajo de notación es en realidad una herramienta muy útil para escribir los modelos de series de tiempo <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.2)</a></cite></span>, y conviene presentarla en serio antes de construir modelos con ella. El
        módulo va de la notación a la condición de las raíces; los convenios de signo y las diferencias entre R y
        Python, que dan tropiezos, quedan para el final.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: operador de rezago (<em>lag operator</em>)</h4>
        <p data-afirma="c3-m1-01">El <strong>operador de rezago</strong> $B$ retrasa una serie un periodo <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.2)</a></cite>:</p>
        $$B\, y_t = y_{t-1}$$
        <p style="margin-bottom:0;">Aplicado $k$ veces, retrasa $k$ periodos: $B^k y_t = y_{t-k}$. Por convenio
          $B^0 = 1$ (el operador identidad) y $B$ deja fijas las constantes: $Bc = c$.</p>
      </div>

      <p><span data-afirma="c3-m1-02">Lo interesante es que $B$ <strong>se comporta como un número</strong> en las operaciones algebraicas: se puede
        sumar, multiplicar, elevar a potencias y factorizar <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.2)</a></cite></span>. Eso convierte manipulaciones de recursiones —que son
        engorrosas— en manipulaciones de polinomios, que son rutina.</p>

      <div class="note">
        <p data-afirma="c3-m1-03"><strong>Un ejemplo de lo que compra la notación.</strong> La diferencia estacional de orden $m$ aplicada
          después de una diferencia regular es $\nabla_m \nabla y_t$. Con polinomios, eso es
          $(1-B^m)(1-B)y_t$, y basta multiplicar para saber exactamente qué combinación de rezagos interviene <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.2)</a></cite>:</p>
        $$\begin{aligned}
          &(1-B^m)(1-B) \\
          &\quad = 1 - B - B^m + B^{m+1} \\
          &\quad \Rightarrow\; y_t - y_{t-1} - y_{t-m} + y_{t-m-1}
        \end{aligned}$$
        <p style="margin-bottom:0;"><span data-afirma="c3-m1-04">Ese es exactamente el preprocesamiento del modelo <em>airline</em> <cite class="cita" data-ref="cryer2008time" data-loc="pp. 240–241"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, pp. 240–241)</a></cite> que se verá en el Capítulo 5</span>, obtenido sin escribir una sola recursión.</p>
      </div>

      <h3>Polinomios característicos</h3>

      <p>Todos los modelos del capítulo se escriben con dos polinomios en $B$: uno del lado de la serie y otro del lado
        del ruido.</p>

      <div class="formula">
        <p data-afirma="c3-m1-05">Polinomio <strong>autorregresivo</strong> de orden $p$ y polinomio de <strong>medias móviles</strong> de
          orden $q$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>:</p>
        $$\phi(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$$
        $$\theta(B) = 1 + \theta_1 B + \cdots + \theta_q B^q$$
      </div>

      <p>Los coeficientes $\phi$ entran <strong>restando</strong> y los $\theta$ <strong>sumando</strong>. No es un
        capricho: así, al pasar todo al mismo lado, un AR queda $\phi(B)y_t = \varepsilon_t$ y un MA queda
        $y_t = \theta(B)\varepsilon_t$, con los signos «naturales» en la forma en que se escribe cada modelo (los dos
        modelos se definen en los Módulos 2 y 3; aquí solo importa la notación). Algunos textos y paquetes escriben el
        MA con el signo contrario: cómo comprobarlo, y qué otras diferencias hay entre R y Python, está al final del
        módulo.</p>

      <h3>Las raíces son la respuesta</h3>

      <p>La pregunta que resolverá el polinomio $\phi(B)$ es si el proceso es estacionario. Para responderla se trata
        $B$ como una variable compleja y se buscan las raíces de $\phi(B)=0$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de estacionariedad</h4>
        <p style="margin-bottom:0;" data-afirma="c3-m1-14">Un proceso autorregresivo es <strong>estacionario</strong> si todas las raíces de
          $\phi(B) = 0$ están <strong>fuera</strong> del círculo unitario, es decir, si $|B_i| > 1$ para toda raíz
          $B_i$ (incluyendo el módulo si la raíz es compleja) <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 76"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 76)</a></cite>.</p>
        <p style="margin-bottom:0; margin-top:0.6rem;"><span data-afirma="c3-m1-34">En este capítulo «estacionario» quiere decir además
          <strong>causal</strong>: que $y_t$ depende solo de los choques hasta $t$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 71"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 71)</a></cite></span>, que es lo que hace falta para
          pronosticar. La condición de las raíces es la de esa solución; el desarrollo de más abajo enseña qué
          queda cuando no se cumple.</p>
      </div>

      <p>La palabra <em>fuera</em> sorprende la primera vez. La intuición es que el polinomio está escrito en $B$, no
        en $1/B$: para el AR(1) $y_t = \phi y_{t-1} + \varepsilon_t$ el polinomio es $1 - \phi B$, cuya única raíz es
        $B = 1/\phi$. Que la raíz esté fuera del círculo, $|1/\phi| > 1$, es lo mismo que la condición conocida
        $|\phi| < 1$.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ar1-estacionario">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ar1-estacionario" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte del AR(1) y sustituye $y_{t-1}$ por su propia definición, una y otra vez:</p>
              $$\begin{aligned}
                y_t &= \phi y_{t-1} + \varepsilon_t \\
                &= \phi(\phi y_{t-2} + \varepsilon_{t-1}) + \varepsilon_t \\
                &= \varepsilon_t + \phi\varepsilon_{t-1} + \phi^2 y_{t-2}
              \end{aligned}$$
            </li>
            <li>
              <p>Tras $k$ sustituciones queda una suma de choques más un resto que arrastra el pasado lejano:</p>
              $$y_t = \sum_{j=0}^{k-1}\phi^j \varepsilon_{t-j} + \phi^{k} y_{t-k}$$
            </li>
            <li>
              <p>Aquí está todo el asunto. Si $|\phi| < 1$, entonces $\phi^k \to 0$ y el resto <strong>se
                  desvanece</strong>: el pasado remoto deja de influir y queda una suma convergente</p>
              $$y_t = \sum_{j=0}^{\infty}\phi^j \varepsilon_{t-j}$$
              <p>Si $|\phi| \ge 1$, el resto no desaparece: el proceso no olvida y <span data-afirma="c3-m1-15">no existe una solución
                estacionaria que dependa solo de los choques pasados <cite class="cita" data-ref="cryer2008time" data-loc="p. 71"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 71)</a></cite>. Con $|\phi| > 1$ existe otra, estacionaria
                pero escrita con los choques <em>futuros</em>, $y_t = -\sum_{j \ge 1}\phi^{-j}\varepsilon_{t+j}$:
                no sirve para pronosticar y por eso queda fuera <cite class="cita" data-ref="cryer2008time" data-loc="ejercicio 4.16"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, ejercicio 4.16)</a></cite>. Con $|\phi| = 1$ no hay ninguna <cite class="cita" data-ref="cryer2008time" data-loc="ejercicio 4.15"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, ejercicio 4.15)</a></cite></span>.</p>
            </li>
            <li>
              <p>La varianza de esa suma es una serie geométrica, y solo converge bajo la misma condición:</p>
              $$\begin{gathered}
                \operatorname{Var}(y_t) = \sigma^2\sum_{j=0}^{\infty}\phi^{2j} = \frac{\sigma^2}{1-\phi^2} \\
                \text{si } |\phi| < 1
              \end{gathered}$$
            </li>
          </ol>
          <p class="derivacion-resultado">La condición $|\phi| < 1$ es exactamente $|1/\phi| > 1$: la raíz de
            $1 - \phi B$ está fuera del círculo unitario. Y de paso apareció la representación
            $y_t = \sum_j \phi^j \varepsilon_{t-j}$, que es el <strong>MA($\infty$)</strong> del Módulo 4.</p>
        </div>
      </div>

      <div class="note">
        <p><strong>Enlace con el Capítulo 2.</strong> <span data-afirma="c3-m1-35">Cuando una raíz cae <em>exactamente</em> sobre el círculo
          ($|B| = 1$) el proceso no es estacionario <cite class="cita" data-ref="cryer2008time" data-loc="p. 76"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 76)</a></cite>. En el AR(1) eso ocurre con $\phi = 1$ y con $\phi = -1$; el
          primer caso, la raíz $B = 1$, es la <strong>caminata aleatoria</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.3"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.3)</a></cite></span>: la ACF que no decaía
          y el KPSS que rechazaba. <span data-afirma="c3-m1-16">Se dice entonces que el polinomio tiene una <em>raíz unitaria</em> <cite class="cita" data-ref="cryer2008time" data-loc="p. 128"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 128)</a></cite></span>. <span data-afirma="c3-m1-17">Diferenciar es multiplicar la serie por
          ese mismo factor $(1-B)$ <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.2"><a href="#ref-m1-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.2)</a></cite></span>: lo que queda, $\nabla y_t$, ya no tiene esa raíz.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Raíces del polinomio característico">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>

        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Raices de phi(B) = 1 - phi1*B - phi2*B^2
# polyroot() recibe los coeficientes en orden ASCENDENTE de potencia
phi &lt;- c(1.4, -0.75)
raices &lt;- polyroot(c(1, -phi))
raices
#&gt; [1] 0.9333333+0.6798693i 0.9333333-0.6798693i   (complejas conjugadas)

Mod(raices)          # modulo: debe ser &gt; 1 para que sea estacionario
#&gt; [1] 1.154701 1.154701
all(Mod(raices) &gt; 1) # veredicto
#&gt; [1] TRUE

# Un caso NO estacionario: phi = 1 es la caminata aleatoria
Mod(polyroot(c(1, -1)))
#&gt; [1] 1            (justo sobre el circulo: raiz unitaria)</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np

# numpy.roots recibe los coeficientes en orden DESCENDENTE de potencia,
# justo al reves que polyroot() de R: hay que invertir el vector.
phi = np.array([1.4, -0.75])
coef = np.r_[1.0, -phi]              # [1, -phi1, -phi2] en orden ascendente
raices = np.roots(coef[::-1])        # se invierte para numpy

print(raices)
print(np.abs(raices))                # modulo
print(bool(np.all(np.abs(raices) > 1)))

# statsmodels lo hace directamente y con el convenio correcto
from statsmodels.tsa.arima_process import ArmaProcess
proceso = ArmaProcess(np.r_[1, -phi], np.r_[1])
print(proceso.arroots, proceso.isstationary)</code></pre>
        </div>

      <div class="warning">
        <p><strong>El orden de los coeficientes cambia entre lenguajes.</strong> <span data-afirma="c3-m1-18"><code>polyroot()</code> de R los toma
          en orden <strong>ascendente</strong> de potencia <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span> y <span data-afirma="c3-m1-36"><code>np.roots()</code> de NumPy en orden
          <strong>descendente</strong></span>. Es un error silencioso: no falla, simplemente devuelve las raíces de otro
          polinomio. Si comparas resultados entre R y Python y no coinciden, empieza por aquí.</p>
      </div>
      <h3>Convenios de signo y diferencias entre R y Python</h3>

      <div class="warning">
        <p><strong>Ojo con los signos.</strong> <span data-afirma="c3-m1-07">El convenio de este capítulo —los $\phi$ restando, los $\theta$
          sumando— es <strong>el que usan R y Python</strong> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>, <span data-afirma="c3-m1-08">pero algunos textos —y algún paquete— invierten el signo
          de $\theta$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 57"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 57)</a></cite> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. Si un $\theta$ estimado te sale con el signo contrario al que esperabas, comprueba el convenio
          antes de dudar de tus datos.</p>
        <p>Conviene ver las dos escrituras enfrentadas, porque el desacuerdo es solo sobre la parte MA. El convenio de
          <strong>suma</strong> —el de este capítulo, el de R y el de <code>statsmodels</code>— escribe un MA(1) así:</p>
        $$y_t = \varepsilon_t + \theta_1\varepsilon_{t-1}$$
        <p>y <span data-afirma="c3-m1-09">el convenio de <strong>resta</strong> —el de algunos textos <cite class="cita" data-ref="cryer2008time" data-loc="p. 57"><a href="#ref-m1-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 57)</a></cite> y el de S-PLUS <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite>— lo escribe así</span>:</p>
        $$y_t = \varepsilon_t - \theta_1\varepsilon_{t-1}$$
        <p style="margin-bottom:0;" data-afirma="c3-m1-10">Es <strong>el mismo modelo</strong>, no dos modelos rivales. Ajustado a los mismos
          datos da la misma verosimilitud, los mismos residuales y los mismos pronósticos; lo único que cambia es la
          etiqueta impresa. Un $\hat\theta = 0.69$ en un convenio es $\hat\theta = -0.69$ en el otro.</p>
      </div>

      <p>Comprobar cuál usa un paquete no requiere leer su documentación: basta ajustar una serie simulada con un
        $\theta$ conocido y mirar el signo que devuelve. El bloque lo hace con un MA(1) de $\theta = +0.7$; el estimador que devuelve $\hat\theta$ es el del Módulo 7, y por ahora solo importa
        su signo. Cada lenguaje simula su propia serie, así que las cifras difieren; el signo, no.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Comprobar el convenio de signos">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Convenio de suma (el de este capitulo y el de R): un MA(1) con theta = +0.7
# tiene rho_1 = theta / (1 + theta^2), POSITIVA
round(ARMAacf(ma = 0.7, lag.max = 3), 4)
#&gt;      0      1      2      3
#&gt; 1.0000 0.4698 0.0000 0.0000

set.seed(2026)
x &lt;- arima.sim(model = list(ma = 0.7), n = 600)   # arima.sim recibe el theta del modelo
round(acf(x, plot = FALSE)$acf[2], 4)             # r_1 muestral: positiva, como rho_1
#&gt; [1] 0.4614

# El estimador (Modulo 7) devuelve el signo que usa el paquete
round(coef(arima(x, order = c(0, 0, 1), include.mean = FALSE)), 4)
#&gt;    ma1
#&gt; 0.6887

# ma1 sale POSITIVO: convenio de suma, el mismo del capitulo.
# La ayuda de ?arima imprime la ecuacion con signos + en la parte MA y
# advierte que por eso sus coeficientes tienen el signo contrario a los
# de la documentacion de S-PLUS.

# En R no hay asimetria: arima.sim() y arima() hablan el mismo idioma,
# el de los COEFICIENTES del modelo. Lo que se pone es lo que sale.</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess, arma_acf
from statsmodels.tsa.arima.model import ARIMA

# Convenio de suma tambien en statsmodels: rho_1 positiva para theta = +0.7
print(np.round(arma_acf(np.r_[1], np.r_[1, 0.7], lags=4), 4))
# [1.     0.4698 0.     0.    ]

# Cada lenguaje simula su propia serie: las cifras difieren de las de R, el signo no
x = ArmaProcess(np.r_[1], np.r_[1, 0.7]).generate_sample(
    nsample=600, distrvs=np.random.default_rng(3).standard_normal)
print(round(float(np.corrcoef(x[1:], x[:-1])[0, 1]), 4))   # r_1 muestral
# 0.4575
fit = ARIMA(x, order=(0, 0, 1), trend="n").fit()
print(fit.param_names, fit.params.round(4))
# ['ma.L1', 'sigma2'] [0.6979 0.9847]    &lt;- ma.L1 POSITIVO, como en R

# PERO al SIMULAR un AR, statsmodels no pide los coeficientes del modelo sino
# los del POLINOMIO. Como phi(B) = 1 - phi1*B, el AR va NEGADO:
bien = ArmaProcess(ar=np.array([1, -0.6]), ma=np.array([1]))
mal  = ArmaProcess(ar=np.array([1,  0.6]), ma=np.array([1]))

print(bien.arcoefs, np.round(bien.acf(5)[1:], 4))
# [0.6]  [0.6    0.36   0.216  0.1296]    &lt;- lo que se queria
print(mal.arcoefs,  np.round(mal.acf(5)[1:], 4))
# [-0.6] [-0.6    0.36  -0.216   0.1296]   &lt;- otro proceso, sin avisar</code></pre>
        </div>
      </div>

      <div class="note">
        <p><strong>La regla que ahorra la tarde.</strong> <span data-afirma="c3-m1-12">En R los coeficientes son coeficientes del modelo tanto al estimar como al simular (<code>arima()</code> y <code>arima.sim()</code>) <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m1-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. <span data-afirma="c3-m1-11">En
          Python son coeficientes al <em>estimar</em> y coeficientes del <em>polinomio</em> al <em>simular</em>, de
          modo que la parte AR cambia de signo al pasar de <code>ARIMA(...)</code> a <code>ArmaProcess(...)</code></span>.
          Escribir <code>ar=[1, 0.6]</code> en vez de <code>ar=[1, -0.6]</code> no produce ningún error: produce
          calladamente un proceso con $\phi = -0.6$, cuya ACF alterna de signo ($-0.600,\ 0.360,\ -0.216,\ldots$) en
          lugar de decaer sin cambiarlo desde $0.600$. Es el mismo tipo de fallo silencioso que el del orden de los
          coeficientes en <code>polyroot()</code> y <code>np.roots()</code>, que está unas líneas más arriba.</p>
        <p style="margin-bottom:0;">Y si el paquete es desconocido y no hay documentación a mano, queda el
          correlograma como árbitro: <span data-afirma="c3-m1-13">en un MA(1) bajo el convenio de suma se cumple
          $\rho_1 = \theta/(1+\theta^2)$ <cite class="cita" data-ref="hamilton1994time" data-loc="p. 49"><a href="#ref-m1-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 49)</a></cite></span>, así que $r_1$ y $\hat\theta$ <strong>tienen que salir con el mismo
            signo</strong>. Si el ajuste devuelve $\hat\theta = -0.70$ sobre una serie cuyo $r_1$ vale $+0.50$, no hay
          nada roto en los datos: es el convenio de resta.</p>
      </div>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Dos modelos están escritos como recursión, con $\varepsilon_t$ ruido blanco. El modelo A es $y_t = 1.1\,y_{t-1} - 0.3\,y_{t-2} + \varepsilon_t + 0.4\,\varepsilon_{t-1}$, y el modelo B, $y_t = 1.5\,y_{t-1} - 0.5\,y_{t-2} + \varepsilon_t$. Entrega cuatro cosas:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>Cada modelo en la forma $\phi(B)\,y_t = \theta(B)\,\varepsilon_t$, con los dos polinomios escritos término a término.</li>
            <li>Las raíces de $\phi(B) = 0$ en el modelo A, a mano (es una ecuación de segundo grado), y el veredicto: ¿es estacionario?</li>
            <li>Alguien escribe el polinomio autorregresivo de A como $1 - 1.1B - 0.3B^2$. Calcula las raíces de ese polinomio y escribe la recursión a la que corresponde de verdad.</li>
            <li>El polinomio $\phi(B)$ del modelo B, factorizado. ¿Qué dice uno de sus dos factores, y qué modelo sigue $\nabla y_t$?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m1-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m1-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m1-pista" hidden>
            <p style="margin:0;">Pasa al lado izquierdo todo lo que lleve $y$ y deja en el derecho lo que lleve $\varepsilon$; después cambia cada $y_{t-k}$ por $B^k y_t$ y saca factor común. Los signos se deciden en ese paso, no después. Para factorizar un polinomio de segundo grado sirven sus raíces: si son $B_1$ y $B_2$, el polinomio es $(1 - B/B_1)(1 - B/B_2)$.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m1-sol" hidden>
            <p><strong>Respuesta: A es estacionario, con raíces $1.667$ y $2$; el polinomio con el signo cambiado es otro proceso, que no lo es; y B tiene una raíz unitaria: es un AR(1) sobre $\nabla y_t$.</strong></p>
            <pre><code class="language-r"># (a) Los polinomios del modelo A, con los coeficientes en orden
#     ASCENDENTE de potencia
phi_A   &lt;- c(1, -1.1, 0.3)      # phi(B)   = 1 - 1.1 B + 0.3 B^2
theta_A &lt;- c(1, 0.4)            # theta(B) = 1 + 0.4 B

# (b) Raices de phi(B) = 0 y veredicto
round(Re(polyroot(phi_A)), 4)
#&gt; [1] 1.6667 2.0000
all(Mod(polyroot(phi_A)) &gt; 1)
#&gt; [1] TRUE

# (c) El signo de phi_2 sin cambiar: 1 - 1.1 B - 0.3 B^2 es OTRO proceso
round(Re(polyroot(c(1, -1.1, -0.3))), 4)
#&gt; [1]  0.7540 -4.4207
# ... y el otro fallo silencioso, el del orden: con los coeficientes al
# reves, polyroot() da las raices de 0.3 - 1.1 B + B^2, que son las inversas
round(Re(polyroot(rev(phi_A))), 4)
#&gt; [1] 0.5 0.6

# (d) El modelo B: phi(B) = 1 - 1.5 B + 0.5 B^2
round(Re(polyroot(c(1, -1.5, 0.5))), 4)
#&gt; [1] 1 2
# (1 - B)(1 - 0.5 B), multiplicado termino a termino, es el mismo polinomio
c(1, -1 - 0.5, (-1) * (-0.5))
#&gt; [1]  1.0 -1.5  0.5</code></pre>
            <p><strong>(a)</strong> Con las $y$ a la izquierda, A queda $y_t - 1.1\,y_{t-1} + 0.3\,y_{t-2} = \varepsilon_t + 0.4\,\varepsilon_{t-1}$, es decir, $\phi(B) = 1 - 1.1B + 0.3B^2$ y $\theta(B) = 1 + 0.4B$. El $-0.3$ de la recursión aparece <strong>sumando</strong> en $\phi(B)$ y el $+0.4$ de los choques conserva su signo: los $\phi$ entran restando y los $\theta$, sumando. En B, $\phi(B) = 1 - 1.5B + 0.5B^2$ y $\theta(B) = 1$.</p>
            <p><strong>(b)</strong> $0.3B^2 - 1.1B + 1 = 0$ tiene discriminante $1.21 - 1.2 = 0.01$, así que $B = (1.1 \pm 0.1)/0.6$: las raíces son $1.667$ y $2$. Las dos caen fuera del círculo unitario y A es estacionario. La raíz de $\theta(B)$, que es $-2.5$, no interviene en esa pregunta.</p>
            <p><strong>(c)</strong> $1 - 1.1B - 0.3B^2$ tiene raíces $0.754$ y $-4.421$, y la primera cae <em>dentro</em> del círculo. Es el polinomio de $y_t = 1.1\,y_{t-1} + 0.3\,y_{t-2} + \cdots$, otro proceso, que no es estacionario. Nada avisa del cambio: el signo se pierde al escribir, no al calcular. Hay un segundo fallo igual de silencioso, el del orden: con los coeficientes al revés, <code>polyroot()</code> devuelve $0.5$ y $0.6$, las inversas de las raíces de A, y el veredicto sale al contrario.</p>
            <p style="margin-bottom:0;"><strong>(d)</strong> Las raíces son $1$ y $2$, así que $\phi(B) = (1 - B)(1 - 0.5B)$. El factor $(1 - B)$ es una raíz unitaria: B no es estacionario. Pero $(1 - B)\,y_t$ es $\nabla y_t$, de modo que el modelo dice $(1 - 0.5B)\,\nabla y_t = \varepsilon_t$: la serie diferenciada sigue $\nabla y_t = 0.5\,\nabla y_{t-1} + \varepsilon_t$, cuyo polinomio tiene la raíz $2$, fuera del círculo. Es el enlace con el Capítulo 2 leído en el otro sentido: la diferencia no se aplica a los datos, se encuentra dentro del polinomio.</p>
          </div>
        </div>
      </div>

  <!-- MÓDULO 2 · Procesos AR(p)                                     -->
  <!-- ============================================================ -->
  <template id="module-2">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 2</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.2 Procesos autorregresivos
          <span class="text-gray-400 font-normal text-2xl">/ Autoregressive processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer un AR($p$) por su firma: <strong>PACF que se
                corta</strong> en el rezago $p$ y ACF que decae. Saber cuándo es estacionario y calcular sus
              momentos: media, varianza y autocorrelaciones.</p>
          </div>
        </div>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso AR($p$)</h4>
        <p data-afirma="c3-m2-01">Un proceso <strong>autorregresivo de orden $p$</strong> explica el valor actual como una combinación lineal
          de sus $p$ valores anteriores más un choque de ruido blanco <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.3"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.3)</a></cite>:</p>
        $$\begin{aligned}
          y_t &= c + \phi_1 y_{t-1} + \phi_2 y_{t-2} + \cdots \\
          &\quad + \phi_p y_{t-p} + \varepsilon_t
        \end{aligned}$$
        $$\varepsilon_t \sim \text{RB}(0,\sigma^2)$$
        <p style="margin-bottom:0;">En forma compacta, $\phi(B)\, y_t = c + \varepsilon_t$. La abreviatura
          $\text{RB}(0,\sigma^2)$ es la del ruido blanco del Capítulo 2: media cero y varianza $\sigma^2$.</p>
      </div>

      <p><span data-afirma="c3-m2-30">El nombre lo dice todo: es una <strong>regresión de la serie sobre sí misma</strong>. Si se sustituye $y_{t-1}$ por $x_1$, $y_{t-2}$ por $x_2$ y así, queda una regresión múltiple corriente <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.3"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.3)</a></cite></span>. <span data-afirma="c3-m2-02">La diferencia —y no es
        menor— es que los regresores no son fijos: son la propia variable desplazada, y por eso no valen los resultados de muestra finita de la regresión clásica: el estimador de mínimos cuadrados es sesgado y los estadísticos $t$ y $F$ habituales solo se justifican de forma asintótica <cite class="cita" data-ref="hamilton1994time" data-loc="p. 215"><a href="#ref-m2-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 215)</a></cite></span>.</p>

      <div class="note">
        <p><strong>Sobre la constante.</strong> <span data-afirma="c3-m2-03">$c$ no es la media del proceso. Tomando esperanzas en la definición y
          usando que $E[y_t] = \mu$ para todo $t$ (estacionariedad), se obtiene
          $\mu = c/(1 - \phi_1 - \cdots - \phi_p)$ <cite class="cita" data-ref="hamilton1994time" data-loc="p. 59"><a href="#ref-m2-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 59)</a></cite></span>. <span data-afirma="c3-m2-04">Por eso <code>arima()</code> de R reporta una columna
          <code>intercept</code> que en realidad es $\hat\mu$, <strong>no</strong> $\hat c$ <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m2-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. Es una de las confusiones
          más frecuentes al leer una salida.</p>
      </div>

      <h3>La firma del AR: la PACF se corta</h3>

      <p>Recuerda del Capítulo 2 que la PACF mide la correlación <em>directa</em> entre $y_t$ y $y_{t-k}$, descontando
        los rezagos intermedios. En un AR($p$), toda la dependencia directa está en los $p$ primeros rezagos, por
        construcción. Más allá de $p$ no queda nada que descontar.</p>

      <div class="formula">
        <p style="margin-bottom:0;">Para un proceso AR($p$): <span data-afirma="c3-m2-05">$\;\phi_{kk} = 0\;$ para todo $k > p$, <strong>exactamente
            cero</strong>, no aproximadamente; y la última barra distinta de cero, la del rezago $p$, vale el propio
            coeficiente: $\phi_{pp} = \phi_p$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 114"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 114)</a></cite></span>. <span data-afirma="c3-m2-06">La ACF, en cambio, decae hacia cero sin cortarse nunca <cite class="cita" data-ref="cryer2008time" data-loc="p. 73"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 73)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span>.</p>
      </div>

      <div class="simulador" data-simulador="panel-ar-teorico">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Las cuatro firmas del AR</h4>
        <p class="simulador-intro">ACF y PACF <strong>teóricas</strong> —calculadas con <code>ARMAacf()</code>, no
          simuladas— de cuatro procesos autorregresivos. Fíjate en que la PACF cae a cero de golpe después del
          rezago $p$ —la barra de $p$ es la última distinta de cero— y se queda ahí, mientras la ACF nunca termina
          de cortarse.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">ACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación teórica del proceso seleccionado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación parcial teórica del proceso seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <p>Los cuatro casos merecen un comentario. Con $\phi = 0.8$ la ACF decae despacio y siempre positiva
        ($0.800,\,0.640,\,0.512,\ldots$: son las potencias de $0.8$). Con $\phi = -0.7$ decae
        <strong>alternando de signo</strong> ($-0.700,\,0.490,\,-0.343,\ldots$), que es la firma de un proceso que
        rebota. El AR(2) con raíces reales decae de forma monótona. Y el AR(2) con
        $\phi = (1.4,\,-0.75)$ produce algo nuevo: una ACF que <strong>oscila</strong>
        ($0.800,\,0.370,\,-0.082,\,-0.392$), cruzando el cero y volviendo. <span data-afirma="c3-m2-08">Esa oscilación es un
        <em>pseudo-ciclo</em> —su longitud, que da la fórmula de más abajo, es el <em>pseudo-periodo</em> <cite class="cita" data-ref="cryer2008time" data-loc="p. 74"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 74)</a></cite>—</span>, y es el
        fenómeno que hará interesante el caso real de las manchas solares, que entra en el Módulo 7 y se cierra en el
        9.</p>

      <h3>El triángulo de estacionariedad del AR(2)</h3>

      <p>Para $p = 1$ la condición es simplemente $|\phi_1| < 1$. Para $p = 2$, aplicar la condición de las raíces se
        traduce en tres desigualdades que recortan un triángulo en el plano $(\phi_1, \phi_2)$.</p>

      <div class="formula">
        <p data-afirma="c3-m2-10">Un AR(2) es estacionario —y causal, en el sentido del Módulo 1— si y solo si el par
          $(\phi_1,\phi_2)$ cumple las tres condiciones <cite class="cita" data-ref="cryer2008time" data-loc="p. 72"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 72)</a></cite> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.3"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.3)</a></cite>:</p>
        $$\begin{gathered}
          \phi_1 + \phi_2 < 1 \\
          \phi_2 - \phi_1 < 1 \\
          -1 < \phi_2 < 1
        \end{gathered}$$
      </div>

      <div class="simulador" data-simulador="triangulo-ar2">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> El triángulo de estacionariedad</h4>
        <p class="simulador-intro">Mueve $\phi_1$ y $\phi_2$ y observa dónde cae el punto. Dentro del triángulo el
          proceso es estacionario; bajo la parábola $\phi_1^2 + 4\phi_2 = 0$ las raíces son <strong>complejas</strong> y
          la serie desarrolla un pseudo-ciclo cuyo pseudo-periodo aparece en la lectura. Prueba
          $\phi_1 = 1.40$ y $\phi_2 = -0.69$, que es —redondeado al paso del deslizador— el modelo con que termina el
          caso de las manchas solares (la serie entra en el Módulo 7 y el modelo final se obtiene en el 9): sale un
          pseudo-ciclo de unos 11 periodos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Región de estacionariedad</p>
        <div class="grafico-wrapper" style="height:280px;">
          <canvas aria-label="Triángulo de estacionariedad del AR(2) con el punto (φ₁, φ₂) marcado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Realización simulada del proceso</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Serie simulada del proceso AR(2) seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>Raíces complejas y ciclos.</strong> <span data-afirma="c3-m2-12">Cuando $\phi_1^2 + 4\phi_2 < 0$ las raíces son complejas
          conjugadas <cite class="cita" data-ref="cryer2008time" data-loc="pp. 73–74"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, pp. 73–74)</a></cite> y la ACF oscila con un pseudo-periodo $P$ de</span></p>
        $$P = \frac{2\pi}{\arccos\!\left(\dfrac{\phi_1}{2\sqrt{-\phi_2}}\right)}$$
        <p style="margin-bottom:0;">Es un ciclo <em>estocástico</em>: ni la longitud ni la amplitud se repiten
          exactamente, a diferencia de la estacionalidad determinista del Capítulo 1. Por eso <span data-afirma="c3-m2-14">un ciclo económico se
          modela así <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m2-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite></span> y una estacionalidad mensual no.</p>
      </div>


      <h3>Media, varianza y autocorrelación</h3>

      <p>Hasta aquí el AR($p$) se ha descrito por su forma y por su firma, pero no se han escrito sus momentos. Son
        tres y los tres hacen falta más adelante: la media para leer la columna <code>intercept</code> de una salida,
        la varianza para los intervalos de pronóstico (que deduce el Capítulo 4), y las autocorrelaciones para identificar el
        orden.</p>

      <div class="formula" data-afirma="c3-m2-15">
        <p>Media, varianza y autocorrelaciones de un AR($p$) estacionario <cite class="cita" data-ref="cryer2008time" data-loc="pp. 76–77"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, pp. 76–77)</a></cite> <cite class="cita" data-ref="hamilton1994time" data-loc="p. 59"><a href="#ref-m2-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 59)</a></cite>:</p>
        $$\begin{aligned}
          \mu &= \frac{c}{1-\phi_1-\phi_2-\cdots-\phi_p} \\[0.8em]
          \gamma_0 &= \operatorname{Var}(y_t) \\[0.3em]
          &= \frac{\sigma^2}{1 - \phi_1\rho_1 - \phi_2\rho_2 - \cdots - \phi_p\rho_p} \\[0.8em]
          \rho_k &= \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p}
        \end{aligned}$$
        <p style="margin-bottom:0;">La recursión vale para $k \ge 1$, con $\rho_0 = 1$ y $\rho_{-k} = \rho_k$.</p>
      </div>

      <p>Conviene notar la diferencia con el MA del módulo siguiente, donde la varianza se escribe de una vez en
        función de los $\theta$. Aquí no: la varianza del AR está escrita en función de las propias
        autocorrelaciones, así que el orden de cálculo es obligatorio —primero la recursión, que se resuelve sola a
        partir de $\rho_0 = 1$, y con sus soluciones la varianza—. Para los dos órdenes que se usan en la práctica
        ese trabajo ya está hecho.</p>

      <div class="formula" data-afirma="c3-m2-16">
        <p><strong>AR(1)</strong>, con $|\phi| < 1$ <cite class="cita" data-ref="hamilton1994time" data-loc="pp. 53–54"><a href="#ref-m2-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, pp. 53–54)</a></cite>:</p>
        $$\rho_k = \phi^{\,k}, \qquad \gamma_0 = \frac{\sigma^2}{1-\phi^2}$$
        <p><strong>AR(2)</strong>, con $(\phi_1,\phi_2)$ dentro del triángulo <cite class="cita" data-ref="cryer2008time" data-loc="p. 73"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 73)</a></cite> <cite class="cita" data-ref="cryer2008time" data-loc="p. 75"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 75)</a></cite>:</p>
        $$\begin{gathered}
          \rho_1 = \frac{\phi_1}{1-\phi_2}, \quad \rho_2 = \phi_2 + \frac{\phi_1^2}{1-\phi_2} \\[0.6em]
          \rho_k = \phi_1\rho_{k-1} + \phi_2\rho_{k-2} \quad (k \ge 3)
        \end{gathered}$$
        $$\begin{aligned}
          \gamma_0 &= \frac{(1-\phi_2)\,\sigma^2}{(1+\phi_2)\bigl[(1-\phi_2)^2 - \phi_1^2\bigr]} \\[0.6em]
            &= \frac{(1-\phi_2)\,\sigma^2}{\begin{gathered}(1+\phi_2)(1-\phi_1-\phi_2) \\ \cdot\,(1+\phi_1-\phi_2)\end{gathered}}
        \end{aligned}$$
      </div>

      <p>La fórmula del AR(1) es la que explica las cifras del primer simulador: $\rho_k = \phi^k$ es literalmente
        «las potencias de $\phi$», positivas y decrecientes cuando $\phi &gt; 0$ ($0.800,\,0.640,\,0.512,\ldots$) y
        alternando de signo cuando $\phi &lt; 0$ ($-0.700,\,0.490,\,-0.343,\ldots$). Y explica también por qué la ACF
        de un AR no se corta nunca: una potencia de un número menor que uno en valor absoluto se acerca a cero, pero
        no llega. Ese contraste con el $\phi_{kk} = 0$ exacto de la PACF es toda la firma del AR.</p>

      <p>La varianza dice algo más. Con $\sigma^2$ fijo, $\gamma_0 = \sigma^2/(1-\phi^2)$ crece sin límite a
        medida que $\phi$ se acerca a $1$: un proceso muy persistente amplifica el mismo ruido hasta una serie que
        se aleja mucho más de su media. Es la versión cuantitativa de lo que se ve al mover el deslizador hacia el
        borde del triángulo.</p>

      <div class="note">
        <p style="margin-bottom:0;" data-afirma="c3-m2-17"><strong>El denominador es el triángulo.</strong> Los tres factores de la varianza
          del AR(2) son, uno por uno, las tres desigualdades de la sección anterior: $1-\phi_1-\phi_2$,
          $1+\phi_1-\phi_2$ y $1+\phi_2$. Dentro del triángulo los tres son positivos y $\gamma_0$ es finita;
          sobre cualquiera de los tres lados alguno se anula y la varianza estalla. La región de estacionariedad no
          es entonces una convención algebraica sobre unas raíces: es exactamente el conjunto de parámetros con los
          que existe un proceso de varianza finita que depende solo de los choques pasados.</p>
      </div>

      <h3>Las ecuaciones de Yule–Walker</h3>

      <p>¿De dónde salen esas fórmulas? <span data-afirma="c3-m2-18">De un mismo sistema de ecuaciones, el de Yule–Walker, que relaciona los $\phi$ con las autocovarianzas del proceso <cite class="cita" data-ref="cryer2008time" data-loc="p. 76"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 76)</a></cite></span>, y que además será nuestro primer método de estimación en el Módulo 7.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-yule-walker">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-yule-walker" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Escribe el AR($p$) centrado (sin pérdida de generalidad, con $\mu = 0$) y multiplica los dos lados por
                $y_{t-k}$, con $k \ge 1$:</p>
              $$\begin{aligned}
                y_t\, y_{t-k} &= \phi_1 y_{t-1}y_{t-k} + \cdots \\
                &\quad + \phi_p y_{t-p}y_{t-k} + \varepsilon_t y_{t-k}
              \end{aligned}$$
            </li>
            <li>
              <p>Toma esperanzas. Cada término $E[y_{t-i}y_{t-k}]$ es una autocovarianza $\gamma_{k-i}$. <span data-afirma="c3-m2-19">El término del
                ruido <strong>se anula</strong>: $\varepsilon_t$ es independiente de todo lo anterior a $t$, y
                $k \ge 1$ garantiza que $y_{t-k}$ pertenece al pasado <cite class="cita" data-ref="cryer2008time" data-loc="p. 72"><a href="#ref-m2-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 72)</a></cite></span>.</p>
              $$\gamma_k = \phi_1\gamma_{k-1} + \cdots + \phi_p\gamma_{k-p}$$
            </li>
            <li>
              <p>Divide todo entre $\gamma_0$. Como $\rho_k = \gamma_k/\gamma_0$, la misma recursión vale para las
                autocorrelaciones — y esta es la forma en que se usa:</p>
              $$\begin{gathered}
                \rho_k = \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p} \\
                \text{para } k \ge 1
              \end{gathered}$$
            </li>
            <li>
              <p>Escribiendo esa relación para $k = 1,\ldots,p$ y usando $\rho_{-k} = \rho_k$ queda un sistema lineal
                de $p$ ecuaciones con $p$ incógnitas. Para el AR(2):</p>
              $$\begin{aligned}
                \rho_1 &= \phi_1 + \phi_2\rho_1 \\
                \rho_2 &= \phi_1\rho_1 + \phi_2
              \end{aligned}$$
              <p>que se resuelve en</p>
              $$\begin{aligned}
                \rho_1 &= \frac{\phi_1}{1-\phi_2} \\[0.4em]
                \rho_2 &= \phi_2 + \frac{\phi_1^2}{1-\phi_2}
              \end{aligned}$$
            </li>
            <li>
              <p>Falta la varianza, y sale de la misma cuenta con $k = 0$. La única diferencia es que ahora el término
                del ruido <strong>no</strong> se anula: $y_t$ sí contiene a $\varepsilon_t$, y como el choque es
                incorrelado con todo el pasado queda $E[\varepsilon_t y_t] = E[\varepsilon_t^2] = \sigma^2$.</p>
              $$\gamma_0 = \phi_1\gamma_1 + \cdots + \phi_p\gamma_p + \sigma^2$$
              <p>Sustituyendo $\gamma_k = \rho_k\,\gamma_0$ y despejando se llega a la varianza del proceso:</p>
              $$\gamma_0 = \frac{\sigma^2}{1 - \phi_1\rho_1 - \cdots - \phi_p\rho_p}$$
              <p style="margin-bottom:0;">Para el AR(1) basta con $\rho_1 = \phi$ para recuperar
                $\gamma_0 = \sigma^2/(1-\phi^2)$, que en el Módulo 1 había salido por otro camino, sumando la serie
                geométrica de la representación MA($\infty$).</p>
            </li>
          </ol>
          <p class="derivacion-resultado">El sistema se puede leer en las dos direcciones. De los $\phi$ a las $\rho$
            da la <strong>ACF teórica</strong> (lo que dibuja el simulador). De las $\rho$ muestrales a los $\phi$ da el
            <strong>estimador de Yule–Walker</strong> del Módulo 7. Compruébalo con el AR(2) de
            $\phi = (0.5,\,0.3)$: $\rho_1 = 0.5/0.7 = 0.714$ y $\rho_2 = 0.3 + 0.25/0.7 = 0.657$, exactamente las
            cifras del simulador. Y con esas dos, la varianza:
            $\gamma_0 = \sigma^2/(1 - 0.5(0.714) - 0.3(0.657)) = 2.244\,\sigma^2$, más del doble de la del ruido
            que lo alimenta.</p>
        </div>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="ACF y PACF teóricas de un AR">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># ACF y PACF TEORICAS (exactas, no simuladas)
phi &lt;- c(0.5, 0.3)

round(ARMAacf(ar = phi, lag.max = 5)[-1], 4)          # se quita el rezago 0
#&gt; [1] 0.7143 0.6571 0.5429 0.4686 0.3971

round(ARMAacf(ar = phi, lag.max = 5, pacf = TRUE), 4) # PACF
#&gt; [1] 0.7143 0.3000 0.0000 0.0000 0.0000
#   la PACF se corta EXACTAMENTE en el rezago p = 2, y su ultima barra, 0.3000, es phi_2

# Comprobacion de la formula de Yule-Walker para el AR(2)
rho1 &lt;- phi[1] / (1 - phi[2])
rho2 &lt;- phi[2] + phi[1]^2 / (1 - phi[2])
round(c(rho1, rho2), 4)
#&gt; [1] 0.7143 0.6571

# Varianza del proceso: ecuacion de Yule-Walker con k = 0
sigma2 &lt;- 1
rho    &lt;- ARMAacf(ar = phi, lag.max = 2)[-1]
round(sigma2 / (1 - sum(phi * rho)), 4)
#&gt; [1] 2.2436

# La misma, por la formula cerrada del AR(2)
round(sigma2 * (1 - phi[2]) /
        ((1 + phi[2]) * ((1 - phi[2])^2 - phi[1]^2)), 4)
#&gt; [1] 2.2436

# Estacionariedad
all(Mod(polyroot(c(1, -phi))) &gt; 1)
#&gt; [1] TRUE</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess, arma_acf, arma_pacf

phi = np.array([0.5, 0.3])
ar = np.r_[1, -phi]      # convenio de statsmodels: 1 - phi1 B - phi2 B^2
ma = np.r_[1]

print(np.round(arma_acf(ar, ma, lags=6)[1:], 4))
# [0.7143 0.6571 0.5429 0.4686 0.3971]

print(np.round(arma_pacf(ar, ma, lags=6)[1:], 4))
# [ 0.7143  0.3    -0.      0.     -0.    ]
#   los "-0." son ceros con signo negativo del punto flotante: la PACF
#   se corta igual de exactamente que en R

# Varianza del proceso: ecuacion de Yule-Walker con k = 0
sigma2 = 1.0
rho = arma_acf(ar, ma, lags=3)[1:]
print(round(sigma2 / (1 - phi @ rho), 4))          # 2.2436

# La misma, por la formula cerrada del AR(2)
print(round(sigma2 * (1 - phi[1]) /
            ((1 + phi[1]) * ((1 - phi[1])**2 - phi[0]**2)), 4))   # 2.2436

proceso = ArmaProcess(ar, ma)
print(proceso.isstationary)   # True</code></pre>
        </div>
      </div>
      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Un AR(2) tiene $c = 4$, $\phi_1 = 0.8$, $\phi_2 = -0.6$ y $\sigma^2 = 3$: $y_t = 4 + 0.8\,y_{t-1} - 0.6\,y_{t-2} + \varepsilon_t$. Con papel y calculadora, entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>La comprobación de que es estacionario y de si sus raíces son reales o complejas; si son complejas, el pseudo-periodo.</li>
            <li>La media $\mu$ y las autocorrelaciones $\rho_1$, $\rho_2$ y $\rho_3$.</li>
            <li>La varianza $\gamma_0$, por la fórmula general y por la fórmula cerrada del AR(2).</li>
            <li>Una comprobación en R: <code>ARMAacf()</code> para las autocorrelaciones, y la media y la varianza muestrales de una realización de 100 000 valores.</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m2-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m2-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m2-pista" hidden>
            <p style="margin:0;">Sitúa primero el punto $(\phi_1, \phi_2)$ en el triángulo. Para los momentos, sigue el orden que el módulo llama obligatorio, y antes de escribir la media vuelve a la nota sobre la constante. En (d), <code>arima.sim()</code> simula el proceso con media cero y recibe en <code>sd</code> la desviación estándar del ruido, no su varianza.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m2-sol" hidden>
            <p><strong>Respuesta: es estacionario, con raíces complejas y un pseudo-periodo de $6.11$ periodos; $\mu = 5$, $\rho_1 = 0.5$, $\rho_2 = -0.2$, $\rho_3 = -0.46$ y $\gamma_0 = 6.25$.</strong></p>
            <pre><code class="language-r">phi &lt;- c(0.8, -0.6); const &lt;- 4; sigma2 &lt;- 3

# (a) El triangulo, las raices y el pseudo-periodo
c(phi[1] + phi[2] &lt; 1, phi[2] - phi[1] &lt; 1, abs(phi[2]) &lt; 1)
#&gt; [1] TRUE TRUE TRUE
phi[1]^2 + 4 * phi[2]                 # negativo: raices complejas
#&gt; [1] -1.76
round(Mod(polyroot(c(1, -phi))), 4)
#&gt; [1] 1.291 1.291
round(2 * pi / acos(phi[1] / (2 * sqrt(-phi[2]))), 2)
#&gt; [1] 6.11

# (b) La media y las tres primeras autocorrelaciones
const / (1 - sum(phi))
#&gt; [1] 5
rho1 &lt;- phi[1] / (1 - phi[2])
rho2 &lt;- phi[2] + phi[1]^2 / (1 - phi[2])
rho3 &lt;- phi[1] * rho2 + phi[2] * rho1
c(rho1 = rho1, rho2 = rho2, rho3 = rho3)
#&gt;  rho1  rho2  rho3
#&gt;  0.50 -0.20 -0.46
round(ARMAacf(ar = phi, lag.max = 3)[-1], 4)
#&gt;     1     2     3
#&gt;  0.50 -0.20 -0.46

# (c) La varianza, por los dos caminos
sigma2 / (1 - phi[1] * rho1 - phi[2] * rho2)
#&gt; [1] 6.25
sigma2 * (1 - phi[2]) / ((1 + phi[2]) * ((1 - phi[2])^2 - phi[1]^2))
#&gt; [1] 6.25

# (d) Una realizacion larga: la media y la varianza muestrales
set.seed(32)
y &lt;- const / (1 - sum(phi)) +
  arima.sim(n = 100000, model = list(ar = phi), sd = sqrt(sigma2))
round(c(media = mean(y), varianza = var(y)), 2)
#&gt;    media varianza
#&gt;     5.01     6.31</code></pre>
            <p><strong>(a)</strong> Las tres desigualdades del triángulo se cumplen: $\phi_1 + \phi_2 = 0.2 < 1$, $\phi_2 - \phi_1 = -1.4 < 1$ y $|\phi_2| = 0.6 < 1$. Como $\phi_1^2 + 4\phi_2 = -1.76$ es negativo, las raíces son complejas (de módulo $1.291$) y la ACF oscila con un pseudo-periodo de $2\pi/\arccos(0.5164) = 2\pi/1.0282 = 6.11$ periodos.</p>
            <p><strong>(b)</strong> $\mu = c/(1 - \phi_1 - \phi_2) = 4/0.8 = 5$, y no $4$: la constante no es la media. $\rho_1 = 0.8/1.6 = 0.5$; $\rho_2 = -0.6 + 0.64/1.6 = -0.2$; y con la recursión, $\rho_3 = 0.8\,(-0.2) - 0.6\,(0.5) = -0.46$. La ACF cambia de signo en el segundo rezago: es la oscilación que anunciaban las raíces complejas.</p>
            <p><strong>(c)</strong> $\gamma_0 = \sigma^2/(1 - \phi_1\rho_1 - \phi_2\rho_2) = 3/(1 - 0.4 - 0.12) = 3/0.48 = 6.25$. Por la fórmula cerrada, $(1.6 \times 3)/(0.4 \times 1.92) = 4.8/0.768 = 6.25$. El proceso tiene algo más del doble de la varianza del ruido que lo alimenta.</p>
            <p style="margin-bottom:0;"><strong>(d)</strong> <code>ARMAacf()</code> devuelve las mismas tres autocorrelaciones. La realización de 100 000 valores da una media de $5.01$ y una varianza de $6.31$: cerca de $5$ y de $6.25$, y no iguales, porque son estimaciones.</p>
          </div>
        </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.3 Procesos de medias móviles
          <span class="text-gray-400 font-normal text-2xl">/ Moving average processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;" data-afirma="c3-m3-32">Reconocer un MA($q$) por su firma —<strong>ACF que se
                corta</strong> tras el rezago $q$— y entender qué es la invertibilidad y por qué el software la impone por defecto.</p>
          </div>
        </div>
      </div>

      <p>El Módulo 2 construyó cada valor de la serie con su propio pasado: en un AR, $y_t$ depende de
        $y_{t-1}, \ldots, y_{t-p}$, y por eso un choque nunca se olvida del todo; su efecto se desvanece, pero sigue
        ahí. Hay otra manera de dar memoria a una serie, que es hacerla depender del pasado de los
        <strong>choques</strong> en lugar del de la serie. Lo que sale se comporta al revés que el AR: olvida por
        completo lo ocurrido hace más de $q$ periodos, y eso deja una firma igual de nítida, pero en la otra función.</p>

      <div class="definition" data-afirma="c3-m3-01">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso MA($q$)</h4>
        <p>Un proceso de <strong>medias móviles de orden $q$</strong> expresa el valor actual como una combinación
          lineal del choque presente y de los $q$ choques anteriores <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.4"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.4)</a></cite>:</p>
        $$\begin{aligned}
          y_t &= \mu + \varepsilon_t + \theta_1\varepsilon_{t-1} + \cdots \\
          &\quad + \theta_q\varepsilon_{t-q}
        \end{aligned}$$
        <p style="margin-bottom:0;">En forma compacta, $y_t = \mu + \theta(B)\,\varepsilon_t$.</p>
      </div>

      <div class="warning">
        <p><strong>El nombre engaña.</strong> Un proceso de "medias móviles" <em>no</em> es la media móvil de
          suavizamiento del Capítulo 1. Aquella promediaba <strong>valores observados</strong> de la serie; esta
          combina <strong>choques no observados</strong> del ruido, y los pesos $\theta_j$ ni suman uno ni tienen por
          qué ser positivos. <span data-afirma="c3-m3-02">Coinciden en el nombre, no en el uso: un modelo de medias móviles sirve para pronosticar valores futuros, y el suavizamiento, para estimar la tendencia-ciclo de valores pasados <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.4"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.4)</a></cite>.</span></p>
      </div>

      <h3>Un MA siempre es estacionario</h3>

      <p data-afirma="c3-m3-03">Aquí no hay condición que verificar. Un MA($q$) es una suma <strong>finita</strong> de variables de ruido
        blanco con pesos fijos, así que su media y su varianza no dependen de $t$ y su autocovarianza solo depende del
        rezago. Es estacionario para cualquier valor de los $\theta$ <cite class="cita" data-ref="hamilton1994time" data-loc="p. 51"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 51)</a></cite>.</p>

      <div class="formula" data-afirma="c3-m3-04">
        <p>Varianza y autocorrelaciones de un MA($q$) <cite class="cita" data-ref="hamilton1994time" data-loc="p. 51"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 51)</a></cite>:</p>
        $$\begin{gathered}
          \gamma_0 = \sigma^2\left(1 + \sum_{j=1}^{q}\theta_j^2\right) \\[0.8em]
          \rho_k = \frac{\sum_{j=0}^{q-k}\theta_j\theta_{j+k}}{1+\sum_{j=1}^{q}\theta_j^2} \quad (k \le q) \\[0.8em]
          \rho_k = 0 \quad (k > q)
        \end{gathered}$$
        <p style="margin-bottom:0;">con el convenio $\theta_0 = 1$.</p>
      </div>

      <p data-afirma="c3-m3-05">Ese $\rho_k = 0$ para $k > q$ es <strong>exacto</strong> y es la firma que buscamos <cite class="cita" data-ref="cryer2008time" data-loc="p. 65"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 65)</a></cite>: si dos observaciones están
        separadas por más de $q$ periodos, no comparten ni un solo choque, luego su covarianza es cero <cite class="cita" data-ref="hamilton1994time" data-loc="p. 51"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 51)</a></cite>. El MA tiene
        <em>memoria finita</em>, literalmente de $q$ periodos.</p>

      <h3>Invertibilidad: por qué $\theta$ y $1/\theta$ son el mismo modelo</h3>

      <p>Hay un problema serio escondido en el MA, y conviene verlo con el caso más simple. Para un MA(1),
        $\rho_1 = \theta/(1+\theta^2)$. Pon $\theta = 0.5$ y $\theta = 2$:</p>

      <div class="formula">
        $$\begin{gathered}
          \rho_1(0.5) = \frac{0.5}{1.25} = 0.4 \\[0.6em]
          \rho_1(2) = \frac{2}{5} = 0.4
        \end{gathered}$$
      </div>

      <p>Los dos procesos tienen <strong>exactamente la misma ACF</strong>. No la misma varianza, si comparten
        $\sigma^2$: $\gamma_0 = \sigma^2(1+\theta^2)$ vale $1.25\,\sigma^2$ en uno y $5\,\sigma^2$ en el otro. Pero
        basta reescalar el ruido para igualarla. <span data-afirma="c3-m3-07">En general, $(\theta,\ \sigma^2)$ y $(1/\theta,\ \theta^2\sigma^2)$
        producen exactamente las mismas autocovarianzas —y, con ruido gaussiano, la misma distribución—, y como
        $\sigma^2$ también se estima, ningún dato puede separarlos <cite class="cita" data-ref="hamilton1994time" data-loc="p. 65"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 65)</a></cite>: el parámetro $\theta$ no es <em>identificable</em></span>
        (no hay que confundirlo con la <em>identificación</em> del Módulo 5, que consiste en proponer los órdenes $p$ y
        $q$). <span data-afirma="c3-m3-08">Hace falta una regla que elija uno de los dos, y se elige el de $|\theta| < 1$, que se llama
        <strong>invertible</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 80"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 80)</a></cite>: es el único con el que se puede reconstruir cada choque a partir de lo observado <cite class="cita" data-ref="hamilton1994time" data-loc="p. 67"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 67)</a></cite></span>,
        como muestra el final del módulo.</p>

      <div class="simulador" data-simulador="rho1-theta-ma1">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> $\theta$ y $1/\theta$ sobre la curva de $\rho_1$</h4>
        <p class="simulador-intro">La curva es $\rho_1 = \theta/(1+\theta^2)$. El círculo marca el $\theta$ que elijas y
          el rombo su recíproco, $1/\theta$, que queda siempre <strong>a la misma altura</strong>: los dos dan la misma
          ACF. Ninguno sobrepasa las líneas de $\pm 0.5$, y de cada pareja solo es invertible el que cae en
          $|\theta| < 1$; el otro va en rojo, y la lectura da el $\sigma^2$ con el que describe el mismo proceso.
          Empieza en $\theta = 2$, el caso que simula el código de R de más abajo, y prueba $\theta = 1$, donde la
          pareja se funde en un solo punto sobre la cota.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">$\rho_1$ frente a $\theta$ en un MA(1)</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Curva de la autocorrelación de primer orden de un MA(1) en función de theta, con theta y uno sobre theta marcados a la misma altura" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ma1-invertible">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ma1-invertible" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Calcula la varianza del MA(1) $y_t = \varepsilon_t + \theta\varepsilon_{t-1}$. Los dos choques son
                incorrelados —es todo lo que exige el ruido blanco—, así que las varianzas se suman:</p>
              $$\begin{aligned}
                \gamma_0 &= \operatorname{Var}(\varepsilon_t) + \theta^2\operatorname{Var}(\varepsilon_{t-1}) \\
                &= \sigma^2(1+\theta^2)
              \end{aligned}$$
            </li>
            <li>
              <p>La autocovarianza de orden 1: $y_t$ e $y_{t-1}$ comparten un único choque, $\varepsilon_{t-1}$.</p>
              $$\begin{aligned}
                \gamma_1 &= E[(\varepsilon_t + \theta\varepsilon_{t-1})(\varepsilon_{t-1} + \theta\varepsilon_{t-2})] \\
                &= \theta\sigma^2
              \end{aligned}$$
              <p>Para $k \ge 2$ no comparten ninguno, luego $\gamma_k = 0$.</p>
            </li>
            <li>
              <p>Por tanto</p>
              $$\rho_1 = \frac{\theta}{1+\theta^2}$$
              <p>y esta función es <strong>invariante bajo $\theta \mapsto 1/\theta$</strong>: sustituyendo,
                $\dfrac{1/\theta}{1+1/\theta^2} = \dfrac{\theta}{\theta^2+1}$, que es lo mismo. Las autocovarianzas
                coinciden también si a la vez se cambia $\sigma^2$ por $\theta^2\sigma^2$: con $1/\theta$ y
                $\theta^2\sigma^2$ salen $\gamma_0 = \theta^2\sigma^2(1+1/\theta^2) = \sigma^2(1+\theta^2)$ y
                $\gamma_1 = (1/\theta)\,\theta^2\sigma^2 = \theta\sigma^2$, las mismas de los pasos 1 y 2.</p>
            </li>
            <li>
              <p>De paso, $\rho_1$ está acotada. Su derivada, $(1-\theta^2)/(1+\theta^2)^2$, se anula en
                $\theta = \pm 1$: el máximo es $1/2$ en $\theta = 1$ y, como $\rho_1$ es impar en $\theta$, el mínimo
                es $-1/2$ en $\theta = -1$. De ahí la cota</p>
              $$|\rho_1| \le \frac{1}{2}$$
              <p data-afirma="c3-m3-31">Un MA(1) <strong>no puede</strong> producir una autocorrelación de primer orden mayor que $0.5$ en
                valor absoluto <cite class="cita" data-ref="hamilton1994time" data-loc="p. 49"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 49)</a></cite>. Y los dos extremos caen en $|\theta| = 1$, justo en la frontera de la invertibilidad <cite class="cita" data-ref="hamilton1994time" data-loc="p. 65"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 65)</a></cite>:
                un MA(1) invertible se queda siempre estrictamente por debajo.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">De los dos valores $\theta$ y $1/\theta$ se elige por convenio el que cumple
            $|\theta| < 1$: el <strong>invertible</strong>. Es el que permite escribir el proceso como un AR($\infty$)
            convergente (Módulo 4) y, en consecuencia, el que permite reconstruir los choques a partir de lo observado.</p>
        </div>
      </div>

      <div class="definition" data-afirma="c3-m3-09">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de invertibilidad</h4>
        <p style="margin-bottom:0;">Un MA($q$) es <strong>invertible</strong> si todas las raíces de $\theta(B) = 0$
          están fuera del círculo unitario <cite class="cita" data-ref="cryer2008time" data-loc="p. 80"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 80)</a></cite>. Es la misma condición que la estacionariedad del AR, aplicada al otro
          polinomio.</p>
      </div>

      <p>El caso frontera, $|\theta| = 1$, ya apareció en el Capítulo 2. <span data-afirma="c3-m3-30">Allí, diferenciar un ruido blanco
        —sobrediferenciarlo— daba $\nabla\varepsilon_t = \varepsilon_t - \varepsilon_{t-1}$, que es un MA(1) con
        $\theta = -1$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 126"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 126)</a></cite>: su raíz, la de $1 - B$, cae justo sobre el círculo unitario, así que no es invertible <cite class="cita" data-ref="cryer2008time" data-loc="p. 127"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 127)</a></cite>, y su
        $\rho_1 = \theta/(1+\theta^2)$ vale $-0.5$, el mínimo que un MA(1) puede alcanzar <cite class="cita" data-ref="hamilton1994time" data-loc="p. 49"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 49)</a></cite>.</span> Es el $-0.5$ que el
        Capítulo 2 daba como indicio de sobrediferenciación, y es el punto que el simulador de arriba marca como
        «frontera».</p>

      <h3>El triángulo de invertibilidad del MA(2)</h3>

      <p>Para $q = 1$ la condición es $|\theta| < 1$. Para $q = 2$ no hace falta resolver nada:
        $\theta(B) = 1 + \theta_1 B + \theta_2 B^2$ es el $\phi(B) = 1 - \phi_1 B - \phi_2 B^2$ del AR(2) con
        $\phi_1 = -\theta_1$ y $\phi_2 = -\theta_2$, así que basta llevar el triángulo del Módulo 2 a los $\theta$
        cambiando los signos.</p>

      <div class="formula" data-afirma="c3-m3-10">
        <p>Un MA(2) es invertible si y solo si el par $(\theta_1,\theta_2)$ cumple las tres condiciones <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.4"><a href="#ref-m3-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.4)</a></cite>:</p>
        $$\begin{gathered}
          \theta_1 + \theta_2 > -1 \\
          \theta_2 - \theta_1 > -1 \\
          -1 < \theta_2 < 1
        \end{gathered}$$
      </div>

      <p>El triángulo desmiente dos intuiciones. Un coeficiente mayor que 1 no condena el modelo:
        $\theta = (1.5,\ 0.6)$ cumple las tres condiciones y es invertible, con sus dos raíces de módulo $1.291$. Y
        unos coeficientes pequeños no lo salvan: en $\theta = (0.5,\ -0.6)$ los dos están por debajo de 1 en valor
        absoluto, pero $\theta_2 - \theta_1 = -1.1$ incumple la segunda condición, y una de sus raíces tiene módulo
        $0.940$.</p>

      <div class="note">
        <p><strong>El límite $|\rho_1| \le 0.5$ es una herramienta de diagnóstico.</strong> <span data-afirma="c3-m3-11">Si un correlograma muestral da $r_1 = 0.8$ y se quisiera ajustar un MA(1), no hay ningún $\theta$ cuya $\rho_1$ valga eso, y el MA(1) queda en duda: una $r_1$ muestral puede pasar de $0.5$ aunque la $\rho_1$ verdadera no lo haga <cite class="cita" data-ref="cryer2008time" data-loc="p. 150"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 150)</a></cite>.</span> <span data-afirma="c3-m3-12">Pero la cota
          es propia del MA(1): en un MA($q$) el techo de $\rho_1$ es $\cos\big(\pi/(q+2)\big)$, que vale $0.707$ con
          $q = 2$ y $0.809$ con $q = 3$.</span> Así que $r_1 = 0.8$ pone en duda también el MA(2), y un MA(3) solo llegaría
          rozando su techo; lo razonable es buscar un componente autorregresivo. Sirve para poner en duda modelos sin ajustar nada.</p>
      </div>

          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess, arma_acf
from statsmodels.tsa.arima.model import ARIMA

# Dos MA(1) con la misma ACF
for theta in (0.5, 2.0):
    acf = arma_acf(np.r_[1], np.r_[1, theta], lags=4)[1:]
    proc = ArmaProcess(np.r_[1], np.r_[1, theta])
    print(f"theta={theta}: acf={np.round(acf, 4)}  invertible={proc.isinvertible}")
# theta=0.5: acf=[0.4 0.  0. ]  invertible=True
# theta=2.0: acf=[0.4 0.  0. ]  invertible=False

# MA(2): el triangulo, contra las raices
for th1, th2 in ((1.5, 0.6), (0.5, -0.6)):
    proc = ArmaProcess(np.r_[1], np.r_[1, th1, th2])
    print(f"theta=({th1}, {th2}): |raices|={np.round(np.abs(proc.maroots), 4)}  invertible={proc.isinvertible}")
# theta=(1.5, 0.6): |raices|=[1.291 1.291]  invertible=True
# theta=(0.5, -0.6): |raices|=[0.9399 1.7732]  invertible=False
