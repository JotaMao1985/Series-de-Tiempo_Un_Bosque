      <h3>El AR es la idea original</h3>

      <p>Escribe un AR($p$) sin el ruido y verás algo familiar:</p>

      <div class="formula">
        $$\hat y_t = \phi_1 y_{t-1} + \phi_2 y_{t-2} + \cdots + \phi_p y_{t-p} + c$$
      </div>

      <p>Es exactamente una <strong>neurona lineal</strong> con una ventana de $p$ entradas: los $\phi_j$ son los
        pesos y $c$ es el sesgo. Todo lo que hicieron los métodos secuenciales modernos fue relajar, uno por uno, los
        supuestos que hay detrás de esa expresión.</p>

      <table>
        <caption class="sr-only">Del modelo AR a los modelos secuenciales modernos</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">Qué relaja respecto al AR</th>
            <th scope="col">Coste</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>AR($p$)</strong></td>
            <td>—</td>
            <td>Ventana fija, relación lineal</td>
          </tr>
          <tr>
            <td><strong>Red densa con ventana</strong></td>
            <td>La <strong>linealidad</strong>: capas ocultas y activaciones no lineales</td>
            <td>Muchos más parámetros; sin interpretación directa</td>
          </tr>
          <tr>
            <td><strong>RNN / LSTM / GRU</strong></td>
            <td>La <strong>ventana fija</strong>: un estado oculto acumula el pasado y la red aprende cuánto
              recordar y cuánto olvidar</td>
            <td>Entrenamiento secuencial y costoso; necesita muchos datos</td>
          </tr>
          <tr>
            <td><strong>Transformers temporales</strong></td>
            <td>El <strong>decaimiento con la distancia</strong>: la atención puede pesar igual el rezago 1 que el
              rezago 500</td>
            <td>Coste cuadrático en la longitud; aún más datos</td>
          </tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>Un puente concreto.</strong> El estado oculto de una RNN sin activación no lineal y con una sola
          unidad <em>es</em> un AR(1): $h_t = w\,h_{t-1} + u\,x_t$. La condición de estabilidad del entrenamiento
          ($|w| < 1$, para que el gradiente no explote ni se desvanezca) es la <strong>misma condición de
            estacionariedad</strong> del Módulo 1. El problema del gradiente que se desvanece en las RNN y el
          desvanecimiento de $\phi^k$ que vimos al desarrollar el AR(1) hacia atrás son el mismo fenómeno
          matemático.</p>
      </div>

      <h3>Cuándo el modelo pequeño sigue ganando</h3>

      <div class="definition">
        <h4><i class="fas fa-scale-balanced mr-2" aria-hidden="true"></i>Razones para quedarse con un ARMA</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Pocos datos.</strong> El caso de este capítulo tiene $n = 100$. Una LSTM con miles de parámetros
            sobre cien observaciones memoriza la muestra; el AR(2) tiene tres.</li>
          <li><strong>Intervalos de pronóstico calibrados.</strong> Un ARMA da intervalos con una teoría detrás (los
            pesos $\psi$ del Módulo 4). Cuantificar bien la incertidumbre en una red exige trabajo adicional que a
            menudo no se hace.</li>
          <li><strong>Interpretabilidad con contenido físico.</strong> El $11.22$ del Módulo 9 no es un peso opaco:
            es un <strong>periodo en años</strong> que se puede contrastar con la astronomía. Ninguna capa oculta
            entrega eso.</li>
          <li><strong>Referencia obligatoria.</strong> Aunque vayas a usar una red, el ARMA es el <em>benchmark</em>
            que hay que batir. Un modelo complejo que no supera a un AR(2) no es un modelo complejo: es un modelo
            complejo mal ajustado.</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>Uso crítico de los asistentes de IA.</strong> Un asistente te dará en segundos el código de un
          <code>arima()</code> y una interpretación convincente de la salida. Este capítulo contiene al menos cuatro
          puntos en los que esa interpretación suele estar mal y <strong>tú tienes que verificarlos</strong>: (1) el
          <code>intercept</code> de <code>arima()</code> es la media $\hat\mu$, no la constante $c$; (2) sin
          <code>fitdf = p+q</code>, Ljung–Box aprueba modelos insuficientes —aquí el $p$-valor pasaba de $0.046$ a
          $0.100$—; (3) el AICc no compara modelos con distinto $d$ ni con y sin media; (4) un ARMA que gana por AICc
          puede estar parcheando una escala equivocada. La regla del curso: <strong>el asistente propone, tú
            diagnosticas</strong>.</p>
      </div>

      <h3>Resumen del capítulo</h3>

      <div class="diagram">
        <ol>
          <li>El <strong>operador de rezago</strong> $B$ convierte recursiones en polinomios. Un proceso es
            estacionario si las raíces de $\phi(B)$ caen <strong>fuera</strong> del círculo unitario, e invertible si
            lo hacen las de $\theta(B)$.</li>
          <li>Un <strong>AR($p$)</strong> tiene <strong>PACF que se corta</strong> en $p$ y ACF que decae. Un
            <strong>MA($q$)</strong>, al revés: <strong>ACF que se corta</strong> en $q$. Un <strong>ARMA</strong>
            decae en las dos, y por eso los correlogramas no bastan para fijar sus órdenes.</li>
          <li>Un AR(2) con $\phi_1^2 + 4\phi_2 < 0$ tiene raíces complejas y produce un <strong>pseudo-ciclo</strong>
            de periodo $2\pi/\arccos\!\big(\phi_1/(2\sqrt{-\phi_2})\big)$.</li>
          <li>Todo ARMA estacionario e invertible se puede escribir como MA($\infty$) (pesos $\psi$, respuesta al
            impulso) o como AR($\infty$) (pesos $\pi$). Los $\psi$ darán la forma de abanico a los intervalos del
            Capítulo 6.</li>
          <li>La estimación se hace por <strong>Yule–Walker</strong>, <strong>CSS</strong> o <strong>máxima
              verosimilitud</strong>. No dan lo mismo: en las manchas solares, YW y ML se separaron $1.26$ y $1.10$
            errores estándar. CSS y ML coincidieron.</li>
          <li>Se elige con <strong>AICc</strong> o <strong>BIC</strong> —solo entre modelos ajustados a los mismos
            datos— y se valida con <strong>Ljung–Box sobre los residuales</strong>, siempre con
            <code>fitdf = p + q</code>.</li>
          <li>Un criterio de información no distingue "falta dinámica" de "sobra un problema de escala". En las
            manchas solares, el término MA que ganaba sobre la serie cruda <strong>desapareció</strong> al pasar a la
            raíz cuadrada, y el pseudo-periodo se acercó al ciclo solar real.</li>
          <li>A veces la respuesta correcta es que <strong>no hay nada que modelar</strong>: los log-retornos
            mensuales de la TRM son indistinguibles del ruido blanco.</li>
        </ol>
      </div>

          <code>ARMAacf</code>. ¿Se cumple aquí la cota $|\rho_1| \le 0.5$ del Módulo 3?</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e2-pista" hidden>
          <p style="margin:0;">Usa la fórmula general de la ACF de un MA($q$) con el convenio $\theta_0 = 1$:
            el numerador de $\rho_k$ es $\sum_{j=0}^{q-k}\theta_j\theta_{j+k}$. Para $k=1$ eso son <em>dos</em>
            sumandos, no uno. Y sobre la última pregunta: relee de dónde salía la cota del Módulo 3 —¿se dedujo para
            un MA cualquiera, o para uno concreto?</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e2-sol" hidden>
          <p><strong>Respuesta: sí es invertible, $\rho_1 = 0.5526$ y $\rho_2 = 0.2632$, y la cota
              <em>no</em> se cumple porque no era aplicable.</strong></p>
          <pre><code class="language-r">theta &lt;- c(0.6, 0.4)

# Invertibilidad: raices de theta(B) = 1 + 0.6B + 0.4B^2
raices &lt;- polyroot(c(1, theta))
round(raices, 4)
#&gt; [1] -0.75+1.3919i -0.75-1.3919i
round(Mod(raices), 4)
#&gt; [1] 1.5811 1.5811        &gt; 1  ->  INVERTIBLE

# ACF a mano, con theta_0 = 1
denominador &lt;- 1 + sum(theta^2)                       # 1 + 0.36 + 0.16 = 1.52
rho1 &lt;- (1 * theta[1] + theta[1] * theta[2]) / denominador   # (0.6 + 0.24)/1.52
rho2 &lt;- (1 * theta[2]) / denominador                          # 0.4/1.52
round(c(rho1 = rho1, rho2 = rho2), 4)
#&gt;   rho1   rho2
#&gt; 0.5526 0.2632

# Contra ARMAacf
round(ARMAacf(ma = theta, lag.max = 4)[-1], 4)
#&gt; [1] 0.5526 0.2632 0.0000 0.0000    <- coinciden, y se corta en q = 2

# Pesos pi: el MA(2) invertible se escribe como AR(infinito) convergente
round(ARMAtoMA(ar = -theta, lag.max = 8), 4)
#&gt; [1] -0.6000 -0.0400  0.2640 -0.1424 -0.0202  0.0691 -0.0334 -0.0076
# oscilan y se desvanecen: es la firma de la invertibilidad</code></pre>
          <p><strong>Sobre la cota.</strong> $\rho_1 = 0.5526 > 0.5$. No hay contradicción: la cota
            $|\rho_1|\le 0.5$ se dedujo <strong>solo para el MA(1)</strong>, maximizando $\theta/(1+\theta^2)$. Con
            $q = 2$ el numerador de $\rho_1$ gana el término extra $\theta_1\theta_2$ y el techo sube. Es un buen
            recordatorio de que una cota vale exactamente en el modelo del que se dedujo: ver $r_1 = 0.55$ descarta
            un MA(1), <strong>no</strong> descarta un MA(2).</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">3.</span>El Módulo 9 ajustó un AR(2) a
          $\sqrt{\text{manchas}}$ sobre la ventana 1770–1869. Repite el ajuste sobre la serie completa
          (1700–1988) y sobre 1900–1988. ¿Son estables los coeficientes? ¿Y el pseudo-periodo? ¿Sigue pasando
          el diagnóstico?</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e3-pista" hidden>
          <p style="margin:0;">Mira <strong>tres</strong> cosas por separado y no las confundas: los coeficientes
            $\hat\phi$, la cantidad derivada de ellos (el periodo) y el diagnóstico. Puede pasar perfectamente que los
            coeficientes apenas se muevan, que el periodo sí lo haga y que el diagnóstico se derrumbe. Piensa por qué
            el Ljung–Box empeora tanto al alargar la muestra: ¿el modelo es peor, o la prueba tiene más con qué
            detectarlo?</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e3-sol" hidden>
          <p><strong>Respuesta: los coeficientes son notablemente estables, el periodo se acorta un año y el
              diagnóstico falla en todas las ventanas salvo la de Yule.</strong></p>
          <pre><code class="language-r">for (v in list(c(1770,1869), c(1700,1988), c(1870,1988), c(1900,1988))) {
  x &lt;- sqrt(window(sunspot.year, v[1], v[2]))
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  r &lt;- polyroot(c(1, -coef(f)[1:2]))
  cat(sprintf("%d-%d (n=%3d): phi=(%.4f, %.4f)  |raiz|=%.4f  periodo=%6.3f  LB12 p=%.4f\n",
      v[1], v[2], length(x), coef(f)[1], coef(f)[2], Mod(r)[1],
      2*pi/Arg(r[1]),
      Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value))
}
#&gt; 1770-1869 (n=100): phi=(1.4027, -0.6853)  |raiz|=1.2080  periodo=11.218  LB12 p=0.1644
#&gt; 1700-1988 (n=289): phi=(1.4086, -0.7006)  |raiz|=1.1947  periodo=11.007  LB12 p=0.0000
#&gt; 1870-1988 (n=119): phi=(1.4219, -0.7321)  |raiz|=1.1687  periodo=10.648  LB12 p=0.0007
#&gt; 1900-1988 (n= 89): phi=(1.4146, -0.7556)  |raiz|=1.1504  periodo=10.129  LB12 p=0.0010</code></pre>
          <p><strong>Discusión.</strong> Hay tres lecturas y conviene separarlas:</p>
          <ul>
            <li><strong>Los coeficientes son estables.</strong> $\hat\phi_1$ se mueve entre $1.403$ y $1.422$ y
              $\hat\phi_2$ entre $-0.685$ y $-0.756$, siempre dentro de un error estándar o dos. El AR(2) captura una
              estructura real y persistente, no un artefacto de la ventana de Yule.</li>
            <li><strong>El periodo sí se mueve:</strong> de $11.22$ años (1770–1869) a $10.13$ (1900–1988). Como
              depende de los $\phi$ a través de un arcocoseno, cambios pequeños en $\hat\phi_2$ se amplifican. Es un
              buen ejemplo de que una cantidad derivada puede ser mucho más sensible que los parámetros de los que
              procede. Sobre la serie completa da $11.007$, notablemente cerca del ciclo documentado.</li>
            <li><strong>El diagnóstico se derrumba</strong> en cuanto se sale de la ventana de Yule ($p &lt; 0.001$ en
              las tres). Y la causa no es que el modelo empeore —los coeficientes casi no cambian— sino que
              <strong>la prueba gana potencia</strong>: con $n = 289$ en vez de $100$, Ljung–Box detecta
              autocorrelaciones residuales pequeñas que con cien observaciones quedaban dentro del ruido. La asimetría
              no lineal que el Módulo 9 señalaba sigue ahí; simplemente, ahora hay datos suficientes para probarlo.</li>
          </ul>
          <p style="margin-bottom:0;">Moraleja: que un modelo "pase" el diagnóstico depende de cuántos datos tengas
            para desmentirlo. No rechazar $H_0$ nunca es lo mismo que aceptarla.</p>
        </div>
      </div>

        <p style="margin-bottom:0;"><strong>Lo que viene.</strong> Todo este capítulo ha supuesto que la serie ya era
