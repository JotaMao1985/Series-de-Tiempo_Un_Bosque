          <span class="text-gray-400 font-normal text-2xl">/ The lag operator</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Escribir un modelo de series de tiempo como un polinomio
              y leer en sus <strong>raíces</strong> si el proceso es estacionario. Es la notación que sostiene todo el
              capítulo.</p>
          </div>

      <p>En el Capítulo 2 se usó el operador $B$ para escribir la diferencia como $\nabla y_t = (1-B)y_t$ y para
        explicar el nombre de la raíz unitaria. Ese atajo de notación es en realidad la herramienta central del
        análisis clásico de series de tiempo, y conviene presentarla en serio antes de construir modelos con ella. El
        módulo va de la notación a la condición de las raíces; los convenios de signo y las diferencias entre R y
        Python, que dan tropiezos, quedan para el final.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: operador de rezago (<em>lag operator</em>)</h4>
        <p>El <strong>operador de rezago</strong> $B$ retrasa una serie un periodo:</p>
        $$B\, y_t = y_{t-1}$$
        <p style="margin-bottom:0;">Aplicado $k$ veces, retrasa $k$ periodos: $B^k y_t = y_{t-k}$. Por convenio
          $B^0 = 1$ (el operador identidad) y $B$ deja fijas las constantes: $Bc = c$.</p>
      </div>

      <p>Lo interesante es que $B$ <strong>se comporta como un número</strong> en las operaciones algebraicas: se puede
        sumar, multiplicar, elevar a potencias y factorizar. Eso convierte manipulaciones de recursiones —que son
        engorrosas— en manipulaciones de polinomios, que son rutina.</p>

      <div class="note">
        <p><strong>Un ejemplo de lo que compra la notación.</strong> La diferencia estacional de orden $m$ aplicada
          después de una diferencia regular es $\nabla_m \nabla y_t$. Con polinomios, eso es
          $(1-B^m)(1-B)y_t$, y basta multiplicar para saber exactamente qué combinación de rezagos interviene:</p>
        $$\begin{aligned}
          &(1-B^m)(1-B) \\
          &\quad = 1 - B - B^m + B^{m+1} \\
          &\quad \Rightarrow\; y_t - y_{t-1} - y_{t-m} + y_{t-m-1}
        \end{aligned}$$
        <p style="margin-bottom:0;">Ese es exactamente el preprocesamiento del modelo <em>airline</em> que verás en el
          Capítulo 5, obtenido sin escribir una sola recursión.</p>
      </div>

      <h3>Polinomios característicos</h3>

      <p>Todos los modelos del capítulo se escriben con dos polinomios en $B$: uno del lado de la serie y otro del lado
        del ruido.</p>

      <div class="formula">
        <p>Polinomio <strong>autorregresivo</strong> de orden $p$ y polinomio de <strong>medias móviles</strong> de
          orden $q$:</p>
        $$\phi(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$$
        $$\theta(B) = 1 + \theta_1 B + \cdots + \theta_q B^q$$
      </div>

      <p>Los coeficientes $\phi$ entran <strong>restando</strong> y los $\theta$ <strong>sumando</strong>. No es un
        capricho: así, al pasar todo al mismo lado, un AR queda $\phi(B)y_t = \varepsilon_t$ y un MA queda
        $y_t = \theta(B)\varepsilon_t$, con los signos «naturales» en la forma en que se escribe cada modelo (los dos
        modelos se definen en los Módulos 2 y 3; aquí solo importa la notación). Algunos textos y paquetes escriben el
        MA con el signo contrario: cómo comprobarlo, y qué otras diferencias hay entre R y Python, está al final del
        módulo.</p>

      <h3>Las raíces son la respuesta</h3>

      <p>La pregunta que resolverá el polinomio $\phi(B)$ es si el proceso es estacionario. Para responderla se trata
        $B$ como una variable compleja y se buscan las raíces de $\phi(B)=0$.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de estacionariedad</h4>
        <p style="margin-bottom:0;">Un proceso autorregresivo es <strong>estacionario</strong> si todas las raíces de
          $\phi(B) = 0$ están <strong>fuera</strong> del círculo unitario, es decir, si $|B_i| > 1$ para toda raíz
          $B_i$ (incluyendo el módulo si la raíz es compleja).</p>
        <p style="margin-bottom:0; margin-top:0.6rem;">En este capítulo «estacionario» quiere decir además
          <strong>causal</strong>: que $y_t$ depende solo de los choques hasta $t$, que es lo que hace falta para
          pronosticar. La condición de las raíces es la de esa solución; el desarrollo de más abajo enseña qué
          queda cuando no se cumple.</p>
      </div>

      <p>La palabra <em>fuera</em> sorprende la primera vez. La intuición es que el polinomio está escrito en $B$, no
        en $1/B$: para el AR(1) $y_t = \phi y_{t-1} + \varepsilon_t$ el polinomio es $1 - \phi B$, cuya única raíz es
        $B = 1/\phi$. Que la raíz esté fuera del círculo, $|1/\phi| > 1$, es lo mismo que la condición conocida
        $|\phi| < 1$.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ar1-estacionario">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ar1-estacionario" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte del AR(1) y sustituye $y_{t-1}$ por su propia definición, una y otra vez:</p>
              $$\begin{aligned}
                y_t &= \phi y_{t-1} + \varepsilon_t \\
                &= \phi(\phi y_{t-2} + \varepsilon_{t-1}) + \varepsilon_t \\
                &= \varepsilon_t + \phi\varepsilon_{t-1} + \phi^2 y_{t-2}
              \end{aligned}$$
            </li>
            <li>
              <p>Tras $k$ sustituciones queda una suma de choques más un resto que arrastra el pasado lejano:</p>
              $$y_t = \sum_{j=0}^{k-1}\phi^j \varepsilon_{t-j} + \phi^{k} y_{t-k}$$
            </li>
            <li>
              <p>Aquí está todo el asunto. Si $|\phi| < 1$, entonces $\phi^k \to 0$ y el resto <strong>se
                  desvanece</strong>: el pasado remoto deja de influir y queda una suma convergente</p>
              $$y_t = \sum_{j=0}^{\infty}\phi^j \varepsilon_{t-j}$$
              <p>Si $|\phi| \ge 1$, el resto no desaparece: el proceso no olvida y no existe una solución
                estacionaria que dependa solo de los choques pasados. Con $|\phi| > 1$ existe otra, estacionaria
                pero escrita con los choques <em>futuros</em>, $y_t = -\sum_{j \ge 1}\phi^{-j}\varepsilon_{t+j}$:
                no sirve para pronosticar y por eso queda fuera. Con $|\phi| = 1$ no hay ninguna.</p>
            </li>
            <li>
              <p>La varianza de esa suma es una serie geométrica, y solo converge bajo la misma condición:</p>
              $$\begin{gathered}
                \operatorname{Var}(y_t) = \sigma^2\sum_{j=0}^{\infty}\phi^{2j} = \frac{\sigma^2}{1-\phi^2} \\
                \text{si } |\phi| < 1
              \end{gathered}$$
            </li>
          </ol>
          <p class="derivacion-resultado">La condición $|\phi| < 1$ es exactamente $|1/\phi| > 1$: la raíz de
            $1 - \phi B$ está fuera del círculo unitario. Y de paso apareció la representación
            $y_t = \sum_j \phi^j \varepsilon_{t-j}$, que es el <strong>MA($\infty$)</strong> del Módulo 4.</p>
        </div>
      </div>

      <div class="note">
        <p><strong>Enlace con el Capítulo 2.</strong> Cuando una raíz cae <em>exactamente</em> sobre el círculo
          ($|B| = 1$) el proceso no es estacionario. En el AR(1) eso ocurre con $\phi = 1$ y con $\phi = -1$; el
          primer caso, la raíz $B = 1$, es la <strong>caminata aleatoria</strong>: la ACF que no decaía
          y el KPSS que rechazaba. De ahí el nombre <em>raíz unitaria</em>. Diferenciar es multiplicar la serie por
          ese mismo factor $(1-B)$: lo que queda, $\nabla y_t$, ya no tiene esa raíz.</p>
      </div>

          en orden <strong>ascendente</strong> de potencia y <code>np.roots()</code> de NumPy en orden
          <strong>descendente</strong>. Es un error silencioso: no falla, simplemente devuelve las raíces de otro

      <h3>Convenios de signo y diferencias entre R y Python</h3>

      <div class="warning">
        <p><strong>Ojo con los signos.</strong> El convenio de este capítulo —los $\phi$ restando, los $\theta$
          sumando— es <strong>el que usan R y Python</strong>, pero algunos textos —y algún paquete— invierten el signo
          de $\theta$. Si un $\theta$ estimado te sale con el signo contrario al que esperabas, comprueba el convenio
          antes de dudar de tus datos.</p>
        <p>Conviene ver las dos escrituras enfrentadas, porque el desacuerdo es solo sobre la parte MA. El convenio de
          <strong>suma</strong> —el de este capítulo, el de R y el de <code>statsmodels</code>— escribe un MA(1) así:</p>
        $$y_t = \varepsilon_t + \theta_1\varepsilon_{t-1}$$
        <p>y el convenio de <strong>resta</strong> —el del Box–Jenkins clásico y el de S-PLUS— lo escribe así:</p>
        $$y_t = \varepsilon_t - \theta_1\varepsilon_{t-1}$$
        <p style="margin-bottom:0;">Es <strong>el mismo modelo</strong>, no dos modelos rivales. Ajustado a los mismos
          datos da la misma verosimilitud, los mismos residuales y los mismos pronósticos; lo único que cambia es la
          etiqueta impresa. Un $\hat\theta = 0.69$ en un convenio es $\hat\theta = -0.69$ en el otro.</p>
      </div>

      <p>Comprobar cuál usa un paquete no requiere leer su documentación: basta ajustar una serie simulada con un
        $\theta$ conocido y mirar el signo que devuelve. El bloque lo hace con un MA(1) de $\theta = +0.7$; el estimador que devuelve $\hat\theta$ es el del Módulo 7, y por ahora solo importa
        su signo. Cada lenguaje simula su propia serie, así que las cifras difieren; el signo, no.</p>

      <div class="code-tabs">

round(ARMAacf(ma = 0.7, lag.max = 3), 4)
#&gt;      0      1      2      3
#&gt; 1.0000 0.4698 0.0000 0.0000

# de la documentacion de S-PLUS.

# el de los COEFICIENTES del modelo. Lo que se pone es lo que sale.</code></pre>

# [1.     0.4698 0.     0.    ]

# Cada lenguaje simula su propia serie: las cifras difieren de las de R, el signo no
x = ArmaProcess(np.r_[1], np.r_[1, 0.7]).generate_sample(

print(round(float(np.corrcoef(x[1:], x[:-1])[0, 1]), 4))   # r_1 muestral

print(fit.param_names, fit.params.round(4))
# ['ma.L1', 'sigma2'] [0.6979 0.9847]    &lt;- ma.L1 POSITIVO, como en R

# PERO al SIMULAR un AR, statsmodels no pide los coeficientes del modelo sino

bien = ArmaProcess(ar=np.array([1, -0.6]), ma=np.array([1]))
mal  = ArmaProcess(ar=np.array([1,  0.6]), ma=np.array([1]))

print(bien.arcoefs, np.round(bien.acf(5)[1:], 4))
# [0.6]  [0.6    0.36   0.216  0.1296]    &lt;- lo que se queria
print(mal.arcoefs,  np.round(mal.acf(5)[1:], 4))

      <div class="note">
        <p><strong>La regla que ahorra la tarde.</strong> En R los coeficientes son coeficientes en todas partes. En
          Python son coeficientes al <em>estimar</em> y coeficientes del <em>polinomio</em> al <em>simular</em>, de
          modo que la parte AR cambia de signo al pasar de <code>ARIMA(...)</code> a <code>ArmaProcess(...)</code>.
          Escribir <code>ar=[1, 0.6]</code> en vez de <code>ar=[1, -0.6]</code> no produce ningún error: produce
          calladamente un proceso con $\phi = -0.6$, cuya ACF alterna de signo ($-0.600,\ 0.360,\ -0.216,\ldots$) en
          lugar de decaer sin cambiarlo desde $0.600$. Es el mismo tipo de fallo silencioso que el del orden de los
          coeficientes en <code>polyroot()</code> y <code>np.roots()</code>, que está unas líneas más arriba.</p>
        <p style="margin-bottom:0;">Y si el paquete es desconocido y no hay documentación a mano, queda el
          correlograma como árbitro: en un MA(1) bajo el convenio de suma se cumple
          $\rho_1 = \theta/(1+\theta^2)$, así que $r_1$ y $\hat\theta$ <strong>tienen que salir con el mismo
            signo</strong>. Si el ajuste devuelve $\hat\theta = -0.70$ sobre una serie cuyo $r_1$ vale $+0.50$, no hay
          nada roto en los datos: es el convenio de resta.</p>

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer un AR($p$) por su firma: <strong>PACF que se
                corta</strong> en el rezago $p$ y ACF que decae. Saber cuándo es estacionario y calcular sus

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso AR($p$)</h4>
        <p>Un proceso <strong>autorregresivo de orden $p$</strong> explica el valor actual como una combinación lineal
          de sus $p$ valores anteriores más un choque de ruido blanco:</p>
        $$\begin{aligned}
          y_t &= c + \phi_1 y_{t-1} + \phi_2 y_{t-2} + \cdots \\
          &\quad + \phi_p y_{t-p} + \varepsilon_t
        \end{aligned}$$
        $$\varepsilon_t \sim \text{RB}(0,\sigma^2)$$
        <p style="margin-bottom:0;">En forma compacta, $\phi(B)\, y_t = c + \varepsilon_t$. La abreviatura
          $\text{RB}(0,\sigma^2)$ es la del ruido blanco del Capítulo 2: media cero y varianza $\sigma^2$.</p>
      </div>

      <p>El nombre lo dice todo: es una <strong>regresión de la serie sobre sí misma</strong>. Si sustituyes $y_{t-1}$
        por $x_1$, $y_{t-2}$ por $x_2$ y así, tienes una regresión múltiple corriente. La diferencia —y no es
        menor— es que los regresores no son fijos: son la propia variable desplazada, y por eso los errores estándar
        y la teoría asintótica no son las de la regresión clásica.</p>

      <div class="note">
        <p><strong>Sobre la constante.</strong> $c$ no es la media del proceso. Tomando esperanzas en la definición y
          usando que $E[y_t] = \mu$ para todo $t$ (estacionariedad), se obtiene
          $\mu = c/(1 - \phi_1 - \cdots - \phi_p)$. Por eso <code>arima()</code> de R reporta una columna
          <code>intercept</code> que en realidad es $\hat\mu$, <strong>no</strong> $\hat c$. Es una de las confusiones
          más frecuentes al leer una salida.</p>
      </div>

      <h3>La firma del AR: la PACF se corta</h3>

      <p>Recuerda del Capítulo 2 que la PACF mide la correlación <em>directa</em> entre $y_t$ y $y_{t-k}$, descontando
        los rezagos intermedios. En un AR($p$), toda la dependencia directa está en los $p$ primeros rezagos, por
        construcción. Más allá de $p$ no queda nada que descontar.</p>

      <div class="formula">
        <p style="margin-bottom:0;">Para un proceso AR($p$): $\;\phi_{kk} = 0\;$ para todo $k > p$, <strong>exactamente
            cero</strong>, no aproximadamente; y la última barra distinta de cero, la del rezago $p$, vale el propio
            coeficiente: $\phi_{pp} = \phi_p$. La ACF, en cambio, decae hacia cero sin cortarse nunca.</p>
      </div>

      <div class="simulador" data-simulador="panel-ar-teorico">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Las cuatro firmas del AR</h4>

          rezago $p$ —la barra de $p$ es la última distinta de cero— y se queda ahí, mientras la ACF nunca termina
          de cortarse.</p>

      <p>Los cuatro casos merecen un comentario. Con $\phi = 0.8$ la ACF decae despacio y siempre positiva
        ($0.800,\,0.640,\,0.512,\ldots$: son las potencias de $0.8$). Con $\phi = -0.7$ decae
        <strong>alternando de signo</strong> ($-0.700,\,0.490,\,-0.343,\ldots$), que es la firma de un proceso que
        rebota. El AR(2) con raíces reales decae de forma monótona. Y el AR(2) con
        $\phi = (1.4,\,-0.75)$ produce algo nuevo: una ACF que <strong>oscila</strong>
        ($0.800,\,0.370,\,-0.082,\,-0.392$), cruzando el cero y volviendo. Esa oscilación es un
        <em>pseudo-ciclo</em> —su longitud, que da la fórmula de más abajo, es el <em>pseudo-periodo</em>—, y es el
        fenómeno que hará interesante el caso real de las manchas solares, que entra en el Módulo 7 y se cierra en el
        9.</p>

      <h3>El triángulo de estacionariedad del AR(2)</h3>

      <p>Para $p = 1$ la condición es simplemente $|\phi_1| < 1$. Para $p = 2$, aplicar la condición de las raíces se
        traduce en tres desigualdades que recortan un triángulo en el plano $(\phi_1, \phi_2)$.</p>

      <div class="formula">
        <p>Un AR(2) es estacionario —y causal, en el sentido del Módulo 1— si y solo si el par
          $(\phi_1,\phi_2)$ cumple las tres condiciones:</p>
        $$\begin{gathered}
          \phi_1 + \phi_2 < 1 \\
          \phi_2 - \phi_1 < 1 \\
          -1 < \phi_2 < 1
        \end{gathered}$$
      </div>

      <div class="simulador" data-simulador="triangulo-ar2">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> El triángulo de estacionariedad</h4>
        <p class="simulador-intro">Mueve $\phi_1$ y $\phi_2$ y observa dónde cae el punto. Dentro del triángulo el
          proceso es estacionario; bajo la parábola $\phi_1^2 + 4\phi_2 = 0$ las raíces son <strong>complejas</strong> y
          la serie desarrolla un pseudo-ciclo cuyo pseudo-periodo aparece en la lectura. Prueba
          $\phi_1 = 1.40$ y $\phi_2 = -0.69$, que es —redondeado al paso del deslizador— el modelo con que termina el
          caso de las manchas solares (la serie entra en el Módulo 7 y el modelo final se obtiene en el 9): sale un
          pseudo-ciclo de unos 11 periodos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Región de estacionariedad</p>
        <div class="grafico-wrapper" style="height:280px;">
          <canvas aria-label="Triángulo de estacionariedad del AR(2) con el punto (φ₁, φ₂) marcado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Realización simulada del proceso</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Serie simulada del proceso AR(2) seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>Raíces complejas y ciclos.</strong> Cuando $\phi_1^2 + 4\phi_2 < 0$ las raíces son complejas
          conjugadas y la ACF oscila con un pseudo-periodo $P$ de</p>
        $$P = \frac{2\pi}{\arccos\!\left(\dfrac{\phi_1}{2\sqrt{-\phi_2}}\right)}$$
        <p style="margin-bottom:0;">Es un ciclo <em>estocástico</em>: ni la longitud ni la amplitud se repiten
          exactamente, a diferencia de la estacionalidad determinista del Capítulo 1. Por eso un ciclo económico se
          modela así y una estacionalidad mensual no.</p>
      </div>


      <h3>Media, varianza y autocorrelación</h3>

      <p>Hasta aquí el AR($p$) se ha descrito por su forma y por su firma, pero no se han escrito sus momentos. Son
        tres y los tres hacen falta más adelante: la media para leer la columna <code>intercept</code> de una salida,
        la varianza para los intervalos de pronóstico (que deduce el Capítulo 4), y las autocorrelaciones para identificar el
        orden.</p>

      <div class="formula">
        <p>Media, varianza y autocorrelaciones de un AR($p$) estacionario:</p>
        $$\begin{aligned}
          \mu &= \frac{c}{1-\phi_1-\phi_2-\cdots-\phi_p} \\[0.8em]
          \gamma_0 &= \operatorname{Var}(y_t) \\[0.3em]
          &= \frac{\sigma^2}{1 - \phi_1\rho_1 - \phi_2\rho_2 - \cdots - \phi_p\rho_p} \\[0.8em]
          \rho_k &= \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p}
        \end{aligned}$$
        <p style="margin-bottom:0;">La recursión vale para $k \ge 1$, con $\rho_0 = 1$ y $\rho_{-k} = \rho_k$.</p>
      </div>

      <p>Conviene notar la diferencia con el MA del módulo siguiente, donde la varianza se escribe de una vez en
        función de los $\theta$. Aquí no: la varianza del AR está escrita en función de las propias
        autocorrelaciones, así que el orden de cálculo es obligatorio —primero la recursión, que se resuelve sola a
        partir de $\rho_0 = 1$, y con sus soluciones la varianza—. Para los dos órdenes que se usan en la práctica
        ese trabajo ya está hecho.</p>

      <div class="formula">
        <p><strong>AR(1)</strong>, con $|\phi| < 1$:</p>
        $$\rho_k = \phi^{\,k}, \qquad \gamma_0 = \frac{\sigma^2}{1-\phi^2}$$
        <p><strong>AR(2)</strong>, con $(\phi_1,\phi_2)$ dentro del triángulo:</p>
        $$\begin{gathered}
          \rho_1 = \frac{\phi_1}{1-\phi_2}, \quad \rho_2 = \phi_2 + \frac{\phi_1^2}{1-\phi_2} \\[0.6em]
          \rho_k = \phi_1\rho_{k-1} + \phi_2\rho_{k-2} \quad (k \ge 3)
        \end{gathered}$$
        $$\begin{aligned}
          \gamma_0 &= \frac{(1-\phi_2)\,\sigma^2}{(1+\phi_2)\bigl[(1-\phi_2)^2 - \phi_1^2\bigr]} \\[0.6em]
            &= \frac{(1-\phi_2)\,\sigma^2}{\begin{gathered}(1+\phi_2)(1-\phi_1-\phi_2) \\ \cdot\,(1+\phi_1-\phi_2)\end{gathered}}
        \end{aligned}$$
      </div>

      <p>La fórmula del AR(1) es la que explica las cifras del primer simulador: $\rho_k = \phi^k$ es literalmente
        «las potencias de $\phi$», positivas y decrecientes cuando $\phi &gt; 0$ ($0.800,\,0.640,\,0.512,\ldots$) y
        alternando de signo cuando $\phi &lt; 0$ ($-0.700,\,0.490,\,-0.343,\ldots$). Y explica también por qué la ACF
        de un AR no se corta nunca: una potencia de un número menor que uno en valor absoluto se acerca a cero, pero
        no llega. Ese contraste con el $\phi_{kk} = 0$ exacto de la PACF es toda la firma del AR.</p>

      <p>La varianza dice algo más. Con $\sigma^2$ fijo, $\gamma_0 = \sigma^2/(1-\phi^2)$ crece sin límite a
        medida que $\phi$ se acerca a $1$: un proceso muy persistente amplifica el mismo ruido hasta una serie que
        se aleja mucho más de su media. Es la versión cuantitativa de lo que se ve al mover el deslizador hacia el
        borde del triángulo.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>El denominador es el triángulo.</strong> Los tres factores de la varianza
          del AR(2) son, uno por uno, las tres desigualdades de la sección anterior: $1-\phi_1-\phi_2$,
          $1+\phi_1-\phi_2$ y $1+\phi_2$. Dentro del triángulo los tres son positivos y $\gamma_0$ es finita;
          sobre cualquiera de los tres lados alguno se anula y la varianza estalla. La región de estacionariedad no
          es entonces una convención algebraica sobre unas raíces: es exactamente el conjunto de parámetros con los
          que existe un proceso de varianza finita que depende solo de los choques pasados.</p>
      </div>

      <h3>Las ecuaciones de Yule–Walker</h3>

      <p>¿De dónde salen esas fórmulas? De un mismo sistema de ecuaciones que relaciona los $\phi$ con las
        autocovarianzas del proceso, y que además será nuestro primer método de estimación en el Módulo 7.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-yule-walker">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-yule-walker" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Escribe el AR($p$) centrado (sin pérdida de generalidad, con $\mu = 0$) y multiplica los dos lados por
                $y_{t-k}$, con $k \ge 1$:</p>
              $$\begin{aligned}
                y_t\, y_{t-k} &= \phi_1 y_{t-1}y_{t-k} + \cdots \\
                &\quad + \phi_p y_{t-p}y_{t-k} + \varepsilon_t y_{t-k}
              \end{aligned}$$
            </li>
            <li>
              <p>Toma esperanzas. Cada término $E[y_{t-i}y_{t-k}]$ es una autocovarianza $\gamma_{k-i}$. El término del
                ruido <strong>se anula</strong>: $\varepsilon_t$ es independiente de todo lo anterior a $t$, y
                $k \ge 1$ garantiza que $y_{t-k}$ pertenece al pasado.</p>
              $$\gamma_k = \phi_1\gamma_{k-1} + \cdots + \phi_p\gamma_{k-p}$$
            </li>
            <li>
              <p>Divide todo entre $\gamma_0$. Como $\rho_k = \gamma_k/\gamma_0$, la misma recursión vale para las
                autocorrelaciones — y esta es la forma en que se usa:</p>
              $$\begin{gathered}
                \rho_k = \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p} \\
                \text{para } k \ge 1
              \end{gathered}$$
            </li>
            <li>
              <p>Escribiendo esa relación para $k = 1,\ldots,p$ y usando $\rho_{-k} = \rho_k$ queda un sistema lineal
                de $p$ ecuaciones con $p$ incógnitas. Para el AR(2):</p>
              $$\begin{aligned}
                \rho_1 &= \phi_1 + \phi_2\rho_1 \\
                \rho_2 &= \phi_1\rho_1 + \phi_2
              \end{aligned}$$
              <p>que se resuelve en</p>
              $$\begin{aligned}
                \rho_1 &= \frac{\phi_1}{1-\phi_2} \\[0.4em]
                \rho_2 &= \phi_2 + \frac{\phi_1^2}{1-\phi_2}
              \end{aligned}$$
            </li>
            <li>
              <p>Falta la varianza, y sale de la misma cuenta con $k = 0$. La única diferencia es que ahora el término
                del ruido <strong>no</strong> se anula: $y_t$ sí contiene a $\varepsilon_t$, y como el choque es
                incorrelado con todo el pasado queda $E[\varepsilon_t y_t] = E[\varepsilon_t^2] = \sigma^2$.</p>
              $$\gamma_0 = \phi_1\gamma_1 + \cdots + \phi_p\gamma_p + \sigma^2$$
              <p>Sustituyendo $\gamma_k = \rho_k\,\gamma_0$ y despejando se llega a la varianza del proceso:</p>
              $$\gamma_0 = \frac{\sigma^2}{1 - \phi_1\rho_1 - \cdots - \phi_p\rho_p}$$
              <p style="margin-bottom:0;">Para el AR(1) basta con $\rho_1 = \phi$ para recuperar
                $\gamma_0 = \sigma^2/(1-\phi^2)$, que en el Módulo 1 había salido por otro camino, sumando la serie
                geométrica de la representación MA($\infty$).</p>
            </li>
          </ol>
          <p class="derivacion-resultado">El sistema se puede leer en las dos direcciones. De los $\phi$ a las $\rho$
            da la <strong>ACF teórica</strong> (lo que dibuja el simulador). De las $\rho$ muestrales a los $\phi$ da el
            <strong>estimador de Yule–Walker</strong> del Módulo 7. Compruébalo con el AR(2) de
            $\phi = (0.5,\,0.3)$: $\rho_1 = 0.5/0.7 = 0.714$ y $\rho_2 = 0.3 + 0.25/0.7 = 0.657$, exactamente las
            cifras del simulador. Y con esas dos, la varianza:
            $\gamma_0 = \sigma^2/(1 - 0.5(0.714) - 0.3(0.657)) = 2.244\,\sigma^2$, más del doble de la del ruido
            que lo alimenta.</p>
        </div>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="ACF y PACF teóricas de un AR">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># ACF y PACF TEORICAS (exactas, no simuladas)
phi &lt;- c(0.5, 0.3)

round(ARMAacf(ar = phi, lag.max = 5)[-1], 4)          # se quita el rezago 0
#&gt; [1] 0.7143 0.6571 0.5429 0.4686 0.3971

round(ARMAacf(ar = phi, lag.max = 5, pacf = TRUE), 4) # PACF
#&gt; [1] 0.7143 0.3000 0.0000 0.0000 0.0000
#   la PACF se corta EXACTAMENTE en el rezago p = 2, y su ultima barra, 0.3000, es phi_2

# Comprobacion de la formula de Yule-Walker para el AR(2)
rho1 &lt;- phi[1] / (1 - phi[2])
rho2 &lt;- phi[2] + phi[1]^2 / (1 - phi[2])
round(c(rho1, rho2), 4)
#&gt; [1] 0.7143 0.6571

# Varianza del proceso: ecuacion de Yule-Walker con k = 0
sigma2 &lt;- 1
rho    &lt;- ARMAacf(ar = phi, lag.max = 2)[-1]
round(sigma2 / (1 - sum(phi * rho)), 4)
#&gt; [1] 2.2436

# La misma, por la formula cerrada del AR(2)
round(sigma2 * (1 - phi[2]) /
        ((1 + phi[2]) * ((1 - phi[2])^2 - phi[1]^2)), 4)
#&gt; [1] 2.2436

          <pre><code class="language-python">import numpy as np

phi = np.array([0.5, 0.3])
ar = np.r_[1, -phi]      # convenio de statsmodels: 1 - phi1 B - phi2 B^2
ma = np.r_[1]

print(np.round(arma_acf(ar, ma, lags=6)[1:], 4))
# [0.7143 0.6571 0.5429 0.4686 0.3971]

print(np.round(arma_pacf(ar, ma, lags=6)[1:], 4))
# [ 0.7143  0.3    -0.      0.     -0.    ]

  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 3</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.3 Procesos de medias móviles
          <span class="text-gray-400 font-normal text-2xl">/ Moving average processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer un MA($q$) por su firma —<strong>ACF que se
                corta</strong> tras el rezago $q$— y entender qué es la invertibilidad y por qué el software la impone.</p>
          </div>
        </div>
      </div>

      <p>El Módulo 2 construyó cada valor de la serie con su propio pasado: en un AR, $y_t$ depende de
        $y_{t-1}, \ldots, y_{t-p}$, y por eso un choque nunca se olvida del todo; su efecto se desvanece, pero sigue
        ahí. Hay otra manera de dar memoria a una serie, que es hacerla depender del pasado de los
        <strong>choques</strong> en lugar del de la serie. Lo que sale se comporta al revés que el AR: olvida por
        completo lo ocurrido hace más de $q$ periodos, y eso deja una firma igual de nítida, pero en la otra función.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso MA($q$)</h4>
        <p>Un proceso de <strong>medias móviles de orden $q$</strong> expresa el valor actual como una combinación
          lineal del choque presente y de los $q$ choques anteriores:</p>
        $$\begin{aligned}
          y_t &= \mu + \varepsilon_t + \theta_1\varepsilon_{t-1} + \cdots \\
          &\quad + \theta_q\varepsilon_{t-q}
        \end{aligned}$$
        <p style="margin-bottom:0;">En forma compacta, $y_t = \mu + \theta(B)\,\varepsilon_t$.</p>
      </div>

      <div class="warning">
        <p><strong>El nombre engaña.</strong> Un proceso de "medias móviles" <em>no</em> es la media móvil de
          suavizamiento del Capítulo 1. Aquella promediaba <strong>valores observados</strong> de la serie; esta
          combina <strong>choques no observados</strong> del ruido, y los pesos $\theta_j$ ni suman uno ni tienen por
          qué ser positivos. Coinciden solo en el nombre, que es un accidente histórico.</p>
      </div>

      <h3>Un MA siempre es estacionario</h3>

      <p>Aquí no hay condición que verificar. Un MA($q$) es una suma <strong>finita</strong> de variables de ruido
        blanco con pesos fijos, así que su media y su varianza no dependen de $t$ y su autocovarianza solo depende del
        rezago. Es estacionario para cualquier valor de los $\theta$.</p>

      <div class="formula">
        <p>Varianza y autocorrelaciones de un MA($q$):</p>
        $$\begin{gathered}
          \gamma_0 = \sigma^2\left(1 + \sum_{j=1}^{q}\theta_j^2\right) \\[0.8em]
          \rho_k = \frac{\sum_{j=0}^{q-k}\theta_j\theta_{j+k}}{1+\sum_{j=1}^{q}\theta_j^2} \quad (k \le q) \\[0.8em]
          \rho_k = 0 \quad (k > q)
        \end{gathered}$$
        <p style="margin-bottom:0;">con el convenio $\theta_0 = 1$.</p>
      </div>

      <p>Ese $\rho_k = 0$ para $k > q$ es <strong>exacto</strong> y es la firma que buscamos: si dos observaciones están
        separadas por más de $q$ periodos, no comparten ni un solo choque, luego su covarianza es cero. El MA tiene
        <em>memoria finita</em>, literalmente de $q$ periodos.</p>

      <div class="simulador" data-simulador="panel-ma-teorico">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Las firmas del MA</h4>
        <p class="simulador-intro">ACF y PACF teóricas de tres procesos de medias móviles. Ahora los papeles están
          <strong>intercambiados</strong> respecto al AR: es la <strong>ACF</strong> la que se corta en seco tras el
          rezago $q$, y la PACF la que decae sin fin.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">ACF teórica</p>
        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación teórica del proceso de medias móviles seleccionado" role="img"></canvas>
        </div>

        <div class="grafico-wrapper" style="height:190px;">
          <canvas aria-label="Función de autocorrelación parcial teórica del proceso de medias móviles seleccionado" role="img"></canvas>
        </div>

      <h3>Invertibilidad: por qué $\theta$ y $1/\theta$ son el mismo modelo</h3>

      <p>Hay un problema serio escondido en el MA, y conviene verlo con el caso más simple. Para un MA(1),
        $\rho_1 = \theta/(1+\theta^2)$. Pon $\theta = 0.5$ y $\theta = 2$:</p>

      <div class="formula">
        $$\begin{gathered}
          \rho_1(0.5) = \frac{0.5}{1.25} = 0.4 \\[0.6em]
          \rho_1(2) = \frac{2}{5} = 0.4
        \end{gathered}$$
      </div>

      <p>Los dos procesos tienen <strong>exactamente la misma ACF</strong>. No la misma varianza, si comparten
        $\sigma^2$: $\gamma_0 = \sigma^2(1+\theta^2)$ vale $1.25\,\sigma^2$ en uno y $5\,\sigma^2$ en el otro. Pero
        basta reescalar el ruido para igualarla. En general, $(\theta,\ \sigma^2)$ y $(1/\theta,\ \theta^2\sigma^2)$
        producen exactamente las mismas autocovarianzas —y, con ruido gaussiano, la misma distribución—, y como
        $\sigma^2$ también se estima, ningún dato puede separarlos: el parámetro $\theta$ no es <em>identificable</em>
        (no hay que confundirlo con la <em>identificación</em> del Módulo 5, que consiste en proponer los órdenes $p$ y
        $q$). Hace falta una regla que elija uno de los dos, y se elige el de $|\theta| < 1$, que se llama
        <strong>invertible</strong>: es el único con el que se puede reconstruir cada choque a partir de lo observado,
        como muestra el final del módulo.</p>

      <div class="simulador" data-simulador="rho1-theta-ma1">
        <h4><i class="fas fa-sliders-h" aria-hidden="true"></i> $\theta$ y $1/\theta$ sobre la curva de $\rho_1$</h4>
        <p class="simulador-intro">La curva es $\rho_1 = \theta/(1+\theta^2)$. El círculo marca el $\theta$ que elijas y
          el rombo su recíproco, $1/\theta$, que queda siempre <strong>a la misma altura</strong>: los dos dan la misma
          ACF. Ninguno sobrepasa las líneas de $\pm 0.5$, y de cada pareja solo es invertible el que cae en
          $|\theta| < 1$; el otro va en rojo, y la lectura da el $\sigma^2$ con el que describe el mismo proceso.
          Empieza en $\theta = 2$, el caso que simula el código de R de más abajo, y prueba $\theta = 1$, donde la
          pareja se funde en un solo punto sobre la cota.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">$\rho_1$ frente a $\theta$ en un MA(1)</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Curva de la autocorrelación de primer orden de un MA(1) en función de theta, con theta y uno sobre theta marcados a la misma altura" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="derivacion">

          <ol class="derivacion-pasos">
            <li>
              <p>Calcula la varianza del MA(1) $y_t = \varepsilon_t + \theta\varepsilon_{t-1}$. Los dos choques son
                incorrelados —es todo lo que exige el ruido blanco—, así que las varianzas se suman:</p>
              $$\begin{aligned}
                \gamma_0 &= \operatorname{Var}(\varepsilon_t) + \theta^2\operatorname{Var}(\varepsilon_{t-1}) \\
                &= \sigma^2(1+\theta^2)
              \end{aligned}$$
            </li>
            <li>
              <p>La autocovarianza de orden 1: $y_t$ e $y_{t-1}$ comparten un único choque, $\varepsilon_{t-1}$.</p>
              $$\begin{aligned}
                \gamma_1 &= E[(\varepsilon_t + \theta\varepsilon_{t-1})(\varepsilon_{t-1} + \theta\varepsilon_{t-2})] \\
                &= \theta\sigma^2
              \end{aligned}$$
              <p>Para $k \ge 2$ no comparten ninguno, luego $\gamma_k = 0$.</p>
            </li>
            <li>
              <p>Por tanto</p>
              $$\rho_1 = \frac{\theta}{1+\theta^2}$$
              <p>y esta función es <strong>invariante bajo $\theta \mapsto 1/\theta$</strong>: sustituyendo,
                $\dfrac{1/\theta}{1+1/\theta^2} = \dfrac{\theta}{\theta^2+1}$, que es lo mismo. Las autocovarianzas
                coinciden también si a la vez se cambia $\sigma^2$ por $\theta^2\sigma^2$: con $1/\theta$ y
                $\theta^2\sigma^2$ salen $\gamma_0 = \theta^2\sigma^2(1+1/\theta^2) = \sigma^2(1+\theta^2)$ y
                $\gamma_1 = (1/\theta)\,\theta^2\sigma^2 = \theta\sigma^2$, las mismas de los pasos 1 y 2.</p>
            </li>
            <li>
              <p>De paso, $\rho_1$ está acotada. Su derivada, $(1-\theta^2)/(1+\theta^2)^2$, se anula en
                $\theta = \pm 1$: el máximo es $1/2$ en $\theta = 1$ y, como $\rho_1$ es impar en $\theta$, el mínimo
                es $-1/2$ en $\theta = -1$. De ahí la cota</p>
              $$|\rho_1| \le \frac{1}{2}$$
              <p>Un MA(1) <strong>no puede</strong> producir una autocorrelación de primer orden mayor que $0.5$ en
                valor absoluto. Y los dos extremos caen en $|\theta| = 1$, justo en la frontera de la invertibilidad:
                un MA(1) invertible se queda siempre estrictamente por debajo.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">De los dos valores $\theta$ y $1/\theta$ se elige por convenio el que cumple
            $|\theta| < 1$: el <strong>invertible</strong>. Es el que permite escribir el proceso como un AR($\infty$)
            convergente (Módulo 4) y, en consecuencia, el que permite reconstruir los choques a partir de lo observado.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Condición de invertibilidad</h4>
        <p style="margin-bottom:0;">Un MA($q$) es <strong>invertible</strong> si todas las raíces de $\theta(B) = 0$
          están fuera del círculo unitario. Es la misma condición que la estacionariedad del AR, aplicada al otro
          polinomio.</p>
      </div>

      <p>El caso frontera, $|\theta| = 1$, ya apareció en el Capítulo 2. Allí, diferenciar un ruido blanco
        —sobrediferenciarlo— daba $\nabla\varepsilon_t = \varepsilon_t - \varepsilon_{t-1}$, que es un MA(1) con
        $\theta = -1$: su raíz, la de $1 - B$, cae justo sobre el círculo unitario, así que no es invertible, y su
        $\rho_1 = \theta/(1+\theta^2)$ vale $-0.5$, el mínimo que un MA(1) puede alcanzar. Es el $-0.5$ que el
        Capítulo 2 daba como indicio de sobrediferenciación, y es el punto que el simulador de arriba marca como
        «frontera».</p>

      <h3>El triángulo de invertibilidad del MA(2)</h3>

      <p>Para $q = 1$ la condición es $|\theta| < 1$. Para $q = 2$ no hace falta resolver nada:
        $\theta(B) = 1 + \theta_1 B + \theta_2 B^2$ es el $\phi(B) = 1 - \phi_1 B - \phi_2 B^2$ del AR(2) con
        $\phi_1 = -\theta_1$ y $\phi_2 = -\theta_2$, así que basta llevar el triángulo del Módulo 2 a los $\theta$
        cambiando los signos.</p>

      <div class="formula">
        <p>Un MA(2) es invertible si y solo si el par $(\theta_1,\theta_2)$ cumple las tres condiciones:</p>
        $$\begin{gathered}
          \theta_1 + \theta_2 > -1 \\
          \theta_2 - \theta_1 > -1 \\
          -1 < \theta_2 < 1
        \end{gathered}$$
      </div>

      <p>El triángulo desmiente dos intuiciones. Un coeficiente mayor que 1 no condena el modelo:
        $\theta = (1.5,\ 0.6)$ cumple las tres condiciones y es invertible, con sus dos raíces de módulo $1.291$. Y
        unos coeficientes pequeños no lo salvan: en $\theta = (0.5,\ -0.6)$ los dos están por debajo de 1 en valor
        absoluto, pero $\theta_2 - \theta_1 = -1.1$ incumple la segunda condición, y una de sus raíces tiene módulo
        $0.940$.</p>

      <div class="note">
        <p><strong>El límite $|\rho_1| \le 0.5$ es una herramienta de diagnóstico.</strong> Si en un correlograma
          muestral ves $r_1 = 0.8$ y quisieras ajustar un MA(1), no hay ningún $\theta$ que lo produzca. Pero la cota
          es propia del MA(1): en un MA($q$) el techo de $\rho_1$ es $\cos\big(\pi/(q+2)\big)$, que vale $0.707$ con
          $q = 2$ y $0.809$ con $q = 3$. Así que $r_1 = 0.8$ descarta también el MA(2), y un MA(3) solo llegaría
          rozando su techo; lo razonable es buscar un componente autorregresivo. Sirve para descartar modelos sin
          ajustar nada.</p>
      </div>

      <h3>Por qué la PACF de un MA no se corta</h3>

      <p>Queda sin justificar una afirmación del simulador: la PACF de un MA decae sin cortarse nunca. La PACF en el
        rezago $k$ es la correlación entre $y_t$ e $y_{t-k}$ una vez descontados los rezagos intermedios, o, lo que es
        lo mismo, el último coeficiente de la regresión de $y_t$ sobre sus $k$ valores anteriores. En un AR($p$) esa
        regresión ya contiene todo lo que importa cuando $k = p$, y por eso más allá de $p$ la PACF vale cero.</p>

      <p>Un MA invertible también puede escribirse como una regresión sobre su propio pasado, solo que infinita. En
        el MA(1) basta despejar el choque, $\varepsilon_{t-1} = y_{t-1} - \theta\varepsilon_{t-2}$, y sustituir hacia
        atrás una y otra vez:</p>

      $$\begin{aligned}
        y_t &= \varepsilon_t + \theta\varepsilon_{t-1} \\
        &= \theta y_{t-1} - \theta^2 y_{t-2} + \theta^3 y_{t-3} - \cdots + \varepsilon_t
      \end{aligned}$$

      <p>Es un AR de orden <strong>infinito</strong>: no hay un último rezago con el que la regresión quede completa,
        y cada observación pasada sigue aportando algo, cada vez menos. Por eso la PACF decae como $|\theta|^k$,
        alternando el signo si $\theta > 0$ y siempre negativa si $\theta < 0$. Es lo que dibuja el simulador:
        $0.4878,\ -0.3123,\ 0.2215,\ -0.1652$ con $\theta = 0.8$, y con $\theta = -0.8$ las mismas magnitudes, todas
        negativas. La suma solo converge si $|\theta| < 1$, que es otra manera de decir invertible. Y como $\theta$ y
        $1/\theta$ comparten ACF, comparten también PACF: la versión no invertible dibuja el mismo patrón.</p>

      <p>El Módulo 4 generaliza esta reescritura a cualquier ARMA —el modelo que combina un AR y un MA—, y la
        recorre también en el sentido contrario.</p>

      <p>En el Módulo 1, al desarrollar el AR(1) hacia atrás, apareció sin buscarlo la expresión

      <p>Un <strong>ARMA($p,q$)</strong> es lo que sale de pedirle a un proceso las dos memorias a la vez: un AR($p$)
        alimentado por un MA($q$), $\phi(B)\,y_t = \theta(B)\,\varepsilon_t$. El Módulo 5 lo define y lo estudia con

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Las dos representaciones</h4>
        <p>Un proceso ARMA admite dos escrituras, y cada una necesita una condición distinta:</p>
        $$\begin{gathered}
          \underbrace{y_t = \sum_{j=0}^{\infty}\psi_j\,\varepsilon_{t-j}}_{\text{MA}(\infty)\;:\;\psi(B)=\theta(B)/\phi(B)}
          \\[1.2em]
          \underbrace{\varepsilon_t = \sum_{j=0}^{\infty}\pi_j\,y_{t-j}}_{\text{AR}(\infty)\;:\;\pi(B)=\phi(B)/\theta(B)}
        \end{gathered}$$
        <p style="margin-bottom:0;">con $\psi_0 = \pi_0 = 1$. La escritura MA($\infty$) existe si el proceso es
          <strong>estacionario</strong>, con las raíces de $\phi(B)$ fuera del círculo unitario; la AR($\infty$), si es
          <strong>invertible</strong>, con las de $\theta(B)$ fuera. Cada polinomio responde por su escritura, y cuando
          se cumplen las dos condiciones las dos escrituras son equivalentes.</p>
      </div>

      <p>Cada una responde a una pregunta distinta. Los <strong>pesos $\psi$</strong> dicen cuánto de un choque
        ocurrido hace $j$ periodos sigue presente hoy: son la <em>función de respuesta al impulso</em>. Los
        <strong>pesos $\pi$</strong> dicen cuánto pesa la observación de hace $j$ periodos al reconstruir el choque
        actual, y de ahí sale el pronóstico a un paso. Basta despejar $y_t$ en la escritura AR($\infty$), separando el
        término $j = 0$:</p>

      $$\begin{gathered}
        y_t = -\sum_{j=1}^{\infty}\pi_j\,y_{t-j} + \varepsilon_t \\
        \Longrightarrow\quad \hat y_{t\mid t-1} = -\sum_{j=1}^{\infty}\pi_j\,y_{t-j}
      \end{gathered}$$

      <h3>Cómo se calculan los pesos</h3>

        $B^j$ da dos recursiones:</p>

      $$\begin{gathered}
        \psi_j = \theta_j + \sum_{i=1}^{p}\phi_i\,\psi_{j-i} \\
        \pi_j = -\phi_j - \sum_{i=1}^{q}\theta_i\,\pi_{j-i}
      \end{gathered}$$

      <p>con $\psi_0 = \pi_0 = 1$, $\theta_j = 0$ si $j > q$, $\phi_j = 0$ si $j > p$, y los pesos de índice negativo
        iguales a cero. Cada peso se calcula con los anteriores, que es todo lo que pide el ejemplo de más abajo; el
        desarrollo plegado enseña de dónde salen.</p>

      </div>

      <h3>Un ejemplo a mano: el ARMA(1,1)</h3>

      <p>Con $p = q = 1$ cada recursión tiene un solo término en la suma. Para el proceso de los códigos de más
        abajo, con $\phi = 0.7$ y $\theta = 0.5$, quedan</p>

      $$\begin{gathered}
        \psi_j = \theta_j + 0.7\,\psi_{j-1} \\
        \pi_j = -\phi_j - 0.5\,\pi_{j-1}
      \end{gathered}$$

      <p>donde $\theta_j$ vale $0.5$ en $j = 1$ y cero después, y $\phi_j$ vale $0.7$ en $j = 1$ y cero después. Los
        primeros pesos salen así:</p>

      <table style="position:relative;">
        <caption class="sr-only">Pesos psi y pi del ARMA(1,1) con phi = 0.7 y theta = 0.5, calculados con la recursión</caption>
        <thead>
          <tr>
            <th scope="col">$j$</th>
            <th scope="col">$\psi_j$</th>
            <th scope="col">Cálculo</th>
            <th scope="col">$\pi_j$</th>
            <th scope="col">Cálculo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>$0$</td><td>$1$</td><td>convenio</td><td>$1$</td><td>convenio</td>
          </tr>
          <tr>
            <td>$1$</td><td>$1.2$</td><td>$0.5 + 0.7 \times 1$</td><td>$-1.2$</td><td>$-0.7 - 0.5 \times 1$</td>
          </tr>
          <tr>
            <td>$2$</td><td>$0.84$</td><td>$0.7 \times 1.2$</td><td>$0.6$</td><td>$-0.5 \times (-1.2)$</td>
          </tr>
          <tr>
            <td>$3$</td><td>$0.588$</td><td>$0.7 \times 0.84$</td><td>$-0.3$</td><td>$-0.5 \times 0.6$</td>
          </tr>
        </tbody>
      </table>

      <p>Son las cifras que imprimen los códigos de más abajo. Desde $j = 2$ cada paso es una sola multiplicación
        —por $\phi$ en los $\psi$, por $-\theta$ en los $\pi$—, así que las dos sucesiones son geométricas y tienen
        forma cerrada para $j \ge 1$:</p>

      $$\begin{gathered}
        \psi_j = (\phi+\theta)\,\phi^{\,j-1} \\
        \pi_j = -(\phi+\theta)\,(-\theta)^{\,j-1}
      \end{gathered}$$

      <p>Las dos fórmulas resumen lo que enseña el simulador. Los $\psi$ se apagan como $\phi^j$ y necesitan
        $|\phi| < 1$: es la estacionariedad. Los $\pi$ se apagan como $(-\theta)^j$ y necesitan $|\theta| < 1$: es la
        invertibilidad, y también la razón por la que alternan de signo cuando $\theta > 0$. Y si $\phi + \theta = 0$,
        todos los pesos desde $j = 1$ se anulan a la vez, que es la redundancia con la que se cierra el módulo.</p>

      <h3>Para qué sirven los $\psi$ en los capítulos siguientes</h3>

      <div class="note">
        <p><strong>Por qué esto reaparece en los capítulos 4, 5 y 6.</strong> La varianza del error de pronóstico a
          $h$ pasos de un ARMA es</p>
        $$\operatorname{Var}(e_{T+h}) = \sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
        <p>La suma llega hasta $h-1$ porque el horizonte $h$ usa $h$ pesos, de $\psi_0$ a $\psi_{h-1}$: el peso
          $\psi_j$ es el último del horizonte $h = j+1$.</p>
        <p style="margin-bottom:0;">Los pesos $\psi$ son, literalmente, lo que da su forma de abanico a las bandas de
          un pronóstico (aquí, «abanico» es la banda de incertidumbre que se ensancha con el horizonte, y no el
          abanico de amplitud que crece con el nivel de la serie, de los Capítulos 1 y 2). Cuanto más lentamente
          decaen, más rápido se abre la incertidumbre. En un proceso estacionario,
          sin embargo, el abanico no crece sin fin: la suma tiende a $\sum_j \psi_j^2 = \gamma_0/\sigma^2$, así que la
          varianza del pronóstico se acerca a la del propio proceso. El control $h$ del simulador de arriba recorre esa
          suma. El Capítulo 4 deduce de
          aquí los intervalos de pronóstico, el 5 los usa para dibujar el abanico del modelo <em>airline</em> y el 6
          comprueba si esos intervalos cubren de verdad lo que prometen.</p>
      </div>

      <div class="note">
        <p><strong>¿Y si $\phi(B)$ tiene una raíz unitaria?</strong> El proceso deja de ser estacionario y la suma
          MA($\infty$) ya no converge, pero la recursión de los $\psi$ no lo nota: sigue produciendo números. En la
          caminata aleatoria, $\phi(B) = 1 - B$, salen todos iguales, $\psi_j = 1$, porque ningún choque se desvanece
          nunca.</p>
        <p style="margin-bottom:0;">Lo que se pierde es lo que depende de la suma infinita: $\sum_j \psi_j^2$ diverge y
          $\gamma_k$ deja de existir. La varianza del pronóstico, en cambio, solo suma $h$ términos y sigue valiendo:
          en la caminata aleatoria da $\sigma^2 h$, un abanico que se abre sin límite. Así es como el Capítulo 4 usará
          estos pesos con los modelos ARIMA.</p>
      </div>

      <h3>Dos ideas que hereda el Módulo 5</h3>

      <p>La dualidad deja preparadas las dos ideas con las que el Módulo 5 presenta los modelos mixtos: por qué
        conviene mezclar AR y MA, y la trampa en la que se cae al hacerlo mal.</p>

      <p>La primera es la <strong>parsimonia</strong>. Un ARMA(1,1) es un AR($\infty$) cuyos pesos decaen como
        $|\theta|^j$. En el de los códigos de arriba, con $\phi = 0.7$ y $\theta = 0.5$, los $|\pi_j|$ no bajan de
        $0.01$ hasta $j = 8$: imitarlo con un AR puro obliga a conservar siete coeficientes para que el primer peso
        descartado quede por debajo de ese umbral, y el ARMA lo consigue con dos.</p>

      <p>La segunda es la <strong>redundancia</strong>. Si $\phi(B)$ y $\theta(B)$ comparten un factor, el cociente
        $\psi(B) = \theta(B)/\phi(B)$ lo cancela. Basta llevar el simulador de arriba a $\phi = 0.5$ y
        $\theta = -0.5$: las dos gráficas se reducen a la barra de $j = 0$, porque $(1 - 0.5B)/(1 - 0.5B) = 1$, y lo
        que parecía un ARMA(1,1) es ruido blanco.</p>

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Escribir los momentos de un ARMA($p,q$) y usar la tabla

      <p>Los módulos 2 y 3 dejaron dos familias con firmas opuestas: el AR corta la PACF y el MA corta la ACF. El
        Módulo 4 mostró que cada una puede escribirse como la otra en versión infinita, y cerró con dos ideas para
        este módulo: mezclar las dos partes ahorra parámetros, y, si sus polinomios comparten un factor, ese factor se
        cancela. Aquí se juntan en un solo modelo, y aparece la pregunta práctica que recorre el resto del capítulo:
        dada una serie, qué órdenes proponer.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso ARMA($p,q$)</h4>
        <p>Combina las dos partes anteriores en un solo modelo:</p>
        $$\begin{aligned}
          y_t = c &+ \phi_1 y_{t-1} + \cdots + \phi_p y_{t-p} \\
          &+ \varepsilon_t \\
          &+ \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}
        \end{aligned}$$
        <p style="margin-bottom:0;">o, en forma compacta, $\;\phi(B)\,y_t = c + \theta(B)\,\varepsilon_t$. Es
          <strong>estacionario</strong> si las raíces de $\phi(B)$ están fuera del círculo unitario, e
          <strong>invertible</strong> si lo están las de $\theta(B)$: cada polinomio responde por lo suyo.</p>
      </div>

      <p>¿Para qué mezclarlos? Por <strong>parsimonia</strong>. El ARMA(1,1) del Módulo 4, con $\phi = 0.7$ y
        $\theta = 0.5$, es un AR($\infty$): un AR puro necesitaría siete coeficientes solo para que el primer peso que
        descarta bajara de $0.01$, y el ARMA lo describe con dos. Menos parámetros significa estimaciones más precisas
        y pronósticos más estables, que es de lo que se trata.</p>

      <h3>La tabla de identificación</h3>

      <p>Con lo que dejaron los Módulos 2 y 3, la regla para proponer un modelo cabe en una tabla. En ella
        <em>identificar</em> quiere decir proponer los órdenes $p$ y $q$ a partir de los correlogramas; no es lo mismo
        que la identificabilidad de un parámetro, la del Módulo 3.</p>

      <h3>Identificar es un ciclo</h3>

        cuatro pasos que se repite hasta que el diagnóstico queda limpio, y la tabla solo interviene en el tercero.</p>

      <p>El ciclo nombra herramientas que el Módulo 8 desarrolla y que aquí solo se anuncian: los criterios de

        Ljung–Box resume en un solo $p$-valor si los residuales parecen ruido blanco, y su argumento
        <code>fitdf</code> descuenta de los grados de libertad los parámetros que se estimaron.</p>

      <h3>Media, varianza y autocovarianzas</h3>

      <p>Antes de mirar qué le pasa a la ACF conviene escribir los momentos del proceso, como se hizo con el AR en el
        Módulo 2 y con el MA en el Módulo 3. El ARMA los tiene los tres, pero uno de ellos deja de escribirse en
        función de los parámetros: hay que pasar por los pesos $\psi$.</p>

      <div class="formula">
        <p>Media y autocovarianzas de un ARMA($p,q$) estacionario:</p>
        $$\begin{gathered}
          \mu = \frac{c}{1-\phi_1-\cdots-\phi_p} \\[0.8em]
          \gamma_k = \sigma^2 \sum_{j=0}^{\infty} \psi_j\,\psi_{j+k}, \qquad k \ge 0 \\[0.8em]
          \gamma_0 = \operatorname{Var}(y_t) = \sigma^2 \sum_{j=0}^{\infty} \psi_j^{\,2}
        \end{gathered}$$
        <p style="margin-bottom:0;">con los pesos $\psi_j$ de la representación MA($\infty$) del Módulo 4.</p>
      </div>

      <p>La media es la del AR y nada más: la parte MA es una suma de choques de media cero, así que no la mueve. Lo
        que cambia es la varianza. En el AR($p$) se escribía con los $\phi$ y las $\rho_k$, y en el MA($q$) con los
        $\theta$ en una suma de $q+1$ términos; aquí, para $p \ge 1$, no hay forma corta en función de los
        parámetros y hay que sumar la serie de los $\psi$. Es el precio de mezclar, y es la misma razón por la que el
        Módulo 4 insistía en que los $\psi$ no son un adorno algebraico.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Las fórmulas de los módulos 2 y 3 son casos de esta.</strong> Con $q = 0$
          los pesos son $\psi_j = \phi^{\,j}$ y la suma geométrica devuelve $\gamma_0 = \sigma^2/(1-\phi^2)$. Con
          $p = 0$ solo hay $q+1$ pesos no nulos —$1, \theta_1, \ldots, \theta_q$— y sale
          $\gamma_0 = \sigma^2(1+\sum\theta_j^2)$. Y para $k > q$ <strong>todos</strong> los productos
          $\psi_j\psi_{j+k}$ de la suma llevan un factor nulo: ahí está, escrito como una suma vacía, el corte exacto
          de la ACF de un MA.</p>
      </div>

      <p>Para el modelo mixto más pequeño, que es el que este capítulo usa una y otra vez, sí hay forma cerrada.</p>

      <div class="formula">
        <p><strong>ARMA(1,1)</strong>, $y_t = c + \phi y_{t-1} + \varepsilon_t + \theta\varepsilon_{t-1}$:</p>
        $$\begin{aligned}
          \gamma_0 &= \sigma^2\,\frac{1+2\phi\theta+\theta^2}{1-\phi^2} \\[0.6em]
          \gamma_1 &= \sigma^2\,\frac{(1+\phi\theta)(\phi+\theta)}{1-\phi^2}
        \end{aligned}$$
      </div>

      <p>Las dos comparten denominador, así que al dividir una entre otra el $1-\phi^2$ se cancela y queda la
        $\rho_1$ que usa la sección siguiente. Conviene verlo antes de encontrársela: ese $1+2\phi\theta+\theta^2$
        que allí aparece como un denominador sin explicación <strong>es la varianza del proceso</strong>, salvo el
        factor $\sigma^2/(1-\phi^2)$. Con $\phi = 0.7$ y $\theta = 0.5$ vale $1.95$, y la varianza,
        $1.95/0.51 = 3.8235\,\sigma^2$. Del mismo modo, $\gamma_1 = 1.62/0.51\,\sigma^2 = 3.1765\,\sigma^2$, y el
        cociente de las dos es $\rho_1 = 3.1765/3.8235 = 0.8308$: la primera de las cuatro cifras que el Módulo 4
        obtuvo sumando pesos $\psi$.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-momentos-arma">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-momentos-arma" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte de la representación MA($\infty$) del Módulo 4, que existe para todo ARMA estacionario. Con el
                proceso centrado:</p>
              $$y_t - \mu = \sum_{j=0}^{\infty} \psi_j\,\varepsilon_{t-j}$$
            </li>
            <li>
              <p>Multiplica por $y_{t-k}-\mu$ y toma esperanzas. Quedan productos de dos choques, y como el ruido
                blanco es incorrelado <strong>solo sobreviven los que emparejan el mismo choque</strong>: los términos
                $\psi_j\varepsilon_{t-j}$ y $\psi_i\varepsilon_{t-k-i}$ se encuentran cuando $j = i+k$. Cada
                encuentro aporta $E[\varepsilon^2] = \sigma^2$.</p>
              $$\gamma_k = \sigma^2 \sum_{i=0}^{\infty} \psi_i\,\psi_{i+k}$$
            </li>
            <li>
              <p>Con $k = 0$ los índices coinciden y la suma es de cuadrados:
                $\gamma_0 = \sigma^2\sum_j \psi_j^{\,2}$. Es la cantidad que el Módulo 4 llamaba el
                <em>techo</em> del abanico de pronóstico, ahora con nombre: la varianza del proceso.</p>
            </li>
            <li>
              <p>Para el ARMA(1,1) los pesos son $\psi_0 = 1$ y $\psi_j = (\phi+\theta)\phi^{\,j-1}$. Separando
                el primero, lo que queda es una geométrica de razón $\phi^2$:</p>
              $$\begin{aligned}
                \gamma_0 &= \sigma^2\biggl[1 \\
                &\qquad + (\phi+\theta)^2\sum_{j\ge1}\phi^{\,2(j-1)}\biggr] \\
                &= \sigma^2\left[1 + \frac{(\phi+\theta)^2}{1-\phi^2}\right]
              \end{aligned}$$
              <p style="margin-bottom:0;">y al juntar en una sola fracción, $1-\phi^2+(\phi+\theta)^2$ se simplifica
                a $1+2\phi\theta+\theta^2$.</p>
            </li>
            <li>
              <p>Lo mismo con $k = 1$, ahora emparejando $\psi_j$ con $\psi_{j+1}$:</p>
              $$\begin{aligned}
                \gamma_1 &= \sigma^2\biggl[(\phi+\theta) \\
                &\qquad + (\phi+\theta)^2\phi\sum_{j\ge1}\phi^{\,2(j-1)}\biggr] \\
                &= \sigma^2\,\frac{(\phi+\theta)(1+\phi\theta)}{1-\phi^2}
              \end{aligned}$$
            </li>
          </ol>
          <p class="derivacion-resultado">Dividiendo $\gamma_1$ entre $\gamma_0$ desaparece el denominador común y
            sale exactamente la $\rho_1$ de la sección siguiente. Compruébalo con $\phi = 0.7$ y $\theta = 0.5$:
            $\gamma_0 = 3.8235\,\sigma^2$, $\gamma_1 = 3.1765\,\sigma^2$ y su cociente,
            $\rho_1 = 0.8308$.</p>
        </div>
      </div>

      <h3>Por qué la tabla no da los órdenes de un ARMA</h3>

      <p>La fila del ARMA esconde un resultado exacto. Para $k > q$, la observación $y_{t-k}$ solo depende de choques
        anteriores a $t - q$, y ninguno de los $\varepsilon_t, \ldots, \varepsilon_{t-q}$ de la parte MA está
        correlacionado con ella. Al calcular la autocovarianza esa parte desaparece, y la ACF cumple la misma
        recursión que la de un AR($p$):</p>

      <div class="formula">
        $$\begin{gathered}
          \rho_k = \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p} \\
          \text{para } k > q
        \end{gathered}$$
      </div>

      <p>La condición $k > q$ no es adorno. En el ARMA(2,1) de $\phi = (0.5,\,0.3)$ y $\theta = 0.4$ la recursión
        acierta desde $\rho_2$ —$0.7307$, $0.6238$, $0.5311$—, pero en $k = 1$ no se cumple. Allí diría
        $\rho_1 = \phi_1\rho_0 + \phi_2\rho_{-1} = 0.5 + 0.3\,\rho_1$, porque $\rho_{-1} = \rho_1$; con el valor
        verdadero, $\rho_1 = 0.8614$, el lado derecho da $0.7584$. Los primeros $q$ rezagos son justamente los que
        la parte MA todavía toca, y para esos hay que volver a la suma de $\psi$ de la sección anterior.</p>

      <p>En el ARMA(1,1) eso deja un único valor por calcular. El primero sale de la fórmula</p>

      <div class="formula">
        $$\rho_1 = \frac{(1+\phi\theta)(\phi+\theta)}{1+2\phi\theta+\theta^2}$$
      </div>

      <p>y desde ahí cada rezago es el anterior multiplicado por $\phi$: $\rho_k = \phi^{\,k-1}\rho_1$. Con el proceso
        del Módulo 4, $\phi = 0.7$ y $\theta = 0.5$, queda $\rho_1 = 1.35 \times 1.2 / 1.95 = 0.8308$, y después $0.5815$,
        $0.4071$ y $0.2850$: las mismas cifras que el Módulo 4 obtuvo sumando pesos $\psi$.</p>

      <p>Ahí está la razón de que la tabla no dé los órdenes. El ritmo del decaimiento lo pone la parte AR —en el
        ARMA(1,1), el factor $\phi$—, y la parte MA solo decide con qué valor arranca. Un AR(1) con $\phi = 0.7$ decae
        exactamente al mismo ritmo, desde $\rho_1 = 0.7$: dos ACF geométricas con la misma razón, que a simple vista se
        confunden y que con una muestra corta cuesta mucho separar.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="ACF de un ARMA">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># ACF de un ARMA(1,1): rho_1 por la formula y despues rho_k = phi * rho_{k-1}
phi &lt;- 0.7; theta &lt;- 0.5
rho1 &lt;- (1 + phi * theta) * (phi + theta) / (1 + 2 * phi * theta + theta^2)
round(rho1 * phi^(0:4), 4)
#&gt; [1] 0.8308 0.5815 0.4071 0.2850 0.1995
round(ARMAacf(ar = phi, ma = theta, lag.max = 5)[-1], 4)
#&gt;      1      2      3      4      5
#&gt; 0.8308 0.5815 0.4071 0.2850 0.1995    <- coinciden

# Un AR(1) con el mismo phi decae al mismo ritmo, desde otro arranque
round(ARMAacf(ar = phi, lag.max = 5)[-1], 4)
#&gt;      1      2      3      4      5
#&gt; 0.7000 0.4900 0.3430 0.2401 0.1681

#&gt; 0.7307 0.6238 0.5311 0.4527

#&gt; [1] 0.7307 0.6238 0.5311 0.4527

# ...pero NO para k = q: aqui q = 1 y la recursion no se cumple.
# En k = 1 dice rho_1 = phi1 rho_0 + phi2 rho_{-1}, y rho_{-1} = rho_1:
round(unname(0.5 * r[1] + 0.3 * r[2]), 4)        # lado derecho, con el rho_1 verdadero
#&gt; [1] 0.7584
round(unname(r[2]), 4)                            # rho_1 verdadero
#&gt; [1] 0.8614

# VARIANZA del proceso: gamma_k = s2 * sum(psi_j * psi_{j+k})
sigma2 &lt;- 1

g1 &lt;- sigma2 * sum(psi[-length(psi)] * psi[-1])
round(c(gamma1 = g1, rho1 = g1 / (sigma2 * sum(psi^2))), 4)

# [0.7307 0.6238 0.5311 0.4527]

      <h3>Redundancia de parámetros: cuando sobra un factor</h3>

      <p>Hay una trampa específica de los modelos mixtos. Si $\phi(B)$ y $\theta(B)$ comparten un factor, ese factor se
        cancela y el modelo es en realidad más pequeño de lo que aparenta. El Módulo 4 ya lo dejó ver con los mismos
        números que siguen: en su simulador, $\phi = 0.5$ y $\theta = -0.5$ reducen los pesos $\psi$ y $\pi$ a la barra
        de $j = 0$.</p>

      <div class="formula">
        <p>Tomemos el ARMA(1,1) con $\phi_1 = 0.5$ y $\theta_1 = -0.5$:</p>
        $$\begin{gathered}
          (1-0.5B)\,y_t = (1-0.5B)\,\varepsilon_t \\
          \Longrightarrow\quad y_t = \varepsilon_t
        \end{gathered}$$
        <p style="margin-bottom:0;">Es <strong>ruido blanco</strong> escrito con dos parámetros de más.</p>
      </div>

      <div class="warning">
        <p><strong>Cómo se manifiesta en una salida real.</strong> Cuando dos factores casi se cancelan, la
          verosimilitud es casi plana en esa dirección: los coeficientes salen con <strong>errores estándar enormes</strong>,
          el optimizador puede no converger, y valores muy distintos de $(\phi,\theta)$ dan ajustes casi idénticos. Si
          ves un ARMA con $\hat\phi_1 \approx -\hat\theta_1$ y errores estándar grandes, prueba el modelo más pequeño
          antes de interpretar nada.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Redundancia de parámetros">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Redundancia: phi = -theta hace que el modelo colapse a ruido blanco
round(ARMAacf(ar = 0.5, ma = -0.5, lag.max = 5)[-1], 6)
#&gt; [1] 0 0 0 0 0        <- la ACF de un ruido blanco

# Un proceso CASI redundante: phi = 0.5 y theta = -0.45 casi se cancelan,
# asi que en la practica es casi ruido blanco
round(ARMAacf(ar = 0.5, ma = -0.45, lag.max = 5)[-1], 4)
#&gt; [1] 0.0515 0.0257 0.0129 0.0064 0.0032    <- autocorrelaciones minusculas

set.seed(11)
y &lt;- arima.sim(n = 200, list(ar = 0.5, ma = -0.45))
ajuste &lt;- arima(y, order = c(1, 0, 1))
#&gt; Warning: possible convergence problem: optim gave code = 1
round(cbind(coef = coef(ajuste), ee = sqrt(diag(ajuste$var.coef))), 4)
#&gt;              coef     ee
#&gt; ar1        0.8300 0.2307
#&gt; ma1       -0.7953 0.2477
#&gt; intercept  0.0137 0.0806

# Los verdaderos son 0.5 y -0.45; la estimacion se va a 0.83 y -0.80.
# Lo que SI reproduce es la suma (0.0347 frente a 0.05): el ajuste fija
# la cancelacion, no cada coeficiente por separado.

# Y el modelo mas pequeno gana. El criterio es el AICc, que presenta el
# Modulo 8: por ahora basta saber que menor es mejor.
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
c(arma11 = aicc(ajuste, 200),
  ar1    = aicc(arima(y, order = c(1, 0, 0)), 200),
  ruido  = aicc(arima(y, order = c(0, 0, 0)), 200))
#&gt;   arma11      ar1    ruido
#&gt; 554.3463 552.9939 550.9449</code></pre>

          tramo de calentamiento (<em>burn-in</em>) para que la serie salga ya en régimen estacionario;
          <code>generate_sample()</code> de statsmodels <strong>no lo hace</strong> salvo que se le pase
          <code>burnin=</code>. Sin él la serie arranca en cero y su primer tramo tiene menos varianza que el
          resto: con $\phi = 0.95$, la varianza en $t = 5$ es $4.1$ cuando la del régimen estacionario es $10.3$.
          Con procesos muy persistentes ese arranque comprimido dura decenas de observaciones.</p>

      <h3>Tres formas de estimar el mismo AR(2)</h3>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Los tres métodos</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Yule–Walker</strong> (método de momentos). Toma las ecuaciones del Módulo 2, sustituye las
            $\rho_k$ teóricas por las muestrales $r_k$ y resuelve el sistema. Solo sirve para modelos AR puros. Es
            explícito, rápido y no necesita optimización.</li>
          <li><strong>CSS</strong> (<em>conditional sum of squares</em>). Minimiza $\sum \hat\varepsilon_t^2$
            condicionando en los primeros valores observados. Es mínimos cuadrados —ordinarios en un AR puro, no
            lineales si hay parte MA— y descarta la información que aportan las primeras observaciones.</li>
          <li><strong>Máxima verosimilitud</strong>. Maximiza la verosimilitud gaussiana <em>exacta</em>, que
            incluye la contribución de las primeras observaciones. Es el más eficiente y el que da errores estándar
            fiables.</li>
        </ul>
      </div>

      <p>Entre CSS y máxima verosimilitud la diferencia está en la primera observación: ML incluye su densidad y CSS la
        ignora, y ese término <strong>penaliza</strong> los $\phi$ cercanos a la frontera de la región estacionaria. Con
        $T$ grande pesa poco y los dos métodos coinciden; con $T$ pequeño o $\phi$ cerca de $1$, no, y CSS puede incluso
        salirse de la región estacionaria, cosa que ML no hace en el ejemplo. El código R de abajo lo
        reproduce con $T = 40$ y $\phi = 0.95$, y el desarrollo plegado deduce el término.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-verosimilitud">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-verosimilitud" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Supón ruido gaussiano y escribe la densidad conjunta de la muestra factorizándola en condicionales,
                que es lo natural en una serie de tiempo:</p>
              $$\begin{aligned}
                &f(y_1,\ldots,y_T) \\
                &\quad = f(y_1)\prod_{t=2}^{T} f(y_t \mid y_{t-1},\ldots,y_1)
              \end{aligned}$$
            </li>
            <li>
              <p>Para un AR(1) de media cero, la condicional es inmediata: todo el pasado se resume en $y_{t-1}$,
                y dado ese valor el único término aleatorio es $\varepsilon_t$, luego $y_t \mid y_{t-1} \sim N(\phi y_{t-1},\, \sigma^2)$. Tomando logaritmos, la
                parte condicional de la log-verosimilitud es</p>
              $$\begin{aligned}
                &-\frac{T-1}{2}\log(2\pi\sigma^2) \\
                &-\frac{1}{2\sigma^2}\sum_{t=2}^{T}(y_t - \phi y_{t-1})^2
              \end{aligned}$$
            </li>
            <li>
              <p>Maximizar eso equivale a <strong>minimizar la suma de cuadrados</strong>
                $\sum_{t=2}^{T}(y_t-\phi y_{t-1})^2$. Ahí está el método <strong>CSS</strong>: es máxima
                verosimilitud, pero <em>condicionada</em> a $y_1$, cuya densidad se ha ignorado. En un AR es,
                además, una regresión ordinaria de $y_t$ sobre $y_{t-1}$.</p>
            </li>
            <li>
              <p>La verosimilitud <strong>exacta</strong> añade el término que falta. La primera observación no es
                un dato fijo: procede de la distribución estacionaria, $y_1 \sim N\!\left(0,\ \sigma^2/(1-\phi^2)\right)$,
                y contribuye con</p>
              $$-\tfrac{1}{2}\log\frac{2\pi\sigma^2}{1-\phi^2} - \frac{(1-\phi^2)\,y_1^2}{2\sigma^2}$$
            </li>
            <li>
              <p>Ese término aporta el sumando $\tfrac{1}{2}\log(1-\phi^2)$, que tiende a $-\infty$ cuando
                $|\phi| \to 1$: <strong>penaliza</strong> los valores cercanos a la frontera de la región
                estacionaria. Con $T$ grande, un único término frente a los $T-1$ de la parte condicional es
                despreciable y los dos métodos convergen; con $T$ pequeño o $\phi$ cerca de la frontera, no.</p>
            </li>
            <li>
              <p>Un ejemplo con $T = 40$ y $\phi = 0.95$, que reproduce el código R de abajo: CSS estima
                $\hat\phi = 1.0086$, <strong>fuera</strong> de la región estacionaria, y ML se queda en $0.9808$.
                No es lo habitual —en mil simulaciones iguales CSS pasa de $1$ entre un 2.5 y un 4.6&nbsp;% de las
                veces, según la semilla— y ML no lo hace en ninguna de las que estima, por dos razones: el sumando
                $\tfrac{1}{2}\log(1-\phi^2)$ cae a $-\infty$ en la frontera, y <code>arima()</code>, al maximizar la
                verosimilitud, reparametriza los $\phi$ para no salir de la región estacionaria
                (<code>transform.pars = TRUE</code>, su valor por defecto). Quedarse dentro no es quedarse lejos:
                en un 13 a 17&nbsp;% de las simulaciones la estimación ML es $\ge 0.999$, y en 4 a 13 de cada mil el
                optimizador no llega a dar estimación.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">En un AR($p$) el argumento es el mismo: CSS condiciona en las $p$
            primeras observaciones y ML añade su densidad conjunta. De ahí la jerarquía: CSS es más barato y sirve para arrancar; ML es más
            preciso. Por eso <code>arima()</code> usa por defecto <code>method = "CSS-ML"</code>, que estima por CSS
            para obtener valores iniciales y termina maximizando la verosimilitud exacta.</p>
        </div>
      </div>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.tsa.ar_model import AutoReg
from statsmodels.regression.linear_model import yule_walker

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values
print(len(manchas))   # 100

# 1. Yule-Walker. OJO: statsmodels usa por defecto el divisor n-k ("adjusted");
#    para reproducir ar() de R hay que pedir method="mle", que usa el divisor n.
rho, sigma = yule_walker(manchas - manchas.mean(), order=2, method="mle")
print(np.round(rho, 4))     # [ 1.3173 -0.6338]

# 2. CSS: la API nueva de ARIMA NO lo ofrece. Sus method= son statespace,
#    innovations_mle, hannan_rissanen, burg, innovations y yule_walker;
#    fit(method="css") lanza ValueError: "css" is not a valid estimator.
#    El antiguo tsa.arima_model.ARMA, que si tenia method="css", fue
#    retirado en statsmodels 0.13. Pero en un AR puro el CSS es la regresion
#    de y_t sobre sus rezagos, y esa la hace AutoReg:
css = AutoReg(manchas, lags=2, trend="c").fit()
print(np.round(css.params[1:], 4))   # [ 1.4032 -0.7099]  el CSS de R

# 3. Maxima verosimilitud. statespace (el defecto) e innovations_mle son
#    AMBOS verosimilitud exacta y dan el mismo punto:
ml  = ARIMA(manchas, order=(2, 0, 0), trend="c").fit()
mle = ARIMA(manchas, order=(2, 0, 0), trend="c").fit(method="innovations_mle")
print(np.round(ml.arparams, 4))    # [ 1.4059 -0.7111]
print(np.round(mle.arparams, 4))   # [ 1.4059 -0.7111]  identico

# Raices y pseudo-periodo
phi = ml.arparams
raices = np.roots(np.r_[1, -phi][::-1])
print(np.round(np.abs(raices), 4))                 # [1.1859 1.1859]
print(round(2 * np.pi / np.angle(raices[0]), 4))   # 10.7365
# R daba 10.7369: los optimizadores convergen a puntos ligerisimamente
# distintos. La diferencia es de 4 diezmilesimas de anio, irrelevante aqui.</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>Yule–Walker no es el mismo en R y en Python.</strong> <code>yule_walker()</code> de statsmodels usa
          por defecto <code>method="adjusted"</code> (divisor $T-k$) y <code>ar()</code> de R usa el divisor $T$. Con
          las opciones por defecto, las estimaciones <strong>no coinciden</strong>. Hay que pedir
          <code>method="mle"</code> —nombre desafortunado, porque no es máxima verosimilitud, solo indica el
          divisor— para reproducir la salida de R. Es la misma clase de discrepancia que el ADF del Capítulo 2.</p>
      </div>
