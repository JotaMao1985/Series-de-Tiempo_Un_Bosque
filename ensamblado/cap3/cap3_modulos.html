# Sobrediferenciar un ruido blanco (Capitulo 2): theta = -1, rho_1 = -0.5 y la
# raiz de 1 - B cae justo SOBRE el circulo (frontera)
print(np.round(arma_acf(np.r_[1], np.r_[1, -1.0], lags=4)[1:], 4))   # [-0.5  0.   0. ]
print(np.abs(ArmaProcess(np.r_[1], np.r_[1, -1.0]).maroots))          # [1.]

# statsmodels tambien devuelve la version invertible, con sigma2 reescalado
y = ArmaProcess(np.r_[1], np.r_[1, 2.0]).generate_sample(   # theta = 2, sigma2 = 1
    nsample=1000, distrvs=np.random.default_rng(1).standard_normal)
res = ARIMA(y, order=(0, 0, 1)).fit()
print(np.round(res.maparams, 4), np.round(res.params[-1], 4))
# [0.5051] 3.8888     &lt;- theta ~ 1/2 y sigma2 ~ 2^2 = 4: el mismo proceso
</code></pre>
        </div>
      </div>

      <h3>Por qué la PACF de un MA no se corta</h3>

      <p>Queda sin justificar una afirmación del simulador: <span data-afirma="c3-m3-06">la PACF de un MA decae sin cortarse nunca <cite class="cita" data-ref="cryer2008time" data-loc="p. 114"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 114)</a></cite>.</span> <span data-afirma="c3-m3-15">La PACF en el
        rezago $k$ es la correlación entre $y_t$ e $y_{t-k}$ una vez descontados los rezagos intermedios <cite class="cita" data-ref="cryer2008time" data-loc="p. 112"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 112)</a></cite>, o, lo que es
        lo mismo, el último coeficiente de la proyección lineal (la regresión poblacional) de $y_t$ sobre sus $k$ valores anteriores <cite class="cita" data-ref="hamilton1994time" data-loc="p. 111"><a href="#ref-m3-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 111)</a></cite>. En un AR($p$) esa proyección ya contiene todo lo que importa cuando $k = p$, y por eso más allá de $p$ la PACF vale cero <cite class="cita" data-ref="cryer2008time" data-loc="p. 114"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 114)</a></cite>.</span></p>

      <p>Un MA invertible también puede escribirse como una regresión sobre su propio pasado, solo que infinita. En
        el MA(1) basta despejar el choque, $\varepsilon_{t-1} = y_{t-1} - \theta\varepsilon_{t-2}$, y sustituir hacia
        atrás una y otra vez:</p>

      $$\begin{aligned}
        y_t &= \varepsilon_t + \theta\varepsilon_{t-1} \\
        &= \theta y_{t-1} - \theta^2 y_{t-2} + \theta^3 y_{t-3} - \cdots + \varepsilon_t
      \end{aligned}$$

      <p>Es un AR de orden <strong>infinito</strong>: no hay un último rezago con el que la regresión quede completa,
        y cada observación pasada sigue aportando algo, cada vez menos. <span data-afirma="c3-m3-14">Por eso la PACF decae exponencialmente, a un ritmo que acaba siendo el de $|\theta|^k$,
        alternando el signo si $\theta > 0$ y siempre negativa si $\theta < 0$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 114"><a href="#ref-m3-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 114)</a></cite>.</span> Es lo que dibuja el simulador:
        $0.4878,\ -0.3123,\ 0.2215,\ -0.1652$ con $\theta = 0.8$, y con $\theta = -0.8$ las mismas magnitudes, todas
        negativas. La suma solo converge si $|\theta| < 1$, que es otra manera de decir invertible. Y como $\theta$ y
        $1/\theta$ comparten ACF, comparten también PACF: la versión no invertible dibuja el mismo patrón.</p>

      <p>El Módulo 4 generaliza esta reescritura a cualquier ARMA —el modelo que combina un AR y un MA—, y la
        recorre también en el sentido contrario.</p>
      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">El módulo define el MA(1) invertible como el único con el que se puede reconstruir cada choque a partir de lo observado. Para verlo, simula 500 choques y construye con <strong>los mismos choques</strong> dos series $y_t = \varepsilon_t + \theta\,\varepsilon_{t-1}$: una con $\theta = 0.5$ y otra con $\theta = 2$. Los choques se reconstruyen despejando, $\hat\varepsilon_t = y_t - \theta\,\hat\varepsilon_{t-1}$, y como $\varepsilon_0$ no se observa se arranca con $\hat\varepsilon_0 = 0$. Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>A mano: cómo depende el error de reconstrucción, $\hat\varepsilon_t - \varepsilon_t$, del error del periodo anterior, y qué le pasa al cabo de $t$ periodos con cada $\theta$.</li>
            <li>En R: el tamaño de ese error en $t = 1, 2, 5, 10$ y $20$ para las dos series, usando en cada una su $\theta$ verdadero.</li>
            <li>Lo que devuelve <code>arima()</code> al ajustar un MA(1) a la serie de $\theta = 2$, y la correlación de sus residuales con los choques que se usaron para simularla. ¿Los reconstruye?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m3-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m3-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m3-pista" hidden>
            <p style="margin:0;">En (a), escribe una debajo de la otra la ecuación del modelo, $y_t = \varepsilon_t + \theta\,\varepsilon_{t-1}$, y la de la reconstrucción, $y_t = \hat\varepsilon_t + \theta\,\hat\varepsilon_{t-1}$, y réstalas. En (c), antes de ejecutar nada, calcula con qué $\theta$ y con qué $\sigma^2$ describe el mismo proceso el MA(1) invertible.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m3-sol" hidden>
            <p><strong>Respuesta: con $\theta = 0.5$ el error de reconstrucción se reduce a la mitad en cada periodo; con $\theta = 2$ se duplica; y <code>arima()</code> devuelve el otro MA(1), el invertible, cuyos residuales no son los choques simulados.</strong></p>
            <pre><code class="language-r">set.seed(33)
n &lt;- 500
e &lt;- rnorm(n + 1)                         # los choques e_0, e_1, ..., e_n
ahora &lt;- e[-1]; antes &lt;- e[-(n + 1)]      # e_t y e_{t-1}, para t = 1, ..., n
y_a &lt;- ahora + 0.5 * antes                # MA(1) con theta = 0.5
y_b &lt;- ahora + 2.0 * antes                # MA(1) con theta = 2 y los MISMOS choques

# Reconstruye los choques: e_t = y_t - theta * e_{t-1}, con 0 donde iria e_0
reconstruye &lt;- function(y, theta) {
  rec &lt;- numeric(length(y)); anterior &lt;- 0
  for (t in seq_along(y)) { rec[t] &lt;- y[t] - theta * anterior; anterior &lt;- rec[t] }
  rec
}

# (a) y (b) El error de reconstruccion, |reconstruido - verdadero|,
#     en t = 1, 2, 5, 10 y 20
abs(e[1])                                 # |e_0|: lo unico que no se conoce
#&gt; [1] 0.1359245
signif(abs(reconstruye(y_a, 0.5) - ahora)[c(1, 2, 5, 10, 20)], 3)
#&gt; [1] 6.80e-02 3.40e-02 4.25e-03 1.33e-04 1.30e-07
signif(abs(reconstruye(y_b, 2.0) - ahora)[c(1, 2, 5, 10, 20)], 3)
#&gt; [1] 2.72e-01 5.44e-01 4.35e+00 1.39e+02 1.43e+05

# (c) Lo que devuelve arima() con la serie de theta = 2
m &lt;- arima(y_b, order = c(0, 0, 1), include.mean = FALSE)
round(c(theta = coef(m)[["ma1"]], sigma2 = m$sigma2), 4)
#&gt;  theta sigma2
#&gt; 0.4506 4.0304
# Sus residuales NO son los choques con que se simulo la serie
round(c(con_e_t = cor(residuals(m), ahora), con_e_t_1 = cor(residuals(m), antes)), 3)
#&gt;   con_e_t con_e_t_1
#&gt;     0.451     0.778
# ... pero si son ruido blanco
round(acf(residuals(m), lag.max = 3, plot = FALSE)$acf[-1], 3)
#&gt; [1]  0.012  0.034 -0.011</code></pre>
            <p><strong>(a)</strong> Al restar, $y_t$ desaparece y queda $\hat\varepsilon_t - \varepsilon_t = -\theta\,(\hat\varepsilon_{t-1} - \varepsilon_{t-1})$: cada error es el anterior multiplicado por $-\theta$. El primero es el de haber puesto $0$ donde iba $\varepsilon_0$, así que tras $t$ periodos el error mide $|\theta|^{\,t}\,|\varepsilon_0|$. Con $\theta = 0.5$ se apaga; con $\theta = 2$ crece sin límite.</p>
            <p><strong>(b)</strong> En esta simulación $|\varepsilon_0| = 0.136$. Con $\theta = 0.5$ el error es $0.068$ en $t = 1$ y $0.00013$ en $t = 10$: el arranque se olvida y los choques quedan reconstruidos. Con $\theta = 2$ es $0.272$ en $t = 1$, $139$ en $t = 10$ y unos $143\,000$ en $t = 20$. Se está usando el $\theta$ verdadero y aun así la reconstrucción no sirve, porque cualquier error de partida, por pequeño que sea, se duplica en cada periodo. Eso es no ser invertible.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> El MA(1) invertible que describe el mismo proceso que $(\theta, \sigma^2) = (2, 1)$ es $(1/2,\ 4)$, y eso es lo que estima <code>arima()</code>: $\hat\theta = 0.451$ y $\hat\sigma^2 = 4.03$. Sus residuales son ruido blanco (autocorrelaciones de $0.012$, $0.034$ y $-0.011$), pero no son los choques con que se simuló la serie: su correlación con $\varepsilon_t$ es $0.451$ y con $\varepsilon_{t-1}$, $0.778$ (los valores teóricos son $0.5$ y $0.75$). Los mismos datos admiten dos parejas de coeficiente y choques, y solo la invertible se deja reconstruir desde lo observado: por eso es la que el software devuelve por defecto.</p>

          <span class="text-gray-400 font-normal text-2xl">/ AR–MA duality</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Ver que AR y MA son dos formas de escribir lo mismo, y
              manejar los pesos $\psi$ y $\pi$, que desde el Capítulo 4 sostienen los intervalos de pronóstico.</p>
          </div>

      <p>En el Módulo 1, al desarrollar el AR(1) hacia atrás, apareció sin buscarlo la expresión
        $y_t = \sum_j \phi^j \varepsilon_{t-j}$: un AR(1) escrito como un MA de orden infinito. El Módulo 3 terminó con
        el camino inverso, un MA(1) invertible escrito como un AR de orden infinito, y con él explicó por qué su PACF
        no se corta. Ninguna de las dos reescrituras es una casualidad del caso particular: son un hecho general y una
        de las ideas más útiles del capítulo.</p>

      <p>Un <strong>ARMA($p,q$)</strong> es lo que sale de pedirle a un proceso las dos memorias a la vez: un AR($p$)
        alimentado por un MA($q$), $\phi(B)\,y_t = \theta(B)\,\varepsilon_t$. El Módulo 5 lo define y lo estudia con
        detalle; aquí basta saber que con $q = 0$ es el AR del Módulo 2, que con $p = 0$ es el MA del Módulo 3, y que
        lleva los dos polinomios, de modo que la dualidad vale para todos.</p>

      <div class="definition" data-afirma="c3-m4-01">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Las dos representaciones</h4>
        <p>Un proceso ARMA admite dos escrituras, y cada una necesita una condición distinta:</p>
        $$\begin{gathered}
          \underbrace{y_t = \sum_{j=0}^{\infty}\psi_j\,\varepsilon_{t-j}}_{\text{MA}(\infty)\;:\;\psi(B)=\theta(B)/\phi(B)}
          \\[1.2em]
          \underbrace{\varepsilon_t = \sum_{j=0}^{\infty}\pi_j\,y_{t-j}}_{\text{AR}(\infty)\;:\;\pi(B)=\phi(B)/\theta(B)}
        \end{gathered}$$
        <p style="margin-bottom:0;">con $\psi_0 = \pi_0 = 1$. La escritura MA($\infty$) existe si el proceso es
          <strong>estacionario</strong>, con las raíces de $\phi(B)$ fuera del círculo unitario <cite class="cita" data-ref="cryer2008time" data-loc="p. 78"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 78)</a></cite>; la AR($\infty$), si es
          <strong>invertible</strong>, con las de $\theta(B)$ fuera <cite class="cita" data-ref="cryer2008time" data-loc="p. 80"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 80)</a></cite>. Cada polinomio responde por su escritura, y cuando
          se cumplen las dos condiciones las dos escrituras son equivalentes.</p>
      </div>

      <p>Cada una responde a una pregunta distinta. <span data-afirma="c3-m4-02">Los <strong>pesos $\psi$</strong> dicen cuánto de un choque
        ocurrido hace $j$ periodos sigue presente hoy: son la <em>función de respuesta al impulso</em> <cite class="cita" data-ref="hamilton1994time" data-loc="p. 54"><a href="#ref-m4-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 54)</a></cite>.</span> Los
        <strong>pesos $\pi$</strong> dicen cuánto pesa la observación de hace $j$ periodos al reconstruir el choque
        actual, y de ahí sale el pronóstico a un paso. Basta despejar $y_t$ en la escritura AR($\infty$), separando el
        término $j = 0$:</p>

      $$\begin{gathered}
        y_t = -\sum_{j=1}^{\infty}\pi_j\,y_{t-j} + \varepsilon_t \\
        \Longrightarrow\quad \hat y_{t\mid t-1} = -\sum_{j=1}^{\infty}\pi_j\,y_{t-j}
      \end{gathered}$$

      <p><span data-afirma="c3-m4-03">El choque $\varepsilon_t$ es incorrelado con todo el pasado, así que nada de ese pasado lo anticipa: el mejor
        pronóstico lineal se queda con la suma, y su error a un paso es exactamente $\varepsilon_t$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 197"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 197)</a></cite>.</span> El signo menos
        viene del convenio $\pi_0 = 1$. En el ARMA(1,1) de los códigos de más abajo, $\pi_1 = -1.2$ significa que la
        última observación entra en el pronóstico con peso $+1.2$.</p>

      <div class="simulador" data-simulador="dualidad-psi-pi">

          traducción operativa de la no invertibilidad <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.4"><a href="#ref-m4-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.4)</a></cite></span>, y <span data-afirma="c3-m4-31">la razón de fondo por la que el software, por defecto, devuelve la raíz invertible <cite class="cita" data-ref="hamilton1994time" data-loc="p. 67"><a href="#ref-m4-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 67)</a></cite></span>.</p>
      </div>

      <h3>Cómo se calculan los pesos</h3>

      <p>Los pesos salen de comparar coeficientes en dos identidades, $\phi(B)\,\psi(B) = \theta(B)$ y
        $\theta(B)\,\pi(B) = \phi(B)$, que son las definiciones de arriba sin la división. Igualar los coeficientes de
        $B^j$ da dos recursiones:</p>

      $$\begin{gathered}
        \psi_j = \theta_j + \sum_{i=1}^{p}\phi_i\,\psi_{j-i} \\
        \pi_j = -\phi_j - \sum_{i=1}^{q}\theta_i\,\pi_{j-i}
      \end{gathered}$$

      <p>con $\psi_0 = \pi_0 = 1$, $\theta_j = 0$ si $j > q$, $\phi_j = 0$ si $j > p$, y los pesos de índice negativo
        iguales a cero. Cada peso se calcula con los anteriores, que es todo lo que pide el ejemplo de más abajo; el
        desarrollo plegado enseña de dónde salen.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-pesos-psi">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-pesos-psi" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte de la identidad que define los $\psi$ y quítate la división multiplicando por $\phi(B)$:</p>
              $$\begin{gathered}
                \psi(B) = \frac{\theta(B)}{\phi(B)} \\
                \Longleftrightarrow\; \phi(B)\,\psi(B) = \theta(B)
              \end{gathered}$$
            </li>
            <li>
              <p>Desarrolla el producto y agrupa por potencias de $B$. El coeficiente de $B^j$ del lado izquierdo es
                $\psi_j - \phi_1\psi_{j-1} - \cdots - \phi_p\psi_{j-p}$, y del lado derecho es $\theta_j$
                (o cero si $j > q$).</p>
            </li>
            <li>
              <p>Igualando coeficiente a coeficiente sale una <strong>recursión</strong>, la misma de arriba:</p>
              $$\begin{gathered}
                \psi_j = \theta_j + \sum_{i=1}^{p}\phi_i\,\psi_{j-i} \\
                \psi_0 = 1,\quad \theta_j = 0 \text{ si } j>q
              \end{gathered}$$
              <p style="margin-bottom:0;">En los primeros rezagos la suma se sale por abajo del rango: se entiende
                $\psi_j = 0$ para $j &lt; 0$, y lo mismo para los $\pi$ del paso siguiente.</p>
            </li>
            <li>
              <p>Para los $\pi$ el razonamiento es idéntico sobre $\theta(B)\pi(B) = \phi(B)$, e intercambia los
                papeles:</p>
              $$\begin{gathered}
                \pi_j = -\phi_j - \sum_{i=1}^{q}\theta_i\,\pi_{j-i} \\
                \pi_0 = 1,\quad \phi_j = 0 \text{ si } j>p
              \end{gathered}$$
            </li>
            <li>
              <p data-afirma="c3-m4-06">Con los $\psi$ se obtiene además la autocovarianza sin resolver ningún sistema, porque los
                $\varepsilon$ son incorrelados <cite class="cita" data-ref="cryer2008time" data-loc="p. 56"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 56)</a></cite>:</p>
              $$\gamma_k = \sigma^2\sum_{j=0}^{\infty}\psi_j\,\psi_{j+k}$$
            </li>
          </ol>
          <p class="derivacion-resultado">Esta última fórmula es la que usa el <strong>laboratorio del Módulo 5</strong>
            para dibujar la ACF teórica: suma los productos de los pesos y divide entre $\gamma_0$. El último bloque de
            código de este módulo hace la misma cuenta, con dos mil términos, y la contrasta con
            <code>ARMAacf()</code>.</p>
        </div>
      </div>

      <h3>Un ejemplo a mano: el ARMA(1,1)</h3>

      <p>Con $p = q = 1$ cada recursión tiene un solo término en la suma. Para el proceso de los códigos de más
        abajo, con $\phi = 0.7$ y $\theta = 0.5$, quedan</p>

      $$\begin{gathered}
        \psi_j = \theta_j + 0.7\,\psi_{j-1} \\
        \pi_j = -\phi_j - 0.5\,\pi_{j-1}
      \end{gathered}$$

      <p>donde $\theta_j$ vale $0.5$ en $j = 1$ y cero después, y $\phi_j$ vale $0.7$ en $j = 1$ y cero después. Los
        primeros pesos salen así:</p>

      <table style="position:relative;">
        <caption class="sr-only">Pesos psi y pi del ARMA(1,1) con phi = 0.7 y theta = 0.5, calculados con la recursión</caption>
        <thead>
          <tr>
            <th scope="col">$j$</th>
            <th scope="col">$\psi_j$</th>
            <th scope="col">Cálculo</th>
            <th scope="col">$\pi_j$</th>
            <th scope="col">Cálculo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>$0$</td><td>$1$</td><td>convenio</td><td>$1$</td><td>convenio</td>
          </tr>
          <tr>
            <td>$1$</td><td>$1.2$</td><td>$0.5 + 0.7 \times 1$</td><td>$-1.2$</td><td>$-0.7 - 0.5 \times 1$</td>
          </tr>
          <tr>
            <td>$2$</td><td>$0.84$</td><td>$0.7 \times 1.2$</td><td>$0.6$</td><td>$-0.5 \times (-1.2)$</td>
          </tr>
          <tr>
            <td>$3$</td><td>$0.588$</td><td>$0.7 \times 0.84$</td><td>$-0.3$</td><td>$-0.5 \times 0.6$</td>
          </tr>
        </tbody>
      </table>

      <p>Son las cifras que imprimen los códigos de más abajo. <span data-afirma="c3-m4-30">Desde $j = 2$ cada paso es una sola multiplicación
        —por $\phi$ en los $\psi$, por $-\theta$ en los $\pi$—, así que las dos sucesiones son geométricas y tienen
        forma cerrada para $j \ge 1$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 78"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 78)</a></cite></span>:</p>

      $$\begin{gathered}
        \psi_j = (\phi+\theta)\,\phi^{\,j-1} \\
        \pi_j = -(\phi+\theta)\,(-\theta)^{\,j-1}
      \end{gathered}$$

      <p>Las dos fórmulas resumen lo que enseña el simulador. Los $\psi$ se apagan como $\phi^j$ y necesitan
        $|\phi| < 1$: es la estacionariedad. Los $\pi$ se apagan como $(-\theta)^j$ y necesitan $|\theta| < 1$: es la
        invertibilidad, y también la razón por la que alternan de signo cuando $\theta > 0$. Y si $\phi + \theta = 0$,
        todos los pesos desde $j = 1$ se anulan a la vez, que es la redundancia con la que se cierra el módulo.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Pesos psi y pi">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># Pesos psi (respuesta al impulso) de un ARMA(1,1)
psi &lt;- ARMAtoMA(ar = 0.7, ma = 0.5, lag.max = 8)
round(psi, 4)
#&gt; [1] 1.2000 0.8400 0.5880 0.4116 0.2881 0.2017 0.1412 0.0988
#   ojo: ARMAtoMA NO devuelve psi_0 = 1, empieza en psi_1

# Un AR(1) puro: los psi son las potencias de phi
round(ARMAtoMA(ar = 0.8, lag.max = 5), 4)
#&gt; [1] 0.8000 0.6400 0.5120 0.4096 0.3277
round(0.8^(1:5), 4)
#&gt; [1] 0.8000 0.6400 0.5120 0.4096 0.3277   <- identicos

# Pesos pi: como pi(B) = phi(B)/theta(B), son los psi del proceso que
# intercambia los dos polinomios. Ojo a los signos: el "ar" de aqui es
# -theta y el "ma" es -phi, por el convenio de signos del Modulo 1.
pi_w &lt;- ARMAtoMA(ar = -0.5, ma = -0.7, lag.max = 8)
round(pi_w, 4)
#&gt; [1] -1.2000  0.6000 -0.3000  0.1500 -0.0750  0.0375 -0.0187  0.0094
# se alternan de signo y se desvanecen: el MA(1) con theta = 0.5 SI es invertible

# La ACF teorica a partir de los psi (lo que hace el simulador)
psi0 &lt;- c(1, ARMAtoMA(ar = 0.7, ma = 0.5, lag.max = 2000))
g &lt;- sapply(0:5, function(k) sum(psi0[1:(2001 - k)] * psi0[(1 + k):2001]))
round((g / g[1])[-1], 4)
#&gt; [1] 0.8308 0.5815 0.4071 0.2850 0.1995
round(ARMAacf(ar = 0.7, ma = 0.5, lag.max = 5)[-1], 4)   # exacta
#&gt; [1] 0.8308 0.5815 0.4071 0.2850 0.1995   <- coinciden</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import ArmaProcess, arma_acf

proceso = ArmaProcess(np.r_[1, -0.7], np.r_[1, 0.5])

# Pesos psi: aqui SI incluyen psi_0 = 1
psi = proceso.arma2ma(lags=9)
print(np.round(psi, 4))
# [1.     1.2    0.84   0.588  0.4116 0.2881 0.2017 0.1412 0.0988]

# Pesos pi: a diferencia de R, aqui no hay que intercambiar los polinomios,
# arma2ar ya aplica el convenio
pi_w = proceso.arma2ar(lags=9)
print(np.round(pi_w, 4))
# [ 1.     -1.2     0.6    -0.3     0.15   -0.075   0.0375 -0.0188  0.0094]

# ACF teorica a partir de los psi
psi0 = proceso.arma2ma(lags=2001)
g = np.array([np.dot(psi0[:2001 - k], psi0[k:2001]) for k in range(6)])
print(np.round((g / g[0])[1:], 4))
# [0.8308 0.5815 0.4071 0.285  0.1995]
print(np.round(arma_acf(np.r_[1, -0.7], np.r_[1, 0.5], lags=6)[1:], 4))
# [0.8308 0.5815 0.4071 0.285  0.1995]
</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>Dos convenios distintos para el término $j = 0$.</strong> <span data-afirma="c3-m4-09"><code>ARMAtoMA()</code> de R empieza en
          $\psi_1$ y <code>arma2ma()</code> de statsmodels empieza en $\psi_0 = 1$; con los $\pi$ ocurre exactamente lo
          mismo</span>. Se ve en las salidas de arriba: las de R traen ocho valores y las de Python, nueve. Al compararlas o al
          programar la fórmula de la varianza del pronóstico, un desplazamiento de un índice cambia el resultado sin
          dar ningún error.</p>
      </div>

      <h3>Para qué sirven los $\psi$ en los capítulos siguientes</h3>

      <div class="note">
        <p data-afirma="c3-m4-12"><strong>Por qué esto reaparece en los capítulos 4, 5 y 6.</strong> La varianza del error de pronóstico a
          $h$ pasos de un ARMA <cite class="cita" data-ref="cryer2008time" data-loc="p. 202"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 202)</a></cite> es</p>
        $$\operatorname{Var}(e_{T+h}) = \sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
        <p>La suma llega hasta $h-1$ porque el horizonte $h$ usa $h$ pesos, de $\psi_0$ a $\psi_{h-1}$: el peso
          $\psi_j$ es el último del horizonte $h = j+1$.</p>
        <p style="margin-bottom:0;">Los pesos $\psi$ son, literalmente, lo que da su forma de abanico a las bandas de
          un pronóstico (aquí, «abanico» es la banda de incertidumbre que se ensancha con el horizonte, y no el
          abanico de amplitud que crece con el nivel de la serie, de los Capítulos 1 y 2). Cuanto más lentamente
          decaen, más rápido se abre la incertidumbre. <span data-afirma="c3-m4-13">En un proceso estacionario,
          sin embargo, el abanico no crece sin fin: la suma tiende a $\sum_j \psi_j^2 = \gamma_0/\sigma^2$, así que la
          varianza del pronóstico se acerca a la del propio proceso <cite class="cita" data-ref="cryer2008time" data-loc="p. 197"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 197)</a></cite>.</span> El control $h$ del simulador de arriba recorre esa
          suma. El Capítulo 4 deduce de
          aquí los intervalos de pronóstico, el 5 los usa para dibujar el abanico del modelo <em>airline</em> y el 6
          comprueba si esos intervalos cubren de verdad lo que prometen.</p>
      </div>

      <div class="note">
        <p><strong>¿Y si $\phi(B)$ tiene una raíz unitaria?</strong> El proceso deja de ser estacionario y la suma
          MA($\infty$) ya no converge, pero la recursión de los $\psi$ no lo nota: sigue produciendo números. <span data-afirma="c3-m4-14">En la
          caminata aleatoria, $\phi(B) = 1 - B$, salen todos iguales, $\psi_j = 1$, porque ningún choque se desvanece
          nunca <cite class="cita" data-ref="cryer2008time" data-loc="p. 199"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 199)</a></cite>.</span></p>
        <p style="margin-bottom:0;">Lo que se pierde es lo que depende de la suma infinita: $\sum_j \psi_j^2$ diverge y
          $\gamma_k$ deja de existir. <span data-afirma="c3-m4-32">La varianza del pronóstico, en cambio, solo suma $h$ términos y sigue valiendo:
          en la caminata aleatoria da $\sigma^2 h$, un abanico que se abre sin límite <cite class="cita" data-ref="cryer2008time" data-loc="p. 199"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 199)</a></cite>.</span> Así es como el Capítulo 4 usará
          estos pesos con los modelos ARIMA.</p>
      </div>

      <h3>Dos ideas que hereda el Módulo 5</h3>

      <p>La dualidad deja preparadas las dos ideas con las que el Módulo 5 presenta los modelos mixtos: por qué
        conviene mezclar AR y MA, y la trampa en la que se cae al hacerlo mal.</p>

      <p data-afirma="c3-m4-10">La primera es la <strong>parsimonia</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 8"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 8)</a></cite>. Un ARMA(1,1) es un AR($\infty$) cuyos pesos decaen como
        $|\theta|^j$. En el de los códigos de arriba, con $\phi = 0.7$ y $\theta = 0.5$, los $|\pi_j|$ no bajan de
        $0.01$ hasta $j = 8$: imitarlo con un AR puro obliga a conservar siete coeficientes para que el primer peso
        descartado quede por debajo de ese umbral, y el ARMA lo consigue con dos.</p>

      <p>La segunda es la <strong>redundancia</strong>. <span data-afirma="c3-m4-11">Si $\phi(B)$ y $\theta(B)$ comparten un factor, el cociente
        $\psi(B) = \theta(B)/\phi(B)$ lo cancela <cite class="cita" data-ref="cryer2008time" data-loc="p. 77"><a href="#ref-m4-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 77)</a></cite>.</span> Basta llevar el simulador de arriba a $\phi = 0.5$ y
        $\theta = -0.5$: las dos gráficas se reducen a la barra de $j = 0$, porque $(1 - 0.5B)/(1 - 0.5B) = 1$, y lo
        que parecía un ARMA(1,1) es ruido blanco.</p>
      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">Un ARMA(1,1) tiene $\phi = 0.8$ y $\theta = -0.5$, sin constante: $y_t = 0.8\,y_{t-1} + \varepsilon_t - 0.5\,\varepsilon_{t-1}$. Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>A mano, los pesos $\pi_1$ a $\pi_4$ con la recursión del módulo, y el pronóstico a un paso escrito como una suma ponderada de las cuatro últimas observaciones.</li>
            <li>Ese pronóstico para una serie cuyas cuatro últimas observaciones son, de la más reciente a la más antigua, $-1.23$, $-0.05$, $1.00$ y $0.69$ (salen de simular 200 valores del proceso con <code>set.seed(34)</code>). Compáralo en R con el que usa las 200 observaciones: ¿cuánto se pierde por truncar la suma?</li>
            <li>Los pesos $\psi_1$ y $\psi_2$, la varianza del error de pronóstico a 1, 2 y 3 pasos en unidades de $\sigma^2$, y el techo al que tiende.</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m4-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m4-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m4-pista" hidden>
            <p style="margin:0;">Con $\theta$ negativo los signos de los $\pi$ no salen como en el ejemplo del módulo: calcula $\pi_1$ con cuidado y deja que la recursión haga el resto. El pronóstico lleva $-\pi_j$, no $\pi_j$. Para el techo, los $\psi$ forman una progresión geométrica desde $j = 1$.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m4-sol" hidden>
            <p><strong>Respuesta: el pronóstico a un paso es $0.3\,y_T + 0.15\,y_{T-1} + 0.075\,y_{T-2} + 0.0375\,y_{T-3} + \cdots$; con cuatro observaciones da $-0.276$ y con las doscientas, $-0.293$.</strong></p>
            <pre><code class="language-r">phi &lt;- 0.8; theta &lt;- -0.5

# (a) Pesos pi: los psi del proceso que intercambia los polinomios
#     (ar = -theta, ma = -phi)
round(ARMAtoMA(ar = -theta, ma = -phi, lag.max = 6), 4)
#&gt; [1] -0.3000 -0.1500 -0.0750 -0.0375 -0.0188 -0.0094
round(-(phi + theta) * (-theta)^(0:5), 4)       # la forma cerrada: los mismos
#&gt; [1] -0.3000 -0.1500 -0.0750 -0.0375 -0.0188 -0.0094

# (b) Una serie de 200 valores y su pronostico a un paso
set.seed(34)
y &lt;- arima.sim(n = 200, model = list(ar = phi, ma = theta))
ultimas &lt;- round(rev(y)[1:4], 2)                # y_200, y_199, y_198, y_197
ultimas
#&gt; [1] -1.23 -0.05  1.00  0.69
pesos &lt;- -ARMAtoMA(ar = -theta, ma = -phi, lag.max = 200)    # -pi_1, -pi_2, ...
round(sum(pesos[1:4] * ultimas), 4)             # a mano: con esas cuatro
#&gt; [1] -0.2756
# Con las k ultimas observaciones, sin redondear
pronostico &lt;- function(k) sum(pesos[1:k] * rev(y)[1:k])
round(c(con_4 = pronostico(4), con_8 = pronostico(8), con_200 = pronostico(200)), 4)
#&gt;   con_4   con_8 con_200
#&gt; -0.2758 -0.2906 -0.2933
# El pronostico exacto de R, con los coeficientes fijados en los verdaderos
m &lt;- arima(y, order = c(1, 0, 1), include.mean = FALSE,
           fixed = c(phi, theta), transform.pars = FALSE)
round(as.numeric(predict(m, n.ahead = 1)$pred), 4)
#&gt; [1] -0.2933

# (c) Pesos psi y varianza del error de pronostico, en unidades de sigma^2
psi &lt;- c(1, ARMAtoMA(ar = phi, ma = theta, lag.max = 2))     # psi_0, psi_1, psi_2
round(psi, 4)
#&gt; [1] 1.00 0.30 0.24
round(cumsum(psi^2), 4)                         # h = 1, 2, 3
#&gt; [1] 1.0000 1.0900 1.1476
techo &lt;- sum(c(1, ARMAtoMA(ar = phi, ma = theta, lag.max = 500))^2)
round(c(techo = techo, fraccion_h3 = cumsum(psi^2)[3] / techo), 4)
#&gt;       techo fraccion_h3
#&gt;      1.2500      0.9181</code></pre>
            <p><strong>(a)</strong> $\pi_1 = -\phi - \theta = -0.8 + 0.5 = -0.3$, y desde ahí cada peso es el anterior por $-\theta = 0.5$: $\pi_2 = -0.15$, $\pi_3 = -0.075$ y $\pi_4 = -0.0375$. Todos negativos: con $\theta < 0$ los $\pi$ no alternan. El pronóstico les cambia el signo, $\hat y_{T+1\mid T} = 0.3\,y_T + 0.15\,y_{T-1} + 0.075\,y_{T-2} + 0.0375\,y_{T-3} + \cdots$: una suma ponderada de las observaciones pasadas, con pesos que se reducen a la mitad a cada paso atrás y que suman $0.6$, no $1$: el pronóstico se encoge hacia la media del proceso, que aquí es $0$.</p>
            <p><strong>(b)</strong> Con las cuatro observaciones, $0.3\,(-1.23) + 0.15\,(-0.05) + 0.075\,(1.00) + 0.0375\,(0.69) = -0.276$. Con ocho da $-0.291$ y con las doscientas, $-0.293$, que es también lo que devuelve <code>predict()</code> con los coeficientes verdaderos. Truncar en cuatro términos cuesta menos de dos centésimas, porque el primer peso que se deja fuera ya es $0.01875$: es la invertibilidad la que permite cortar la suma.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> $\psi_1 = \phi + \theta = 0.3$ y $\psi_2 = 0.8 \times 0.3 = 0.24$. La varianza del error es $\sigma^2$ a un paso, $1.09\,\sigma^2$ a dos y $1.1476\,\sigma^2$ a tres. El techo es $\gamma_0 = \sigma^2\,[1 + 0.09/(1 - 0.64)] = 1.25\,\sigma^2$: a tres pasos la varianza del pronóstico ya es el $92\,\%$ de la del proceso.</p>
          </div>
        </div>
      </div>

          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Escribir los momentos de un ARMA($p,q$) y usar la tabla
              ACF/PACF para proponer $(p,q)$ — descubriendo de primera mano por qué esa tabla funciona mucho mejor en
              la teoría que con datos reales.</p>
          </div>
        </div>
      </div>

      <p>Los módulos 2 y 3 dejaron dos familias con firmas opuestas: el AR corta la PACF y el MA corta la ACF. El
        Módulo 4 mostró que cada una puede escribirse como la otra en versión infinita, y cerró con dos ideas para
        este módulo: mezclar las dos partes ahorra parámetros, y, si sus polinomios comparten un factor, ese factor se
        cancela. Aquí se juntan en un solo modelo, y aparece la pregunta práctica que recorre el resto del capítulo:
        dada una serie, qué órdenes proponer.</p>

      <div class="definition" data-afirma="c3-m5-01">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: proceso ARMA($p,q$)</h4>
        <p>Combina las dos partes anteriores en un solo modelo <cite class="cita" data-ref="hamilton1994time" data-loc="p. 59"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 59)</a></cite>:</p>
        $$\begin{aligned}
          y_t = c &+ \phi_1 y_{t-1} + \cdots + \phi_p y_{t-p} \\
          &+ \varepsilon_t \\
          &+ \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}
        \end{aligned}$$
        <p style="margin-bottom:0;">o, en forma compacta, $\;\phi(B)\,y_t = c + \theta(B)\,\varepsilon_t$. Es
          <strong>estacionario</strong> si las raíces de $\phi(B)$ están fuera del círculo unitario <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite>, e
          <strong>invertible</strong> si lo están las de $\theta(B)$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 80"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 80)</a></cite>: cada polinomio responde por lo suyo.</p>
      </div>

      <p data-afirma="c3-m5-03">¿Para qué mezclarlos? Por <strong>parsimonia</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 8"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 8)</a></cite>. El ARMA(1,1) del Módulo 4, con $\phi = 0.7$ y
        $\theta = 0.5$, es un AR($\infty$): un AR puro necesitaría siete coeficientes solo para que el primer peso que
        descarta bajara de $0.01$, y el ARMA lo describe con dos. Tener menos parámetros deja menos margen de error al estimarlos y, con frecuencia, mejores pronósticos fuera de la muestra, que es de lo que se trata <cite class="cita" data-ref="hamilton1994time" data-loc="p. 109"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 109)</a></cite>.</p>

      <h3>La tabla de identificación</h3>

      <p data-afirma="c3-m5-11">Con lo que dejaron los Módulos 2 y 3, la regla para proponer un modelo cabe en una tabla <cite class="cita" data-ref="cryer2008time" data-loc="p. 116"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 116)</a></cite>. En ella
        <em>identificar</em> quiere decir proponer los órdenes $p$ y $q$ a partir de los correlogramas; no es lo mismo
        que la identificabilidad de un parámetro, la del Módulo 3.</p>

      <div class="warning">
        <p><strong>La tercera fila es la débil.</strong> <span data-afirma="c3-m5-12">"Las dos decaen" no dice cuáles son $p$ y $q$: ni el
          correlograma ni el correlograma parcial identifican los órdenes de un ARMA mixto <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite>.</span> En la práctica se propone
          un modelo pequeño, se diagnostica y se compara por criterios de información (Módulo 8). La tabla sirve para
          <strong>arrancar</strong>, no para decidir.</p>
      </div>


      <h3>Lo que la tabla promete y lo que da una muestra</h3>

      <p>La tabla describe la teoría: ACF y PACF exactas, sin ruido. Con datos, el correlograma es una muestra, y el
        laboratorio deja ver cuánto se parece a la teoría que la generó.</p>

          verás lo que de verdad ocurre al identificar: con $T = 60$ el patrón teórico casi no se reconoce, y con

          del final del módulo: con $\phi_1 = 0.5$ y $\theta_1 = -0.5$ la ACF teórica es cero en todos los rezagos, y
          con $\theta_1 = -0.45$ casi.</p>

      <h3>Identificar es un ciclo</h3>

      <p>Con dos partes mezcladas la tabla no alcanza —su tercera fila no da los órdenes— y con datos el correlograma
        es una muestra ruidosa, como acaba de verse. <span data-afirma="c3-m5-04">Identificar deja de ser leer una fila de una tabla: es un ciclo que se repite hasta que el diagnóstico queda limpio <cite class="cita" data-ref="cryer2008time" data-loc="p. 8"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 8)</a></cite>, y que aquí se recorre en cuatro pasos, de los cuales la tabla solo interviene en el tercero.</span></p>

      <p data-afirma="c3-m5-31">El ciclo nombra herramientas que el Módulo 8 desarrolla y que aquí solo se anuncian: los criterios de
        información (AICc y BIC) comparan modelos ajustados a los mismos datos y penalizan cada parámetro <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite>; la prueba de
        Ljung–Box resume en un solo $p$-valor si los residuales parecen ruido blanco, y su argumento
        <code>fitdf</code> descuenta de los grados de libertad los parámetros que se estimaron <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m5-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite>.</p>

      <div class="ciclo" data-ciclo="identificacion-arma">
        <ol class="ciclo-etapas" role="tablist" aria-label="Etapas del ciclo">
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="true" aria-controls="ciclo-identificacion-arma-acf" tabindex="0">
              <span class="ciclo-numero">Paso 1</span>
              <span class="ciclo-titulo">Leer la ACF</span>
              <span class="ciclo-resumen">¿Decae o corta?</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-identificacion-arma-pacf" tabindex="-1">
              <span class="ciclo-numero">Paso 2</span>
              <span class="ciclo-titulo">Leer la PACF</span>
              <span class="ciclo-resumen">¿Decae o corta?</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-identificacion-arma-proponer" tabindex="-1">
              <span class="ciclo-numero">Paso 3</span>
              <span class="ciclo-titulo">Proponer $(p, q)$</span>
              <span class="ciclo-resumen">Con la tabla</span>
            </button>
          </li>
          <li class="ciclo-etapa" role="presentation">
            <button type="button" class="ciclo-boton" role="tab"
              aria-selected="false" aria-controls="ciclo-identificacion-arma-comprobar" tabindex="-1">
              <span class="ciclo-numero">Paso 4</span>
              <span class="ciclo-titulo">Comprobar</span>
              <span class="ciclo-resumen">Teórica vs. muestral</span>
            </button>
          </li>
        </ol>
        <p class="ciclo-retorno">Identificar es un ciclo de conjeturas, no una lectura única: el diagnóstico devuelve al correlograma tantas veces como haga falta.</p>
        <div class="ciclo-panel" id="ciclo-identificacion-arma-acf" role="tabpanel">
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p data-afirma="c3-m5-05">Si la ACF <strong>corta</strong> tras el rezago $q$, hay una parte MA($q$). Si <strong>decae</strong> —geométrica o con ondas—, no es un MA puro y hay que mirar la PACF <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.5"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.5)</a></cite>.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>acf(y, lag.max = 20)</code>; en Python, <code>plot_acf(y, bartlett_confint=False)</code>. <span data-afirma="c3-m5-06">La banda $\pm 1.96/\sqrt{T}$ marca qué es ruido <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§2.9"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §2.9)</a></cite>.</span> <span data-afirma="c3-m5-30">Sin ese argumento, statsmodels dibuja la banda de Bartlett, que no supone ruido blanco y se ensancha con el rezago porque cuenta las autocorrelaciones de los rezagos anteriores <cite class="cita" data-ref="cryer2008time" data-loc="p. 112"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 112)</a></cite>.</span></p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p data-afirma="c3-m5-07">Si la ACF decae despacio y casi en línea recta, suele ser síntoma de que la serie no es estacionaria <cite class="cita" data-ref="cryer2008time" data-loc="p. 128"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 128)</a></cite>: esto no es un problema de identificación sino del Capítulo 2.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-identificacion-arma-pacf" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Si la PACF corta tras el rezago $p$, hay una parte AR($p$). Si <strong>las dos</strong> decaen sin cortar, es un ARMA mixto y la tabla ya no basta: hay que probar.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p data-afirma="c3-m5-08"><code>pacf(y)</code> — ojo, <code>pacf(y)$acf</code> devuelve un array de tres dimensiones; conviene envolverlo en <code>as.numeric()</code>.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Un corte limpio en la teoría se vuelve borroso con datos reales: con $T$ pequeño, vuelve al paso 1 sabiendo que la banda es ancha.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-identificacion-arma-proponer" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Cruzar las dos lecturas en la tabla de identificación. <span data-afirma="c3-m5-09">Proponer <strong>varios</strong> candidatos vecinos, no uno: la tabla acota la búsqueda, no la resuelve <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m5-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>.</span></p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p><code>arima(y, order = c(p, 0, q))</code> para cada candidato, y los criterios AICc/BIC del Módulo 8 para compararlos.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Si ningún candidato pasa el diagnóstico, vuelve aquí y amplía el conjunto antes de dar por buena la lectura de los correlogramas.</p>
          </div>
        </div>
        <div class="ciclo-panel" id="ciclo-identificacion-arma-comprobar" role="tabpanel" hidden>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Qué haces</span>
            <p>Enfrentar la ACF/PACF <strong>teórica</strong> del modelo propuesto contra la muestral, y revisar los residuales. Es el paso que convierte una corazonada en un modelo.</p>
          </div>
          <div class="ciclo-campo">
            <span class="ciclo-etiqueta">Con qué</span>
            <p data-afirma="c3-m5-10"><code>ARMAacf()</code> para la teórica y <code>Box.test(..., type = "Ljung-Box", fitdf = p + q)</code> para los residuales <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m5-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite>.</p>
          </div>
          <div class="ciclo-campo ciclo-vuelta">
            <span class="ciclo-etiqueta">Qué te devuelve atrás</span>
            <p>Residuales con estructura → paso 3 con otro candidato. Curvas teórica y muestral que no se parecen ni de lejos → paso 1.</p>
          </div>
        </div>
      </div>

      <h3>Media, varianza y autocovarianzas</h3>

      <p>Antes de mirar qué le pasa a la ACF conviene escribir los momentos del proceso, como se hizo con el AR en el
        Módulo 2 y con el MA en el Módulo 3. El ARMA los tiene los tres, pero uno de ellos deja de escribirse en
        función de los parámetros: hay que pasar por los pesos $\psi$.</p>

      <div class="formula" data-afirma="c3-m5-13">
        <p>Media y autocovarianzas de un ARMA($p,q$) estacionario:</p>
        $$\begin{gathered}
          \mu = \frac{c}{1-\phi_1-\cdots-\phi_p} \\[0.8em]
          \gamma_k = \sigma^2 \sum_{j=0}^{\infty} \psi_j\,\psi_{j+k}, \qquad k \ge 0 \\[0.8em]
          \gamma_0 = \operatorname{Var}(y_t) = \sigma^2 \sum_{j=0}^{\infty} \psi_j^{\,2}
        \end{gathered}$$
        <p style="margin-bottom:0;">con los pesos $\psi_j$ de la representación MA($\infty$) del Módulo 4 <cite class="cita" data-ref="cryer2008time" data-loc="p. 56"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 56)</a></cite> <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite>.</p>
      </div>

      <p>La media es la del AR y nada más: la parte MA es una suma de choques de media cero, así que no la mueve. Lo
        que cambia es la varianza. En el AR($p$) se escribía con los $\phi$ y las $\rho_k$, y en el MA($q$) con los
        $\theta$ en una suma de $q+1$ términos; <span data-afirma="c3-m5-14">aquí, para $p \ge 1$, no hay una forma corta general en función de los parámetros y hay que pasar por los $\psi$: sumando su serie, como en la derivación de más abajo, o resolviendo un sistema lineal en el que entran <cite class="cita" data-ref="cryer2008time" data-loc="p. 85"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 85)</a></cite>.</span> Es el precio de mezclar, y es la misma razón por la que el
        Módulo 4 insistía en que los $\psi$ no son un adorno algebraico.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Las fórmulas de los módulos 2 y 3 son casos de esta.</strong> Con $q = 0$
          los pesos son $\psi_j = \phi^{\,j}$ y la suma geométrica devuelve $\gamma_0 = \sigma^2/(1-\phi^2)$. Con
          $p = 0$ solo hay $q+1$ pesos no nulos —$1, \theta_1, \ldots, \theta_q$— y sale
          $\gamma_0 = \sigma^2(1+\sum\theta_j^2)$. Y para $k > q$ <strong>todos</strong> los productos
          $\psi_j\psi_{j+k}$ de la suma llevan un factor nulo: ahí está, escrito como una suma vacía, el corte exacto
          de la ACF de un MA.</p>
      </div>

      <p>Para el modelo mixto más pequeño, que es el que este capítulo usa una y otra vez, sí hay forma cerrada.</p>

      <div class="formula" data-afirma="c3-m5-15">
        <p><strong>ARMA(1,1)</strong>, $y_t = c + \phi y_{t-1} + \varepsilon_t + \theta\varepsilon_{t-1}$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 78"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 78)</a></cite>:</p>
        $$\begin{aligned}
          \gamma_0 &= \sigma^2\,\frac{1+2\phi\theta+\theta^2}{1-\phi^2} \\[0.6em]
          \gamma_1 &= \sigma^2\,\frac{(1+\phi\theta)(\phi+\theta)}{1-\phi^2}
        \end{aligned}$$
      </div>

      <p>Las dos comparten denominador, así que al dividir una entre otra el $1-\phi^2$ se cancela y queda la
        $\rho_1$ que usa la sección siguiente. Conviene verlo antes de encontrársela: ese $1+2\phi\theta+\theta^2$
        que allí aparece como un denominador sin explicación <strong>es la varianza del proceso</strong>, salvo el
        factor $\sigma^2/(1-\phi^2)$. Con $\phi = 0.7$ y $\theta = 0.5$ vale $1.95$, y la varianza,
        $1.95/0.51 = 3.8235\,\sigma^2$. Del mismo modo, $\gamma_1 = 1.62/0.51\,\sigma^2 = 3.1765\,\sigma^2$, y el
        cociente de las dos es $\rho_1 = 3.1765/3.8235 = 0.8308$: la primera de las cuatro cifras que el Módulo 4
        obtuvo sumando pesos $\psi$.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-momentos-arma">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-momentos-arma" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Parte de la representación MA($\infty$) del Módulo 4, que existe para todo ARMA estacionario. Con el
                proceso centrado:</p>
              $$y_t - \mu = \sum_{j=0}^{\infty} \psi_j\,\varepsilon_{t-j}$$
            </li>
            <li>
              <p>Multiplica por $y_{t-k}-\mu$ y toma esperanzas. Quedan productos de dos choques, y como el ruido
                blanco es incorrelado <strong>solo sobreviven los que emparejan el mismo choque</strong>: los términos
                $\psi_j\varepsilon_{t-j}$ y $\psi_i\varepsilon_{t-k-i}$ se encuentran cuando $j = i+k$. Cada
                encuentro aporta $E[\varepsilon^2] = \sigma^2$.</p>
              $$\gamma_k = \sigma^2 \sum_{i=0}^{\infty} \psi_i\,\psi_{i+k}$$
            </li>
            <li>
              <p>Con $k = 0$ los índices coinciden y la suma es de cuadrados:
                $\gamma_0 = \sigma^2\sum_j \psi_j^{\,2}$. Es la cantidad que el Módulo 4 llamaba el
                <em>techo</em> del abanico de pronóstico, ahora con nombre: la varianza del proceso.</p>
            </li>
            <li>
              <p>Para el ARMA(1,1) los pesos son $\psi_0 = 1$ y $\psi_j = (\phi+\theta)\phi^{\,j-1}$. Separando
                el primero, lo que queda es una geométrica de razón $\phi^2$:</p>
              $$\begin{aligned}
                \gamma_0 &= \sigma^2\biggl[1 \\
                &\qquad + (\phi+\theta)^2\sum_{j\ge1}\phi^{\,2(j-1)}\biggr] \\
                &= \sigma^2\left[1 + \frac{(\phi+\theta)^2}{1-\phi^2}\right]
              \end{aligned}$$
              <p style="margin-bottom:0;">y al juntar en una sola fracción, $1-\phi^2+(\phi+\theta)^2$ se simplifica
                a $1+2\phi\theta+\theta^2$.</p>
            </li>
            <li>
              <p>Lo mismo con $k = 1$, ahora emparejando $\psi_j$ con $\psi_{j+1}$:</p>
              $$\begin{aligned}
                \gamma_1 &= \sigma^2\biggl[(\phi+\theta) \\
                &\qquad + (\phi+\theta)^2\phi\sum_{j\ge1}\phi^{\,2(j-1)}\biggr] \\
                &= \sigma^2\,\frac{(\phi+\theta)(1+\phi\theta)}{1-\phi^2}
              \end{aligned}$$
            </li>
          </ol>
          <p class="derivacion-resultado">Dividiendo $\gamma_1$ entre $\gamma_0$ desaparece el denominador común y
            sale exactamente la $\rho_1$ de la sección siguiente. Compruébalo con $\phi = 0.7$ y $\theta = 0.5$:
            $\gamma_0 = 3.8235\,\sigma^2$, $\gamma_1 = 3.1765\,\sigma^2$ y su cociente,
            $\rho_1 = 0.8308$.</p>
        </div>
      </div>

      <h3>Por qué la tabla no da los órdenes de un ARMA</h3>

      <p data-afirma="c3-m5-16">La fila del ARMA esconde un resultado exacto. Para $k > q$, la observación $y_{t-k}$ solo depende de choques
        anteriores a $t - q$, y ninguno de los $\varepsilon_t, \ldots, \varepsilon_{t-q}$ de la parte MA está
        correlacionado con ella. Al calcular la autocovarianza esa parte desaparece, y la ACF cumple la misma
        recursión que la de un AR($p$) <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite>:</p>

      <div class="formula">
        $$\begin{gathered}
          \rho_k = \phi_1\rho_{k-1} + \cdots + \phi_p\rho_{k-p} \\
          \text{para } k > q
        \end{gathered}$$
      </div>

      <p>La condición $k > q$ no es adorno. En el ARMA(2,1) de $\phi = (0.5,\,0.3)$ y $\theta = 0.4$ la recursión
        acierta desde $\rho_2$ —$0.7307$, $0.6238$, $0.5311$—, pero en $k = 1$ no se cumple. Allí diría
        $\rho_1 = \phi_1\rho_0 + \phi_2\rho_{-1} = 0.5 + 0.3\,\rho_1$, porque $\rho_{-1} = \rho_1$; con el valor
        verdadero, $\rho_1 = 0.8614$, el lado derecho da $0.7584$. Los primeros $q$ rezagos son justamente los que
        la parte MA todavía toca, y para esos hay que volver a la suma de $\psi$ de la sección anterior.</p>

      <p>En el ARMA(1,1) eso deja un único valor por calcular. El primero sale de la fórmula</p>

      <div class="formula">
        $$\rho_1 = \frac{(1+\phi\theta)(\phi+\theta)}{1+2\phi\theta+\theta^2}$$
      </div>

      <p>y desde ahí cada rezago es el anterior multiplicado por $\phi$: $\rho_k = \phi^{\,k-1}\rho_1$. Con el proceso
        del Módulo 4, $\phi = 0.7$ y $\theta = 0.5$, queda $\rho_1 = 1.35 \times 1.2 / 1.95 = 0.8308$, y después $0.5815$,
        $0.4071$ y $0.2850$: las mismas cifras que el Módulo 4 obtuvo sumando pesos $\psi$.</p>

      <p>Ahí está la razón de que la tabla no dé los órdenes. <span data-afirma="c3-m5-17">El ritmo del decaimiento lo pone la parte AR —en el
        ARMA(1,1), el factor $\phi$—, y la parte MA solo decide con qué valor arranca <cite class="cita" data-ref="cryer2008time" data-loc="p. 78"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 78)</a></cite>.</span> Un AR(1) con $\phi = 0.7$ decae
        exactamente al mismo ritmo, desde $\rho_1 = 0.7$: dos ACF geométricas con la misma razón, que a simple vista se
        confunden y que con una muestra corta cuesta mucho separar.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="ACF de un ARMA">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r"># ACF de un ARMA(1,1): rho_1 por la formula y despues rho_k = phi * rho_{k-1}
phi &lt;- 0.7; theta &lt;- 0.5
rho1 &lt;- (1 + phi * theta) * (phi + theta) / (1 + 2 * phi * theta + theta^2)
round(rho1 * phi^(0:4), 4)
#&gt; [1] 0.8308 0.5815 0.4071 0.2850 0.1995
round(ARMAacf(ar = phi, ma = theta, lag.max = 5)[-1], 4)
#&gt;      1      2      3      4      5
#&gt; 0.8308 0.5815 0.4071 0.2850 0.1995    <- coinciden

# Un AR(1) con el mismo phi decae al mismo ritmo, desde otro arranque
round(ARMAacf(ar = phi, lag.max = 5)[-1], 4)
#&gt;      1      2      3      4      5
#&gt; 0.7000 0.4900 0.3430 0.2401 0.1681

# Para k &gt; q la recursion del AR vale en cualquier ARMA: un ARMA(2,1)
r &lt;- ARMAacf(ar = c(0.5, 0.3), ma = 0.4, lag.max = 5)
round(r[3:6], 4)                                  # rho_2 a rho_5
#&gt;      2      3      4      5
#&gt; 0.7307 0.6238 0.5311 0.4527
round(unname(0.5 * r[2:5] + 0.3 * r[1:4]), 4)    # phi1 rho_{k-1} + phi2 rho_{k-2}
#&gt; [1] 0.7307 0.6238 0.5311 0.4527

# ...pero NO para k = q: aqui q = 1 y la recursion no se cumple.
# En k = 1 dice rho_1 = phi1 rho_0 + phi2 rho_{-1}, y rho_{-1} = rho_1:
round(unname(0.5 * r[1] + 0.3 * r[2]), 4)        # lado derecho, con el rho_1 verdadero
#&gt; [1] 0.7584
round(unname(r[2]), 4)                            # rho_1 verdadero
#&gt; [1] 0.8614

# VARIANZA del proceso: gamma_k = s2 * sum(psi_j * psi_{j+k})
sigma2 &lt;- 1
psi    &lt;- c(1, ARMAtoMA(ar = 0.7, ma = 0.5, lag.max = 4000))
round(sigma2 * sum(psi^2), 4)                     # gamma_0
#&gt; [1] 3.8235

# La misma, por la formula cerrada del ARMA(1,1)
phi &lt;- 0.7; theta &lt;- 0.5
round(sigma2 * (1 + 2*phi*theta + theta^2) / (1 - phi^2), 4)
#&gt; [1] 3.8235

# Y gamma_1 / gamma_0 devuelve la rho_1 de la formula de arriba
g1 &lt;- sigma2 * sum(psi[-length(psi)] * psi[-1])
round(c(gamma1 = g1, rho1 = g1 / (sigma2 * sum(psi^2))), 4)
#&gt;  gamma1    rho1
#&gt;  3.1765  0.8308</code></pre>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
from statsmodels.tsa.arima_process import arma_acf

# ACF de un ARMA(1,1): rho_1 por la formula y despues rho_k = phi * rho_{k-1}
phi, theta = 0.7, 0.5
rho1 = (1 + phi * theta) * (phi + theta) / (1 + 2 * phi * theta + theta**2)
print(np.round(rho1 * phi ** np.arange(5), 4))
# [0.8308 0.5815 0.4071 0.285  0.1995]
print(np.round(arma_acf(np.r_[1, -phi], np.r_[1, theta], lags=6)[1:], 4))
# [0.8308 0.5815 0.4071 0.285  0.1995]    &lt;- coinciden

# Un AR(1) con el mismo phi decae al mismo ritmo, desde otro arranque
print(np.round(arma_acf(np.r_[1, -phi], np.r_[1], lags=6)[1:], 4))
# [0.7    0.49   0.343  0.2401 0.1681]

# Para k &gt; q la recursion del AR vale en cualquier ARMA: un ARMA(2,1)
r = arma_acf(np.r_[1, -0.5, -0.3], np.r_[1, 0.4], lags=6)
print(np.round(r[2:6], 4))                        # rho_2 a rho_5
# [0.7307 0.6238 0.5311 0.4527]
print(np.round(0.5 * r[1:5] + 0.3 * r[0:4], 4))   # phi1 rho_{k-1} + phi2 rho_{k-2}
# [0.7307 0.6238 0.5311 0.4527]

# ...pero NO para k = q: aqui q = 1 y la recursion no se cumple.
# En k = 1 dice rho_1 = phi1 rho_0 + phi2 rho_{-1}, y rho_{-1} = rho_1:
print(round(0.5 * r[0] + 0.3 * r[1], 4), "frente a", round(r[1], 4))
# 0.7584 frente a 0.8614

# VARIANZA del proceso: gamma_k = s2 * sum(psi_j * psi_{j+k})
from statsmodels.tsa.arima_process import arma2ma
sigma2 = 1.0
psi = arma2ma(np.r_[1, -0.7], np.r_[1, 0.5], lags=4001)
print(round(sigma2 * (psi**2).sum(), 4))          # gamma_0 -> 3.8235

# La misma, por la formula cerrada del ARMA(1,1)
phi, theta = 0.7, 0.5
print(round(sigma2 * (1 + 2*phi*theta + theta**2) / (1 - phi**2), 4))
# 3.8235

# Y gamma_1 / gamma_0 devuelve la rho_1 de la formula de arriba
g1 = sigma2 * (psi[:-1] * psi[1:]).sum()
print(round(g1, 4), round(g1 / (sigma2 * (psi**2).sum()), 4))
# 3.1765 0.8308
</code></pre>

      <h3>Redundancia de parámetros: cuando sobra un factor</h3>

      <p>Hay una trampa específica de los modelos mixtos. <span data-afirma="c3-m5-19">Si $\phi(B)$ y $\theta(B)$ comparten un factor, ese factor se
        cancela y el modelo es en realidad más pequeño de lo que aparenta <cite class="cita" data-ref="cryer2008time" data-loc="p. 77"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 77)</a></cite>.</span> El Módulo 4 ya lo dejó ver con los mismos
        números que siguen: en su simulador, $\phi = 0.5$ y $\theta = -0.5$ reducen los pesos $\psi$ y $\pi$ a la barra
        de $j = 0$.</p>

      <div class="formula">
        <p>Tomemos el ARMA(1,1) con $\phi_1 = 0.5$ y $\theta_1 = -0.5$:</p>
        $$\begin{gathered}
          (1-0.5B)\,y_t = (1-0.5B)\,\varepsilon_t \\
          \Longrightarrow\quad y_t = \varepsilon_t
        \end{gathered}$$
        <p style="margin-bottom:0;">Es <strong>ruido blanco</strong> escrito con dos parámetros de más.</p>
      </div>

      <div class="warning">
        <p><strong>Cómo se manifiesta en una salida real.</strong> <span data-afirma="c3-m5-32">Cuando dos factores casi se cancelan, la
          verosimilitud es casi plana en esa dirección: los coeficientes salen con <strong>errores estándar enormes</strong>,
          el optimizador puede no converger, y valores muy distintos de $(\phi,\theta)$ dan ajustes casi idénticos.</span> <span data-afirma="c3-m5-20">Ante un ARMA con $\hat\phi_1 \approx -\hat\theta_1$ y errores estándar grandes <cite class="cita" data-ref="hamilton1994time" data-loc="p. 60"><a href="#ref-m5-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 60)</a></cite>, conviene probar el modelo más pequeño antes de interpretar nada <cite class="cita" data-ref="cryer2008time" data-loc="p. 187"><a href="#ref-m5-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 187)</a></cite>.</span></p>
      </div>

#&gt; [1] 0 0 0 0 0        <- la ACF de un ruido blanco

# Un proceso CASI redundante: phi = 0.5 y theta = -0.45 casi se cancelan,
# asi que en la practica es casi ruido blanco
round(ARMAacf(ar = 0.5, ma = -0.45, lag.max = 5)[-1], 4)
#&gt; [1] 0.0515 0.0257 0.0129 0.0064 0.0032    <- autocorrelaciones minusculas

set.seed(11)
y &lt;- arima.sim(n = 200, list(ar = 0.5, ma = -0.45))
ajuste &lt;- arima(y, order = c(1, 0, 1))
#&gt; Warning: possible convergence problem: optim gave code = 1
round(cbind(coef = coef(ajuste), ee = sqrt(diag(ajuste$var.coef))), 4)
#&gt;              coef     ee
#&gt; ar1        0.8300 0.2307
#&gt; ma1       -0.7953 0.2477
#&gt; intercept  0.0137 0.0806

# Los verdaderos son 0.5 y -0.45; la estimacion se va a 0.83 y -0.80.
# Lo que SI reproduce es la suma (0.0347 frente a 0.05): el ajuste fija
# la cancelacion, no cada coeficiente por separado.

# Y el modelo mas pequeno gana. El criterio es el AICc, que presenta el
# Modulo 8: por ahora basta saber que menor es mejor.
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
c(arma11 = aicc(ajuste, 200),
  ar1    = aicc(arima(y, order = c(1, 0, 0)), 200),
  ruido  = aicc(arima(y, order = c(0, 0, 0)), 200))
#&gt;   arma11      ar1    ruido
#&gt; 554.3463 552.9939 550.9449</code></pre>

# Redundancia exacta: phi = -theta colapsa a ruido blanco
print(np.round(arma_acf(np.r_[1, -0.5], np.r_[1, -0.5], lags=6)[1:], 6))
# [0. 0. 0. 0. 0.]

# [0.0515 0.0257 0.0129 0.0064 0.0032]

# lejos de los verdaderos, con errores estandar grandes, pero su SUMA
# reproduce la cancelacion. La semilla no coincide con la de R, asi que
# las cifras exactas difieren; el sintoma es el mismo.

y = proceso.generate_sample(nsample=200, distrvs=np.random.default_rng(11).standard_normal)

print(res.summary().tables[1])
#   ar.L1  -0.0798   std err 1.534
#   ma.L1   0.1254   std err 1.531
print("suma ar1 + ma1 =", round(res.arparams[0] + res.maparams[0], 4))
# suma ar1 + ma1 = 0.0457

# R estimo (0.83, -0.80) y Python (-0.08, 0.13): dos parejas muy distintas
# con casi la misma suma. Es la verosimilitud plana de la que habla el aviso.

p &lt;- as.numeric(pacf(w, lag.max = 20, plot = FALSE)$acf)
which(abs(a) &gt; banda)
#&gt;  [1]  1  2  3  4  5  6 17 18 19 20
which(abs(p) &gt; banda)
#&gt; [1] 1 2 3
round(a[1:6], 3)
#&gt; [1] 0.792 0.520 0.406 0.382 0.332 0.226
round(p[1:6], 3)
#&gt; [1]  0.792 -0.287  0.303  0.008 -0.030 -0.088

# Los dos candidatos
ar3    &lt;- arima(w, order = c(3, 0, 0), method = "ML")
arma11 &lt;- arima(w, order = c(1, 0, 1), method = "ML")
round(coef(arma11), 4)
#&gt;       ar1       ma1 intercept
#&gt;    0.6344    0.5297    1.1204

# (b) El ARMA(1,1) redondeado, con las formulas del modulo
phi &lt;- 0.63; theta &lt;- 0.53
rho1 &lt;- (1 + phi * theta) * (phi + theta) / (1 + 2 * phi * theta + theta^2)
round(rho1 * phi^(0:2), 3)             # rho_1, rho_2, rho_3
#&gt; [1] 0.794 0.500 0.315

# (c) Paso 4: la ACF teorica de cada modelo ajustado frente a la muestral
round(rbind(muestral = a[1:6],
            AR3      = ARMAacf(ar = coef(ar3)[1:3], lag.max = 6)[-1],
            ARMA11   = ARMAacf(ar = coef(arma11)[["ar1"]], ma = coef(arma11)[["ma1"]],
                               lag.max = 6)[-1]), 3)
#&gt;              1     2     3     4     5     6
#&gt; muestral 0.792 0.520 0.406 0.382 0.332 0.226
#&gt; AR3      0.795 0.518 0.404 0.387 0.351 0.282
#&gt; ARMA11   0.796 0.505 0.321 0.203 0.129 0.082

# Adelanto del Modulo 8: los dos criterios (menor es mejor) y Ljung-Box
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
lb &lt;- function(f, k) Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = k)$p.value
round(rbind(AICc = c(AR3 = aicc(ar3, n), ARMA11 = aicc(arma11, n)),
            BIC  = c(BIC(ar3), BIC(arma11)),
            LB12 = c(lb(ar3, 3), lb(arma11, 2))), 3)
#&gt;          AR3  ARMA11
#&gt; AICc 514.310 516.005
#&gt; BIC  526.641 525.960
#&gt; LB12   0.702   0.515</code></pre>
            <p><strong>(a)</strong> La banda es $\pm 0.197$. La PACF sale de ella en los rezagos 1, 2 y 3 ($0.792$, $-0.287$ y $0.303$) y después se queda dentro; la ACF decae sin cortarse: sale en los rezagos 1 a 6 y otra vez, con signo negativo, del 17 al 20. Es la primera fila de la tabla, la del AR($p$), con $p = 3$. Como candidato mixto, el más pequeño: un ARMA(1,1), cuya ACF también decae.</p>
            <p><strong>(b)</strong> $\rho_1 = (1 + \phi\theta)(\phi + \theta)/(1 + 2\phi\theta + \theta^2) = 1.3339 \times 1.16/1.9487 = 0.794$, y después $\rho_2 = 0.63 \times 0.794 = 0.500$ y $\rho_3 = 0.63 \times 0.500 = 0.315$. Las muestrales son $0.792$, $0.520$ y $0.406$: el modelo mixto reproduce la primera, se acerca a la segunda y en la tercera ya va por debajo.</p>
            <p><strong>(c)</strong> La ACF teórica del AR(3) sigue a la muestral: $0.404$, $0.387$ y $0.351$ frente a $0.406$, $0.382$ y $0.332$ en los rezagos 3 a 5. La del ARMA(1,1) no puede hacerlo: desde $\rho_1$ es geométrica, de razón $\hat\phi$, y cae a $0.321$, $0.203$ y $0.129$ mientras la muestral se detiene en una meseta cerca de $0.4$. Esa meseta es lo que recogen los tres coeficientes del AR(3), y el paso 4 se inclina por él.</p>
            <p style="margin-bottom:0;">Como adelanto del Módulo 8: los residuales de los dos modelos pasan Ljung–Box ($p = 0.702$ y $0.515$), el AICc prefiere el AR(3) ($514.31$ frente a $516.00$) y el BIC, por menos de un punto, el ARMA(1,1) ($525.96$ frente a $526.64$). La tabla propuso un orden, el paso 4 lo sostuvo, y los dos criterios no se ponen de acuerdo con 99 datos.</p>
          </div>
        </div>
      </div>
