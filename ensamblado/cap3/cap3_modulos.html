  <!-- MÓDULO 6 · Simular y reconocer procesos                       -->
  <!-- ============================================================ -->
  <template id="module-6">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 6</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.6 Simular y reconocer
          procesos <span class="text-gray-400 font-normal text-2xl">/ Simulating &amp; recognising processes</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Generar procesos de orden conocido para entrenar el ojo,
              y ver cuánto se separa una ACF muestral de la teórica que la generó.</p>
          </div>
        </div>
      </div>

      <p>La mejor forma de aprender a identificar es al revés: simular procesos cuyo orden ya conoces y mirar sus
        correlogramas. Es lo único que da la calibración necesaria para no ver estructura donde solo hay azar.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Simular procesos ARMA">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">set.seed(3)

# arima.sim descarta automaticamente un periodo de calentamiento (burn-in),
# asi que la serie que devuelve ya esta en regimen estacionario.
ar1   &lt;- arima.sim(n = 200, model = list(ar = 0.8))
ma1   &lt;- arima.sim(n = 200, model = list(ma = 0.8))
arma  &lt;- arima.sim(n = 200, model = list(ar = 0.7, ma = 0.5))

par(mfrow = c(3, 3), mar = c(3, 4, 2, 1))
for (nm in c("ar1", "ma1", "arma")) {
  x &lt;- get(nm)
  plot(x, main = nm, ylab = "")
  acf(x,  lag.max = 16, main = "ACF")
  pacf(x, lag.max = 16, main = "PACF")
}

# arima.sim EXIGE un modelo estacionario: si le pides una raiz unitaria falla
try(arima.sim(n = 100, model = list(ar = 1)))
#&gt; Error in arima.sim(...) : 'ar' part of model is not stationary
# La raiz unitaria no se declara en ar. Una caminata aleatoria se simula con
# cumsum(rnorm(n)), como en el Capitulo 2, o declarando la diferencia en
# order: arima.sim hace esa misma suma y devuelve n + 1 valores (el primero, 0).
length(arima.sim(n = 100, model = list(order = c(0, 1, 0))))
#&gt; [1] 101</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import matplotlib.pyplot as plt
from statsmodels.tsa.arima_process import ArmaProcess
from statsmodels.graphics.tsaplots import plot_acf, plot_pacf

rng = np.random.default_rng(3)

procesos = {
    "ar1":  ArmaProcess(np.r_[1, -0.8], np.r_[1]),
    "ma1":  ArmaProcess(np.r_[1], np.r_[1, 0.8]),
    "arma": ArmaProcess(np.r_[1, -0.7], np.r_[1, 0.5]),
}

fig, ejes = plt.subplots(3, 3, figsize=(13, 8))
for fila, (nombre, proc) in enumerate(procesos.items()):
    x = proc.generate_sample(nsample=200, distrvs=rng.standard_normal)
    ejes[fila, 0].plot(x); ejes[fila, 0].set_title(nombre)
    plot_acf(x,  lags=16, ax=ejes[fila, 1], title="ACF")
    plot_pacf(x, lags=16, ax=ejes[fila, 2], title="PACF", method="ywm")
plt.tight_layout()

# generate_sample NO descarta calentamiento por defecto: se pide con burnin=
x = procesos["ar1"].generate_sample(nsample=200, burnin=100,
                                    distrvs=rng.standard_normal)</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>Una diferencia real entre R y Python.</strong> <span data-afirma="c3-m6-01"><code>arima.sim()</code> descarta por su cuenta un
          tramo de calentamiento (<em>burn-in</em>) <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m6-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span> para que la serie salga ya en régimen estacionario;
          <span data-afirma="c3-m6-04"><code>generate_sample()</code> de statsmodels <strong>no lo hace</strong> salvo que se le pase
          <code>burnin=</code></span>. <span data-afirma="c3-m6-05">Sin él la serie arranca en cero y su primer tramo tiene menos varianza que el
          resto: con $\phi = 0.95$, la varianza en $t = 5$ es $4.1$ cuando la del régimen estacionario es $10.3$.
          Con procesos muy persistentes ese arranque comprimido dura decenas de observaciones.</span></p>
      </div>

      <h3>Cuánto se aleja la muestra de la teoría</h3>

      <p>El laboratorio del módulo anterior lo insinuaba; aquí se ve con tres realizaciones concretas de
        longitud 200 generadas con <code>set.seed(3)</code>. Cada barra sólida es el valor teórico y cada barra clara
        el muestral.</p>

      <div class="simulador" data-simulador="teorica-vs-muestral">
        <h4><i class="fas fa-chart-column" aria-hidden="true"></i> Teórica frente a muestral, $T = 200$</h4>
        <p class="simulador-intro">Tres procesos de orden conocido. Fíjate sobre todo en los rezagos donde la teoría
          dice <strong>exactamente cero</strong>: la muestra pone ahí valores pequeños pero no nulos, y alguno se
          asoma fuera de la banda (va en rojo y con un rombo, y la lectura dice en qué rezago). Eso, y no otra
          cosa, es lo que ves en un correlograma real.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">ACF</p>
        <div class="grafico-wrapper" style="height:200px;">
          <canvas aria-label="ACF teórica y muestral del proceso seleccionado" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">PACF</p>
        <div class="grafico-wrapper" style="height:200px;">
          <canvas aria-label="PACF teórica y muestral del proceso seleccionado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>La regla del 5 %.</strong> <span data-afirma="c3-m6-06">La banda $\pm 1.96/\sqrt{T}$ es un intervalo al 95 % <em>para cada
            rezago por separado</em> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§2.9"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §2.9)</a></cite>. Al mirar 20 rezagos de una serie que es ruido blanco puro, lo esperable es que $20 \times 0.05 = 1$ de ellos se salga por puro azar <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite>.</span> <span data-afirma="c3-m6-07">Uno o dos picos que apenas asoman fuera de la banda no bastan como evidencia; uno muy grande, o bastantes más del 5 % de los rezagos fuera, sí <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§2.9"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §2.9)</a></cite>.</span> <span data-afirma="c3-m6-08">Por eso existe la prueba de Ljung–Box del Módulo 8, que evalúa esos 20 rezagos a la vez <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m6-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite>.</span></p>
      </div>
      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;">La regla del 5 % dice cuántas barras de un correlograma salen de la banda por puro azar. Antes de simular, escribe una predicción; después, compruébala. Entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>La predicción: en los 20 primeros rezagos de un ruido blanco, cuántas barras se esperan fuera de la banda y con qué probabilidad saldrán dos o más, suponiendo que cada una sale con probabilidad $0.05$ sin depender de las demás.</li>
            <li>La comprobación: 2000 series de ruido blanco de longitud $T = 50$, otras 2000 con $T = 200$ y otras 2000 con $T = 1000$; para cada longitud, el número medio de barras fuera y la proporción de series con dos o más. ¿Se cumple la predicción?</li>
            <li>Lo mismo con 2000 series de un MA(1) con $\theta = 0.8$ y $T = 200$, contando solo los rezagos 2 a 20, donde su ACF teórica vale exactamente cero. ¿Salen las barras que saldrían en un ruido blanco?</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m6-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m6-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m6-pista" hidden>
            <p style="margin:0;">Para (a) basta una distribución binomial. Para (b) y (c), escribe una función que reciba una serie y devuelva cuántas barras salen de $\pm 1.96/\sqrt{T}$, y repítela con <code>replicate()</code>. Antes de ejecutar (c), anota tu apuesta y el porqué.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m6-sol" hidden>
            <p><strong>Respuesta: en un ruido blanco sale, de media, menos de una barra de cada 20, y bastante menos con $T$ pequeña; en los rezagos donde un MA(1) no tiene nada salen casi el doble de las que anuncia la regla.</strong></p>
            <pre><code class="language-r"># Cuantas de las 20 primeras barras salen de la banda +-1.96/sqrt(T)
fuera &lt;- function(x, rezagos = 1:20) {
  r &lt;- acf(x, lag.max = 20, plot = FALSE)$acf[-1]
  sum(abs(r[rezagos]) &gt; 1.96 / sqrt(length(x)))
}

# (a) La cuenta de partida: 20 barras, cada una fuera con probabilidad 0.05
#     e independientes entre si
round(c(esperadas = 20 * 0.05, ninguna = dbinom(0, 20, 0.05),
        dos_o_mas = 1 - pbinom(1, 20, 0.05)), 3)
#&gt; esperadas   ninguna dos_o_mas
#&gt;     1.000     0.358     0.264

# (b) Ruido blanco: 2000 series de cada longitud
set.seed(36)
rb &lt;- sapply(c(50, 200, 1000), function(n) {
  k &lt;- replicate(2000, fuera(rnorm(n)))
  c(T = n, media = mean(k), ninguna = mean(k == 0), dos_o_mas = mean(k &gt;= 2))
})
round(t(rb), 3)
#&gt;         T media ninguna dos_o_mas
#&gt; [1,]   50 0.528   0.619     0.104
#&gt; [2,]  200 0.845   0.440     0.206
#&gt; [3,] 1000 0.984   0.349     0.241

# (c) Un MA(1) con theta = 0.8 y T = 200: los rezagos 2 a 20, donde la ACF
#     teorica vale exactamente cero
set.seed(36)
ma &lt;- replicate(2000, fuera(arima.sim(n = 200, model = list(ma = 0.8)), rezagos = 2:20))
round(c(esperadas_si_fuera_ruido_blanco = 19 * 0.05, media = mean(ma),
        dos_o_mas = mean(ma &gt;= 2)), 3)
#&gt; esperadas_si_fuera_ruido_blanco                           media
#&gt;                           0.950                           1.782
#&gt;                       dos_o_mas
#&gt;                           0.498

# La misma cuenta con una banda que tiene en cuenta rho_1:
# 1.96 * sqrt((1 + 2 rho_1^2) / T)
rho1 &lt;- 0.8 / (1 + 0.8^2)
ancha &lt;- 1.96 * sqrt((1 + 2 * rho1^2) / 200)
round(c(banda = 1.96 / sqrt(200), banda_ancha = ancha), 4)
#&gt;       banda banda_ancha
#&gt;      0.1386      0.1684
set.seed(36)
ma2 &lt;- replicate(2000, {
  x &lt;- arima.sim(n = 200, model = list(ma = 0.8))
  r &lt;- acf(x, lag.max = 20, plot = FALSE)$acf[-1]
  sum(abs(r[2:20]) &gt; ancha)
})
round(mean(ma2), 3)
#&gt; [1] 0.79</code></pre>
            <p><strong>(a)</strong> Con 20 barras y probabilidad $0.05$ cada una se espera $20 \times 0.05 = 1$ barra fuera; ninguna, con probabilidad $0.358$, y dos o más, con probabilidad $0.264$.</p>
            <p><strong>(b)</strong> La simulación da menos: de media, $0.528$ barras con $T = 50$, $0.845$ con $T = 200$ y $0.984$ con $T = 1000$; y dos o más en el $10.4\,\%$, el $20.6\,\%$ y el $24.1\,\%$ de las series. La predicción solo se acerca a cumplirse con la serie larga. La banda $\pm 1.96/\sqrt{T}$ es una aproximación para $T$ grande: con series cortas las autocorrelaciones muestrales varían menos que eso, tanto menos cuanto mayor es el rezago (el Módulo 8 dice por qué), y la banda resulta holgada. Con 50 datos, dos barras fuera son más raras de lo que sugiere la cuenta de (a).</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> En los 19 rezagos donde la teoría dice cero, un ruido blanco dejaría fuera $19 \times 0.05 = 0.95$ barras. El MA(1) deja $1.782$ de media, y dos o más en el $49.8\,\%$ de las series. No hay estructura en esos rezagos: lo que ocurre es que $r_k$ varía más cuando la serie está autocorrelacionada, y la banda del ruido blanco se queda estrecha. <span data-afirma="c3-m6-09">En un MA(1), la varianza de $r_k$ para $k > 1$ es aproximadamente $(1 + 2\rho_1^2)/T$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 111"></cite>, y la banda ensanchada es $\pm 1.96\sqrt{(1 + 2\rho_1^2)/T}$.</span> Con ella, $\pm 0.168$ en lugar de $\pm 0.139$, el recuento baja a $0.79$ barras, parecido al $0.845$ del ruido blanco con esa misma $T$. Es la idea de la banda que <code>statsmodels</code> dibuja por defecto, la que según el Módulo 5 cuenta las autocorrelaciones de los rezagos anteriores. En la práctica: una vez que el correlograma muestra un corte, las barras sueltas que asoman después merecen menos crédito del que la banda les da.</p>
          </div>
        </div>
      </div>

  <!-- MÓDULO 7 · Estimación                                         -->

  <template id="module-7">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 7</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.7 Estimación de parámetros
          <span class="text-gray-400 font-normal text-2xl">/ Parameter estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Conocer los tres estimadores que usa el software,
              entender en qué se diferencian y comprobar sobre datos reales <strong>cuánto</strong> se separan.</p>
          </div>
        </div>
      </div>

      <p>Hasta aquí los $\phi$ y los $\theta$ eran datos del problema. Con una serie real hay que estimarlos, y no hay
        un único procedimiento: hay tres, y no dan lo mismo. Empecemos por la serie que nos acompañará el resto del
        capítulo.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>La serie de trabajo: manchas solares</h4>
        <p style="margin-bottom:0;">Número anual de manchas solares entre <strong>1770 y 1869</strong>, $T = 100$ observaciones, <span data-afirma="c3-m7-01">un tramo de <code>sunspot.year</code>, la serie de R que va de 1700 a 1988 <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span>. <span data-afirma="c3-m7-02">Con los números de manchas de Wolfer de 1749 a 1924 <cite class="cita" data-ref="yule1927method" data-loc="p. 281"><a href="#ref-m7-yule1927method" title="Yule, G. U. (1927). VII. On a method of investigating periodicities in disturbed series, with special reference to Wolfer’s sunspot numbers. Philosophical Transactions of the Royal Society of London. Series A, Containing Papers of a Mathematical or Physical Character, 226(636-646), 267-298. https://doi.org/10.1098/rsta.1927.0007">(Yule, 1927, p. 281)</a></cite>, <strong>Udny Yule</strong> propuso en 1927 lo que hoy se llama un modelo autorregresivo: ajustó la regresión de cada valor sobre los dos anteriores y comparó las manchas con un péndulo que recibe pequeños impulsos al azar, de trazo suave pero con amplitud y fase que cambian sin cesar <cite class="cita" data-ref="yule1927method" data-loc="p. 294"><a href="#ref-m7-yule1927method" title="Yule, G. U. (1927). VII. On a method of investigating periodicities in disturbed series, with special reference to Wolfer’s sunspot numbers. Philosophical Transactions of the Royal Society of London. Series A, Containing Papers of a Mathematical or Physical Character, 226(636-646), 267-298. https://doi.org/10.1098/rsta.1927.0007">(Yule, 1927, p. 294)</a></cite>.</span> <span data-afirma="c3-m7-03">El periodo de las manchas se estimaba entonces en algo más de once años <cite class="cita" data-ref="yule1927method" data-loc="p. 276"><a href="#ref-m7-yule1927method" title="Yule, G. U. (1927). VII. On a method of investigating periodicities in disturbed series, with special reference to Wolfer’s sunspot numbers. Philosophical Transactions of the Royal Society of London. Series A, Containing Papers of a Mathematical or Physical Character, 226(636-646), 267-298. https://doi.org/10.1098/rsta.1927.0007">(Yule, 1927, p. 276)</a></cite>.</span></p>
      </div>

      <h3>Tres formas de estimar el mismo AR(2)</h3>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Los tres métodos</h4>
        <ul style="margin-bottom:0;">
          <li><span data-afirma="c3-m7-05"><strong>Yule–Walker</strong> (método de momentos). Toma las ecuaciones del Módulo 2, sustituye las
            $\rho_k$ teóricas por las muestrales $r_k$ y resuelve el sistema <cite class="cita" data-ref="cryer2008time" data-loc="p. 150"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 150)</a></cite></span>. Es explícito, rápido y no necesita optimización. <span data-afirma="c3-m7-06">Da estimaciones bastante buenas en modelos AR puros y es muy ineficiente si hay parte MA <cite class="cita" data-ref="cryer2008time" data-loc="p. 152"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 152)</a></cite></span>.</li>
          <li><span data-afirma="c3-m7-07"><strong>CSS</strong> (<em>conditional sum of squares</em>). Minimiza $\sum \hat\varepsilon_t^2$
            condicionando en los primeros valores observados <cite class="cita" data-ref="cryer2008time" data-loc="p. 154"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 154)</a></cite>. Es mínimos cuadrados —ordinarios en un AR puro, no
            lineales si hay parte MA— <cite class="cita" data-ref="cryer2008time" data-loc="p. 157"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 157)</a></cite></span> <span data-afirma="c3-m7-08">y descarta la información que aportan las primeras observaciones <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span>.</li>
          <li><span data-afirma="c3-m7-09"><strong>Máxima verosimilitud</strong>. Maximiza la verosimilitud gaussiana <em>exacta</em>, que
            incluye la contribución de las primeras observaciones <cite class="cita" data-ref="cryer2008time" data-loc="p. 159"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 159)</a></cite>. Aprovecha toda la información de los datos; sus errores estándar salen de la hessiana de la log-verosimilitud y pueden ser solo una guía aproximada <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>.</li>
        </ul>
      </div>

      <p><span data-afirma="c3-m7-30">Entre CSS y máxima verosimilitud la diferencia está en la primera observación: ML incluye su densidad y CSS la
        ignora, y ese término <strong>penaliza</strong> los $\phi$ cercanos a la frontera de la región estacionaria <cite class="cita" data-ref="cryer2008time" data-loc="p. 160"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 160)</a></cite></span>. <span data-afirma="c3-m7-31">Con
        $T$ grande pesa poco y los dos métodos coinciden; con $T$ pequeño o $\phi$ cerca de $1$, no <cite class="cita" data-ref="cryer2008time" data-loc="p. 160"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 160)</a></cite></span>, y <span data-afirma="c3-m7-32">CSS puede incluso
        salirse de la región estacionaria, cosa que ML no hace en el ejemplo <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span>. El código R de abajo lo
        reproduce con $T = 40$ y $\phi = 0.95$, y el desarrollo plegado deduce el término.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-verosimilitud">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-verosimilitud" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Supón ruido gaussiano y escribe la densidad conjunta de la muestra factorizándola en condicionales,
                que es lo natural en una serie de tiempo:</p>
              $$\begin{aligned}
                &f(y_1,\ldots,y_T) \\
                &\quad = f(y_1)\prod_{t=2}^{T} f(y_t \mid y_{t-1},\ldots,y_1)
              \end{aligned}$$
            </li>
            <li>
              <p>Para un AR(1) de media cero, la condicional es inmediata: todo el pasado se resume en $y_{t-1}$,
                y dado ese valor el único término aleatorio es $\varepsilon_t$, luego $y_t \mid y_{t-1} \sim N(\phi y_{t-1},\, \sigma^2)$. Tomando logaritmos, la
                parte condicional de la log-verosimilitud es</p>
              $$\begin{aligned}
                &-\frac{T-1}{2}\log(2\pi\sigma^2) \\
                &-\frac{1}{2\sigma^2}\sum_{t=2}^{T}(y_t - \phi y_{t-1})^2
              \end{aligned}$$
            </li>
            <li>
              <p>Maximizar eso equivale a <strong>minimizar la suma de cuadrados</strong>
                $\sum_{t=2}^{T}(y_t-\phi y_{t-1})^2$. Ahí está el método <strong>CSS</strong>: es máxima
                verosimilitud, pero <em>condicionada</em> a $y_1$, cuya densidad se ha ignorado. En un AR es,
                además, una regresión ordinaria de $y_t$ sobre $y_{t-1}$.</p>
            </li>
            <li>
              <p>La verosimilitud <strong>exacta</strong> añade el término que falta. La primera observación no es
                un dato fijo: procede de la distribución estacionaria, $y_1 \sim N\!\left(0,\ \sigma^2/(1-\phi^2)\right)$,
                y contribuye con</p>
              $$-\tfrac{1}{2}\log\frac{2\pi\sigma^2}{1-\phi^2} - \frac{(1-\phi^2)\,y_1^2}{2\sigma^2}$$
            </li>
            <li>
              <p>Ese término aporta el sumando $\tfrac{1}{2}\log(1-\phi^2)$, que tiende a $-\infty$ cuando
                $|\phi| \to 1$: <strong>penaliza</strong> los valores cercanos a la frontera de la región
                estacionaria. <span data-afirma="c3-m7-10">Con $T$ grande, un único término frente a los $T-1$ de la parte condicional es
                despreciable y los dos métodos convergen; con $T$ pequeño o $\phi$ cerca de la frontera, no <cite class="cita" data-ref="cryer2008time" data-loc="p. 160"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 160)</a></cite></span>.</p>
            </li>
            <li>
              <p>Un ejemplo con $T = 40$ y $\phi = 0.95$, que reproduce el código R de abajo: <span data-afirma="c3-m7-11">CSS estima
                $\hat\phi = 1.0086$, <strong>fuera</strong> de la región estacionaria, y ML se queda en $0.9808$.
                No es lo habitual —en mil simulaciones iguales CSS pasa de $1$ entre un 2.5 y un 4.6&nbsp;% de las
                veces, según la semilla—</span> y <span data-afirma="c3-m7-33">ML no lo hace en ninguna de las que estima, por dos razones: el sumando
                $\tfrac{1}{2}\log(1-\phi^2)$ cae a $-\infty$ en la frontera, y <code>arima()</code>, al maximizar la
                verosimilitud, reparametriza los $\phi$ para no salir de la región estacionaria
                (<code>transform.pars = TRUE</code>, su valor por defecto) <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span>. <span data-afirma="c3-m7-34">Quedarse dentro no es quedarse lejos:
                en un 13 a 17&nbsp;% de las simulaciones la estimación ML es $\ge 0.999$, y en 4 a 13 de cada mil el
                optimizador no llega a dar estimación.</span></p>
            </li>
          </ol>
          <p class="derivacion-resultado">En un AR($p$) el argumento es el mismo: CSS condiciona en las $p$
            primeras observaciones y ML añade su densidad conjunta. <span data-afirma="c3-m7-35">De ahí la jerarquía: CSS es más barato y sirve para arrancar <cite class="cita" data-ref="hamilton1994time" data-loc="p. 123"><a href="#ref-m7-hamilton1994time" title="Hamilton, J. D. (1994). Time series analysis. Princeton University Press.">(Hamilton, 1994, p. 123)</a></cite>; ML cuenta además con las primeras observaciones, cuyo efecto pesa más en series de longitud moderada <cite class="cita" data-ref="cryer2008time" data-loc="p. 158"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 158)</a></cite></span>. <span data-afirma="c3-m7-12">Por eso <code>arima()</code> usa por defecto <code>method = "CSS-ML"</code>, que estima por CSS
            para obtener valores iniciales y termina maximizando la verosimilitud exacta <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Arguments"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Arguments)</a></cite></span>.</p>
        </div>
      </div>

      <p>Apliquemos los tres a las manchas solares. Las cifras de la tabla salen de ejecutar el código de abajo, no de
        ninguna otra parte.</p>

      <div class="note">
        <p><strong>¿Cuánto es "distinto"?</strong> Comparar en bruto no dice nada; hay que medir en unidades de error
          estándar. Los de máxima verosimilitud son $0.0706$ y $0.0702$. La diferencia entre Yule–Walker y ML es de
          $-0.0886$ en $\phi_1$ y $+0.0773$ en $\phi_2$, es decir <strong>1.26 y 1.10 errores estándar</strong>.
          Traducción: no es un error de cálculo ni un detalle numérico —<span data-afirma="c3-m7-13">Yule–Walker está sesgado hacia el interior de
          la región estacionaria con muestras cortas</span>— pero tampoco cambia las conclusiones: los dos dicen "AR(2) con
          raíces complejas y ciclo de unos diez años y medio". <strong>CSS y ML, en cambio, distan $0.04$ y $0.02$
            errores estándar: a efectos prácticos son el mismo ajuste.</strong></p>
      </div>

      <div class="warning">
        <p><strong>No compares un $\hat\sigma^2$ de Yule–Walker con uno de ML.</strong> $298.96$ frente a $229.43$
          parece un abismo, pero no salen del mismo cálculo: <span data-afirma="c3-m7-14">Yule–Walker lo obtiene de la ecuación de la varianza del proceso <cite class="cita" data-ref="cryer2008time" data-loc="p. 151"><a href="#ref-m7-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 151)</a></cite> y
          ML lo maximiza junto al resto <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Value"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Value)</a></cite></span>. <span data-afirma="c3-m7-15">Los criterios de información del Módulo 8 se construyen sobre la
          verosimilitud, así que solo tienen sentido con ajustes de <code>arima()</code>, nunca mezclando salidas de
          <code>ar()</code> y <code>arima()</code> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m7-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Estimar un AR(2) por tres métodos">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">manchas &lt;- window(sunspot.year, start = 1770, end = 1869)   # T = 100

# 1. Yule-Walker (metodo de momentos)
yw &lt;- ar(manchas, order.max = 2, aic = FALSE, method = "yule-walker")
round(yw$ar, 4)
#&gt; [1]  1.3173 -0.6338

# 2. Suma de cuadrados condicional
css &lt;- arima(manchas, order = c(2, 0, 0), method = "CSS")
round(coef(css)[1:2], 4)
#&gt;     ar1     ar2
#&gt;  1.4032 -0.7099

# 3. Maxima verosimilitud exacta
ml &lt;- arima(manchas, order = c(2, 0, 0), method = "ML")
ml
#&gt; Coefficients:
#&gt;          ar1      ar2  intercept
#&gt;       1.4059  -0.7111    48.2616
#&gt; s.e.  0.0706   0.0702     4.9751
#&gt; sigma^2 estimated as 229.4:  log likelihood = -414.94,  aic = 837.88

# La distancia entre YW y ML, medida en errores estandar
ee &lt;- sqrt(diag(ml$var.coef))[1:2]
round((yw$ar - coef(ml)[1:2]) / ee, 2)
#&gt;   ar1   ar2
#&gt; -1.26  1.10

# Raices, modulo y pseudo-periodo del ajuste por ML
raices &lt;- polyroot(c(1, -coef(ml)[1:2]))
round(Mod(raices), 4)
#&gt; [1] 1.1859 1.1859        (&gt; 1: estacionario)
round(2 * pi / Arg(raices[1]), 4)
#&gt; [1] 10.7369              anios por ciclo

# La formula cerrada del AR(2) da lo mismo
phi &lt;- coef(ml)[1:2]
round(2 * pi / acos(phi[1] / (2 * sqrt(-phi[2]))), 4)
#&gt; [1] 10.7369

# Una serie corta con phi cerca de 1 (T = 40, phi = 0.95): CSS puede salirse de la
# region estacionaria; ML, no
set.seed(1)
z &lt;- arima.sim(list(ar = 0.95), n = 40)
round(coef(arima(z, order = c(1, 0, 0), include.mean = FALSE, method = "CSS")), 4)
#&gt;    ar1
#&gt; 1.0086     (&gt; 1: fuera de la region estacionaria)
round(coef(arima(z, order = c(1, 0, 0), include.mean = FALSE, method = "ML")), 4)
#&gt;    ar1
#&gt; 0.9808</code></pre>

        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.tsa.ar_model import AutoReg
from statsmodels.regression.linear_model import yule_walker

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values
print(len(manchas))   # 100

# 1. Yule-Walker. OJO: statsmodels usa por defecto el divisor n-k ("adjusted");
#    para reproducir ar() de R hay que pedir method="mle", que usa el divisor n.
rho, sigma = yule_walker(manchas - manchas.mean(), order=2, method="mle")
print(np.round(rho, 4))     # [ 1.3173 -0.6338]

# 2. CSS: la API nueva de ARIMA NO lo ofrece. Sus method= son statespace,
#    innovations_mle, hannan_rissanen, burg, innovations y yule_walker;
#    fit(method="css") lanza ValueError: "css" is not a valid estimator.
#    El antiguo tsa.arima_model.ARMA, que si tenia method="css", fue
#    retirado en statsmodels 0.13. Pero en un AR puro el CSS es la regresion
#    de y_t sobre sus rezagos, y esa la hace AutoReg:
css = AutoReg(manchas, lags=2, trend="c").fit()
print(np.round(css.params[1:], 4))   # [ 1.4032 -0.7099]  el CSS de R

# 3. Maxima verosimilitud. statespace (el defecto) e innovations_mle son
#    AMBOS verosimilitud exacta y dan el mismo punto:
ml  = ARIMA(manchas, order=(2, 0, 0), trend="c").fit()
mle = ARIMA(manchas, order=(2, 0, 0), trend="c").fit(method="innovations_mle")
print(np.round(ml.arparams, 4))    # [ 1.4059 -0.7111]
print(np.round(mle.arparams, 4))   # [ 1.4059 -0.7111]  identico

# Raices y pseudo-periodo
phi = ml.arparams
raices = np.roots(np.r_[1, -phi][::-1])
print(np.round(np.abs(raices), 4))                 # [1.1859 1.1859]
print(round(2 * np.pi / np.angle(raices[0]), 4))   # 10.7365
# R daba 10.7369: los optimizadores convergen a puntos ligerisimamente
# distintos. La diferencia es de 4 diezmilesimas de anio, irrelevante aqui.</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>Yule–Walker no es el mismo en R y en Python.</strong> <span data-afirma="c3-m7-17"><code>yule_walker()</code> de statsmodels usa
          por defecto <code>method="adjusted"</code> (divisor $T-k$) y <code>ar()</code> de R usa el divisor $T$. Con
          las opciones por defecto, las estimaciones <strong>no coinciden</strong>.</span> <span data-afirma="c3-m7-16">Hay que pedir
          <code>method="mle"</code> —nombre desafortunado, porque no es máxima verosimilitud, solo indica el
          divisor— para reproducir la salida de R.</span> Es la misma clase de discrepancia que el ADF del Capítulo 2.</p>
      </div>
      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Para practicar</h4>
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><code>treering</code> trae anchos de anillos de árbol, normalizados y sin unidades, uno por año: 7980 valores que terminan en 1979. Los cien últimos, <code>window(treering, start = 1880)</code>, dan $T = 100$, lo mismo que la ventana de las manchas solares. Ajústales un AR(2) —el orden que usa el módulo, para poder comparar— y entrega:</p>
          <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
            <li>Los coeficientes por Yule–Walker, por CSS y por máxima verosimilitud.</li>
            <li>La distancia de Yule–Walker y de CSS a máxima verosimilitud, en errores estándar. En las manchas, Yule–Walker quedó a $1.26$ y $1.10$ errores estándar: ¿qué es distinto aquí, si $T$ es la misma?</li>
            <li>Una comprobación por simulación: 500 series de $T = 100$ de un AR(2) parecido al de los anillos, $\phi = (0.14,\ 0.21)$, y 500 de uno parecido al de las manchas, $\phi = (1.40,\ -0.70)$; en cada grupo, la distancia media entre Yule–Walker y máxima verosimilitud.</li>
          </ol>
          <div class="ejercicio-acciones">
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m7-pista">
              <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3m7-sol">
              <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
            </button>
          </div>
          <div class="ejercicio-panel pista" id="c3m7-pista" hidden>
            <p style="margin:0;">El código del módulo sirve cambiando la serie. Lo que cambia de una serie a otra no es $T$: compara lo que el módulo dice sobre cuándo se separan los métodos con lo que cada ajuste deja a la vista, sus coeficientes y sus raíces.</p>
          </div>
          <div class="ejercicio-panel solucion" id="c3m7-sol" hidden>
            <p><strong>Respuesta: aquí los tres métodos coinciden: Yule–Walker queda a menos de $0.05$ errores estándar de máxima verosimilitud. La diferencia con las manchas no está en $T$, sino en lo cerca que quedan las raíces del círculo unitario.</strong></p>
            <pre><code class="language-r">x &lt;- window(treering, start = 1880)      # los ultimos cien anios de la serie
length(x)
#&gt; [1] 100

# (a) Los tres estimadores de un AR(2)
yw  &lt;- ar(x, order.max = 2, aic = FALSE, method = "yule-walker")
css &lt;- arima(x, order = c(2, 0, 0), method = "CSS")
ml  &lt;- arima(x, order = c(2, 0, 0), method = "ML")
round(rbind(YW = yw$ar, CSS = coef(css)[1:2], ML = coef(ml)[1:2]), 4)
#&gt;        ar1    ar2
#&gt; YW  0.1386 0.2092
#&gt; CSS 0.1384 0.2179
#&gt; ML  0.1388 0.2140

# (b) La distancia a ML, en errores estandar de ML
ee &lt;- sqrt(diag(ml$var.coef))[1:2]
round(rbind(ee_ML = ee, YW_menos_ML = (yw$ar - coef(ml)[1:2]) / ee,
            CSS_menos_ML = (coef(css)[1:2] - coef(ml)[1:2]) / ee), 4)
#&gt;                  ar1     ar2
#&gt; ee_ML         0.0970  0.0982
#&gt; YW_menos_ML  -0.0016 -0.0487
#&gt; CSS_menos_ML -0.0039  0.0403
round(Mod(polyroot(c(1, -coef(ml)[1:2]))), 4)                # modulo de las raices
#&gt; [1] 1.8618 2.5103

# (c) El experimento: 500 series de T = 100 de cada proceso; distancia media
#     de Yule-Walker a ML, en errores estandar de ML
distancia &lt;- function(phi) {
  d &lt;- replicate(500, {
    s  &lt;- arima.sim(n = 100, model = list(ar = phi))
    f  &lt;- tryCatch(arima(s, order = c(2, 0, 0), method = "ML"), error = function(e) NULL)
    yw &lt;- ar(s, order.max = 2, aic = FALSE, method = "yule-walker")$ar
    if (is.null(f)) c(NA, NA) else abs(yw - coef(f)[1:2]) / sqrt(diag(f$var.coef))[1:2]
  })
  c(rowMeans(d, na.rm = TRUE), sin_ajuste = sum(is.na(d[1, ])),
    modulo = min(Mod(polyroot(c(1, -phi)))))
}
set.seed(37)
round(rbind(raices_lejos = distancia(c(0.14, 0.21)),
            raices_cerca = distancia(c(1.40, -0.70))), 2)
#&gt;               ar1  ar2 sin_ajuste modulo
#&gt; raices_lejos 0.03 0.05          0   1.87
#&gt; raices_cerca 0.66 0.57          1   1.20</code></pre>
            <p><strong>(a)</strong> Yule–Walker da $(0.1386,\ 0.2092)$; CSS, $(0.1384,\ 0.2179)$; y máxima verosimilitud, $(0.1388,\ 0.2140)$.</p>
            <p><strong>(b)</strong> Con errores estándar de $0.097$ y $0.098$, Yule–Walker queda a $0.002$ y $0.049$ errores estándar de máxima verosimilitud, y CSS, a $0.004$ y $0.040$: a efectos prácticos, el mismo ajuste. En las manchas, con la misma $T = 100$, Yule–Walker quedaba a $1.26$ y $1.10$. Lo que cambia es el proceso: las raíces del AR(2) de los anillos tienen módulo $1.86$ y $2.51$, lejos del círculo unitario, y las de las manchas, $1.19$. El módulo decía que CSS y máxima verosimilitud se separan con $T$ pequeña o con los coeficientes cerca de la frontera, y que Yule–Walker está sesgado hacia el interior de la región estacionaria con muestras cortas. Aquí la muestra es igual de corta y el sesgo apenas se nota: lo que cambia es lo lejos que están las raíces de la frontera, y (c) lo comprueba. Las $\hat\sigma^2$ no entran en la comparación: como advierte el módulo, la de Yule–Walker y la de máxima verosimilitud no salen del mismo cálculo.</p>
            <p style="margin-bottom:0;"><strong>(c)</strong> La simulación lo confirma. Con $\phi = (0.14,\ 0.21)$, cuya raíz más cercana al círculo tiene módulo $1.87$, la distancia media entre Yule–Walker y máxima verosimilitud es de $0.03$ y $0.05$ errores estándar; con $\phi = (1.40,\ -0.70)$, de módulo $1.20$, es de $0.66$ y $0.57$, con la misma $T$ (en una de las 500 series de este grupo <code>arima()</code> no llegó a dar estimación). Si el AR(2) es o no un buen modelo para estos cien años es otra pregunta, la del Módulo 8; aquí solo se comparan estimadores.</p>
          </div>
        </div>

  <template id="module-8">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 8</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">3.8 Criterios de información
          y diagnóstico <span class="text-gray-400 font-normal text-2xl">/ Information criteria &amp; diagnostics</span>
        </h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Elegir entre modelos candidatos y —más importante—
              comprobar si el elegido deja residuales que se parezcan a ruido blanco.</p>
          </div>
        </div>
      </div>

      <h3>AIC, AICc y BIC</h3>

      <p><span data-afirma="c3-m8-24">Añadir parámetros nunca empeora la verosimilitud.</span> <span data-afirma="c3-m8-30">Los criterios de información compensan esa mejora con una
        penalización por complejidad, y se elige el modelo con el <strong>menor</strong> valor <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>.</p>

      <div class="formula" data-afirma="c3-m8-01">
        $$\begin{aligned}
          \text{AIC} &= -2\log L + 2k \\[0.3em]
          \text{AICc} &= \text{AIC} + \frac{2k(k+1)}{T-k-1} \\[0.3em]
          \text{BIC} &= -2\log L + k\log T
        \end{aligned}$$
        <p style="margin-bottom:0;">donde $k$ es el número de parámetros estimados —incluido $\sigma^2$— y $T$ el
          número de observaciones <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite>.</p>
      </div>

      <div class="note">
        <p><strong>Cuál usar.</strong> <span data-afirma="c3-m8-03">El AICc corrige el sesgo del AIC en muestras pequeñas <cite class="cita" data-ref="cryer2008time" data-loc="p. 130"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 130)</a></cite></span> y converge a él cuando
          $T$ crece, así que <span data-afirma="c3-m8-04"><strong>no hay razón para preferir el AIC</strong> <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>. <span data-afirma="c3-m8-05">El BIC penaliza más
          ($\log T > 2$ en cuanto $T > 7$) y por eso tiende a elegir modelos más pequeños <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§7.5"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §7.5)</a></cite></span>. <span data-afirma="c3-m8-06">Si buscas pronosticar,
          AICc <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§7.5"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §7.5)</a></cite>; si buscas identificar el modelo "verdadero", BIC <cite class="cita" data-ref="cryer2008time" data-loc="p. 131"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 131)</a></cite></span>.</p>
      </div>

      <div class="warning">
        <p><strong>La trampa que reaparecerá en el Capítulo 4.</strong> <span data-afirma="c3-m8-07">Los criterios solo son comparables entre
          modelos ajustados a <strong>los mismos datos</strong>. Diferenciar cambia los datos: un ARIMA con $d=1$ se
          ajusta sobre $T-1$ observaciones distintas de las del modelo con $d=0$. Comparar sus AIC no significa nada <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.6"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.6)</a></cite></span>.
          Aquí todos los candidatos tienen $d=0$ sobre la misma serie, así que la comparación es lícita.</p>
      </div>

      <h3>Diagnóstico: los residuales deben ser ruido blanco</h3>

      <p>El criterio de información dice cuál de los candidatos es relativamente mejor, pero no si <em>alguno</em> es
        bueno. Para eso están los residuales $\hat\varepsilon_t$: <span data-afirma="c3-m8-34">si el modelo ha capturado toda la estructura, lo que
        queda no debe tener ninguna <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite></span>.</p>

      <div class="definition" data-afirma="c3-m8-08">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Prueba de Ljung–Box</h4>
        <p>Contrasta si las primeras $h$ autocorrelaciones de los residuales son <strong>conjuntamente</strong> nulas <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.4"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.4)</a></cite>:</p>
        $$\begin{gathered}
          Q(h) = T(T+2)\sum_{k=1}^{h}\frac{\hat r_k^2}{T-k} \\[0.4em]
          Q(h) \;\sim\; \chi^2_{\,h-p-q} \quad\text{bajo } H_0
        \end{gathered}$$
        <p style="margin-bottom:0;">$H_0$ es "los residuales son ruido blanco". Un $p$-valor <strong>pequeño</strong>
          significa que <strong>queda estructura sin modelar</strong>: el modelo no basta <cite class="cita" data-ref="cryer2008time" data-loc="p. 184"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 184)</a></cite>.</p>
      </div>

      <p><span data-afirma="c3-m8-31">Los grados de libertad son $h-p-q$ y no $h$ porque los residuales no son ruido blanco observado, sino lo que
        queda tras estimar $p+q$ parámetros, y esa estimación los deja menos correlacionados de lo que estarían por
        azar <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite>. Si no se descuentan, la prueba rechaza menos de lo que debería.</span> <span data-afirma="c3-m8-13">En R el descuento es el argumento
        <code>fitdf = p + q</code> de <code>Box.test()</code>, que <strong>no</strong> se aplica solo, y solo tiene
        sentido evaluar en $h > p+q$ <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>. El efecto se mide en el código R de este módulo: <span data-afirma="c3-m8-15">con tres mil
        series que de verdad son AR(2), $T = 100$ y $h = 12$, la prueba al 5&nbsp;% rechaza el $4.9$&nbsp;% de las
        veces con <code>fitdf = 2</code> y solo el $2.6$&nbsp;% sin él</span>.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ljung-box">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ljung-box" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p><span data-afirma="c3-m8-09">Si una serie es ruido blanco, cada autocorrelación muestral cumple aproximadamente
                $\hat r_k \sim N(0,\,1/T)$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 110"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 110)</a></cite>. Entonces $T\hat r_k^2$ es aproximadamente $\chi^2_1$, y sumando $h$
                rezagos aproximadamente independientes se obtiene el estadístico de Box–Pierce <cite class="cita" data-ref="cryer2008time" data-loc="p. 183"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 183)</a></cite></span>:</p>
              $$Q_{BP}(h) = T\sum_{k=1}^{h}\hat r_k^2 \;\sim\; \chi^2_h$$
            </li>
            <li>
              <p><span data-afirma="c3-m8-10">Esa aproximación es mala con $T$ moderado <cite class="cita" data-ref="cryer2008time" data-loc="p. 184"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 184)</a></cite></span>, <span data-afirma="c3-m8-11">porque la varianza real de $\hat r_k$ es algo menor que
                $1/T$, y tanto menor cuanto mayor es $k$ —el numerador de $\hat r_k$ suma solo $T-k$ productos, pero
                el denominador sigue sumando las $T$ observaciones, y eso encoge $\hat r_k$ hacia cero—:
                $\operatorname{Var}(\hat r_k) \approx (T-k)/\big(T(T+2)\big)$</span>. <span data-afirma="c3-m8-36">Con el factor $T$, $Q_{BP}$ sale pequeño y la prueba rechaza menos de lo que debería (en Cryer y Chan el estadístico de Box–Pierce se escribe $Q$ y el de Ljung–Box, $Q^{*}$). Ljung y Box (1978) reemplazaron ese factor por
                el inverso de la varianza, que por eso <em>crece</em> con el rezago <cite class="cita" data-ref="cryer2008time" data-loc="p. 184"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 184)</a></cite></span>:</p>
              $$T \;\longrightarrow\; \frac{T(T+2)}{T-k}$$
            </li>
            <li>
              <p>Falta el ajuste clave. Los $\hat r_k$ no se calculan sobre ruido blanco observado, sino sobre
                <strong>residuales de un modelo estimado</strong>. Al estimar $p+q$ parámetros se han impuesto $p+q$
                restricciones que fuerzan a los residuales a estar menos correlacionados de lo que estarían por azar.</p>
            </li>
            <li>
              <p><span data-afirma="c3-m8-12">Ignorarlo infla el $p$-valor y hace que la prueba <strong>no rechace cuando debería</strong>. La
                corrección consiste en descontar esos parámetros de los grados de libertad <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.7"><a href="#ref-m8-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.7)</a></cite></span>:</p>
              $$Q(h) \sim \chi^2_{\,h-p-q}$$
              <p><span data-afirma="c3-m8-32">En R eso es el argumento <code>fitdf = p + q</code> de <code>Box.test()</code>, que
                <strong>no</strong> se aplica solo. Solo tiene sentido evaluar en $h > p+q$ <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite></span>.</p>
              <p><span data-afirma="c3-m8-35">Sin el descuento la prueba rechaza cerca de la mitad de lo que debería</span>: es el Monte Carlo del
                párrafo anterior a este desarrollo.</p>
            </li>
          </ol>
          <p class="derivacion-resultado" data-afirma="c3-m8-16">Regla práctica: sobre los residuales de un ARMA($p,q$) hay que llamar a
            <code>Box.test(residuals(ajuste), lag = h, type = "Ljung-Box", fitdf = p + q)</code> <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Details"><a href="#ref-m8-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Details)</a></cite>. Si omites
            <code>fitdf</code>, la prueba es demasiado indulgente y aprobará modelos insuficientes.</p>
        </div>
      </div>

      <!--RANKING:criterios|Los criterios de información sobre las manchas solares|-->

      <h3>El problema: el modelo "correcto" no pasa el examen</h3>

      <p>Pongamos juntos los dos criterios sobre la serie <strong>cruda</strong> de manchas solares. Todos los
        candidatos tienen $d=0$, así que la comparación es legítima. La tabla recoge los siete de los once que la
        discusión necesita; la tabla ordenable de arriba los tiene todos.</p>

      <table style="position:relative;">
        <caption class="sr-only">Rejilla de modelos ARMA sobre las manchas solares crudas</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th><th scope="col">AICc</th><th scope="col">BIC</th>
            <th scope="col">Ljung–Box(12)</th>
          </tr>
        </thead>

          <tr><td>AR(1)</td><td>$904.33$</td><td>$911.89$</td><td>$&lt;0.0001$</td></tr>
          <tr><td>AR(2)</td><td>$838.30$</td><td>$848.30$</td><td>$0.0461$</td></tr>
          <tr><td>AR(3)</td><td>$836.52$</td><td>$848.91$</td><td>$0.1658$</td></tr>
          <tr><td>MA(2)</td><td>$853.56$</td><td>$863.56$</td><td>$&lt;0.0001$</td></tr>
          <tr><td>ARMA(1,1)</td><td>$850.50$</td><td>$860.50$</td><td>$&lt;0.0001$</td></tr>
          <tr>
            <td><strong>ARMA(2,1)</strong></td>
            <td><strong>$834.73$</strong></td><td><strong>$847.12$</strong></td><td>$0.2246$</td>

      </table>

      <div class="warning">
        <p><strong>Aquí hay un problema, y conviene no taparlo.</strong> El AR(2) es el modelo que la identificación proponía, pero:</p>
        <ul style="margin-bottom:0;">
          <li>su Ljung–Box en el rezago 12 da $p = 0.0461$, es decir, <strong>se rechaza</strong> al 5 %: quedan
            autocorrelaciones sin explicar;</li>
          <li>y <strong>no</strong> es el mejor por AICc ni por BIC. Gana el ARMA(2,1), cuyo $\hat\theta_1 = 0.3732$
            es significativo ($t = 2.78$) y cuyos residuales sí pasan la prueba ($p = 0.2246$).</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>R y Python no dan el mismo $p$-valor de Ljung–Box, y aquí la conclusión cambia.</strong> Sobre el
          AR(2), R da $0.0461$ (se rechaza) y statsmodels $0.1085$ (no se rechaza). Los ajustes son idénticos —AICc y
          BIC coinciden hasta el último decimal—, así que la diferencia está en los <strong>residuales</strong>.
          <span data-afirma="c3-m8-18">Comparándolos uno a uno: del tercero en adelante son los mismos ($8.728$ frente a $8.727$, $-15.396$ frente a
          $-15.397$…); los que difieren son los <strong>dos primeros</strong> (R da $21.06$ y statsmodels $52.54$
          para el primero). El modelo y el filtro son los mismos; cambia lo que cada programa <em>devuelve</em>. El
          error de predicción de la primera observación, que no tiene pasado, tiene varianza $\gamma_0$ y no
          $\sigma^2$: statsmodels lo entrega tal cual y R lo entrega dividido entre $\sqrt{\gamma_0/\sigma^2}$,
          para que todos los residuales queden en la misma escala ($52.54/\sqrt{6.226} = 21.06$). Con el segundo
          pasa lo mismo.</span> Dos valores inflados al principio bastan para mover las autocorrelaciones residuales y,
          con ellas, $Q$.</p>
        <p style="margin-bottom:0;">La comprobación decisiva: si se descartan los $\max(p,q)$ primeros residuales,
          los dos coinciden — ARMA(2,0): $0.0232$ en R y $0.0232$ en Python; ARMA(2,1): $0.1424$ y $0.1420$. Es decir,
          <strong>el rechazo del AR(2) es real y se refuerza</strong> ($0.0232 < 0.0461$); lo que relaja la prueba
          en statsmodels son esos primeros residuales sin estandarizar. Moraleja general: cuando dos programas
          discrepen en un contraste sobre residuales, compara primero los residuales, no los $p$-valores.</p>
      </div>

      <div class="note">
        <p><strong>Un detalle que justifica la prueba conjunta.</strong> Si abres el simulador en el AR(2), verás que
          <strong>ninguna</strong> de sus 20 autocorrelaciones residuales se sale de la banda $\pm 0.196$: la mayor es
          $0.1839$ en el rezago 11 y la siguiente $0.1718$ en el 9 — dentro, pero la primera se queda a un pelo.
          Mirando el correlograma barra por barra habrías dado el modelo por bueno. Y sin embargo Ljung–Box lo
          rechaza, <span data-afirma="c3-m8-33">porque evalúa las doce <strong>a la vez</strong>: $Q$ suma los <strong>cuadrados</strong> de todas,
          de modo que media docena de autocorrelaciones moderadas, cada una insignificante por separado, acumulan un
          $Q$ que sí lo es <cite class="cita" data-ref="cryer2008time" data-loc="p. 183"><a href="#ref-m8-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 183)</a></cite></span>. Para eso existe la prueba, y por eso no basta con mirar el dibujo.</p>
      </div>

      <p>La tentación es aceptar el ARMA(2,1) y seguir. Pero antes de añadir un parámetro para tapar un problema,
        conviene preguntarse <strong>qué problema es</strong>. Eso es lo que hace el módulo siguiente.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Criterios de información y Ljung-Box">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">manchas &lt;- window(sunspot.year, start = 1770, end = 1869)
n &lt;- length(manchas)

# arima() reporta AIC pero NO AICc: hay que calcularlo
aicc &lt;- function(ajuste, n) {
  k &lt;- length(ajuste$coef) + 1        # +1 por sigma^2
  ajuste$aic + 2 * k * (k + 1) / (n - k - 1)
}

# La rejilla no es un producto cartesiano: son ordenes bajos en las dos partes
# mas dos AR largos. Es una eleccion de este capitulo, no un resultado de la
# lectura de los correlogramas, y son los once candidatos de la tabla ordenable
# de arriba.
rejilla &lt;- list(c(1,0), c(2,0), c(3,0), c(4,0),
                c(0,1), c(0,2), c(0,3),
                c(1,1), c(2,1), c(1,2), c(2,2))

resultado &lt;- do.call(rbind, lapply(rejilla, function(pq) {
  p &lt;- pq[1]; q &lt;- pq[2]
  aj &lt;- arima(manchas, order = c(p, 0, q), method = "ML")
  data.frame(
    modelo = sprintf("ARMA(%d,%d)", p, q),
    AICc = round(aicc(aj, n), 2),
    BIC  = round(BIC(aj), 2),
    # fitdf = p + q es IMPRESCINDIBLE: sin el, la prueba es indulgente
    LB12 = round(Box.test(residuals(aj), lag = 12,
                          type = "Ljung-Box", fitdf = p + q)$p.value, 4)
  )
}))
resultado[order(resultado$AICc), ]
#&gt;       modelo   AICc    BIC   LB12
#&gt; 9  ARMA(2,1) 834.73 847.12 0.2246
#&gt; 3  ARMA(3,0) 836.52 848.91 0.1658
#&gt; 11 ARMA(2,2) 836.63 851.36 0.1510
#&gt; 4  ARMA(4,0) 836.78 851.51 0.1118
#&gt; 2  ARMA(2,0) 838.30 848.30 0.0461
#&gt; 10 ARMA(1,2) 840.51 852.90 0.0110
#&gt; 7  ARMA(0,3) 845.35 857.74 0.0010
#&gt; 8  ARMA(1,1) 850.50 860.50 0.0000
#&gt; 6  ARMA(0,2) 853.56 863.56 0.0000
#&gt; 1  ARMA(1,0) 904.33 911.89 0.0000
#&gt; 5  ARMA(0,1) 908.13 915.70 0.0000

# El AR(2), mirado de cerca
ar2 &lt;- arima(manchas, order = c(2, 0, 0), method = "ML")
round(acf(residuals(ar2), lag.max = 3, plot = FALSE)$acf[-1], 4)
#&gt; [1]  0.1297 -0.1477  0.0285
Box.test(residuals(ar2), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value
#&gt; [1] 0.04614324        <- se rechaza al 5%

# Lo que pasa si se OLVIDA fitdf: el mismo modelo "aprueba"
Box.test(residuals(ar2), lag = 12, type = "Ljung-Box")$p.value
#&gt; [1] 0.09957107        <- conclusion opuesta por omitir un argumento

# Sin fitdf la prueba rechaza la mitad de lo debido: 3000 series AR(2), T = 100, h = 12
set.seed(8)
p_valores &lt;- replicate(3000, {
  y &lt;- arima.sim(list(ar = c(1.4, -0.7)), n = 100)
  e &lt;- residuals(suppressWarnings(arima(y, order = c(2, 0, 0), method = "ML")))
  c(sin_fitdf = Box.test(e, lag = 12, type = "Ljung-Box")$p.value,
    con_fitdf = Box.test(e, lag = 12, type = "Ljung-Box", fitdf = 2)$p.value)
})
round(rowMeans(p_valores &lt; 0.05), 4)   # tasa de rechazo al 5%
#&gt; sin_fitdf con_fitdf
#&gt;    0.0257    0.0490</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">import numpy as np
import pandas as pd
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values

# La misma lista de once candidatos que en R, no un producto cartesiano.
rejilla = [(1,0), (2,0), (3,0), (4,0),
           (0,1), (0,2), (0,3),
           (1,1), (2,1), (1,2), (2,2)]

filas = []
for p, q in rejilla:
    res = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    # model_df descuenta los parametros estimados, igual que fitdf en R
    lb = acorr_ljungbox(res.resid, lags=[12], model_df=p + q)
    filas.append({"modelo": f"ARMA({p},{q})", "AICc": round(res.aicc, 2),
                  "BIC": round(res.bic, 2),
                  "LB12": round(float(lb["lb_pvalue"].iloc[0]), 4)})

print(pd.DataFrame(filas).sort_values("AICc").to_string(index=False))
#    modelo   AICc    BIC   LB12
# ARMA(2,1) 834.73 847.12 0.3211
# ARMA(3,0) 836.52 848.91 0.3176
# ARMA(2,2) 836.63 851.36 0.1939
# ARMA(4,0) 836.78 851.51 0.1677
# ARMA(2,0) 838.30 848.30 0.1085   <- en R da 0.0461
# AICc y BIC coinciden con R hasta el ultimo decimal. Los p-valores de
# Ljung-Box NO: ver la advertencia de abajo.

# Reconciliacion: descartando los max(p,q) primeros residuales, los dos
# programas coinciden.
for p, q in [(2, 0), (2, 1), (2, 2)]:
    r = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    corte = max(p, q)
    lb = acorr_ljungbox(r.resid[corte:], lags=[12], model_df=p + q)
    print(f"ARMA({p},{q}) recortado: {float(lb['lb_pvalue'].iloc[0]):.4f}")
# ARMA(2,0) recortado: 0.0232      (R: 0.0232)
# ARMA(2,1) recortado: 0.1420      (R: 0.1424)
# ARMA(2,2) recortado: 0.1051      (R: 0.1057)

# statsmodels SI trae aicc; R no lo trae en arima() y hay que calcularlo.
# Cuidado tambien con model_df: por defecto vale 0 y la prueba se relaja.</code></pre>

            <p class="text-gray-600 text-sm" style="margin:0;">Cerrar el caso de las manchas solares —y descubrir que

      <h3>Caso 1 · Manchas solares: el parámetro que sobraba</h3>

      <p>Nos quedamos con un AR(2) que no pasaba Ljung–Box y un ARMA(2,1) que ganaba por AICc. Antes de aceptar el
        parámetro extra, volvamos al Capítulo 2: <strong>¿la serie está en la escala adecuada?</strong></p>

      <p><span data-afirma="c3-m9-01">Los números de manchas solares son <strong>índices construidos a partir de conteos</strong> <cite class="cita" data-ref="cryer2008time" data-loc="p. 392"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 392)</a></cite>.</span> Es de esperar que su variabilidad crezca con el
        nivel: en un máximo solar hay más manchas y también fluctúan más. Eso se comprueba, no se supone. Una forma de
        medirlo es la <strong>elasticidad amplitud–nivel</strong>: se parte la serie en bloques consecutivos, se
        calcula la media (el nivel) y la desviación estándar (la amplitud) de cada uno, y se ajusta una recta a
        $\log(\text{desviación})$ contra $\log(\text{media})$. Su pendiente $\hat b$ dice cuánto crece la amplitud cuando
        crece el nivel: con $b = 0$ no depende de él y no hay nada que corregir; <span data-afirma="c3-m9-02">con $b = 1$ crece en proporción, y el
        remedio es el logaritmo <cite class="cita" data-ref="cryer2008time" data-loc="p. 98"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 98)</a></cite></span>; <span data-afirma="c3-m9-41">con $b = 0.5$, la raíz cuadrada. En general la potencia que estabiliza es
        $\lambda = 1 - b$</span>, la escala de Box–Cox del Capítulo 2. <span data-afirma="c3-m9-42">El criterio de Guerrero, el que <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§3.1" data-modo="narrativa"><a href="#ref-m9-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">Hyndman y Athanasopoulos (2021, §3.1)</a></cite> ofrecen para elegir $\lambda$</span>, <span data-afirma="c3-m9-43">busca justamente que $s_i/\bar y_i^{\,1-\lambda}$ sea homogéneo entre bloques</span>. Es la pregunta del gráfico de amplitud frente a nivel
        del Capítulo 1, con un número en lugar de una nube de puntos. Con tres tamaños de bloque (la función que los
        calcula está en el código del caso, al final de su sección):</p>

      <table style="position:relative;">
        <caption class="sr-only">Elasticidad amplitud-nivel de las manchas solares según el tamaño de bloque</caption>
        <thead>
          <tr>
            <th scope="col">Bloques</th><th scope="col">$\hat b$</th><th scope="col">IC 95 %</th>
            <th scope="col">$R^2$</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>10 años</td><td>$0.816$</td><td>$[0.593,\ 1.040]$</td><td>$0.899$</td></tr>
          <tr><td>11 años (un ciclo)</td><td>$0.766$</td><td>$[0.533,\ 0.998]$</td><td>$0.897$</td></tr>
          <tr><td>5 años</td><td>$0.703$</td><td>$[0.475,\ 0.931]$</td><td>$0.700$</td></tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>Qué dicen y qué no dicen estos números.</strong> Los tres intervalos excluyen $b=0$ con holgura:
          <strong>hay que transformar</strong>, eso es firme y no depende de cómo se hagan los bloques. Pero entre
          $b=0.5$ (raíz cuadrada) y $b=1$ (logaritmo) las tres particiones se contradicen: con bloques de 10 años
          el intervalo contiene el $1$ y deja fuera el $0.5$; con bloques de 5, al revés; con bloques de 11, deja
          fuera los dos por muy poco. Los datos piden una transformación y no dicen exactamente cuál.</p>
      </div>

      <p>Lo que decide es otra cosa, y es contundente: <strong>la serie tiene un año con cero manchas</strong> (1810;
        en la serie completa 1700–1988 hay tres). El logaritmo de cero no existe. <span data-afirma="c3-m9-03">La raíz cuadrada, en cambio, está definida en cero y se señala como útil con datos de tipo Poisson <cite class="cita" data-ref="cryer2008time" data-loc="p. 101"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 101)</a></cite>.</span> <span data-afirma="c3-m9-05">Además, el $\lambda$ de Guerrero
        del Capítulo 2 sobre esta serie —desplazada una unidad <cite class="cita" data-ref="cryer2008time" data-loc="p. 101"><a href="#ref-m9-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 101)</a></cite>, porque el criterio exige datos estrictamente positivos
        y está ese cero— da $0.3062$, que cae <strong>entre</strong> el logaritmo y la raíz cuadrada.</span></p>

      <div class="simulador" data-simulador="manchas-transformada">

          mucho más entre sí. La PACF conserva su forma —dos barras grandes y el resto pequeñas— pero no queda más
          limpia: en la escala original solo salen de la banda los rezagos 1 y 2, y en la raíz la rozan además el
          6, el 9 y el 16 ($0.200$, $0.198$ y $-0.199$ frente a $\pm 0.196$).</p>

      <p>Y ahora el resultado. Repitiendo exactamente la misma rejilla del Módulo 8 sobre $\sqrt{\text{manchas}}$
