      <h3>Ejercicios propuestos</h3>

      <p>Tres ejercicios con pista y solución comentada. Las cifras de cada solución salen de ejecutar el código que
        la acompaña, ninguna está escrita de memoria, y puedes contrastar las tuyas con ellas.</p>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">1.</span>Toma la serie <code>lh</code> de R
          <span data-afirma="c3-m10-31">(48 mediciones de hormona luteinizante, una cada 10 minutos) <cite class="cita" data-ref="rcoreteam2026r" data-loc="§Description"><a href="#ref-m10-rcoreteam2026r" title="R Core Team. (2026). R: A Language and Environment for Statistical Computing (Versión 4.6.0) [Software]. R Foundation for Statistical Computing. https://www.R-project.org/">(R Core Team, 2026, §Description)</a></cite></span>. Identifica $(p,q)$ con ACF y PACF, ajusta los
          candidatos razonables y elige uno. ¿Coinciden el AICc y el BIC? Diagnostica el modelo que elijas.</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e1-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e1-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e1-pista" hidden>
          <p style="margin:0;">Con $T = 48$ la banda es ancha: calcúlala antes de mirar los correlogramas y
            cuenta cuántas barras salen de verdad, sin fiarte de las que quedan en el borde. Ajusta más de un
            candidato y, antes de elegir, pon los dos criterios uno al lado del otro y comprueba cuáles pasan
            Ljung–Box. Si los criterios no coinciden, la lista «Qué confirma el orden elegido» de este módulo
            dice qué más mirar.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e1-sol" hidden>
          <p><strong>Respuesta: el AICc elige MA(2) y el BIC elige AR(1), por muy poco, y los dos son
              defendibles.</strong></p>
          <pre><code class="language-r">aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
n &lt;- length(lh)   # 48

# La banda es ancha: solo el rezago 1 sale de ella en las dos funciones
round(1.96 / sqrt(n), 4)
#&gt; [1] 0.2829
round(acf(lh,  lag.max = 6, plot = FALSE)$acf[-1], 4)
#&gt; [1]  0.5755  0.1818 -0.1448 -0.1748 -0.1497 -0.0210
# pacf()$acf devuelve un array de tres dimensiones y se imprime como tal:
# as.numeric() lo aplana para poder leerlo de un vistazo
round(as.numeric(pacf(lh, lag.max = 6, plot = FALSE)$acf), 4)
#&gt; [1]  0.5755 -0.2234 -0.2269  0.1028 -0.0759  0.0676

# Las dos se cortan aparentemente en el rezago 1: candidatos AR(1) y MA(1),
# y conviene probar algo mas por si acaso.
for (pq in list(c(1,0), c(2,0), c(3,0), c(0,1), c(0,2), c(1,1))) {
  f &lt;- arima(lh, order = c(pq[1], 0, pq[2]), method = "ML")
  cat(sprintf("ARMA(%d,%d)  AICc=%7.3f  BIC=%7.3f  LB(10) p=%.4f\n",
      pq[1], pq[2], aicc(f, n), BIC(f),
      Box.test(residuals(f), lag = 10, type = "Ljung-Box",
               fitdf = sum(pq))$p.value))
}
#&gt; ARMA(1,0)  AICc= 65.304  BIC= 70.372  LB(10) p=0.4050
#&gt; ARMA(2,0)  AICc= 65.434  BIC= 71.989  LB(10) p=0.4185
#&gt; ARMA(3,0)  AICc= 65.613  BIC= 73.541  LB(10) p=0.7958
#&gt; ARMA(0,1)  AICc= 68.649  BIC= 73.717  LB(10) p=0.1962
#&gt; ARMA(0,2)  AICc= 63.991  BIC= 70.545  LB(10) p=0.8492
#&gt; ARMA(1,1)  AICc= 66.454  BIC= 73.009  LB(10) p=0.3927

# Los dos finalistas: el AR(1), minimo del BIC, y el MA(2), minimo del AICc
ar1 &lt;- arima(lh, order = c(1, 0, 0), method = "ML")
ma2 &lt;- arima(lh, order = c(0, 0, 2), method = "ML")
round(c(phi = coef(ar1)[["ar1"]], ee = sqrt(ar1$var.coef[1,1]),
        media = coef(ar1)[["intercept"]]), 4)
#&gt;    phi     ee  media
#&gt; 0.5739 0.1161 2.4133
# El coeficiente de mayor orden del MA(2) y su estadistico t
round(c(theta2 = coef(ma2)[["ma2"]],
        t = coef(ma2)[["ma2"]] / sqrt(ma2$var.coef[2,2])), 4)
#&gt; theta2      t
#&gt; 0.3753 2.9073

# La ACF teorica de cada uno frente a la muestral, rezagos 1 a 3
round(rbind(muestral = acf(lh, lag.max = 3, plot = FALSE)$acf[-1],
            AR1 = ARMAacf(ar = coef(ar1)[["ar1"]], lag.max = 3)[-1],
            MA2 = ARMAacf(ma = coef(ma2)[1:2], lag.max = 3)[-1]), 3)
#&gt;              1     2      3
#&gt; muestral 0.576 0.182 -0.145
#&gt; AR1      0.574 0.329  0.189
#&gt; MA2      0.581 0.235  0.000

# La normalidad de los residuales se rechaza en los dos
round(c(AR1 = shapiro.test(residuals(ar1))$p.value,
        MA2 = shapiro.test(residuals(ma2))$p.value), 4)
#&gt;    AR1    MA2
#&gt; 0.0083 0.0264

# La busqueda automatica del Modulo 9 tampoco se decide
library(forecast)
c(por_pasos  = as.character(auto.arima(lh)),
  exhaustiva = as.character(auto.arima(lh, stepwise = FALSE, approximation = FALSE)))
#&gt;                         por_pasos                        exhaustiva
#&gt; "ARIMA(1,0,0) with non-zero mean" "ARIMA(0,0,2) with non-zero mean"</code></pre>
          <p><strong>Discusión.</strong> Los dos modelos pasan Ljung–Box con holgura ($p = 0.405$ y $0.849$), así
            que ninguno es inadmisible. El AICc prefiere el MA(2) ($63.99$ frente a $65.30$) y el BIC prefiere el
            AR(1) ($70.37$ frente a $70.55$, una diferencia de $0.17$ que no distingue nada). Con $T = 48$ esta
            indeterminación no sorprende.</p>
          <p>La lista «Qué confirma el orden elegido» de este módulo tampoco desempata, pero dice qué pesa en
            cada lado. A favor del MA(2): su coeficiente de mayor orden es significativo
            ($\hat\theta_2 = 0.375$, $t = 2.91$) y su ACF teórica se parece más a la muestral en el rezago 2
            ($0.235$ frente a $r_2 = 0.182$; la del AR(1) da $0.329$). A favor del AR(1): la parsimonia —un
            coeficiente en vez de dos— y una lectura directa ($\hat\phi = 0.574$: cada medición conserva el
            57 % de la desviación de la anterior respecto a la media). La búsqueda automática refleja la misma
            indecisión: <code>auto.arima(lh)</code> devuelve el AR(1) con la búsqueda por pasos y el MA(2) con la
            exhaustiva. Quien busque identificar el proceso tiene motivos para quedarse con el AR(1), que es
            lo que elige el BIC; quien busque pronosticar, con el MA(2), que es lo que elige el AICc. Lo que no
            vale es elegir sin decir por qué.</p>
          <p style="margin-bottom:0;">Si el objetivo fuera pronosticar, <span data-afirma="c3-m10-33">valdría la pena comparar los
            dos por validación de origen móvil <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§5.10"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §5.10)</a></cite></span>, que es lo que hará el Capítulo 6. Nota final: la normalidad de los
            residuales se rechaza en los dos ($p = 0.0083$ en el AR(1) y $0.0264$ en el MA(2)), <span data-afirma="c3-m10-90">un aviso para los intervalos de pronóstico <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§9.8"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §9.8)</a></cite></span>.</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><span class="ejercicio-numero">2.</span>Considera el proceso
          MA(2) con $\theta = (0.9,\ 0.2)$. Entrega:</p>
        <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
          <li>¿Es invertible? Compruébalo de dos maneras: con el triángulo del Módulo 3 y con las raíces de
            $\theta(B)$.</li>
          <li>Su ACF teórica, a mano y con <code>ARMAacf()</code>. ¿Se cumple aquí la cota $|\rho_1| \le 0.5$
            del Módulo 3?</li>
          <li>La ACF del MA(2) con $\theta = (2.4,\ 0.8)$. Compárala con la anterior y explica el resultado
            factorizando los dos polinomios.</li>
        </ol>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e2-pista" hidden>
          <p style="margin:0;">Para la ACF usa la fórmula general del MA($q$) con el convenio $\theta_0 = 1$, y
            cuenta cuántos sumandos tiene el numerador en cada rezago. Sobre la cota, relee de dónde salía. Para
            el tercer apartado, escribe $1 + 0.9B + 0.2B^2$ como producto de dos factores de primer grado, haz lo
            mismo con $1 + 2.4B + 0.8B^2$ y mira en qué se diferencian.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e2-sol" hidden>
          <p><strong>Respuesta: es invertible, $\rho_1 = 0.5838$ y $\rho_2 = 0.1081$, la cota <em>no</em> se
              cumple porque no era aplicable, y el segundo MA(2) tiene exactamente la misma ACF sin ser
              invertible.</strong></p>
          <pre><code class="language-r">theta &lt;- c(0.9, 0.2)

# (a) Invertibilidad: raices de theta(B) = 1 + 0.9 B + 0.2 B^2 = (1 + 0.5 B)(1 + 0.4 B)
round(Re(polyroot(c(1, theta))), 4)
#&gt; [1] -2.0 -2.5
all(Mod(polyroot(c(1, theta))) &gt; 1)
#&gt; [1] TRUE

# (b) ACF a mano, con theta_0 = 1
denominador &lt;- 1 + sum(theta^2)                              # 1 + 0.81 + 0.04
rho1 &lt;- (1 * theta[1] + theta[1] * theta[2]) / denominador   # (0.9 + 0.18) / 1.85
rho2 &lt;- (1 * theta[2]) / denominador                         # 0.2 / 1.85
round(c(rho1 = rho1, rho2 = rho2), 4)
#&gt;   rho1   rho2
#&gt; 0.5838 0.1081
round(ARMAacf(ma = theta, lag.max = 4)[-1], 4)     # coinciden, y se corta en q = 2
#&gt;      1      2      3      4
#&gt; 0.5838 0.1081 0.0000 0.0000

# (c) El otro MA(2): (1 + 2 B)(1 + 0.4 B) = 1 + 2.4 B + 0.8 B^2
round(ARMAacf(ma = c(2.4, 0.8), lag.max = 4)[-1], 4)      # la MISMA ACF
#&gt;      1      2      3      4
#&gt; 0.5838 0.1081 0.0000 0.0000
round(Re(polyroot(c(1, 2.4, 0.8))), 4)             # una raiz dentro del circulo
#&gt; [1] -0.5 -2.5

# Simulado el no invertible, arima() devuelve por defecto el invertible
set.seed(2)
y &lt;- arima.sim(n = 2000, model = list(ma = c(2.4, 0.8)))
m &lt;- arima(y, order = c(0, 0, 2), include.mean = FALSE)
round(c(coef(m), sigma2 = m$sigma2), 4)
#&gt;    ma1    ma2 sigma2
#&gt; 0.9035 0.2299 4.0351</code></pre>
          <p><strong>Invertibilidad.</strong> Por el triángulo: $\theta_1 + \theta_2 = 1.1 > -1$,
            $\theta_2 - \theta_1 = -0.7 > -1$ y $|\theta_2| = 0.2 < 1$. Por las raíces:
            $\theta(B) = (1 + 0.5B)(1 + 0.4B)$ se anula en $B = -2$ y en $B = -2.5$, las dos fuera del círculo
            unitario.</p>
          <p><strong>Sobre la cota.</strong> $\rho_1 = (0.9 + 0.18)/1.85 = 0.5838 > 0.5$. No hay contradicción: <span data-afirma="c3-m10-34">la cota
            $|\rho_1|\le 0.5$ se dedujo <strong>solo para el MA(1)</strong>, maximizando $\theta/(1+\theta^2)$ <cite class="cita" data-ref="cryer2008time" data-loc="p. 58"><a href="#ref-m10-cryer2008time" title="Cryer, J. D., y Chan, K.-S. (2008). Time Series Analysis (2.ª ed.). Springer New York. https://doi.org/10.1007/978-0-387-75959-3">(Cryer y Chan, 2008, p. 58)</a></cite></span>. Con
            $q = 2$ el numerador de $\rho_1$ gana el término extra $\theta_1\theta_2$ y el techo sube. Es un buen
            recordatorio de que una cota vale exactamente en el modelo del que se dedujo: ver $r_1 = 0.58$ pone en duda un MA(1), <strong>no</strong> un MA(2).</p>
          <p style="margin-bottom:0;"><strong>El otro MA(2).</strong> $1 + 2.4B + 0.8B^2 = (1 + 2B)(1 + 0.4B)$: es
            el polinomio anterior con el factor $(1 + 0.5B)$ cambiado por $(1 + 2B)$, es decir, con la raíz $-2$
            sustituida por su inversa, $-0.5$, que cae dentro del círculo. Es lo que el Módulo 3 hacía con
            $\theta$ y $1/\theta$ en el MA(1), aplicado a uno solo de los dos factores: la ACF no cambia
            ($0.5838$ y $0.1081$ otra vez) y el modelo deja de ser invertible. Invirtiendo la otra raíz, o las
            dos, salen otros dos MA(2) con esa misma ACF: cuatro en total, y solo uno invertible. Es el que
            <code>arima()</code> devuelve por defecto: simulados 2000 valores con $\theta = (2.4,\ 0.8)$ y
            $\sigma^2 = 1$, el ajuste da $\hat\theta = (0.904,\ 0.230)$ y $\hat\sigma^2 = 4.035$, unas cuatro
            veces la varianza del ruido simulado, como ocurría en el MA(1) con $\theta = 2$.</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado" style="margin-bottom: 0.75rem;"><span class="ejercicio-numero">3.</span>El Módulo 9 ajustó un AR(2) a
          $\sqrt{\text{manchas}}$ sobre la ventana 1770–1869. Repite el ajuste sobre la serie completa
          (1700–1988) y sobre tres tramos que llegan al siglo XX: 1870–1988, 1900–1988 y 1889–1988. Entrega tres lecturas, por separado:</p>
        <ol style="list-style-type: lower-alpha; margin-top: 0.5rem; margin-bottom: 0;">
          <li>¿Son estables los coeficientes $\hat\phi_1$ y $\hat\phi_2$ de una ventana a otra?</li>
          <li>¿Lo es el pseudo-periodo?</li>
          <li>¿Sigue pasando el modelo Ljung–Box en el rezago 12? Si el veredicto cambia, ¿lo explica el número
            de datos de la ventana?</li>
        </ol>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e3-pista" hidden>
          <p style="margin:0;">Son tres cosas distintas —los coeficientes, una cantidad que se deriva de ellos
            y el diagnóstico— y cada una puede comportarse a su manera: anótalas en tres columnas, con una fila
            por ventana. Antes de atribuir un cambio de veredicto al tamaño de la muestra, compara ventanas con
            la misma cantidad de años.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e3-sol" hidden>
          <p><strong>Respuesta: los coeficientes son notablemente estables, el pseudo-periodo se acorta un año y el
              diagnóstico falla en la mayoría de las ventanas de cien años, incluidas todas las que llegan al siglo XX,
              tengan más datos que la de 1770–1869 o menos.</strong></p>
          <pre><code class="language-r">for (v in list(c(1770,1869), c(1700,1988), c(1870,1988), c(1900,1988), c(1889,1988))) {
  x &lt;- sqrt(window(sunspot.year, v[1], v[2]))
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  r &lt;- polyroot(c(1, -coef(f)[1:2]))
  cat(sprintf("%d-%d (n=%3d): phi=(%.4f, %.4f)  |raiz|=%.4f  periodo=%6.3f  LB12 p=%.4f\n",
      v[1], v[2], length(x), coef(f)[1], coef(f)[2], Mod(r)[1],
      2*pi/Arg(r[1]),
      Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value))
}
#&gt; 1770-1869 (n=100): phi=(1.4027, -0.6853)  |raiz|=1.2080  periodo=11.218  LB12 p=0.1644
#&gt; 1700-1988 (n=289): phi=(1.4086, -0.7006)  |raiz|=1.1947  periodo=11.007  LB12 p=0.0000
#&gt; 1870-1988 (n=119): phi=(1.4219, -0.7321)  |raiz|=1.1687  periodo=10.648  LB12 p=0.0007
#&gt; 1900-1988 (n= 89): phi=(1.4146, -0.7556)  |raiz|=1.1504  periodo=10.129  LB12 p=0.0010
#&gt; 1889-1988 (n=100): phi=(1.4101, -0.7431)  |raiz|=1.1600  periodo=10.249  LB12 p=0.0006</code></pre>
          <p><strong>Discusión.</strong> Hay tres lecturas y conviene separarlas:</p>
          <ul>
            <li><strong>Los coeficientes son estables.</strong> $\hat\phi_1$ se mueve entre $1.403$ y $1.422$ y
              $\hat\phi_2$ entre $-0.685$ y $-0.756$, siempre dentro de un error estándar o dos. El AR(2) captura una
              estructura real y persistente, no un artefacto de la ventana 1770–1869.</li>
            <li><strong>El pseudo-periodo sí se mueve:</strong> de $11.22$ años (1770–1869) a $10.13$ (1900–1988). Como
              depende de los $\phi$ a través de un arcocoseno, cambios pequeños en $\hat\phi_2$ se amplifican. Es un
              buen ejemplo de que una cantidad derivada puede ser mucho más sensible que los parámetros de los que
              procede. Sobre la serie completa da $11.007$, <span data-afirma="c3-m10-46">dentro del rango de duración que se da al ciclo de las manchas <cite class="cita" data-ref="hyndman2021forecasting" data-loc="§12.4"><a href="#ref-m10-hyndman2021forecasting" title="Hyndman, R. J., y Athanasopoulos, G. (2021). Forecasting: principles and practice (3.ª ed.). OTexts. https://otexts.com/fpp3/">(Hyndman y Athanasopoulos, 2021, §12.4)</a></cite></span>.</li>
            <li data-afirma="c3-m10-35"><strong>El diagnóstico se derrumba</strong> en todas las ventanas que llegan al siglo XX: $p = 0.0007$
              en 1870–1988, $p = 0.0010$ en 1900–1988 y por debajo de $0.0001$ en la serie completa. La explicación
              cómoda —con más datos la prueba gana potencia— <strong>aquí no se sostiene</strong>: 1900–1988 tiene
              <em>menos</em> datos que la ventana 1770–1869 ($n = 89$) y rechaza igual, y 1889–1988, con los mismos
              cien años, da $p = 0.0006$. Lo que cambia no es $n$ sino el tramo. De las 190 ventanas de cien años
              que caben entre 1700 y 1988, el AR(2) pasa la prueba en 52, y todas menos una empiezan entre 1734 y
              1785; falla en las otras 138, también en 49 que acaban antes de 1900. La de 1770–1869 es una de las favorables; en las que alcanzan el siglo XX el mismo modelo, con
              coeficientes casi iguales, deja autocorrelación sin explicar y no pasa en ninguna.</li>
          </ul>
          <p style="margin-bottom:0;">Moraleja: que un modelo «pase» el diagnóstico en una ventana no dice que lo
            pase en otra, y antes de atribuir un cambio de veredicto al tamaño de la muestra hay que comparar con
            $n$ fijo. No rechazar $H_0$ nunca es lo mismo que aceptarla.</p>
        </div>
      </div>

      <h3>Práctica de repaso · capítulo 2 y módulos 3.1–3.4</h3>

      <p>Diez preguntas para repasar por tu cuenta, sobre el <a

        primeros módulos de este: estacionariedad débil, caminata con deriva, ADF y KPSS, sobrediferenciación, operador
        de rezago, el triángulo del AR(2), el <code>intercept</code> de <code>arima()</code>, la invertibilidad del
        MA(1), los pesos $\psi$ y Yule–Walker. Se escribieron como preparación del Parcial 2, que ya se aplicó, y
        siguen sirviendo de repaso. No tienen nota ni se entregan. Los módulos 3.5 a 3.10 no entran aquí: para ellos
        están la autoevaluación y los ejercicios de más arriba.</p>

        también las incorrectas, y cita el módulo al que conviene volver: (2.6) es el módulo 6 del capítulo 2, y (3.2),
