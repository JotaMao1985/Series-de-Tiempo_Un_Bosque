      <h3>AIC, AICc y BIC</h3>

      <p>Añadir parámetros siempre mejora la verosimilitud. Los criterios de información compensan esa mejora con una
        penalización por complejidad, y se elige el modelo con el <strong>menor</strong> valor.</p>

      <div class="formula">
        $$\begin{aligned}
          \text{AIC} &= -2\log L + 2k \\[0.3em]
          \text{AICc} &= \text{AIC} + \frac{2k(k+1)}{T-k-1} \\[0.3em]
          \text{BIC} &= -2\log L + k\log T
        \end{aligned}$$
        <p style="margin-bottom:0;">donde $k$ es el número de parámetros estimados —incluido $\sigma^2$— y $T$ el
          número de observaciones.</p>
      </div>

      <div class="note">
        <p><strong>Cuál usar.</strong> El AICc corrige el sesgo del AIC en muestras pequeñas y converge a él cuando
          $T$ crece, así que <strong>no hay razón para preferir el AIC</strong>. El BIC penaliza más
          ($\log T > 2$ en cuanto $T > 7$) y por eso tiende a elegir modelos más pequeños. Si buscas pronosticar,
          AICc; si buscas identificar el modelo "verdadero", BIC.</p>
      </div>

      <div class="warning">
        <p><strong>La trampa que reaparecerá en el Capítulo 4.</strong> Los criterios solo son comparables entre
          modelos ajustados a <strong>los mismos datos</strong>. Diferenciar cambia los datos: un ARIMA con $d=1$ se
          ajusta sobre $T-1$ observaciones distintas de las del modelo con $d=0$. Comparar sus AIC no significa nada.
          Aquí todos los candidatos tienen $d=0$ sobre la misma serie, así que la comparación es lícita.</p>
      </div>

      <h3>Diagnóstico: los residuales deben ser ruido blanco</h3>

      <p>El criterio de información dice cuál de los candidatos es relativamente mejor, pero no si <em>alguno</em> es
        bueno. Para eso están los residuales $\hat\varepsilon_t$: si el modelo ha capturado toda la estructura, lo que
        queda no debe tener ninguna.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Prueba de Ljung–Box</h4>
        <p>Contrasta si las primeras $h$ autocorrelaciones de los residuales son <strong>conjuntamente</strong> nulas:</p>
        $$\begin{gathered}
          Q(h) = T(T+2)\sum_{k=1}^{h}\frac{\hat r_k^2}{T-k} \\[0.4em]
          Q(h) \;\sim\; \chi^2_{\,h-p-q} \quad\text{bajo } H_0
        \end{gathered}$$
        <p style="margin-bottom:0;">$H_0$ es "los residuales son ruido blanco". Un $p$-valor <strong>pequeño</strong>
          significa que <strong>queda estructura sin modelar</strong>: el modelo no basta.</p>
      </div>

      <p>Los grados de libertad son $h-p-q$ y no $h$ porque los residuales no son ruido blanco observado, sino lo que
        queda tras estimar $p+q$ parámetros, y esa estimación los deja menos correlacionados de lo que estarían por
        azar. Si no se descuentan, la prueba rechaza menos de lo que debería. En R el descuento es el argumento
        <code>fitdf = p + q</code> de <code>Box.test()</code>, que <strong>no</strong> se aplica solo, y solo tiene
        sentido evaluar en $h > p+q$. El efecto se mide en el código R de este módulo: con tres mil
        series que de verdad son AR(2), $T = 100$ y $h = 12$, la prueba al 5&nbsp;% rechaza el $4.9$&nbsp;% de las
        veces con <code>fitdf = 2</code> y solo el $2.6$&nbsp;% sin él.</p>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ljung-box">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver el desarrollo paso a paso</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ljung-box" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Si una serie es ruido blanco, cada autocorrelación muestral cumple aproximadamente
                $\hat r_k \sim N(0,\,1/T)$. Entonces $T\hat r_k^2$ es aproximadamente $\chi^2_1$, y sumando $h$
                rezagos aproximadamente independientes se obtiene el estadístico de Box–Pierce:</p>
              $$Q^{*}(h) = T\sum_{k=1}^{h}\hat r_k^2 \;\sim\; \chi^2_h$$
            </li>
            <li>
              <p>Esa aproximación es mala con $T$ moderado, porque la varianza real de $\hat r_k$ es algo menor que
                $1/T$, y tanto menor cuanto mayor es $k$ —el numerador de $\hat r_k$ suma solo $T-k$ productos, pero
                el denominador sigue sumando las $T$ observaciones, y eso encoge $\hat r_k$ hacia cero—:
                $\operatorname{Var}(\hat r_k) \approx (T-k)/\big(T(T+2)\big)$. Con el factor $T$, $Q^{*}$ sale
                pequeño y la prueba rechaza menos de lo que debería. Ljung y Box (1978) reemplazaron ese factor por
                el inverso de la varianza, que por eso <em>crece</em> con el rezago:</p>
              $$T \;\longrightarrow\; \frac{T(T+2)}{T-k}$$
            </li>
            <li>
              <p>Falta el ajuste clave. Los $\hat r_k$ no se calculan sobre ruido blanco observado, sino sobre
                <strong>residuales de un modelo estimado</strong>. Al estimar $p+q$ parámetros se han impuesto $p+q$
                restricciones que fuerzan a los residuales a estar menos correlacionados de lo que estarían por azar.</p>
            </li>
            <li>
              <p>Ignorarlo infla el $p$-valor y hace que la prueba <strong>no rechace cuando debería</strong>. La
                corrección consiste en descontar esos parámetros de los grados de libertad:</p>
              $$Q(h) \sim \chi^2_{\,h-p-q}$$
              <p>En R eso es el argumento <code>fitdf = p + q</code> de <code>Box.test()</code>, que
                <strong>no</strong> se aplica solo. Solo tiene sentido evaluar en $h > p+q$.</p>
              <p>Sin el descuento la prueba rechaza cerca de la mitad de lo que debería: es el Monte Carlo del
                párrafo anterior a este desarrollo.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">Regla práctica: sobre los residuales de un ARMA($p,q$) hay que llamar a
            <code>Box.test(residuals(ajuste), lag = h, type = "Ljung-Box", fitdf = p + q)</code>. Si omites
            <code>fitdf</code>, la prueba es demasiado indulgente y aprobará modelos insuficientes.</p>
        </div>
      </div>

      </div>

      <p>La tentación es aceptar el ARMA(2,1) y seguir. Pero antes de añadir un parámetro para tapar un problema,

      <div class="code-tabs">

          <pre><code class="language-r">manchas &lt;- window(sunspot.year, start = 1770, end = 1869)
n &lt;- length(manchas)

# arima() reporta AIC pero NO AICc: hay que calcularlo
aicc &lt;- function(ajuste, n) {
  k &lt;- length(ajuste$coef) + 1        # +1 por sigma^2
  ajuste$aic + 2 * k * (k + 1) / (n - k - 1)
}

# La rejilla no es un producto cartesiano: son ordenes bajos en las dos partes
# mas dos AR largos. Es una eleccion de este capitulo, no un resultado de la
# lectura de los correlogramas, y son los once candidatos de la tabla ordenable
# de arriba.

                c(0,1), c(0,2), c(0,3),
                c(1,1), c(2,1), c(1,2), c(2,2))

    AICc = round(aicc(aj, n), 2),
    BIC  = round(BIC(aj), 2),

    LB12 = round(Box.test(residuals(aj), lag = 12,
                          type = "Ljung-Box", fitdf = p + q)$p.value, 4)
  )
}))
resultado[order(resultado$AICc), ]

          <pre><code class="language-python">import numpy as np
import pandas as pd
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox

datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values

# La misma lista de once candidatos que en R, no un producto cartesiano.
rejilla = [(1,0), (2,0), (3,0), (4,0),
           (0,1), (0,2), (0,3),
           (1,1), (2,1), (1,2), (2,2)]

filas = []
for p, q in rejilla:
    res = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    # model_df descuenta los parametros estimados, igual que fitdf en R
    lb = acorr_ljungbox(res.resid, lags=[12], model_df=p + q)
    filas.append({"modelo": f"ARMA({p},{q})", "AICc": round(res.aicc, 2),
                  "BIC": round(res.bic, 2),
                  "LB12": round(float(lb["lb_pvalue"].iloc[0]), 4)})

print(pd.DataFrame(filas).sort_values("AICc").to_string(index=False))

# ARMA(4,0) 836.78 851.51 0.1677
# ARMA(2,0) 838.30 848.30 0.1085   <- en R da 0.0461
# AICc y BIC coinciden con R hasta el ultimo decimal. Los p-valores de
# Ljung-Box NO: ver la advertencia de abajo.

# Reconciliacion: descartando los max(p,q) primeros residuales, los dos

for p, q in [(2, 0), (2, 1), (2, 2)]:
    r = ARIMA(manchas, order=(p, 0, q), trend="c").fit()
    corte = max(p, q)
    lb = acorr_ljungbox(r.resid[corte:], lags=[12], model_df=p + q)
    print(f"ARMA({p},{q}) recortado: {float(lb['lb_pvalue'].iloc[0]):.4f}")

      <h3>Caso 1 · Manchas solares: el parámetro que sobraba</h3>

      <p>Nos quedamos con un AR(2) que no pasaba Ljung–Box y un ARMA(2,1) que ganaba por AICc. Antes de aceptar el
        parámetro extra, volvamos al Capítulo 2: <strong>¿la serie está en la escala adecuada?</strong></p>

      <p>Los números de manchas solares son <strong>conteos</strong>. Es de esperar que su variabilidad crezca con el
        nivel: en un máximo solar hay más manchas y también fluctúan más. Eso se comprueba, no se supone. Una forma de
        medirlo es la <strong>elasticidad amplitud–nivel</strong>: se parte la serie en bloques consecutivos, se
        calcula la media (el nivel) y la desviación estándar (la amplitud) de cada uno, y se ajusta una recta a
        $\log(\text{desviación})$ contra $\log(\text{media})$. Su pendiente $\hat b$ dice cuánto crece la amplitud cuando
        crece el nivel: con $b = 0$ no depende de él y no hay nada que corregir; con $b = 1$ crece en proporción, y el
        remedio es el logaritmo; con $b = 0.5$, la raíz cuadrada. En general la potencia que estabiliza es
        $\lambda = 1 - b$, la escala de Box–Cox del Capítulo 2, cuyo criterio de Guerrero busca justamente que
        $s_i/\bar y_i^{\,1-\lambda}$ sea homogéneo entre bloques. Es la pregunta del gráfico de amplitud frente a nivel
        del Capítulo 1, con un número en lugar de una nube de puntos. Con tres tamaños de bloque (la función que los
        calcula está en el código del caso, al final de su sección):</p>

        <p><strong>Qué dicen y qué no dicen estos números.</strong> Los tres intervalos excluyen $b=0$ con holgura:

          $b=0.5$ (raíz cuadrada) y $b=1$ (logaritmo) las tres particiones se contradicen: con bloques de 10 años
          el intervalo contiene el $1$ y deja fuera el $0.5$; con bloques de 5, al revés; con bloques de 11, deja
          fuera los dos por muy poco. Los datos piden una transformación y no dicen exactamente cuál.</p>
      </div>

      <p>Lo que decide es otra cosa, y es contundente: <strong>la serie tiene un año con cero manchas</strong> (1810;
        en la serie completa 1700–1988 hay tres). El logaritmo de cero no existe. La raíz cuadrada, en cambio, está
        definida en cero y es la transformación estabilizadora clásica para conteos. Además, el $\lambda$ de Guerrero
        del Capítulo 2 sobre esta serie —desplazada una unidad, porque el criterio exige datos estrictamente positivos
        y está ese cero— da $0.3062$, que cae <strong>entre</strong> el logaritmo y la raíz cuadrada.</p>

        <p>Sobre la raíz cuadrada, el <strong>AR(2) es a la vez el mejor por AICc y el mejor por BIC</strong>
          ($324.00$ y $334.00$, ambos mínimos de la rejilla) y sus residuales pasan Ljung–Box ($p = 0.1644$). El
          término MA que el AICc pedía sobre la serie cruda <strong>ya no aporta nada</strong>.</p>
        <p style="margin-bottom:0;">Es decir: aquel $\hat\theta_1 = 0.3732$ no estaba capturando dinámica que faltara,
          estaba <strong>parcheando un problema de escala</strong>. Añadir parámetros puede disimular un
          preprocesamiento incorrecto, y el criterio de información no distingue una cosa de la otra.</p>
      </div>

      <p>El modelo final es, entonces:</p>

      <div class="formula">
        $$\begin{aligned}
          &\sqrt{y_t} - 6.33 \\
          &\quad = 1.4027\,(\sqrt{y_{t-1}} - 6.33) \\
          &\qquad - 0.6853\,(\sqrt{y_{t-2}} - 6.33) + \varepsilon_t
        \end{aligned}$$
        <p style="margin-bottom:0;">con errores estándar $0.0727$ y $0.0724$; raíces complejas de módulo $1.208$.</p>
      </div>

      <p>Y la recompensa está en el pseudo-periodo. Sobre la serie cruda daba $10.74$ años; sobre la raíz cuadrada da
        <strong>$11.22$ años</strong>. El ciclo solar documentado por los astrónomos es de aproximadamente
        <strong>11 años</strong>. Corregir la escala no solo arregló el diagnóstico: acercó la estimación al valor
        físico.</p>

      <div class="note">
        <p><strong>¿Y si el $0.5$ fuera arbitrario?</strong> Con el $\lambda = 0.3062$ de Guerrero en vez de la raíz
          cuadrada, el AR(2) da un pseudo-periodo de $11.39$ años y un Ljung–Box de $p = 0.4892$. Conviene notar dónde
          se aplica cada cosa: ese $\lambda$ se <strong>estima</strong> sobre <code>manchas + 1</code>, porque Guerrero
          exige datos estrictamente positivos y la serie tiene un cero, pero se <strong>aplica</strong> sobre la serie
          original, <code>manchas^0.3062</code>. Sobre la desplazada saldría $11.28$ y $p = 0.2216$: la misma lectura.
          La conclusión <strong>no depende</strong> de haber elegido exactamente $0.5$: cualquier transformación de
          potencia moderada hace el mismo trabajo. Eso es señal de que el hallazgo es robusto y no un artefacto.</p>
      </div>

      <h3>El AR(2) final, escrito con los polinomios del Módulo 1</h3>

      <p>Esa ecuación está escrita como recursión, que es la forma en que se estima. Escrita con el operador de
        rezago es la forma en que se <em>interroga</em>, y de paso contesta a casi todo lo que el capítulo lleva
        preguntado desde la primera página:</p>

      <div class="formula">
        $$\hat\phi(B)\,\big(\sqrt{y_t} - 6.3317\big) = \hat\theta(B)\,\varepsilon_t$$
        $$\begin{aligned}
          \hat\phi(B) &= 1 - 1.4027\,B + 0.6853\,B^2 \\
          \hat\theta(B) &= 1
        \end{aligned}$$
      </div>

      <div class="warning">
        <p><strong>El signo del segundo coeficiente.</strong> El ajuste devuelve $\hat\phi_2 = -0.6853$ y el
          polinomio lleva $+0.6853\,B^2$. No es una errata: el convenio del Módulo 1 es
          $\phi(B) = 1 - \phi_1 B - \phi_2 B^2$, así que los $\phi$ entran restando y un coeficiente negativo
          aparece sumando. Escribir $1 - 1.4027\,B - 0.6853\,B^2$ no produce ningún aviso: produce <strong>otro
          proceso</strong>, cuyas raíces son $0.5598$ y $-2.6066$. La primera cae <em>dentro</em> del círculo
          unitario, de modo que ese otro proceso ni siquiera es estacionario. Es la misma clase de fallo silencioso
          que el orden de los coeficientes en <code>polyroot()</code>.</p>
      </div>

      <p>Con el polinomio delante, la pregunta del Módulo 1 se contesta sola. Las raíces de $\hat\phi(B) = 0$ son
        complejas conjugadas:</p>

      <div class="formula">
        $$\begin{aligned}
          B_{1,2} &= 1.0234 \pm 0.6418\,i \\
          |B_{1,2}| &= 1.2080 > 1
        \end{aligned}$$
      </div>

      <p>El módulo mayor que uno es el veredicto de estacionariedad. Pero una raíz compleja trae <em>dos</em>
        números, y el segundo no se ha usado todavía: su argumento, $\omega = 0.5601$ radianes. Y resulta que</p>

      <div class="formula">
        $$\frac{2\pi}{\omega} = \frac{2\pi}{0.5601} = 11.22\ \text{años}$$
      </div>

      <p>Es decir: el $11.22$ que hace un momento se leía como «el ciclo solar» <strong>es el ángulo de la raíz del
        polinomio</strong>, y no un número que salga de una fórmula aparte. La expresión del Módulo 2,
        $2\pi/\arccos\!\big(\phi_1/(2\sqrt{-\phi_2})\big)$, es esta misma cuenta escrita sin números complejos. El
        módulo dice <em>cuánto se amortigua</em> la oscilación; el ángulo, <em>cada cuánto</em> oscila.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Otra fórmula para «el pseudo-periodo».</strong> El texto de Hyndman y Athanasopoulos (FPP3, sección 9.5) da para el
          AR(2) con raíces complejas el <em>periodo medio de los ciclos</em>,
          $2\pi/\arccos\!\big(-\phi_1(1-\phi_2)/(4\phi_2)\big)$, que con estos coeficientes vale $11.84$ años y no
          $11.22$. Ninguna de las dos cifras está mal: miden cosas distintas. El $11.22$ es el pseudo-periodo con que
          oscilan la ACF y los pesos $\psi$ del modelo, el ángulo de la raíz; el $11.84$ coincide con el periodo
          en que es máxima la densidad espectral del proceso —el reparto de su varianza por frecuencias, que este
          curso no desarrolla—. Las dos se juntan cuando el módulo de la raíz se acerca a $1$. Este capítulo usa
          siempre la primera.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>La invertibilidad, que aquí sale gratis</h4>
        <p>$\hat\theta(B) = 1$ es un polinomio constante: no tiene raíces, de manera que la condición del Módulo 3
          se cumple sin nada que comprobar. <strong>Todo AR puro es invertible</strong>, y la consecuencia es la del
          Módulo 4: la representación AR($\infty$) de este modelo es <em>finita</em>.</p>
        <p style="margin-bottom:0;">$$\begin{aligned}
            \pi_0 &= 1 \\
            \pi_1 &= -1.4027 \\
            \pi_2 &= 0.6853 \\
            \pi_j &= 0 \quad \text{para } j \ge 3
          \end{aligned}$$</p>
      </div>

      <p>Que los $\pi$ se acaben en el rezago 2 no es una curiosidad de notación. El pronóstico a un paso del
        Módulo 4 es $\hat y_{t\mid t-1} = -\sum_{j \ge 1}\pi_j\,y_{t-j}$, una suma infinita que en un MA o en un
        ARMA hay que truncar; aquí se reduce a la propia ecuación del modelo y le bastan dos años de historia.</p>

      <div class="note">
        <p><strong>¿Y el ARMA(2,1) que sobraba? Estaba impecable.</strong> Conviene comprobarlo, porque la
          tentación es suponer que un parámetro que sobra tiene que delatarse en algo. Su
          $\hat\theta(B) = 1 + 0.3732\,B$ tiene raíz $-2.6795$, de módulo $2.68 > 1$: <strong>invertible</strong>.
          Sus raíces AR son $1.0920 \pm 0.7661\,i$, de módulo $1.3339$, y no se parecen en nada a $-2.68$, así que
          tampoco hay rastro de la <strong>redundancia de parámetros</strong> del Módulo 5: no hay factor común que
          cancelar. El modelo estaba bien construido y bien estimado. Ni la invertibilidad ni el factor común lo
          habrían descartado, y por eso hizo falta volver a la escala.</p>
      </div>

      <h3>Los pesos $\psi$: qué deja un choque solar</h3>

      <p>Con los dos polinomios escritos ya se puede recorrer el Módulo 4 sobre el modelo ajustado. La recursión
        $\psi_j = \theta_j + \sum_i \phi_i\,\psi_{j-i}$, con todos los $\theta_j$ nulos, queda</p>

      <div class="formula">
        $$\begin{aligned}
          \psi_j &= 1.4027\,\psi_{j-1} - 0.6853\,\psi_{j-2} \\
          \psi_0 &= 1
        \end{aligned}$$
      </div>

      <p>y en un AR(2) con raíces complejas tiene forma cerrada, que es donde se ve de dónde sale cada pieza:</p>

      <div class="formula">
        $$\psi_j = R^{\,j}\,\frac{\sin\big((j+1)\,\omega\big)}{\sin\omega}$$
        $$\begin{aligned}
          R &= \sqrt{-\hat\phi_2} = \frac{1}{|B_{1,2}|} = 0.8278 \\[0.3em]
          \omega &= 0.5601
        \end{aligned}$$
      </div>

      <p>Las dos piezas de la raíz reaparecen, ahora haciendo cosas distintas: el módulo manda en la amplitud —el
        envolvente $\pm R^{\,j}/\sin\omega = \pm 1.882 \times 0.8278^{\,j}$ se reduce a la mitad cada $3.67$ años—
        y el ángulo, en la oscilación. Los $\psi$ están en la escala en que se ajustó el modelo: un choque de una
        unidad en $\sqrt{\text{manchas}}$ deja $1.40$ unidades de exceso al año siguiente, todavía $0.84$ tres años
        después, y al quinto <strong>ha cambiado de signo</strong>. Los $\psi$ se anulan cuando $(j+1)\,\omega$ es
        múltiplo de $\pi$, es decir en $j + 1 = 5.61$ y $j + 1 = 11.22$: medio ciclo y un ciclo de los $11.22$
        años. La respuesta
        al impulso late con el mismo periodo que la serie, y eso es lo que significa «pseudo-periodo»: no hay una
        periodicidad impuesta desde fuera, hay choques que se propagan oscilando y apagándose.</p>

      <p>Y aquí los $\psi$ dejan de ser álgebra. La varianza del error de pronóstico del Módulo 4, con
        $\hat\sigma^2 = 1.3410$, se obtiene sumando sus cuadrados:</p>

      <div class="formula">
        $$\operatorname{Var}(e_{T+h}) = \hat\sigma^2\sum_{j=0}^{h-1}\psi_j^2$$
      </div>

      <p>Cada fila lleva el peso $\psi_j$ y, a su derecha, lo que se acumula hasta él: la fila de $j = 5$ es el
        horizonte $h = 6$, porque el horizonte $h$ suma los $h$ pesos $\psi_0, \ldots, \psi_{h-1}$.</p>

          asimetría baja de $0.791$ a $0.573$ y el $p$-valor de Shapiro–Wilk sube de $0.0007$ a $0.0470$, que sigue
          rechazando al 5 %. El número de manchas solares sube más rápido de lo que baja, y esa asimetría es una
          <strong>no linealidad</strong> que ningún modelo lineal ARMA puede capturar. Los intervalos de pronóstico del
          Capítulo 6, que suponen normalidad, quedarán algo mal calibrados. Decirlo es parte del trabajo.</p>
      </div>

      <h3>El código del caso 1</h3>

      <p>Las cifras del caso salen de este bloque, en el orden en que aparecen, incluidas las de la serie cruda que el
        caso añade (el ARMA(2,1), la asimetría y Shapiro–Wilk); las demás de la serie cruda, de los bloques de los
        Módulos 7 y 8.</p>

# bloques consecutivos de k anios (los que sobran al final se descartan)
elasticidad &lt;- function(x, k) {
  g &lt;- rep(seq_len(length(x) %/% k), each = k)
  x &lt;- as.numeric(x)[seq_along(g)]
  niv &lt;- tapply(x, g, mean); amp &lt;- tapply(x, g, sd)
  aj &lt;- lm(log(amp) ~ log(niv))
  c(b = coef(aj)[[2]], confint(aj)[2, ], R2 = summary(aj)$r.squared)
}
res &lt;- t(sapply(c(10, 11, 5), function(k) elasticidad(manchas, k)))
rownames(res) &lt;- paste(c(10, 11, 5), "anios")
round(res, 3)
#&gt;              b 2.5 % 97.5 %    R2
#&gt; 10 anios 0.816 0.593  1.040 0.899
#&gt; 11 anios 0.766 0.533  0.998 0.897
#&gt; 5 anios  0.703 0.475  0.931 0.700

min(manchas)          # el logaritmo NO es una opcion
#&gt; [1] 0
sum(manchas == 0)

sum(sunspot.year == 0)   # en la serie completa, 1700-1988

library(forecast)

round(BoxCox.lambda(manchas + 1, method = "guerrero"), 4)

banda &lt;- 1.96 / sqrt(length(manchas))
fuera &lt;- function(x) {
  p &lt;- pacf(x, lag.max = 20, plot = FALSE)$acf[, 1, 1]

# La misma rejilla del Modulo 8 (los once candidatos), ahora sobre la raiz cuadrada
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }

compara &lt;- function(x) do.call(rbind, lapply(rejilla, function(pq) {
  aj &lt;- arima(x, order = c(pq[1], 0, pq[2]), method = "ML")
  data.frame(modelo = sprintf("ARMA(%d,%d)", pq[1], pq[2]),
             AICc = round(aicc(aj, length(x)), 2), BIC = round(BIC(aj), 2),
             LB12 = round(Box.test(residuals(aj), lag = 12, type = "Ljung-Box",

sq &lt;- compara(sqrt(manchas))
sq[order(sq$AICc), ][1:4, ]          # las cuatro filas de la tabla, ordenadas por AICc
#&gt;       modelo   AICc    BIC   LB12
#&gt; 2  ARMA(2,0) 324.00 334.00 0.1644
#&gt; 3  ARMA(3,0) 325.35 337.74 0.2005
#&gt; 9  ARMA(2,1) 325.41 337.80 0.1856

c(AICc = sq$modelo[which.min(sq$AICc)], BIC = sq$modelo[which.min(sq$BIC)])
#&gt;        AICc         BIC
#&gt; "ARMA(2,0)" "ARMA(2,0)"       &lt;- el AR(2) gana por los dos criterios

ar2s &lt;- arima(sqrt(manchas), order = c(2, 0, 0), method = "ML")
round(coef(ar2s), 4)

round(sqrt(diag(ar2s$var.coef))[1:2], 4)    # errores estandar de phi_1 y phi_2

#&gt; 0.0727 0.0724
round(coef(ar2s)[1:2] / sqrt(diag(ar2s$var.coef))[1:2], 2)   # estadisticos t

round(ar2s$sigma2, 4)

round(2 * pi / Arg(polyroot(c(1, -phi))[1]), 4)
#&gt; [1] 11.2178            anios; el ciclo solar documentado es ~11

# Cambiar la raiz por la potencia de Guerrero (lambda = 0.3062): la lectura no cambia
ajusta &lt;- function(x) {
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  c(periodo = 2 * pi / Arg(polyroot(c(1, -coef(f)[1:2]))[1]),

}

#&gt; guerrero            11.3883 0.4892

round(raices, 4)

round(c(modulo = Mod(raices)[1], angulo = Arg(raices)[1]), 4)

# Con el signo de phi_2 sin cambiar, el polinomio es OTRO proceso: 1 - 1.4027 B - 0.6853 B^2

#&gt; [1] 1.092+0.7661i 1.092-0.7661i
round(Mod(raices21), 4)
#&gt; [1] 1.3339 1.3339

psi &lt;- c(1, ARMAtoMA(ar = phi, ma = numeric(0), lag.max = 11))

#&gt;  [1]  1.0000  1.4027  1.2822  0.8372  0.2957 -0.1590 -0.4257 -0.4881 -0.3929
#&gt; [10] -0.2167 -0.0346  0.0999      cambian de signo entre el 4 y el 5

#&gt;      R factor  mitad  ceros
#&gt; 0.8278 1.8823 3.6684 5.6089

#&gt; [1] 2.2697 3.9098 4.8739 5.2312 5.2741 5.2864

round(inf, 3)

#&gt;  cruda   raiz
#&gt;  0.791  0.573
round(c(cruda = shapiro.test(residuals(ml))$p.value,
        raiz  = shapiro.test(residuals(ar2s))$p.value), 4)

          <pre><code class="language-python">import numpy as np
import statsmodels.api as sm
from statsmodels.tsa.arima.model import ARIMA
from statsmodels.stats.diagnostic import acorr_ljungbox
from statsmodels.tsa.stattools import pacf
from statsmodels.tsa.arima_process import arma2ma

## ---- Caso 1: manchas solares en raiz cuadrada -------------------------
datos = sm.datasets.sunspots.load_pandas().data
manchas = datos.loc[(datos.YEAR &gt;= 1770) &amp; (datos.YEAR &lt;= 1869), "SUNACTIVITY"].values

# Elasticidad amplitud-nivel: pendiente de log(desviacion) contra log(media) en
# bloques consecutivos de k anios (los que sobran al final se descartan)
def elasticidad(x, k):
    n = len(x) // k
    bloques = x[:n * k].reshape(n, k)
    niv, amp = bloques.mean(axis=1), bloques.std(axis=1, ddof=1)
    aj = sm.OLS(np.log(amp), sm.add_constant(np.log(niv))).fit()
    lo, hi = aj.conf_int()[1]
    return [aj.params[1], lo, hi, aj.rsquared]

print(np.round([elasticidad(manchas, k) for k in (10, 11, 5)], 3))
# [[0.816 0.593 1.04  0.899]
#  [0.766 0.533 0.998 0.897]
#  [0.703 0.475 0.931 0.7  ]]     filas: bloques de 10, 11 y 5 anios; columnas: b, IC 95 %, R2

print(manchas.min(), (manchas == 0).sum())   # 0.0  1   -&gt; log imposible
print((datos.loc[datos.YEAR &lt;= 1988, "SUNACTIVITY"] == 0).sum())   # 3 en 1700-1988

# La PACF en las dos escalas: que rezagos salen de la banda +-0.196
banda = 1.96 / np.sqrt(len(manchas))
def fuera(x):
    p = pacf(x, nlags=20, method="ywm")[1:]
    return {int(k + 1): round(float(p[k]), 3) for k in np.where(np.abs(p) &gt; banda)[0]}
print(fuera(manchas))             # {1: 0.806, 2: -0.634}
print(fuera(np.sqrt(manchas)))    # {1: 0.818, 2: -0.617, 6: 0.2, 9: 0.198, 16: -0.199}

ar2s = ARIMA(np.sqrt(manchas), order=(2, 0, 0), trend="c").fit()
print(np.round(ar2s.arparams, 4))            # [ 1.4027 -0.6853]

lb = acorr_ljungbox(ar2s.resid, lags=[12], model_df=2)
print(round(float(lb["lb_pvalue"].iloc[0]), 4))   # 0.178
# R daba 0.1644: devuelve estandarizados los dos primeros residuales, y
# statsmodels no (Modulo 8). Descartando esos dos, los dos programas dan 0.1682.

phi = ar2s.arparams
raices = np.roots(np.r_[1, -phi][::-1])
print(round(2 * np.pi / np.angle(raices[0]), 4))  # 11.218 (en R, 11.2178)

print(np.round(ar2s.polynomial_ar, 4))       # [ 1.     -1.4027  0.6853]
print(round(abs(raices[0]), 4), round(float(np.angle(raices[0])), 4))
# 1.208 0.5601        modulo y angulo: estacionariedad y pseudo-periodo

# arma2ma es la misma recursion del Modulo 4, pero pide los coeficientes
# del POLINOMIO: el AR va negado, igual que en ArmaProcess (Modulo 1).
psi = arma2ma(np.r_[1, -phi], np.r_[1], lags=12)
print(np.round(psi, 4))
# [ 1.      1.4027  1.2822  0.8372  0.2957 -0.159  -0.4256 -0.4881 -0.3929
#  -0.2167 -0.0346  0.0999]
# El septimo peso sale -0.4256 y en R -0.4257: los dos optimizadores no dan
# exactamente el mismo phi. Es diferencia de estimacion, no de formula.

s2 = ar2s.params[-1]                  # ['const', 'ar.L1', 'ar.L2', 'sigma2']
ee = np.sqrt(s2 * np.cumsum(psi**2))
print(np.round(1.959964 * ee[:6], 4))
# [2.2697 3.9098 4.8739 5.2312 5.2741 5.2864]
ci = np.asarray(ar2s.get_forecast(6).conf_int(alpha=0.05))
print(np.round((ci[:, 1] - ci[:, 0]) / 2, 4))
# [2.2697 3.9098 4.8739 5.2312 5.2741 5.2864]   &lt;- lo mismo

# La rejilla sobre la raiz, las variantes de lambda y la normalidad de los residuales
# se calculan en la pestana R: statsmodels devuelve sin estandarizar los dos primeros
# residuales (Modulo 8) y la asimetria y el Shapiro-Wilk saldrian distintos.</code></pre>

      <h3>El capítulo entero, sobre una sola serie</h3>

      <p>Conviene mirar atrás y contar cuánto del capítulo ha hecho falta para cerrar cien observaciones anuales:</p>

      <table style="position:relative;">
        <caption class="sr-only">Qué aportó cada módulo del capítulo al caso de las manchas solares</caption>
        <thead>
          <tr><th scope="col">Módulo</th><th scope="col">Qué puso en este caso</th></tr>
        </thead>
        <tbody>
          <tr><td>3.1 · Operador de rezago</td>
            <td>El modelo escrito como $\hat\phi(B)(\sqrt{y_t}-6.33) = \varepsilon_t$, y las raíces
              $1.0234 \pm 0.6418\,i$, de módulo $1.208$, que lo declaran estacionario.</td></tr>
          <tr><td>3.2 · Procesos AR</td>
            <td>La PACF que se corta en el rezago 2 y propone el orden; el ángulo de las raíces complejas, que da
              los $11.22$ años.</td></tr>
          <tr><td>3.3 · Procesos MA</td>
            <td>La invertibilidad: trivial en el AR(2) final, comprobada en el ARMA(2,1) de la serie cruda —que la
              cumplía—.</td></tr>
          <tr><td>3.4 · Dualidad AR ↔ MA</td>
            <td>Los $\pi$, que aquí se acaban en dos términos, y los $\psi$, que producen las bandas del pronóstico
              y su techo.</td></tr>
          <tr><td>3.5 · ARMA e identificación</td>
            <td>La tabla para leer los correlogramas, y la comprobación de que entre $\hat\phi(B)$ y $\hat\theta(B)$
              no había factor común que cancelar.</td></tr>
          <tr><td>3.6 · Simular y reconocer</td>
            <td>El único que no entra en ninguna cuenta, y hace falta igual: enseñó cuánto se aleja de la teoría una
              muestra finita (allí, de $200$ datos), que es la prudencia con la que hay que leer esa PACF.</td></tr>
          <tr><td>3.7 · Estimación</td>
            <td>Los $\hat\phi$ por máxima verosimilitud, con errores estándar $0.0727$ y $0.0724$.</td></tr>
          <tr><td>3.8 · Criterios y diagnóstico</td>
            <td>La rejilla ordenada por AICc y BIC, y el Ljung–Box que primero rechazó y después pasó.</td></tr>
        </tbody>
      </table>

      <p>Y falta una novena pieza, que no es de ningún módulo: el <strong>orden</strong> en que se usan, y la
        disposición a volver atrás. El AICc premiaba un parámetro que solo estaba tapando una escala equivocada, y
        ningún criterio de este capítulo lo dice. Lo dijeron un diagnóstico que fallaba y una pregunta del
        Capítulo 1 —¿crece la variabilidad con el nivel?— hecha cuando el modelo ya parecía terminado.</p>

      <h3>Caso 2 · Log-retornos de la TRM: cuando no hay nada que modelar</h3>

      <p>Retomemos la TRM del Capítulo 2. Allí quedó establecido que tiene una raíz unitaria y que su primera
        diferencia es estacionaria. Trabajemos con los <strong>log-retornos</strong>
        $r_t = 100 \times \log(y_t/y_{t-1})$, que es la variación porcentual mensual y la magnitud habitual en
        finanzas ($T = 137$).</p>

      </div>

      <p>Ljung–Box sobre la serie da $p = 0.0931$ en el rezago 6, $p = 0.0601$ en el 12 y $p = 0.0599$ en el 20: no se
        rechaza en ninguno, aunque el $0.06$ es lo bastante bajo como para no cantar victoria. La búsqueda
        automática tampoco encuentra nada firme: <code>auto.arima()</code>, del paquete <code>forecast</code>, ajusta
        por sí sola varios modelos ARIMA y se queda con el de menor AICc (el Capítulo 4 detalla cómo busca). Con sus
        argumentos por defecto devuelve un ARIMA(0,0,0) con media cero, es decir, ruido blanco. Solo con la búsqueda exhaustiva
        (<code>stepwise = FALSE</code>; <code>approximation = FALSE</code> no cambia nada aquí, porque con 137 datos ya
        es su valor por defecto), que prueba modelos a los que la búsqueda por pasos no llega, devuelve un MA(1),
        también sin media:</p>

      <div class="formula">
        $$\hat\theta_1 = 0.1326 \;\; (\text{e.e. } 0.0905,\; t = 1.47)$$
        <p style="margin-bottom:0;">Ese MA(1) y el ruido blanco puro, los dos sin media, dan un AICc
          de $722.653$ frente a $722.663$: una diferencia de <strong>una centésima</strong>. Son indistinguibles.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-lightbulb mr-2" aria-hidden="true"></i>La conclusión honesta</h4>
        <p style="margin-bottom:0;">Los log-retornos mensuales de la TRM son, a efectos prácticos,
          <strong>ruido blanco</strong>. El mejor modelo ARMA para esta serie es el modelo sin parámetros, y el mejor
          pronóstico de la variación del mes que viene es la media histórica. No es un fracaso del análisis: es su
          resultado.</p>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>De qué serie se dice.</strong> Esta TRM mensual es el
          <em>promedio</em> de los valores diarios de cada mes, y promediar deja huella. Si la tasa diaria fuera una
          caminata aleatoria pura, las variaciones del promedio mensual no serían ruido blanco: tendrían
          $\rho_1 \approx 0.25$ ($0.249$ con 21 días por mes). El $r_1$ observado es $0.105$, a $1.7$ errores
          estándar por debajo de esa cifra. El «ruido blanco» de arriba describe, entonces, las variaciones del
          promedio mensual, que es la serie que aquí se modela; no dice que la tasa diaria sea una caminata
          aleatoria, ni lo contrario. Para eso habría que trabajar con la tasa de un día fijo de cada mes o con
          los datos diarios.</p>
      </div>

      <div class="warning">
        <p><strong>Ojo con la media.</strong> Los dos modelos que devuelve <code>auto.arima()</code> van
          <strong>sin</strong> término constante. No es un capricho: en el MA(1) con media, la media mensual estimada
          es $0.2681\ \%$ con un error estándar de $0.3195$, o sea $t = 0.84$. Con 137 meses no hay evidencia de que
          la TRM tenga una deriva distinta de cero, y el AICc lo recoge: el ruido blanco con media da $723.804$ y
          sin ella $722.663$. Esa comparación es legítima —con media o sin ella, los dos modelos se ajustan a los
          mismos datos y el criterio solo cobra el parámetro de más—, y es la que hace <code>auto.arima()</code>
          para decidir si la incluye. Lo que el AICc no puede comparar son modelos ajustados a datos distintos:
          otro orden de diferenciación u otra transformación.</p>
      </div>

      <div class="note">
        <p><strong>¿Y en el cuadrado? Aquí tampoco.</strong> Ljung–Box sobre $r_t$ da $p = 0.0601$, y sobre
          $r_t^2$ da $p = 0.9166$: en esta serie mensual tampoco hay agrupamiento de volatilidad detectable. En datos
          diarios de la misma tasa el resultado suele ser el opuesto —el nivel es ruido blanco y el cuadrado no— y esa
          es la puerta de entrada a los modelos ARCH y GARCH. La frecuencia de muestreo cambia el fenómeno que se ve.</p>
      </div>

library(forecast)
aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }   # la de arriba

# trm: la serie mensual del Capitulo 2, el promedio de los valores diarios
# de cada mes entre enero de 2015 y junio de 2026. Copia fija de los 138
# meses con que se calcularon estas cifras: se lee de la carpeta de trabajo
# si el archivo ya esta ahi; si no, de la pagina del curso.

if (!file.exists(archivo))
  archivo &lt;- paste0("https://jotamao1985.github.io/Series-de-Tiempo_Un_Bosque/datos/", archivo)
trm &lt;- ts(read.csv(archivo)$trm, start = c(2015, 1), frequency = 12)

ret &lt;- diff(log(trm)) * 100
length(ret)
#&gt; [1] 137

round(1.96 / sqrt(length(ret)), 4)      # banda
#&gt; [1] 0.1675
round(acf(ret, lag.max = 6, plot = FALSE)$acf[-1], 3)
#&gt; [1]  0.105 -0.077 -0.078  0.006  0.193  0.123

# Los rezagos que se salen de la banda, entre los 20 primeros
a &lt;- acf(ret, lag.max = 20, plot = FALSE)$acf[-1]
round(setNames(a, 1:20)[abs(a) &gt; 1.96 / sqrt(length(ret))], 3)
#&gt;      5      8
#&gt;  0.193 -0.198

sapply(c(6, 12, 20), function(h)
  round(Box.test(ret, lag = h, type = "Ljung-Box")$p.value, 4))
#&gt; [1] 0.0931 0.0601 0.0599

# auto.arima(): por defecto devuelve ruido blanco; con la busqueda
# exhaustiva, un MA(1). Ninguno de los dos lleva media.
arimaorder(auto.arima(ret))
#&gt; p d q
#&gt; 0 0 0
exh &lt;- auto.arima(ret, stepwise = FALSE, approximation = FALSE)
arimaorder(exh)
#&gt; p d q
#&gt; 0 0 1
round(c(theta = coef(exh)[["ma1"]], ee = sqrt(exh$var.coef[1, 1])), 4)
#&gt;  theta     ee
#&gt; 0.1326 0.0905

# Promediar deja huella: si la tasa DIARIA fuera una caminata aleatoria, las
# variaciones del promedio mensual de m = 21 dias tendrian esta rho_1
m &lt;- 21
pesos &lt;- c(1:m, (m - 1):1) / m     # peso de cada choque diario en la variacion mensual
rho1 &lt;- sum(pesos[1:(m - 1)] * pesos[(m + 1):(2 * m - 1)]) / sum(pesos^2)
round(c(rho1_inducido = rho1, r1_observado = a[1],
        distancia_ee = (rho1 - a[1]) * sqrt(length(ret))), 3)
#&gt;  rho1_inducido   r1_observado   distancia_ee
#&gt;          0.249          0.105          1.683

# La media no es significativa: el MA(1) CON media (el defecto de arima())
ma1 &lt;- arima(ret, order = c(0, 0, 1), method = "ML")
round(c(theta = coef(ma1)[["ma1"]], media = coef(ma1)[["intercept"]],
        ee_media = sqrt(ma1$var.coef[2, 2])), 4)
#&gt;    theta    media ee_media
#&gt;   0.1262   0.2681   0.3195

# El AICc SI compara con y sin media: son los mismos datos y solo cambia

con &lt;- function(q) arima(ret, order = c(0, 0, q), method = "ML")
sin &lt;- function(q) arima(ret, order = c(0, 0, q), include.mean = FALSE, method = "ML")
round(c(ruido_con_media = aicc(con(0), 137), ruido_sin_media = aicc(sin(0), 137),
        ma1_con_media   = aicc(con(1), 137), ma1_sin_media   = aicc(sin(1), 137)), 3)
#&gt; ruido_con_media ruido_sin_media   ma1_con_media   ma1_sin_media
#&gt;         723.804         722.663         724.046         722.653

# Volatilidad: estructura en los cuadrados?
round(Box.test(ret^2, lag = 12, type = "Ljung-Box")$p.value, 4)
#&gt; [1] 0.9166             &lt;- tampoco</code></pre>

            <p class="text-gray-600 text-sm" style="margin:0;">Situar el AR como el antepasado directo de los métodos

      <p>El módulo cierra el capítulo en tres partes: primero, el puente entre el AR y las redes neuronales y la regla
        para elegir el modelo y fijar sus órdenes; después, el resumen; y al final, la evaluación —autoevaluación,
        ejercicios y una práctica de repaso—.</p>

      <h3>El AR es la idea original</h3>

      <p>Escribe un AR($p$) sin el ruido y verás algo familiar:</p>

      <div class="formula">
        $$\hat y_t = \phi_1 y_{t-1} + \cdots + \phi_p y_{t-p} + c$$
      </div>

      <p>Es exactamente una <strong>neurona lineal</strong> con una ventana de $p$ entradas: los $\phi_j$ son los
        pesos y $c$ es el sesgo. Todo lo que hicieron los métodos secuenciales modernos fue relajar, uno por uno, los
        supuestos que hay detrás de esa expresión.</p>

      <table style="position:relative;">
        <caption class="sr-only">Del modelo AR a los modelos secuenciales modernos</caption>
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">Qué relaja respecto al AR</th>
            <th scope="col">Coste</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>AR($p$)</strong></td>
            <td>—</td>
            <td>Ventana fija, relación lineal</td>
          </tr>
          <tr>
            <td><strong>Red densa con ventana</strong></td>
            <td>La <strong>linealidad</strong>: capas ocultas y activaciones no lineales</td>
            <td>Muchos más parámetros; sin interpretación directa</td>
          </tr>
          <tr>
            <td><strong>RNN / LSTM / GRU</strong></td>
            <td>La <strong>ventana fija</strong>: un estado oculto acumula el pasado y la red aprende cuánto
              recordar y cuánto olvidar</td>
            <td>Entrenamiento secuencial y costoso; necesita muchos datos</td>
          </tr>
          <tr>
            <td><strong>Transformers temporales</strong></td>
            <td>El <strong>decaimiento con la distancia</strong>: la atención puede pesar igual el rezago 1 que el
              rezago 500</td>
            <td>Coste cuadrático en la longitud; aún más datos</td>
          </tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>Un puente concreto.</strong> El estado oculto de una RNN sin activación no lineal y con una sola
          unidad <em>es</em> un AR(1): $h_t = w\,h_{t-1} + u\,x_t$. La condición para que ese estado no explote
          ($|w| < 1$) es la <strong>misma condición de
            estacionariedad</strong> del Módulo 1, y tiene el mismo precio. La derivada de $h_t$ respecto al estado
          de $k$ pasos atrás es $w^k$: con $|w| < 1$ <strong>se desvanece</strong>, y con $|w| > 1$ explota. El
          problema del gradiente que se desvanece en las RNN y el
          desvanecimiento de $\phi^k$ que vimos al desarrollar el AR(1) hacia atrás son el mismo fenómeno
          matemático.</p>
      </div>

      <h3>Cuándo el modelo pequeño sigue ganando</h3>

      <div class="definition">
        <h4><i class="fas fa-scale-balanced mr-2" aria-hidden="true"></i>Razones para quedarse con un ARMA</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Pocos datos.</strong> El caso de este capítulo tiene $T = 100$. Una LSTM con miles de parámetros
            sobre cien observaciones memoriza la muestra; el AR(2) tiene cuatro, contando la media y
            $\sigma^2$.</li>
          <li><strong>Intervalos de pronóstico calibrados.</strong> Un ARMA da intervalos con una teoría detrás (los
            pesos $\psi$ del Módulo 4). Cuantificar bien la incertidumbre en una red exige trabajo adicional que a
            menudo no se hace.</li>
          <li><strong>Interpretabilidad con contenido físico.</strong> El $11.22$ del Módulo 9 no es un peso opaco:
            es un <strong>pseudo-periodo en años</strong> que se puede contrastar con la astronomía. Ninguna capa oculta
            entrega eso.</li>
          <li><strong>Referencia obligatoria.</strong> Aunque vayas a usar una red, el ARMA es el <em>benchmark</em>
            que hay que batir. Un modelo complejo que no supera a un AR(2) no es un modelo complejo: es un modelo
            complejo mal ajustado.</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>Uso crítico de los asistentes de IA.</strong> Un asistente te dará en segundos el código de un
          <code>arima()</code> y una interpretación convincente de la salida. Este capítulo contiene al menos cuatro
          puntos en los que esa interpretación suele estar mal y <strong>tú tienes que verificarlos</strong>: (1) el
          <code>intercept</code> de <code>arima()</code> es la media $\hat\mu$, no la constante $c$; (2) sin
          <code>fitdf = p+q</code>, Ljung–Box aprueba modelos insuficientes —aquí el $p$-valor pasaba de $0.046$ a
          $0.100$—; (3) el AICc no compara modelos con distinto $d$ ni en otra escala —con media o sin ella, sí—; (4) un ARMA que gana por AICc
          puede estar parcheando una escala equivocada. La regla del curso: <strong>el asistente propone, tú
            diagnosticas</strong>.</p>
      </div>

      <h3>Elegir el modelo y fijar sus órdenes</h3>

      <p>La tabla de identificación del Módulo 5 dice qué forma tienen la ACF y la PACF de cada familia. Esta nueva
        tabla la completa con lo que vino después, que es donde se decide el capítulo: de dónde sale el número $p$ o
        $q$, y qué hacer cuando la lectura de los correlogramas no lo da.</p>

      <table style="position:relative;">
        <caption class="sr-only">Criterios para elegir entre AR, MA y ARMA y para fijar los órdenes p y q</caption>

            <th scope="col">Modelo</th>
            <th scope="col">ACF</th>
            <th scope="col">PACF</th>

            <td><strong style="white-space:nowrap;">AR($p$)</strong></td>

            <td><strong>Se corta</strong> en $p$. La teórica no es «pequeña» desde $p+1$: vale <strong>cero

      <div class="warning">
        <p><strong>Las dos primeras filas describen la teoría, no un correlograma.</strong> El corte exacto es una
          propiedad del proceso; lo que se ve es una muestra, y con $T$ moderado las barras posteriores al corte no
          caen a cero sino que revolotean dentro de la banda. Por eso la columna de la derecha dice «entra y
          <em>se queda</em>»: con veinte rezagos se espera que uno se salga por puro azar, y perseguirlo con
          parámetros es el error que este capítulo repite en tres módulos distintos.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-clipboard-check mr-2" aria-hidden="true"></i>Qué confirma el orden elegido</h4>
        <ul style="margin-bottom:0;">
          <li><strong>El coeficiente de mayor orden.</strong> Si $\hat\phi_p$ o $\hat\theta_q$ no es significativo,
            sobra. En el AR(2) final de las manchas, $t = 19.31$ y $t = -9.46$; el $\hat\theta_1$ del ARMA(2,1) sobre
            la serie cruda se sostenía con $t = 2.78$, y desapareció al corregir la escala.</li>
          <li><strong>Ljung–Box sobre los residuales</strong>, con <code>fitdf = p + q</code> y evaluado en
            $h > p+q$. Es la prueba que ve lo que el correlograma barra por barra no ve: ninguna de las veinte
            autocorrelaciones residuales del AR(2) crudo salía de $\pm 0.196$ y aun así la prueba lo rechazaba.</li>
          <li><strong>AICc o BIC</strong>, y solo entre modelos ajustados a los <strong>mismos datos</strong>. AICc si
            el objetivo es pronosticar, BIC si es identificar el proceso.</li>
          <li><strong>Parsimonia ante el empate.</strong> Añadir un parámetro casi siempre mejora la verosimilitud;
            que la mejore no significa que haga falta.</li>
        </ul>
      </div>

      <div class="warning">
        <p><strong>Y una advertencia sobre la rejilla.</strong> Un <span style="white-space:nowrap;">ARMA($2,2$)</span> con $\phi = (1.1,\,-0.28)$ y
          $\theta = (0.1,\,-0.20)$ tiene <strong>exactamente</strong> la misma ACF que el <span style="white-space:nowrap;">ARMA($1,1$)</span> de
          $\phi = 0.7$ y $\theta = 0.5$ —coinciden hasta el último decimal—, porque el factor $(1-0.4B)$ está en los
          dos polinomios y se cancela, como advertían los Módulos 4 y 5. El daño no lo recibe el criterio de información,
          que penaliza al grande y suele acertar, sino la <strong>estimación</strong>: los cuatro coeficientes del
          modelo grande no son identificables, sus errores estándar se disparan y ninguno parece significativo. Si
          una rejilla devuelve un modelo cuyos coeficientes son todos insignificantes a la vez, el sospechoso número
          uno es un factor común.</p>
      </div>

      <h3>Resumen del capítulo</h3>

      <div class="diagram">
        <ol>
          <li>El <strong>operador de rezago</strong> $B$ convierte recursiones en polinomios. Un proceso es
            estacionario si las raíces de $\phi(B)$ caen <strong>fuera</strong> del círculo unitario, e invertible si
            lo hacen las de $\theta(B)$.</li>
          <li>Un <strong>AR($p$)</strong> tiene <strong>PACF que se corta</strong> en $p$ y ACF que decae. Un
            <strong>MA($q$)</strong>, al revés: <strong>ACF que se corta</strong> en $q$. Un <strong>ARMA</strong>
            decae en las dos, y por eso los correlogramas no bastan para fijar sus órdenes.</li>
          <li>Un AR(2) con $\phi_1^2 + 4\phi_2 < 0$ tiene raíces complejas y produce un <strong>pseudo-ciclo</strong>
            de pseudo-periodo $2\pi/\arccos\!\big(\phi_1/(2\sqrt{-\phi_2})\big)$.</li>
          <li>Un ARMA estacionario se puede escribir como MA($\infty$) (pesos $\psi$, respuesta al impulso), y uno
            invertible como AR($\infty$) (pesos $\pi$). Los $\psi$ darán su forma de abanico a los intervalos de
            pronóstico a partir del Capítulo 4.</li>
          <li>La estimación se hace por <strong>Yule–Walker</strong>, <strong>CSS</strong> o <strong>máxima
              verosimilitud</strong>. No dan lo mismo: en las manchas solares, YW y ML se separaron $1.26$ y $1.10$
            errores estándar. CSS y ML coincidieron.</li>
          <li>Se elige con <strong>AICc</strong> o <strong>BIC</strong> —solo entre modelos ajustados a los mismos
            datos— y se valida con <strong>Ljung–Box sobre los residuales</strong>, siempre con
            <code>fitdf = p + q</code>.</li>
          <li>Un criterio de información no distingue "falta dinámica" de "sobra un problema de escala". En las
            manchas solares, el término MA que ganaba sobre la serie cruda <strong>desapareció</strong> al pasar a la
            raíz cuadrada, y el pseudo-periodo se acercó al ciclo solar real.</li>
          <li>A veces la respuesta correcta es que <strong>no hay nada que modelar</strong>: los log-retornos
            mensuales de la TRM son indistinguibles del ruido blanco.</li>
        </ol>
      </div>

      <h3>Ejercicios propuestos</h3>

      <p>Tres ejercicios con pista y solución comentada. Las cifras de cada solución salen de ejecutar el código que
        la acompaña, ninguna está escrita de memoria, y puedes contrastar las tuyas con ellas.</p>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">1.</span>Toma la serie <code>lh</code> de R
          (48 mediciones de hormona luteinizante, una cada 10 minutos). Identifica $(p,q)$ con ACF y PACF, ajusta los
          candidatos razonables y elige uno. ¿Coinciden el AICc y el BIC? Diagnostica el modelo que elijas.</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e1-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e1-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e1-pista" hidden>
          <p style="margin:0;">Con $n = 48$ la banda es ancha: $\pm 0.283$. Fíjate en cuántas barras se salen de
            verdad, y no te fíes de las que están justo en el borde. Y no esperes que los dos criterios te den la
            misma respuesta: <strong>aquí no lo hacen</strong>, y esa discrepancia es el ejercicio. Antes de elegir,
            comprueba si los dos candidatos pasan Ljung–Box.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e1-sol" hidden>
          <p><strong>Respuesta: el AICc elige MA(2) y el BIC elige AR(1), por muy poco, y los dos son
              defendibles.</strong></p>
          <pre><code class="language-r">aicc &lt;- function(f, n) { k &lt;- length(f$coef) + 1; f$aic + 2*k*(k+1)/(n-k-1) }
n &lt;- length(lh)   # 48

round(1.96 / sqrt(n), 4)
#&gt; [1] 0.2829                       banda ancha: solo el rezago 1 se sale

round(acf(lh,  lag.max = 6, plot = FALSE)$acf[-1], 4)
#&gt; [1]  0.5755  0.1818 -0.1448 -0.1748 -0.1497 -0.0210
# pacf()$acf devuelve un array de tres dimensiones y se imprime como tal:
# as.numeric() lo aplana para poder leerlo de un vistazo
round(as.numeric(pacf(lh, lag.max = 6, plot = FALSE)$acf), 4)
#&gt; [1]  0.5755 -0.2234 -0.2269  0.1028 -0.0759  0.0676

# Las dos se cortan aparentemente en el rezago 1: candidatos AR(1) y MA(1),
# y conviene probar algo mas por si acaso.
for (pq in list(c(1,0), c(2,0), c(3,0), c(0,1), c(0,2), c(1,1))) {
  f &lt;- arima(lh, order = c(pq[1], 0, pq[2]), method = "ML")
  cat(sprintf("ARMA(%d,%d)  AICc=%7.3f  BIC=%7.3f  LB(10) p=%.4f\n",
      pq[1], pq[2], aicc(f, n), BIC(f),
      Box.test(residuals(f), lag = 10, type = "Ljung-Box",
               fitdf = sum(pq))$p.value))
}
#&gt; ARMA(1,0)  AICc= 65.304  BIC= 70.372  LB(10) p=0.4050
#&gt; ARMA(2,0)  AICc= 65.434  BIC= 71.989  LB(10) p=0.4185
#&gt; ARMA(3,0)  AICc= 65.613  BIC= 73.541  LB(10) p=0.7958
#&gt; ARMA(0,1)  AICc= 68.649  BIC= 73.717  LB(10) p=0.1962
#&gt; ARMA(0,2)  AICc= 63.991  BIC= 70.545  LB(10) p=0.8492   <- min AICc
#&gt; ARMA(1,1)  AICc= 66.454  BIC= 73.009  LB(10) p=0.3927

# El BIC prefiere el AR(1): 70.372 frente a 70.545. Diferencia de 0.17,
# practicamente un empate.
ar1 &lt;- arima(lh, order = c(1, 0, 0), method = "ML")
round(c(phi = coef(ar1)[["ar1"]], ee = sqrt(ar1$var.coef[1,1]),
        media = coef(ar1)[["intercept"]]), 4)
#&gt;    phi     ee  media
#&gt; 0.5739 0.1161 2.4133

shapiro.test(residuals(ar1))$p.value
#&gt; [1] 0.008348901   <- la normalidad SI se rechaza</code></pre>
          <p><strong>Discusión.</strong> Los dos modelos pasan Ljung–Box con holgura, así que ninguno es
            inadmisible. El AICc prefiere el MA(2) ($63.99$ frente a $65.30$) y el BIC prefiere el AR(1) ($70.37$
            frente a $70.55$, una diferencia de $0.17$ que no distingue nada). Con $n=48$ esta indeterminación es lo
            normal, y la salida razonable es <strong>quedarse con el AR(1)</strong> por parsimonia: un parámetro en
            vez de dos, interpretación directa ($\hat\phi = 0.574$: cada medición conserva el 57 % de la desviación de la anterior respecto a la media) y
            el mismo comportamiento en el diagnóstico. Si el objetivo fuera pronosticar, valdría la pena comparar los
            dos por validación de origen móvil, que es lo que hará el Capítulo 6. Nota final: la normalidad de los
            residuales se rechaza ($p = 0.0083$), un aviso para los intervalos de pronóstico.</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">2.</span>Considera el proceso
          MA(2) con $\theta = (0.6,\ 0.4)$. ¿Es invertible? Calcula su ACF teórica a mano y compárala con
          <code>ARMAacf</code>. ¿Se cumple aquí la cota $|\rho_1| \le 0.5$ del Módulo 3?</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e2-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e2-pista" hidden>
          <p style="margin:0;">Usa la fórmula general de la ACF de un MA($q$) con el convenio $\theta_0 = 1$:
            el numerador de $\rho_k$ es $\sum_{j=0}^{q-k}\theta_j\theta_{j+k}$. Para $k=1$ eso son <em>dos</em>
            sumandos, no uno. Y sobre la última pregunta: relee de dónde salía la cota del Módulo 3 —¿se dedujo para
            un MA cualquiera, o para uno concreto?</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e2-sol" hidden>
          <p><strong>Respuesta: sí es invertible, $\rho_1 = 0.5526$ y $\rho_2 = 0.2632$, y la cota
              <em>no</em> se cumple porque no era aplicable.</strong></p>
          <pre><code class="language-r">theta &lt;- c(0.6, 0.4)

# Invertibilidad: raices de theta(B) = 1 + 0.6B + 0.4B^2
raices &lt;- polyroot(c(1, theta))
round(raices, 4)
#&gt; [1] -0.75+1.3919i -0.75-1.3919i
round(Mod(raices), 4)
#&gt; [1] 1.5811 1.5811        &gt; 1  ->  INVERTIBLE

# ACF a mano, con theta_0 = 1
denominador &lt;- 1 + sum(theta^2)                       # 1 + 0.36 + 0.16 = 1.52
rho1 &lt;- (1 * theta[1] + theta[1] * theta[2]) / denominador   # (0.6 + 0.24)/1.52
rho2 &lt;- (1 * theta[2]) / denominador                          # 0.4/1.52
round(c(rho1 = rho1, rho2 = rho2), 4)
#&gt;   rho1   rho2
#&gt; 0.5526 0.2632

# Contra ARMAacf
round(ARMAacf(ma = theta, lag.max = 4)[-1], 4)
#&gt; [1] 0.5526 0.2632 0.0000 0.0000    <- coinciden, y se corta en q = 2

# Pesos pi: el MA(2) invertible se escribe como AR(infinito) convergente
round(ARMAtoMA(ar = -theta, lag.max = 8), 4)
#&gt; [1] -0.6000 -0.0400  0.2640 -0.1424 -0.0202  0.0691 -0.0334 -0.0076
# oscilan y se desvanecen: es la firma de la invertibilidad</code></pre>
          <p><strong>Sobre la cota.</strong> $\rho_1 = 0.5526 > 0.5$. No hay contradicción: la cota
            $|\rho_1|\le 0.5$ se dedujo <strong>solo para el MA(1)</strong>, maximizando $\theta/(1+\theta^2)$. Con
            $q = 2$ el numerador de $\rho_1$ gana el término extra $\theta_1\theta_2$ y el techo sube. Es un buen
            recordatorio de que una cota vale exactamente en el modelo del que se dedujo: ver $r_1 = 0.55$ descarta
            un MA(1), <strong>no</strong> descarta un MA(2).</p>
        </div>
      </div>

      <div class="ejercicio-guiado">
        <p class="ejercicio-enunciado"><span class="ejercicio-numero">3.</span>El Módulo 9 ajustó un AR(2) a
          $\sqrt{\text{manchas}}$ sobre la ventana 1770–1869. Repite el ajuste sobre la serie completa
          (1700–1988) y sobre 1900–1988. ¿Son estables los coeficientes? ¿Y el pseudo-periodo? ¿Sigue pasando
          el diagnóstico?</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-pista">
            <i class="fas fa-lightbulb" aria-hidden="true"></i> Pista <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c3e3-sol">
            <i class="fas fa-key" aria-hidden="true"></i> Solución <i class="fas fa-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="ejercicio-panel pista" id="c3e3-pista" hidden>
          <p style="margin:0;">Mira <strong>tres</strong> cosas por separado y no las confundas: los coeficientes
            $\hat\phi$, la cantidad derivada de ellos (el periodo) y el diagnóstico. Puede pasar perfectamente que los
            coeficientes apenas se muevan, que el periodo sí lo haga y que el diagnóstico se derrumbe. Antes de
            atribuir un cambio del Ljung–Box al tamaño de la muestra, compara ventanas del mismo tamaño: 1889–1988
            tiene cien años, igual que 1770–1869.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c3e3-sol" hidden>
          <p><strong>Respuesta: los coeficientes son notablemente estables, el periodo se acorta un año y el
              diagnóstico falla en la mayoría de las ventanas de cien años, incluidas todas las que llegan al siglo XX,
              tengan más datos que la de Yule o menos.</strong></p>
          <pre><code class="language-r">for (v in list(c(1770,1869), c(1700,1988), c(1870,1988), c(1900,1988), c(1889,1988))) {
  x &lt;- sqrt(window(sunspot.year, v[1], v[2]))
  f &lt;- arima(x, order = c(2, 0, 0), method = "ML")
  r &lt;- polyroot(c(1, -coef(f)[1:2]))
  cat(sprintf("%d-%d (n=%3d): phi=(%.4f, %.4f)  |raiz|=%.4f  periodo=%6.3f  LB12 p=%.4f\n",
      v[1], v[2], length(x), coef(f)[1], coef(f)[2], Mod(r)[1],
      2*pi/Arg(r[1]),
      Box.test(residuals(f), lag = 12, type = "Ljung-Box", fitdf = 2)$p.value))
}
#&gt; 1770-1869 (n=100): phi=(1.4027, -0.6853)  |raiz|=1.2080  periodo=11.218  LB12 p=0.1644
#&gt; 1700-1988 (n=289): phi=(1.4086, -0.7006)  |raiz|=1.1947  periodo=11.007  LB12 p=0.0000
#&gt; 1870-1988 (n=119): phi=(1.4219, -0.7321)  |raiz|=1.1687  periodo=10.648  LB12 p=0.0007
#&gt; 1900-1988 (n= 89): phi=(1.4146, -0.7556)  |raiz|=1.1504  periodo=10.129  LB12 p=0.0010
#&gt; 1889-1988 (n=100): phi=(1.4101, -0.7431)  |raiz|=1.1600  periodo=10.249  LB12 p=0.0006</code></pre>
          <p><strong>Discusión.</strong> Hay tres lecturas y conviene separarlas:</p>
          <ul>
            <li><strong>Los coeficientes son estables.</strong> $\hat\phi_1$ se mueve entre $1.403$ y $1.422$ y
              $\hat\phi_2$ entre $-0.685$ y $-0.756$, siempre dentro de un error estándar o dos. El AR(2) captura una
              estructura real y persistente, no un artefacto de la ventana de Yule.</li>
            <li><strong>El periodo sí se mueve:</strong> de $11.22$ años (1770–1869) a $10.13$ (1900–1988). Como
              depende de los $\phi$ a través de un arcocoseno, cambios pequeños en $\hat\phi_2$ se amplifican. Es un
              buen ejemplo de que una cantidad derivada puede ser mucho más sensible que los parámetros de los que
              procede. Sobre la serie completa da $11.007$, notablemente cerca del ciclo documentado.</li>
            <li><strong>El diagnóstico se derrumba</strong> en todas las ventanas que llegan al siglo XX: $p = 0.0007$
              en 1870–1988, $p = 0.0010$ en 1900–1988 y por debajo de $0.0001$ en la serie completa. La explicación
              cómoda —con más datos la prueba gana potencia— <strong>aquí no se sostiene</strong>: 1900–1988 tiene
              <em>menos</em> datos que la ventana de Yule ($n = 89$) y rechaza igual, y 1889–1988, con los mismos
              cien años, da $p = 0.0006$. Lo que cambia no es $n$ sino el tramo. De las 190 ventanas de cien años
              que caben entre 1700 y 1988, el AR(2) pasa la prueba en 52, y todas menos una empiezan entre 1734 y
              1785; falla en las otras 138, también en 49 que acaban antes de 1900. La de Yule es una de las favorables; en las que alcanzan el siglo XX el mismo modelo, con
              coeficientes casi iguales, deja autocorrelación sin explicar y no pasa en ninguna.</li>
          </ul>
          <p style="margin-bottom:0;">Moraleja: que un modelo «pase» el diagnóstico en una ventana no dice que lo
            pase en otra, y antes de atribuir un cambio de veredicto al tamaño de la muestra hay que comparar con
            $n$ fijo. No rechazar $H_0$ nunca es lo mismo que aceptarla.</p>
        </div>
      </div>

      <p>Este módulo no añade contenido: es un ensayo. El quiz del <a

        otras nueve, una sola. Cada estudiante recibe una variante distinta de cada pregunta, con sus propias cifras.</p>

      <p>Abajo está un simulacro con esa misma forma. <strong>No son las preguntas del quiz</strong>: es una variante
        aparte, con otros datos, que no se usa en Brightspace. Memorizar sus respuestas no sirve de nada; lo que se
        repite de una variante a otra es la <em>decisión</em> —qué condición hay que comprobar, qué prueba responde a
        qué pregunta, de qué ecuación se despeja— y esa es la que conviene tener automatizada antes de entrar.</p>
