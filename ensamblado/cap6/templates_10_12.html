          <pre><code class="language-python">import numpy as np, json
from statsmodels.tsa.arima.model import ARIMA

nilo = np.asarray(json.load(open("salidas/datos_series.json"))["nilo"]["valores"],
                  dtype=float)

def arima111(tr, h):
    return ARIMA(tr, order=(1, 1, 1)).fit().forecast(h)

def naive(tr, h):   return np.repeat(tr[-1], h)
def media(tr, h):   return np.repeat(tr.mean(), h)
def deriva(tr, h):
    return tr[-1] + np.arange(1, h + 1) * (tr[-1] - tr[0]) / (len(tr) - 1)

metodos = {"arima111": arima111, "naive": naive, "media": media, "deriva": deriva}

# (a) una particion: entrenamiento hasta 1950, prueba 20 anos
tr, te = nilo[:80], nilo[80:]
una = {k: float(np.sqrt(np.mean((te - np.asarray(f(tr, 20), dtype=float)) ** 2)))
       for k, f in metodos.items()}
print({k: round(v, 4) for k, v in sorted(una.items(), key=lambda z: z[1])})
#&gt; {'deriva': 122.2814, 'naive': 123.0624, 'arima111': 125.062, 'media': 133.3132}

# (b) 36 origenes con h = 5
def movil_rmse(f, T0=60, h=5):
    e = [nilo[T:T + h] - np.asarray(f(nilo[:T], h), dtype=float)
         for T in range(T0, len(nilo) - h + 1)]
    return float(np.sqrt(np.mean(np.array(e) ** 2)))

movil = {k: movil_rmse(f) for k, f in metodos.items()}
print({k: round(v, 4) for k, v in sorted(movil.items(), key=lambda z: z[1])})
#&gt; {'arima111': 121.3307, 'media': 132.5134, 'naive': 157.6873, 'deriva': 161.27}

# Diebold-Mariano a mano: statsmodels no lo trae. Las dos normalizaciones
# son lo que hay que acertar: la autocovarianza divide entre n y NO entre
# n - k, y encima va la correccion de Harvey-Leybourne-Newbold.
from scipy import stats

def errores(f, T0=60, h=5):
    return np.array([nilo[T:T + h] - np.asarray(f(nilo[:T], h), dtype=float)
                     for T in range(T0, len(nilo) - h + 1)])

def dm(ea, eb, h):
    d = ea ** 2 - eb ** 2; n = len(d); dbar = d.mean()
    g = [np.sum((d[k:] - dbar) * (d[:n - k] - dbar)) / n for k in range(h)]
    est = dbar / np.sqrt((g[0] + 2 * sum(g[1:])) / n)
    est *= np.sqrt((n + 1 - 2 * h + h * (h - 1) / n) / n)
    return 2 * stats.t.cdf(-abs(est), df=n - 1)

ea, eb = errores(arima111), errores(deriva)
print([round(float(dm(ea[:, h - 1], eb[:, h - 1], h)), 4) for h in (1, 3, 5)])
#&gt; [0.0176, 0.0279, 0.0013]
# R da 0.0278 en el segundo: la diferencia esta en el ajuste del ARIMA, no
# en la prueba. Con la autocovarianza dividida entre n - k, h = 5 daria
# 0.0011 en vez de 0.0013.

# El veredicto se invierte con el mismo codigo y los mismos datos.
print("deriva: puesto", 1, "->", 4)
#&gt; deriva: puesto 1 -> 4</code></pre>

        <p><strong>La última fila es la más importante y la más barata.</strong> Un asistente que escribe
          <code>#&gt; AICc = 1264.60</code> junto a una llamada está prediciendo la salida, no leyéndola, salvo que
          alguien haya ejecutado el código. Al construir este capítulo se escribieron a mano $22$ cifras en los
          comentarios de los bloques; al ejecutarlos, <strong>$11$ estaban mal</strong>, algunas por un factor de dos.
          El material se publica con las $260$ cifras contrastadas contra la salida real por un script
          (<code>precalculo/verifica_bloques_cap6.py</code>), porque la comprobación a ojo no funciona.</p>

      <h3>Lo que sí conviene delegar</h3>

      <p>La conclusión del taller no es desconfiar de todo. Un asistente es rápido y fiable escribiendo el andamiaje
        —recorrer orígenes, montar tablas, dibujar—, traduciendo entre R y Python, y explicando qué hace una función.
        Donde falla es exactamente donde falla un estudiante con prisa: en las decisiones que no dan error y que
        dependen del contexto de los datos. Esas son las que hay que tomar uno mismo, y las que el curso entero ha

      <h3>Guía del proyecto de pronóstico</h3>

      <p>El proyecto pide elegir una serie real, modelarla y pronosticarla. Los seis puntos siguientes son los que
        distinguen un trabajo defendible de uno que solo tiene números.</p>

      <div class="definition">
        <h4><i class="fas fa-clipboard-check mr-2" aria-hidden="true"></i>Seis exigencias del informe</h4>
        <ol style="margin-bottom:0;">
          <li><strong>Fuente y fecha de corte.</strong> De dónde salen los datos, cuándo se descargaron, qué se hizo
            con los huecos. Sin esto el trabajo no es reproducible.</li>
          <li><strong>Al menos un método de referencia.</strong> Naïve estacional si hay estación, naïve si no. Si el
            modelo no le gana, hay que decirlo: es un resultado, no un fracaso.</li>
          <li><strong>La métrica elegida y por qué</strong>, decidida <em>antes</em> de ver los resultados. El MASE
            por defecto; RMSE o MAE si el costo del error lo justifica; MAPE solo si la serie está lejos del cero.</li>
          <li><strong>Evaluación por origen móvil</strong>, con el número de orígenes, el horizonte y la ventana
            declarados. Una sola partición no basta, y el Módulo 10 muestra qué pasa cuando se usa.</li>
          <li><strong>Cobertura del intervalo</strong> al $80\,\%$ <em>y</em> al $95\,\%$. Comprobar solo uno de los
            dos esconde el fallo del naïve estacional del Módulo 9.</li>
          <li><strong>Diagnóstico del modelo final</strong>: Ljung–Box, normalidad, raíces. Y la lista del Módulo 11
            aplicada al propio trabajo.</li>
        </ol>
      </div>

          caso del Módulo 11, y se corrige igual: ejecutando.</p>

          <em>airline</em> contra el naïve estacional con Diebold–Mariano y explica qué añade el contraste.</p>
        <div class="ejercicio-acciones">
          <button type="button" class="ejercicio-boton" aria-expanded="false" aria-controls="c6e1-pista">

        <div class="ejercicio-panel pista" id="c6e1-pista" hidden>
          <p style="margin:0;">Con $n = 72$, $T_0 = 36$ y $h = 12$ salen $25$ orígenes. Usa <code>tsCV</code> con
            <code>initial = 35</code> y quédate solo con las filas completas, o escribe el bucle a mano. Antes de
            interpretar el resultado, fíjate en que la serie tiene solo seis años: el <em>airline</em> gasta
            $d + D\,m = 13$ observaciones en las diferencias, así que en los primeros orígenes está estimando dos
            parámetros con poco más de veinte datos efectivos.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c6e1-sol" hidden>
          <p><strong>Respuesta: no coinciden, y se invierte el podio. La partición única corona al <em>airline</em>
            (RMSE $288.83$) y el origen móvil corona al naïve estacional ($331.33$ frente a $434.92$). Diebold–Mariano
            añade lo que ninguno de los dos órdenes dice: la diferencia no es significativa a ningún horizonte, así
            que lo honesto es quedarse con el método más simple.</strong></p>
          <pre><code class="language-r">library(forecast)
completos &lt;- function(e) e[which(rowSums(!is.na(e)) == ncol(e)), ]

metodos &lt;- list(
  snaive  = function(x, h) snaive(x, h = h),
  airline = function(x, h) forecast(Arima(x, order = c(0,1,1), seasonal = c(0,1,1)), h = h),
  auto    = function(x, h) forecast(auto.arima(x), h = h),
  media   = function(x, h) meanf(x, h = h))

# (a) origen movil: 25 origenes, h = 12
E &lt;- lapply(metodos, function(f) completos(tsCV(USAccDeaths, f, h = 12, initial = 35)))
round(sort(sapply(E, function(e) sqrt(mean(e^2)))), 4)
#&gt;   snaive     auto  airline    media
#&gt; 331.3329 417.3851 434.9200 942.4677

# (b) una sola particion: los ultimos 12 meses
tr &lt;- subset(USAccDeaths, start = 1, end = 60)
te &lt;- as.numeric(USAccDeaths)[61:72]
round(sort(sapply(metodos, function(f)
  sqrt(mean((te - as.numeric(f(tr, 12)$mean))^2)))), 4)
#&gt;  airline     auto   snaive    media
#&gt; 288.8282 288.8282 341.1639 946.1645

# (c) Diebold-Mariano: airline contra el naive estacional
for (h in c(1, 6, 12)) {
  p &lt;- dm.test(E$airline[, h], E$snaive[, h], alternative = "two.sided", h = h, power = 2)
  cat(sprintf("h = %2d  DM = %7.4f  p = %.4f\n", h, p$statistic, p$p.value))
}
#&gt; h =  1  DM =  0.0638  p = 0.9497
#&gt; h =  6  DM =  0.9115  p = 0.3711
#&gt; h = 12  DM =  1.2659  p = 0.2177
# Y a los doce horizontes: el menor p
p12 &lt;- sapply(1:12, function(h)
  dm.test(E$airline[, h], E$snaive[, h], h = h, power = 2)$p.value)
c(h = unname(which.min(p12)), p = round(min(p12), 4))
#&gt;      h      p
#&gt; 7.0000 0.0641

# El MASE de los cuatro, para leerlos en escala comparable
Q &lt;- mean(abs(diff(as.numeric(subset(USAccDeaths, start = 1, end = 36)), lag = 12)))
round(sort(sapply(E, function(e) mean(abs(e)) / Q)), 4)
#&gt; snaive   auto airline  media
#&gt; 0.4004 0.5012  0.5210 1.1517
round(Q, 1)                                        #&gt; [1] 659.9
# La escala sale de 1973-1975 y absorbe la caida de 1974
round(tapply(abs(diff(as.numeric(USAccDeaths), lag = 12)),
             rep(1974:1978, each = 12), mean), 1)
#&gt;  1974  1975  1976  1977  1978
#&gt; 933.2 386.6 334.3 272.6 259.5</code></pre>
          <p><strong>Discusión.</strong> Los tres resultados cuentan la misma historia desde tres ángulos. La partición
            única elige el modelo más complejo con $12$ observaciones; el origen móvil, con $300$, lo pone tercero; y
            el contraste dice que ni siquiera esa segunda ordenación es concluyente: $p$ entre $0.22$ y $0.95$ en los
            tres horizontes contrastados, y ninguno por debajo de $0.05$ en los doce (el menor, $0.064$, a $h = 7$).
            Con una serie de seis años el <em>airline</em> no tiene datos suficientes para que sus dos parámetros
            paguen su costo, y el naïve estacional —que no estima nada— hace el mismo trabajo. Que tres de los cuatro
            MASE queden por debajo de $1$ no dice que la estacionalidad sea fuerte: la escala, $Q = 659.9$, se
            calculó sobre 1973–1975 y absorbe la caída de 1974, cuando la diferencia estacional media fue de $933.2$,
            frente a entre $259.5$ y $386.6$ en los años siguientes. Con esa escala, hasta el naïve estacional sale
            en $0.40$. Lo que sí mide la fuerza de la estacionalidad es la comparación con la media, que la ignora:
            su MASE es casi el triple del naïve estacional ($1.15$ frente a $0.40$). Capturarla es casi todo el
            problema.</p>

          </button>
        </div>
        <div class="ejercicio-panel pista" id="c6e3-pista" hidden>
          <p style="margin:0;">Empieza por el Shapiro–Wilk de los residuales, para saber si el problema —si lo hay—
            está en el supuesto o en otro sitio. Después calcula la cobertura nivel por nivel y resta el nominal: si
            todos los excesos tienen el mismo signo, la explicación es una sola y no cinco. Y compara los anchos medios
            de los dos métodos antes de sacar conclusiones sobre cuál está mejor.</p>
        </div>
        <div class="ejercicio-panel solucion" id="c6e3-sol" hidden>
          <p><strong>Respuesta: no cumplen, y se pasan por arriba en los cinco niveles. La normalidad no es el
            problema (Shapiro $p = 0.7312$): los intervalos son sencillamente demasiado anchos, sobre todo los del
            naïve, cuyo $50\,\%$ nominal cubre en realidad el $79.4\,\%$.</strong></p>
          <pre><code class="language-r">library(forecast)

# 1. El supuesto, antes que nada
round(shapiro.test(residuals(Arima(Nile, order = c(1,1,1))))$p.value, 4)
#&gt; [1] 0.7312     &lt;- la normalidad NO se rechaza

# 2. Cobertura empirica nivel por nivel
cobertura &lt;- function(ajusta, niveles, T0 = 60, h = 5) {
  sapply(niveles, function(nv) {
    dentro &lt;- c()
    for (T in T0:(length(Nile) - h)) {
      fc &lt;- ajusta(subset(Nile, start = 1, end = T), h, nv)
      real &lt;- as.numeric(Nile)[(T + 1):(T + h)]
      dentro &lt;- c(dentro, real &gt;= fc$lower[, 1] &amp; real &lt;= fc$upper[, 1])
    }
    round(100 * mean(dentro), 4)
  })
}
niv &lt;- c(50, 80, 90, 95, 99)
ca &lt;- cobertura(function(tr, h, nv) forecast(Arima(tr, order = c(1,1,1)), h = h, level = nv), niv)
cn &lt;- cobertura(function(tr, h, nv) naive(tr, h = h, level = nv), niv)
rbind(nominal = niv, arima = ca, naive = cn, exceso_arima = ca - niv, exceso_naive = cn - niv)
#&gt;                  [,1]    [,2]    [,3] [,4] [,5]
#&gt; nominal      50.0000 80.0000 90.0000   95   99
#&gt; arima        63.8889 87.7778 97.2222  100  100
#&gt; naive        79.4444 96.1111 99.4444  100  100
#&gt; exceso_arima 13.8889  7.7778  7.2222    5    1
#&gt; exceso_naive 29.4444 16.1111  9.4444    5    1

# 3. El ancho medio del intervalo del 95 %, que es lo que explica el exceso
anchos &lt;- function(ajusta, T0 = 60, h = 5) {
  a &lt;- c()
  for (T in T0:(length(Nile) - h)) {
    fc &lt;- ajusta(subset(Nile, start = 1, end = T), h, 95)
    a &lt;- c(a, fc$upper[, 1] - fc$lower[, 1])
  }
  round(mean(a), 4)
}
c(arima = anchos(function(tr,h,nv) forecast(Arima(tr, order=c(1,1,1)), h=h, level=nv)),
  naive = anchos(function(tr,h,nv) naive(tr, h=h, level=nv)))
#&gt;     arima     naive
#&gt;  631.1552 1138.3547

# 4. De donde sale el ancho: la sigma del primer paso frente al error real,
#    y la cobertura del 50 % horizonte a horizonte
paso1 &lt;- function(ajusta, T0 = 60, h = 5) {
  s &lt;- e1 &lt;- c(); dentro &lt;- NULL
  for (T in T0:(length(Nile) - h)) {
    fc &lt;- ajusta(subset(Nile, start = 1, end = T), h, 50)
    real &lt;- as.numeric(Nile)[(T + 1):(T + h)]
    s  &lt;- c(s, (fc$upper[1, 1] - fc$mean[1]) / qnorm(0.75))
    e1 &lt;- c(e1, real[1] - fc$mean[1])
    dentro &lt;- rbind(dentro, real &gt;= fc$lower[, 1] &amp; real &lt;= fc$upper[, 1])
  }
  round(c(sigma = mean(s), error = sqrt(mean(e1^2)),
          setNames(100 * colMeans(dentro), paste0("h", 1:h))), 1)
}
rbind(arima = paso1(function(tr, h, nv) forecast(Arima(tr, order = c(1,1,1)), h = h, level = nv)),
      naive = paso1(function(tr, h, nv) naive(tr, h = h, level = nv)))
#&gt;       sigma error   h1   h2   h3   h4   h5
#&gt; arima 148.3 112.3 58.3 66.7 66.7 66.7 61.1
#&gt; naive 173.2 136.7 55.6 77.8 86.1 91.7 86.1
x &lt;- as.numeric(Nile)
round(c(d_1872_1930 = sd(diff(x[1:60])), d_1931_1970 = sd(diff(x[60:100]))), 1)
#&gt; d_1872_1930 d_1931_1970
#&gt;       186.9       138.1</code></pre>
          <p><strong>Discusión.</strong> Los excesos son positivos en los cinco niveles y en los dos métodos, así que
            no hay que buscar cinco explicaciones: hay una sola, el ancho. Y el ancho tiene dos partes. La primera
            la comparten los dos métodos: ya a un año, la $\hat\sigma$ que estiman ($148.3$ el ARIMA y $173.2$ el
            naïve, de media) supera el error que cometen de verdad ($112.3$ y $136.7$), porque 1931–1970 fue más
            tranquilo que el periodo con que se entrenan: la desviación típica de los cambios anuales baja de $186.9$
            en 1872–1930 a $138.1$. La segunda es solo del naïve, y crece con el horizonte: su varianza aumenta como
            $\sigma^2 h$ suponiendo que cada año trae un choque nuevo y permanente, y el Nilo no se comporta así —su
            cobertura al $50\,\%$ pasa del $55.6\,\%$ a un año al $91.7\,\%$ a cuatro—. Su ARIMA$(1,1,1)$ tiene
            $\hat\theta = -0.874$, que cancela buena parte de la integración —el hallazgo del Módulo 1 del
            Capítulo 4—; por eso el abanico del ARIMA mide poco más de la mitad ($631.2$ frente a $1138.4$) y su
            cobertura, aunque también excesiva, está mucho más cerca de lo prometido. Al $95\,\%$ los dos cubren el
            $100\,\%$, así que ahí no se distinguen: <strong>es el nivel del $50\,\%$ el que separa a un intervalo
            razonable de uno inservible</strong>, que es exactamente el argumento del Módulo 9 para no comprobar un
            solo nivel. Como los dos cubren el $100\,\%$ al $95\,\%$, su puntaje de Winkler coincide con el ancho
            medio: nunca pagan penalización.</p>
