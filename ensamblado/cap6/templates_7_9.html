      <p>Una partición única produce un número con una varianza enorme. La solución es no quedarse con una: se recorre
        la serie fijando un origen tras otro, se pronostica $h$ pasos desde cada uno con un modelo
        <strong>reajustado con solo el pasado de ese origen</strong>, y se acumulan todos los errores. Es la
        <strong>validación de origen móvil</strong> (<em>rolling-origin validation</em>, también <em>time series
        cross-validation</em>), y es lo que el syllabus del curso contrapone a la validación cruzada estándar.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: origen móvil</h4>
        <p>Sea una serie $y_1,\dots,y_n$, un horizonte $h$ y un primer origen $T_0$. Para cada
          $T = T_0, T_0+1, \dots, n-h$:</p>
        <ol style="margin-bottom:0.6rem;">
          <li>se ajusta el modelo con $y_{a},\dots,y_{T}$;</li>
          <li>se pronostica $\hat y_{T+1\mid T},\dots,\hat y_{T+h\mid T}$;</li>
          <li>se guardan los $h$ errores $e_{T,j} = y_{T+j} - \hat y_{T+j\mid T}$.</li>
        </ol>
        <p style="margin-bottom:0;">Con $a = 1$ la ventana es <strong>expansiva</strong> (<em>expanding</em>): cada
          origen usa todo el pasado. Con $a = T - w + 1$ es <strong>deslizante</strong> (<em>sliding</em>, o
          <em>rolling</em>) de tamaño fijo $w$: los datos más viejos se descartan.</p>
      </div>

      <div class="warning">
        <p><strong>El paso 1 dice «se ajusta», no «se reutiliza».</strong> Estimar los coeficientes una vez con toda la
          serie y luego producir pronósticos desde cada origen es fuga de información del Módulo 6, con otro
          disfraz: el modelo de 1954 estaría usando lo que pasó en 1960. Es la parte cara del procedimiento —hay que
          reajustar tantas veces como orígenes— y la que no se puede saltar.</p>
      </div>

      <h3>El recorrido, paso a paso</h3>

      <p>Sobre AirPassengers con $h = 12$ y primer origen en diciembre de 1954 ($T_0 = 72$) salen
        <strong>$61$ orígenes</strong> y $61 \times 12 = 732$ errores de pronóstico, frente a los $24$ de una partición
        única.</p>

          <pre><code class="language-python">import numpy as np, pandas as pd
from statsmodels.tsa.statespace.sarimax import SARIMAX
from statsmodels.datasets import get_rdataset

ap = get_rdataset("AirPassengers").data["value"].to_numpy(dtype=float)
n, h, T0 = len(ap), 12, 72

# No hay equivalente de tsCV: el bucle se escribe a mano, y eso es bueno
# porque obliga a decidir explicitamente el primer origen y la ventana.
def origen_movil(y, h, T0, ventana=None):
    origenes = range(T0, len(y) - h + 1)
    E = np.full((len(list(origenes)), h), np.nan)
    for i, T in enumerate(range(T0, len(y) - h + 1)):
        desde = 0 if ventana is None else max(0, T - ventana)
        tr = y[desde:T]
        fit = SARIMAX(np.log(tr), order=(0, 1, 1),
                      seasonal_order=(0, 1, 1, 12)).fit(disp=False)
        E[i] = y[T:T + h] - np.exp(fit.get_forecast(h).predicted_mean)
    return E

E = origen_movil(ap, h, T0)
print("origenes:", E.shape[0], "| errores:", E.size)
#&gt; origenes: 61 | errores: 732
print("RMSE global:", round(float(np.sqrt(np.mean(E ** 2))), 4))
#&gt; RMSE global: 18.9165
print("RMSE medio de los origenes:",
      round(float(np.mean(np.sqrt(np.mean(E ** 2, axis=1)))), 4))
#&gt; RMSE medio de los origenes: 16.8133
print("RMSE por h:", np.round(np.sqrt(np.mean(E ** 2, axis=0)), 4))
#&gt; RMSE por h: [10.344  12.8043 16.3777 17.9986 18.3149 19.2904 20.209  20.5708
#&gt;  20.7252 21.8935 21.7144 22.6142]

# R da 18.9154 y 16.8123: una diferencia del 0.006 %, pese a la
# inicializacion difusa del filtro de statsmodels que el Capitulo 5
# documento. Sobre 61 reajustes el efecto se diluye por completo.</code></pre>

      <h3>¿La diferencia es real?</h3>

      <p>El SARIMA tiene un RMSE de $18.92$ y <code>auto.arima</code>, que le sigue, de $20.63$. Con $61$ orígenes que
        además se solapan entre sí, ¿es esa diferencia distinguible del azar? La prueba de
        <strong>Diebold–Mariano</strong> responde exactamente a eso.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: prueba de Diebold–Mariano</h4>
        <p>Sean $e^{(1)}_i$ y $e^{(2)}_i$ los errores de dos métodos sobre los mismos $n$ orígenes al mismo horizonte
          $h$, y una función de pérdida $L$ (aquí $L(e) = e^2$). Sea la diferencia de pérdidas
          $d_i = L(e^{(1)}_i) - L(e^{(2)}_i)$. La hipótesis nula es $H_0: \mathbb{E}[d_i] = 0$ —los dos métodos
          pronostican igual de bien— y el estadístico es</p>
        <p>$$ \text{DM} = \frac{\bar d}{\sqrt{\widehat{\operatorname{Var}}(\bar d)}}, $$</p>
        <p style="margin-bottom:0;">donde la varianza se estima teniendo en cuenta que a horizonte $h$ los $d_i$ están
          autocorrelacionados hasta el orden $h-1$. Un DM negativo favorece al primer método.</p>
      </div>

          ($p = 0.9662$, $0.4245$ y $0.2744$). Son el mismo modelo con distinto nombre.</p>

from scipy import stats

# statsmodels no trae Diebold-Mariano: son ocho lineas, y escribirlas
# obliga a entender la correccion de Harvey-Leybourne-Newbold.
def dm_test(e1, e2, h=1, power=2):
    d = np.abs(e1) ** power - np.abs(e2) ** power
    n = len(d)
    dbar = d.mean()
    # varianza de long-run: autocovarianzas hasta el orden h-1
    gam = [np.sum((d[:n - k] - dbar) * (d[k:] - dbar)) / n for k in range(h)]
    V = (gam[0] + 2 * np.sum(gam[1:])) / n
    dm = dbar / np.sqrt(V)
    # correccion de muestra finita de Harvey, Leybourne y Newbold (1997)
    k = np.sqrt((n + 1 - 2 * h + h * (h - 1) / n) / n)
    dm *= k
    return dm, 2 * stats.t.sf(abs(dm), df=n - 1)

# Con errores simulados con la MISMA estructura que los reales:
rng = np.random.default_rng(2026)
n = 61
comun = rng.normal(0, 20, n)              # el tramo, que afecta a los dos
e1 = comun + rng.normal(0, 6, n)          # metodo 1
e2 = comun + rng.normal(0, 6, n) + 3      # metodo 2, algo peor
dm, p = dm_test(e1, e2, h=12)
print(f"DM = {dm:.4f}  p = {p:.4f}")
#&gt; DM = -2.3888  p = 0.0201

# La leccion del montaje: el termino `comun` es enorme comparado con la
# diferencia entre metodos, y aun asi DM la detecta cuando existe, porque
# trabaja con la DIFERENCIA de perdidas y el termino comun se cancela.
# Comparar dos RMSE por separado no aprovecha ese emparejamiento.
print("RMSE 1:", round(float(np.sqrt(np.mean(e1**2))), 4),
      "| RMSE 2:", round(float(np.sqrt(np.mean(e2**2))), 4))
#&gt; RMSE 1: 20.3007 | RMSE 2: 22.278</code></pre>

      <p>El Capítulo 4 construyó el intervalo de pronóstico y el Capítulo 5 lo dibujó. Ninguno preguntó si un intervalo
        del $95\,\%$ contiene de verdad el valor observado el $95\,\%$ de las veces. Con $61$ orígenes y $732$
        pronósticos, esa pregunta ya se puede contestar contando.</p>

      <div class="definition">
        <h4><i class="fas fa-book mr-2" aria-hidden="true"></i>Definición: cobertura empírica y puntaje de Winkler</h4>
        <p>La <strong>cobertura empírica</strong> (<em>empirical coverage</em>) de un intervalo de nivel nominal
          $100(1-\alpha)\,\%$ es la proporción de veces que el valor observado cayó dentro:
          $$ \widehat{C} = \frac{1}{n}\sum_{i=1}^{n} \mathbb{1}\{\ell_i \le y_i \le u_i\}. $$</p>
        <p>El <strong>puntaje de Winkler</strong> (<em>Winkler score</em>, FPP3 secc. 5.9) penaliza a la vez el ancho
          y el fallo:</p>
        <p style="margin-bottom:0;">$$ W_i = (u_i - \ell_i) + \begin{cases}
            \dfrac{2}{\alpha}(\ell_i - y_i) & \text{si } y_i < \ell_i,\\[4pt]
            0 & \text{si } \ell_i \le y_i \le u_i,\\[4pt]
            \dfrac{2}{\alpha}(y_i - u_i) & \text{si } y_i > u_i.
          \end{cases} $$</p>
      </div>

      <div class="note">
        <p><strong>Por qué hace falta el segundo.</strong> La cobertura sola premia el intervalo $(-\infty, +\infty)$,
          que cubre el $100\,\%$ y no dice nada. El ancho solo premia el intervalo vacío. Winkler los junta: el término
          $2/\alpha$ hace que quedarse fuera cueste $40$ veces la distancia al borde con $\alpha = 0.05$, así que
          estrechar el intervalo solo compensa mientras el valor siga cayendo dentro.</p>
      </div>

winkler &lt;- function(y, li, ls, nivel) {
  a &lt;- 1 - nivel / 100
  (ls - li) + (2 / a) * ((li - y) * (y &lt; li) + (y - ls) * (y &gt; ls))
}

# tsCV solo devuelve errores puntuales: para el intervalo hay que recorrer
# los origenes a mano y guardar tambien las bandas.
evalua_intervalo &lt;- function(y, ajusta, T0 = 72, h = 12) {
  dentro80 &lt;- dentro95 &lt;- w95 &lt;- c()
  for (T in T0:(length(y) - h)) {
    tr &lt;- subset(y, start = 1, end = T)
    fc &lt;- ajusta(tr, h)
    real &lt;- as.numeric(y)[(T + 1):(T + h)]
    dentro80 &lt;- c(dentro80, real &gt;= fc$lower[, 1] &amp; real &lt;= fc$upper[, 1])
    dentro95 &lt;- c(dentro95, real &gt;= fc$lower[, 2] &amp; real &lt;= fc$upper[, 2])
    w95 &lt;- c(w95, winkler(real, fc$lower[, 2], fc$upper[, 2], 95))
  }
  round(c(cob80 = 100 * mean(dentro80), cob95 = 100 * mean(dentro95),
          winkler95 = mean(w95)), 4)
}
